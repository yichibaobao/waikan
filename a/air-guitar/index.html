const DATA = {"sents":[{"kind":"title","en":"Strumming thin air: why grown-ups fly to Finland to play guitars that do not exist","zh":"对着空气扫弦：成年人为什么飞到芬兰，去弹根本不存在的吉他","notes":["strum：用手指或拨片扫弦，弹吉他的典型动作。","thin air：稀薄的空气，常见于 out of thin air（凭空）。这里说“对着空气弹”。","grown-ups：大人、成年人，比 adults 口语。"],"i":0,"p":0,"n":0,"label":"标题"},{"kind":"sub","en":"Every summer, a small city near the Arctic Circle hosts a contest in which the instruments are invisible and the stakes are, by design, very low.","zh":"每年夏天，北极圈附近的一座小城都会举办一场比赛：乐器是隐形的，输赢也被刻意设计得无关紧要。","notes":["host：（城市、国家）举办活动，动词。","in which 引导定语从句，修饰 a contest。","the stakes are low：输赢没什么大不了。by design 插在中间：是故意这样设计的。"],"i":1,"p":0,"n":0,"label":"副标题"},{"kind":"sub","en":"Yet the event takes its silliness very seriously, and that may be the secret of its charm.","zh":"可这个活动对自己的傻气却极其认真，而这也许正是它的魅力所在。","notes":["takes ... seriously：认真对待……。","silliness：傻气、滑稽，形容词 silly 的名词。","the secret of its charm：它魅力的秘诀。"],"i":2,"p":0,"n":0,"label":"副标题"},{"kind":"body","en":"Picture a stage, a roaring crowd and a performer in leather trousers, eyes shut, fingers flying across a guitar that is not there.","zh":"想象一个舞台、一群欢呼的观众，还有一位穿皮裤的表演者：双眼紧闭，手指在一把并不存在的吉他上飞舞。","notes":["Picture ...：想象一下……，祈使句开头，把读者拉进场景。","eyes shut, fingers flying：独立主格结构，补充描写人的状态。","a guitar that is not there：不存在的吉他，全文的笑点。"],"p":1,"i":3,"n":1,"label":"第 1 句"},{"kind":"body","en":"For 60 seconds he leaps, kneels and pulls faces to a song he did not choose, then bows as if he had just played a sold-out stadium.","zh":"整整 60 秒，他跟着一首不是自己选的歌又跳又跪、挤眉弄眼，然后鞠躬谢幕，仿佛刚在座无虚席的体育场开完演唱会。","notes":["leaps, kneels and pulls faces：三个动作并列，节奏很快。","a song he did not choose：比赛曲目是指定的，选手自己不能挑。","as if he had just played ...：仿佛刚刚……，as if 后用过去完成时，表示和事实相反的想象。"],"p":1,"i":4,"n":2,"label":"第 2 句"},{"kind":"body","en":"This is the Air Guitar World Championships, held in Oulu, Finland, since 1996.","zh":"这就是空气吉他世界锦标赛，自 1996 年起在芬兰的奥卢举办。","notes":["held in ...：过去分词短语作定语，= which has been held in ...。","Oulu：奥卢，芬兰北部城市。"],"p":1,"i":5,"n":3,"label":"第 3 句"},{"kind":"body","en":"What began as a joke at a local music festival has grown into an international fixture, with national champions from dozens of countries competing for the title.","zh":"它起初只是当地音乐节上的一个玩笑，如今已成为固定的国际赛事，几十个国家的全国冠军都来争夺这个头衔。","notes":["What began as a joke ...：what 引导主语从句，“当初作为玩笑开始的东西”。","grow into：（逐渐）发展成，之前学过。","with + 名词 + -ing：伴随状况，补充说明比赛规模。"],"p":1,"i":6,"n":4,"label":"第 4 句"},{"kind":"body","en":"The rules are short and strict.","zh":"规则很短，也很严格。","notes":["两个形容词并列，句子短，读起来干脆，呼应“规则简短”。"],"p":2,"i":7,"n":5,"label":"第 5 句"},{"kind":"body","en":"Contestants may not touch a real instrument, nor may they rely on backing musicians; the guitar must be entirely imaginary.","zh":"选手不许碰真乐器，也不许靠伴奏乐手；吉他必须完全是想象出来的。","notes":["nor may they ...：也不可以……。nor 放句首要倒装：助动词 may 提到主语 they 前面。","rely on：依靠、依赖。","imaginary：想象中的、虚构的。"],"p":2,"i":8,"n":6,"label":"第 6 句"},{"kind":"body","en":"Judges score each performance on technical skill, stage presence and a hard-to-define quality the organisers call 'airness'.","zh":"评委按技术、台风，以及一种主办方称为“空气感”、很难说清的特质给每场表演打分。","notes":["score ... on ...：按……打分。","stage presence：台风、舞台魅力。","a hard-to-define quality：用连字符把短语变成形容词，“难以定义的特质”。"],"p":2,"i":9,"n":7,"label":"第 7 句"},{"kind":"body","en":"A good air guitarist, in other words, must convince the audience that the music is coming from his fingers, not the speakers.","zh":"换句话说，一位优秀的空气吉他手必须让观众相信：音乐来自他的手指，而不是音箱。","notes":["in other words：换句话说，插在主语和谓语之间。","convince sb that ...：让某人相信……。"],"p":2,"i":10,"n":8,"label":"第 8 句"},{"kind":"body","en":"Mistakes are allowed, but only if they are made with conviction.","zh":"犯错是允许的，但前提是错得理直气壮。","notes":["only if：只有在……的情况下。","with conviction：满怀信念地、理直气壮地。"],"p":2,"i":11,"n":9,"label":"第 9 句"},{"kind":"body","en":"To outsiders, it can look like an elaborate excuse to dress up and show off.","zh":"在外人看来，这可能像是一个煞费苦心的借口，好让人盛装打扮、尽情炫耀。","notes":["To outsiders：在外人看来。","elaborate：精心的、复杂的。","dress up：打扮、穿上特别的衣服；show off：炫耀。"],"p":3,"i":12,"n":10,"label":"第 10 句"},{"kind":"body","en":"Competitors beg to differ.","zh":"选手们可不这么认为。","notes":["beg to differ：恕我不能同意，礼貌而带点调侃的反对。"],"p":3,"i":13,"n":11,"label":"第 11 句"},{"kind":"body","en":"Many have practised for months in front of a mirror, studying the moves of rock legends frame by frame.","zh":"很多人对着镜子练了好几个月，一帧一帧地研究摇滚传奇们的动作。","notes":["practise：英式拼法，动词；美式写 practice。","studying ...：伴随动作。","frame by frame：一帧一帧地。"],"p":3,"i":14,"n":12,"label":"第 12 句"},{"kind":"body","en":"Some insist that air guitar is a genuine art form, one that demands timing, stamina and a total lack of embarrassment.","zh":"有些人坚称空气吉他是一门真正的艺术，它需要节奏感、体力，还要完全不怕难为情。","notes":["insist that ...：坚持说、坚称。","one that ...：= an art form that ...，用 one 避免重复。","a total lack of embarrassment：完全没有尴尬感，幽默的说法。"],"p":3,"i":15,"n":13,"label":"第 13 句"},{"kind":"body","en":"After a single minute on stage, several admit, they are as out of breath as any athlete.","zh":"好几位选手承认，在台上只待一分钟，他们就累得和运动员一样上气不接下气。","notes":["several admit 插在句中，相当于 several admit that ...。","as ... as any athlete：不亚于任何运动员。","out of breath：喘不过气。"],"p":3,"i":16,"n":14,"label":"第 14 句"},{"kind":"body","en":"The festival also wears a cheerful philosophy on its sleeve.","zh":"这个节日还毫不掩饰地亮出一套乐呵呵的哲学。","notes":["wear sth on one's sleeve：把……挂在袖子上，引申为毫不掩饰（感情、立场）。"],"p":4,"i":17,"n":15,"label":"第 15 句"},{"kind":"body","en":"Its organisers like to joke that you cannot hold a weapon while playing air guitar, so if everyone took it up, wars might simply stop.","zh":"主办方爱开玩笑说：弹空气吉他的时候没法拿武器，所以如果人人都玩起来，战争说不定就停了。","notes":["joke that ...：开玩笑说。","if everyone took it up, wars might ...：虚拟语气，对现在的假设，用过去式。","take up：开始（一项爱好、运动）。"],"p":4,"i":18,"n":16,"label":"第 16 句"},{"kind":"body","en":"Nobody pretends this is a serious peace plan, but the slogan captures the spirit of the thing: harmless, generous and slightly absurd.","zh":"没人假装这是认真的和平方案，但这句口号抓住了这项活动的精髓：无害、大方，还有点荒唐。","notes":["pretend (that) ...：假装。","capture the spirit of：抓住……的精神、精髓。","冒号后用三个形容词概括。"],"p":4,"i":19,"n":17,"label":"第 17 句"},{"kind":"body","en":"There is something refreshing about a contest in which no one can be accused of having an unfair advantage.","zh":"一场谁也不会被指责占了不公平优势的比赛，自有一种让人耳目一新的地方。","notes":["There is something + 形容词 + about ...：……有种……的感觉。","be accused of doing：被指责做了……。","an unfair advantage：不公平的优势。"],"p":5,"i":20,"n":18,"label":"第 18 句"},{"kind":"body","en":"No expensive equipment is needed, and a child with enough nerve can, in principle, beat a professional musician.","zh":"不需要昂贵的设备，一个胆子够大的孩子，理论上也能打败专业音乐人。","notes":["nerve：胆量、勇气。","in principle：理论上、原则上，插在情态动词和动词之间。"],"p":5,"i":21,"n":19,"label":"第 19 句"},{"kind":"body","en":"In an age when so much of life is measured, ranked and sold, a world title for doing nothing at all is a small act of rebellion.","zh":"在一个生活里太多东西都要被衡量、排名、拿来卖钱的时代，一项“什么都不做”的世界冠军，算是一种小小的反叛。","notes":["In an age when ...：在……的时代，when 引导定语从句修饰 age。","measured, ranked and sold：三个过去分词并列。","an act of rebellion：一种反叛行为。"],"p":5,"i":22,"n":20,"label":"第 20 句"},{"kind":"body","en":"And unlike most championships, this one leaves its fans with nothing worse than a sore throat.","zh":"而且和大多数锦标赛不同，这一场留给粉丝的，最糟也不过是喊哑了的嗓子。","notes":["leave sb with sth：给某人留下……。","nothing worse than：最糟也不过是。","a sore throat：喉咙痛。"],"p":5,"i":23,"n":21,"label":"第 21 句"},{"kind":"body","en":"The guitars may be imaginary; the joy, judging by the crowds, is anything but.","zh":"吉他也许是想象出来的；可从观众的热情来看，那份快乐绝不是假的。","notes":["分号前后对比：吉他是虚的，快乐是真的。","judging by ...：从……来判断，插在句中。","anything but：绝不是。is anything but (imaginary)，省略了重复的 imaginary。"],"p":5,"i":24,"n":22,"label":"第 22 句"}],"vocab":[{"id":1,"expr":"strum","zh":"（用手指）扫弦、弹拨","m":["Strumming"],"note":"吉他、尤克里里的弹法：strum a guitar。也可以说手指无聊地敲：strum on the table。","core":"strum","forms":["strum","strums","strummed","strumming"],"syn":[],"ex":[{"en":"He sat on the steps, [[strumming]] an old guitar.","zh":"他坐在台阶上，拨着一把旧吉他。"},{"en":"She [[strummed]] a few chords and began to sing.","zh":"她扫了几个和弦，开始唱歌。"}],"ctx":"Strumming thin air: why grown-ups fly to Finland to play guitars that do not exist"},{"id":2,"expr":"thin air","zh":"稀薄的空气；空无一物","m":["thin air"],"note":"最常见的搭配：out of thin air（凭空、无中生有），vanish into thin air（消失得无影无踪）。","core":"thin air","forms":["thin air"],"syn":[],"ex":[{"en":"The money seemed to appear out of [[thin air]].","zh":"那笔钱好像是凭空冒出来的。"},{"en":"My keys can't just vanish into [[thin air]]!","zh":"我的钥匙不可能凭空消失吧！"}],"ctx":"Strumming thin air: why grown-ups fly to Finland to play guitars that do not exist"},{"id":3,"expr":"host (verb)","zh":"主办、举办","m":["hosts"],"note":"城市、国家、机构举办活动：host the Olympics。名词 host 是主人、主持人。","core":"host","forms":["host","hosts","hosted","hosting"],"syn":[],"ex":[{"en":"Paris [[hosted]] the Olympic Games in 2024.","zh":"巴黎在 2024 年举办了奥运会。"},{"en":"Our school [[hosts]] a book fair every spring.","zh":"我们学校每年春天办一次书展。"}],"ctx":"Every summer, a small city near the Arctic Circle hosts a contest in which the instruments are invisible and the stakes are, by design, very low."},{"id":4,"expr":"by design","zh":"故意地、有意为之","m":["by design"],"note":"反义是 by accident / by chance（偶然）。Was it by accident or by design?（是偶然还是故意的？）","core":"by design","forms":["by design"],"syn":[],"ex":[{"en":"The café is small [[by design]]; the owner wants it to feel cosy.","zh":"这家咖啡馆小是故意的，老板想让它显得温馨。"},{"en":"Whether [[by design]] or by accident, the plan worked.","zh":"不管是有意还是偶然，这个计划奏效了。"}],"ctx":"Every summer, a small city near the Arctic Circle hosts a contest in which the instruments are invisible and the stakes are, by design, very low."},{"id":5,"expr":"stakes","zh":"（成败的）利害、赌注","m":["stakes"],"note":"常用复数：the stakes are high（事关重大）/ low（无关紧要）。high-stakes exam：决定命运的考试。","core":"stakes","forms":["stakes","stake"],"syn":[],"ex":[{"en":"With the final exam next week, the [[stakes]] are high.","zh":"下周就期末考了，事关重大。"},{"en":"It's just a friendly game, so the [[stakes]] are low.","zh":"只是友谊赛，输赢无所谓。"}],"ctx":"Every summer, a small city near the Arctic Circle hosts a contest in which the instruments are invisible and the stakes are, by design, very low."},{"id":6,"expr":"charm","zh":"魅力、吸引力","m":["charm"],"note":"可数时也指护身符、小挂件。形容词 charming（迷人的）。part of the charm：魅力的一部分。","core":"charm","forms":["charm","charms"],"syn":[],"ex":[{"en":"The old town has a quiet [[charm]].","zh":"老城有一种安静的魅力。"},{"en":"The tiny kitchen is part of the flat's [[charm]].","zh":"小小的厨房也是这套公寓的魅力之一。"}],"ctx":"Yet the event takes its silliness very seriously, and that may be the secret of its charm."},{"id":7,"expr":"roaring","zh":"轰鸣的、喧闹的；（生意）兴隆的","m":["roaring"],"note":"roar 是咆哮、轰鸣。a roaring crowd（欢声雷动的人群），a roaring fire（熊熊炉火），a roaring success（巨大成功）。","core":"roaring","forms":["roaring","roar","roared","roars"],"syn":[],"ex":[{"en":"We sat by a [[roaring]] fire and drank cocoa.","zh":"我们坐在熊熊的炉火边喝可可。"},{"en":"The show was a [[roaring]] success.","zh":"演出大获成功。"}],"ctx":"Picture a stage, a roaring crowd and a performer in leather trousers, eyes shut, fingers flying across a guitar that is not there."},{"id":8,"expr":"leap","zh":"跳、跃","m":["leaps"],"note":"比 jump 更书面、更有力。过去式 leapt 或 leaped。leap at the chance（抓住机会）。","core":"leap","forms":["leap","leaps","leapt","leaped","leaping"],"syn":[],"ex":[{"en":"The cat [[leapt]] onto the table.","zh":"猫一下跳上了桌子。"},{"en":"She [[leaps]] out of bed the moment the alarm rings.","zh":"闹钟一响她就从床上蹦起来。"}],"ctx":"For 60 seconds he leaps, kneels and pulls faces to a song he did not choose, then bows as if he had just played a sold-out stadium."},{"id":9,"expr":"pull faces","zh":"做鬼脸","m":["pulls faces"],"note":"英式说法，美式多说 make faces。pull a face 也可以表示“露出不情愿的表情”。","core":"pull faces","forms":["pull faces","pulls faces","pulled faces","pulling faces","pull a face","pulled a face"],"syn":[],"ex":[{"en":"The kids [[pulled faces]] at the camera.","zh":"孩子们对着镜头做鬼脸。"},{"en":"He [[pulled a face]] when he tasted the medicine.","zh":"他一尝那药就皱起了脸。"}],"ctx":"For 60 seconds he leaps, kneels and pulls faces to a song he did not choose, then bows as if he had just played a sold-out stadium."},{"id":10,"expr":"as if + 过去完成时","zh":"仿佛、好像（与事实相反）","m":["as if"],"note":"as if 后面用过去时或过去完成时，表示“其实并不是这样”：He talks as if he knew everything.（他说话好像什么都知道，其实不然）。说过去的事用 had done。","core":"as if","forms":["as if","as though"],"syn":[],"ex":[{"en":"She looked at me [[as if]] I had said something rude.","zh":"她看着我，好像我说了什么失礼的话。"},{"en":"He acts [[as if]] he were the boss.","zh":"他表现得好像他是老板似的。"}],"kind":"grammar","conn":"主句 + as if + 主语 + 过去时 / 过去完成时（与事实相反）","pick":[{"q":"He talked about Paris as if he ___ there many times, but he never had.","opts":["had been","has been"],"a":0,"why":"其实他没去过，是和过去事实相反的想象，as if 后用过去完成时 had been。"},{"q":"She was so calm, ___ nothing had happened.","opts":["as if","even if"],"a":0,"why":"“好像什么都没发生”用 as if；even if 是“即使”，意思不对。"}],"ctx":"For 60 seconds he leaps, kneels and pulls faces to a song he did not choose, then bows as if he had just played a sold-out stadium."},{"id":11,"expr":"fixture","zh":"固定节目、常设活动；固定装置","m":["fixture"],"note":"a fixture of / on the calendar：日程上雷打不动的活动。也指人：He is a fixture at the café（他是这家店的常客）。","core":"fixture","forms":["fixture","fixtures"],"syn":[],"ex":[{"en":"The Christmas market is a [[fixture]] of the city's winter.","zh":"圣诞市集是这座城市冬天的固定节目。"},{"en":"The old man became a [[fixture]] in the park.","zh":"那位老人成了公园里的老面孔。"}],"ctx":"What began as a joke at a local music festival has grown into an international fixture, with national champions from dozens of countries competing for the title."},{"id":12,"expr":"compete for","zh":"争夺、为……而竞争","m":["competing for"],"note":"compete for + 目标（title, prize, jobs），compete with / against + 对手，compete in + 比赛。","core":"compete for","forms":["compete for","competes for","competed for","competing for"],"syn":[],"ex":[{"en":"Ten teams will [[compete for]] the cup.","zh":"十支队伍将争夺奖杯。"},{"en":"Shops are [[competing for]] fewer customers.","zh":"商店在争抢越来越少的顾客。"}],"ctx":"What began as a joke at a local music festival has grown into an international fixture, with national champions from dozens of countries competing for the title."},{"id":13,"expr":"nor + 助动词 + 主语（倒装）","zh":"也不……","m":["nor may they"],"note":"前面已经是否定句，接着说“也不……”，用 nor，后面要倒装：助动词 / be / 情态动词放到主语前。I can't swim, nor can my brother.（我不会游泳，我弟弟也不会）。口语里常用 neither 代替。","core":"nor","forms":["nor","neither"],"syn":[],"ex":[{"en":"I don't like coffee, [[nor]] does my sister.","zh":"我不喜欢咖啡，我姐姐也不喜欢。"},{"en":"He never called, [[nor]] did he write.","zh":"他从没打过电话，也没写过信。"}],"kind":"grammar","conn":"否定句, nor + 助动词 / be / 情态动词 + 主语 + ...","pick":[{"q":"She didn't come to the party, nor ___ a message.","opts":["did she send","she sent"],"a":0,"why":"nor 开头要倒装，助动词 did 放到主语 she 前：nor did she send。"},{"q":"I can't drive, ___ can my husband.","opts":["nor","so"],"a":0,"why":"前面是否定，“也不会”用 nor；so can my husband 是“他也会”，用在肯定句后。"}],"ctx":"Contestants may not touch a real instrument, nor may they rely on backing musicians; the guitar must be entirely imaginary."},{"id":14,"expr":"rely on","zh":"依靠、依赖","m":["rely on"],"note":"rely on sb / sth (to do)。名词 reliance，形容词 reliable（可靠的）。比之前学的 count on 正式一点。","core":"rely on","forms":["rely on","relies on","relied on","relying on"],"syn":[],"ex":[{"en":"Many villages [[rely on]] tourism.","zh":"很多村子靠旅游业为生。"},{"en":"You can [[rely on]] her to keep a secret.","zh":"你可以放心她会保守秘密。"}],"ctx":"Contestants may not touch a real instrument, nor may they rely on backing musicians; the guitar must be entirely imaginary."},{"id":15,"expr":"imaginary","zh":"想象中的、虚构的","m":["imaginary"],"note":"注意和 imaginative（富有想象力的）区分：an imaginary friend（想象出来的朋友），an imaginative child（想象力丰富的孩子）。","core":"imaginary","forms":["imaginary"],"syn":[],"ex":[{"en":"As a child she had an [[imaginary]] friend called Bo.","zh":"她小时候有个叫 Bo 的想象中的朋友。"},{"en":"The line between the two countries is [[imaginary]]; there is no fence.","zh":"两国之间的界线只是想象中的，并没有围栏。"}],"ctx":"Contestants may not touch a real instrument, nor may they rely on backing musicians; the guitar must be entirely imaginary."},{"id":16,"expr":"stage presence","zh":"台风、舞台魅力","m":["stage presence"],"note":"presence 本身也有“气场、风度”的意思：She has real presence.（她很有气场）。","core":"stage presence","forms":["stage presence","presence"],"syn":[],"ex":[{"en":"The young singer has great [[stage presence]].","zh":"那位年轻歌手台风很好。"},{"en":"Good teachers need a bit of [[stage presence]] too.","zh":"好老师也需要一点台风。"}],"ctx":"Judges score each performance on technical skill, stage presence and a hard-to-define quality the organisers call 'airness'."},{"id":17,"expr":"in other words","zh":"换句话说、也就是说","m":["in other words"],"note":"用来换个说法解释前面的话，常放句首或插在句中。","core":"in other words","forms":["in other words"],"syn":[],"ex":[{"en":"He's between jobs; [[in other words]], he's unemployed.","zh":"他正处在两份工作之间，换句话说，他失业了。"},{"en":"[[In other words]], we need more time.","zh":"也就是说，我们需要更多时间。"}],"ctx":"A good air guitarist, in other words, must convince the audience that the music is coming from his fingers, not the speakers."},{"id":18,"expr":"convince","zh":"使相信、说服","m":["convince"],"note":"convince sb that ... / of sth：让人相信。convince sb to do：说服某人去做（英式也用 persuade）。形容词 convincing（令人信服的）。","core":"convince","forms":["convince","convinces","convinced","convincing"],"syn":[],"ex":[{"en":"She [[convinced]] me that the plan would work.","zh":"她让我相信这个计划行得通。"},{"en":"It took hours to [[convince]] him to see a doctor.","zh":"花了好几个小时才说服他去看医生。"}],"ctx":"A good air guitarist, in other words, must convince the audience that the music is coming from his fingers, not the speakers."},{"id":19,"expr":"with conviction","zh":"满怀信念地、坚定地","m":["with conviction"],"note":"conviction 是坚定的信念；也有“定罪”的意思（法律用语）。speak with conviction：说得斩钉截铁。","core":"with conviction","forms":["with conviction"],"syn":[],"ex":[{"en":"She spoke [[with conviction]] about her plans.","zh":"她坚定地谈起自己的计划。"},{"en":"Even wrong notes sound fine if you play them [[with conviction]].","zh":"就算弹错音，只要弹得自信也挺好听。"}],"ctx":"Mistakes are allowed, but only if they are made with conviction."},{"id":20,"expr":"elaborate (adj.)","zh":"精心制作的、复杂的","m":["elaborate"],"note":"形容词读 /ɪˈlæbərət/；作动词“详细说明”读 /ɪˈlæbəreɪt/：Could you elaborate?（能详细说说吗？）","core":"elaborate","forms":["elaborate"],"syn":[],"ex":[{"en":"They made an [[elaborate]] cake for the wedding.","zh":"他们为婚礼做了一个精致的蛋糕。"},{"en":"He gave an [[elaborate]] excuse for being late.","zh":"他为迟到编了一套复杂的借口。"}],"ctx":"To outsiders, it can look like an elaborate excuse to dress up and show off."},{"id":21,"expr":"dress up","zh":"打扮、盛装；乔装","m":["dress up"],"note":"dress up for a party（为聚会打扮），dress up as a pirate（扮成海盗）。","core":"dress up","forms":["dress up","dresses up","dressed up","dressing up"],"syn":[],"ex":[{"en":"Do I need to [[dress up]] for dinner tonight?","zh":"今晚吃饭需要穿得正式点吗？"},{"en":"The children [[dressed up]] as animals.","zh":"孩子们扮成了各种动物。"}],"ctx":"To outsiders, it can look like an elaborate excuse to dress up and show off."},{"id":22,"expr":"show off","zh":"炫耀、卖弄","m":["show off"],"note":"show off + 东西：炫耀……（show off his new car）。名词 a show-off：爱显摆的人。","core":"show off","forms":["show off","shows off","showed off","showing off","show-off"],"syn":[],"ex":[{"en":"He loves to [[show off]] his new car.","zh":"他很爱炫耀他的新车。"},{"en":"Stop [[showing off]] and just finish your food.","zh":"别显摆了，好好把饭吃完。"}],"ctx":"To outsiders, it can look like an elaborate excuse to dress up and show off."},{"id":23,"expr":"beg to differ","zh":"恕难苟同、我不这么认为","m":["beg to differ"],"note":"礼貌地表示反对，常带幽默：I beg to differ.（我不敢苟同。）","core":"beg to differ","forms":["beg to differ","begs to differ","begged to differ"],"syn":[],"ex":[{"en":"You say it's too cold to swim? I [[beg to differ]].","zh":"你说太冷不能游泳？我可不这么觉得。"},{"en":"Critics hated the film, but audiences [[begged to differ]].","zh":"影评人讨厌这部电影，观众却不这么看。"}],"ctx":"Competitors beg to differ."},{"id":24,"expr":"frame by frame","zh":"一帧一帧地；逐步细致地","m":["frame by frame"],"note":"frame 是电影、视频的一帧。类似结构：step by step（一步一步）、day by day（一天天）。","core":"frame by frame","forms":["frame by frame"],"syn":[],"ex":[{"en":"The coach watched the race video [[frame by frame]].","zh":"教练一帧一帧地看比赛录像。"},{"en":"We went through the problem [[frame by frame]].","zh":"我们把这个问题一点一点地过了一遍。"}],"ctx":"Many have practised for months in front of a mirror, studying the moves of rock legends frame by frame."},{"id":25,"expr":"insist","zh":"坚持（说）、坚决要求","m":["insist"],"note":"insist that + 句子（坚称），insist on + 名词 / doing（坚持要）：She insisted on paying.（她坚持要付钱）。","core":"insist","forms":["insist","insists","insisted","insisting"],"syn":[],"ex":[{"en":"He [[insists]] that he saw a ghost.","zh":"他坚称自己见过鬼。"},{"en":"My mother [[insisted]] on driving me to the station.","zh":"我妈坚持要开车送我去车站。"}],"ctx":"Some insist that air guitar is a genuine art form, one that demands timing, stamina and a total lack of embarrassment."},{"id":26,"expr":"stamina","zh":"耐力、体力","m":["stamina"],"note":"不可数。build up stamina（增强耐力）。","core":"stamina","forms":["stamina"],"syn":[],"ex":[{"en":"Marathon runners need a lot of [[stamina]].","zh":"跑马拉松需要很好的耐力。"},{"en":"I don't have the [[stamina]] to shop all day.","zh":"我没那个体力逛一整天街。"}],"ctx":"Some insist that air guitar is a genuine art form, one that demands timing, stamina and a total lack of embarrassment."},{"id":27,"expr":"out of breath","zh":"上气不接下气、气喘吁吁","m":["out of breath"],"note":"be / get out of breath。反过来 catch one's breath（喘口气）。","core":"out of breath","forms":["out of breath"],"syn":[],"ex":[{"en":"I was [[out of breath]] after climbing the stairs.","zh":"爬完楼梯我喘得不行。"},{"en":"She arrived [[out of breath]] but on time.","zh":"她气喘吁吁地赶到，好在没迟到。"}],"ctx":"After a single minute on stage, several admit, they are as out of breath as any athlete."},{"id":28,"expr":"wear sth on one's sleeve","zh":"毫不掩饰（情感、立场）","m":["on its sleeve"],"note":"最常见：wear your heart on your sleeve（喜怒形于色、不掩饰感情）。sleeve 是袖子。","core":"on one's sleeve","forms":["on one's sleeve","on its sleeve","on his sleeve","on her sleeve","on their sleeve","on your sleeve","on my sleeve"],"syn":[],"ex":[{"en":"He wears his heart [[on his sleeve]].","zh":"他喜怒全写在脸上。"},{"en":"The band wears its politics [[on its sleeve]].","zh":"这支乐队毫不掩饰自己的政治立场。"}],"ctx":"The festival also wears a cheerful philosophy on its sleeve."},{"id":29,"expr":"take up","zh":"开始从事（爱好、运动）；占用","m":["took it up"],"note":"take up a hobby / yoga / the piano。另一个意思是占用：take up space / time。","core":"take up","forms":["take up","takes up","took up","taken up","taking up","take it up","took it up"],"syn":[],"ex":[{"en":"She [[took up]] painting after she retired.","zh":"她退休后开始画画。"},{"en":"This sofa [[takes up]] half the room.","zh":"这张沙发占了半个房间。"}],"ctx":"Its organisers like to joke that you cannot hold a weapon while playing air guitar, so if everyone took it up, wars might simply stop."},{"id":30,"expr":"capture","zh":"捕捉、抓住（精髓、注意力）；俘获","m":["captures"],"note":"capture the spirit / mood（抓住精神 / 氛围），capture attention（吸引注意）。也指拍下画面：capture a moment。","core":"capture","forms":["capture","captures","captured","capturing"],"syn":[],"ex":[{"en":"The photo [[captures]] the joy of the moment.","zh":"这张照片捕捉到了那一刻的喜悦。"},{"en":"The song [[captured]] the mood of the summer.","zh":"这首歌唱出了那个夏天的氛围。"}],"ctx":"Nobody pretends this is a serious peace plan, but the slogan captures the spirit of the thing: harmless, generous and slightly absurd."},{"id":31,"expr":"harmless","zh":"无害的、无恶意的","m":["harmless"],"note":"harm（伤害）+ -less（没有）。a harmless joke（无伤大雅的玩笑）。反义 harmful。","core":"harmless","forms":["harmless"],"syn":[],"ex":[{"en":"Most spiders are [[harmless]].","zh":"大多数蜘蛛是无害的。"},{"en":"It was just a [[harmless]] joke.","zh":"那只是个无伤大雅的玩笑。"}],"ctx":"Nobody pretends this is a serious peace plan, but the slogan captures the spirit of the thing: harmless, generous and slightly absurd."},{"id":32,"expr":"absurd","zh":"荒唐的、荒谬可笑的","m":["absurd"],"note":"比 silly 更强，常带“不合常理”的意思。名词 absurdity。","core":"absurd","forms":["absurd"],"syn":[],"ex":[{"en":"It's [[absurd]] to pay that much for a sandwich.","zh":"一个三明治卖那么贵，太离谱了。"},{"en":"The idea sounded [[absurd]] at first.","zh":"这个主意一开始听起来很荒唐。"}],"ctx":"Nobody pretends this is a serious peace plan, but the slogan captures the spirit of the thing: harmless, generous and slightly absurd."},{"id":33,"expr":"refreshing","zh":"令人耳目一新的；提神的","m":["refreshing"],"note":"refreshing honesty（难得的坦诚），a refreshing drink（清爽的饮料）。","core":"refreshing","forms":["refreshing"],"syn":[],"ex":[{"en":"It's [[refreshing]] to meet someone so honest.","zh":"遇到这么坦诚的人，真让人耳目一新。"},{"en":"A cold glass of lemonade is very [[refreshing]].","zh":"一杯冰柠檬水很解渴提神。"}],"ctx":"There is something refreshing about a contest in which no one can be accused of having an unfair advantage."},{"id":34,"expr":"be accused of","zh":"被指责、被指控（做了……）","m":["accused of"],"note":"accuse sb of (doing) sth：指责某人……。注意介词用 of，不是 for。名词 accusation。","core":"accused of","forms":["accused of","accuse of","accuses of","accusing of"],"syn":[],"ex":[{"en":"He was [[accused of]] cheating in the exam.","zh":"他被指控考试作弊。"},{"en":"The company was [[accused of]] hiding the truth.","zh":"这家公司被指责隐瞒真相。"}],"ctx":"There is something refreshing about a contest in which no one can be accused of having an unfair advantage."},{"id":35,"expr":"unfair advantage","zh":"不公平的优势","m":["unfair advantage"],"note":"have / gain / give sb an unfair advantage。have an advantage over sb：比某人有优势。","core":"unfair advantage","forms":["unfair advantage"],"syn":[],"ex":[{"en":"Using a calculator would give you an [[unfair advantage]].","zh":"用计算器会让你占不公平的便宜。"},{"en":"Rich families can buy their children an [[unfair advantage]].","zh":"有钱人家能给孩子买来不公平的优势。"}],"ctx":"There is something refreshing about a contest in which no one can be accused of having an unfair advantage."},{"id":36,"expr":"nerve","zh":"胆量、勇气；神经","m":["nerve"],"note":"have the nerve to do：有胆量做（也可以是“竟敢”）。lose one's nerve：临阵退缩。get on sb's nerves：让人心烦。","core":"nerve","forms":["nerve","nerves"],"syn":[],"ex":[{"en":"I didn't have the [[nerve]] to ask her out.","zh":"我没胆量约她出去。"},{"en":"Loud music gets on my [[nerves]].","zh":"吵闹的音乐让我心烦。"}],"ctx":"No expensive equipment is needed, and a child with enough nerve can, in principle, beat a professional musician."},{"id":37,"expr":"in principle","zh":"理论上、原则上","m":["in principle"],"note":"常和 in practice（实际上，之前学过）对比：In principle it's easy; in practice it's hard.","core":"in principle","forms":["in principle"],"syn":[],"ex":[{"en":"[[In principle]], anyone can apply.","zh":"原则上谁都可以申请。"},{"en":"We agree [[in principle]], but the details need work.","zh":"我们原则上同意，但细节还需要再谈。"}],"ctx":"No expensive equipment is needed, and a child with enough nerve can, in principle, beat a professional musician."},{"id":38,"expr":"in an age when","zh":"在……的时代","m":["In an age when"],"note":"也说 in an era when / at a time when。when 引导定语从句，后面接完整句子。","core":"in an age when","forms":["in an age when","in an age where"],"syn":[],"ex":[{"en":"[[In an age when]] everyone has a phone, few people wear watches.","zh":"在人人都有手机的时代，很少有人戴手表。"},{"en":"[[In an age when]] news travels fast, rumours spread faster.","zh":"在消息传得飞快的时代，谣言传得更快。"}],"ctx":"In an age when so much of life is measured, ranked and sold, a world title for doing nothing at all is a small act of rebellion."},{"id":39,"expr":"rebellion","zh":"反叛、叛逆；起义","m":["rebellion"],"note":"动词 rebel（反抗），形容词 rebellious（叛逆的）：a rebellious teenager。","core":"rebellion","forms":["rebellion","rebellions"],"syn":[],"ex":[{"en":"Dyeing her hair green was her small [[rebellion]].","zh":"把头发染成绿色是她的小小叛逆。"},{"en":"The king crushed the [[rebellion]].","zh":"国王镇压了起义。"}],"ctx":"In an age when so much of life is measured, ranked and sold, a world title for doing nothing at all is a small act of rebellion."},{"id":40,"expr":"sore","zh":"疼痛的、酸痛的","m":["sore"],"note":"肌肉酸痛、喉咙痛常用 sore：a sore throat, sore legs。sore point：痛处、敏感话题。","core":"sore","forms":["sore"],"syn":[],"ex":[{"en":"My legs are [[sore]] after yesterday's run.","zh":"昨天跑完步腿好酸。"},{"en":"I've got a [[sore]] throat, so I'll stay home.","zh":"我嗓子疼，就待在家吧。"}],"ctx":"And unlike most championships, this one leaves its fans with nothing worse than a sore throat."},{"id":41,"expr":"judging by","zh":"从……来看、根据……判断","m":["judging by"],"note":"也说 judging from。Judging by his face, the news was bad.（看他的脸色，消息不好）。","core":"judging by","forms":["judging by","judging from"],"syn":[],"ex":[{"en":"[[Judging by]] the queue, the food must be good.","zh":"看这排队的阵势，菜一定好吃。"},{"en":"[[Judging by]] her smile, she passed the test.","zh":"看她笑得这么开心，应该是考过了。"}],"ctx":"The guitars may be imaginary; the joy, judging by the crowds, is anything but."},{"id":42,"expr":"anything but","zh":"绝不、根本不","m":["anything but"],"note":"anything but + 形容词 = 一点也不：The hotel was anything but cheap.（那家酒店一点也不便宜）。注意和 nothing but（只是）意思相反。","core":"anything but","forms":["anything but"],"syn":[],"ex":[{"en":"The exam was [[anything but]] easy.","zh":"这次考试一点也不简单。"},{"en":"He looked [[anything but]] happy.","zh":"他看起来一点也不开心。"}],"ctx":"The guitars may be imaginary; the joy, judging by the crowds, is anything but."}],"cloze":[{"id":1,"i":0,"before":"","ans":"Strumming","after":" thin air: why grown-ups fly to Finland to play guitars that do not exist","hint":"扫弦（-ing）","szh":"对着空气扫弦：成年人为什么飞到芬兰，去弹根本不存在的吉他"},{"id":2,"i":0,"before":"Strumming ","ans":"thin","after":" air: why grown-ups fly to Finland to play guitars that do not exist","hint":"（___ air）空气","szh":"对着空气扫弦：成年人为什么飞到芬兰，去弹根本不存在的吉他"},{"id":3,"i":1,"before":"Every summer, a small city near the Arctic Circle ","ans":"hosts","after":" a contest in which the instruments are invisible and the stakes are, by design, very low.","hint":"举办（三单）","szh":"每年夏天，北极圈附近的一座小城都会举办一场比赛：乐器是隐形的，输赢也被刻意设计得无关紧要。"},{"id":4,"i":1,"before":"Every summer, a small city near the Arctic Circle hosts a contest in which the instruments are invisible and the stakes are, by ","ans":"design","after":", very low.","hint":"故意地（by ___）","szh":"每年夏天，北极圈附近的一座小城都会举办一场比赛：乐器是隐形的，输赢也被刻意设计得无关紧要。"},{"id":5,"i":1,"before":"Every summer, a small city near the Arctic Circle hosts a contest in which the instruments are invisible and the ","ans":"stakes","after":" are, by design, very low.","hint":"利害、赌注（复数）","szh":"每年夏天，北极圈附近的一座小城都会举办一场比赛：乐器是隐形的，输赢也被刻意设计得无关紧要。"},{"id":6,"i":2,"before":"Yet the event takes its silliness very seriously, and that may be the secret of its ","ans":"charm","after":".","hint":"魅力","szh":"可这个活动对自己的傻气却极其认真，而这也许正是它的魅力所在。"},{"id":7,"i":3,"before":"Picture a stage, a ","ans":"roaring","after":" crowd and a performer in leather trousers, eyes shut, fingers flying across a guitar that is not there.","hint":"喧闹的","szh":"想象一个舞台、一群欢呼的观众，还有一位穿皮裤的表演者：双眼紧闭，手指在一把并不存在的吉他上飞舞。"},{"id":8,"i":4,"before":"For 60 seconds he ","ans":"leaps","after":", kneels and pulls faces to a song he did not choose, then bows as if he had just played a sold-out stadium.","hint":"跳（三单）","szh":"整整 60 秒，他跟着一首不是自己选的歌又跳又跪、挤眉弄眼，然后鞠躬谢幕，仿佛刚在座无虚席的体育场开完演唱会。"},{"id":9,"i":4,"before":"For 60 seconds he leaps, kneels and pulls ","ans":"faces","after":" to a song he did not choose, then bows as if he had just played a sold-out stadium.","hint":"做鬼脸（pulls ___）","szh":"整整 60 秒，他跟着一首不是自己选的歌又跳又跪、挤眉弄眼，然后鞠躬谢幕，仿佛刚在座无虚席的体育场开完演唱会。"},{"id":10,"i":4,"before":"For 60 seconds he leaps, kneels and pulls faces to a song he did not choose, then bows as ","ans":"if","after":" he had just played a sold-out stadium.","hint":"仿佛（as ___）","szh":"整整 60 秒，他跟着一首不是自己选的歌又跳又跪、挤眉弄眼，然后鞠躬谢幕，仿佛刚在座无虚席的体育场开完演唱会。"},{"id":11,"i":6,"before":"What began as a joke at a local music festival has grown into an international ","ans":"fixture","after":", with national champions from dozens of countries competing for the title.","hint":"固定活动","szh":"它起初只是当地音乐节上的一个玩笑，如今已成为固定的国际赛事，几十个国家的全国冠军都来争夺这个头衔。"},{"id":12,"i":6,"before":"What began as a joke at a local music festival has grown into an international fixture, with national champions from dozens of countries ","ans":"competing","after":" for the title.","hint":"争夺（-ing）","szh":"它起初只是当地音乐节上的一个玩笑，如今已成为固定的国际赛事，几十个国家的全国冠军都来争夺这个头衔。"},{"id":13,"i":8,"before":"Contestants may not touch a real instrument, ","ans":"nor","after":" may they rely on backing musicians; the guitar must be entirely imaginary.","hint":"也不（倒装）","szh":"选手不许碰真乐器，也不许靠伴奏乐手；吉他必须完全是想象出来的。"},{"id":14,"i":8,"before":"Contestants may not touch a real instrument, nor may they ","ans":"rely","after":" on backing musicians; the guitar must be entirely imaginary.","hint":"依靠（___ on）","szh":"选手不许碰真乐器，也不许靠伴奏乐手；吉他必须完全是想象出来的。"},{"id":15,"i":8,"before":"Contestants may not touch a real instrument, nor may they rely on backing musicians; the guitar must be entirely ","ans":"imaginary","after":".","hint":"想象中的","szh":"选手不许碰真乐器，也不许靠伴奏乐手；吉他必须完全是想象出来的。"},{"id":16,"i":9,"before":"Judges score each performance on technical skill, stage ","ans":"presence","after":" and a hard-to-define quality the organisers call 'airness'.","hint":"台风（stage ___）","szh":"评委按技术、台风，以及一种主办方称为“空气感”、很难说清的特质给每场表演打分。"},{"id":17,"i":10,"before":"A good air guitarist, in ","ans":"other","after":" words, must convince the audience that the music is coming from his fingers, not the speakers.","hint":"换句话说（in ___ words）","szh":"换句话说，一位优秀的空气吉他手必须让观众相信：音乐来自他的手指，而不是音箱。"},{"id":18,"i":10,"before":"A good air guitarist, in other words, must ","ans":"convince","after":" the audience that the music is coming from his fingers, not the speakers.","hint":"使相信","szh":"换句话说，一位优秀的空气吉他手必须让观众相信：音乐来自他的手指，而不是音箱。"},{"id":19,"i":11,"before":"Mistakes are allowed, but only if they are made with ","ans":"conviction","after":".","hint":"满怀信念地（with ___）","szh":"犯错是允许的，但前提是错得理直气壮。"},{"id":20,"i":12,"before":"To outsiders, it can look like an ","ans":"elaborate","after":" excuse to dress up and show off.","hint":"精心的、复杂的","szh":"在外人看来，这可能像是一个煞费苦心的借口，好让人盛装打扮、尽情炫耀。"},{"id":21,"i":12,"before":"To outsiders, it can look like an elaborate excuse to ","ans":"dress","after":" up and show off.","hint":"打扮（___ up）","szh":"在外人看来，这可能像是一个煞费苦心的借口，好让人盛装打扮、尽情炫耀。"},{"id":22,"i":12,"before":"To outsiders, it can look like an elaborate excuse to dress up and ","ans":"show","after":" off.","hint":"炫耀（___ off）","szh":"在外人看来，这可能像是一个煞费苦心的借口，好让人盛装打扮、尽情炫耀。"},{"id":23,"i":13,"before":"Competitors ","ans":"beg","after":" to differ.","hint":"恕难苟同（___ to differ）","szh":"选手们可不这么认为。"},{"id":24,"i":14,"before":"Many have practised for months in front of a mirror, studying the moves of rock legends ","ans":"frame by frame","after":".","hint":"一帧一帧地","szh":"很多人对着镜子练了好几个月，一帧一帧地研究摇滚传奇们的动作。"},{"id":25,"i":15,"before":"Some ","ans":"insist","after":" that air guitar is a genuine art form, one that demands timing, stamina and a total lack of embarrassment.","hint":"坚称","szh":"有些人坚称空气吉他是一门真正的艺术，它需要节奏感、体力，还要完全不怕难为情。"},{"id":26,"i":15,"before":"Some insist that air guitar is a genuine art form, one that demands timing, ","ans":"stamina","after":" and a total lack of embarrassment.","hint":"耐力","szh":"有些人坚称空气吉他是一门真正的艺术，它需要节奏感、体力，还要完全不怕难为情。"},{"id":27,"i":16,"before":"After a single minute on stage, several admit, they are as out of ","ans":"breath","after":" as any athlete.","hint":"喘不过气（out of ___）","szh":"好几位选手承认，在台上只待一分钟，他们就累得和运动员一样上气不接下气。"},{"id":28,"i":17,"before":"The festival also wears a cheerful philosophy on its ","ans":"sleeve","after":".","hint":"（wear sth on one's ___）","szh":"这个节日还毫不掩饰地亮出一套乐呵呵的哲学。"},{"id":29,"i":18,"before":"Its organisers like to joke that you cannot hold a weapon while playing air guitar, so if everyone ","ans":"took","after":" it up, wars might simply stop.","hint":"开始从事（___ it up，过去式）","szh":"主办方爱开玩笑说：弹空气吉他的时候没法拿武器，所以如果人人都玩起来，战争说不定就停了。"},{"id":30,"i":19,"before":"Nobody pretends this is a serious peace plan, but the slogan ","ans":"captures","after":" the spirit of the thing: harmless, generous and slightly absurd.","hint":"抓住（三单）","szh":"没人假装这是认真的和平方案，但这句口号抓住了这项活动的精髓：无害、大方，还有点荒唐。"},{"id":31,"i":19,"before":"Nobody pretends this is a serious peace plan, but the slogan captures the spirit of the thing: ","ans":"harmless","after":", generous and slightly absurd.","hint":"无害的","szh":"没人假装这是认真的和平方案，但这句口号抓住了这 let TERM_MAP = {}, TERMS = [], TERM_RE = null;
function buildTerms(){
  TERM_MAP = {}; TERMS = [];
  /* the article's own words win a clash (a learner's word that is the same text as one of them adds nothing to highlight) */
  DATA.vocab.slice().reverse().forEach(function(v){ v.m.forEach(function(t){ TERM_MAP[t.toLowerCase()] = v.id; if (TERMS.indexOf(t) < 0) TERMS.push(t); }); });
  TERMS.sort(function(a,b){ return b.length - a.length; });
  TERM_RE = termRe(TERMS, 'gi');
}

function normalize(d){

function getS(id){ const e = state.vocab[id]; return (e && e.s) || 'new'; }
function pruneEntry(id){ const e = state.vocab[id]; if (e && !e.s && !e.m) delete state.vocab[id]; }
function setS(id, s){
  const e = state.vocab[id] || (state.vocab[id] = {});

  e.d = today();
  pruneEntry(id);

}
function setMine(id, val){
  const e = state.vocab[id] || (state.vocab[id] = {});

function setSaveNote(mode){
  const m = {saved:'进度已保存', saving:'正在保存…', local:'进度只存在本机', none:''};
  $('#saveNote').textContent = m[mode] || '';
}
function scheduleSave(){
  if (!ref) return;
  clearTimeout(saveTimer);
  setSaveNote('saving');
  saveTimer = setTimeout(flush, 700);
}
async function flush(){
  if (!ref) return;
  if (saving){ again = true; return; }
  const json = JSON.stringify(state);
  if (json === lastJSON){ setSaveNote('saved'); return; }
  saving = true;
  try { await ref.set(JSON.parse(json)); lastJSON = json; setSaveNote('saved'); }
  catch(e){ setSaveNote('local'); }
  saving = false;
  if (again){ again = false; scheduleSave(); }
}
function withTimeout(p, ms){
  return Promise.race([p, new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('timeout')); }, ms); })]);
}
function hasContent(s){ return Object.keys(s.vocab).length > 0 || Object.keys(s.ans).length > 0 || !!s.quiz; }
async function initCloud(){
  let db = null, user = null;
  try {
    if (!window.claude || !window.claude.use){ setSaveNote('local'); return; }
    const r = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    db = r[0]; user = r[1];
  } catch(e){}
  if (!db || !user){ setSaveNote('local'); return; }
  let uid = null;
  try { uid = await user.id(); } catch(e){}
  if (!uid){ setSaveNote('local'); return; }
  let r;
  try { r = db.doc('data/users/' + uid + '/progress'); } catch(e){ setSaveNote('local'); return; }
  try {
    const snap = await withTimeout(r.get(), 10000);
    if (snap.exists){
      const remote = normalize(snap.data());
      if (touched){
        state = {v:1, vocab:Object.assign({}, remote.vocab, state.vocab), ans:Object.assign({}, remote.ans, state.ans), quiz:state.quiz || remote.quiz};
        lastJSON = '';
      } else {
        state = remote;
        lastJSON = JSON.stringify(state);
      }
      lsSet(LS_STATE, state);
      ref = r;
      renderAll();
      if (lastJSON === '') flush(); else setSaveNote('saved');
    } else {
      ref = r;
      lastJSON = '';
      if (hasContent(state)){ setSaveNote('saving'); flush(); } else setSaveNote('saved');
    }
  } catch(e){ setSaveNote('local'); }
}

/* ---------- vocabulary highlighting ---------- */
function marked(text, opt){
  opt = opt || {};
  if (!(opt.force || ui.hi)) return rubyNodes(text);
  const out = [];
  let last = 0, m;
  TERM_RE.lastIndex = 0;
  while ((m = TERM_RE.exec(text))){
    const id = TERM_MAP[m[0].toLowerCase()];
    if (opt.only && opt.only !== id) continue;
    if (m.index > last) out.push.apply(out, rubyNodes(text.slice(last, m.index)));
    out.push(h('mark', {class:'vw' + (VMAP[id].mine ? ' uw' : ''), 'data-v':id, title:VMAP[id].zh}, rubyNodes(m[0])));
    last = m.index + m[0].length;
  }
  if (last < text.length) out.push.apply(out, rubyNodes(text.slice(last)));
  return out;
}

/* ---------- masthead ---------- */
function renderMast(){
  const total = DATA.vocab.length;
  let n = 0;
  DATA.vocab.forEach(function(v){ if (getS(v.id) === 'mastered') n++; });
  $('#mCount').textContent = n + ' / ' + total;
  $('#meter').style.setProperty('--p', (total ? n / total * 100 : 0) + '%');
}

/* ---------- tabs ---------- */
let cur = null;
function showTab(t){
  if (TABS.indexOf(t) < 0 || (t === 'listen' && !DATA.audio)) t = 'read';
  const changed = cur !== null && cur !== t;
  cur = t;
  $$('.view').forEach(function(v){ v.hidden = v.id !== 'view-' + t; });
  $$('.tab').forEach(function(b){
    const on = b.dataset.tab === t;
    b.classList.toggle('on', on);
    b.setAttribute('aria-selected', String(on));
  });
  if (t === 'quiz' && quiz.phase === 'start') renderQuiz();
  if (t === 'cards' && fc.phase === 'start') renderCards();
  if (t === 'words' && changed) renderWords();
  if (changed) window.scrollTo(0, 0);
}

let active = -1;
const BLOCKS = [{type:'title', idx:[0]}, {type:'sub', idx:S.filter(function(s){ return s.kind === 'sub'; }).map(function(s){ return s.i; })}];
for (let p = 1; p <= 6; p++) BLOCKS.push({type:'p', idx:S.filter(function(s){ return s.p === p; }).map(function(s){ return s.i; })});

function sentSpan(s){
  const sp = h('span', {class:'sent' + (active === s.i ? ' on' : ''), 'data-i':s.i, tabindex:0, role:'button', 'aria-expanded':String(active === s.i)}, marked(s.en));
  sp.addEventListener('click', function(){ if (selText()) return; toggleSentence(s.i); });
  sp.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggleSentence(s.i); } });
  return sp;
}
function renderArticle(){
  const root = $('#article');
  root.replaceChildren();
  root.classList.toggle('show-zh', !!ui.zh);
  BLOCKS.forEach(function(b){
    const sec = h('section', {class:'blk blk-' + b.type});
    const el = h(b.type === 'title' ? 'h1' : 'p', {class:b.type === 'title' ? 'a-title' : b.type === 'sub' ? 'a-deck' : 'a-para'});
    b.idx.forEach(function(i, k){ if (k > 0) el.append(' '); el.append(sentSpan(S[i])); });
    sec.append(el);
    if (LANG !== 'en') sec.append(h('p', {class:'rom'}, b.idx.map(function(i){ return S[i].rom; }).join(' ')));
    sec.append(h('p', {class:'zh'}, b.idx.map(function(i){ return S[i].zh; }).join('')));
    sec.append(h('div', {class:'slot', 'data-slot':b.idx.join(',')}));
    root.append(sec);
  });

}

function noteCard(s){
  return h('div', {class:'note', role:'region', 'aria-label':'本句讲解'},
    h('div', {class:'note-head'},
      h('span', {class:'eyebrow'}, s.label),
      h('div', {class:'note-nav'},
        h('button', {type:'button', class:'btn sm', disabled:active === 0, onclick:function(){ step(-1); }}, '上一句'),
        h('button', {type:'button', class:'btn sm', disabled:active === S.length - 1, onclick:function(){ step(1); }}, '下一句'),
        h('button', {type:'button', class:'btn sm', 'aria-label':'收起', onclick:function(){ toggleSentence(active); }}, '收起')
      )
    ),
    s.rom ? h('p', {class:'rom'}, s.rom) : null,
    h('p', {class:'note-zh'}, s.zh),
    h('ul', {class:'note-list'}, s.notes.map(function(t){ return h('li', null, t); })),
    sentenceWords(s)
  );
}
/* the words highlighted in a sentence, each explained right here (tap to open) with a link to its full card */
function sentenceWords(s){
  const ids = [], seen = {};
  const re = new RegExp(TERM_RE.source, 'gi');
  let m;
  while ((m = re.exec(s.en))){
    const id = TERM_MAP[m[0].toLowerCase()];
    if (id !== undefined && !seen[id]){ seen[id] = true; ids.push(id); }
  }
  if (!ids.length) return null;
  return h('div', {class:'note-words'},
    h('p', {class:'note-wh'}, '本句标出的词（点开看讲解）'),
    ids.map(function(id){
      const v = VMAP[id], x = v.ex && v.ex[0];
      return h('details', {class:'nw'},
        h('summary', null, h('b', null, v.expr), '　', v.zh),
        h('div', {class:'nw-body'},
          v.note ? h('p', null, v.note) : null,
          x ? h('p', {class:'nw-ex'}, exPlain(x.en), '　', x.zh) : null,
          h('button', {type:'button', class:'btn sm', onclick:function(){ gotoWord(id); }}, '看完整词卡 →')
        )
      );
    })
  );
}

    h('p', {class:'bd'}, '一共 ' + total + ' 张：一次就认识 ' + Object.keys(fc.seen).filter(function(k){ return !fc.missed[k]; }).length + ' 张' + (missed.length ? '，有 ' + missed.length + ' 张开始不认识（已经反复背过）。' : '，全部一次过！')),
    missed.length ? h('div', null, h('p', {class:'fld'}, '一开始不认识的'), h('ul', {class:'fc-list'}, missed.map(function(v){
      return h('li', null, h('b', null, v.expr), v.rom ? h('span', {class:'meta'}, ' ' + v.rom) : null, '　', v.zh);
    }))) : null,
    h('div', {class:'row'},
      missed.length ? h('button', {type:'button', class:'btn pri', onclick:function(){ fcStart(missed.map(function(v){ return v.id; })); }}, '只背这 ' + missed.length + ' 张') : null,
      h('button', {type:'button', class:'btn' + (missed.length ? '' : ' pri'), onclick:function(){ fcStart(fcPool(fc.scope)); }}, '再来一轮'),
      h('button', {type:'button', class:'btn', onclick:function(){ fc.phase = 'start'; renderCards(); }}, '换个方式'),
      h('button', {type:'button', class:'btn', onclick:function(){ showTab('quiz'); try { location.hash = 'quiz'; } catch(e){} }}, '去自测')));
  return card;
}
document.addEventListener('keydown', function(e){
  if (cur !== 'cards' || fc.phase !== 'run' || e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (e.key === ' ' || e.key === 'Enter'){
    if (!fc.flipped){ e.preventDefault(); const c = $('.fc-card'); if (c) c.click(); }
  } else if (fc.flipped && (e.key === '1' || e.key === 'ArrowLeft')){ e.preventDefault(); fcGrade(false); }
  else if (fc.flipped && (e.key === '2' || e.key === 'ArrowRight')){ e.preventDefault(); fcGrade(true); }
});

/* ---------- add a word yourself: select text in the article -> 加入生词 ---------- */
function selText(){ try { const s = window.getSelection(); return s && !s.isCollapsed ? s.toString().trim() : ''; } catch(e){ return ''; } }
/* the current selection as {i: sentence index, t: text, o: offset in the sentence} or null (it must lie inside one sentence) */
function selInfo(){
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
  const r = sel.getRangeAt(0);
  function sentOf(n){ const el = n && (n.nodeType === 1 ? n : n.parentNode); return el && el.closest ? el.closest('#article .sent') : null; }
  const a = sentOf(r.startContainer), b = sentOf(r.endContainer);
  if (!a || a !== b) return null;
  const pre = document.createRange();
  pre.selectNodeContents(a); pre.setEnd(r.startContainer, r.startOffset);
  const i = Number(a.dataset.i), en = S[i].en;
  /* readings above kanji (<rt>) are not part of the sentence */
  let o = plainText(pre.cloneContents()).length, t = plainText(r.cloneContents());
  /* drop spaces and punctuation at both ends: "elves," -> "elves" */
  const lead = t.match(new RegExp('^[^' + LETTERS + '0-9]*', 'i'))[0].length;
  o += lead; t = t.slice(lead);
  t = t.replace(new RegExp('[^' + LETTERS + '0-9]+$', 'i'), '');
  if (!t || t.length > 80 || en.substr(o, t.length) !== t) return null;
  return {i:i, t:t, o:o};
}
let addBtn = null, selTimer = 0;
function hideAddBtn(){ if (addBtn) addBtn.hidden = true; }
function placeAddBtn(){
  const info = cur === 'read' ? selInfo() : null;
  if (!info){ hideAddBtn(); return; }
  if (!addBtn){
    addBtn = h('button', {type:'button', class:'uw-add', onmousedown:function(e){ e.preventDefault(); }, onclick:function(){
      const x = selInfo() || addBtn._info;
      hideAddBtn();
      if (x) openAddSheet({add:x});
    }}, '＋ 加入生词');
    document.body.append(addBtn);
  }
  addBtn._info = info;
  const rc = window.getSelection().getRangeAt(0).getBoundingClientRect();
  addBtn.hidden = false;
  const w = addBtn.offsetWidth, vw = document.documentElement.clientWidth;
  addBtn.style.left = Math.max(8, Math.min(vw - w - 8, rc.left + rc.width / 2 - w / 2)) + 'px';
  /* below the selection: phones show their own copy menu above it */
  addBtn.style.top = (window.scrollY + rc.bottom + 10) + 'px';
}
function openAddSheet(o){
  const edit = o.edit, x = o.add;
  const s = edit ? null : S[x.i];
  const term = edit ? edit.expr : x.t;
  const old = !edit && DATA.vocab.filter(function(v){ return v.expr.toLowerCase() === term.toLowerCase() || v.m.some(function(t){ return t.toLowerCase() === term.toLowerCase(); }); })[0];
  const zh = h('input', {type:'text', class:'search', maxlength:200, placeholder:'中文意思，比如：精灵', 'aria-label':'中文意思'});
  const note = h('textarea', {rows:2, maxlength:400, placeholder:'笔记（可不写）：搭配、用法、想提醒自己的话', 'aria-label':'笔记'});
  if (edit){ zh.value = edit.zh === '（还没写中文意思）' ? '' : edit.zh; note.value = edit.note || ''; }
  const err = h('p', {class:'uw-err', 'aria-live':'polite'});
  const ctx = edit ? edit.ctx : s.en;
  const bg = h('div', {class:'uw-bg', onclick:function(e){ if (e.target === bg) close(); }});
  function close(){ bg.remove(); document.removeEventListener('keydown', onKey); }
  function onKey(e){ if (e.key === 'Escape') close(); }
  function save(){
    const z = zh.value.trim();
    if (!z){ err.textContent = '写一下中文意思吧，考试时要靠它出题。'; zh.focus(); return; }
    if (edit){ mineEdit(edit.key, {zh:z, n:note.value}); close(); refreshMine(); toast('已更新“' + term + '”'); return; }
    mineAdd(SLUG, {t:x.t, o:x.o, ctx:s.en, czh:s.zh, zh:z, n:note.value});
    try { window.getSelection().removeAllRanges(); } catch(e){}
    close(); refreshMine();
    toast('已加入生词：' + term + '。词汇表、自测和复习页都能看到它。');
  }
  const card = h('div', {class:'uw-sheet', role:'dialog', 'aria-modal':'true', 'aria-label':edit ? '修改生词' : '加入生词'},
    h('p', {class:'eyebrow'}, edit ? '修改生词' : '加入生词'),
    h('h3', {class:'uw-term'}, term),
    h('p', {class:'uw-ctx'}, ctx.slice(0, edit ? 0 : x.o), h('b', null, edit ? '' : term), edit ? ctx : ctx.slice(x.o + term.length)),
    old ? h('p', {class:'uw-old'}, '词汇表里已经有“' + old.expr + '”（' + old.zh + '）。还要再加一个吗？') : null,
    h('label', {class:'uw-f'}, h('span', null, '中文意思'), zh),
    h('label', {class:'uw-f'}, h('span', null, '笔记'), note),
    err,
    h('div', {class:'row'},
      h('button', {type:'button', class:'btn pri', onclick:save}, edit ? '保存' : '加入生词'),
      h('button', {type:'button', class:'btn', onclick:close}, '取消')));
  zh.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); save(); } });
  bg.append(card);
  document.body.append(bg);
  document.addEventListener('keydown', onKey);
  setTimeout(function(){ zh.focus(); }, 30);
}
function refreshMine(){
  loadMine();
  buildTerms();
  renderAll();
  if (L.el.box) renderListenText();
}
let toastTimer = 0;
function toast(msg){
  let t = $('.uw-toast');
  if (!t){ t = h('div', {class:'uw-toast', role:'status'}); document.body.append(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.hidden = true; }, 3200);
}

/* ---------- wiring ---------- */
/* ---------- speaker icons: words, example sentences, article sentences ---------- */
function speakBtn(key, text){ return clipBtn(DATA.clips, key, text); }
function stopNarrationForClip(){
  if (L && L.audio && !L.audio.paused) L.audio.pause();
  if (L) L.seg = null;
}
function sentBtn(en){
  if (!DATA.audio) return null;
  const i = S.findIndex(function(s){ return s.en === en; }) >= 0 ? S.findIndex(function(s){ return s.en === en; }) : S.findIndex(function(s){ return s.en.indexOf(en) >= 0; });
  if (i < 0) return null;
  const b = spkEl('播放这一句', function(){ playArticleSentence(i, b); });
  return b;
}
function playArticleSentence(i, btn){
  const a = getAudio();
  const T = DATA.audio.t[i];
  Clip.stop();
  const wasOn = L.seg && L.seg.btn === btn && !a.paused;
  endSeg();
  if (wasOn){ a.pause(); return; }
  L.seg = {end:T[1] + 0.15, btn:btn};
  btn.classList.add('on');
  const go = function(){ a.currentTime = Math.max(0, T[0] - 0.1); };
  if (a.readyState >= 1) go(); else a.addEventListener('loadedmetadata', go, {once:true});
  const pr = a.play();
  if (pr && pr.catch) pr.catch(function(){ endSeg(); });
}
function endSeg(){
  if (L.seg && L.seg.btn) L.seg.btn.classList.remove('on');
  L.seg = null;
}

/* ---------- listen tab ---------- */
const L = {audio:null, cur:-1, loop:false, loopIdx:-1, drag:false, el:{}, spans:[], raf:0, seg:null};
const RATES = [0.75, 0.9, 1, 1.15, 1.3];
function fmtT(t){ t = Math.max(0, Math.floor(t)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
function sentAt(t){
  const T = DATA.audio.t;
  let k = 0;
  for (let i = 0; i < T.length; i++){ if (T[i][0] <= t + 0.05) k = i; else break; }
  return k;
}
function getAudio(){
  if (L.audio) return L.audio;
  const a = new Audio();
  a.preload = 'auto';
  a.src = DATA.audio.src;
  a.playbackRate = ui.rate || 1;
  try { a.preservesPitch = true; a.webkitPreservesPitch = true; } catch(e){}
  a.addEventListener('timeupdate', listenUpdate);
  a.addEventListener('play', function(){ listenPlayState(); loopFrames(); });
  a.addEventListener('pause', function(){ listenPlayState(); if (L.seg && a.currentTime < L.seg.end) endSeg(); });
  a.addEventListener('ended', function(){ listenPlayState(); listenUpdate(); });
  a.addEventListener('error', function(){ L.el.msg.textContent = '音频没有加载出来，请检查网络后再点播放。'; L.el.msg.hidden = false; });
  a.addEventListener('playing', function(){ L.el.msg.hidden = true; });
  L.audio = a;
  try {
    if ('mediaSession' in navigator){
      navigator.mediaSession.metadata = new MediaMetadata({title:DATA.title, artist:{en:'外刊精读', ko:'韩语入门', ja:'日语中级'}[LANG]});
      navigator.mediaSession.setActionHandler('play', function(){ a.play(); });
      navigator.mediaSession.setActionHandler('pause', function(){ a.pause(); });
      navigator.mediaSession.setActionHandler('seekbackward', function(){ a.currentTime = Math.max(0, a.currentTime - 5); });
      navigator.mediaSession.setActionHandler('seekforward', function(){ a.currentTime = Math.min(DATA.audio.dur, a.currentTime + 5); });
    }
  } catch(e){}
  return a;
}
function listenPlayState(){
  const playing = !!(L.audio && !L.audio.paused && !L.audio.ended);
  L.el.play.textContent = playing ? '暂停' : '播放';
  L.el.play.setAttribute('aria-pressed', String(playing));
}
function loopFrames(){
  cancelAnimationFrame(L.raf);
  const tick = function(){
    if (!L.audio || L.audio.paused) return;
    listenUpdate();
    L.raf = requestAnimationFrame(tick);
  };
  L.raf = requestAnimationFrame(tick);
}
function listenUpdate(){
  const a = L.audio;
  if (!a) return;
  const T = DATA.audio.t;
  let t = a.currentTime;
  if (L.seg && !a.paused && t >= L.seg.end){ a.pause(); endSeg(); }
  if (L.loop && L.loopIdx >= 0 && !L.seg && !a.paused && t >= T[L.loopIdx][1] + 0.2){ a.currentTime = T[L.loopIdx][0]; t = a.currentTime; }
  if (!L.drag) L.el.range.value = String(t);
  L.el.now.textContent = fmtT(t);
  const k = sentAt(t);
  if (k !== L.cur){
    L.cur = k;
    markListenSentence(!a.paused);
  }
}
function markListenSentence(follow){
  L.spans.forEach(function(sp){ sp.classList.toggle('on', Number(sp.dataset.i) === L.cur); });
  if (follow && ui.tx){
    const sp = L.spans[L.cur];
    if (sp) sp.scrollIntoView({block:'nearest', behavior:REDUCE ? 'auto' : 'smooth'});
  }
}
function playSentence(i){
  endSeg();
  Clip.stop();
  const a = getAudio();
  a.currentTime = DATA.audio.t[i][0];
  if (L.loop) L.loopIdx = i;
  a.play().catch(function(){});
  listenUpdate();
}
function seekBy(d){
  endSeg();
  const a = getAudio();
  a.currentTime = Math.min(DATA.audio.dur, Math.max(0, a.currentTime + d));
  listenUpdate();
}
function setRate(r){
  ui.rate = r; lsSet(LS_UI, ui);
  if (L.audio) L.audio.playbackRate = r;
  $$('.rate-b', L.el.box).forEach(function(b){ const on = Number(b.dataset.r) === r; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
}
function applyTextVisibility(){
  L.el.tr.hidden = !ui.tx;
  L.el.off.hidden = !!ui.tx;
}
function renderListenText(){
  if (!L.el.tr) return;
  L.el.tr.replaceChildren();
  BLOCKS.forEach(function(b){
    const sec = h('section', {class:'blk blk-' + b.type});
    const el = h(b.type === 'title' ? 'h2' : 'p', {class:b.type === 'title' ? 'a-title' : b.type === 'sub' ? 'a-deck' : 'a-para'});
    b.idx.forEach(function(i, k){
      if (k > 0) el.append(' ');
      const sp = h('span', {class:'ls', 'data-i':i, tabindex:0, role:'button', 'aria-label':'从这一句开始播放'}, marked(S[i].en));
      sp.addEventListener('click', function(){ playSentence(i); });
      sp.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); playSentence(i); } });
      el.append(sp);
    });
    sec.append(el);
    L.el.tr.append(sec);
  });
  L.spans = $$('.ls', L.el.tr);
  markListenSentence(false);
}
function renderListen(){
  const box = $('#listenBox');
  if (!DATA.audio || !box || L.el.box) return;
  L.el.box = box;
  const A = DATA.audio;
  L.el.play = h('button', {type:'button', class:'btn pri big', 'aria-pressed':'false', onclick:function(){
    endSeg();
    Clip.stop();
    const a = getAudio();
    if (a.paused || a.ended){ if (a.ended) a.currentTime = 0; a.play().catch(function(){}); } else a.pause();
  }}, '播放');
  L.el.range = h('input', {type:'range', class:'lp-range', min:0, max:A.dur, step:0.1, value:0, 'aria-label':'播放进度'});
  L.el.range.addEventListener('pointerdown', function(){ L.drag = true; });
  L.el.range.addEventListener('input', function(){
    const a = getAudio();
    a.currentTime = Number(L.el.range.value);
    L.el.now.textContent = fmtT(a.currentTime);
    const k = sentAt(a.currentTime);
    if (k !== L.cur){ L.cur = k; markListenSentence(false); }
  });
  const endDrag = function(){ L.drag = false; };
  L.el.range.addEventListener('change', endDrag);
  L.el.range.addEventListener('pointerup', endDrag);
  L.el.range.addEventListener('pointercancel', endDrag);
  L.el.now = h('span', null, '0:00');
  L.el.msg = h('p', {class:'lp-msg', hidden:true, role:'alert'});
  const rates = h('div', {class:'chips', role:'group', 'aria-label':'播放速度'});
  RATES.forEach(function(r){
    rates.append(h('button', {type:'button', class:'chip rate-b', 'data-r':r, 'aria-pressed':'false', onclick:function(){ setRate(r); }}, r + '×'));
  });
  const loopCb = h('input', {type:'checkbox'});
  loopCb.addEventListener('change', function(){
    L.loop = loopCb.checked;
    L.loopIdx = L.loop ? (L.cur >= 0 ? L.cur : 0) : -1;
  });
  const txCb = h('input', {type:'checkbox'});
  txCb.checked = !!ui.tx;
  txCb.addEventListener('change', function(){ ui.tx = txCb.checked; lsSet(LS_UI, ui); applyTextVisibility(); });
  L.el.tr = h('div', {class:'tr'});
  L.el.off = h('p', {class:'tr-off'}, '原文已隐藏。先盲听一遍，听完再勾选“显示原文”对照。');
  box.append(
    h('div', {class:'card lp'},
      h('h2', {class:'h2'}, '听力'),
      h('p', {class:'lead'}, '整篇文章的朗读（AI 合成的' + (LANG !== 'en' ? XL : (DATA.audio.voice || '').charAt(0) === 'b' ? '英式' : '美式') + '发音，语速略慢）。先盲听，再对照原文；点原文里的任意一句，就从那一句开始播放。'),
      h('div', {class:'lp-row'},
        h('button', {type:'button', class:'btn', onclick:function(){ seekBy(-5); }}, '后退 5 秒'),
        L.el.play,
        h('button', {type:'button', class:'btn', onclick:function(){ seekBy(5); }}, '前进 5 秒')
      ),
      h('div', null, L.el.range, h('div', {class:'lp-time'}, L.el.now, h('span', null, fmtT(A.dur)))),
      h('div', null, h('p', {class:'meta'}, '播放速度'), h('div', {class:'row'}, rates)),
      h('div', {class:'lp-row'},
        h('label', {class:'lp-opt'}, loopCb, '单句循环（当前这一句反复听）'),
        h('label', {class:'lp-opt'}, txCb, '显示原文')
      ),
      L.el.msg
    ),
    L.el.off,
    L.el.tr
  );
  setRate(ui.rate || 1);
  renderListenText();
  applyTextVisibility();
}
function renderAll(){
  renderMast();
  renderArticle();
  renderListen();
  renderWords();
  renderThink();
  if (quiz.phase === 'start') renderQuiz();
}
function init(){
  Clip.onBeforePlay(stopNarrationForClip);
  window.addEventListener('pagehide', settle);
  document.addEventListener('visibilitychange', function(){ if (document.hidden) settle(); });
  if (LANG !== 'en'){
    const rl = h('label', null, h('input', {type:'checkbox', id:'optRom'}), LANG === 'ja' ? ' 显示读音' : LANG === 'yue' ? ' 显示粤拼' : ' 显示罗马音');
    $('#optZh').parentNode.after(rl);
    $('#optRom').checked = !!ui[ROMK];
    document.body.classList.toggle('show-rom', !!ui[ROMK]);
    $('#optRom').addEventListener('change', function(){ ui[ROMK] = this.checked; lsSet(LS_UI, ui); document.body.classList.toggle('show-rom', ui[ROMK]); });
    const tt = $('.tab[data-tab="think"]');
    if (tt) tt.textContent = LANG === 'ja' ? '语法' : '句型';
  }
  $('#optZh').checked = !!ui.zh;
  $('#optHi').checked = !!ui.hi;
  $('#optZh').addEventListener('change', function(){ ui.zh = this.checked; lsSet(LS_UI, ui); $('#article').classList.toggle('show-zh', ui.zh); });
  $('#optHi').addEventListener('change', function(){ ui.hi = this.checked; lsSet(LS_UI, ui); renderArticle(); renderListenText(); });
  const chips = $('#chips');
  ['all','new','learning','mastered'].forEach(function(f){
    chips.append(h('button', {type:'button', class:'chip', 'data-f':f, onclick:function(){ vFilter = f; renderWords(); }}, f));
  });
  document.addEventListener('selectionchange', function(){ clearTimeout(selTimer); selTimer = setTimeout(placeAddBtn, 180); });
  window.addEventListener('resize', hideAddBtn);
  $('#wordSearch').addEventListener('input', function(){ vQuery = this.value; renderWords(); });
  $$('.tab').forEach(function(b){
    b.addEventListener('click', function(){ try { location.hash = b.dataset.tab; } catch(e){} showTab(b.dataset.tab); });
  });
  window.addEventListener('hashchange', function(){ showTab(location.hash.replace('#','')); });
  if (DATA.audio) $('.tab[data-tab="listen"]').hidden = false;
  renderAll();
  showTab(location.hash.replace('#','') || 'read');
  initCloud();
}
init();
})();
