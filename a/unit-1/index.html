const DATA = {"sents":[{"kind":"title","en":"From scratch, every morning: the quiet arithmetic of a small-town bakery","zh":"每天清晨从头做起：一家小镇面包店的精打细算","notes":["from scratch：从零开始、用原材料自己做。面包店每天从面粉开始做面包，字面意思和引申义都说得通。","arithmetic：算术，这里指经营上要算的账。the quiet arithmetic = 不声不响的精打细算。"],"i":0,"p":0,"n":0,"label":"标题"},{"kind":"sub","en":"In an ageing town where shops sit empty, one family bakery has survived for 60 years.","zh":"在一个老龄化、店铺纷纷空置的小镇上，一家家庭面包店已经撑了六十年。","notes":["where 引导定语从句，修饰 town。","sit empty：空着、闲置。","has survived for 60 years：现在完成时加 for，表示从过去一直持续到现在。"],"i":1,"p":0,"n":0,"label":"副标题"},{"kind":"sub","en":"How long it can keep going is another story.","zh":"它还能撑多久，就是另一回事了。","notes":["How long it can keep going 是名词性从句作主语，所以用陈述语序 it can，不是 can it。","X is another story：X 则另当别论、X 是另一回事。"],"i":2,"p":0,"n":0,"label":"副标题"},{"kind":"body","en":"Most mornings, Kenji Sato is at work by four, long before the first commuters slump onto the early train.","zh":"大多数早上，佐藤健二四点前就开工了，比第一批通勤的人瘫坐上早班车要早得多。","notes":["by four：四点之前。by + 时间 = 不晚于某个时间。","long before：早在……之前很久。","slump onto：瘫坐到……上，写出通勤者没睡醒的样子。"],"p":1,"i":3,"n":1,"label":"第 1 句"},{"kind":"body","en":"He makes everything from flour, butter and patience, and he is in no hurry to change.","zh":"他用面粉、黄油和耐心做出所有东西，也一点都不急着改变。","notes":["flour, butter and patience：前两样是真材料，第三样是比喻，并列在一起有点幽默。","be in no hurry to do sth：一点也不急着做某事。"],"p":1,"i":4,"n":2,"label":"第 2 句"},{"kind":"body","en":"His grandfather opened the shop in 1964, and the oven, the scales and the wooden till have stayed where they were ever since.","zh":"他祖父 1964 年开了这家店，烤炉、秤和木头收银台从那以后就一直放在原处。","notes":["scales：秤，这个意思常用复数。","till：收银台（英式）。","have stayed ... ever since：现在完成时配 ever since，“从那以后一直……”。"],"p":1,"i":5,"n":3,"label":"第 3 句"},{"kind":"body","en":"Walking in feels like stepping into a time capsule.","zh":"走进店里，就像走进了一个时间胶囊。","notes":["Walking in 是动名词作主语。feel like + 动名词：感觉像在做某事。","time capsule：时间胶囊，比喻一切都停留在过去的地方。"],"p":1,"i":6,"n":4,"label":"第 4 句"},{"kind":"body","en":"On Saturdays customers queue out of the door, and a surprising number of them are young people from the city with nowhere to be.","zh":"每到周六，顾客一直排到门外，其中年轻人多得让人意外，都是从城里来、没什么急事要赶的人。","notes":["queue out of the door：队伍排到门外。queue 作动词是英式用法。","a surprising number of：数量多得让人意外，后接复数名词。","with nowhere to be：没有要赶去的地方，也就是不赶时间。"],"p":1,"i":7,"n":5,"label":"第 5 句"},{"kind":"body","en":"The bakery is famously cash-only.","zh":"这家面包店只收现金，这一点出了名。","notes":["famously：出了名地。","cash-only：只收现金，用连字符连成一个形容词。"],"p":2,"i":8,"n":6,"label":"第 6 句"},{"kind":"body","en":"Its prices are gloriously dull: a loaf has cost the same for a decade.","zh":"它的价格乏味得可爱：一条面包十年都没涨过价。","notes":["gloriously dull：乏味得可爱。用褒义的 gloriously 修饰贬义的 dull，是带着欣赏的反话。","冒号后面具体解释“乏味”指什么：价格十年不变。"],"p":2,"i":9,"n":7,"label":"第 7 句"},{"kind":"body","en":"Regulars count out coins at the counter, while visitors fumble for their wallets and look around for a card reader that is not there.","zh":"老顾客在柜台前一枚一枚数硬币，外地来的人则手忙脚乱地找钱包，还四处找根本没有的刷卡机。","notes":["regulars：常客、老顾客。","count out：一个一个地数出来。","fumble for：笨手笨脚地摸找。","while 连接对比的两组人：老顾客从容，外地人慌乱。"],"p":2,"i":10,"n":8,"label":"第 8 句"},{"kind":"body","en":"Mr Sato sees it differently from his younger customers: card firms take a slice of every sale, and he already lives on thin margins.","zh":"佐藤先生和年轻顾客看法不同：信用卡公司每笔交易都要抽走一块，而他本来利润就很薄。","notes":["see it differently：看法不同。","a slice of：……的一部分（像切下的一片）。","thin margins：利润微薄。live on thin margins = 靠很薄的利润过日子。"],"p":2,"i":11,"n":9,"label":"第 9 句"},{"kind":"body","en":"Cash, he argues, is not broken, so there is no reason to fix it.","zh":"他说，现金又没坏，没理由去修它。","notes":["he argues 是插入语。","化用了俗语 If it ain't broke, don't fix it（没坏就别修），意思是没有问题就不必改。"],"p":2,"i":12,"n":10,"label":"第 10 句"},{"kind":"body","en":"Counterintuitively, refusing cards may even save him money.","zh":"和直觉相反，不收卡反而可能让他省钱。","notes":["counterintuitively：与直觉相反地，放在句首修饰整句。","refusing cards 是动名词作主语。save sb money = 给某人省钱。"],"p":2,"i":13,"n":11,"label":"第 11 句"},{"kind":"body","en":"Whereas a card payment costs him a fee, a coin dropped into the till costs him nothing extra.","zh":"刷卡付款要付他一笔手续费，而一枚丢进收银台的硬币不会让他多花一分钱。","notes":["whereas：而、然而，用来对比两件事。","dropped into the till 是过去分词短语，修饰 a coin。","nothing extra：没有额外的。形容词放在 nothing 后面。"],"p":2,"i":14,"n":12,"label":"第 12 句"},{"kind":"body","en":"The real strain on the business is not money but people.","zh":"这门生意真正的压力不在钱，而在人。","notes":["the strain on sth：……承受的压力。","not A but B：不是 A 而是 B。"],"p":3,"i":15,"n":13,"label":"第 13 句"},{"kind":"body","en":"Like the rest of Japan, the town's working-age population is shrinking.","zh":"和日本其他地方一样，镇上的劳动年龄人口在减少。","notes":["Like the rest of Japan：和日本其他地方一样。","working-age population：劳动年龄人口；shrink：缩小、减少。"],"p":3,"i":16,"n":14,"label":"第 14 句"},{"kind":"body","en":"Bakers willing to start at four in the morning have grown scarce, and the job is among the first to go unfilled.","zh":"愿意凌晨四点开工的面包师已经越来越少，这份工作是最先招不到人的那一批。","notes":["willing to start at four in the morning 是形容词短语后置，修饰 bakers。","grow scarce：变得稀缺，这里用现在完成时 have grown scarce。","among the first to do sth：最早……的那一批之一。go unfilled：空着没人填。"],"p":3,"i":17,"n":15,"label":"第 15 句"},{"kind":"body","en":"For weeks on end last winter, Mr Sato and his wife covered the gaps themselves, working almost around the clock.","zh":"去年冬天，佐藤夫妇一连好几周自己顶上空缺，几乎是昼夜不停地干。","notes":["for weeks on end：一连好几周。","cover the gaps：填补空缺。","working almost around the clock 是伴随状语，说明他们怎么填补空缺。"],"p":3,"i":18,"n":16,"label":"第 16 句"},{"kind":"body","en":"His son, who has long lived in Osaka, has grudgingly offered to help at weekends.","zh":"他儿子早就住在大阪，勉勉强强地答应周末来帮忙。","notes":["have long + 过去分词：早就……、很久以来一直……。has long lived in Osaka = 在大阪住了很久。","grudgingly：不情愿地、勉强地。","at weekends 是英式说法，美式说 on weekends。"],"p":3,"i":19,"n":17,"label":"第 17 句"},{"kind":"body","en":"Mr Sato does not take that for granted.","zh":"佐藤先生并不觉得这是理所当然的。","notes":["take sth for granted：把……视为理所当然。that 指儿子来帮忙这件事。"],"p":3,"i":20,"n":18,"label":"第 18 句"},{"kind":"body","en":"A consultant from the city once tried to coax him into opening a second shop, with a card reader, self-checkout and a website.","zh":"城里来的一位顾问曾经想劝他开第二家店，装刷卡机、自助收银，再做个网站。","notes":["coax sb into doing sth：好言好语地哄劝某人做某事。","with a card reader, self-checkout and a website 说明这家新店的样子。"],"p":4,"i":21,"n":19,"label":"第 19 句"},{"kind":"body","en":"The incentive was clear: more customers and a hefty share of the tourist trade.","zh":"好处很明显：更多顾客，还能分到游客生意的一大块。","notes":["incentive：激励、诱因，让人愿意去做某事的好处。","a hefty share of：相当大的一部分。","冒号后面解释 incentive 具体是什么。"],"p":4,"i":22,"n":20,"label":"第 20 句"},{"kind":"body","en":"Mr Sato listened politely, handed over a free loaf, and said no.","zh":"佐藤先生礼貌地听完，递上一条免费的面包，然后拒绝了。","notes":["三个动词并列：listened, handed over, said，节奏很快，写出他拒绝得干脆。","hand over：交给、递过去。"],"p":4,"i":23,"n":21,"label":"第 21 句"},{"kind":"body","en":"His reasoning was more rational than it looked.","zh":"他的理由比看上去更合理。","notes":["rational：理性的、合乎道理的。","more rational than it looked：it 指 his reasoning，句尾省略了 rational。"],"p":4,"i":24,"n":22,"label":"第 22 句"},{"kind":"body","en":"A bigger business would rest on borrowed money and leave little room for error; a small one can live with a bad month.","zh":"规模大一些的生意要靠借来的钱撑着，几乎容不得出错；小店则扛得住一个不好的月份。","notes":["分号连接两个对比的分句：大生意怎样，小生意怎样。","rest on：建立在……之上。room for error：出错的余地。","live with：忍受、接受（不好的情况）。a small one 的 one 代替 business。"],"p":4,"i":25,"n":23,"label":"第 23 句"},{"kind":"body","en":"Every shortcut, he believes, would chip away at what made the shop indispensable in the first place.","zh":"他认为，每一种省事的办法，都会一点点削弱这家店当初让人离不开的东西。","notes":["he believes 是插入语。","chip away at：一点点削弱。","what made the shop indispensable 是名词性从句，作 at 的宾语。in the first place：当初、原本。"],"p":4,"i":26,"n":24,"label":"第 24 句"},{"kind":"body","en":"Over the decades, the bakery has grown into something like a public utility.","zh":"几十年下来，这家面包店已经成了一种近乎公共设施的存在。","notes":["over the decades：几十年来。","grow into：发展成。public utility：公用事业，比喻人人离不开。"],"p":5,"i":27,"n":25,"label":"第 25 句"},{"kind":"body","en":"The town has come to count on it, largely because it is always open.","zh":"镇上的人渐渐依赖上了它，主要是因为它总是开着门。","notes":["come to do sth：渐渐变得……。","count on：依靠、指望。","largely：主要地、在很大程度上。"],"p":5,"i":28,"n":26,"label":"第 26 句"},{"kind":"body","en":"Neighbours leave parcels there for each other to collect, and anyone who finds a lost possession hands it in at the counter.","zh":"邻居们把包裹放在店里，让彼此来取；谁捡到别人丢的东西，也会交到柜台。","notes":["for each other to collect：不定式的逻辑主语用 for 引出，意思是“让彼此来取”。","possession：所有物、个人物品，常用复数 possessions。","hand sth in：上交。宾语是代词时要放中间：hand it in。"],"p":5,"i":29,"n":27,"label":"第 27 句"},{"kind":"body","en":"Reportedly, the shop has returned more lost wallets than the local police box.","zh":"据说，这家店归还的失物钱包比当地的派出所还多。","notes":["reportedly：据说、据报道，放在句首表示消息来源不是作者本人。","police box：日本的派出所（交番），上一单元的第一篇讲过。"],"p":5,"i":30,"n":28,"label":"第 28 句"},{"kind":"body","en":"In practice, it works as a small civic centre.","zh":"实际上，它起着一个小型社区中心的作用。","notes":["in practice：实际上（与 in theory 相对）。","civic：市民的、公共的。civic centre：社区中心、市民活动中心。centre 是英式拼写。"],"p":5,"i":31,"n":29,"label":"第 29 句"},{"kind":"body","en":"Its virtue lies in the people who stop by, not merely in what they buy.","zh":"它的好处在于来店里的人，而不仅仅在于他们买了什么。","notes":["virtue：优点、长处。","lie in：在于。两个 in 短语并列：lies in the people ... not merely in what they buy。","stop by：顺便来一下。not merely：不仅仅。"],"p":5,"i":32,"n":30,"label":"第 30 句"},{"kind":"body","en":"No amount of clever marketing will replace that.","zh":"再高明的营销也代替不了这一点。","notes":["no amount of ... will ...：再多的……也不会……。","that 指上一句说的“来店里的人”。"],"p":5,"i":33,"n":31,"label":"第 31 句"},{"kind":"body","en":"Still, rising costs may soon tip the balance.","zh":"不过，不断上涨的成本可能很快就会打破平衡。","notes":["still 放句首是“不过、尽管如此”，表示转折。","tip the balance：打破平衡、起决定作用。"],"p":6,"i":34,"n":32,"label":"第 32 句"},{"kind":"body","en":"Flour and electricity prices have crept upward for three years, and the savings that propped up the shop through bad times are running out.","zh":"面粉和电费三年来一直在慢慢上涨，而在困难时期撑住这家店的积蓄也快用完了。","notes":["creep upward：慢慢往上涨，crept 是 creep 的过去分词。","prop up：撑住。that propped up the shop through bad times 是定语从句，修饰 savings。","run out：用完、耗尽，进行时表示快用完了。"],"p":6,"i":35,"n":33,"label":"第 33 句"},{"kind":"body","en":"Sooner or later, Mr Sato will have to decide whether the bakery stands to gain more from changing than from staying the same.","zh":"迟早，佐藤先生得想清楚：对面包店来说，改变和不变，哪个更有好处。","notes":["sooner or later：迟早。","stand to gain：有望得到好处。","more from changing than from staying the same：比较两种做法带来的好处。"],"p":6,"i":36,"n":34,"label":"第 34 句"},{"kind":"body","en":"For now, he would rather stick with what he knows than give way.","zh":"眼下，他宁可守着自己熟悉的那一套，也不愿让步。","notes":["would rather A than B：宁愿 A 也不愿 B，A、B 都用动词原形。","stick with：坚持用、不换掉。give way：让步、屈服。"],"p":6,"i":37,"n":35,"label":"第 35 句"},{"kind":"body","en":"By the time the shop closes each afternoon, almost nothing has gone to waste.","zh":"每天下午关门的时候，几乎没有东西被浪费掉。","notes":["by the time ...：到……的时候，主句常用完成时：has gone to waste。","go to waste：被浪费。gone 是过去分词。"],"p":6,"i":38,"n":36,"label":"第 36 句"},{"kind":"body","en":"It is, in its own way, a lesson that travels.","zh":"从它自己的角度看，这是一个到别处也适用的道理。","notes":["in its own way：以它自己的方式。","a lesson that travels：能“旅行”的道理，也就是放到别的地方也适用的经验。"],"p":6,"i":39,"n":37,"label":"第 37 句"}],"vocab":[{"id":1,"ref":"finders-keepers:39","m":["From scratch"],"expr":"from scratch","zh":"从零开始；从头做起","note":"scratch 原指赛跑时在地上划出的起跑线，from scratch 就是“从起跑线出发”，不借助现成的东西。做菜时指不用半成品、用原材料自己做。常和 start / build / make / cook 连用。","core":"from scratch","forms":["from scratch","start from scratch","make from scratch"],"syn":[],"ex":[{"en":"She lost all her files and had to write the report [[from scratch]].","zh":"她的文件全丢了，只好从头重写报告。"},{"en":"This cake is made [[from scratch]], not from a box mix.","zh":"这个蛋糕是用原材料自己做的，不是用预拌粉。"},{"en":"They built the company [[from scratch]] with just two laptops.","zh":"他们只靠两台笔记本电脑，白手起家建起了这家公司。"}],"from":"Finders, Keepers","ctx":"From scratch, every morning: the quiet arithmetic of a small-town bakery"},{"id":2,"ref":"long-live-cash:27","m":["arithmetic"],"expr":"arithmetic","zh":"算术；（成本收益的）账","note":"","core":"arithmetic","forms":["arithmetic"],"syn":[],"ex":[{"en":"The [[arithmetic]] of the deal simply does not work.","zh":"这笔交易的账怎么算都算不过来。"},{"en":"Do the [[arithmetic]] before you sign the lease.","zh":"签租约之前先把账算清楚。"}],"from":"Long Live Cash","ctx":"From scratch, every morning: the quiet arithmetic of a small-town bakery"},{"id":3,"ref":"konbini:37","m":["ageing"],"expr":"ageing","zh":"老龄化的","note":"英式拼写 ageing，美式 aging。an ageing population = 老龄化的人口；age 作动词 = 变老。","core":"ageing","forms":["ageing","aging"],"syn":[],"ex":[{"en":"Europe has an [[ageing]] population.","zh":"欧洲人口正在老龄化。"},{"en":"The [[ageing]] bridge needs repairs.","zh":"那座老旧的桥需要维修。"}],"from":"Konbini","ctx":"In an ageing town where shops sit empty, one family bakery has survived for 60 years."},{"id":4,"ref":"konbini:22","m":["sit empty"],"expr":"sit empty","zh":"空着、闲置","note":"sit 在这里表示“处于某种状态”。类似说法：sit unused（闲置不用）、sit idle（闲着）。","core":"sit empty","forms":["sit empty","sits empty","sat empty","sitting empty"],"syn":[],"ex":[{"en":"The flat [[sat empty]] for two years.","zh":"那套公寓空置了两年。"},{"en":"Thousands of offices now [[sit empty]] in the city.","zh":"如今城里有成千上万间办公室空着。"}],"from":"Konbini","ctx":"In an ageing town where shops sit empty, one family bakery has survived for 60 years."},{"id":5,"ref":"long-live-cash:44","m":["survived"],"expr":"survive","zh":"留存下来；幸存、挺过","note":"survive 最常见的意思是“活下来”，也可以指旧事物、旧习惯留存下来：the old habit survives = 老习惯没有消失。名词 survival，幸存者 survivor。","core":"survive","forms":["survive","survives","survived","surviving"],"syn":[],"ex":[{"en":"Few of the old shops [[survived]] the recession.","zh":"老店铺在经济衰退中没挺过去几家。"},{"en":"Some traditions [[survive]] long after their purpose is forgotten.","zh":"有些传统在人们忘了它的用途之后很久仍然留存着。"}],"from":"Long Live Cash","ctx":"In an ageing town where shops sit empty, one family bakery has survived for 60 years."},{"id":6,"ref":"finders-keepers:9","m":["another story"],"expr":"X is another story","zh":"X 则另当别论","note":"","core":"another story","forms":["another story","is another story","x is another story","be another story","was another story","are another story","were another story"],"syn":[],"ex":[{"en":"Cooking pasta is easy. Making it from scratch is [[another story]].","zh":"煮意面很简单，从头自己做就是另一回事了。"},{"en":"He plays the piano well, but singing is [[another story]].","zh":"他钢琴弹得不错，唱歌就另当别论了。"}],"from":"Finders, Keepers","ctx":"How long it can keep going is another story."},{"id":7,"ref":"finders-keepers:1","m":["slump onto"],"expr":"slump onto","zh":"瘫坐在……上","note":"","core":"slump onto","forms":["slump onto","slumps onto","slumped onto","slumping onto","slump into","slumps into","slumped into"],"syn":[],"ex":[{"en":"After the night shift, he [[slumped onto]] the sofa and fell asleep at once.","zh":"上完夜班，他一屁股瘫坐在沙发上，立刻睡着了。"},{"en":"The exhausted hikers [[slumped onto]] the grass at the top of the hill.","zh":"筋疲力尽的徒步者们瘫坐在山顶的草地上。"}],"from":"Finders, Keepers","ctx":"Most mornings, Kenji Sato is at work by four, long before the first commuters slump onto the early train."},{"id":8,"ref":"long-live-cash:40","m":["in no hurry to"],"expr":"be in no hurry to do sth","zh":"一点也不急着做某事","note":"no 加强否定，in no hurry 比 not in a hurry 语气更重。常见搭配：be in no hurry to do sth / be in no hurry for sth。对比 in a hurry（匆忙、着急）。标题说日本“不急着”告别现金，正文里的 unhurried 讲的是同一种从容。","core":"in no hurry","forms":["in no hurry","in no hurry to"],"syn":[],"ex":[{"en":"I am [[in no hurry to]] leave, so take your time.","zh":"我不急着走，你慢慢来。"},{"en":"The council is [[in no hurry to]] act on the report.","zh":"市议会并不急着按这份报告行动。"}],"from":"Long Live Cash","ctx":"He makes everything from flour, butter and patience, and he is in no hurry to change."},{"id":9,"ref":"konbini:8","m":["till"],"expr":"the till","zh":"收银台、收银机（英式）","note":"英式说 till，美式说 register 或 checkout。at the till = 在收银台；pay at the till = 在收银台付款。","core":"till","forms":["till","the till"],"syn":[],"ex":[{"en":"Please pay at [[the till]] by the door.","zh":"请到门口的收银台付款。"},{"en":"There was a long queue at [[the till]].","zh":"收银台前排着长队。"}],"from":"Konbini","ctx":"His grandfather opened the shop in 1964, and the oven, the scales and the wooden till have stayed where they were ever since."},{"id":10,"ref":"long-live-cash:7","m":["time capsule"],"expr":"time capsule","zh":"时间胶囊；保留旧时代原貌的地方","note":"","core":"time capsule","forms":["time capsule","time capsules"],"syn":[],"ex":[{"en":"The restored cafe feels like a [[time capsule]] from the 1960s.","zh":"这家修复过的咖啡馆像一个来自六十年代的时间胶囊。"},{"en":"The pupils buried a [[time capsule]] under the school garden.","zh":"学生们在学校花园下埋了一个时间胶囊。"}],"from":"Long Live Cash","ctx":"Walking in feels like stepping into a time capsule."},{"id":11,"ref":"long-live-cash:45","m":["queue"],"expr":"queue","zh":"队伍；排队（英式）","note":"queue 是英式英语的“排队、队伍”，美式英语说 line（wait in line）。动词短语 queue up = 排队。第 1 句的 the queue 和最后一句的 the bakery queue 是同一支队伍，首尾呼应。","core":"queue","forms":["queue","queues","queued","queuing","queueing"],"syn":["line (US)"],"ex":[{"en":"Hundreds of people [[queued]] outside the shop overnight.","zh":"几百人在店门外排了一夜的队。"},{"en":"Passengers have to [[queue]] in the rain for a taxi.","zh":"乘客得在雨里排队等出租车。"}],"from":"Long Live Cash","ctx":"On Saturdays customers queue out of the door, and a surprising number of them are young people from the city with nowhere to be."},{"id":12,"ref":"long-live-cash:48","m":["a surprising number of"],"expr":"a surprising number of","zh":"数量惊人的（人或物）","note":"a number of + 复数名词 = 一些；number 前面加形容词，表示“数量有多大”：a large / growing / surprising number of。原句省略了 of customers，所以谓语 count 用复数。对比：the number of ... is ...（……的数量是……）谓语用单数。","core":"surprising number","forms":["surprising number","a surprising number"],"syn":[],"ex":[{"en":"[[A surprising number of]] passengers still buy paper tickets.","zh":"数量出人意料的乘客仍然买纸质车票。"},{"en":"Museums report [[a surprising number of]] visitors from abroad.","zh":"博物馆称有数量惊人的外国游客。"}],"from":"Long Live Cash","ctx":"On Saturdays customers queue out of the door, and a surprising number of them are young people from the city with nowhere to be."},{"id":13,"ref":"long-live-cash:49","m":["nowhere to be"],"expr":"have nowhere to be","zh":"没有哪儿需要赶去；不赶时间","note":"nowhere to be = 没有任何一个非去不可的地方，常和 have 连用，表示时间充裕、没有约束：I have nowhere to be today. 反过来 have somewhere to be = 得赶去别处了。nowhere 加不定式作后置定语，和 nothing to do、no one to ask 同类。","core":"nowhere to be","forms":["nowhere to be"],"syn":[],"ex":[{"en":"Take your time; I have [[nowhere to be]] this afternoon.","zh":"不用急，我下午哪儿也不用去。"},{"en":"Retired, he had [[nowhere to be]] and read the paper for hours.","zh":"退休之后他不用赶去哪儿，一份报纸能读上好几个小时。"}],"from":"Long Live Cash","ctx":"On Saturdays customers queue out of the door, and a surprising number of them are young people from the city with nowhere to be."},{"id":14,"ref":"konbini:23","m":["famously"],"expr":"famously","zh":"出了名地","note":"famously + 形容词：famously shy（出了名的害羞）。也可放在句首：Famously, he never gave interviews.","core":"famously","forms":["famously"],"syn":[],"ex":[{"en":"The trains are [[famously]] punctual.","zh":"这里的火车准点是出了名的。"},{"en":"He was [[famously]] bad at remembering names.","zh":"他记不住人名是出了名的。"}],"from":"Konbini","ctx":"The bakery is famously cash-only."},{"id":15,"ref":"finders-keepers:13","m":["gloriously dull"],"expr":"gloriously dull","zh":"乏味得恰到好处（反语式夸赞）","note":"","core":"gloriously dull","forms":["gloriously dull"],"syn":["gloriously boring"],"ex":[{"en":"The meeting was [[gloriously dull]]: nothing went wrong, and nothing happened.","zh":"那场会议乏味得恰到好处：没出任何岔子，也什么都没发生。"},{"en":"After a chaotic year, he longed for a [[gloriously dull]] weekend at home.","zh":"经历了混乱的一年，他渴望在家过一个平平淡淡的周末。"}],"from":"Finders, Keepers","ctx":"Its prices are gloriously dull: a loaf has cost the same for a decade."},{"id":16,"ref":"long-live-cash:3","m":["count out"],"expr":"count out","zh":"（一枚一枚地）数出","note":"","core":"count out","forms":["count out","counts out","counted out","counting out"],"syn":[],"ex":[{"en":"She [[counted out]] ten coins onto the counter.","zh":"她把十枚硬币一枚一枚数到柜台上。"},{"en":"The cashier [[counted out]] the change slowly.","zh":"收银员慢慢地数出找零。"}],"from":"Long Live Cash","ctx":"Regulars count out coins at the counter, while visitors fumble for their wallets and look around for a card reader that is not there."},{"id":17,"ref":"long-live-cash:1","m":["fumble for"],"expr":"fumble for","zh":"摸索着找（东西）","note":"","core":"fumble for","forms":["fumble for","fumbles for","fumbled for","fumbling for"],"syn":[],"ex":[{"en":"He [[fumbled for]] his keys in the dark.","zh":"他在黑暗里摸索着找钥匙。"},{"en":"She stood at the gate, [[fumbling for]] her ticket.","zh":"她站在检票口，在包里摸索着找车票。"}],"from":"Long Live Cash","ctx":"Regulars count out coins at the counter, while visitors fumble for their wallets and look around for a card reader that is not there."},{"id":18,"ref":"long-live-cash:47","m":["card reader"],"expr":"reader (card reader)","zh":"读卡器；刷卡、扫码、碰手机的设备","note":"注意：这里的 reader 不是“读者”，而是收银台上那台能读取银行卡、手机信息的小机器，也叫 card reader。wave a phone at the reader = 拿手机对着那台机器一晃。同一个词，靠上下文区分：能挥手机对着晃的，不可能是“读者”。","core":"reader","forms":["reader","readers","card reader"],"syn":["card machine"],"ex":[{"en":"Hold your card against the [[reader]] until it beeps.","zh":"把卡贴在读卡器上，直到它嘀的一声。"},{"en":"There is a [[reader]] by the bus door for travel cards.","zh":"公交车门边有一个读卡器，用来刷交通卡。"}],"from":"Long Live Cash","ctx":"Regulars count out coins at the counter, while visitors fumble for their wallets and look around for a card reader that is not there."},{"id":19,"ref":"long-live-cash:50","m":["sees it differently"],"expr":"see sth differently","zh":"对……看法不同","note":"这里的 see 不是“看见”，而是“看待、理解”：see A as B（把 A 看成 B）、see things differently（看法不同）。it 指上一句里“像时间胶囊”的印象：游客觉得这是怀旧，而官员不这么看。","core":"see it differently","forms":["see it differently","sees it differently","saw it differently","seeing it differently"],"syn":[],"ex":[{"en":"My brother and I [[see it differently]], and neither will give way.","zh":"我哥哥和我看法不同，谁也不肯让步。"},{"en":"Economists [[see it differently]]: for them, the trend is a warning.","zh":"经济学家的看法不同：在他们眼里，这个趋势是个警告。"}],"from":"Long Live Cash","ctx":"Mr Sato sees it differently from his younger customers: card firms take a slice of every sale, and he already lives on thin margins."},{"id":20,"ref":"long-live-cash:16","m":["a slice of"],"expr":"a slice of","zh":"一份、一部分（常指分走的那一份）","note":"","core":"slice of","forms":["slice of","a slice of","slices of"],"syn":[],"ex":[{"en":"The agency takes [[a slice of]] every sale.","zh":"中介从每一笔销售里抽走一份。"},{"en":"Tourism brings the town [[a slice of]] new income.","zh":"旅游给这个小镇带来了一部分新收入。"}],"from":"Long Live Cash","ctx":"Mr Sato sees it differently from his younger customers: card firms take a slice of every sale, and he already lives on thin margins."},{"id":21,"ref":"long-live-cash:17","m":["thin margins"],"expr":"thin margins","zh":"利润微薄","note":"对应说法：fat margins（利润丰厚）。","core":"thin margins","forms":["thin margins","thin margin"],"syn":[],"ex":[{"en":"Supermarkets operate on [[thin margins]].","zh":"超市是靠微薄的利润率运转的。"},{"en":"Small farms with [[thin margins]] cannot survive a bad harvest.","zh":"利润微薄的小农场扛不住一次歉收。"}],"from":"Long Live Cash","ctx":"Mr Sato sees it differently from his younger customers: card firms take a slice of every sale, and he already lives on thin margins."},{"id":22,"ref":"long-live-cash:58","m":["not broken"],"expr":"not broken (If it ain't broke, don't fix it)","zh":"没坏（没坏就别修）","note":"这半句化用了俗语 If it ain't broke, don't fix it（没坏就别修）：现有办法还管用，就别折腾着去改。ain't 是美式口语的 isn't；英国也常说 If it isn't broken, don't fix it。后面的 so there is little to fix 呼应：little（不加 a）表示“几乎没有”，a little 才是“一点”。","core":"not broken","forms":["not broken","isn't broken","is not broken"],"syn":[],"ex":[{"en":"The printer is old but [[not broken]], so we kept it.","zh":"这台打印机虽旧但没坏，所以我们留着它。"},{"en":"If the system is [[not broken]], don't fix it.","zh":"系统要是没坏，就别去修它。"}],"from":"Long Live Cash","ctx":"Cash, he argues, is not broken, so there is no reason to fix it."},{"id":23,"ref":"finders-keepers:15","m":["Counterintuitively"],"expr":"counterintuitively","zh":"违反直觉地","note":"","core":"counterintuitively","forms":["counterintuitively"],"syn":[],"ex":[{"en":"[[Counterintuitively]], students who rested more scored higher.","zh":"违反直觉的是，休息得更多的学生分数反而更高。"},{"en":"[[Counterintuitively]], a smaller team often finishes the project faster.","zh":"违反直觉的是，人少的团队往往完成项目更快。"}],"from":"Finders, Keepers","ctx":"Counterintuitively, refusing cards may even save him money."},{"id":24,"ref":"long-live-cash:61","m":["Whereas"],"expr":"whereas","zh":"而、然而（对比两件事）","note":"whereas 连接两个形成对比的分句：A is X, whereas B is Y。比 while 更正式，也不会像 while 那样可能被读成“当……的时候”，多用于书面语、论文、合同。这里前半句顾客不用付钱，后半句商家要交抽成，一边无成本，一边有成本。","core":"whereas","forms":["whereas"],"syn":["while"],"ex":[{"en":"Some pupils love maths, [[whereas]] others find it dull.","zh":"有些学生喜欢数学，而另一些学生觉得它乏味。"},{"en":"The north is wet, [[whereas]] the south is dry.","zh":"北部多雨，而南部干燥。"}],"from":"Long Live Cash","ctx":"Whereas a card payment costs him a fee, a coin dropped into the till costs him nothing extra."},{"id":25,"ref":"long-live-cash:60","m":["nothing extra"],"expr":"nothing extra","zh":"没有额外的（东西）、不用多付","note":"something / anything / nothing / someone 这类不定代词，形容词要放在后面：nothing special、something new、nothing extra。pay nothing extra = 不用多付钱；相近的说法 at no extra cost = 不收额外费用。","core":"nothing extra","forms":["nothing extra","pay nothing extra"],"syn":["at no extra cost"],"ex":[{"en":"Delivery is included, so you pay [[nothing extra]].","zh":"送货费已经包含在内，所以你不用多付钱。"},{"en":"You can change the date for [[nothing extra]].","zh":"改日期不另外收费。"}],"from":"Long Live Cash","ctx":"Whereas a card payment costs him a fee, a coin dropped into the till costs him nothing extra."},{"id":26,"ref":"konbini:2","m":["strain on"],"expr":"the strain on sth","zh":"……承受的压力","note":"strain 指长期的压力、负担。put a strain on sth = 给……造成压力；under strain = 承受着压力。","core":"strain on","forms":["strain on","strain"],"syn":[],"ex":[{"en":"The heatwave put a huge [[strain on]] the power grid.","zh":"热浪给电网造成了巨大压力。"},{"en":"Long hours are taking a toll; you can see the [[strain on]] her face.","zh":"长时间工作让她吃不消，脸上都能看出疲惫。"}],"from":"Konbini","ctx":"The real strain on the business is not money but people."},{"id":27,"ref":"konbini:26","m":["working-age population"],"expr":"working-age population","zh":"劳动年龄人口","note":"一般指十五到六十四岁的人。working-age 作定语时加连字符：working-age adults。","core":"working-age population","forms":["working-age population","working age population"],"syn":[],"ex":[{"en":"The country's [[working-age population]] is falling.","zh":"这个国家的劳动年龄人口在减少。"},{"en":"A shrinking [[working-age population]] means fewer taxpayers.","zh":"劳动年龄人口减少，意味着纳税人变少。"}],"from":"Konbini","ctx":"Like the rest of Japan, the town's working-age population is shrinking."},{"id":28,"ref":"long-live-cash:28","m":["shrinking"],"expr":"shrink","zh":"缩小、萎缩","note":"","core":"shrink","forms":["shrink","shrinks","shrank","shrunk","shrinking"],"syn":[],"ex":[{"en":"The town's population has [[shrunk]] by a third.","zh":"这个镇的人口减少了三分之一。"},{"en":"Profits [[shrank]] as costs rose.","zh":"成本上升，利润随之缩水。"}],"from":"Long Live Cash","ctx":"Like the rest of Japan, the town's working-age population is shrinking."},{"id":29,"ref":"konbini:5","m":["grown scarce"],"expr":"grow scarce","zh":"变得稀缺","note":"grow + 形容词表示慢慢变成某种状态：grow old、grow dark、grow tired。scarce = 稀少的、不够的。","core":"grow scarce","forms":["grow scarce","grows scarce","grew scarce","growing scarce","become scarce","scarce"],"syn":[],"ex":[{"en":"Water [[grew scarce]] as the summer went on.","zh":"随着夏天过去，水越来越少。"},{"en":"Cheap flats are [[growing scarce]] in the city centre.","zh":"市中心便宜的公寓越来越难找。"}],"from":"Konbini","ctx":"Bakers willing to start at four in the morning have grown scarce, and the job is among the first to go unfilled."},{"id":30,"ref":"konbini:43","m":["among the first to"],"expr":"among the first to do sth","zh":"最早做某事的那一批之一","note":"among 表示“在一群之中”，所以说的是“最早的几个之一”，不一定是第一个。反过来可以说 among the last to do sth（最晚的那一批）。也可以不接动词：among the first in line（排在最前面的几个人里）。","core":"among the first to","forms":["among the first to","among the first","among the last to"],"syn":[],"ex":[{"en":"She was [[among the first to]] arrive at the party.","zh":"她是最早到聚会的几个人之一。"},{"en":"Our town was [[among the first to]] get fast internet.","zh":"我们镇是最早通上高速网络的地方之一。"},{"en":"Nurses are often [[among the first to]] notice a problem.","zh":"护士往往是最早发现问题的人。"}],"from":"Konbini","ctx":"Bakers willing to start at four in the morning have grown scarce, and the job is among the first to go unfilled."},{"id":31,"ref":"konbini:27","m":["go unfilled"],"expr":"go unfilled","zh":"（职位）一直空着、招不到人","note":"go + 带 un- 的过去分词，表示某事没有发生：go unnoticed（没被注意到）、go unpaid（没拿到钱）。","core":"go unfilled","forms":["go unfilled","goes unfilled","went unfilled","gone unfilled"],"syn":[],"ex":[{"en":"Many teaching jobs [[go unfilled]] every year.","zh":"每年都有很多教师岗位招不到人。"},{"en":"The post [[went unfilled]] for six months.","zh":"这个职位空了六个月。"}],"from":"Konbini","ctx":"Bakers willing to start at four in the morning have grown scarce, and the job is among the first to go unfilled."},{"id":32,"ref":"konbini:30","m":["For weeks on end"],"expr":"for weeks on end","zh":"一连好几周","note":"on end 表示连续不断，也可以说 for hours on end、for days on end。","core":"for weeks on end","forms":["for weeks on end","for days on end","for hours on end","on end"],"syn":[],"ex":[{"en":"It rained [[for weeks on end]].","zh":"雨一连下了好几周。"},{"en":"He played video games [[for hours on end]].","zh":"他一连几个小时打游戏。"}],"from":"Konbini","ctx":"For weeks on end last winter, Mr Sato and his wife covered the gaps themselves, working almost around the clock."},{"id":33,"ref":"konbini:29","m":["covered the gaps"],"expr":"cover the gaps","zh":"填补空缺","note":"cover 有“顶替、代班”的意思：Can you cover for me on Friday? = 周五你能替我上班吗？","core":"cover the gaps","forms":["cover the gaps","covered the gaps","covering the gaps","cover the gap"],"syn":[],"ex":[{"en":"Volunteers [[cover the gaps]] when staff are off sick.","zh":"员工生病请假时，由志愿者顶上。"},{"en":"We hired temps to [[cover the gap]] over the summer.","zh":"我们招了临时工来填补暑期的空缺。"}],"from":"Konbini","ctx":"For weeks on end last winter, Mr Sato and his wife covered the gaps themselves, working almost around the clock."},{"id":34,"ref":"konbini:24","m":["around the clock"],"expr":"around the clock","zh":"昼夜不停、二十四小时","note":"也说 round the clock。作形容词时加连字符：round-the-clock care（全天候护理）。","core":"around the clock","forms":["around the clock","round the clock"],"syn":[],"ex":[{"en":"Nurses work [[around the clock]] in this ward.","zh":"这个病房的护士全天轮班。"},{"en":"The team worked [[round the clock]] to fix the bug.","zh":"团队连轴转修这个漏洞。"}],"from":"Konbini","ctx":"For weeks on end last winter, Mr Sato and his wife covered the gaps themselves, working almost around the clock."},{"id":35,"ref":"long-live-cash:64","m":["has long"],"expr":"have long + past participle","zh":"早就……、一直……了很久","note":"long 在这里是副词，意思是“很长时间地”，放在助动词 have 和过去分词之间：have long tried = 早就一直在尝试。类似：have long been（早就是）、has long argued（一直主张）、had long known（早就知道）。书面语里很常见，比 for a long time 简洁。注意 long 不是动词，句子的谓语是 have tried to。","core":"have long","forms":["have long","has long","had long"],"syn":[],"ex":[{"en":"Scientists [[have long]] suspected a link between the two.","zh":"科学家们早就怀疑两者之间有联系。"},{"en":"The village [[has long]] relied on tourism.","zh":"这个村子长期以来靠旅游业过活。"}],"from":"Long Live Cash","ctx":"His son, who has long lived in Osaka, has grudgingly offered to help at weekends."},{"id":36,"ref":"long-live-cash:18","m":["grudgingly"],"expr":"grudgingly","zh":"勉强地、不情愿地","note":"","core":"grudgingly","forms":["grudgingly"],"syn":["reluctantly"],"ex":[{"en":"He [[grudgingly]] admitted that she was right.","zh":"他勉强承认她是对的。"},{"en":"The council [[grudgingly]] approved the plan.","zh":"市议会不情不愿地批准了这个计划。"}],"from":"Long Live Cash","ctx":"His son, who has long lived in Osaka, has grudgingly offered to help at weekends."},{"id":37,"ref":"konbini:38","m":["for granted"],"expr":"take sth for granted","zh":"把……视为理所当然","note":"take sth for granted；宾语长或是从句时可以说 take it for granted that ...。也常用于人：Don't take your parents for granted.","core":"take for granted","forms":["take for granted","takes for granted","took for granted","taken for granted","for granted"],"syn":[],"ex":[{"en":"We [[take for granted]] that the lights will come on.","zh":"我们理所当然地认为灯会亮。"},{"en":"Clean water is easy to take [[for granted]].","zh":"干净的水很容易被当作理所当然。"}],"from":"Konbini","ctx":"Mr Sato does not take that for granted."},{"id":38,"ref":"long-live-cash:8","m":["coax"],"expr":"coax","zh":"连哄带劝地使（做某事）","note":"常用结构 coax sb into doing sth；也可以 coax sb to do sth。","core":"coax","forms":["coax","coaxes","coaxed","coaxing"],"syn":[],"ex":[{"en":"She [[coaxed]] the shy cat out from under the sofa.","zh":"她把害羞的猫从沙发底下哄了出来。"},{"en":"He tried to [[coax]] his grandmother into using a smartphone.","zh":"他想哄着奶奶用上智能手机。"}],"from":"Long Live Cash","ctx":"A consultant from the city once tried to coax him into opening a second shop, with a card reader, self-checkout and a website."},{"id":39,"ref":"long-live-cash:65","m":["incentive"],"expr":"incentive","zh":"激励、刺激（措施）","note":"incentive 指能让人愿意做某事的好处，如奖励、返利、减税：financial incentive（经济激励）。常见结构 an incentive to do sth / for sb to do sth。反义词 disincentive（抑制因素）。重音在第二个音节：in-CEN-tive。","core":"incentive","forms":["incentive","incentives"],"syn":["inducement"],"ex":[{"en":"Tax breaks give firms an [[incentive]] to hire locally.","zh":"减税给了企业在本地雇人的动力。"},{"en":"The scheme offers [[incentives]] for people to recycle.","zh":"这个计划为鼓励回收提供各种激励。"}],"from":"Long Live Cash","ctx":"The incentive was clear: more customers and a hefty share of the tourist trade."},{"id":40,"ref":"konbini:19","m":["hefty share"],"expr":"a hefty share of","zh":"相当大的一部分","note":"hefty 原指又大又重，也常修饰钱：a hefty fine（一大笔罚款）、a hefty bill（一大笔账单）。","core":"hefty share","forms":["hefty share","hefty"],"syn":[],"ex":[{"en":"Rent takes a [[hefty share]] of my salary.","zh":"房租占了我工资的一大块。"},{"en":"He paid a [[hefty]] fine for speeding.","zh":"他因为超速交了一大笔罚款。"}],"from":"Konbini","ctx":"The incentive was clear: more customers and a hefty share of the tourist trade."},{"id":41,"ref":"long-live-cash:15","m":["handed over"],"expr":"hand over","zh":"交出、移交","note":"","core":"hand over","forms":["hand over","hands over","handed over","handing over"],"syn":[],"ex":[{"en":"Please [[hand over]] your passport at the desk.","zh":"请在前台交出您的护照。"},{"en":"The company had to [[hand over]] all its records to the regulator.","zh":"公司不得不把全部记录交给监管机构。"}],"from":"Long Live Cash","ctx":"Mr Sato listened politely, handed over a free loaf, and said no."},{"id":42,"ref":"long-live-cash:2","m":["rational"],"expr":"rational","zh":"理性的、合乎道理的","note":"反义词 irrational 出现在全文倒数第四句。","core":"rational","forms":["rational"],"syn":[],"ex":[{"en":"It was a [[rational]] decision, not an emotional one.","zh":"那是个理性的决定，不是感情用事。"},{"en":"Few people stay fully [[rational]] when they are afraid.","zh":"很少有人在害怕的时候还能完全保持理性。"}],"from":"Long Live Cash","ctx":"His reasoning was more rational than it looked."},{"id":43,"ref":"konbini:16","m":["rest on"],"expr":"rest on","zh":"建立在……上、取决于","note":"rest on 的主语常是计划、论点、成功等抽象的东西：The plan rests on one assumption.","core":"rest on","forms":["rest on","rests on","rested on","resting on"],"syn":[],"ex":[{"en":"The whole plan [[rests on]] one big guess.","zh":"整个计划都建立在一个大胆的猜测上。"},{"en":"Her case [[rested on]] a single witness.","zh":"她的说法全靠一个证人。"}],"from":"Konbini","ctx":"A bigger business would rest on borrowed money and leave little room for error; a small one can live with a bad month."},{"id":44,"ref":"konbini:17","m":["room for error"],"expr":"room for error","zh":"出错的余地","note":"room 作不可数名词时是“空间、余地”。little / no room for error = 几乎不能出错；room for improvement = 有改进的余地。","core":"room for error","forms":["room for error","room for"],"syn":[],"ex":[{"en":"With only ten minutes left, there is no [[room for error]].","zh":"只剩十分钟了，一点也不能出错。"},{"en":"Pilots are trained because there is little [[room for error]].","zh":"飞行员要经过训练，因为几乎容不得出错。"}],"from":"Konbini","ctx":"A bigger business would rest on borrowed money and leave little room for error; a small one can live with a bad month."},{"id":45,"ref":"long-live-cash:54","m":["live with"],"expr":"live with","zh":"与……共存；忍受并习惯","note":"live with 除了“和……同住”，还常指“接受并习惯某种不好的状况”：learn to live with pain（学会与疼痛共处）。a country that lives with earthquakes = 一个把地震当作日常的国家。","core":"live with","forms":["live with","lives with","lived with","living with"],"syn":[],"ex":[{"en":"Many coastal towns [[live with]] the threat of flooding.","zh":"许多沿海城镇与洪水的威胁共存。"},{"en":"You will just have to [[live with]] the noise.","zh":"这噪音你只能忍着了。"}],"from":"Long Live Cash","ctx":"A bigger business would rest on borrowed money and leave little room for error; a small one can live with a bad month."},{"id":46,"ref":"konbini:34","m":["chip away at"],"expr":"chip away at","zh":"一点点削弱","note":"chip 是“削下碎片”。chip away at sth 指一点一点削弱、蚕食：chip away at trust（一点点消磨信任）。","core":"chip away at","forms":["chip away at","chips away at","chipped away at","chipping away at"],"syn":[],"ex":[{"en":"Small lies [[chip away at]] trust.","zh":"一个个小谎言会慢慢消磨信任。"},{"en":"Rising prices are [[chipping away at]] people's savings.","zh":"物价上涨正一点点吃掉人们的积蓄。"}],"from":"Konbini","ctx":"Every shortcut, he believes, would chip away at what made the shop indispensable in the first place."},{"id":47,"ref":"konbini:35","m":["indispensable"],"expr":"indispensable","zh":"不可或缺的","note":"in- 否定 + dispense with（免掉、不用）+ -able，字面是“免不掉的”。同义 essential，比 important 更强。","core":"indispensable","forms":["indispensable"],"syn":[],"ex":[{"en":"A good map is [[indispensable]] on this hike.","zh":"走这条徒步路线，一张好地图必不可少。"},{"en":"She made herself [[indispensable]] to the team.","zh":"她让自己在团队里不可或缺。"}],"from":"Konbini","ctx":"Every shortcut, he believes, would chip away at what made the shop indispensable in the first place."},{"id":48,"ref":"konbini:36","m":["in the first place"],"expr":"in the first place","zh":"当初、原本","note":"常用来追问最初的原因：Why did you buy it in the first place? = 你当初为什么要买它？","core":"in the first place","forms":["in the first place"],"syn":[],"ex":[{"en":"Why did you agree to it [[in the first place]]?","zh":"你当初为什么要答应？"},{"en":"The rules that made the town safe [[in the first place]] are now being dropped.","zh":"当初让小镇安全的那些规定，现在正在被取消。"}],"from":"Konbini","ctx":"Every shortcut, he believes, would chip away at what made the shop indispensable in the first place."},{"id":49,"ref":"konbini:11","m":["grown into"],"expr":"grow into","zh":"发展成、长成","note":"grow into 强调慢慢变成另一种东西：The village has grown into a town. 也可说孩子“长大到穿得下”：He will grow into the coat.","core":"grow into","forms":["grow into","grows into","grew into","grown into","growing into"],"syn":[],"ex":[{"en":"The small café has [[grown into]] a chain of 30 shops.","zh":"那家小咖啡馆已经发展成有三十家店的连锁品牌。"},{"en":"The hobby slowly [[grew into]] a business.","zh":"这个爱好慢慢变成了一门生意。"}],"from":"Konbini","ctx":"Over the decades, the bakery has grown into something like a public utility."},{"id":50,"ref":"konbini:12","m":["public utility"],"expr":"public utility","zh":"公用事业（水电燃气等）","note":"utility 单用也可以指水电燃气这类服务，utility bills = 水电煤气费。文中说便利店“像公用事业”，是说人人离不开它。","core":"public utility","forms":["public utility","public utilities","utility"],"syn":[],"ex":[{"en":"Water is treated as a [[public utility]] in most countries.","zh":"在大多数国家，供水被当作公用事业。"},{"en":"For many people, the internet is now a [[public utility]].","zh":"对很多人来说，网络如今就是一种公用事业。"}],"from":"Konbini","ctx":"Over the decades, the bakery has grown into something like a public utility."},{"id":51,"ref":"konbini:15","m":["count on"],"expr":"count on","zh":"指望、依靠","note":"count on sb / count on sb to do sth。You can count on me. = 你可以靠我。同义：rely on, depend on。","core":"count on","forms":["count on","counts on","counted on","counting on"],"syn":[],"ex":[{"en":"You can [[count on]] her to be on time.","zh":"你可以放心，她一定准时。"},{"en":"We were [[counting on]] good weather for the picnic.","zh":"我们本来指望野餐那天天气好。"}],"from":"Konbini","ctx":"The town has come to count on it, largely because it is always open."},{"id":52,"ref":"finders-keepers:26","m":["largely"],"expr":"largely (= mostly)","zh":"adv. 基本上；主要地；大体上","note":"largely unnoticed：基本没人注意到。别和形容词 large 搞混。","core":"largely","forms":["largely"],"syn":["mostly","mainly"],"ex":[{"en":"The report was [[largely]] ignored by the press.","zh":"这份报告基本上被媒体忽视了。"},{"en":"The delay was [[largely]] due to bad weather.","zh":"这次延误主要是因为天气不好。"},{"en":"The city is [[largely]] safe, though a few areas need caution.","zh":"这座城市基本上是安全的，不过有几个区域需要小心。"}],"from":"Finders, Keepers","ctx":"The town has come to count on it, largely because it is always open."},{"id":53,"ref":"konbini:13","m":["collect"],"expr":"collect (a parcel)","zh":"领取（包裹等）","note":"英式常说 collect a parcel / collect the children from school；美式更常用 pick up。","core":"collect","forms":["collect","collects","collected","collecting"],"syn":[],"ex":[{"en":"You can [[collect]] your order from the shop after five.","zh":"五点以后可以到店里取你订的东西。"},{"en":"I [[collected]] the kids from school.","zh":"我去学校接了孩子。"}],"from":"Konbini","ctx":"Neighbours leave parcels there for each other to collect, and anyone who finds a lost possession hands it in at the counter."},{"id":54,"ref":"finders-keepers:30","m":["possession"],"expr":"possession","zh":"n. 个人财产；所有物","note":"指随身物品时多用复数 possessions；in possession of ……：持有、拥有。","core":"possession","forms":["possession","possessions"],"syn":["belonging","belongings"],"ex":[{"en":"Her most treasured [[possession]] is an old camera from her grandfather.","zh":"她最珍视的物品是祖父留下的一台旧相机。"},{"en":"Passengers are asked to keep their [[possessions]] with them at all times.","zh":"请乘客随时随身携带好个人物品。"},{"en":"The police found him in [[possession]] of a stolen wallet.","zh":"警方发现他持有一个被盗的钱包。"}],"from":"Finders, Keepers","ctx":"Neighbours leave parcels there for each other to collect, and anyone who finds a lost possession hands it in at the counter."},{"id":55,"ref":"finders-keepers:32","m":["hands it in"],"expr":"hand in","zh":"上交；提交（作业、失物、辞呈等）","note":"可以拆开用：hand it in。hand in 偏“交上去”，hand over 偏“移交”。","core":"hand in","forms":["hand in","hands in","handed in","handing in"],"syn":["turn in","turns in","turned in","turning in","submit","submits","submitted","submitting"],"ex":[{"en":"Please [[hand in]] your essays by Friday.","zh":"请在周五之前交上论文。"},{"en":"She [[handed in]] the lost wallet at the nearest police box.","zh":"她把捡到的钱包交给了最近的警亭。"},{"en":"He [[handed in]] his notice last week.","zh":"他上周递交了辞呈。"}],"from":"Finders, Keepers","ctx":"Neighbours leave parcels there for each other to collect, and anyone who finds a lost possession hands it in at the counter."},{"id":56,"ref":"finders-keepers:34","m":["Reportedly"],"expr":"reportedly","zh":"adv. 据报道；据说","note":"消息来自报道或传闻，作者并没有亲自核实，新闻里很常见。","core":"reportedly","forms":["reportedly"],"syn":[],"ex":[{"en":"The singer has [[reportedly]] cancelled her tour.","zh":"据报道，这位歌手已经取消了巡演。"},{"en":"The company [[reportedly]] lost millions last year.","zh":"据说这家公司去年亏损了数百万。"},{"en":"He was [[reportedly]] furious when he heard the news.","zh":"据说他听到消息时非常愤怒。"}],"from":"Finders, Keepers","ctx":"Reportedly, the shop has returned more lost wallets than the local police box."},{"id":57,"ref":"finders-keepers:33","m":["In practice"],"expr":"in practice (↔ in theory)","zh":"事实上；实际上（对比：in theory 理论上）","note":"常和 in theory 成对出现：理论上如何，实际上却不一定。","core":"in practice","forms":["in practice"],"syn":[],"ex":[{"en":"In theory the system is simple; [[in practice]], it takes hours.","zh":"理论上这个系统很简单，实际操作起来却要花好几个小时。"},{"en":"The rule applies to everyone, but [[in practice]] it is rarely enforced.","zh":"这条规定对所有人适用，但实际上很少被执行。"},{"en":"[[In practice]], most people just click “accept” without reading.","zh":"实际上，大多数人根本不看就点了“同意”。"}],"from":"Finders, Keepers","ctx":"In practice, it works as a small civic centre."},{"id":58,"ref":"finders-keepers:25","m":["civic"],"expr":"civic","zh":"adj. 市民的；公民的；城市的","note":"常见搭配：civic duty 公民义务 / civic pride 城市自豪感 / civic life 公共生活","core":"civic","forms":["civic"],"syn":[],"ex":[{"en":"Many people see voting as a [[civic]] duty.","zh":"很多人把投票看作公民的义务。"},{"en":"The town hall is the centre of [[civic]] life.","zh":"市政厅是这座城市公共生活的中心。"},{"en":"Residents showed real [[civic]] pride after the park was restored.","zh":"公园修复之后，居民们表现出强烈的城市自豪感。"}],"from":"Finders, Keepers","ctx":"In practice, it works as a small civic centre."},{"id":59,"ref":"finders-keepers:37","m":["virtue"],"expr":"virtue","zh":"n. 美德；优点","note":"by virtue of ……：凭借、由于（较正式）。","core":"virtue","forms":["virtue","virtues"],"syn":[],"ex":[{"en":"Patience is a [[virtue]].","zh":"耐心是一种美德。"},{"en":"The plan's main [[virtue]] is its simplicity.","zh":"这个方案最大的优点就是简单。"},{"en":"She got the job [[by virtue of]] her experience, not her connections.","zh":"她得到这份工作是凭借经验，而不是人脉。"}],"from":"Finders, Keepers","ctx":"Its virtue lies in the people who stop by, not merely in what they buy."},{"id":60,"ref":"finders-keepers:35","m":["lies in"],"expr":"lie in ...","zh":"在于……（原因、关键所在）","note":"lie（位于；在于）的变形是 lie – lay – lain，三单 lies；撒谎的 lie 过去式才是 lied。","core":"lie in","forms":["lie in","lies in","lay in","lain in","lying in"],"syn":[],"ex":[{"en":"The secret of her success [[lies in]] hard work, not talent.","zh":"她成功的秘诀在于努力，而不是天赋。"},{"en":"The problem [[lies in]] how the data is collected.","zh":"问题出在数据的收集方式上。"},{"en":"The charm of the old town [[lies in]] its narrow streets.","zh":"这座老城的魅力就在于那些狭窄的街道。"}],"from":"Finders, Keepers","ctx":"Its virtue lies in the people who stop by, not merely in what they buy."},{"id":61,"ref":"finders-keepers:36","m":["not merely"],"expr":"not merely","zh":"不仅仅（是）","note":"比 not only 更书面；常见结构 not merely A but (also) B。","core":"not merely","forms":["not merely"],"syn":["not just","not only","not simply"],"ex":[{"en":"The museum is [[not merely]] a building but a living archive.","zh":"这座博物馆不仅仅是一栋建筑，更是一座活的档案馆。"},{"en":"It is [[not merely]] a matter of money.","zh":"这不仅仅是钱的问题。"},{"en":"She is [[not merely]] talented; she is also relentlessly disciplined.","zh":"她不仅仅有天赋，还自律得近乎苛刻。"}],"from":"Finders, Keepers","ctx":"Its virtue lies in the people who stop by, not merely in what they buy."},{"id":62,"ref":"finders-keepers:38","m":["No amount of"],"expr":"no amount of ... will ...","zh":"再多的……也不会……","note":"amount 后面接不可数名词；后半句常用 will / can。","core":"no amount of","forms":["no amount of","no amount of will"],"syn":[],"ex":[{"en":"[[No amount of]] apologies will undo the damage.","zh":"再多的道歉也无法挽回这些损失。"},{"en":"[[No amount of]] coffee will make me enjoy Monday mornings.","zh":"再多的咖啡也不会让我爱上周一的早晨。"},{"en":"[[No amount of]] training will make up for a lack of curiosity.","zh":"再多的训练也弥补不了好奇心的缺失。"}],"from":"Finders, Keepers","ctx":"No amount of clever marketing will replace that."},{"id":63,"ref":"long-live-cash:26","m":["tip the balance"],"expr":"tip the balance","zh":"起决定作用、打破平衡","note":"","core":"tip the balance","forms":["tip the balance","tips the balance","tipped the balance","tipping the balance"],"syn":[],"ex":[{"en":"One late goal [[tipped the balance]] in their favour.","zh":"一个绝杀球让天平倒向了他们这边。"},{"en":"A small tax cut could [[tip the balance]] for undecided voters.","zh":"小小的减税就可能让犹豫不决的选民做出决定。"}],"from":"Long Live Cash","ctx":"Still, rising costs may soon tip the balance."},{"id":64,"ref":"long-live-cash:23","m":["crept upward"],"expr":"creep upward","zh":"缓慢上升","note":"也可以说 creep up。","core":"creep upward","forms":["creep upward","creeps upward","crept upward","creeping upward"],"syn":[],"ex":[{"en":"Inflation has been [[creeping upward]] all year.","zh":"通胀一整年都在缓慢上升。"},{"en":"Unemployment [[crept upward]] for three months in a row.","zh":"失业率连续三个月缓慢上升。"}],"from":"Long Live Cash","ctx":"Flour and electricity prices have crept upward for three years, and the savings that propped up the shop through bad times are running out."},{"id":65,"ref":"konbini:39","m":["propped up"],"expr":"prop up","zh":"支撑、撑住","note":"prop 是支柱。prop up 常指撑住本来会倒的东西，也用于经济：prop up a failing bank（救助一家快倒的银行）。","core":"prop up","forms":["prop up","props up","propped up","propping up"],"syn":[],"ex":[{"en":"The old wall is [[propped up]] with wooden beams.","zh":"那堵旧墙用木梁撑着。"},{"en":"The government spent billions to [[prop up]] the airline.","zh":"政府花了几十亿救助那家航空公司。"}],"from":"Konbini","ctx":"Flour and electricity prices have crept upward for three years, and the savings that propped up the shop through bad times are running out."},{"id":66,"ref":"long-live-cash:25","m":["running out"],"expr":"run out","zh":"（钱、时间、供应）用完","note":"run out of sth 才是“用完了某物”，run out 的主语是被用完的东西。","core":"run out","forms":["run out","runs out","ran out","running out"],"syn":[],"ex":[{"en":"We must finish before the funding [[runs out]].","zh":"我们必须在资金用完之前完成。"},{"en":"The patience of the voters finally [[ran out]].","zh":"选民们的耐心终于耗尽了。"}],"from":"Long Live Cash","ctx":"Flour and electricity prices have crept upward for three years, and the savings that propped up the shop through bad times are running out."},{"id":67,"ref":"konbini:42","m":["Sooner or later"],"expr":"sooner or later","zh":"迟早","note":"表示某事终究会发生。也可说 eventually。","core":"sooner or later","forms":["sooner or later"],"syn":[],"ex":[{"en":"[[Sooner or later]], you will have to tell her.","zh":"你迟早得告诉她。"},{"en":"Everyone makes that mistake [[sooner or later]].","zh":"每个人迟早都会犯这个错。"}],"from":"Konbini","ctx":"Sooner or later, Mr Sato will have to decide whether the bakery stands to gain more from changing than from staying the same."},{"id":68,"ref":"long-live-cash:35","m":["stands to gain"],"expr":"stand to gain","zh":"有可能获益","note":"对应说法：stand to lose（有可能受损）。","core":"stand to gain","forms":["stand to gain","stands to gain","stood to gain"],"syn":[],"ex":[{"en":"Exporters [[stand to gain]] from a weaker currency.","zh":"货币走弱，出口商有可能受益。"},{"en":"Who [[stands to gain]] most from the merger?","zh":"这次合并，谁可能获益最多？"}],"from":"Long Live Cash","ctx":"Sooner or later, Mr Sato will have to /* ---------- vocabulary highlighting ---------- */
function marked(text, opt){
  opt = opt || {};
  if (!(opt.force || ui.hi)) return [document.createTextNode(text)];
  const out = [];
  let last = 0, m;
  TERM_RE.lastIndex = 0;
  while ((m = TERM_RE.exec(text))){
    const id = TERM_MAP[m[0].toLowerCase()];
    if (opt.only && opt.only !== id) continue;
    if (m.index > last) out.push(document.createTextNode(text.slice(last, m.index)));
    out.push(h('mark', {class:'vw', 'data-v':id, title:VMAP[id].zh}, m[0]));
    last = m.index + m[0].length;
  }
  if (last < text.length) out.push(document.createTextNode(text.slice(last)));
  return out;
}

  const row = h('div', {class:'row'});
  if (misses.length) row.append(h('button', {type:'button', class:'btn pri', onclick:function(){ startQuiz('all', misses.map(function(m){ return m.id; })); }}, '重做错题'));
  row.append(h('button', {type:'button', class:'btn' + (misses.length ? '' : ' pri'), onclick:function(){ quiz.phase = 'start'; renderQuiz(); }}, '换个题型再测'));
  row.append(h('button', {type:'button', class:'btn', onclick:function(){ showTab('words'); try { location.hash = 'words'; } catch(e){} }}, '去词汇表'));
  row.append(h('a', {class:'btn', href:REVIEW_URL}, '去复习页'));
  if (quiz.hist.length) row.append(h('button', {type:'button', class:'btn', onclick:function(){
    Kit.pager($('#quizBox'), quiz.hist, null, {close:renderQuiz});
    window.scrollTo(0, 0);
  }}, '逐题回看'));
  card.append(row);
  return card;
}

/* ---------- think tab (the long-sentence breakdown) ---------- */
function renderThink(){
  const box = $('#thinkBox');
  box.replaceChildren();
  const bd = DATA.breakdown;
  DATA.vocab.filter(function(v){ return v.kind === 'grammar'; }).forEach(function(v){
    box.append(h('div', {class:'card mb16'},
      h('div', {class:'w-head'}, h('h3', {class:'w-expr'}, v.expr), speakBtn('w' + v.id, v.say || v.core)),
      h('p', {class:'w-zh'}, v.zh),
      v.conn ? h('p', {class:'g-conn'}, h('span', {class:'meta'}, LANG === 'ja' ? '接续　' : '结构　'), v.conn) : null,
      v.note ? h('p', {class:'w-note'}, v.note) : null,
      h('ul', {class:'w-ex'}, v.ex.map(function(x, k){
        return h('li', {class:'ex-row'}, speakBtn('e' + v.id + '_' + k, exPlain(x.en)), h('div', {class:'ex-body'}, h('span', {class:'ex-en'}, exNodes(x.en)), x.rom ? h('span', {class:'rom'}, x.rom) : null, h('span', {class:'ex-zh'}, x.zh)));
      }))));
  });
  box.append(h('div', {class:'card mb16'},
    h('p', {class:'eyebrow'}, LANG === 'en' ? '长难句拆解' : '句子拆解'),
    h('p', {class:'bd mt10'}, bd.en),
    h('ul', {class:'note-list'}, bd.points.map(function(t){ return h('li', null, t); })),
    h('div', {class:'row'}, h('button', {type:'button', class:'btn sm', onclick:function(){ openSentence(bd.i); try { location.hash = 'read'; } catch(e){} }}, '在文中查看这一句'))
  ));
}

/* ---------- wiring ---------- */
/* ---------- speaker icons: words, example sentences, article sentences ---------- */
function speakBtn(key, text){ return clipBtn(DATA.clips, key, text); }
function stopNarrationForClip(){
  if (L && L.audio && !L.audio.paused) L.audio.pause();
  if (L) L.seg = null;
}
function sentBtn(en){
  if (!DATA.audio) return null;
  const i = S.findIndex(function(s){ return s.en === en; }) >= 0 ? S.findIndex(function(s){ return s.en === en; }) : S.findIndex(function(s){ return s.en.indexOf(en) >= 0; });
  if (i < 0) return null;
  const b = spkEl('播放这一句', function(){ playArticleSentence(i, b); });
  return b;
}
function playArticleSentence(i, btn){
  const a = getAudio();
  const T = DATA.audio.t[i];
  Clip.stop();
  const wasOn = L.seg && L.seg.btn === btn && !a.paused;
  endSeg();
  if (wasOn){ a.pause(); return; }
  L.seg = {end:T[1] + 0.15, btn:btn};
  btn.classList.add('on');
  const go = function(){ a.currentTime = Math.max(0, T[0] - 0.1); };
  if (a.readyState >= 1) go(); else a.addEventListener('loadedmetadata', go, {once:true});
  const pr = a.play();
  if (pr && pr.catch) pr.catch(function(){ endSeg(); });
}
function endSeg(){
  if (L.seg && L.seg.btn) L.seg.btn.classList.remove('on');
  L.seg = null;
}

/* ---------- listen tab ---------- */
const L = {audio:null, cur:-1, loop:false, loopIdx:-1, drag:false, el:{}, spans:[], raf:0, seg:null};
const RATES = [0.75, 0.9, 1, 1.15, 1.3];
function fmtT(t){ t = Math.max(0, Math.floor(t)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
function sentAt(t){
  const T = DATA.audio.t;
  let k = 0;
  for (let i = 0; i < T.length; i++){ if (T[i][0] <= t + 0.05) k = i; else break; }
  return k;
}
function getAudio(){
  if (L.audio) return L.audio;
  const a = new Audio();
  a.preload = 'auto';
  a.src = DATA.audio.src;
  a.playbackRate = ui.rate || 1;
  try { a.preservesPitch = true; a.webkitPreservesPitch = true; } catch(e){}
  a.addEventListener('timeupdate', listenUpdate);
  a.addEventListener('play', function(){ listenPlayState(); loopFrames(); });
  a.addEventListener('pause', function(){ listenPlayState(); if (L.seg && a.currentTime < L.seg.end) endSeg(); });
  a.addEventListener('ended', function(){ listenPlayState(); listenUpdate(); });
  a.addEventListener('error', function(){ L.el.msg.textContent = '音频没有加载出来，请检查网络后再点播放。'; L.el.msg.hidden = false; });
  a.addEventListener('playing', function(){ L.el.msg.hidden = true; });
  L.audio = a;
  try {
    if ('mediaSession' in navigator){
      navigator.mediaSession.metadata = new MediaMetadata({title:DATA.title, artist:{en:'外刊精读', ko:'韩语入门', ja:'日语中级'}[LANG]});
      navigator.mediaSession.setActionHandler('play', function(){ a.play(); });
      navigator.mediaSession.setActionHandler('pause', function(){ a.pause(); });
      navigator.mediaSession.setActionHandler('seekbackward', function(){ a.currentTime = Math.max(0, a.currentTime - 5); });
      navigator.mediaSession.setActionHandler('seekforward', function(){ a.currentTime = Math.min(DATA.audio.dur, a.currentTime + 5); });
    }
  } catch(e){}
  return a;
}
function listenPlayState(){
  const playing = !!(L.audio && !L.audio.paused && !L.audio.ended);
  L.el.play.textContent = playing ? '暂停' : '播放';
  L.el.play.setAttribute('aria-pressed', String(playing));
}
function loopFrames(){
  cancelAnimationFrame(L.raf);
  const tick = function(){
    if (!L.audio || L.audio.paused) return;
    listenUpdate();
    L.raf = requestAnimationFrame(tick);
  };
  L.raf = requestAnimationFrame(tick);
}
function listenUpdate(){
  const a = L.audio;
  if (!a) return;
  const T = DATA.audio.t;
  let t = a.currentTime;
  if (L.seg && !a.paused && t >= L.seg.end){ a.pause(); endSeg(); }
  if (L.loop && L.loopIdx >= 0 && !L.seg && !a.paused && t >= T[L.loopIdx][1] + 0.2){ a.currentTime = T[L.loopIdx][0]; t = a.currentTime; }
  if (!L.drag) L.el.range.value = String(t);
  L.el.now.textContent = fmtT(t);
  const k = sentAt(t);
  if (k !== L.cur){
    L.cur = k;
    markListenSentence(!a.paused);
  }
}
function markListenSentence(follow){
  L.spans.forEach(function(sp){ sp.classList.toggle('on', Number(sp.dataset.i) === L.cur); });
  if (follow && ui.tx){
    const sp = L.spans[L.cur];
    if (sp) sp.scrollIntoView({block:'nearest', behavior:REDUCE ? 'auto' : 'smooth'});
  }
}
function playSentence(i){
  endSeg();
  Clip.stop();
  const a = getAudio();
  a.currentTime = DATA.audio.t[i][0];
  if (L.loop) L.loopIdx = i;
  a.play().catch(function(){});
  listenUpdate();
}
function seekBy(d){
  endSeg();
  const a = getAudio();
  a.currentTime = Math.min(DATA.audio.dur, Math.max(0, a.currentTime + d));
  listenUpdate();
}
function setRate(r){
  ui.rate = r; lsSet(LS_UI, ui);
  if (L.audio) L.audio.playbackRate = r;
  $$('.rate-b', L.el.box).forEach(function(b){ const on = Number(b.dataset.r) === r; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
}
function applyTextVisibility(){
  L.el.tr.hidden = !ui.tx;
  L.el.off.hidden = !!ui.tx;
}
function renderListenText(){
  if (!L.el.tr) return;
  L.el.tr.replaceChildren();
  BLOCKS.forEach(function(b){
    const sec = h('section', {class:'blk blk-' + b.type});
    const el = h(b.type === 'title' ? 'h2' : 'p', {class:b.type === 'title' ? 'a-title' : b.type === 'sub' ? 'a-deck' : 'a-para'});
    b.idx.forEach(function(i, k){
      if (k > 0) el.append(' ');
      const sp = h('span', {class:'ls', 'data-i':i, tabindex:0, role:'button', 'aria-label':'从这一句开始播放'}, marked(S[i].en));
      sp.addEventListener('click', function(){ playSentence(i); });
      sp.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); playSentence(i); } });
      el.append(sp);
    });
    sec.append(el);
    L.el.tr.append(sec);
  });
  L.spans = $$('.ls', L.el.tr);
  markListenSentence(false);
}
function renderListen(){
  const box = $('#listenBox');
  if (!DATA.audio || !box || L.el.box) return;
  L.el.box = box;
  const A = DATA.audio;
  L.el.play = h('button', {type:'button', class:'btn pri big', 'aria-pressed':'false', onclick:function(){
    endSeg();
    Clip.stop();
    const a = getAudio();
    if (a.paused || a.ended){ if (a.ended) a.currentTime = 0; a.play().catch(function(){}); } else a.pause();
  }}, '播放');
  L.el.range = h('input', {type:'range', class:'lp-range', min:0, max:A.dur, step:0.1, value:0, 'aria-label':'播放进度'});
  L.el.range.addEventListener('pointerdown', function(){ L.drag = true; });
  L.el.range.addEventListener('input', function(){
    const a = getAudio();
    a.currentTime = Number(L.el.range.value);
    L.el.now.textContent = fmtT(a.currentTime);
    const k = sentAt(a.currentTime);
    if (k !== L.cur){ L.cur = k; markListenSentence(false); }
  });
  const endDrag = function(){ L.drag = false; };
  L.el.range.addEventListener('change', endDrag);
  L.el.range.addEventListener('pointerup', endDrag);
  L.el.range.addEventListener('pointercancel', endDrag);
  L.el.now = h('span', null, '0:00');
  L.el.msg = h('p', {class:'lp-msg', hidden:true, role:'alert'});
  const rates = h('div', {class:'chips', role:'group', 'aria-label':'播放速度'});
  RATES.forEach(function(r){
    rates.append(h('button', {type:'button', class:'chip rate-b', 'data-r':r, 'aria-pressed':'false', onclick:function(){ setRate(r); }}, r + '×'));
  });
  const loopCb = h('input', {type:'checkbox'});
  loopCb.addEventListener('change', function(){
    L.loop = loopCb.checked;
    L.loopIdx = L.loop ? (L.cur >= 0 ? L.cur : 0) : -1;
  });
  const txCb = h('input', {type:'checkbox'});
  txCb.checked = !!ui.tx;
  txCb.addEventListener('change', function(){ ui.tx = txCb.checked; lsSet(LS_UI, ui); applyTextVisibility(); });
  L.el.tr = h('div', {class:'tr'});
  L.el.off = h('p', {class:'tr-off'}, '原文已隐藏。先盲听一遍，听完再勾选“显示原文”对照。');
  box.append(
    h('div', {class:'card lp'},
      h('h2', {class:'h2'}, '听力'),
      h('p', {class:'lead'}, '整篇文章的朗读（AI 合成的' + (LANG !== 'en' ? XL : (DATA.audio.voice || '').charAt(0) === 'b' ? '英式' : '美式') + '发音，语速略慢）。先盲听，再对照原文；点原文里的任意一句，就从那一句开始播放。'),
      h('div', {class:'lp-row'},
        h('button', {type:'button', class:'btn', onclick:function(){ seekBy(-5); }}, '后退 5 秒'),
        L.el.play,
        h('button', {type:'button', class:'btn', onclick:function(){ seekBy(5); }}, '前进 5 秒')
      ),
      h('div', null, L.el.range, h('div', {class:'lp-time'}, L.el.now, h('span', null, fmtT(A.dur)))),
      h('div', null, h('p', {class:'meta'}, '播放速度'), h('div', {class:'row'}, rates)),
      h('div', {class:'lp-row'},
        h('label', {class:'lp-opt'}, loopCb, '单句循环（当前这一句反复听）'),
        h('label', {class:'lp-opt'}, txCb, '显示原文')
      ),
      L.el.msg
    ),
    L.el.off,
    L.el.tr
  );
  setRate(ui.rate || 1);
  renderListenText();
  applyTextVisibility();
}
function renderAll(){
  renderMast();
  renderArticle();
  renderListen();
  renderWords();
  renderThink();
  if (quiz.phase === 'start') renderQuiz();
}
function init(){
  Clip.onBeforePlay(stopNarrationForClip);
  window.addEventListener('pagehide', settle);
  document.addEventListener('visibilitychange', function(){ if (document.hidden) settle(); });
  if (LANG !== 'en'){
    const rl = h('label', null, h('input', {type:'checkbox', id:'optRom'}), LANG === 'ja' ? ' 显示读音' : ' 显示罗马音');
    $('#optZh').parentNode.after(rl);
    $('#optRom').checked = !!ui.rom;
    document.body.classList.toggle('show-rom', !!ui.rom);
    $('#optRom').addEventListener('change', function(){ ui.rom = this.checked; lsSet(LS_UI, ui); document.body.classList.toggle('show-rom', ui.rom); });
    const tt = $('.tab[data-tab="think"]');
    if (tt) tt.textContent = LANG === 'ja' ? '语法' : '句型';
  }
  $('#optZh').checked = !!ui.zh;
  $('#optHi').checked = !!ui.hi;
  $('#optZh').addEventListener('change', function(){ ui.zh = this.checked; lsSet(LS_UI, ui); $('#article').classList.toggle('show-zh', ui.zh); });
  $('#optHi').addEventListener('change', function(){ ui.hi = this.checked; lsSet(LS_UI, ui); renderArticle(); renderListenText(); });
  const chips = $('#chips');
  ['all','new','learning','mastered'].forEach(function(f){
    chips.append(h('button', {type:'button', class:'chip', 'data-f':f, onclick:function(){ vFilter = f; renderWords(); }}, f));
  });
  $('#wordSearch').addEventListener('input', function(){ vQuery = this.value; renderWords(); });
  $$('.tab').forEach(function(b){
    b.addEventListener('click', function(){ try { location.hash = b.dataset.tab; } catch(e){} showTab(b.dataset.tab); });
  });
  window.addEventListener('hashchange', function(){ showTab(location.hash.replace('#','')); });
  if (DATA.audio) $('.tab[data-tab="listen"]').hidden = false;
  renderAll();
  showTab(location.hash.replace('#','') || 'read');
  initCloud();
}
init();
})();
</script>
