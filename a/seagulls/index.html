const DATA = {"sents":[{"kind":"title","en":"Eyes on the chips: the seaside war between humans and gulls","zh":"盯紧你的薯条：海边的人鸥大战","notes":["Eyes on the chips：省略了动词的祈使说法，相当于 Keep your eyes on the chips，“盯紧薯条”。","chips 在英式英语里是炸薯条（美式叫 fries），fish and chips 就是炸鱼薯条。","seaside：海边的、海滨的，常指度假的海滨小镇。"],"i":0,"p":0,"n":0,"label":"标题"},{"kind":"sub","en":"Across the world's beach towns, bold seabirds have learned that tourists are an easy meal.","zh":"在世界各地的海滩小镇，胆大的海鸟已经摸清了：游客就是送上门的一顿饭。","notes":["bold：大胆的、放肆的，这里说海鸟一点不怕人。","an easy meal：轻松到手的一顿饭，把游客比作猎物，有点幽默。","have learned 用现在完成时，说明这是它们已经学会的本事。"],"i":1,"p":0,"n":0,"label":"副标题"},{"kind":"sub","en":"Scientists think they have found a surprisingly simple defence.","zh":"科学家认为，他们找到了一个简单得出奇的防御办法。","notes":["surprisingly simple：副词修饰形容词，“简单得出人意料”。","defence：防御、防守，英式拼写；美式拼作 defense。"],"i":2,"p":0,"n":0,"label":"副标题"},{"kind":"body","en":"It happens in a flash.","zh":"事情就发生在一眨眼之间。","notes":["in a flash：一瞬间、转眼之间。flash 是闪光，像闪光一样快。","开头一个短句，先制造悬念。"],"p":1,"i":3,"n":1,"label":"第 1 句"},{"kind":"body","en":"A family sits down on a sea wall in Cornwall, unwraps a paper parcel of fish and chips, and before anyone has taken a bite, a herring gull swoops down and makes off with the biggest piece.","zh":"一家人在康沃尔的海堤上坐下，拆开一包用纸裹着的炸鱼薯条，还没等谁咬上一口，一只银鸥就俯冲下来，叼走了最大的那块。","notes":["句子用一般现在时讲故事，像现场直播，读起来更生动。","unwrap：拆开（包装）。un- 表示相反，wrap 是包。","swoop down：猛地俯冲下来，多用于鸟。","make off with：拿了……就跑、偷走。"],"p":1,"i":4,"n":2,"label":"第 2 句"},{"kind":"body","en":"The children shriek, the parents shout, and the bird retreats to a rooftop to enjoy its prize.","zh":"孩子们尖叫，大人们大喊，那只鸟则退到屋顶上享用它的战利品。","notes":["三个短句并列，节奏很快，像镜头一个接一个切换。","shriek：尖叫，声音又高又刺耳。","retreat：撤退、退回到安全的地方。","prize：奖品，这里幽默地指抢到的薯条。"],"p":1,"i":5,"n":3,"label":"第 3 句"},{"kind":"body","en":"Similar scenes play out every summer from Brighton to Sydney to Cape Town.","zh":"从布莱顿到悉尼再到开普敦，每年夏天都在上演类似的场面。","notes":["play out：（事情）发生、上演，像戏一样演出来。","from A to B to C：列举范围很广的地方，说明到处都这样。"],"p":1,"i":6,"n":4,"label":"第 4 句"},{"kind":"body","en":"Gulls were not always this cheeky.","zh":"海鸥并不是一直都这么厚脸皮。","notes":["this + 形容词：这么……。this cheeky = 这么放肆。","cheeky：厚脸皮的、没大没小的，英式口语，常带一点好笑的意味。"],"p":2,"i":7,"n":5,"label":"第 5 句"},{"kind":"body","en":"For most of their history they fed at sea, scavenging behind fishing boats and picking through the shoreline.","zh":"在漫长的历史中，它们大多在海上觅食，跟在渔船后面捡食，在海岸边翻找吃的。","notes":["fed 是 feed 的过去式，这里是不及物用法“进食、觅食”。","scavenge：（动物）找腐食、捡剩下的吃；（人）在垃圾里翻找东西。","pick through：在一堆东西里仔细翻找。","两个 -ing 短语作伴随状语，说明它们怎么觅食。"],"p":2,"i":8,"n":6,"label":"第 6 句"},{"kind":"body","en":"But as fish stocks dwindled and towns filled up with litter, rubbish bins and outdoor diners, many birds moved inland and adapted with remarkable speed.","zh":"可随着鱼类资源越来越少，镇上到处是垃圾、垃圾桶和露天吃饭的人，许多海鸥搬到了内陆，而且适应得快得惊人。","notes":["as 引导时间兼原因状语：随着……。","fish stocks：鱼类资源、鱼群数量。dwindle：逐渐减少。","fill up with：被……填满。","inland：在内陆、往内陆。adapt：适应。"],"p":2,"i":9,"n":7,"label":"第 7 句"},{"kind":"body","en":"A city gull can live for 20 years, remembers where food is easy to come by, and learns by watching other gulls get away with theft.","zh":"一只城市海鸥能活二十年，记得哪里容易找到吃的，还会看着别的海鸥偷了东西没事，跟着学。","notes":["三个谓语并列：can live, remembers, learns。","easy to come by：容易弄到。come by = 得到、弄到。","watch + 宾语 + 动词原形：看着某事发生。get away with sth：做了坏事却没受惩罚。"],"p":2,"i":10,"n":8,"label":"第 8 句"},{"kind":"body","en":"Residents are at their wits' end.","zh":"居民们已经无计可施了。","notes":["at one's wits' end：束手无策、急得不知怎么办才好。wits 指头脑、智力，wits' end 就是“脑子用到头了”。"],"p":3,"i":11,"n":9,"label":"第 9 句"},{"kind":"body","en":"Councils have tried everything from spiked roofs and fake owls to fines for anyone caught feeding the birds.","zh":"地方政府什么办法都试过：从在屋顶装尖刺、摆假猫头鹰，到对被抓到喂鸟的人罚款。","notes":["council：地方议会、地方政府，英式用法。","everything from A to B：从 A 到 B 什么都……，用来说范围广。","fine 作名词：罚款。caught feeding the birds = 被抓到在喂鸟。"],"p":3,"i":12,"n":10,"label":"第 10 句"},{"kind":"body","en":"Some towns have hired falconers, whose hawks patrol the beach to scare gulls off.","zh":"有些镇雇了驯鹰人，让他们的鹰在海滩上巡逻，把海鸥吓跑。","notes":["falconer：驯鹰人。whose 引导定语从句，“驯鹰人的鹰”。","patrol：巡逻。","scare sb off：把……吓跑。宾语可以放中间：scare gulls off。"],"p":3,"i":13,"n":11,"label":"第 11 句"},{"kind":"body","en":"Most of these measures work for a while; then the gulls catch on and come back.","zh":"这些办法大多能管用一阵子，然后海鸥就看穿了，又回来了。","notes":["measures：措施、办法，常用复数。","for a while：一段时间。","catch on：明白过来、领会。另一个意思是“流行起来”：The idea caught on.。"],"p":3,"i":14,"n":12,"label":"第 12 句"},{"kind":"body","en":"Researchers studying gull behaviour have come up with a cheaper idea: stare them down.","zh":"研究海鸥行为的研究人员想出了一个更省钱的办法：瞪着它们，直到它们退缩。","notes":["studying gull behaviour 是现在分词短语，修饰 researchers。behaviour 是英式拼写。","come up with：想出（主意、办法）。","stare sb down：盯着对方直到对方退缩。"],"p":4,"i":15,"n":13,"label":"第 13 句"},{"kind":"body","en":"In one experiment, scientists placed a bag of chips on the ground and watched how long passing gulls took to approach it.","zh":"在一项实验里，科学家把一袋薯条放在地上，观察路过的海鸥要过多久才会靠近。","notes":["how long passing gulls took to approach it 是宾语从句，用陈述语序。","passing：路过的，现在分词作定语。","approach：靠近、接近，及物动词，后面直接跟宾语，不加 to。"],"p":4,"i":16,"n":14,"label":"第 14 句"},{"kind":"body","en":"When a person kept their eyes fixed on the bird, it hesitated far longer than when the person looked away, and many gave up altogether.","zh":"如果人一直盯着鸟看，它犹豫的时间比人把目光移开时长得多，很多干脆放弃了。","notes":["keep one's eyes fixed on：目光一直盯着。","hesitate：犹豫。far longer：far 加强比较级，“长得多”。","give up：放弃。altogether：完全、彻底。"],"p":4,"i":17,"n":15,"label":"第 15 句"},{"kind":"body","en":"Gulls, it seems, are wary of being watched, perhaps because a staring animal is more likely to fight back.","zh":"看来，海鸥不喜欢被人盯着，也许是因为一个瞪着你的动物更可能会反击。","notes":["it seems 是插入语，“看起来”。","be wary of：对……有戒心、提防。wary of being watched = 提防被人盯着。","fight back：还击、反抗。"],"p":4,"i":18,"n":16,"label":"第 16 句"},{"kind":"body","en":"There is a catch, of course.","zh":"当然，这里面也有个问题。","notes":["There is a catch：有个隐藏的问题、有个“但是”。catch 作名词是“暗藏的问题、圈套”。","这是一个转折句，引出下面的局限。"],"p":5,"i":19,"n":17,"label":"第 17 句"},{"kind":"body","en":"Only a minority of the gulls dared to come near the food, and the boldest barely paused before grabbing it.","zh":"只有少数海鸥敢靠近食物，而胆子最大的那几只几乎不停顿就抢走了。","notes":["a minority of：……中的少数。反义是 the majority of（大多数）。","dare to do sth：敢于做某事。","barely：几乎没有、勉强。barely paused = 几乎没停。"],"p":5,"i":20,"n":18,"label":"第 18 句"},{"kind":"body","en":"And it is hard to keep an eye on a gull while also eating, chatting and keeping track of small children.","zh":"而且一边吃东西、聊天、看着小孩，一边还要盯住一只海鸥，实在不容易。","notes":["it is hard to ... 是形式主语句，真正的主语是不定式。","keep an eye on：看着、留意。","keep track of：随时掌握……的情况、不让……跑丢。"],"p":5,"i":21,"n":19,"label":"第 19 句"},{"kind":"body","en":"Still, the finding hints at something that frustrated towns often miss.","zh":"不过，这个发现指出了一点，焦头烂额的小镇常常忽略。","notes":["the finding：研究发现，可数名词。","hint at：暗示、透露出。","frustrated：恼火的、沮丧的，这里形容那些拿海鸥没办法的小镇。"],"p":5,"i":22,"n":20,"label":"第 20 句"},{"kind":"body","en":"Gulls are not villains; they are opportunists doing what any sensible animal would do when food is left lying around.","zh":"海鸥并不是坏蛋；它们只是投机者，吃的东西随便放着的时候，任何聪明的动物都会这么做。","notes":["villain：（故事里的）坏人、反派。","opportunist：投机者、会抓机会的人（或动物），这里不算贬义。","leave sth lying around：把东西随手乱放。"],"p":6,"i":23,"n":21,"label":"第 21 句"},{"kind":"body","en":"Many species are in decline at sea even as their urban cousins thrive, which makes culling them hard to justify.","zh":"许多种类的海鸥在海上数量正在减少，而它们城里的“亲戚”却过得很好，所以很难找到理由去捕杀它们。","notes":["in decline：在衰退、数量在减少。","even as：正当……的时候（表示对比）。","thrive：茁壮成长、兴旺。urban cousins：城里的同类，cousins 是比喻。","which 指前面整件事。cull：（为控制数量）捕杀；hard to justify：很难说得过去。"],"p":6,"i":24,"n":22,"label":"第 22 句"},{"kind":"body","en":"The best defence may simply be to eat indoors, keep bins closed and, when all else fails, look the bird in the eye.","zh":"最好的防御办法也许就是：在室内吃饭，盖好垃圾桶，实在不行，就直视那只鸟的眼睛。","notes":["to eat ... keep ... look ... 三个不定式并列作表语。","when all else fails：当其他办法都不管用时。","look sb in the eye：直视某人的眼睛，常表示坦然或对抗。"],"p":6,"i":25,"n":23,"label":"第 23 句"},{"kind":"body","en":"It will not win the war, but it might save your lunch.","zh":"这赢不了整场战争，但也许能保住你的午饭。","notes":["the war 呼应标题里的 war，首尾呼应。","结尾一句举重若轻：大问题解决不了，小事还能顾上，带点幽默。"],"p":6,"i":26,"n":24,"label":"第 24 句"}],"vocab":[{"id":1,"expr":"seaside","zh":"海边、海滨（多指度假地）","m":["seaside"],"note":"seaside 常作定语：a seaside town（海滨小镇）、a seaside holiday（海边度假）。go to the seaside = 去海边玩，英式说法。","core":"seaside","forms":["seaside"],"syn":[],"ex":[{"en":"We spent a week in a small [[seaside]] town.","zh":"我们在一个海边小镇住了一周。"},{"en":"Every August the family goes to the [[seaside]].","zh":"每年八月，一家人都去海边。"}],"ctx":"Eyes on the chips: the seaside war between humans and gulls"},{"id":2,"expr":"bold","zh":"大胆的；放肆的","m":["bold"],"note":"bold 可褒可贬：a bold plan（大胆的计划）；说动物或孩子 bold，常带“胆子大到不客气”的意思。比较级 bolder，最高级 boldest。","core":"bold","forms":["bold","bolder","boldest"],"syn":[],"ex":[{"en":"The [[bold]] squirrel took a nut right out of my hand.","zh":"那只胆大的松鼠直接从我手里拿走了坚果。"},{"en":"It was a [[bold]] decision to quit her job.","zh":"辞掉工作是个大胆的决定。"}],"ctx":"Across the world's beach towns, bold seabirds have learned that tourists are an easy meal."},{"id":3,"expr":"defence","zh":"防御、防护（英式拼写）","m":["defence"],"note":"英式 defence，美式 defense。a defence against sth = 抵御……的办法。动词是 defend。","core":"defence","forms":["defence","defense","defences"],"syn":[],"ex":[{"en":"Sunscreen is your best [[defence]] against sunburn.","zh":"防晒霜是防晒伤最好的办法。"},{"en":"The castle walls were the town's main [[defence]].","zh":"城墙是这座城镇主要的防御。"}],"ctx":"Scientists think they have found a surprisingly simple defence."},{"id":4,"expr":"in a flash","zh":"一瞬间、转眼之间","m":["in a flash"],"note":"同义说法：in an instant、in no time。I'll be back in a flash. = 我马上回来。","core":"in a flash","forms":["in a flash"],"syn":[],"ex":[{"en":"The cake was gone [[in a flash]].","zh":"蛋糕一眨眼就没了。"},{"en":"I'll be back [[in a flash]].","zh":"我马上回来。"}],"ctx":"It happens in a flash."},{"id":5,"expr":"unwrap","zh":"拆开（包装）","m":["unwraps"],"note":"un- 表示相反的动作：wrap（包）→ unwrap（拆开）；lock → unlock；pack → unpack。","core":"unwrap","forms":["unwrap","unwraps","unwrapped","unwrapping"],"syn":[],"ex":[{"en":"The kids [[unwrapped]] their presents in seconds.","zh":"孩子们几秒钟就把礼物拆开了。"},{"en":"She [[unwraps]] a sandwich at her desk every day at noon.","zh":"她每天中午在办公桌前拆开一个三明治。"}],"ctx":"A family sits down on a sea wall in Cornwall, unwraps a paper parcel of fish and chips, and before anyone has taken a bite, a herring gull swoops down and makes off with the biggest piece."},{"id":6,"expr":"swoop down","zh":"（鸟）俯冲下来","m":["swoops down"],"note":"swoop 指鸟从空中猛扑下来，也可以比喻突然行动：Police swooped on the house.（警察突袭了那栋房子。）","core":"swoop down","forms":["swoop down","swoops down","swooped down","swooping down"],"syn":[],"ex":[{"en":"An owl [[swooped down]] and caught a mouse.","zh":"一只猫头鹰俯冲下来抓住了一只老鼠。"},{"en":"Watch the eagle [[swoop down]] towards the river.","zh":"看那只鹰朝河面俯冲下去。"}],"ctx":"A family sits down on a sea wall in Cornwall, unwraps a paper parcel of fish and chips, and before anyone has taken a bite, a herring gull swoops down and makes off with the biggest piece."},{"id":7,"expr":"make off with","zh":"拿了……就跑、偷走","m":["makes off with"],"note":"make off = 匆匆逃走；make off with sth = 带着（偷来的）东西跑掉。比 steal 更口语，更有画面感。","core":"make off with","forms":["make off with","makes off with","made off with","making off with"],"syn":[],"ex":[{"en":"A thief [[made off with]] her handbag.","zh":"一个小偷抢了她的手提包就跑了。"},{"en":"The dog [[made off with]] a sausage from the barbecue.","zh":"狗从烧烤架上叼了一根香肠就跑。"}],"ctx":"A family sits down on a sea wall in Cornwall, unwraps a paper parcel of fish and chips, and before anyone has taken a bite, a herring gull swoops down and makes off with the biggest piece."},{"id":8,"expr":"shriek","zh":"尖叫","m":["shriek"],"note":"shriek 比 scream 更尖、更短。shriek with laughter = 笑得尖叫。也可作名词：a shriek of delight。","core":"shriek","forms":["shriek","shrieks","shrieked","shrieking"],"syn":[],"ex":[{"en":"The kids [[shrieked]] when the cold wave hit them.","zh":"冰冷的浪打过来，孩子们尖叫起来。"},{"en":"She [[shrieked]] with laughter at the joke.","zh":"她听到笑话笑得尖叫。"}],"ctx":"The children shriek, the parents shout, and the bird retreats to a rooftop to enjoy its prize."},{"id":9,"expr":"retreat","zh":"撤退、退到（安全处）","m":["retreats"],"note":"retreat 原是军事用语“撤退”，也常用于日常：retreat to one's room（躲回自己房间）。名词 a retreat 还可以指静修的地方。","core":"retreat","forms":["retreat","retreats","retreated","retreating"],"syn":[],"ex":[{"en":"The cat [[retreated]] under the bed when the guests arrived.","zh":"客人一来，猫就躲到床底下去了。"},{"en":"After lunch he [[retreats]] to his study to read.","zh":"午饭后他总是躲进书房看书。"}],"ctx":"The children shriek, the parents shout, and the bird retreats to a rooftop to enjoy its prize."},{"id":10,"expr":"play out","zh":"（事情）发生、上演","m":["play out"],"note":"play out 指事情一步步展开、发生，常用于场景、局面：We'll see how things play out.（看事情怎么发展吧。）","core":"play out","forms":["play out","plays out","played out","playing out"],"syn":[],"ex":[{"en":"The same argument [[plays out]] in our house every Sunday.","zh":"每个星期天，我们家都会上演同样的争吵。"},{"en":"Let's wait and see how things [[play out]].","zh":"我们等着看事情怎么发展吧。"}],"ctx":"Similar scenes play out every summer from Brighton to Sydney to Cape Town."},{"id":11,"expr":"cheeky","zh":"厚脸皮的、调皮放肆的","m":["cheeky"],"note":"英式口语，常说小孩或宠物，不算很重的批评，带一点好笑：a cheeky grin（调皮的笑）。","core":"cheeky","forms":["cheeky","cheekier","cheekiest"],"syn":[],"ex":[{"en":"Don't be [[cheeky]] to your teacher.","zh":"别对老师没大没小的。"},{"en":"He gave me a [[cheeky]] grin and took the last biscuit.","zh":"他冲我调皮一笑，拿走了最后一块饼干。"}],"ctx":"Gulls were not always this cheeky."},{"id":12,"expr":"scavenge","zh":"捡食、翻找（剩余物）","m":["scavenging"],"note":"scavenger 指食腐动物，比如秃鹫、鬣狗。人也可以 scavenge for sth：在旧物里翻找能用的东西。","core":"scavenge","forms":["scavenge","scavenges","scavenged","scavenging"],"syn":[],"ex":[{"en":"Foxes [[scavenge]] for scraps in the bins at night.","zh":"狐狸夜里在垃圾桶里翻找残羹剩饭。"},{"en":"We [[scavenged]] wood from the beach for the fire.","zh":"我们在海滩上捡木头生火。"}],"ctx":"For most of their history they fed at sea, scavenging behind fishing boats and picking through the shoreline."},{"id":13,"expr":"pick through","zh":"在……里翻找","m":["picking through"],"note":"pick through 强调一件件地挑、翻：pick through the rubbish / the evidence。","core":"pick through","forms":["pick through","picks through","picked through","picking through"],"syn":[],"ex":[{"en":"She [[picked through]] the box of old photos.","zh":"她把那箱旧照片翻了个遍。"},{"en":"Birds were [[picking through]] the rubbish.","zh":"几只鸟在垃圾里翻找。"}],"ctx":"For most of their history they fed at sea, scavenging behind fishing boats and picking through the shoreline."},{"id":14,"expr":"dwindle","zh":"逐渐减少","m":["dwindled"],"note":"dwindle 强调慢慢变少、越来越小：dwindling numbers（越来越少的数量）。近义 shrink，但 dwindle 更强调“所剩无几”。","core":"dwindle","forms":["dwindle","dwindles","dwindled","dwindling"],"syn":[],"ex":[{"en":"Our savings [[dwindled]] during the long holiday.","zh":"长假期间我们的积蓄越来越少。"},{"en":"The crowd [[dwindled]] as the rain got heavier.","zh":"雨越下越大，人群渐渐散去。"}],"ctx":"But as fish stocks dwindled and towns filled up with litter, rubbish bins and outdoor diners, many birds moved inland and adapted with remarkable speed."},{"id":15,"expr":"fill up with","zh":"被……填满","m":["filled up with"],"note":"fill up 是装满；fill up with sth 说明用什么装满。也说加满油：fill up the car。","core":"fill up with","forms":["fill up with","fills up with","filled up with","filling up with"],"syn":[],"ex":[{"en":"The room soon [[filled up with]] smoke.","zh":"房间里很快烟雾弥漫。"},{"en":"Her eyes [[filled up with]] tears.","zh":"她的眼里噙满了泪水。"}],"ctx":"But as fish stocks dwindled and towns filled up with litter, rubbish bins and outdoor diners, many birds moved inland and adapted with remarkable speed."},{"id":16,"expr":"inland","zh":"在内陆、往内陆","m":["inland"],"note":"inland 可作副词（move inland）也可作形容词（an inland city，内陆城市）。反义是 coastal（沿海的）。","core":"inland","forms":["inland"],"syn":[],"ex":[{"en":"The storm moved [[inland]] overnight.","zh":"风暴一夜之间移到了内陆。"},{"en":"They live in a small [[inland]] village.","zh":"他们住在一个内陆小村子里。"}],"ctx":"But as fish stocks dwindled and towns filled up with litter, rubbish bins and outdoor diners, many birds moved inland and adapted with remarkable speed."},{"id":17,"expr":"adapt","zh":"适应","m":["adapted"],"note":"adapt to sth：适应……。adapt 也可以表示“改编”：adapt a novel for the screen。形容词 adaptable = 适应力强的。","core":"adapt","forms":["adapt","adapts","adapted","adapting"],"syn":[],"ex":[{"en":"Children [[adapt]] quickly to a new school.","zh":"孩子们很快就能适应新学校。"},{"en":"The company [[adapted]] to online sales.","zh":"公司转向了网上销售。"}],"ctx":"But as fish stocks dwindled and towns filled up with litter, rubbish bins and outdoor diners, many birds moved inland and adapted with remarkable speed."},{"id":18,"expr":"easy to come by","zh":"容易弄到","m":["easy to come by"],"note":"come by sth = 得到、弄到。常用 hard to come by（难得、不好找）：Good jobs are hard to come by.","core":"come by","forms":["easy to come by","hard to come by","come by"],"syn":[],"ex":[{"en":"Cheap flats are hard to [[come by]] in London.","zh":"在伦敦很难找到便宜的公寓。"},{"en":"In summer, fresh fruit is [[easy to come by]].","zh":"夏天新鲜水果很容易买到。"}],"ctx":"A city gull can live for 20 years, remembers where food is easy to come by, and learns by watching other gulls get away with theft."},{"id":19,"expr":"get away with","zh":"做了（坏事）而没受惩罚","m":["get away with"],"note":"get away with sth：做了错事却逃过惩罚。You won't get away with this! = 你逃不掉的！","core":"get away with","forms":["get away with","gets away with","got away with","getting away with"],"syn":[],"ex":[{"en":"He cheated and [[got away with]] it.","zh":"他作弊了，却什么事也没有。"},{"en":"You can't [[get away with]] being late every day.","zh":"你不能天天迟到还不受处罚。"}],"ctx":"A city gull can live for 20 years, remembers where food is easy to come by, and learns by watching other gulls get away with theft."},{"id":20,"expr":"at one's wits' end","zh":"束手无策、急得没办法","m":["at their wits' end"],"note":"注意 wits' 的撇号在 s 后面（复数所有格）。常说 I'm at my wits' end. = 我真是没辙了。","core":"at their wits' end","forms":["at their wits' end","at my wits' end","at his wits' end","at her wits' end","wits' end","wits end"],"syn":[],"ex":[{"en":"The new parents were [[at their wits' end]] after a week without sleep.","zh":"一周没睡好，这对新手父母已经束手无策了。"},{"en":"I'm [[at my wits' end]] with this printer.","zh":"这台打印机真让我没辙了。"}],"ctx":"Residents are at their wits' end."},{"id":21,"expr":"everything from A to B","zh":"从 A 到 B 什么都……","m":["everything from"],"note":"用来表示种类繁多：The shop sells everything from socks to sofas.","core":"everything from","forms":["everything from"],"syn":[],"ex":[{"en":"The market sells [[everything from]] fish to phone cases.","zh":"这个市场什么都卖，从鱼到手机壳。"},{"en":"We talked about [[everything from]] football to philosophy.","zh":"我们什么都聊，从足球到哲学。"}],"ctx":"Councils have tried everything from spiked roofs and fake owls to fines for anyone caught feeding the birds."},{"id":22,"expr":"fine (noun)","zh":"罚款","m":["fines"],"note":"fine 作名词是“罚款”，作动词是“处以罚款”：He was fined £100. 别和形容词 fine（好的）弄混。","core":"fine","forms":["fine","fines","fined"],"syn":[],"ex":[{"en":"She got a parking [[fine]] outside the hospital.","zh":"她在医院外面吃了一张停车罚单。"},{"en":"Drivers are [[fined]] for using their phones.","zh":"司机开车用手机会被罚款。"}],"ctx":"Councils have tried everything from spiked roofs and fake owls to fines for anyone caught feeding the birds."},{"id":23,"expr":"scare off","zh":"把……吓跑","m":["scare gulls off"],"note":"scare sb/sth off 或 scare off sb/sth。也说 scare away。比喻用法：High prices scared buyers off.（高价把买家吓跑了。）","core":"scare off","forms":["scare off","scares off","scared off","scare away","scare"],"syn":[],"ex":[{"en":"The dog barked and [[scared]] the burglars off.","zh":"狗一叫，把小偷吓跑了。"},{"en":"High prices may [[scare off]] tourists.","zh":"高价可能会把游客吓跑。"}],"ctx":"Some towns have hired falconers, whose hawks patrol the beach to scare gulls off."},{"id":24,"expr":"catch on","zh":"明白过来；流行起来","m":["catch on"],"note":"两个常用意思：一是“领会、反应过来”（The kids caught on fast.）；二是“流行起来”（The fashion never caught on.）。","core":"catch on","forms":["catch on","catches on","caught on","catching on"],"syn":[],"ex":[{"en":"It took me a while to [[catch on]] to the joke.","zh":"我过了一会儿才明白这个笑话。"},{"en":"The new app never really [[caught on]].","zh":"这个新应用一直没真正流行起来。"}],"ctx":"Most of these measures work for a while; then the gulls catch on and come back."},{"id":25,"expr":"come up with","zh":"想出（主意、办法）","m":["come up with"],"note":"come up with an idea / a plan / an answer / an excuse。比 think of 更强调“想出来了”。","core":"come up with","forms":["come up with","comes up with","came up with","coming up with"],"syn":[],"ex":[{"en":"She [[came up with]] a clever name for the shop.","zh":"她给店想了个巧妙的名字。"},{"en":"We need to [[come up with]] a plan by Friday.","zh":"我们得在周五前想出个计划。"}],"ctx":"Researchers studying gull behaviour have come up with a cheaper idea: stare them down."},{"id":26,"expr":"stare sb down","zh":"瞪到对方退缩","m":["stare them down"],"note":"stare at sb = 盯着某人看；stare sb down 更进一步，盯到对方先移开目光或退缩。","core":"stare down","forms":["stare down","stare them down","stared down","stare","stared"],"syn":[],"ex":[{"en":"The cat [[stared]] the dog down.","zh":"猫一直瞪着狗，直到狗退缩。"},{"en":"Don't try to [[stare down]] an angry bull.","zh":"别跟一头发怒的公牛对视。"}],"ctx":"Researchers studying gull behaviour have come up with a cheaper idea: stare them down."},{"id":27,"expr":"approach (verb)","zh":"靠近、接近","m":["approach"],"note":"approach 作动词时直接跟宾语：approach the door（不说 approach to）。也可以指“着手处理”：approach a problem。","core":"approach","forms":["approach","approaches","approached","approaching"],"syn":[],"ex":[{"en":"A stranger [[approached]] me in the street.","zh":"街上有个陌生人朝我走过来。"},{"en":"Winter is [[approaching]] fast.","zh":"冬天很快就要到了。"}],"ctx":"In one experiment, scientists placed a bag of chips on the ground and watched how long passing gulls took to approach it."},{"id":28,"expr":"hesitate","zh":"犹豫","m":["hesitated"],"note":"hesitate to do sth：迟疑着不做。礼貌用语 Don't hesitate to ask. = 有问题尽管问。名词 hesitation。","core":"hesitate","forms":["hesitate","hesitates","hesitated","hesitating"],"syn":[],"ex":[{"en":"She [[hesitated]] before opening the letter.","zh":"她犹豫了一下才拆开信。"},{"en":"Don't [[hesitate]] to call me if you need help.","zh":"需要帮忙就尽管给我打电话。"}],"ctx":"When a person kept their eyes fixed on the bird, it hesitated far longer than when the person looked away, and many gave up altogether."},{"id":29,"expr":"give up","zh":"放弃","m":["gave up"],"note":"give up (doing) sth：放弃、戒掉：give up smoking。give up on sb = 对某人不抱希望。","core":"give up","forms":["give up","gives up","gave up","given up","giving up"],"syn":[],"ex":[{"en":"He [[gave up]] after three tries.","zh":"他试了三次就放弃了。"},{"en":"Never [[give up]] on your dreams.","zh":"永远不要放弃你的梦想。"}],"ctx":"When a person kept their eyes fixed on the bird, it hesitated far longer than when the person looked away, and many gave up altogether."},{"id":30,"expr":"altogether","zh":"完全、彻底","m":["altogether"],"note":"altogether 有两个意思：一是“完全”（stop altogether），二是“总共”（£50 altogether）。注意和 all together（大家一起）区分。","core":"altogether","forms":["altogether"],"syn":[],"ex":[{"en":"The noise stopped [[altogether]].","zh":"噪音完全停了。"},{"en":"We might cancel the trip [[altogether]].","zh":"我们可能会彻底取消这次旅行。"}],"ctx":"When a person kept their eyes fixed on the bird, it hesitated far longer than when the person looked away, and many gave up altogether."},{"id":31,"expr":"be wary of","zh":"对……有戒心、提防","m":["wary of"],"note":"wary 指小心提防，比 careful 多一层“不信任”：be wary of strangers。名词形式 wariness。","core":"wary of","forms":["wary of","be wary of","wary"],"syn":[],"ex":[{"en":"Cats are [[wary of]] strangers.","zh":"猫对陌生人有戒心。"},{"en":"Be [[wary of]] offers that sound too good to be true.","zh":"好得不像真的优惠，要多留个心眼。"}],"ctx":"Gulls, it seems, are wary of being watched, perhaps because a staring animal is more likely to fight back."},{"id":32,"expr":"fight back","zh":"还击、反抗","m":["fight back"],"note":"fight back 也可以指“忍住（眼泪等）”：fight back tears。","core":"fight back","forms":["fight back","fights back","fought back","fighting back"],"syn":[],"ex":[{"en":"When the bully pushed him, he [[fought back]].","zh":"那个恶霸推他时，他还手了。"},{"en":"She [[fought back]] tears during the speech.","zh":"她演讲时强忍着眼泪。"}],"ctx":"Gulls, it seems, are wary of being watched, perhaps because a staring animal is more likely to fight back."},{"id":33,"expr":"there is a catch","zh":"有个隐藏的问题、有个“但是”","m":["There is a catch"],"note":"catch 作名词指暗藏的问题或代价。常见问法：What's the catch?（有什么猫腻？）","core":"there is a catch","forms":["there is a catch","there's a catch","what's the catch","catch"],"syn":[],"ex":[{"en":"The flight is very cheap, but [[there is a catch]]: no luggage.","zh":"机票很便宜，但有个问题：不含行李。"},{"en":"Free pizza for a year? [[What's the catch]]?","zh":"一年免费披萨？有什么猫腻？"}],"ctx":"There is a catch, of course."},{"id":34,"expr":"a minority of","zh":"……中的少数","m":["a minority of"],"note":"反义 the majority of（大多数）。in the minority = 属于少数。","core":"a minority of","forms":["a minority of","minority"],"syn":[],"ex":[{"en":"Only [[a minority of]] students walk to school.","zh":"只有少数学生走路上学。"},{"en":"[[A minority of]] drivers cause most accidents.","zh":"大多数事故是少数司机造成的。"}],"ctx":"Only a minority of the gulls dared to come near the food, and the boldest barely paused before grabbing it."},{"id":35,"expr":"dare (to) do sth","zh":"敢于做某事","m":["dared to"],"note":"dare 可以接 to do 或直接接动词原形：He didn't dare (to) look.。I dare you to ... = 我赌你不敢……。","core":"dare to","forms":["dare to","dares to","dared to","dare","dared"],"syn":[],"ex":[{"en":"Nobody [[dared to]] tell the boss.","zh":"没人敢告诉老板。"},{"en":"I didn't [[dare]] look down from the bridge.","zh":"我不敢从桥上往下看。"}],"ctx":"Only a minority of the gulls dared to come near the food, and the boldest barely paused before grabbing it."},{"id":36,"expr":"barely","zh":"几乎没有、勉强","m":["barely"],"note":"barely 带否定意味：I barely slept. = 我几乎没睡。也表示“刚刚够”：She barely caught the train.（她差点没赶上火车。）","core":"barely","forms":["barely"],"syn":[],"ex":[{"en":"I could [[barely]] hear him over the music.","zh":"音乐太吵，我几乎听不见他说话。"},{"en":"We [[barely]] made it to the airport on time.","zh":"我们差一点就没按时赶到机场。"}],"ctx":"Only a minority of the gulls dared to come near the food, and the boldest barely paused before grabbing it."},{"id":37,"expr":"keep an eye on","zh":"看着、留意","m":["keep an eye on"],"note":"keep an eye on sb/sth：照看、留心。Can you keep an eye on my bag? = 能帮我看一下包吗？","core":"keep an eye on","forms":["keep an eye on","keeps an eye on","kept an eye on","keeping an eye on"],"syn":[],"ex":[{"en":"Can you [[keep an eye on]] my bag for a minute?","zh":"能帮我看一下包吗？"},{"en":"The teacher [[kept an eye on]] the quiet boy at the back.","zh":"老师一直留意着后排那个安静的男孩。"}],"ctx":"And it is hard to keep an eye on a gull while also eating, chatting and keeping track of small children."},{"id":38,"expr":"keep track of","zh":"掌握……的情况、记着","m":["keeping track of"],"note":"keep track of sth：随时了解、记录。反义 lose track of：搞不清、忘了。lose track of time = 忘了时间。","core":"keep track of","forms":["keep track of","keeps track of","kept track of","keeping track of","lose track of","lost track of"],"syn":[],"ex":[{"en":"I use an app to [[keep track of]] my spending.","zh":"我用一个应用记录开支。"},{"en":"We [[lost track of]] time and missed the bus.","zh":"我们忘了时间，错过了公交车。"}],"ctx":"And it is hard to keep an eye on a gull while also eating, chatting and keeping track of small children."},{"id":39,"expr":"hint at","zh":"暗示、透露出","m":["hints at"],"note":"hint 作名词是“暗示、提示”：give sb a hint。hint at sth = 间接地提到、暗示。","core":"hint at","forms":["hint at","hints at","hinted at","hinting at"],"syn":[],"ex":[{"en":"He [[hinted at]] a big announcement next week.","zh":"他暗示下周会有重大消息。"},{"en":"The dark clouds [[hint at]] a storm.","zh":"乌云预示着暴风雨。"}],"ctx":"Still, the finding hints at something that frustrated towns often miss."},{"id":40,"expr":"opportunist","zh":"投机者、善于抓机会的人","m":["opportunists"],"note":"opportunist 常带贬义，指只顾自己利益抓机会的人；说动物时就是“见机行事”。形容词 opportunistic。","core":"opportunist","forms":["opportunist","opportunists"],"syn":[],"ex":[{"en":"Foxes are clever [[opportunists]] that eat almost anything.","zh":"狐狸是聪明的机会主义者，几乎什么都吃。"},{"en":"Some async function flush(){
  if (!ref) return;
  if (saving){ again = true; return; }

  saving = true;
  try { await ref.set(JSON.parse(json)); lastJSON = json; setSaveNote('saved'); }

async function initCloud(){

  } catch(e){}
  if (!db || !user){ setSaveNote('local'); return; }
  let uid = null;

  if (!uid){ setSaveNote('local'); return; }
  let r;
  try { r = db.doc('data/users/' + uid + '/progress'); } catch(e){ setSaveNote('local'); return; }
  try {
    const snap = await withTimeout(r.get(), 10000);

      if (touched){

        lastJSON = JSON.stringify(state);
      }
      lsSet(LS_STATE, state);
      ref = r;
      renderAll();
      if (lastJSON === '') flush(); else setSaveNote('saved');
    } else {
      ref = r;
      lastJSON = '';
      if (hasContent(state)){ setSaveNote('saving'); flush(); } else setSaveNote('saved');
    }
  } catch(e){ setSaveNote('local'); }
}

/* ---------- vocabulary highlighting ---------- */
function marked(text, opt){
  opt = opt || {};
  if (!(opt.force || ui.hi)) return [document.createTextNode(text)];
  const out = [];
  let last = 0, m;
  TERM_RE.lastIndex = 0;
  while ((m = TERM_RE.exec(text))){
    const id = TERM_MAP[m[0].toLowerCase()];
    if (opt.only && opt.only !== id) continue;
    if (m.index > last) out.push(document.createTextNode(text.slice(last, m.index)));
    out.push(h('mark', {class:'vw' + (VMAP[id].mine ? ' uw' : ''), 'data-v':id, title:VMAP[id].zh}, m[0]));
    last = m.index + m[0].length;
  }
  if (last < text.length) out.push(document.createTextNode(text.slice(last)));
  return out;
}

/* the words highlighted in a sentence, each explained right here (tap to open) with a link to its full card */
function sentenceWords(s){
  const ids = [], seen = {};
  const re = new RegExp(TERM_RE.source, 'gi');
  let m;
  while ((m = re.exec(s.en))){
    const id = TERM_MAP[m[0].toLowerCase()];
    if (id !== undefined && !seen[id]){ seen[id] = true; ids.push(id); }
  }
  if (!ids.length) return null;
  return h('div', {class:'note-words'},
    h('p', {class:'note-wh'}, '本句标出的词（点开看讲解）'),
    ids.map(function(id){
      const v = VMAP[id], x = v.ex && v.ex[0];
      return h('details', {class:'nw'},
        h('summary', null, h('b', null, v.expr), '　', v.zh),
        h('div', {class:'nw-body'},
          v.note ? h('p', null, v.note) : null,
          x ? h('p', {class:'nw-ex'}, exPlain(x.en), '　', x.zh) : null,
          h('button', {type:'button', class:'btn sm', onclick:function(){ gotoWord(id); }}, '看完整词卡 →')
        )
      );
    })
  );
}
function gotoWord(id){
  vFilter = 'all'; vQuery = '';
  const si = $('#wordSearch');
  if (si) si.value = '';
  showTab('words');
  renderWords();
  const el = $('#wordList [data-id="' + id + '"]');
  if (!el) return;
  el.scrollIntoView({block:'start', behavior:REDUCE ? 'auto' : 'smooth'});
  el.classList.add('flash');
  setTimeout(function(){ el.classList.remove('flash'); }, 1600);
}
function placeNote(){
  $$('.slot').forEach(function(s){ s.replaceChildren(); });
  if (active < 0) return;
  const slot = $$('.slot').filter(function(x){ return x.dataset.slot.split(',').indexOf(String(active)) >= 0; })[0];
  if (slot) slot.append(noteCard(S[active]));
}
function openSentence(i){
  active = i;
  showTab('read');
  refreshSentenceStates();
  placeNote();
  const el = $('.note');
  if (el) el.scrollIntoView({block:'center'});
}

/* ---------- words tab ---------- */
let vFilter = 'all', vQuery = '';
function counts(){
  const c = {all:DATA.vocab.length, new:0, learning:0, mastered:0};
  DATA.vocab.forEach(function(v){ c[getS(v.id)]++; });
  return c;
}
function updateChips(){
  const c = counts();
  $$('#chips .chip').forEach(function(b){
    const f = b.dataset.f;
    b.textContent = (f === 'all' ? '全部' : SLABEL[f]) + ' ' + c[f];
    b.classList.toggle('on', vFilter === f);
    b.setAttribute('aria-pressed', String(vFilter === f));
  });
}
function metaText(id){
  const e = state.vocab[id];
  const bits = [];
  if (e && e.d) bits.push('上次复习 ' + e.d);
  const r = srsGet(srsKey(id));
  if (r) bits.push('复习计划：' + srsStageText(r, Date.now()));
  return bits.join(' · ');
}
function srsKey(id){ return VMAP[id].ref || SLUG + ':' + id; }   /* a unit-test word reviews as the word it points at */
function statusSeg(id, after){
  const seg = h('div', {class:'seg', role:'group', 'aria-label':'学习状态'});
  const btns = {};
  function sync(){
    const c = getS(id);
    Object.keys(btns).forEach(function(s){
      btns[s].classList.toggle('on', c === s);
      btns[s].setAttribute('aria-pressed', String(c === s));
    });
  }
  ['new','learning','mastered'].forEach(function(s){
    btns[s] = h('button', {type:'button', class:'seg-b s-' + s, onclick:function(){ setS(id, s); sync(); if (after) after(s); }}, SLABEL[s]);
    seg.append(btns[s]);
  });
  sync();
  return seg;
}
function wordCard(v){
  const e = state.vocab[v.id] || {};
  const meta = h('p', {class:'w-meta'}, metaText(v.id));
  const ta = h('textarea', {id:'mine-' + v.id, rows:2, maxlength:400, placeholder:'用这个表达写一句自己的话'});
  ta.value = e.m || '';
  ta.addEventListener('input', function(){ setMine(v.id, ta.value); meta.textContent = metaText(v.id); });
  const seg = statusSeg(v.id, function(){
    meta.textContent = metaText(v.id);
    updateChips();
    if (vFilter !== 'all') renderWords();
  });
  return h('article', {class:'word', 'data-id':v.id},
    h('div', {class:'word-top'}, h('div', {class:'w-head'}, h('h3', {class:'w-expr'}, v.expr, v.extra ? h('span', {class:'w-tag'}, '新增') : null, v.kind === 'grammar' ? h('span', {class:'w-tag'}, '语法') : null, v.from ? h('span', {class:'w-tag'}, '出自 ' + v.from) : null, v.mine ? h('span', {class:'w-tag uw-tag'}, '我加的') : null), speakBtn('w' + v.id, v.core)), seg),
    v.rom ? h('p', {class:'rom w-rom'}, v.rom) : null,
    h('p', {class:'w-zh'}, v.zh),
    v.note ? h('p', {class:'w-note'}, v.note) : null,
    h('div', {class:'w-ctxrow'}, sentBtn(v.ctx), h('p', {class:'w-ctx'}, marked(v.ctx, {force:true, only:v.id}))),
    v.ex && v.ex.length && !v.mine ? h('p', {class:'w-exh'}, '例句') : null,
    v.ex && v.ex.length && !v.mine ? h('ul', {class:'w-ex'}, v.ex.map(function(x, k){
      return h('li', {class:'ex-row'}, speakBtn('e' + v.id + '_' + k, exPlain(x.en)), h('div', {class:'ex-body'}, h('span', {class:'ex-en'}, exNodes(x.en)), x.rom ? h('span', {class:'rom'}, x.rom) : null, h('span', {class:'ex-zh'}, x.zh)));
    })) : null,
    h('label', {class:'w-mine'}, h('span', null, '我的造句'), ta),
    meta,
    v.mine ? h('div', {class:'row'},
      h('button', {type:'button', class:'btn sm', onclick:function(){ openAddSheet({edit:v}); }}, '修改意思'),
      h('button', {type:'button', class:'btn sm', onclick:function(){
        if (!confirm('把“' + v.expr + '”从生词里删掉？它的复习记录也会一起移出。')) return;
        mineDel(v.key); srsForget(v.key); refreshMine(); toast('已删除“' + v.expr + '”');
      }}, '删除这个生词')) : null
  );
}
function renderWords(){
  const list = $('#wordList');
  list.replaceChildren();
  const q = vQuery.trim().toLowerCase();
  const items = DATA.vocab.filter(function(v){
    if (vFilter !== 'all' && getS(v.id) !== vFilter) return false;
    if (q){
      const hay = [v.expr, v.zh, v.ctx, v.note || ''].concat((v.ex || []).map(function(x){ return exPlain(x.en) + ' ' + x.zh; })).join(' ').toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
  updateChips();
  if (!items.length){ list.append(h('p', {class:'empty'}, '没有符合条件的表达。')); return; }
  items.forEach(function(v){ list.append(wordCard(v)); });
}

/* ---------- quiz tab ---------- */
const quiz = {phase:'start', mode:'mcq', scope:'all', items:[], i:0, results:[], pending:null, hist:[], card:null};
const MODES = [['mcq', '选择题'], ['cloze', '文章填空'], ['exs', '例句填空'], ['zh', '中文写' + XL + '词'], ['dict', '听写'], ['sent', '中文写' + XL + '句']]
  .concat(DATA.vocab.some(function(v){ return v.pick; }) ? [['pick', '语法辨析']] : []);
const MODE_NAME = Kit.TYPE_NAME;
const MODE_LEAD = {
  mcq:'四选一：看' + XL + '选中文意思，或看中文选' + XL + '表达，两个方向随机出现。可以按键盘 1–4 作答。',
  cloze:'每题挖掉一个生词。看中文提示和上下文，把它按原句的词形填回去。',
  exs:'换个场景：把生词放回它自己的例句里再填一次，不再靠文章原句的位置，更接近真正会用。',
  zh:'看中文意思，自己写出对应的' + XL + '表达，词形变化不限。如果你写的是近义词，批改时可以自己判定算对。',
  dict:'听发音，把听到的写下来：有时是单个表达，有时是一整句例句。可以慢速重听。',
  sent:'看一句中文，自己写出整句' + XL + '，并用上指定的表达。写完核对参考句，再自己判断对不对。',
  pick:'一句话里空着一处，从几个相近的说法里选出对的，看完解释再记一遍区别。'
};
function modeAvailable(m){ return m === 'pick' ? DATA.vocab.some(function(v){ return v.pick; }) : m !== 'dict' || !!DATA.clips; }
function quizPool(){
  const m = quiz.mode;
  return DATA.vocab.filter(function(v){ return m === 'pick' ? !!v.pick : (m !== 'sent' && m !== 'exs') || (v.ex && v.ex.length); }).map(function(v){
    const c = {id:v.id};
    if (m === 'pick') c.k = Math.floor(Math.random() * v.pick.length);
    if (m === 'sent' || m === 'exs') c.k = Math.floor(Math.random() * v.ex.length);
    if (m === 'dict') c.k = v.ex && v.ex.length && Math.random() > 0.35 ? Math.floor(Math.random() * v.ex.length) : -1;
    if (m === 'mcq') c.dir = Math.random() < 0.5 ? 'e2z' : 'z2e';
    return c;
  });
}
function todoCount(){ return quizPool().filter(function(c){ return getS(c.id) !== 'mastered'; }).length; }
const QUICK_N = 20;   /* the "random 20" round, offered when an article has many words */
function startQuiz(scope, ids){
  let pool = quizPool().filter(function(c){
    return ids ? ids.indexOf(c.id) >= 0 : (scope === 'all' || getS(c.id) !== 'mastered');
  });
  if (scope === 'quick' && !ids && !pool.length) pool = quizPool();
  if (!pool.length) return;
  quiz.scope = scope;
  quiz.items = shuffle(pool.slice());
  if (scope === 'quick' && !ids) quiz.items = quiz.items.slice(0, QUICK_N);
  quiz.i = 0; quiz.results = []; quiz.pending = null; quiz.hist = []; quiz.card = null; quiz.phase = 'q';
  renderQuiz();
}
function renderQuiz(){
  const box = $('#quizBox');
  if (quiz.phase === 'q'){ quiz.card = quizQuestion(); Kit.pager(box, quiz.hist, quiz.card); return; }
  box.replaceChildren(quiz.phase === 'start' ? quizStart() : quizResult());
}
/* every answer goes into the spaced-repetition plan (shared with the review page) once the learner moves on */
function settle(){
  const r = quiz.pending;
  if (!r) return;
  quiz.pending = null;
  srsRecord(r.key, r.ok);
}
function reviewSummary(){
  const s = srsLoad(), now = Date.now();
  let due = 0, seen = 0;
  DATA.vocab.forEach(function(v){
    const e = s.w[srsKey(v.id)];
    if (!e) return;
    seen++;
    if (!e.m && e.t <= now) due++;
  });
  return {due:due, seen:seen, fresh:DATA.vocab.length - seen};
}
function quizStart(){
  if (!modeAvailable(quiz.mode)) quiz.mode = 'mcq';
  const all = quizPool().length, todo = todoCount();
  if (quiz.scope === 'todo' && !todo) quiz.scope = 'all';
  const modes = h('div', {class:'chips'});
  MODES.forEach(function(o){
    modes.append(h('button', {type:'button', class:'chip' + (quiz.mode === o[0] ? ' on' : ''), 'aria-pressed':String(quiz.mode === o[0]),
      disabled:!modeAvailable(o[0]), onclick:function(){ quiz.mode = o[0]; renderQuiz(); }}, o[1]));
  });
  const opts = h('div', {class:'chips mt12'});
  const scopes = [['all', '全部 ' + all + ' 题'], ['todo', '只考未掌握 ' + todo + ' 题']];
  if (all > QUICK_N + 5) scopes.push(['quick', '随机 ' + QUICK_N + ' 题']);
  scopes.forEach(function(o){
    opts.append(h('button', {type:'button', class:'chip' + (quiz.scope === o[0] ? ' on' : ''), 'aria-pressed':String(quiz.scope === o[0]), disabled:o[0] === 'todo' && !todo,
      onclick:function(){ quiz.scope = o[0]; renderQuiz(); }}, o[1]));
  });
  const card = h('div', {class:'card'},
    h('h2', {class:'h2'}, '自测'),
    modes,
    h('p', {class:'lead mt12'}, MODE_LEAD[quiz.mode]),
    opts
  );
  const last = state.quiz;
  if (last && last.total) card.append(h('p', {class:'meta mt12'}, '上次成绩 ' + last.score + ' / ' + last.total + (last.k ? '（' + MODE_NAME[last.k] + '）' : '') + (last.d ? '，' + last.d : '')));
  card.append(h('div', {class:'row'}, h('button', {type:'button', class:'btn pri', onclick:function(){ startQuiz(quiz.scope); }}, '开始')));
  const rs = reviewSummary();
  card.append(h('p', {class:'meta mt12'}, '答题结果会记进艾宾浩斯复习计划（只存在这台设备上）。这篇文章：' +
    (rs.due ? rs.due + ' 个词到期该复习' : '暂时没有到期的词') + '，' + rs.fresh + ' 个词还没开始。 ',
    h('a', {href:REVIEW_URL}, '去复习页 →')));
  return card;
}
function quizQuestion(){
  const c = quiz.items[quiz.i], v = VMAP[c.id], total = quiz.items.length;
  return Kit.make({type:quiz.mode, key:srsKey(v.id), id:v.id, v:v, k:c.k, dir:c.dir, clips:DATA.clips || null}, {
    index:quiz.i, total:total, last:quiz.i + 1 >= total,
    pool:function(){ return DATA.vocab; },
    extra:function(item){ return h('div', {class:'fb-s'}, h('span', {class:'meta'}, '标记这个词：'), statusSeg(item.id)); },
    onAnswer:function(res){ quiz.results.push(res); quiz.pending = res; },
    onNext:nextQ
  });
}
function nextQ(){
  settle();
  if (quiz.card) quiz.hist.push(Kit.freeze(quiz.card));
  if (quiz.i + 1 >= quiz.items.length){ finishQuiz(); return; }
  quiz.i++;
  renderQuiz();
}
function finishQuiz(){
  const score = quiz.results.filter(function(r){ return r.ok; }).length;
  state.quiz = {score:score, total:quiz.results.length, d:today(), k:quiz.mode};
  touch();
  quiz.phase = 'r';
  renderQuiz();
  window.scrollTo(0, 0);
}
function missRow(m){
  const v = VMAP[m.id];
  const given = m.given ? '　你' + (m.type === 'cloze' || m.type === 'exs' ? '填' : m.type === 'mcq' ? '选' : m.type === 'dict' ? '听写' : '写') + '的：' + m.given : '';
  if (m.type === 'cloze' || m.type === 'exs'){
    const c = m.type === 'cloze' ? v.cloze : Kit.exCloze(v, m.k);
    return h('div', {class:'miss'},
      h('p', {class:'miss-s'}, c.before, h('mark', {class:'vw'}, c.ans), c.after),
      h('p', {class:'meta'}, v.expr + '　' + v.zh + given)
    );
  }
  if (m.type === 'zh') return h('div', {class:'miss'}, h('p', {class:'miss-s'}, v.zh), h('p', {class:'meta'}, '参考答案：' + v.expr + given));
  if (m.type === 'mcq') return h('div', {class:'miss'}, h('p', {class:'miss-s'}, v.expr, '　', v.zh), h('p', {class:'meta'}, given.replace(/^　/, '') || '没有作答'));
  if (m.type === 'dict'){
    const x = m.k >= 0 ? v.ex[m.k] : null;
    return h('div', {class:'miss'}, h('p', {class:'miss-s'}, x ? exNodes(x.en) : v.expr), h('p', {class:'meta'}, (x ? x.zh + '　' : v.zh + '　') + given.replace(/^　/, '')));
  }
  const x = v.ex[m.k];
  return h('div', {class:'miss'}, h('p', {class:'miss-s'}, x.zh), h('p', {class:'miss-s'}, exNodes(x.en)), h('p', {class:'meta'}, v.expr + given));
}
function quizResult(){
  const total = quiz.results.length;
  const misses = quiz.results.filter(function(r){ return !r.ok; });
  const score = total - misses.length;
  const card = h('div', {class:'card'},
    h('p', {class:'eyebrow'}, '本轮成绩 · ' + MODE_NAME[quiz.mode]),
    h('p', {class:'score'}, h('span', {class:'big'}, String(score)), ' / ' + total)
  );
  if (misses.length){
    card.append(h('h3', {class:'h3 mt4'}, '答错的 ' + misses.length + ' 题'));
    misses.forEach(function(m){ card.append(missRow(m)); });
  } else {
    card.append(h('p', {class:'lead'}, '全部答对。'));
  }
  const row = h('div', {class:'row'});
  if (misses.length) row.append(h('button', {type:'button', class:'btn pri', onclick:function(){ startQuiz('all', misses.map(function(m){ return m.id; })); }}, '重做错题'));
  row.append(h('button', {type:'button', class:'btn' + (misses.length ? '' : ' pri'), onclick:function(){ quiz.phase = 'start'; renderQuiz(); }}, '换个题型再测'));
  row.append(h('button', {type:'button', class:'btn', onclick:function(){ showTab('words'); try { location.hash = 'words'; } catch(e){} }}, '去词汇表'));
  row.append(h('a', {class:'btn', href:REVIEW_URL}, '去复习页'));
  if (quiz.hist.length) row.append(h('button', {type:'button', class:'btn', onclick:function(){
    Kit.pager($('#quizBox'), quiz.hist, null, {close:renderQuiz});
    window.scrollTo(0, 0);
  }}, '逐题回看'));
  card.append(row);
  return card;
}

/* ---------- add a word yourself: select text in the article -> 加入生词 ---------- */
function selText(){ try { const s = window.getSelection(); return s && !s.isCollapsed ? s.toString().trim() : ''; } catch(e){ return ''; } }
/* the current selection as {i: sentence index, t: text, o: offset in the sentence} or null (it must lie inside one sentence) */
function selInfo(){
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
  const r = sel.getRangeAt(0);
  function sentOf(n){ const el = n && (n.nodeType === 1 ? n : n.parentNode); return el && el.closest ? el.closest('#article .sent') : null; }
  const a = sentOf(r.startContainer), b = sentOf(r.endContainer);
  if (!a || a !== b) return null;
  const pre = document.createRange();
  pre.selectNodeContents(a); pre.setEnd(r.startContainer, r.startOffset);
  const i = Number(a.dataset.i), en = S[i].en;
  let o = pre.toString().length, t = r.toString();
  /* drop spaces and punctuation at both ends: "elves," -> "elves" */
  const lead = t.match(new RegExp('^[^' + LETTERS + '0-9]*', 'i'))[0].length;
  o += lead; t = t.slice(lead);
  t = t.replace(new RegExp('[^' + LETTERS + '0-9]+$', 'i'), '');
  if (!t || t.length > 80 || en.substr(o, t.length) !== t) return null;
  return {i:i, t:t, o:o};
}
let addBtn = null, selTimer = 0;
function hideAddBtn(){ if (addBtn) addBtn.hidden = true; }
function placeAddBtn(){
  const info = cur === 'read' ? selInfo() : null;
  if (!info){ hideAddBtn(); return; }
  if (!addBtn){
    addBtn = h('button', {type:'button', class:'uw-add', onmousedown:function(e){ e.preventDefault(); }, onclick:function(){
      const x = selInfo() || addBtn._info;
      hideAddBtn();
      if (x) openAddSheet({add:x});
    }}, '＋ 加入生词');
    document.body.append(addBtn);
  }
  addBtn._info = info;
  const rc = window.getSelection().getRangeAt(0).getBoundingClientRect();
  addBtn.hidden = false;
  const w = addBtn.offsetWidth, vw = document.documentElement.clientWidth;
  addBtn.style.left = Math.max(8, Math.min(vw - w - 8, rc.left + rc.width / 2 - w / 2)) + 'px';
  /* below the selection: phones show their own copy menu above it */
  addBtn.style.top = (window.scrollY + rc.bottom + 10) + 'px';
}
function openAddSheet(o){
  const edit = o.edit, x = o.add;
  const s = edit ? null : S[x.i];
  const term = edit ? edit.expr : x.t;
  const old = !edit && DATA.vocab.filter(function(v){ return v.expr.toLowerCase() === term.toLowerCase() || v.m.some(function(t){ return t.toLowerCase() === term.toLowerCase(); }); })[0];
  const zh = h('input', {type:'text', class:'search', maxlength:200, placeholder:'中文意思，比如：精灵', 'aria-label':'中文意思'});
  const note = h('textarea', {rows:2, maxlength:400, placeholder:'笔记（可不写）：搭配、用法、想提醒自己的话', 'aria-label':'笔记'});
  if (edit){ zh.value = edit.zh === '（还没写中文意思）' ? '' : edit.zh; note.value = edit.note || ''; }
  const err = h('p', {class:'uw-err', 'aria-live':'polite'});
  const ctx = edit ? edit.ctx : s.en;
  const bg = h('div', {class:'uw-bg', onclick:function(e){ if (e.target === bg) close(); }});
  function close(){ bg.remove(); document.removeEventListener('keydown', onKey); }
  function onKey(e){ if (e.key === 'Escape') close(); }
  function save(){
    const z = zh.value.trim();
    if (!z){ err.textContent = '写一下中文意思吧，考试时要靠它出题。'; zh.focus(); return; }
    if (edit){ mineEdit(edit.key, {zh:z, n:note.value}); close(); refreshMine(); toast('已更新“' + term + '”'); return; }
    mineAdd(SLUG, {t:x.t, o:x.o, ctx:s.en, czh:s.zh, zh:z, n:note.value});
    try { window.getSelection().removeAllRanges(); } catch(e){}
    close(); refreshMine();
    toast('已加入生词：' + term + '。词汇表、自测和复习页都能看到它。');
  }
  const card = h('div', {class:'uw-sheet', role:'dialog', 'aria-modal':'true', 'aria-label':edit ? '修改生词' : '加入生词'},
    h('p', {class:'eyebrow'}, edit ? '修改生词' : '加入生词'),
    h('h3', {class:'uw-term'}, term),
    h('p', {class:'uw-ctx'}, ctx.slice(0, edit ? 0 : x.o), h('b', null, edit ? '' : term), edit ? ctx : ctx.slice(x.o + term.length)),
    old ? h('p', {class:'uw-old'}, '词汇表里已经有“' + old.expr + '”（' + old.zh + '）。还要再加一个吗？') : null,
    h('label', {class:'uw-f'}, h('span', null, '中文意思'), zh),
    h('label', {class:'uw-f'}, h('span', null, '笔记'), note),
    err,
    h('div', {class:'row'},
      h('button', {type:'button', class:'btn pri', onclick:save}, edit ? '保存' : '加入生词'),
      h('button', {type:'button', class:'btn', onclick:close}, '取消')));
  zh.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); save(); } });
  bg.append(card);
  document.body.append(bg);
  document.addEventListener('keydown', onKey);
  setTimeout(function(){ zh.focus(); }, 30);
}
function refreshMine(){
  loadMine();
  buildTerms();
  renderAll();
  if (L.el.box) renderListenText();
}
let toastTimer = 0;
function toast(msg){
  let t = $('.uw-toast');
  if (!t){ t = h('div', {class:'uw-toast', role:'status'}); document.body.append(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.hidden = true; }, 3200);
}

/* ---------- wiring ---------- */
/* ---------- speaker icons: words, example sentences, article sentences ---------- */
function speakBtn(key, text){ return clipBtn(DATA.clips, key, text); }
function stopNarrationForClip(){
  if (L && L.audio && !L.audio.paused) L.audio.pause();
  if (L) L.seg = null;
}
function sentBtn(en){
  if (!DATA.audio) return null;
  const i = S.findIndex(function(s){ return s.en === en; }) >= 0 ? S.findIndex(function(s){ return s.en === en; }) : S.findIndex(function(s){ return s.en.indexOf(en) >= 0; });
  if (i < 0) return null;
  const b = spkEl('播放这一句', function(){ playArticleSentence(i, b); });
  return b;
}
function playArticleSentence(i, btn){
  const a = getAudio();
  const T = DATA.audio.t[i];
  Clip.stop();
  const wasOn = L.seg && L.seg.btn === btn && !a.paused;
  endSeg();
  if (wasOn){ a.pause(); return; }
  L.seg = {end:T[1] + 0.15, btn:btn};
  btn.classList.add('on');
  const go = function(){ a.currentTime = Math.max(0, T[0] - 0.1); };
  if (a.readyState >= 1) go(); else a.addEventListener('loadedmetadata', go, {once:true});
  const pr = a.play();
  if (pr && pr.catch) pr.catch(function(){ endSeg(); });
}
function endSeg(){
  if (L.seg && L.seg.btn) L.seg.btn.classList.remove('on');
  L.seg = null;
}

/* ---------- listen tab ---------- */
const L = {audio:null, cur:-1, loop:false, loopIdx:-1, drag:false, el:{}, spans:[], raf:0, seg:null};
const RATES = [0.75, 0.9, 1, 1.15, 1.3];
function fmtT(t){ t = Math.max(0, Math.floor(t)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
function sentAt(t){
  const T = DATA.audio.t;
  let k = 0;
  for (let i = 0; i < T.length; i++){ if (T[i][0] <= t + 0.05) k = i; else break; }
  return k;
}
function getAudio(){
  if (L.audio) return L.audio;
  const a = new Audio();
  a.preload = 'auto';
  a.src = DATA.audio.src;
  a.playbackRate = ui.rate || 1;
  try { a.preservesPitch = true; a.webkitPreservesPitch = true; } catch(e){}
  a.addEventListener('timeupdate', listenUpdate);
  a.addEventListener('play', function(){ listenPlayState(); loopFrames(); });
  a.addEventListener('pause', function(){ listenPlayState(); if (L.seg && a.currentTime < L.seg.end) endSeg(); });
  a.addEventListener('ended', function(){ listenPlayState(); listenUpdate(); });
  a.addEventListener('error', function(){ L.el.msg.textContent = '音频没有加载出来，请检查网络后再点播放。'; L.el.msg.hidden = false; });
  a.addEventListener('playing', function(){ L.el.msg.hidden = true; });
  L.audio = a;
  try {
    if ('mediaSession' in navigator){
      navigator.mediaSession.metadata = new MediaMetadata({title:DATA.title, artist:{en:'外刊精读', ko:'韩语入门', ja:'日语中级'}[LANG]});
      navigator.mediaSession.setActionHandler('play', function(){ a.play(); });
      navigator.mediaSession.setActionHandler('pause', function(){ a.pause(); });
      navigator.mediaSession.setActionHandler('seekbackward', function(){ a.currentTime = Math.max(0, a.currentTime - 5); });
      navigator.mediaSession.setActionHandler('seekforward', function(){ a.currentTime = Math.min(DATA.audio.dur, a.currentTime + 5); });
    }
  } catch(e){}
  return a;
}
function listenPlayState(){
  const playing = !!(L.audio && !L.audio.paused && !L.audio.ended);
  L.el.play.textContent = playing ? '暂停' : '播放';
  L.el.play.setAttribute('aria-pressed', String(playing));
}
function loopFrames(){
  cancelAnimationFrame(L.raf);
  const tick = function(){
    if (!L.audio || L.audio.paused) return;
    listenUpdate();
    L.raf = requestAnimationFrame(tick);
  };
  L.raf = requestAnimationFrame(tick);
}
function listenUpdate(){
  const a = L.audio;
  if (!a) return;
  const T = DATA.audio.t;
  let t = a.currentTime;
  if (L.seg && !a.paused && t >= L.seg.end){ a.pause(); endSeg(); }
  if (L.loop && L.loopIdx >= 0 && !L.seg && !a.paused && t >= T[L.loopIdx][1] + 0.2){ a.currentTime = T[L.loopIdx][0]; t = a.currentTime; }
  if (!L.drag) L.el.range.value = String(t);
  L.el.now.textContent = fmtT(t);
  const k = sentAt(t);
  if (k !== L.cur){
    L.cur = k;
    markListenSentence(!a.paused);
  }
}
function markListenSentence(follow){
  L.spans.forEach(function(sp){ sp.classList.toggle('on', Number(sp.dataset.i) === L.cur); });
  if (follow && ui.tx){
    const sp = L.spans[L.cur];
    if (sp) sp.scrollIntoView({block:'nearest', behavior:REDUCE ? 'auto' : 'smooth'});
  }
}
function playSentence(i){
  endSeg();
  Clip.stop();
  const a = getAudio();
  a.currentTime = DATA.audio.t[i][0];
  if (L.loop) L.loopIdx = i;
  a.play().catch(function(){});
  listenUpdate();
}
function seekBy(d){
  endSeg();
  const a = getAudio();
  a.currentTime = Math.min(DATA.audio.dur, Math.max(0, a.currentTime + d));
  listenUpdate();
}
function setRate(r){
  ui.rate = r; lsSet(LS_UI, ui);
  if (L.audio) L.audio.playbackRate = r;
  $$('.rate-b', L.el.box).forEach(function(b){ const on = Number(b.dataset.r) === r; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
}
function applyTextVisibility(){
  L.el.tr.hidden = !ui.tx;
  L.el.off.hidden = !!ui.tx;
}
function renderListenText(){
  if (!L.el.tr) return;
  L.el.tr.replaceChildren();
  BLOCKS.forEach(function(b){
    const sec = h('section', {class:'blk blk-' + b.type});
    const el = h(b.type === 'title' ? 'h2' : 'p', {class:b.type === 'title' ? 'a-title' : b.type === 'sub' ? 'a-deck' : 'a-para'});
    b.idx.forEach(function(i, k){
      if (k > 0) el.append(' ');
      const sp = h('span', {class:'ls', 'data-i':i, tabindex:0, role:'button', 'aria-label':'从这一句开始播放'}, marked(S[i].en));
      sp.addEventListener('click', function(){ playSentence(i); });
      sp.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); playSentence(i); } });
      el.append(sp);
    });
    sec.append(el);
    L.el.tr.append(sec);
  });
  L.spans = $$('.ls', L.el.tr);
  markListenSentence(false);
}
function renderListen(){
  const box = $('#listenBox');
  if (!DATA.audio || !box || L.el.box) return;
  L.el.box = box;
  const A = DATA.audio;
  L.el.play = h('button', {type:'button', class:'btn pri big', 'aria-pressed':'false', onclick:function(){
    endSeg();
    Clip.stop();
    const a = getAudio();
    if (a.paused || a.ended){ if (a.ended) a.currentTime = 0; a.play().catch(function(){}); } else a.pause();
  }}, '播放');
  L.el.range = h('input', {type:'range', class:'lp-range', min:0, max:A.dur, step:0.1, value:0, 'aria-label':'播放进度'});
  L.el.range.addEventListener('pointerdown', function(){ L.drag = true; });
  L.el.range.addEventListener('input', function(){
    const a = getAudio();
    a.currentTime = Number(L.el.range.value);
    L.el.now.textContent = fmtT(a.currentTime);
    const k = sentAt(a.currentTime);
    if (k !== L.cur){ L.cur = k; markListenSentence(false); }
  });
  const endDrag = function(){ L.drag = false; };
  L.el.range.addEventListener('change', endDrag);
  L.el.range.addEventListener('pointerup', endDrag);
  L.el.range.addEventListener('pointercancel', endDrag);
  L.el.now = h('span', null, '0:00');
  L.el.msg = h('p', {class:'lp-msg', hidden:true, role:'alert'});
  const rates = h('div', {class:'chips', role:'group', 'aria-label':'播放速度'});
  RATES.forEach(function(r){
    rates.append(h('button', {type:'button', class:'chip rate-b', 'data-r':r, 'aria-pressed':'false', onclick:function(){ setRate(r); }}, r + '×'));
  });
  const loopCb = h('input', {type:'checkbox'});
  loopCb.addEventListener('change', function(){
    L.loop = loopCb.checked;
    L.loopIdx = L.loop ? (L.cur >= 0 ? L.cur : 0) : -1;
  });
  const txCb = h('input', {type:'checkbox'});
  txCb.checked = !!ui.tx;
  txCb.addEventListener('change', function(){ ui.tx = txCb.checked; lsSet(LS_UI, ui); applyTextVisibility(); });
  L.el.tr = h('div', {class:'tr'});
  L.el.off = h('p', {class:'tr-off'}, '原文已隐藏。先盲听一遍，听完再勾选“显示原文”对照。');
  box.append(
    h('div', {class:'card lp'},
      h('h2', {class:'h2'}, '听力'),
      h('p', {class:'lead'}, '整篇文章的朗读（AI 合成的' + (LANG !== 'en' ? XL : (DATA.audio.voice || '').charAt(0) === 'b' ? '英式' : '美式') + '发音，语速略慢）。先盲听，再对照原文；点原文里的任意一句，就从那一句开始播放。'),
      h('div', {class:'lp-row'},
        h('button', {type:'button', class:'btn', onclick:function(){ seekBy(-5); }}, '后退 5 秒'),
        L.el.play,
        h('button', {type:'button', class:'btn', onclick:function(){ seekBy(5); }}, '前进 5 秒')
      ),
      h('div', null, L.el.range, h('div', {class:'lp-time'}, L.el.now, h('span', null, fmtT(A.dur)))),
      h('div', null, h('p', {class:'meta'}, '播放速度'), h('div', {class:'row'}, rates)),
      h('div', {class:'lp-row'},
        h('label', {class:'lp-opt'}, loopCb, '单句循环（当前这一句反复听）'),
        h('label', {class:'lp-opt'}, txCb, '显示原文')
      ),
      L.el.msg
    ),
    L.el.off,
    L.el.tr
  );
  setRate(ui.rate || 1);
  renderListenText();
  applyTextVisibility();
}
function renderAll(){
  renderMast();
  renderArticle();
  renderListen();
  renderWords();
  renderThink();
  if (quiz.phase === 'start') renderQuiz();
}
function init(){
  Clip.onBeforePlay(stopNarrationForClip);
  window.addEventListener('pagehide', settle);
  document.addEventListener('visibilitychange', function(){ if (document.hidden) settle(); });
  if (LANG !== 'en'){
    const rl = h('label', null, h('input', {type:'checkbox', id:'optRom'}), LANG === 'ja' ? ' 显示读音' : LANG === 'yue' ? ' 显示粤拼' : ' 显示罗马音');
    $('#optZh').parentNode.after(rl);
    $('#optRom').checked = !!ui[ROMK];
    document.body.classList.toggle('show-rom', !!ui[ROMK]);
    $('#optRom').addEventListener('change', function(){ ui[ROMK] = this.checked; lsSet(LS_UI, ui); document.body.classList.toggle('show-rom', ui[ROMK]); });
    const tt = $('.tab[data-tab="think"]');
    if (tt) tt.textContent = LANG === 'ja' ? '语法' : '句型';
  }
  $('#optZh').checked = !!ui.zh;
  $('#optHi').checked = !!ui.hi;
  $('#optZh').addEventListener('change', function(){ ui.zh = this.checked; lsSet(LS_UI, ui); $('#article').classList.toggle('show-zh', ui.zh); });
  $('#optHi').addEventListener('change', function(){ ui.hi = this.checked; lsSet(LS_UI, ui); renderArticle(); renderListenText(); });
  const chips = $('#chips');
  ['all','new','learning','mastered'].forEach(function(f){
    chips.append(h('button', {type:'button', class:'chip', 'data-f':f, onclick:function(){ vFilter = f; renderWords(); }}, f));
  });
  document.addEventListener('selectionchange', function(){ clearTimeout(selTimer); selTimer = setTimeout(placeAddBtn, 180); });
  window.addEventListener('resize', hideAddBtn);
  $('#wordSearch').addEventListener('input', function(){ vQuery = this.value; renderWords(); });
  $$('.tab').forEach(function(b){
    b.addEventListener('click', function(){ try { location.hash = b.dataset.tab; } catch(e){} showTab(b.dataset.tab); });
  });
  window.addEventListener('hashchange', function(){ showTab(location.hash.replace('#','')); });
  if (DATA.audio) $('.tab[data-tab="listen"]').hidden = false;
  renderAll();
  showTab(location.hash.replace('#','') || 'read');
  initCloud();
}
init();
})();
</script>
