<!doctype html>
<html lang="zh-CN" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mind the Elves · 外刊精读</title>
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: one 720px reading column under a sticky masthead; four tabs (read, words, quiz, think) share it. */
:root{
  --bg:#FFF8F1; --surface:#FFFFFF; --surface-2:#FBEFE4; --fg:#3B2F2A; --muted:#8C7B71; --line:#F2E3D6;
  --accent:#3F86D6; --accent-soft:#E4F0FC; --accent-2:#FFD27A; --on-accent:#FFFFFF;
  --koban:var(--accent); --lamp-halo:var(--accent-soft); --mark:#FFE6A6;
  --good:#3E9E6B; --good-soft:#E1F5EA; --warn:#B7791F; --warn-soft:#FFF0D6; --bad:#D14B4B; --bad-soft:#FDE4E1;
  --font-read:'Literata','Iowan Old Style',Georgia,'Songti SC','Noto Serif CJK SC',serif;
  --font-ui:ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --font-mono:ui-rounded,'SF Pro Rounded',ui-monospace,Menlo,Consolas,monospace;
  --radius:20px; --shadow:0 8px 24px -12px rgba(122,84,58,.28);
}
/* each section has its own candy colour, as on the home pages */
html[data-lang="ko"]{--accent:#E8618F; --accent-soft:#FDE6EF}
html[data-lang="ja"]{--accent:#3F9E6C; --accent-soft:#DFF3E7}
html[data-lang="yue"]{--accent:#D9693A; --accent-soft:#FCE9DE}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font:16px/1.6 var(--font-ui);background:var(--bg);color:var(--fg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.in{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* masthead */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 6px 18px -14px rgba(122,84,58,.5)}
.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;font:800 18px/1.2 var(--font-ui)}
.b-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{flex:none;padding:5px 12px;border:0;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font:700 12.5px/1.2 var(--font-ui);color:var(--muted);text-decoration:none;letter-spacing:0}
.back:hover{color:var(--fg);background:var(--surface-2)}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tab{appearance:none;position:relative;background:none;border:0;padding:9px 4px 12px;font:700 14px/1 var(--font-ui);color:var(--muted);cursor:pointer}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--accent)}
.tab.on::after{content:"";position:absolute;left:50%;bottom:4px;width:22px;height:4px;margin-left:-11px;border-radius:999px;background:var(--accent)}

main{padding-block:22px 56px}
.view[hidden]{display:none}

/* shared */
.eyebrow{font:700 12px/1.2 var(--font-ui);letter-spacing:.08em;color:var(--accent)}
.h2{margin:0 0 6px;font:800 22px/1.3 var(--font-ui);text-wrap:balance}
.h3{margin:20px 0 8px;font:800 16px/1.4 var(--font-ui)}
.lead{margin:0 0 14px;color:var(--muted);font-size:15px}
.meta{margin:0;font-size:12.5px;line-height:1.5;color:var(--muted)}
.mono{font-family:var(--font-mono);font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.card{background:var(--surface);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.btn{appearance:none;padding:9px 16px;border:2px solid var(--line);border-radius:999px;background:var(--surface);font:700 14px/1.2 var(--font-ui);cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 6px 14px -8px var(--accent)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;padding:6px 13px;border:2px solid var(--line);border-radius:999px;background:var(--surface);font:600 13px/1.2 var(--font-ui);color:var(--muted);cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg-b{appearance:none;padding:6px 11px;border:0;border-right:2px solid var(--line);background:none;font:600 12.5px/1.2 var(--font-ui);color:var(--muted);cursor:pointer}
.seg-b:last-child{border-right:0}
.seg-b.on.s-new{background:var(--surface-2);color:var(--fg)}
.seg-b.on.s-learning{background:var(--warn-soft);color:var(--warn)}
.seg-b.on.s-mastered{background:var(--good-soft);color:var(--good)}
textarea{display:block;width:100%;min-height:58px;padding:10px 13px;border:2px solid var(--line);border-radius:16px;background:var(--bg);font-size:16px;line-height:1.55;resize:vertical}
textarea:focus{border-color:var(--accent);outline:0}
mark.vw{background:var(--mark);color:inherit;border-radius:5px;padding:0 2px}

/* word context line and speaker button (used by the word cards and by the quiz feedback) */
.w-ctx{margin:0;font:italic 400 14.5px/1.65 var(--font-read);color:var(--muted)}
.spk{flex:none;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;border:0;border-radius:50%;background:var(--accent-soft);color:var(--accent);cursor:pointer}
.spk:hover{filter:brightness(.96)}
.spk.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.spk svg{display:block}

/* quiz */
.q-head{display:flex;align-items:center;justify-content:space-between;gap:14px}
.pbar{flex:1;max-width:240px;height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.pbar i{display:block;height:100%;width:var(--p,0%);border-radius:999px;background:var(--accent)}
.q-sent{margin:16px 0 8px;font:400 20px/2.1 var(--font-read);overflow-wrap:anywhere}
.q-input{display:inline-block;max-width:100%;padding:3px 10px;border:0;border-bottom:3px solid var(--accent);border-radius:10px 10px 4px 4px;background:var(--accent-soft);font:600 18px/1.4 var(--font-mono);text-align:center}
.q-input.ok{border-bottom-color:var(--good);background:var(--good-soft)}
.q-input.bad{border-bottom-color:var(--bad);background:var(--bad-soft)}
.q-hint{margin:0;font-size:14px;color:var(--muted)}
.q-zh{margin:18px 0 6px;font:500 21px/1.6 var(--font-ui);overflow-wrap:anywhere}
.q-line{margin:10px 0 8px}
.q-input.q-wide{display:block;width:100%;box-sizing:border-box;padding:8px 10px;font-size:18px;text-align:left}
.q-area{margin:8px 0 4px;font:400 17px/1.6 var(--font-read)}
.q-tgt{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0 0 6px}
.q-tgt b{padding:1px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font:600 15px/1.5 var(--font-read)}
.miss-s b,.fb b.hl{font-weight:600;background:var(--mark);border-radius:2px;padding:0 1px}
.fb{margin-top:16px;padding:14px 16px;border-radius:16px;background:var(--surface-2)}
.fb.ok{background:var(--good-soft)}
.fb.bad{background:var(--bad-soft)}
.fb p{margin:0 0 6px;font-size:14.5px}
.fb .fb-t{font-weight:600}
.fb.ok .fb-t{color:var(--good)}
.fb.bad .fb-t{color:var(--bad)}
.fb-s{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.score{margin:0 0 12px;font:400 18px/1.2 var(--font-mono);color:var(--muted)}
.score .big{font-size:48px;font-weight:800;color:var(--accent)}
.miss{padding:10px 0;border-top:2px dashed var(--line)}
.miss-s{margin:0 0 4px;font:400 17px/1.7 var(--font-read)}

.mt4{margin-top:4px}
.mt10{margin-top:10px}
.mt12{margin-top:12px}
.mb12{margin-bottom:12px}
.mb14{margin-bottom:14px}
.mb16{margin-bottom:16px}
.foot{margin-top:40px;padding:14px 18px;border-radius:var(--radius);background:var(--surface-2);font-size:12.5px;line-height:1.7;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* quiz kit: multiple choice, dictation, feedback pieces */
.q-ask{margin:14px 0 0;font-size:14px;color:var(--muted)}
.q-big{margin:6px 0 0;font:600 26px/1.35 var(--font-read);overflow-wrap:anywhere}
.q-big .spk{vertical-align:middle;margin-left:6px}
.q-ctx{margin:8px 0 0;font:italic 400 15.5px/1.7 var(--font-read);color:var(--muted)}
.mc{display:grid;gap:8px;margin:16px 0 4px}
.mc-b{appearance:none;display:flex;align-items:flex-start;gap:10px;width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:16px;background:var(--surface);text-align:left;font:400 16px/1.5 var(--font-ui);color:var(--fg);cursor:pointer}
.mc-b:hover:not(:disabled){background:var(--surface-2)}
.mc-b .n{flex:none;width:22px;height:22px;margin-top:1px;border:0;border-radius:50%;background:var(--surface-2);font:700 12px/22px var(--font-mono);text-align:center;color:var(--muted)}
.mc-b.ok{border-color:var(--good);background:var(--good-soft)}
.mc-b.bad{border-color:var(--bad);background:var(--bad-soft)}
.mc-b:disabled{cursor:default;opacity:1;color:var(--fg)}
.dict-btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 10px}
.btn.play{display:inline-flex;align-items:center;gap:7px}
.btn.play svg{display:block}
.btn.play.on{box-shadow:0 0 0 2px var(--accent-soft)}
.df{margin:0 0 8px;font:400 16.5px/1.7 var(--font-read)}
.df-l{display:block;font:500 12px/1.5 var(--font-ui);color:var(--muted)}
.miss-t{color:var(--bad);text-decoration:underline wavy;text-decoration-thickness:1px;text-underline-offset:3px}
.fb-x:empty{display:none}
.w-note{margin:0 0 6px;font-size:13.5px;line-height:1.6;color:var(--muted)}
.q-nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.q-nav[hidden],.q-past > .row{display:none}
/* Korean lessons: bigger text for a beginner, and no italics (Hangul has none) */
html[data-lang="ko"] .a-para{font-size:22px;line-height:1.9}
html[data-lang="ko"] .a-deck{font-size:19px;font-style:normal}
html[data-lang="ko"] .w-ctx,html[data-lang="ko"] .q-ctx{font-style:normal}
html[data-lang="ko"] .ex-en{font-size:17px}
html[data-lang="ko"] .q-sent{font-size:22px}
html[data-lang="ko"]{--font-read:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
/* Japanese lessons */
html[data-lang="ja"]{--font-read:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif}
html[data-lang="ja"] .a-para{font-size:20px;line-height:1.95}
html[data-lang="ja"] .a-deck{font-size:18px;font-style:normal}
html[data-lang="ja"] .w-ctx,html[data-lang="ja"] .q-ctx{font-style:normal}
html[data-lang="ja"] .ex-en{font-size:16.5px}
html[data-lang="yue"]{--font-read:"PingFang HK","PingFang TC","Noto Sans HK","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
html[data-lang="yue"] .a-para{font-size:21px;line-height:1.95}
html[data-lang="yue"] .a-deck{font-size:18px;font-style:normal}
html[data-lang="yue"] .w-ctx,html[data-lang="yue"] .q-ctx{font-style:normal}
html[data-lang="yue"] .ex-en{font-size:17px}
html[data-lang="yue"] .rom{letter-spacing:.02em}

/* learner picker, account chip and the backup / restore sheet (inlined by tools/build.py; self-contained, every class starts with who-) */
.who-chip{appearance:none;display:inline-flex;align-items:center;gap:8px;flex:none;max-width:100%;padding:3px;border:0;border-radius:999px;background:var(--surface);box-shadow:var(--shadow,none);font:600 13px/1.2 var(--font-ui);color:var(--fg);cursor:pointer}
.who-chip.full{padding-right:12px}
.who-chip:hover{background:var(--surface-2)}
.who-chip.tiny{border-color:transparent;background:none}
.who-nm{min-width:0;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-av{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font:600 14px/1 var(--font-ui)}
.who-av.lg{width:40px;height:40px;font-size:18px}

.who-ov{position:fixed;inset:0;z-index:1000;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--bg);display:flex;justify-content:center;align-items:flex-start;padding:max(28px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(32px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.who-ov.sheet{background:rgba(22,32,43,.45)}
.who-ov.sheet .who-card{margin:auto}
.who-card{width:100%;max-width:440px;padding:22px 20px;background:var(--surface);border:0;border-radius:22px;box-shadow:var(--shadow,none)}
.who-ov:not(.sheet) .who-card{margin-top:4vh;border:0;background:transparent;padding:8px 4px}
.who-eb{margin:0 0 6px;font:500 12px/1.2 var(--font-ui);letter-spacing:.1em;color:var(--accent)}
.who-h{margin:0;font:600 clamp(26px,7vw,34px)/1.2 var(--font-read);letter-spacing:-.01em}
.who-h.sm{font-size:19px}
.who-sub{margin:8px 0 0;font-size:15px;line-height:1.6;color:var(--muted)}
.who-sec{margin:20px 0 8px;font:600 13px/1.3 var(--font-ui);color:var(--muted)}
.who-list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.who-p{appearance:none;display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:16px;background:var(--surface);text-align:left;cursor:pointer}
.who-p:hover{background:var(--surface-2)}
.who-pn{display:block;font:600 16px/1.3 var(--font-ui)}
.who-pm{display:block;margin-top:2px;font-size:12.5px;line-height:1.4;color:var(--muted)}
.who-new{display:flex;gap:8px;margin:0}
.who-in{flex:1;min-width:0;padding:10px 14px;border:2px solid var(--line);border-radius:999px;background:var(--surface);font:400 16px/1.3 var(--font-ui)}
.who-in:focus{outline:2px solid var(--accent);outline-offset:1px}
.who-ta{display:block;width:100%;min-height:96px;margin:8px 0;padding:10px 12px;border:2px solid var(--line);border-radius:16px;background:var(--surface);font:400 12.5px/1.5 var(--font-mono);resize:vertical;word-break:break-all}
.who-btn{appearance:none;padding:10px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font:500 14.5px/1.2 var(--font-ui);color:var(--fg);cursor:pointer}
.who-btn:hover{background:var(--surface-2)}
.who-btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.who-btn.pri:hover{filter:brightness(1.06)}
.who-btn.dng{background:var(--bad,#B3261E);border-color:var(--bad,#B3261E);color:#fff}
.who-btn:disabled{opacity:.45;cursor:default}
.who-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.who-link{appearance:none;display:inline-block;margin:14px 0 0;padding:6px 0;border:0;background:none;font:500 14px/1.3 var(--font-ui);color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.who-msg{min-height:1.4em;margin:8px 0 0;font-size:13.5px;line-height:1.5;color:var(--muted)}
.who-msg.err{color:var(--bad,#B3261E)}
.who-msg.ok{color:var(--good,#27693F)}
.who-note{margin:18px 0 0;font-size:12.5px;line-height:1.7;color:var(--muted)}
.who-menu{display:grid;gap:8px;margin:16px 0 0}
.who-mi{appearance:none;display:block;width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:16px;background:var(--surface);text-align:left;cursor:pointer}
.who-mi:hover{background:var(--surface-2)}
.who-mi b{display:block;font:600 15px/1.3 var(--font-ui)}
.who-mi span{display:block;margin-top:2px;font-size:12.5px;line-height:1.45;color:var(--muted)}
.who-mi.dng b{color:var(--bad,#B3261E)}
.who-x{appearance:none;float:right;margin:-6px -6px 0 8px;width:36px;height:36px;border:0;border-radius:50%;background:none;font-size:24px;line-height:1;color:var(--muted);cursor:pointer}
.who-x:hover{background:var(--surface-2)}
.who-top{display:flex;align-items:center;gap:12px}

</style>
<style>
/* reader-specific styles; the shared ones are in tools/shared/base.css */
.lamp{flex:none;width:10px;height:10px;border-radius:50%;background:var(--koban);box-shadow:0 0 0 4px var(--lamp-halo)}
.prog{flex:none;text-align:right}
.prog .t{font-size:12px;line-height:1.3;color:var(--muted)}
.prog b{font:400 13px/1.3 var(--font-mono);color:var(--fg)}
.meter{width:112px;height:6px;margin:4px 0 3px auto;border-radius:999px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;width:var(--p,0%);background:var(--good)}
.prog .s{font-size:11px;min-height:14px}

/* listen */
.lp{display:grid;gap:14px}
.lp-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn.big{min-width:96px;padding:12px 22px;font-size:16px}
.lp-range{display:block;width:100%;margin:0;accent-color:var(--accent)}
.lp-time{display:flex;justify-content:space-between;margin-top:2px;font:400 12.5px/1 var(--font-mono);color:var(--muted)}
.lp-opt{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer}
.lp-opt input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.lp-msg{margin:0;font-size:13px;color:var(--bad)}
.tr{margin-top:22px}
.tr-off{margin-top:18px;padding:22px 16px;text-align:center;font-size:14.5px;color:var(--muted);border:2px dashed var(--line);border-radius:var(--radius)}
.ls{cursor:pointer;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;scroll-margin-top:140px;scroll-margin-bottom:90px}
.ls:hover{background:var(--surface-2)}
.ls.on{background:var(--accent-soft)}

/* read */
.opts{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:22px;font-size:14px;color:var(--muted)}
.opts label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.opts input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.a-title{margin:0 0 12px;font:800 clamp(26px,6.4vw,34px)/1.2 var(--font-ui);text-wrap:balance}
.a-deck{margin:0;font:italic 400 18px/1.55 var(--font-read);color:var(--muted);text-wrap:pretty}
.a-para{margin:0;font:400 18px/1.75 var(--font-read)}
.blk{margin-bottom:24px}
.blk-sub{margin-bottom:32px;padding-bottom:24px;border-bottom:2px dashed var(--line)}
.sent{cursor:pointer;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;scroll-margin-top:120px}
.sent:hover{background:var(--surface-2)}
.sent.on{background:var(--accent-soft)}
.zh{display:none;margin:10px 0 0;font:400 15px/1.75 var(--font-ui);color:var(--muted)}
.show-zh .zh{display:block}
.rom{display:none;margin:6px 0 0;font:400 14px/1.6 var(--font-ui);color:var(--muted);letter-spacing:.01em}
.show-rom .rom{display:block}
html[data-lang="ja"] .w-rom,html[data-lang="yue"] .w-rom{display:block}
.g-conn{margin:6px 0;font-size:14.5px;line-height:1.6}
.note{margin-top:12px;padding:16px 18px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);scroll-margin-top:120px}
.note-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.note-nav{display:flex;gap:6px}
.note-zh{margin:0 0 10px;font:500 16px/1.7 var(--font-ui)}
.note-list{margin:0;padding-left:1.15em;font-size:14.5px;line-height:1.7}
.note-list li{margin-bottom:5px}
.note-words{margin-top:14px;padding-top:12px;border-top:2px dashed var(--line)}

<script>
(function(){
'use strict';
/* ---------- small helpers shared by every page (inlined by tools/build.py) ---------- */
function $(s, r){ return (r || document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function h(tag, attrs){
  const e = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(k){
    const v = attrs[k];
    if (v == null || v === false) return;
    if (k === 'class') e.className = v;
    else if (k.slice(0,2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : String(v));
  });
  Array.prototype.slice.call(arguments, 2).forEach(function(kid){
    [].concat(kid).forEach(function(k){
      if (k == null || k === false) return;
      e.append(k.nodeType ? k : document.createTextNode(String(k)));
    });
  });
  return e;
}
function pad2(n){ return String(n).padStart(2, '0'); }
function ymd(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function today(){ return ymd(new Date()); }
/* Progress is kept per learner: key "k" of learner "u1" lives in localStorage as "k@u1". who.js manages the learners
   (the list is in WHO_KEY, which itself is never namespaced). WHO_ID is '' until someone has been chosen. */
const WHO_KEY = 'wk-who-v1';
function whoReg(){
  const out = {v:1, cur:'', list:[], claimed:false};
  let d = null;
  try { d = JSON.parse(localStorage.getItem(WHO_KEY) || 'null'); } catch(e){}
  if (!d || typeof d !== 'object') return out;
  if (Array.isArray(d.list)) d.list.forEach(function(p){
    if (p && typeof p.id === 'string' && /^[a-z0-9]{3,24}$/.test(p.id) && typeof p.name === 'string' && p.name.trim() &&
        !out.list.some(function(q){ return q.id === p.id; }))
      out.list.push({id:p.id, name:p.name.trim().slice(0, 16), c:typeof p.c === 'number' ? p.c : 0, u:typeof p.u === 'number' ? p.u : 0});
  });
  if (typeof d.cur === 'string' && out.list.some(function(p){ return p.id === d.cur; })) out.cur = d.cur;
  out.claimed = !!d.claimed;
  return out;
}
let WHO_ID = whoReg().cur;
function pkey(k){ return WHO_ID ? k + '@' + WHO_ID : k; }
function lsGet(k){ try { return JSON.parse(localStorage.getItem(pkey(k)) || 'null'); } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem(pkey(k), JSON.stringify(v)); } catch(e){} }
function lsDel(k){ try { localStorage.removeItem(pkey(k)); } catch(e){} }
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
/* the language a page teaches: <html data-lang="ko|ja|yue"> for those sections, English otherwise */
const LANG = (function(){ const l = typeof document !== 'undefined' && document.documentElement.getAttribute('data-lang'); return l === 'ko' || l === 'ja' || l === 'yue' ? l : 'en'; })();
const XL = {en:'英文', ko:'韩语', ja:'日语', yue:'粤语'}[LANG], XS = {en:'英', ko:'韩', ja:'日', yue:'粤'}[LANG];
/* Cantonese answers may be written in Jyutping instead of characters; tone numbers are optional (norm drops digits) */
function romOk(given, rom){ return LANG === 'yue' && !!rom && !!norm(given) && norm(given) === norm(rom); }
/* letters of the languages taught (Latin, Hangul, kana and kanji): what answer checking compares */
const LETTERS = 'a-z\\uac00-\\ud7a3\\u3040-\\u30ff\\u3005\\u4e00-\\u9fff';
function norm(s){ return String(s).toLowerCase().replace(new RegExp('[^' + LETTERS + ']', 'g'), ''); }
/* a vocabulary term inside a text: no letter just before it; after it no Latin letter (Korean particles and endings may follow) */
function termRe(terms, flags){ return new RegExp('(?<![A-Za-z\\uac00-\\ud7a3])(?:' + terms.map(esc).join('|') + ')(?![A-Za-z])', flags); }
function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
/* example sentences mark their target as [[target]] */
function exNodes(s){
  const out = [];
  s.split(/\[\[(.+?)\]\]/).forEach(function(part, k){ if (part) out.push(k % 2 ? h('b', null, part) : document.createTextNode(part)); });
  return out;
}
function exPlain(s){ return s.replace(/\[\[|\]\]/g, ''); }

/* ---------- spaced repetition on the Ebbinghaus ladder (inlined by tools/build.py) ----------
   Everything lives in this browser's localStorage under SRS_KEY (per learner, see common.js), shape
     {v:1, w:{"<slug>:<word id>": {b, t, l, c, x}}, log:{"YYYY-MM-DD": {n, ok}}, ex:[{d, score, total, scope, k}]}   (k: "exam" = 总考, "listen" = 听力考试)
   b = steps of the ladder passed (0..9)   t = when it is due next (ms)   l = last answered (ms)
   c / x = how many times answered right / wrong.   m = 1: the learner marked the word as fully mastered; it is never asked again
   (review, exam, listening) until restored. Answers given elsewhere (an article's self-test) keep the mark.
   Rules:  first answer right -> b=1 (next review after the 2nd step), first answer wrong -> b=0 (5 minutes)
           right and due     -> b+1, next review after SRS_STEPS[b] (after the last step: SRS_LONG)
           right but early   -> the schedule does not move (drilling a word again right away must not push it up the ladder)
           wrong at any time -> b=0, back to the first step
   srsStep is pure; it is covered by tools/tests/srs.test.js. */
const SRS_KEY = 'wk-srs-v1';
const SRS_MIN = 60000, SRS_HOUR = 3600000, SRS_DAY = 86400000;
const SRS_STEPS = [5 * SRS_MIN, 30 * SRS_MIN, 12 * SRS_HOUR, SRS_DAY, 2 * SRS_DAY, 4 * SRS_DAY, 7 * SRS_DAY, 15 * SRS_DAY, 30 * SRS_DAY];
const SRS_LONG = 60 * SRS_DAY;
const SRS_TOP = SRS_STEPS.length;                 /* b can go from 0 to SRS_TOP */
const SRS_LABELS = ['5 分钟', '30 分钟', '12 小时', '1 天', '2 天', '4 天', '7 天', '15 天', '30 天', '60 天'];

function srsInterval(b){ return b < SRS_STEPS.length ? SRS_STEPS[b] : SRS_LONG; }
function srsNum(x){ return typeof x === 'number' && isFinite(x) ? x : 0; }
/* sanitize anything that claims to be saved progress (from localStorage or from an imported file) */
function srsClean(d){
  const out = {v:1, w:{}, log:{}, ex:[]};
  if (!d || typeof d !== 'object') return out;
  if (d.w && typeof d.w === 'object') Object.keys(d.w).forEach(function(k){
    const e = d.w[k];
    if (k === '__proto__' || !e || typeof e !== 'object') return;
    const b = Math.max(0, Math.min(SRS_TOP, Math.floor(srsNum(e.b))));
    out.w[k] = {b:b, t:srsNum(e.t), l:srsNum(e.l), c:Math.max(0, Math.floor(srsNum(e.c))), x:Math.max(0, Math.floor(srsNum(e.x)))};
    if (e.m) out.w[k].m = 1;
  });
  if (d.log && typeof d.log === 'object') Object.keys(d.log).forEach(function(k){
    const e = d.log[k];
    if (/^\d{4}-\d{2}-\d{2}$/.test(k) && e && typeof e === 'object') out.log[k] = {n:Math.max(0, Math.floor(srsNum(e.n))), ok:Math.max(0, Math.floor(srsNum(e.ok)))};
  });
  if (Array.isArray(d.ex)) d.ex.slice(-20).forEach(function(e){
    if (e && typeof e === 'object' && typeof e.score === 'number' && typeof e.total === 'number')
      out.ex.push({d:String(e.d || '').slice(0, 10), score:e.score, total:e.total, scope:String(e.scope || '').slice(0, 60), k:e.k === 'listen' ? 'listen' : 'exam'});
  });
  return out;
}
function srsLoad(){ return srsClean(lsGet(SRS_KEY)); }
/* two copies of the same learner's progress (this device + an imported one) -> one. A word keeps the copy that was answered last;
   a day's counts keep the larger tally (the same answers are in both copies, so adding them would count twice); results are united. */
function srsMerge(a, b){
  a = srsClean(a); b = srsClean(b);
  const out = {v:1, w:{}, log:{}, ex:[]};
  Object.keys(a.w).forEach(function(k){ out.w[k] = a.w[k]; });
  Object.keys(b.w).forEach(function(k){
    const x = out.w[k], y = b.w[k];
    if (!x || y.l > x.l || (y.l === x.l && y.c + y.x > x.c + x.x)) out.w[k] = y;
  });
  [a.log, b.log].forEach(function(lg){
    Object.keys(lg).forEach(function(k){
      const g = out.log[k], e = lg[k];
      if (!g || e.n > g.n || (e.n === g.n && e.ok > g.ok)) out.log[k] = e;
    });
  });
  const seen = {};
  a.ex.concat(b.ex).forEach(function(e){
    const id = [e.d, e.score, e.total, e.scope, e.k].join('|');
    if (!seen[id]){ seen[id] = 1; out.ex.push(e); }
  });
  out.ex.sort(function(x, y){ return x.d < y.d ? -1 : x.d > y.d ? 1 : 0; });
  out.ex = out.ex.slice(-20);
  return out;
}
function srsSave(s){ lsSet(SRS_KEY, s); }
function srsGet(key){ return srsLoad().w[key] || null; }

/* pure: the entry after one answer (e = null when the word has never been answered) */
function srsStep(e, ok, now){
  const first = !e;
  const n = first ? {b:0, t:0, l:0, c:0, x:0} : {b:e.b, t:e.t, l:e.l, c:e.c, x:e.x};
  if (e && e.m) n.m = 1;
  if (!ok){
    n.b = 0; n.t = now + srsInterval(0); n.x++;
  } else {
    n.c++;
    if (first){ n.b = 1; n.t = now + srsInterval(1); }
    else if (n.t <= now){ n.b = Math.min(n.b + 1, SRS_TOP); n.t = now + srsInterval(n.b); }
  }
  n.l = now;
  return n;
}
/* what would happen, without writing anything: {kind:'first'|'up'|'early'|'reset', b, t} */
function srsPreview(key, ok, now){
  now = now || Date.now();
  const e = srsGet(key), n = srsStep(e, ok, now);
  const kind = !ok ? 'reset' : !e ? 'first' : e.t <= now ? 'up' : 'early';
  return {kind:kind, b:n.b, t:n.t, was:e};
}
function srsRecord(key, ok, now){
  now = now || Date.now();
  const s = srsLoad();
  const prev = s.w[key] || null;
  s.w[key] = srsStep(prev, ok, now);
  const day = ymd(new Date(now));
  const g = s.log[day] || (s.log[day] = {n:0, ok:0});
  g.n++; if (ok) g.ok++;
  const keep = Object.keys(s.log).sort().slice(-120);
  Object.keys(s.log).forEach(function(k){ if (keep.indexOf(k) < 0) delete s.log[k]; });
  srsSave(s);
  return {prev:prev, next:s.w[key], now:now};
}
/* take back one srsRecord(key, ok, now) whose result was `rec` (used when the learner overrules a mark afterwards) */
function srsUndo(key, rec, ok){
  const s = srsLoad();
  if (rec.prev) s.w[key] = rec.prev; else delete s.w[key];
  const g = s.log[ymd(new Date(rec.now))];
  if (g){ g.n = Math.max(0, g.n - 1); if (ok) g.ok = Math.max(0, g.ok - 1); }
  srsSave(s);
}
/* mark a word as fully mastered (on) or put it back into the review plan; `l` moves so that merging progress keeps this choice */
function srsRetire(key, on, now){
  now = now || Date.now();
  const s = srsLoad();
  const e = s.w[key] || {b:SRS_TOP, t:now + SRS_LONG, l:now, c:0, x:0};
  if (on) e.m = 1; else delete e.m;
  e.l = now;
  s.w[key] = e;
  srsSave(s);
  return e;
}
/* drop a word from the plan altogether (a word the learner added and then deleted) */
function srsForget(key){
  const s = srsLoad();
  if (!s.w[key]) return;
  delete s.w[key];
  srsSave(s);
}
function srsAddExam(rec){
  const s = srsLoad();
  s.ex.push(rec);
  s.ex = s.ex.slice(-20);
  srsSave(s);
}
/* the learner overruled a mark in the result list: correct the score of the exam just saved */
function srsSetLastExamScore(score){
  const s = srsLoad();
  if (s.ex.length){ s.ex[s.ex.length - 1].score = score; srsSave(s); }
}
function srsReset(){ lsDel(SRS_KEY); }

/* {st:'new'|'due'|'wait', b, t} */
function srsInfo(e, now){
  if (!e) return {st:'new', b:-1, t:0};
  if (e.m) return {st:'done', b:e.b, t:e.t};
  return {st:e.t <= now ? 'due' : 'wait', b:e.b, t:e.t};
}
/* "5 分钟后", "3 小时后", "明天", "6 天后" */
function srsWhen(t, now){
  const d = t - now;
  if (d <= 0) return '现在';
  if (d < SRS_HOUR) return Math.max(1, Math.round(d / SRS_MIN)) + ' 分钟后';
  if (d < SRS_DAY) return Math.round(d / SRS_HOUR) + ' 小时后';
  const days = Math.round(d / SRS_DAY);
  if (days === 1) return '明天';
  if (days < 60) return days + ' 天后';
  return Math.round(days / 30) + ' 个月后';
}
function srsStageText(e, now){
  if (!e) return '未开始';
  if (e.m) return '已完全掌握，不再出现';
  return '间隔 ' + SRS_LABELS[e.b] + ' · ' + (e.t <= now ? '该复习了' : '下次 ' + srsWhen(e.t, now));
}

/* ---------- my words: expressions the learner marked in an article themself (select text → 加入生词) ----------
   MINE_KEY (per learner): {v:1, w:{"<slug>:<id>": {t, o, ctx, czh, zh, n, a, u, d}}}
   id = "u" + a few base-36 characters; t = the text as selected; ctx = the article sentence it came from, o = where t starts in ctx;
   czh = the sentence's Chinese; zh = the meaning the learner wrote; n = an optional note; a = added, u = last edited (ms);
   d = deleted (ms): kept as a tombstone so that a delete survives merging with an older copy from another device.
   A word becomes an ordinary vocabulary entry (mineWord) and reviews under the SRS key "<slug>:<id>" like any other. */
const MINE_KEY = 'wk-mine-v1';
const MINE_RE = /^[a-z0-9][a-z0-9-]{0,79}:u[a-z0-9]{2,16}$/;
function mineStr(x, n){ return typeof x === 'string' ? x.replace(/[\u0000-\u001f\u007f]/g, ' ').slice(0, n) : ''; }
function mineClean(d){
  const out = {v:1, w:{}};
  if (!d || typeof d !== 'object' || !d.w || typeof d.w !== 'object') return out;
  Object.keys(d.w).forEach(function(k){
    const e = d.w[k];
    if (!MINE_RE.test(k) || !e || typeof e !== 'object') return;
    const t = mineStr(e.t, 80).trim(), ctx = mineStr(e.ctx, 600);
    if (!t || !ctx) return;
    let o = Math.floor(srsNum(e.o));
    if (ctx.substr(o, t.length) !== t) o = ctx.indexOf(t);
    if (o < 0) return;
    const x = {t:t, o:o, ctx:ctx, czh:mineStr(e.czh, 600), zh:mineStr(e.zh, 200).trim(), n:mineStr(e.n, 400).trim(), a:srsNum(e.a)};
    if (srsNum(e.u)) x.u = srsNum(e.u);
    if (srsNum(e.d)) x.d = srsNum(e.d);
    out.w[k] = x;
  });
  return out;
}
/* per word the copy changed last wins (added, edited or deleted) */
function mineMerge(a, b){
  a = mineClean(a); b = mineClean(b);
  const out = {v:1, w:{}};
  function stamp(e){ return Math.max(e.a, e.u || 0, e.d || 0); }
  Object.keys(a.w).forEach(function(k){ out.w[k] = a.w[k]; });
  Object.keys(b.w).forEach(function(k){ if (!out.w[k] || stamp(b.w[k]) > stamp(out.w[k])) out.w[k] = b.w[k]; });
  return out;
}
function mineLoad(){ return mineClean(lsGet(MINE_KEY)); }
function mineSave(m){ lsSet(MINE_KEY, m); }
/* the live (not deleted) words of one article, oldest first: [[key, entry]] */
function mineOf(slug){
  const w = mineLoad().w;
  return Object.keys(w).filter(function(k){ return k.split(':')[0] === slug && !w[k].d; })
    .map(function(k){ return [k, w[k]]; }).sort(function(x, y){ return x[1].a - y[1].a; });
}
/* an entry -> a vocabulary word in the shape the reader, the quiz kit and the review page use */
function mineWord(key, e){
  const id = key.split(':')[1];
  const before = e.ctx.slice(0, e.o), after = e.ctx.slice(e.o + e.t.length);
  const lower = e.t.toLowerCase();
  return {id:id, mine:true, expr:e.t, zh:e.zh || '（还没写中文意思）', core:e.t, forms:lower === e.t ? [e.t] : [e.t, lower], syn:[], m:[e.t],
    note:e.n, ctx:e.ctx, ex:[{en:before + '[[' + e.t + ']]' + after, zh:e.czh || ''}],
    cloze:{before:before, ans:e.t, after:after, hint:e.zh || '', szh:e.czh || ''}};
}
function mineAdd(slug, x){
  const m = mineLoad();
  let key;
  do { key = slug + ':u' + Date.now().toString(36).slice(-6) + Math.random().toString(36).slice(2, 4); } while (m.w[key]);
  m.w[key] = {t:x.t, o:x.o, ctx:x.ctx, czh:x.czh || '', zh:x.zh || '', n:x.n || '', a:Date.now()};
  mineSave(m);
  return key;
}
function mineEdit(key, patch){
  const m = mineLoad(), e = m.w[key];
  if (!e) return;
  if (typeof patch.zh === 'string') e.zh = patch.zh.trim().slice(0, 200);
  if (typeof patch.n === 'string') e.n = patch.n.trim().slice(0, 400);
  e.u = Date.now();
  mineSave(m);
}
function mineDel(key){
  const m = mineLoad(), e = m.w[key];
  if (!e) return;
  e.d = Date.now();
  mineSave(m);
}

/* ---------- learners: who is studying on this browser (inlined by tools/build.py; needs common.js and srs.js) ----------
   The site is static and has no server, so there are no passwords: a learner is a name that keeps its progress apart from other learners'
   (every localStorage key of a learner is "<key>@<id>", see common.js). The list of learners is stored under WHO_KEY:
     {v:1, cur:"<id>", list:[{id, name, c: created, u: last used}], claimed: bool}
   claimed: progress saved before learners existed (plain wk-* / fk-* keys) goes to the first learner created, once.
   Progress moves between devices as a "progress code" ("WK1." + base64 of a JSON bundle) or as the same JSON in a file. Importing MERGES
   (the newer answer per word wins); it never overwrites. Merge and parse are pure-ish and covered by tools/tests/who.test.js.
   If a new kind of progress is stored in localStorage, it must be a key starting with wk- or fk-; it is then exported, imported and deleted
   with the learner. Anything that is not the SRS key, MINE_KEY (words the learner added) or a UI-preference key is treated as one article's state (see stateClean). */

/* one article's progress: {v:1, vocab:{id:{s,d,m}}, ans:{key:text}, quiz:{score,total,d,k}|null} */
function stateClean(d){
  const out = {v:1, vocab:{}, ans:{}, quiz:null};
  if (!d || typeof d !== 'object') return out;
  if (d.vocab && typeof d.vocab === 'object') Object.keys(d.vocab).forEach(function(k){
    const e = d.vocab[k];
    if (k === '__proto__' || !e || typeof e !== 'object') return;
    const o = {};
    if (e.s === 'learning' || e.s === 'mastered') o.s = e.s;
    if (typeof e.d === 'string') o.d = e.d.slice(0, 10);
    if (typeof e.m === 'string' && e.m) o.m = e.m.slice(0, 400);
    if (o.s || o.m) out.vocab[k] = o;
  });
  if (d.ans && typeof d.ans === 'object') Object.keys(d.ans).forEach(function(k){
    if (k !== '__proto__' && typeof d.ans[k] === 'string' && d.ans[k]) out.ans[k] = d.ans[k].slice(0, 2000);
  });
  if (d.quiz && typeof d.quiz === 'object' && typeof d.quiz.score === 'number' && typeof d.quiz.total === 'number')
    out.quiz = {score:d.quiz.score, total:d.quiz.total, d:String(d.quiz.d || '').slice(0, 10), k:['mcq', 'cloze', 'exs', 'zh', 'dict', 'sent'].indexOf(d.quiz.k) >= 0 ? d.quiz.k : ''};
  return out;
}
/* two copies of one article's progress -> one: per word the copy touched last wins (a status or note only one copy has is kept),
   answers are united (this device's text wins a clash), the later quiz result is kept */
function stateMerge(a, b){
  a = stateClean(a); b = stateClean(b);
  const out = {v:1, vocab:{}, ans:{}, quiz:null};
  Object.keys(a.vocab).forEach(function(k){ out.vocab[k] = a.vocab[k]; });
  Object.keys(b.vocab).forEach(function(k){
    const x = out.vocab[k], y = b.vocab[k];
    if (!x){ out.vocab[k] = y; return; }
    const yNewer = (y.d || '') > (x.d || '');
    const n = yNewer ? y : x, o = yNewer ? x : y;
    const m = {};
    if (n.s || o.s) m.s = n.s || o.s;
    if (n.m || o.m) m.m = n.m || o.m;
    if (n.d || o.d) m.d = n.d || o.d;
    out.vocab[k] = m;
  });
  Object.keys(b.ans).forEach(function(k){ out.ans[k] = b.ans[k]; });
  Object.keys(a.ans).forEach(function(k){ out.ans[k] = a.ans[k]; });
  out.quiz = !a.quiz ? b.quiz : !b.quiz ? a.quiz : (b.quiz.d > a.quiz.d ? b.quiz : a.quiz);
  return out;
}

const Who = (function(){
  const KEEP = /^(wk|fk)-[A-Za-z0-9._-]{1,80}$/;     /* what a learner's progress keys look like */
  const UI_KEYS = ['fk-ui-v1', 'wk-review-ui-v1'];
  const PREFIX = 'WK1.';
  const MAXLEN = 2000000;
  const DAY = 86400000;

  function canStore(){
    try { localStorage.setItem('wk-probe', '1'); localStorage.removeItem('wk-probe'); return true; } catch(e){ return false; }
  }
  function saveReg(reg){ try { localStorage.setItem(WHO_KEY, JSON.stringify(reg)); return true; } catch(e){ return false; } }
  function newId(reg){
    let id;
    do { id = 'u' + Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 6); } while (reg.list.some(function(p){ return p.id === id; }));
    return id;
  }
  function cleanName(s){ return String(s == null ? '' : s).replace(/[\u0000-\u001f\u007f]/g, '').replace(/\s+/g, ' ').trim().slice(0, 16); }
  function byName(reg, name){
    const n = name.toLowerCase();
    return reg.list.filter(function(p){ return p.name.toLowerCase() === n; })[0] || null;
  }
  function list(){ return whoReg().list; }
  function current(){ return whoReg().list.filter(function(p){ return p.id === WHO_ID; })[0] || null; }
  /* a browser that cannot store anything (some private modes) gets no picker: nothing could be saved for anyone anyway */
  function ready(){ return !!WHO_ID || !canStore(); }

  function allKeys(){
    const out = [];
    try { for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k) out.push(k); } } catch(e){}
    return out;
  }
  function keysOf(id){
    const suf = '@' + id;
    return allKeys().filter(function(k){ return k.length > suf.length && k.slice(-suf.length) === suf; })
      .map(function(k){ return k.slice(0, -suf.length); })
      .filter(function(b){ return KEEP.test(b) && b !== WHO_KEY; });
  }
  function legacyKeys(){ return allKeys().filter(function(k){ return KEEP.test(k) && k !== WHO_KEY; }); }
  function claim(id){
    legacyKeys().forEach(function(k){
      try { const v = localStorage.getItem(k); if (v != null && localStorage.getItem(k + '@' + id) == null) localStorage.setItem(k + '@' + id, v); } catch(e){}
    });
  }
  function readKey(k, id){ try { return JSON.parse(localStorage.getItem(k + '@' + id) || 'null'); } catch(e){ return null; } }

  /* ---- learners ---- */
  function create(name){
    name = cleanName(name);
    if (!name) return {ok:false, err:'请先写一个名字。'};
    const reg = whoReg();
    let p = byName(reg, name);
    const existed = !!p;
    if (!p){
      p = {id:newId(reg), name:name, c:Date.now(), u:0};
      reg.list.push(p);
      if (!reg.claimed){ claim(p.id); reg.claimed = true; }
    }
    p.u = Date.now(); reg.cur = p.id;
    if (!saveReg(reg)) return {ok:false, err:'浏览器不让保存数据（可能开了无痕模式），进度存不下来。'};
    return {ok:true, id:p.id, name:p.name, existed:existed};
  }
  function select(id){
    const reg = whoReg();
    const p = reg.list.filter(function(q){ return q.id === id; })[0];
    if (!p) return false;
    p.u = Date.now(); reg.cur = id;
    return saveReg(reg);
  }
  function leave(){ const reg = whoReg(); reg.cur = ''; return saveReg(reg); }
  function remove(id){
    keysOf(id).forEach(function(k){ try { localStorage.removeItem(k + '@' + id); } catch(e){} });
    const reg = whoReg();
    reg.list = reg.list.filter(function(p){ return p.id !== id; });
    if (reg.cur === id) reg.cur = '';
    return saveReg(reg);
  }

  /* ---- backup / restore ---- */
  function b64e(str){
    return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(_, x){ return String.fromCharCode(parseInt(x, 16)); }));
  }
  function b64d(b){
    const bin = atob(b);
    let p = '';
    for (let i = 0; i < bin.length; i++) p += '%' + ('0' + bin.charCodeAt(i).toString(16)).slice(-2);
    return decodeURIComponent(p);
  }
  function bundle(id){
    const p = whoReg().list.filter(function(q){ return q.id === id; })[0];
    const data = {};
    keysOf(id).forEach(function(k){ const v = readKey(k, id); if (v && typeof v === 'object') data[k] = v; });
    return {app:'waikan', v:1, name:p ? p.name : '', at:new Date().toISOString(), data:data};
  }
  function toCode(b){ return PREFIX + b64e(JSON.stringify(b)); }
  /* text pasted by the learner (a code, possibly with chat noise around it) or the content of an exported file */
  function parse(text){
    text = String(text == null ? '' : text).trim();
    if (!text) return {ok:false, err:'先把进度码粘贴进来，或选一个导出的文件。'};
    if (text.length > MAXLEN) return {ok:false, err:'内容太大，不像是进度码。'};
    let raw = null;
    if (text.charAt(0) === '{'){
      try { raw = JSON.parse(text); } catch(e){ return {ok:false, err:'文件读不出来，可能不完整。'}; }
    } else {
      const i = text.indexOf(PREFIX);
      if (i < 0) return {ok:false, err:'没有找到进度码。完整的进度码以 WK1. 开头。'};
      const rest = text.slice(i + PREFIX.length);
      const run = rest.match(/^[A-Za-z0-9+\/=_\-\s]*/)[0];
      const cands = [run.replace(/\s+/g, ''), (run.trim().split(/\s+/)[0] || '')];
      for (let k = 0; k < cands.length && raw === null; k++){
        try { raw = JSON.parse(b64d(cands[k].replace(/-/g, '+').replace(/_/g, '/'))); } catch(e){ raw = null; }
      }
      if (raw === null) return {ok:false, err:'进度码读不出来，可能复制得不完整，请整串重新复制。'};
    }
    if (!raw || typeof raw !== 'object' || raw.app !== 'waikan' || !raw.data || typeof raw.data !== 'object' || Array.isArray(raw.data))
      return {ok:false, err:'这不是本站导出的进度。'};
    const data = {};
    Object.keys(raw.data).forEach(function(k){
      const v = raw.data[k];
      if (KEEP.test(k) && k !== WHO_KEY && v && typeof v === 'object' && !Array.isArray(v)) data[k] = v;
    });
    if (!Object.keys(data).length) return {ok:false, err:'这份进度里没有可导入的内容。'};
    return {ok:true, name:cleanName(raw.name), data:data};
  }
  function uiClean(d){
    const o = {};
    if (d && typeof d === 'object') Object.keys(d).forEach(function(k){
      const v = d[k];
      if (k !== '__proto__' && (typeof v === 'boolean' || (typeof v === 'number' && isFinite(v)) || (typeof v === 'string' && v.length <= 40))) o[k] = v;
    });
    return o;
  }
  /* merge parsed.data into learner id. {words: words in the imported schedule, articles: article states merged} */
  function mergeData(id, data){
    const out = {words:0, articles:0};
    Object.keys(data).forEach(function(k){
      const cur = readKey(k, id);
      let next;
      if (k === SRS_KEY){ next = srsMerge(cur, data[k]); out.words = Object.keys(srsClean(data[k]).w).length; }
      else if (k === MINE_KEY) next = mineMerge(cur, data[k]);
      else if (UI_KEYS.indexOf(k) >= 0) next = Object.assign(uiClean(data[k]), uiClean(cur));
      else { next = stateMerge(cur, data[k]); out.articles++; }
      try { localStorage.setItem(k + '@' + id, JSON.stringify(next)); } catch(e){}
    });
    return out;
  }

  /* ---- what a learner has done so far, for the picker ---- */
  function agoText(t){
    const a = new Date(t), n = new Date();
    const d = Math.round((new Date(n.getFullYear(), n.getMonth(), n.getDate()) - new Date(a.getFullYear(), a.getMonth(), a.getDate())) / DAY);
    return d <= 0 ? '今天' : d === 1 ? '昨天' : d + ' 天前';
  }
  function summary(id){
    const s = srsClean(readKey(SRS_KEY, id));
    let last = 0, mastered = 0;
    Object.keys(s.w).forEach(function(k){ if (s.w[k].l > last) last = s.w[k].l; });
    keysOf(id).forEach(function(k){
      if (k === SRS_KEY || k === MINE_KEY || UI_KEYS.indexOf(k) >= 0) return;
      const st = stateClean(readKey(k, id));
      Object.keys(st.vocab).forEach(function(v){ if (st.vocab[v].s === 'mastered') mastered++; });
    });
    const bits = [];
    if (mastered) bits.push('已掌握 ' + mastered + ' 个词');
    const n = Object.keys(s.w).length;
    if (n) bits.push('复习计划 ' + n + ' 个词');
    if (last) bits.push('上次学习：' + agoText(last));
    /* no-break spaces inside a part: the line may only wrap between the parts */
    return bits.length ? bits.map(function(b){ return b.replace(/ /g, '\u00a0'); }).join(' · ') : '还没开始学';
  }

  /* ---------------- interface ---------------- */
  function initial(name){ const c = Array.from(name || '?')[0] || '?'; return c.toUpperCase(); }
  function avatar(name, big){ return h('span', {class:'who-av' + (big ? ' lg' : ''), 'aria-hidden':'true'}, initial(name)); }
  function copyText(ta){
    function legacy(){ try { return Promise.resolve(!!document.execCommand('copy')); } catch(e){ return Promise.resolve(false); } }
    ta.focus(); ta.select();
    try { ta.setSelectionRange(0, ta.value.length); } catch(e){}
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(ta.value).then(function(){ return true; }, legacy);
    return legacy();
  }
  function saveFile(name, text){
    try {
      const url = URL.createObjectURL(new Blob([text], {type:'application/json'}));
      const a = h('a', {href:url, download:name});
      document.body.append(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      return true;
    } catch(e){ return false; }
  }
  /* replaceChildren that skips the null / false entries of a conditional list (they would otherwise be written as the text "null") */
  function put(el, kids){ el.replaceChildren.apply(el, kids.filter(function(k){ return k != null && k !== false; })); }
  function lock(on){ try { document.documentElement.style.overflow = on ? 'hidden' : ''; } catch(e){} }
  function msgEl(){ return h('p', {class:'who-msg', 'aria-live':'polite'}); }
  function say(el, text, kind){ el.className = 'who-msg' + (kind ? ' ' + kind : ''); el.textContent = text; }

  /* paste area + file picker + button; apply(parsed) -> {ok, msg, done?} */
  function importForm(apply){
    const ta = h('textarea', {class:'who-ta', placeholder:'把进度码粘贴到这里（以 WK1. 开头）', 'aria-label':'进度码', spellcheck:'false', autocomplete:'off', autocapitalize:'off'});
    const msg = msgEl();
    const file = h('input', {type:'file', accept:'.json,.txt,text/plain,application/json', hidden:true});
    file.addEventListener('change', function(){
      const f = file.files && file.files[0];
      if (!f) return;
      if (f.size > MAXLEN){ say(msg, '文件太大，不像是进度文件。', 'err'); return; }
      const r = new FileReader();
      r.onload = function(){ ta.value = String(r.result || ''); say(msg, '文件已读入，点“导入”。', ''); };
      r.onerror = function(){ say(msg, '文件读取失败。', 'err'); };
      r.readAsText(f);
      file.value = '';
    });
    const go = h('button', {type:'button', class:'who-btn pri'}, '导入');
    go.addEventListener('click', function(){
      const p = parse(ta.value);
      if (!p.ok){ say(msg, p.err, 'err'); return; }
      const r = apply(p);
      say(msg, r.msg, r.ok ? 'ok' : 'err');
      if (r.ok) go.disabled = true;
    });
    return {ta:ta, node:h('div', null, ta, h('div', {class:'who-row'}, go, h('button', {type:'button', class:'who-btn', onclick:function(){ file.click(); }}, '选择文件')), msg, file)};
  }
  function importMsg(p, r, name){
    return '已把' + (p.name ? '「' + p.name + '」的' : '') + '进度合并到「' + name + '」：复习计划 ' + r.words + ' 个词，' + r.articles + ' 篇文章。正在刷新……';
  }

  /* the picker shown instead of the page while nobody has been chosen */
  function gate(){
    const reg = whoReg();
    const err = h('p', {class:'who-msg err', role:'alert'});
    const input = h('input', {class:'who-in', type:'text', maxlength:16, placeholder:'你的名字或昵称', autocomplete:'off', autocapitalize:'off', 'aria-label':'名字'});
    const card = h('div', {class:'who-card'});
    const ov = h('div', {class:'who-ov', role:'dialog', 'aria-modal':'true', 'aria-label':'选择学习者'}, card);
    function enter(r){ if (!r.ok){ say(err, r.err, 'err'); return; } location.reload(); }
    function main(){
      const people = reg.list.slice().sort(function(a, b){ return (b.u || 0) - (a.u || 0); });
      const form = h('form', {class:'who-new', onsubmit:function(e){ e.preventDefault(); enter(create(input.value)); }}, input, h('button', {type:'submit', class:'who-btn pri'}, '进入'));
      put(card, [
        h('p', {class:'who-eb'}, 'DAILY CLOSE READING'),
        h('h1', {class:'who-h'}, '外刊精读合集'),
        h('p', {class:'who-sub'}, people.length ? '选你的名字继续学。每个人的进度分开保存。' : '先写一个名字，你的生词、自测和复习进度会存在这个名字下。'),
        people.length ? h('p', {class:'who-sec'}, '这台设备上的学习者') : null,
        people.length ? h('ul', {class:'who-list'}, people.map(function(p){
          return h('li', null, h('button', {type:'button', class:'who-p', onclick:function(){ enter(select(p.id) ? {ok:true} : {ok:false, err:'没能切换，请刷新后重试。'}); }},
            avatar(p.name, true), h('span', null, h('span', {class:'who-pn'}, p.name), h('span', {class:'who-pm'}, summary(p.id)))));
        })) : null,
        h('p', {class:'who-sec'}, people.length ? '换一个人，或新建' : '你的名字'),
        form, err,
        !people.length && legacyKeys().length ? h('p', {class:'who-note'}, '这台设备上已经有一份学习进度，建好名字后它会自动归到这个名字下。') : null,
        h('button', {type:'button', class:'who-link', onclick:importView}, '已有进度码？导入进度'),
        h('p', {class:'who-note'}, '名字只用来把进度分开，不是密码，这台设备上的人都能切换。进度存在这台设备的浏览器里：换手机或清理浏览器数据前，请在右上角头像里“导出进度”备份。')]);
      setTimeout(function(){ try { input.focus({preventScroll:true}); } catch(e){} }, 0);
    }
    function importView(){
      const f = importForm(function(p){
        const r = create(p.name || '我');
        if (!r.ok) return {ok:false, msg:r.err};
        const m = mergeData(r.id, p.data);
        setTimeout(function(){ location.reload(); }, 1300);
        return {ok:true, msg:importMsg(p, m, r.name)};
      });
      put(card, [
        h('p', {class:'who-eb'}, '导入进度'),
        h('h1', {class:'who-h sm'}, '用进度码找回你的进度'),
        h('p', {class:'who-sub'}, '在旧设备上点右上角头像，选“导出进度”，复制进度码（或保存文件），再粘贴到这里。会按进度码里的名字新建账号；这个名字已存在就合并进去。'),
        f.node,
        h('button', {type:'button', class:'who-link', onclick:main}, '‹ 返回')]);
    }
    main();
    lock(true);
    document.body.append(ov);
  }

const Clip = (function(){

  const audios = {};
  let beforePlay = null;
  function done(){
    clearTimeout(st.timer);
    st.tok++;
    if (st.btn){ st.btn.classList.remove('on'); st.btn = null; }
  }
  function fallback(text){
    try {
      if (!('speechSynthesis' in window) || !text) return;

      u.lang = {en:'en-GB', ko:'ko-KR', ja:'ja-JP', yue:'zh-HK'}[LANG]; u.rate = 0.9;

    } catch(e){}
  }

    if (audios[src]) return audios[src];
    const a = new Audio();
    a.preload = 'auto';
    a.src = src;
    a.addEventListener('error', function(){ if (st.a === a){ const t = st.text; done(); fallback(t); } });
    a.addEventListener('ended', function(){ if (st.a === a) done(); });

    if (st.a && !st.a.paused) st.a.pause();

  }

})();

    main.addEventListener('click', function(){ if (checked) o.onNext(); else check(); });
    inp.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); main.click(); } });
    return card;
  }

  /* ---- Chinese sentence -> the whole English sentence, graded by the learner ---- */
  function sentRe(v){
    const alts = v.forms.map(function(f){
      return f.toLowerCase().split(new RegExp('[^' + LETTERS + ']+')).filter(Boolean).map(esc).join('[^A-Za-z\\uac00-\\ud7a3\\u3040-\\u30ff\\u3005\\u4e00-\\u9fff]*');
    });
    return new RegExp('(?:^|[^A-Za-z\\uac00-\\ud7a3])(?:' + alts.join('|') + ')(?![A-Za-z])', 'i');
  }
  function sentQ(item, o){
    const v = item.v, x = v.ex[item.k], res = newRes(item, 'sent');
    const hide = !!o.hideTarget;
    const ta = h('textarea', inputAttrs({class:'q-area', rows:3, maxlength:400, placeholder:'把这句话写成' + XL, 'aria-label':'写出整句' + XL}));
    const hintP = h('p', {class:'q-hint'});
    const fb = h('div', {class:'fb', hidden:true, 'aria-live':'polite'});
    const main = h('button', {type:'button', class:'btn pri'}, '核对');
    const peek = h('button', {type:'button', class:'btn'}, hide ? '提示：要用的表达' : '提示：这个表达的意思');
    const ex = extraBox(item, res, o);
    let stage = 0;      /* 0 writing, 1 compared with the reference, 2 graded */
    const card = h('div', {class:'card'},
      head(o, 'sent'),
      h('p', {class:'q-zh'}, x.zh),
      hide ? h('p', {class:'q-tgt'}, h('span', {class:'meta'}, '翻译成' + XL + '，用上一个学过的表达。'))
           : h('p', {class:'q-tgt'}, h('span', {class:'meta'}, '请用上'), h('b', null, v.expr)),
      hintP,
      ta,
      fb,
      h('div', {class:'row'}, main, peek)
    );
    peek.addEventListener('click', function(){ hintP.textContent = v.expr + '：' + v.zh; peek.hidden = true; ta.focus(); });
    function check(){
      const val = ta.value.trim();
      if (!val){ ta.focus(); return; }
      const used = sentRe(v).test(val) || (LANG === 'yue' && !!v.rom && norm(val).indexOf(norm(v.rom)) >= 0);
      ta.readOnly = true;
      fb.className = 'fb ' + (used ? 'ok' : 'bad');
      fb.hidden = false;
      const verdict = h('p', {class:'fb-t'}, '对照参考句，自己判断：时态、搭配、拼写有没有问题。意思对、表达自然就算写对。');
      const gradeRow = h('div', {class:'row'},
        h('button', {type:'button', class:'btn pri', onclick:function(){ grade(true); }}, '我写对了'),
        h('button', {type:'button', class:'btn', onclick:function(){ grade(false); }}, '还要再练'));
      function grade(ok){
        res.ok = ok; res.given = ta.value.trim();
        o.onAnswer(res);
        stage = 2;
        fb.className = 'fb ' + (ok ? 'ok' : 'bad');
        verdict.textContent = ok ? '你判定：写对了' : '你判定：还要再练';
        gradeRow.replaceWith(ex);
        ex.refresh();
        main.textContent = nextLabel(o);
        main.hidden = false;
        main.focus();
      }
      fb.replaceChildren(
        h('p', {class:'fb-t'}, used ? '用到了 ' + v.expr : '没看到 ' + v.expr + '（词形变化也算）'),
        h('p', null, clipBtn(item.clips, 'e' + v.id + '_' + item.k, exPlain(x.en)), item.clips ? ' ' : null, '参考句：', exNodes(x.en)),
        LANG === 'yue' && x.rom ? h('p', {class:'meta'}, x.rom) : '',
        hide ? h('p', {class:'meta'}, v.expr + '：' + v.zh) : '',
        verdict,
        gradeRow
      );
      stage = 1;
      main.hidden = true;
      peek.hidden = true;
    }
    main.addEventListener('click', function(){ if (stage === 2) o.onNext(); else if (stage === 0) check(); });
    ta.addEventListener('keydown', function(e){ if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); main.click(); } });
    return card;
  }

  /* ---- multiple choice: meaning of an expression (e2z), or the expression for a meaning (z2e) ---- */
  function mcqQ(item, o){
    const v = item.v, res = newRes(item, 'mcq');
    const dir = item.dir === 'z2e' ? 'z2e' : 'e2z';
    const right = dir === 'e2z' ? v.zh : v.expr;
    const seen = {};
    seen[right] = true;
    const wrong = [];
    shuffle((o.pool ? o.pool() : []).slice()).forEach(function(p){
      const t = dir === 'e2z' ? p.zh : p.expr;
      if (t && !seen[t] && wrong.length < 3){ seen[t] = true; wrong.push(t); }
    });
    const texts = shuffle([right].concat(wrong));
    const ex = extraBox(item, res, o);
    const fb = h('div', {class:'fb', hidden:true, 'aria-live':'polite'});
    const main = h('button', {type:'button', class:'btn pri', hidden:true}, nextLabel(o));
    let answered = false;
    const btns = texts.map(function(t, i){
      return h('button', {type:'button', class:'mc-b', onclick:function(){ pick(i); }}, h('span', {class:'n'}, String(i + 1)), h('span', null, t));
    });
    const ask = dir === 'e2z'
      ? [h('p', {class:'q-ask'}, '这个表达在句子里是什么意思？'),
         h('p', {class:'q-big'}, v.expr, item.clips ? ' ' : null, clipBtn(item.clips, 'w' + v.id, v.core)),
         h('p', {class:'q-ctx'}, markTerms(v.ctx, v.m))]
      : [h('p', {class:'q-ask'}, '选出对应的' + XL + '表达'),
         h('p', {class:'q-zh'}, v.zh)];
    const card = h('div', {class:'card'},
      head(o, 'mcq'),
      ask,
      h('div', {class:'mc', role:'group', 'aria-label':'选项'}, btns),
      fb,
      h('div', {class:'row'}, main)
    );
    function pick(i){
      if (answered) return;
      answered = true;
      const ok = texts[i] === right;
      res.ok = ok; res.given = texts[i];
      o.onAnswer(res);
      btns.forEach(function(b, j){
        b.disabled = true;
        if (texts[j] === right) b.classList.add('ok');
        else if (j === i) b.classList.add('bad');
      });
      fb.className = 'fb ' + (ok ? 'ok' : 'bad');
      fb.hidden = false;
      const kids = [h('p', {class:'fb-t'}, ok ? '正确' : ['不对，答案是 ', h('b', null, right)]), speakLine(item, v)];
      if (v.note) kids.push(h('p', {class:'w-note'}, v.note));
      kids.push(h('p', {class:'w-ctx'}, markTerms(v.ctx, v.m)));
      kids.push(ex);
      fb.replaceChildren.apply(fb, kids);
      ex.refresh();
      main.textContent = nextLabel(o);
      main.hidden = false;
      main.focus();
    }
    main.addEventListener('click', function(){ o.onNext(); });
    function onKey(e){
      if (!card.isConnected){ document.removeEventListener('keydown', onKey); return; }
      if (card.offsetParent === null) return;
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const n = Number(e.key);
      if (!answered && n >= 1 && n <= btns.length){ e.preventDefault(); pick(n - 1); }
    }
    document.addEventListener('keydown', onKey);
    return card;
  }

  /* ---- grammar choice: a sentence with a gap and the forms to choose from (v.pick[item.k]) ---- */
  function pickQ(item, o){
    const v = item.v, P = v.pick[item.k], res = newRes(item, 'pick');
    const order = shuffle(P.opts.map(function(t, i){ return i; }));
    const ex = extraBox(item, res, o);
    const fb = h('div', {class:'fb', hidden:true, 'aria-live':'polite'});
    const main = h('button', {type:'button', class:'btn pri', hidden:true}, nextLabel(o));
    let answered = false;
    const btns = order.map(function(j, n){
      return h('button', {type:'button', class:'mc-b', onclick:function(){ pick(n); }}, h('span', {class:'n'}, String(n + 1)), h('span', null, P.opts[j]));
    });
    const card = h('div', {class:'card'},
      head(o, 'pick'),
      h('p', {class:'q-ask'}, '选出合适的说法'),
      h('p', {class:'q-sent'}, P.q),
      P.rom ? h('p', {class:'rom'}, P.rom) : null,
      h('div', {class:'mc', role:'group', 'aria-label':'选项'}, btns),
      fb,

    );
    function pick(n){
      if (answered) return;
      answered = true;
      const ok = order[n] === P.a;
      res.ok = ok; res.given = P.opts[order[n]];
      o.onAnswer(res);
      btns.forEach(function(b, m){
        b.disabled = true;
        if (order[m] === P.a) b.classList.add('ok');
        else if (m === n) b.classList.add('bad');
      });
      fb.className = 'fb ' + (ok ? 'ok' : 'bad');
      fb.hidden = false;
      fb.replaceChildren(h('p', {class:'fb-t'}, ok ? '正确' : ['不对，答案是 ', h('b', null, P.opts[P.a])]),
        h('p', null, P.why), h('p', {class:'meta'}, v.expr + '：' + v.zh), ex);
      ex.refresh();
      main.hidden = false;
      main.focus();
    }
    main.addEventListener('click', function(){ o.onNext(); });
    function onKey(e){
      if (!card.isConnected){ document.removeEventListener('keydown', onKey); return; }
      if (card.offsetParent === null || e.ctrlKey || e.metaKey || e.altKey) return;
      const n = Number(e.key);
      if (!answered && n >= 1 && n <= btns.length){ e.preventDefault(); pick(n - 1); }
    }
    document.addEventListener('keydown', onKey);

  /* ---- dictation: listen, then type a word, an example sentence, or (item.sent) a sentence of the article ----
     item.sent = {en, zh, src, t}: the sentence and where its audio is.   o.defer: no feedback after the answer, the
     host shows everything at the end (listening exam); the answer is passed on through onAnswer + onNext. */
  function dictQ(item, o){
    const v = item.v, S = item.sent, res = newRes(item, 'dict');
    const isWord = !S && (item.k == null || item.k < 0);
    const x = !S && !isWord ? v.ex[item.k] : null;
    const ref = S ? S.en : isWord ? v.core : exPlain(x.en);
    const zhText = S ? S.zh : isWord ? v.zh : x.zh;
    const key = S ? null : isWord ? 'w' + v.id : 'e' + v.id + '_' + item.k;
    const src = S ? S.src : item.clips ? item.clips.src : null;
    const clipT = S ? S.t : item.clips && key ? item.clips.t[key] : null;
    res.ref = ref; res.zh = zhText; res.src = src; res.t = clipT; res.kind = S ? 's' : isWord ? 'w' : 'e';
    const defer = !!o.defer;
    const playB = h('button', {type:'button', class:'btn pri play'}, '播放');
    const slowB = h('button', {type:'button', class:'btn play'}, '慢速播放');
    playB.insertAdjacentHTML('afterbegin', SPK_SVG);
    playB.addEventListener('click', function(){ Clip.play(src, clipT, playB, ref, 1); });
    slowB.addEventListener('click', function(){ Clip.play(src, clipT, slowB, ref, 0.7); });
    const field = isWord
      ? h('input', inputAttrs({class:'q-input q-wide', 'aria-label':'写出听到的表达'}))
      : h('textarea', inputAttrs({class:'q-area', rows:3, maxlength:500, placeholder:'把听到的整句写下来', 'aria-label':'写出听到的整句'}));
    const hintP = h('p', {class:'q-hint'}, isWord ? '一个' + XL + '表达，写法要和听到的一致。' + (LANG === 'yue' ? '写汉字或粤拼都行。' : '') : (LANG === 'yue' ? '写汉字或粤拼都行（粤拼音节之间空一格，声调数字可省）。标点不影响判分。' : LANG !== 'en' ? '标点和空格不影响判分。' : '大小写和标点不影响判分，数字写 30 或 thirty 都行。') + (defer ? '' : '电脑上按 Ctrl+Enter 提交。'));
    const fb = h('div', {class:'fb', hidden:true, 'aria-live':'polite'});
    const lastQ = function(){ return o.isLast ? o.isLast() : !!o.last; };
    const main = h('button', {type:'button', class:'btn pri'}, defer ? (lastQ() ? '交卷' : '提交，下一题') : '检查');
    const peek = defer ? null : h('button', {type:'button', class:'btn'}, '提示：中文意思');
    const ex = extraBox(item, res, o);
    let checked = false;
    const card = h('div', {class:'card'},
      head(o, 'dict'),
      h('p', {class:'q-ask'}, isWord ? '听发音，写出这个表达。' : '听一句话，把整句写下来。'),
      h('div', {class:'dict-btns'}, playB, slowB),
      isWord ? h('p', {class:'q-line'}, field) : field,
      hintP,
      fb,
      h('div', {class:'row'}, main, peek)
    );
    if (peek) peek.addEventListener('click', function(){ hintP.textContent = '意思：' + zhText; peek.hidden = true; field.focus(); });
    function check(){
      const val = field.value.trim();
      if (!norm(val) && !/\d/.test(val)){ field.focus(); return; }
      let ok, diffKids = [];
      if (isWord){
        ok = v.forms.map(norm).indexOf(norm(val)) >= 0 || romOk(val, v.rom);
      } else {
        const refRom = S ? S.rom : x && x.rom;
        const useRom = LANG === 'yue' && /[a-z]/i.test(val) && !!refRom;   /* answered in Jyutping: compare with the reading */
        const a = toks(useRom ? refRom : ref), b = toks(val), d = lcsHits(a, b);
        ok = a.length === b.length && d.ha.every(Boolean);
        if (!ok) diffKids = [
          h('p', {class:'df'}, h('span', {class:'df-l'}, '标准答案（有出入的词划了线）'), useRom ? chunkDiff(refRom, d.ha) : LANG === 'yue' ? ref : chunkDiff(ref, d.ha)),
          h('p', {class:'df'}, h('span', {class:'df-l'}, '你写的'), chunkDiff(val, d.hb))
        ];
      }
      checked = true;
      res.ok = ok; res.given = val;
      o.onAnswer(res);
      if (defer){ o.onNext(); return; }
      field.readOnly = true;
      if (isWord) field.classList.add(ok ? 'ok' : 'bad');
      fb.className = 'fb ' + (ok ? 'ok' : 'bad');
      fb.hidden = false;
      const headP = h('p', {class:'fb-t'}, ok ? '正确' : (isWord ? ['不对，听到的是 ', h('b', null, v.expr)] : '有出入，对照一下'));
      const kids = [headP];
      if (!ok){
        kids.push.apply(kids, diffKids);
        const alt = h('button', {type:'button', class:'btn sm'}, '只是小失误，算我对');
        alt.addEventListener('click', function(){
          res.ok = true;
          fb.className = 'fb ok';
          if (isWord){ field.classList.remove('bad'); field.classList.add('ok'); }
          headP.replaceChildren('已按你的判断算对。');
          alt.remove();
          ex.refresh();
          if (o.onChange) o.onChange(res);
          main.textContent = nextLabel(o);
          main.focus();
        });
        kids.push(h('div', {class:'fb-s'}, alt));
      }
      if (isWord) kids.push(speakLine(item, v));
      else if (S){
        const sb = spkEl('播放这一句', function(){ Clip.play(src, clipT, sb, ref, 1); });
        kids.push(h('p', null, sb, ' ', ref), h('p', {class:'meta'}, zhText));
      } else kids.push(h('p', null, clipBtn(item.clips, key, ref), item.clips ? ' ' : null, exNodes(x.en)), h('p', {class:'meta'}, x.zh));
      kids.push(ex);
      fb.replaceChildren.apply(fb, kids);
      ex.refresh();
      if (peek) peek.hidden = true;
      main.textContent = nextLabel(o);
      main.focus();
    }
    main.addEventListener('click', function(){ if (checked) o.onNext(); else check(); });
    field.addEventListener('keydown', function(e){
      if (e.key === 'Enter' && (isWord || e.ctrlKey || e.metaKey)){ e.preventDefault(); main.click(); }
    });
    /* play once as soon as the question appears (this runs inside the click that opened it, so browsers allow it) */
    if (o.autoplay !== false) Clip.play(src, clipT, playB, ref, 1);
    return card;
  }

  function make(item, o){
    switch (item.type){
      case 'cloze': return clozeQ(item, o, item.v.cloze, 'cloze');
      case 'exs': return clozeQ(item, o, exCloze(item.v, item.k), 'exs');
      case 'zh': return zhQ(item, o);
      case 'sent': return sentQ(item, o);
      case 'mcq': return mcqQ(item, o);
      case 'dict': return dictQ(item, o);
      case 'pick': return pickQ(item, o);
    }
    throw new Error('unknown question type ' + item.type);
  }
  /* ---- looking back at answered questions ---- */
  function freeze(card){
    const c = card.cloneNode(true);           /* inputs and textareas keep what was typed */
    c.classList.add('q-past');
    $$(':scope > .row', c).forEach(function(r){ r.hidden = true; });
    $$('[id]', c).forEach(function(el){ el.removeAttribute('id'); });
    $$('button', c).forEach(function(b){ b.disabled = true; });
    $$('input, textarea', c).forEach(function(f){ f.readOnly = true; });
    return c;
  }
  function pager(box, hist, live, o){
    let pos = live ? hist.length : 0;
    const prev = h('button', {type:'button', class:'btn sm'}, '‹ 上一题');
    const nxt = h('button', {type:'button', class:'btn sm'}, '下一题 ›');
    const lab = h('span', {class:'meta'});
    const back = live ? h('button', {type:'button', class:'btn sm pri'}, '回到当前题')
      : h('button', {type:'button', class:'btn sm pri', onclick:function(){ if (o && o.close) o.close(); }}, '返回成绩');
    const bar = h('div', {class:'q-nav'}, prev, nxt, lab, back);
    const liveBox = h('div', null, live);
    const past = h('div');
    function show(){
      const atLive = !!live && pos === hist.length;
      liveBox.hidden = !atLive;
      past.replaceChildren();
      if (!atLive) past.append(hist[pos]);
      prev.disabled = pos === 0;
      nxt.hidden = atLive;
      nxt.disabled = !live && pos >= hist.length - 1;
      back.hidden = atLive;
      lab.textContent = atLive ? '' : '第 ' + (pos + 1) + ' 题（已作答，只能查看）';
      bar.hidden = atLive && !hist.length;
      if (atLive) focus(live);
    }
    prev.addEventListener('click', function(){ if (pos > 0){ pos--; show(); } });
    nxt.addEventListener('click', function(){ pos++; show(); });
    if (live) back.addEventListener('click', function(){ pos = hist.length; show(); });
    box.replaceChildren(bar, liveBox, past);
    show();
  }
  function focus(card){
    const f = $('#q-input', card);
    if (f) f.focus({preventScroll:true});
  }
  /* which question to ask a word that is on step b of the ladder: recognise -> fill in -> spell -> hear -> write */
  function typeForStage(b, hasClips){
    if (b <= 0) return {type:'mcq', dir:'e2z'};
    if (b === 1) return {type:'mcq', dir:'z2e'};
    if (b === 2) return {type:'exs'};
    if (b === 3) return {type:'cloze'};
    if (b <= 5) return {type:'zh'};
    if (b <= 7) return hasClips ? {type:'dict'} : {type:'zh'};
    return {type:'sent'};
  }
  return {TYPE_NAME:TYPE_NAME, make:make, focus:focus, freeze:freeze, pager:pager, markTerms:markTerms, exCloze:exCloze, toks:toks, lcsHits:lcsHits, chunkDiff:chunkDiff, typeForStage:typeForStage};
})();
