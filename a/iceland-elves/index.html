const DATA = {"sents":[{"kind":"title","en":"Mind the elves: why Iceland's roads sometimes take the long way round","zh":"当心精灵：冰岛的路为什么有时要绕远","notes":["Mind ...：当心……，英式说法，伦敦地铁的 Mind the gap（小心站台间隙）就是这个用法。","take the long way round：绕远路。round 是英式，美式常说 around。","冒号后面是正文要回答的问题，标题常这样先抛出悬念。"],"i":0,"p":0,"n":0,"label":"标题"},{"kind":"sub","en":"In a country of volcanoes and hot springs, some building projects are slowed by creatures nobody has ever seen.","zh":"在这个遍布火山和温泉的国家，有些建筑工程被一种谁也没见过的生物拖慢了进度。","notes":["a country of volcanoes and hot springs：of 后面说明这个国家的特点。","are slowed by：被……拖慢，被动语态。","creatures nobody has ever seen：nobody has ever seen 修饰 creatures，省略了 that。"],"i":1,"p":0,"n":0,"label":"副标题"},{"kind":"sub","en":"The reasons say less about magic than about how Icelanders treat their land.","zh":"这背后的原因，与其说和魔法有关，不如说反映了冰岛人怎样对待自己的土地。","notes":["say less about A than about B：与其说说明 A，不如说说明 B。","how Icelanders treat their land 是名词性从句，作 about 的宾语。"],"i":2,"p":0,"n":0,"label":"副标题"},{"kind":"body","en":"Picture a road crew on the edge of Reykjavik, ready to blast through a field of mossy lava.","zh":"想象一支修路队站在雷克雅未克的边上，准备炸开一片长满青苔的熔岩地。","notes":["Picture ...：想象一下……，picture 作动词，用祈使句开头把读者带进场景。","crew：一起干活的一队人，road crew 是修路队。","on the edge of：在……的边上。blast through：用炸药炸开（一条路）。"],"p":1,"i":3,"n":1,"label":"第 1 句"},{"kind":"body","en":"Before the first charge is set, a group of protesters turns up and asks them to stop.","zh":"第一包炸药还没装好，一群抗议者就来了，要求他们停工。","notes":["charge 在这里是“一次装填的炸药”，set a charge = 装好炸药。","Before ... is set：时间状语从句用一般现在时，整段用现在时讲故事，更有画面感。","turn up：（突然）出现、到场。"],"p":1,"i":4,"n":2,"label":"第 2 句"},{"kind":"body","en":"Their worry is not the view or the birds, but a large rock that, according to local lore, is home to hidden people.","zh":"他们担心的不是风景，也不是鸟，而是一块大石头：按当地的传说，那里住着“隐身人”。","notes":["not A but B：不是 A，而是 B。","that ... is home to hidden people 是定语从句，中间插入了 according to local lore。","lore：民间流传的说法、传说。be home to：是……的家、栖息着……。"],"p":1,"i":5,"n":3,"label":"第 3 句"},{"kind":"body","en":"Stories of the huldufólk, or hidden folk, have been passed down in Iceland for centuries.","zh":"关于“huldufólk”，也就是“隐身人”的故事，在冰岛已经流传了几百年。","notes":["huldufólk 是冰岛语，字面意思是“隐藏的人”，后面的 or hidden folk 是英文解释。","folk：人们（较老的说法）。","pass down：（一代一代）往下传，这里用现在完成时被动语态。"],"p":2,"i":6,"n":4,"label":"第 4 句"},{"kind":"body","en":"They are said to look much like humans, to live inside rocks and hills, and to take offence when their homes are disturbed.","zh":"据说他们长得和人很像，住在岩石和山丘里，家被打扰时会生气。","notes":["be said to do：据说……。后面三个不定式并列：to look, to live, to take。","take offence：生气、被冒犯，英式拼写 offence，美式是 offense。","disturb：打扰、搅动。"],"p":2,"i":7,"n":5,"label":"第 5 句"},{"kind":"body","en":"Few Icelanders will swear that elves exist, yet surprisingly few will rule it out.","zh":"很少有冰岛人敢打包票说精灵存在，可出人意料的是，也很少有人会断然排除这种可能。","notes":["Few ... yet surprisingly few ...：前后两个 few 对照，句子很巧。few = 很少（几乎没有）。","swear：发誓、打包票。","rule it out：排除这种可能，it 指 elves exist 这件事。"],"p":2,"i":8,"n":6,"label":"第 6 句"},{"kind":"body","en":"Asked in surveys, many prefer a cautious shrug: better safe than sorry.","zh":"在调查中被问到时，很多人选择谨慎地耸耸肩：宁可信其有。","notes":["Asked in surveys 是过去分词短语，相当于 When they are asked in surveys。","a cautious shrug：谨慎的一耸肩，表示“说不好”。","better safe than sorry：俗语，“小心总比后悔好”，这里译作“宁可信其有”。"],"p":2,"i":9,"n":7,"label":"第 7 句"},{"kind":"body","en":"Over the years, that caution has shaped real decisions.","zh":"这些年来，这份谨慎实实在在地影响了一些决定。","notes":["over the years：这些年来，常配现在完成时。","caution：小心、谨慎，cautious 的名词。","shape：塑造、影响。"],"p":3,"i":10,"n":8,"label":"第 8 句"},{"kind":"body","en":"Roads have been rerouted to spare elf rocks, and builders have occasionally hired mediators who claim to negotiate with the hidden residents.","zh":"有些路为了避开“精灵石”而改了路线；建筑商偶尔还会请来自称能和隐身居民谈判的“调解人”。","notes":["reroute：改道、改变路线。re- 表示“重新”。","spare：使免受（伤害）、放过。to spare elf rocks = 为了不动精灵石。","occasionally：偶尔。mediator：调解人。claim to do：声称能……。"],"p":3,"i":11,"n":9,"label":"第 9 句"},{"kind":"body","en":"When machines break down or workers fall ill on a site, someone usually jokes that the elves are behind it, and only half of them are joking.","zh":"工地上机器出故障、工人生病时，总有人开玩笑说是精灵在捣鬼，而说这话的人里，只有一半是在开玩笑。","notes":["break down：（机器）出故障；fall ill：生病（英式常用）。","be behind sth：是……的幕后原因、在背后搞鬼。","only half of them are joking：只有一半是开玩笑，言下之意是另一半是认真的。"],"p":3,"i":12,"n":10,"label":"第 10 句"},{"kind":"body","en":"In one well-known case, a boulder was lifted out of a road's path and set down a safe distance away, by agreement with all sides.","zh":"在一个很有名的例子里，经过各方同意，一块巨石被从道路要经过的地方吊起，挪到一个安全的距离外放下。","notes":["well-known：有名的。","boulder：巨石、大圆石。","lifted out of ... and set down ...：两个过去分词并列，被动语态。","by agreement：经过（各方）同意。all sides：各方。"],"p":3,"i":13,"n":11,"label":"第 11 句"},{"kind":"body","en":"Sceptics roll their eyes at such stories.","zh":"怀疑论者对这类故事只会翻白眼。","notes":["sceptic：怀疑论者，英式拼写；美式是 skeptic。","roll one's eyes at：对……翻白眼，表示不屑或不耐烦。"],"p":4,"i":14,"n":12,"label":"第 12 句"},{"kind":"body","en":"But the elves often serve as a stand-in for something easier to defend: a deep respect for the landscape.","zh":"可精灵常常是一种替身，代表着更容易站得住脚的东西：对这片土地风貌的深深敬重。","notes":["serve as：充当、起……作用。","stand-in：替身、代替的人或物。","something easier to defend：更容易辩护的东西，冒号后解释是什么。landscape：风景、地貌。"],"p":4,"i":15,"n":13,"label":"第 13 句"},{"kind":"body","en":"Iceland's lava fields took thousands of years to form, and once bulldozed they cannot be put back.","zh":"冰岛的熔岩地花了几千年才形成，一旦被推土机推平，就再也恢复不了。","notes":["took thousands of years to form：it takes + 时间 + to do 的变体，主语换成了 lava fields。","once bulldozed：一旦被推平，相当于 once they are bulldozed。","put back：放回原处、恢复原样。"],"p":4,"i":16,"n":14,"label":"第 14 句"},{"kind":"body","en":"Protesters who invoke the hidden folk are often the same people who campaign for nature reserves.","zh":"搬出“隐身人”来抗议的人，往往也就是那些为建立自然保护区奔走的人。","notes":["invoke：援引、搬出（某种说法或权威来支持自己）。","campaign for：为……开展运动、奔走呼吁。","nature reserve：自然保护区。两个 who 从句分别修饰 Protesters 和 people。"],"p":4,"i":17,"n":15,"label":"第 15 句"},{"kind":"body","en":"Tourism has given the legends a second life.","zh":"旅游业让这些传说焕发了第二次生命。","notes":["give sth a second life：让……重获新生、换一种方式继续存在。","legend：传说。"],"p":5,"i":18,"n":16,"label":"第 16 句"},{"kind":"body","en":"Visitors can take guided walks through “elf gardens”, buy maps of known dwellings and even stay in hotels that keep a small house outside for their invisible neighbours.","zh":"游客可以跟着导游逛“精灵花园”，买标出“已知住处”的地图，甚至住进那些在门外专门给隐形邻居留了一座小房子的酒店。","notes":["guided walk：有导游带的步行游览。","dwelling：住处、住所，比较正式。","that keep a small house outside ... 是定语从句，修饰 hotels。"],"p":5,"i":19,"n":17,"label":"第 17 句"},{"kind":"body","en":"Locals are happy to play along, partly because it brings in money and also because they enjoy the joke.","zh":"当地人很乐意配合，一部分是因为能赚钱，也因为他们自己也觉得好玩。","notes":["play along：（明知是游戏或玩笑也）配合、顺着演。","partly because ... and also because ...：部分是因为……，也是因为……。","bring in money：带来收入。"],"p":5,"i":20,"n":18,"label":"第 18 句"},{"kind":"body","en":"Whether or not anyone believes in them, the hidden folk do a useful job.","zh":"不管有没有人相信他们，这些隐身人都做了一件有用的事。","notes":["whether or not：不管是否……，引导让步状语从句。","believe in：相信……的存在；信任。和 believe（相信某话是真的）不同。"],"p":6,"i":21,"n":19,"label":"第 19 句"},{"kind":"body","en":"They remind a fast-growing country to pause before it digs, and to ask what might be lost.","zh":"他们提醒这个快速发展的国家：动工之前先停一停，问问可能会失去什么。","notes":["remind sb to do：提醒某人做某事。后面两个不定式并列：to pause, to ask。","fast-growing：快速发展的，复合形容词。","what might be lost：可能失去的东西，宾语从句。"],"p":6,"i":22,"n":20,"label":"第 20 句"},{"kind":"body","en":"Plenty of places could do with a few elves of their own.","zh":"很多地方也真该有几个自己的精灵。","notes":["plenty of：很多（前面学过）。","could do with：（口语）很需要、要是有……就好了。","of their own：属于自己的。"],"p":6,"i":23,"n":21,"label":"第 21 句"}],"vocab":[{"id":1,"expr":"mind (verb)","zh":"当心、注意","m":["Mind"],"note":"英式常用祈使句：Mind the step!（小心台阶！）、Mind your head.（小心碰头）。另一个常见意思是“介意”：Do you mind ...?","core":"mind","forms":["mind","minds","minded","minding"],"syn":[],"ex":[{"en":"[[Mind]] the step on your way out.","zh":"出去的时候当心台阶。"},{"en":"[[Mind]] your head, the ceiling is low.","zh":"小心碰头，天花板很低。"}],"ctx":"Mind the elves: why Iceland's roads sometimes take the long way round"},{"id":2,"expr":"take the long way round","zh":"绕远路","m":["the long way round"],"note":"也说 go the long way round / around。比喻“用麻烦的办法做事”也可以：He always does things the long way round.","core":"the long way round","forms":["the long way round","the long way around","long way round","long way around"],"syn":[],"ex":[{"en":"The bridge was closed, so we took [[the long way round]].","zh":"桥封了，我们只好绕远路。"},{"en":"She walks [[the long way round]] to avoid the busy road.","zh":"她宁可绕远走，避开那条车多的路。"}],"ctx":"Mind the elves: why Iceland's roads sometimes take the long way round"},{"id":3,"expr":"crew","zh":"一队工作人员","m":["road crew"],"note":"crew 指一起工作的一群人：a film crew（摄制组）、a cabin crew（机组乘务员）。作集体名词，英式可以接复数动词。","core":"crew","forms":["crew","crews","road crew"],"syn":[],"ex":[{"en":"A [[crew]] of six worked through the night to fix the pipe.","zh":"六个人的队伍连夜抢修水管。"},{"en":"The film [[crew]] arrived early to set up the lights.","zh":"摄制组一早就来布置灯光。"}],"ctx":"Picture a road crew on the edge of Reykjavik, ready to blast through a field of mossy lava."},{"id":4,"expr":"on the edge of","zh":"在……的边上","m":["on the edge of"],"note":"可以说地点：on the edge of town（在城边上）；也可以比喻快要发生某事：on the edge of tears（快要哭出来）。","core":"on the edge of","forms":["on the edge of","the edge of"],"syn":[],"ex":[{"en":"They live [[on the edge of]] a forest.","zh":"他们住在一片森林的边上。"},{"en":"The company is [[on the edge of]] collapse.","zh":"这家公司已经濒临倒闭。"}],"ctx":"Picture a road crew on the edge of Reykjavik, ready to blast through a field of mossy lava."},{"id":5,"expr":"blast through","zh":"（用炸药）炸开；冲破","m":["blast through"],"note":"blast 是爆炸、用炸药炸。blast through 也可以比喻“势不可挡地冲过”：The team blasted through the first round.","core":"blast through","forms":["blast through","blasts through","blasted through","blasting through"],"syn":[],"ex":[{"en":"Engineers had to [[blast through]] the mountain to build the tunnel.","zh":"工程师得炸开山体才能修隧道。"},{"en":"The river [[blasted through]] the old wall after the storm.","zh":"暴风雨过后，河水冲垮了那堵老墙。"}],"ctx":"Picture a road crew on the edge of Reykjavik, ready to blast through a field of mossy lava."},{"id":6,"expr":"turn up","zh":"（突然）出现、到场","m":["turns up"],"note":"turn up 常带“没预料到”的意味：He turned up late.（他很晚才来）。也有“调大（音量）”的意思：turn up the music。","core":"turn up","forms":["turn up","turns up","turned up","turning up"],"syn":[],"ex":[{"en":"Only five people [[turned up]] for the meeting.","zh":"只有五个人来开会。"},{"en":"My lost keys [[turned up]] in the washing machine.","zh":"我丢的钥匙在洗衣机里找到了。"}],"ctx":"Before the first charge is set, a group of protesters turns up and asks them to stop."},{"id":7,"expr":"lore","zh":"（民间）传说、口耳相传的知识","m":["lore"],"note":"不可数名词，常和别的词连用：local lore（当地传说）、folklore（民间传说）、sea lore（航海的老经验）。","core":"lore","forms":["lore","folklore"],"syn":[],"ex":[{"en":"According to local [[lore]], the lake has no bottom.","zh":"按当地的说法，那个湖深不见底。"},{"en":"Grandma knows a lot of old kitchen [[lore]].","zh":"奶奶懂很多厨房里的老窍门。"}],"ctx":"Their worry is not the view or the birds, but a large rock that, according to local lore, is home to hidden people."},{"id":8,"expr":"pass down","zh":"传下来、传给后代","m":["passed down"],"note":"常用被动：be passed down from generation to generation（一代代传下来）。也说 hand down。","core":"pass down","forms":["pass down","passes down","passed down","passing down"],"syn":[],"ex":[{"en":"This recipe has been [[passed down]] in our family for years.","zh":"这个菜谱在我们家传了很多年。"},{"en":"He [[passed down]] his love of music to his children.","zh":"他把对音乐的热爱传给了孩子们。"}],"ctx":"Stories of the huldufólk, or hidden folk, have been passed down in Iceland for centuries."},{"id":9,"expr":"take offence","zh":"生气、觉得被冒犯","m":["take offence"],"note":"take offence at sth：因……而不高兴。英式 offence，美式 offense。No offence, but ...（无意冒犯，不过……）很常用。","core":"take offence","forms":["take offence","takes offence","took offence","taken offence","taking offence","take offense","took offense"],"syn":[],"ex":[{"en":"She [[took offence]] at his joke about her cooking.","zh":"他拿她的厨艺开玩笑，她不高兴了。"},{"en":"Please don't [[take offence]]; I was only teasing.","zh":"别生气，我只是开玩笑。"}],"ctx":"They are said to look much like humans, to live inside rocks and hills, and to take offence when their homes are disturbed."},{"id":10,"expr":"disturb","zh":"打扰；弄乱","m":["disturbed"],"note":"Do not disturb.（请勿打扰）。也可以指弄乱东西：Don't disturb the papers on my desk.","core":"disturb","forms":["disturb","disturbs","disturbed","disturbing"],"syn":[],"ex":[{"en":"Sorry to [[disturb]] you, but your car is blocking mine.","zh":"抱歉打扰，你的车挡住我的车了。"},{"en":"The birds were [[disturbed]] by the noise.","zh":"鸟儿被噪音惊扰了。"}],"ctx":"They are said to look much like humans, to live inside rocks and hills, and to take offence when their homes are disturbed."},{"id":11,"expr":"swear","zh":"发誓、断言","m":["swear"],"note":"swear (that) ...：发誓说……。另一个意思是“说脏话”：Don't swear in front of the kids. 过去式 swore，过去分词 sworn。","core":"swear","forms":["swear","swears","swore","sworn","swearing"],"syn":[],"ex":[{"en":"I [[swear]] I locked the door.","zh":"我发誓我锁门了。"},{"en":"He [[swore]] he had never seen her before.","zh":"他发誓以前从没见过她。"}],"ctx":"Few Icelanders will swear that elves exist, yet surprisingly few will rule it out."},{"id":12,"expr":"rule out","zh":"排除（可能性）","m":["rule it out"],"note":"rule out sth / rule sth out：认为某事不可能、把它排除。Police have not ruled out murder.（警方没有排除谋杀的可能。）","core":"rule out","forms":["rule out","rules out","ruled out","ruling out","rule it out","ruled it out"],"syn":[],"ex":[{"en":"Doctors have [[ruled out]] a broken bone.","zh":"医生已经排除了骨折的可能。"},{"en":"We can't [[rule out]] more rain this weekend.","zh":"这个周末再下雨的可能不能排除。"}],"ctx":"Few Icelanders will swear that elves exist, yet surprisingly few will rule it out."},{"id":13,"expr":"shrug","zh":"耸肩（表示不知道或无所谓）","m":["shrug"],"note":"可作动词也可作名词：He shrugged. / He gave a shrug. shrug sth off = 对……不在乎、不当回事。","core":"shrug","forms":["shrug","shrugs","shrugged","shrugging"],"syn":[],"ex":[{"en":"When I asked where she was, he just [[shrugged]].","zh":"我问她去哪儿了，他只是耸了耸肩。"},{"en":"She answered with a [[shrug]] and a smile.","zh":"她耸耸肩，笑了笑，算是回答。"}],"ctx":"Asked in surveys, many prefer a cautious shrug: better safe than sorry."},{"id":14,"expr":"better safe than sorry","zh":"小心总比后悔好、宁可谨慎","m":["better safe than sorry"],"note":"常用的俗语，可以单独成句：Take an umbrella—better safe than sorry.","core":"better safe than sorry","forms":["better safe than sorry"],"syn":[],"ex":[{"en":"Take a jacket. [[Better safe than sorry]].","zh":"带件外套吧，小心总比后悔好。"},{"en":"I checked the oven twice; [[better safe than sorry]].","zh":"我检查了两遍烤箱，小心点没错。"}],"ctx":"Asked in surveys, many prefer a cautious shrug: better safe than sorry."},{"id":15,"expr":"cautious","zh":"谨慎的、小心的","m":["cautious"],"note":"be cautious about sth：对……很谨慎。名词 caution（小心），副词 cautiously。","core":"cautious","forms":["cautious","cautiously"],"syn":[],"ex":[{"en":"Be [[cautious]] when you drive in the snow.","zh":"雪天开车要小心。"},{"en":"She is [[cautious]] about lending money to friends.","zh":"她借钱给朋友很谨慎。"}],"ctx":"Asked in surveys, many prefer a cautious shrug: better safe than sorry."},{"id":16,"expr":"shape (verb)","zh":"塑造、影响","m":["shaped"],"note":"shape 作动词，指对事情的发展有决定性影响：Her childhood shaped her views.（童年经历塑造了她的观点。）","core":"shape","forms":["shape","shapes","shaped","shaping"],"syn":[],"ex":[{"en":"Books I read as a child [[shaped]] the way I think.","zh":"小时候读的书影响了我思考的方式。"},{"en":"Weather [[shapes]] the way people dress.","zh":"天气影响人们的穿着。"}],"ctx":"Over the years, that caution has shaped real decisions."},{"id":17,"expr":"reroute","zh":"改道、改变路线","m":["rerouted"],"note":"re-（重新）+ route（路线）。航班、交通、电话都可以 reroute。","core":"reroute","forms":["reroute","reroutes","rerouted","rerouting"],"syn":[],"ex":[{"en":"Traffic was [[rerouted]] because of the marathon.","zh":"因为马拉松，交通改道了。"},{"en":"Our flight was [[rerouted]] to another airport.","zh":"我们的航班改飞了另一个机场。"}],"ctx":"Roads have been rerouted to spare elf rocks, and builders have occasionally hired mediators who claim to negotiate with the hidden residents."},{"id":18,"expr":"spare (verb)","zh":"使免受（伤害）；饶过；抽出（时间）","m":["to spare"],"note":"spare sb/sth：让……免受损失。另一个常用意思是“抽出”：Can you spare five minutes?","core":"spare","forms":["spare","spares","spared","sparing"],"syn":[],"ex":[{"en":"The fire [[spared]] the old church.","zh":"大火没有烧到那座老教堂。"},{"en":"Can you [[spare]] a few minutes to help me?","zh":"你能抽几分钟帮我一下吗？"}],"ctx":"Roads have been rerouted to spare elf rocks, and builders have occasionally hired mediators who claim to negotiate with the hidden residents."},{"id":19,"expr":"occasionally","zh":"偶尔、有时","m":["occasionally"],"note":"比 sometimes 更少一些。形容词 occasional：an occasional visitor（偶尔来的客人）。","core":"occasionally","forms":["occasionally"],"syn":[],"ex":[{"en":"We [[occasionally]] eat out on Fridays.","zh":"我们偶尔周五出去吃饭。"},{"en":"He [[occasionally]] forgets his keys.","zh":"他偶尔会忘带钥匙。"}],"ctx":"Roads have been rerouted to spare elf rocks, and builders have occasionally hired mediators who claim to negotiate with the hidden residents."},{"id":20,"expr":"mediator","zh":"调解人","m":["mediators"],"note":"动词 mediate（调解），名词 mediation（调解）。常指在争执双方之间帮忙谈判的人。","core":"mediator","forms":["mediator","mediators"],"syn":[],"ex":[{"en":"A [[mediator]] helped the two sides reach a deal.","zh":"一位调解人帮双方达成了协议。"},{"en":"Teachers often act as [[mediators]] in playground fights.","zh":"操场上吵架时，老师常充当调解人。"}],"ctx":"Roads have been rerouted to spare elf rocks, and builders have occasionally hired mediators who claim to negotiate with the hidden residents."},{"id":21,"expr":"break down","zh":"（机器）出故障；（人）崩溃","m":["break down"],"note":"The car broke down on the motorway.（车在高速上抛锚了。）说人时是情绪崩溃：She broke down in tears. 名词 breakdown。","core":"break down","forms":["break down","breaks down","broke down","broken down","breaking down"],"syn":[],"ex":[{"en":"Our car [[broke down]] in the middle of nowhere.","zh":"我们的车在荒郊野外抛锚了。"},{"en":"The printer [[breaks down]] every Monday.","zh":"打印机每周一都坏。"}],"ctx":"When machines break down or workers fall ill on a site, someone usually jokes that the elves are behind it, and only half of them are joking."},{"id":22,"expr":"fall ill","zh":"生病","m":["fall ill"],"note":"fall + 形容词表示进入某种状态：fall ill, fall asleep, fall silent。fall ill 比 get sick 正式一点，英式常用。","core":"fall ill","forms":["fall ill","falls ill","fell ill","fallen ill","falling ill"],"syn":[],"ex":[{"en":"He [[fell ill]] the day before the exam.","zh":"他考试前一天病倒了。"},{"en":"Many children [[fall ill]] in winter.","zh":"很多孩子冬天会生病。"}],"ctx":"When machines break down or workers fall ill on a site, someone usually jokes that the elves are behind it, and only half of them are joking."},{"id":23,"expr":"be behind sth","zh":"是……的幕后原因、在背后操纵","m":["are behind it"],"note":"Who is behind this? = 这是谁干的？/ 谁在背后指使？","core":"behind","forms":["behind","be behind","is behind","are behind","was behind"],"syn":[],"ex":[{"en":"Police think a local gang [[is behind]] the thefts.","zh":"警方认为这几起盗窃是当地一个团伙干的。"},{"en":"I wonder who [[was behind]] the prank.","zh":"我想知道这个恶作剧是谁干的。"}],"ctx":"When machines break down or workers fall ill on a site, someone usually jokes that the elves are behind it, and only half of them are joking."},{"id":24,"expr":"boulder","zh":"巨石、大圆石","m":["boulder"],"note":"比 rock、stone 更大，一般指自然形成、表面圆滑的大石头。bouldering 是不用绳索的抱石攀岩。","core":"boulder","forms":["boulder","boulders"],"syn":[],"ex":[{"en":"A huge [[boulder]] rolled onto the road.","zh":"一块巨石滚到了路上。"},{"en":"The children climbed onto a [[boulder]] by the river.","zh":"孩子们爬上了河边的一块大石头。"}],"ctx":"In one well-known case, a boulder was lifted out of a road's path and set down a safe distance away, by agreement with all sides."},{"id":25,"expr":"by agreement","zh":"经（双方或各方）同意","m":["by agreement"],"note":"by mutual agreement：经双方同意。动词 agree，名词 agreement（协议、同意）。","core":"by agreement","forms":["by agreement","by mutual agreement"],"syn":[],"ex":[{"en":"The meeting was moved to Friday [[by agreement]].","zh":"经大家同意，会议改到了周五。"},{"en":"They ended the contract [[by mutual agreement]].","zh":"双方协商一致，终止了合同。"}],"ctx":"In one well-known case, a boulder was lifted out of a road's path and set down a safe distance away, by agreement with all sides."},{"id":26,"expr":"sceptic","zh":"怀疑论者、不轻信的人","m":["Sceptics"],"note":"英式 sceptic，美式 skeptic。形容词 sceptical：I'm sceptical about it.（我对此表示怀疑。）","core":"sceptic","forms":["sceptic","sceptics","skeptic","skeptics"],"syn":[],"ex":[{"en":"Even the [[sceptics]] were impressed by the result.","zh":"连怀疑的人都对结果印象深刻。"},{"en":"I was a [[sceptic]] until I tried it myself.","zh":"我自己试过之前一直不信。"}],"ctx":"Sceptics roll their eyes at such stories."},{"id":27,"expr":"roll one's eyes","zh":"翻白眼（表示不屑、不耐烦）","m":["roll their eyes"],"note":"roll one's eyes at sb/sth。一个很生动的动作描写，常见于口语和小说。","core":"roll their eyes","forms":["roll their eyes","rolls her eyes","rolled her eyes","rolled his eyes","roll my eyes","rolled my eyes","roll his eyes","rolls his eyes"],"syn":[],"ex":[{"en":"She [[rolled her eyes]] when he told the same joke again.","zh":"他又讲那个笑话时，她翻了个白眼。"},{"en":"Teenagers often [[roll their eyes]] at their parents.","zh":"青少年常对父母翻白眼。"}],"ctx":"Sceptics roll their eyes at such stories."},{"id":28,"expr":"stand-in","zh":"替身、代替者","m":["stand-in"],"note":"名词，带连字符。电影里的替身演员也叫 stand-in。动词短语 stand in for sb = 代替某人。","core":"stand-in","forms":["stand-in","stand-ins","stand in for"],"syn":[],"ex":[{"en":"The teacher was ill, so a [[stand-in]] took the class.","zh":"老师病了，由代课老师来上课。"},{"en":"Who will [[stand in for]] you while you're away?","zh":"你不在的时候谁来替你？"}],"ctx":"But the elves often serve as a stand-in for something easier to defend: a deep respect for the landscape."},{"id":29,"expr":"landscape","zh":"风景、地貌","m":["landscape"],"note":"指一大片自然或人造的地形景色：a rural landscape（乡村风光）。也可以比喻：the political landscape（政治格局）。","core":"landscape","forms":["landscape","landscapes"],"syn":[],"ex":[{"en":"The [[landscape]] here is flat and green.","zh":"这里的地貌平坦，一片绿色。"},{"en":"She paints mountain [[landscapes]].","zh":"她画山水风景。"}],"ctx":"But the elves often serve as a stand-in for something easier to defend: a deep respect for the landscape."},{"id":30,"expr":"bulldoze","zh":"用推土机推平；强行推进","m":["bulldozed"],"note":"bulldozer 是推土机。比喻用法：bulldoze a plan through（强行通过一个计划）。","core":"bulldoze","forms":["bulldoze","bulldozes","bulldozed","bulldozing"],"syn":[],"ex":[{"en":"The old cinema was [[bulldozed]] to make way for flats.","zh":"老电影院被推平，给公寓楼腾地方。"},{"en":"They want to [[bulldoze]] the park and build a car park.","zh":"他们想推平公园，修个停车场。"}],"ctx":"Iceland's lava fields took thousands of years to form, and once bulldozed they cannot be put back."},{"id":31,"expr":"put back","zh":"放回原处；恢复","m":["put back"],"note":"Put it back when you've finished.（用完放回去。）也有“推迟”的意思：The meeting was put back a week.","core":"put back","forms":["put back","puts back","putting back"],"syn":[],"ex":[{"en":"Please [[put back]] the books when you're done.","zh":"看完请把书放回原处。"},{"en":"Once a forest is gone, it's hard to [[put back]].","zh":"森林一旦没了，就很难恢复。"}],"ctx":"Iceland's lava fields took thousands of years to form, and once bulldozed they cannot be put back."},{"id":32,"expr":"invoke","zh":"援引、搬出（某种说法来支持自己）","m":["invoke"],"note":"invoke a law / a name / a memory：援引法律、搬出某人的名字、唤起回忆。比较正式。","core":"invoke","forms":["invoke","invokes","invoked","invoking"],"syn":[],"ex":[{"en":"He [[invoked]] his right to remain silent.","zh":"他援引了自己保持沉默的权利。"},{"en":"Politicians often [[invoke]] history to win support.","zh":"政客常常搬出历史来争取支持。"}],"ctx":"Protesters who invoke the hidden folk are often the same people who campaign for nature reserves."},{"id":33,"expr":"campaign for","zh":"为……开展运动、奔走呼吁","m":["campaign for"],"note":"campaign 作动词：campaign for / against sth。作名词：an election campaign（竞选活动）。","core":"campaign for","forms":["campaign for","campaigns for","campaigned for","campaigning for","campaign against"],"syn":[],"ex":[{"en":"Parents [[campaigned for]] a safer crossing near the school.","zh":"家长们奔走呼吁在学校附近修一条更安全的人行横道。"},{"en":"She has spent years [[campaigning for]] clean water.","zh":"她多年来一直为干净的饮用水奔走。"}],"ctx":"Protesters who invoke the hidden folk are often the same people who campaign for nature reserves."},{"id":34,"expr":"nature reserve","zh":"自然保护区","m":["nature reserves"],"note":"reserve 是“保留地”。a wildlife reserve 野生动物保护区。","core":"nature reserve","forms":["nature reserve","nature reserves"],"syn":[],"ex":[{"en":"We saw seals at the [[nature reserve]].","zh":"我们在自然保护区看到了海豹。"},{"en":"The marsh became a [[nature reserve]] in 1990.","zh":"这片沼泽在 1990 年成了自然保护区。"}],"ctx":"Protesters who invoke the hidden folk are often the same people who campaign for nature reserves."},{"id":35,"expr":"a second life","zh":"第二次生命、重获新生","m":["a second life"],"note":"give sth a second life：让旧东西换个用途继续用，或让被遗忘的东西重新流行。","core":"a second life","forms":["a second life","second life"],"syn":[],"ex":[{"en":"The old factory got [[a second life]] as an art centre.","zh":"老工厂改成了艺术中心，重获新生。"},{"en":"Repair cafés give broken toasters [[a second life]].","zh":"修理咖啡馆让坏了的烤面包机重新派上用场。"}],"ctx":"Tourism has given the legends a second life."},{"id":36,"expr":"dwelling","zh":"住处、住所（正式）","m":["dwellings"],"note":"比 home、house 正式，常用于书面或法律、历史语境：ancient cave dwellings（古代穴居）。动词 dwell（居住；老想着）。","core":"dwelling","forms":["dwelling","dwellings"],"syn":[],"ex":[{"en":"The village has about 200 [[dwellings]].","zh":"这个村子大约有两百处住房。"},{"en":"Archaeologists found an ancient [[dwelling]] under the field.","zh":"考古学家在田地下发现了一处古代住所。"}],"ctx":"Visitors can take guided walks through “elf gardens”, buy maps of known dwellings and even stay in hotels that keep a small house outside for their invisible neighbours."},{"id":37,"expr":"play along","zh":"配合、顺着（玩笑或游戏）演下去","m":["play along"],"note":"play along with sb/sth。常指明知不是真的，也装作配合。","core":"play along","forms":["play along","plays along","played along","playing along"],"syn":[],"ex":[{"en":"The kids said they were pirates, so I [[played along]].","zh":"孩子们说自己是海盗，我就顺着演了。"},{"en":"He didn't believe her story but decided to [[play along]].","zh":"他不信她的话，但决定先配合着。"}],"ctx":"Locals are happy to play along, partly because it brings in money and also because they enjoy the joke."},{"id":38,"expr":"partly because","zh":"部分是因为","m":["partly because"],"note":"partly = in part，部分地。常成对出现：partly because ..., partly because ...。","core":"partly because","forms":["partly because","partly"],"syn":[],"ex":[{"en":"I stayed home, [[partly because]] it was raining.","zh":"我待在家里，一部分原因是在下雨。"},{"en":"The trip was cheap, [[partly because]] we camped.","zh":"这次旅行很便宜，部分原因是我们露营。"}],"ctx":"Locals are happy to play along, partly because it brings in money and also because they enjoy the joke."},{"id":39,"expr":"bring in","zh":"带来（收入）；引进","m":["brings in"],"note":"bring in money / customers / tourists。另一个意思是引进新规定：bring in a new law。","core":"bring in","forms":["bring in","brings in","brought in","bringing in"],"syn":[],"ex":[{"en":"The summer festival [[brings in]] thousands of visitors.","zh":"夏季节日吸引来成千上万的游客。"},{"en":"Her café [[brings in]] enough to pay the rent.","zh":"她的咖啡馆赚的钱够付房租。"}],"ctx":"Locals are happy to play along, partly because it brings in money and also because they enjoy the joke."},{"id":40,"expr":"whether or not","zh":"不管是否……","m":["Whether or not"],"note":"可以放在句首或句中：I'll go whether or not you come. 也可以拆开：whether you come or not。","core":"whether or not","forms":["whether or not"],"syn":[],"ex":[{"en":"[[Whether or not]] it rains, the match will go ahead.","zh":"不管下不下雨，比赛照常进行。"},{"en":"You have to pay [[whether or not]] you use it.","zh":"不管用不用，你都得付钱。"}],"ctx":"Whether or not anyone believes in them, the hidden folk do a useful job."},{"id":41,"expr":"believe in","zh":"相信……存在；信任","m":["believes in"],"note":"believe in ghosts（相信有鬼）、believe in yourself（相信自己）。believe sb 是“相信某人说的话”，意思不同。","core":"believe in","forms":["believe in","believes in","believed in","believing in"],"syn":[],"ex":[{"en":"Do you [[believe in]] ghosts?","zh":"你相信有鬼吗？"},{"en":"My coach always [[believed in]] me.","zh":"我的教练一直相信我。"}],"ctx":"Whether or not anyone believes in them, the hidden folk do a useful job."},{"id":42,"expr":"could do with","zh":"很需要、要是有……就好了","m":["could do with"],"note":"英式口语：I could do with a coffee.（我真想来杯咖啡。）比 need 更委婉、更自然。","core":"could do with","forms":["could do with"],"syn":[],"ex":[{"en":"I [[could do with]] a cup of tea.","zh":"我真想来杯茶。"},{"en":"This room [[could do with]] a good clean.","zh":"这房间该好好打扫一下了。"}],"ctx":"Plenty of places could do with a few elves of their own."},{"id":43,"expr":"elf (复数 elves)","zh":"精灵（民间传说里的小精怪）","m":["elves"],"note":"北欧民间传说里住在石头、山丘里的小精灵。注意复数不规则：elf → elves（像 shelf → shelves、wolf → wolves）。冰岛人也叫它们 huldufólk（隐身人）。形容词 elfin（小巧可爱的）。","core":"elf","forms":["elf","elves","elf's"],"syn":[],"ex":[{"en":"In the story, three [[elves]] help a poor shoemaker at night.","zh":"故事里，三个小精灵晚上帮一个穷鞋匠干活。"},{"en":"Some Icelanders believe an [[elf]] lives in the big rock behind the school.","zh":"有些冰岛人相信学校后面那块大石头里住着一个精灵。"}],"ctx":"Mind the elves: why Iceland's roads sometimes take the long way round"},{"id":44,"expr":"say less about A than about B","kind":"grammar","conn":"主语（事物）+ say(s) less about A + than about B","zh":"与其说反映了A，不如说反映了B","m":["say less about"],"note":"say 在这里不是“说话”，而是“说明、反映”：这件事 says a lot about 你（很能说明你的为人）。say less about A than about B = 它反映 A 的少，反映 B 的多 → 重点其实在 B。反过来 say more about A than about B 就是重点在 A。主语常是事物：the reasons / the choice / the result。","core":"say less about","forms":["say less about","says less about","said less about","saying less about"],"syn":[],"ex":[{"en":"His messy desk [[says less about]] laziness than about how busy he is.","zh":"他桌子乱，与其说是因为懒，不如说是因为太忙。"},{"en":"The film's success [[says less about]] the story than about its famous cast.","zh":"这部电影的成功，与其说是因为故事，不如说是因为卡司有名。"},{"en":"Where people live often [[says less about]] their taste than about house prices.","zh":"人们住在哪里，与其说取决于品味，不如说取决于房价。"}],"say":"say less about magic than about how Icelanders treat their land","pick":[{"q":"The way people spend their weekends says ___ about their jobs than about their personality.","opts":["less","fewer"],"a":0,"why":"固定搭配 say less about A than about B；less 修饰的是“说明的程度”，不是可数名词，所以不用 fewer。"},{"q":"Her choice of school says less about money ___ about what she wants to study.","opts":["than","as"],"a":0,"why":"less ... than 是比较结构，前面用了 less，后面就接 than about B。"}],"ctx":"The reasons say less about magic than about how Icelanders treat their land."},{"id":45,"expr":"Few A ..., yet surprisingly few B ...","kind":"grammar","conn":"Few + 名词 + 动词 ..., yet surprisingly few + (will / do ...) + 相反的动作","zh":"很少有人……，可出人意料的是，也很少有人……（两头都不愿表态）","m":["surprisingly few"],"note":"few 不带 a，意思是“很少、几乎没有”，语气偏否定（a few 才是“有几个”）。前半句说“很少人肯定 A”，按常理你会以为大多数人否定 A；yet surprisingly few 立刻反转：“出人意料的是，否定 A 的人也很少”。结论就是：大多数人站在中间，不肯定也不否定。yet = but，比 but 更书面、更有转折感。surprisingly 修饰 few，表示“少得出人意料”。","core":"surprisingly few","forms":["surprisingly few","yet surprisingly few"],"syn":[],"ex":[{"en":"Few people enjoy exams, yet [[surprisingly few]] want to get rid of them.","zh":"很少有人喜欢考试，可出人意料的是，想取消考试的人也很少。"},{"en":"Few of my friends say they love their jobs, yet [[surprisingly few]] are looking for new ones.","zh":"我的朋友里很少有人说自己热爱工作，可出人意料的是，在找新工作的人也很少。"},{"en":"Few tourists can name a single Icelandic writer, yet [[surprisingly few]] leave without buying a book.","zh":"很少有游客能说出哪怕一位冰岛作家的名字，可出人意料的是，空手不买书就离开的人也很少。"}],"say":"Few Icelanders will swear that elves exist, yet surprisingly few will rule it out.","pick":[{"q":"___ students like homework, yet surprisingly few want to stop doing it.","opts":["Few","A few"],"a":0,"why":"这里要的是“很少有学生喜欢作业”这个否定意思，用 Few；A few 是“有几个”，偏肯定，前后就不成对比了。"},{"q":"Few people believe the story, ___ surprisingly few say it is false.","opts":["yet","so"],"a":0,"why":"后半句和常理相反（你以为会有很多人说它是假的），是转折，用 yet；so 表示结果，意思不通。"}],"ctx":"Few Icelanders will swear that elves exist, yet surprisingly few will rule it out."}],"cloze":[{"id":1,"i":0,"before":"","ans":"Mind","after" function buildTerms(){

function setSaveNote(mode){

function scheduleSave(){
  if (!ref) return;
  clearTimeout(saveTimer);
  setSaveNote('saving');
  saveTimer = setTimeout(flush, 700);
}
async function flush(){
  if (!ref) return;
  if (saving){ again = true; return; }
  const json = JSON.stringify(state);
  if (json === lastJSON){ setSaveNote('saved'); return; }
  saving = true;
  try { await ref.set(JSON.parse(json)); lastJSON = json; setSaveNote('saved'); }
  catch(e){ setSaveNote('local'); }
  saving = false;
  if (again){ again = false; scheduleSave(); }
}
function withTimeout(p, ms){
  return Promise.race([p, new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('timeout')); }, ms); })]);
}
function hasContent(s){ return Object.keys(s.vocab).length > 0 || Object.keys(s.ans).length > 0 || !!s.quiz; }
async function initCloud(){
  let db = null, user = null;
  try {
    if (!window.claude || !window.claude.use){ setSaveNote('local'); return; }
    const r = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    db = r[0]; user = r[1];
  } catch(e){}
  if (!db || !user){ setSaveNote('local'); return; }
  let uid = null;
  try { uid = await user.id(); } catch(e){}
  if (!uid){ setSaveNote('local'); return; }
  let r;
  try { r = db.doc('data/users/' + uid + '/progress'); } catch(e){ setSaveNote('local'); return; }
  try {
    const snap = await withTimeout(r.get(), 10000);
    if (snap.exists){
      const remote = normalize(snap.data());
      if (touched){
        state = {v:1, vocab:Object.assign({}, remote.vocab, state.vocab), ans:Object.assign({}, remote.ans, state.ans), quiz:state.quiz || remote.quiz};
        lastJSON = '';
      } else {
        state = remote;
        lastJSON = JSON.stringify(state);
      }
      lsSet(LS_STATE, state);
      ref = r;
      renderAll();
      if (lastJSON === '') flush(); else setSaveNote('saved');
    } else {
      ref = r;
      lastJSON = '';
      if (hasContent(state)){ setSaveNote('saving'); flush(); } else setSaveNote('saved');
    }
  } catch(e){ setSaveNote('local'); }
}

/* ---------- vocabulary highlighting ---------- */
function marked(text, opt){
  opt = opt || {};
  if (!(opt.force || ui.hi)) return [document.createTextNode(text)];
  const out = [];
  let last = 0, m;
  TERM_RE.lastIndex = 0;
  while ((m = TERM_RE.exec(text))){
    const id = TERM_MAP[m[0].toLowerCase()];
    if (opt.only && opt.only !== id) continue;
    if (m.index > last) out.push(document.createTextNode(text.slice(last, m.index)));
    out.push(h('mark', {class:'vw' + (VMAP[id].mine ? ' uw' : ''), 'data-v':id, title:VMAP[id].zh}, m[0]));
    last = m.index + m[0].length;
  }
  if (last < text.length) out.push(document.createTextNode(text.slice(last)));
  return out;
}

/* ---------- masthead ---------- */
function renderMast(){
  const total = DATA.vocab.length;
  let n = 0;
  DATA.vocab.forEach(function(v){ if (getS(v.id) === 'mastered') n++; });
  $('#mCount').textContent = n + ' / ' + total;
  $('#meter').style.setProperty('--p', (total ? n / total * 100 : 0) + '%');
}

/* ---------- tabs ---------- */
let cur = null;
function showTab(t){
  if (TABS.indexOf(t) < 0 || (t === 'listen' && !DATA.audio)) t = 'read';
  const changed = cur !== null && cur !== t;
  cur = t;
  $$('.view').forEach(function(v){ v.hidden = v.id !== 'view-' + t; });
  $$('.tab').forEach(function(b){
    const on = b.dataset.tab === t;
    b.classList.toggle('on', on);
    b.setAttribute('aria-selected', String(on));
  });
  if (t === 'quiz' && quiz.phase === 'start') renderQuiz();
  if (t === 'words' && changed) renderWords();
  if (changed) window.scrollTo(0, 0);
}

function sentSpan(s){

function renderArticle(){

function noteCard(s){

/* the words highlighted in a sentence, each explained right here (tap to open) with a link to its full card */
function sentenceWords(s){
  const ids = [], seen = {};
  const re = new RegExp(TERM_RE.source, 'gi');
  let m;
  while ((m = re.exec(s.en))){
    const id = TERM_MAP[m[0].toLowerCase()];
    if (id !== undefined && !seen[id]){ seen[id] = true; ids.push(id); }
  }
  if (!ids.length) return null;
  return h('div', {class:'note-words'},
    h('p', {class:'note-wh'}, '本句标出的词（点开看讲解）'),
    ids.map(function(id){
      const v = VMAP[id], x = v.ex && v.ex[0];
      return h('details', {class:'nw'},
        h('summary', null, h('b', null, v.expr), '　', v.zh),
        h('div', {class:'nw-body'},
          v.note ? h('p', null, v.note) : null,
          x ? h('p', {class:'nw-ex'}, exPlain(x.en), '　', x.zh) : null,
          h('button', {type:'button', class:'btn sm', onclick:function(){ gotoWord(id); }}, '看完整词卡 →')
        )
      );
    })
  );
}

function selInfo(){

  const r = sel.getRangeAt(0);

  const pre = document.createRange();
  pre.selectNodeContents(a); pre.setEnd(r.startContainer, r.startOffset);

  let o = pre.toString().length, t = r.toString();
  /* drop spaces and punctuation at both ends: "elves," -> "elves" */
  const lead = t.match(new RegExp('^[^' + LETTERS + '0-9]*', 'i'))[0].length;
  o += lead; t = t.slice(lead);
  t = t.replace(new RegExp('[^' + LETTERS + '0-9]+$', 'i'), '');

  zh.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); save(); } });
  bg.append(card);
  document.body.append(bg);
  document.addEventListener('keydown', onKey);
  setTimeout(function(){ zh.focus(); }, 30);
}
function refreshMine(){
  loadMine();
  buildTerms();
  renderAll();
  if (L.el.box) renderListenText();
}
let toastTimer = 0;
function toast(msg){
  let t = $('.uw-toast');
  if (!t){ t = h('div', {class:'uw-toast', role:'status'}); document.body.append(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.hidden = true; }, 3200);
}

/* ---------- wiring ---------- */
/* ---------- speaker icons: words, example sentences, article sentences ---------- */
function speakBtn(key, text){ return clipBtn(DATA.clips, key, text); }
function stopNarrationForClip(){
  if (L && L.audio && !L.audio.paused) L.audio.pause();
  if (L) L.seg = null;
}
function sentBtn(en){
  if (!DATA.audio) return null;
  const i = S.findIndex(function(s){ return s.en === en; }) >= 0 ? S.findIndex(function(s){ return s.en === en; }) : S.findIndex(function(s){ return s.en.indexOf(en) >= 0; });
  if (i < 0) return null;
  const b = spkEl('播放这一句', function(){ playArticleSentence(i, b); });
  return b;
}
function playArticleSentence(i, btn){
  const a = getAudio();
  const T = DATA.audio.t[i];
  Clip.stop();
  const wasOn = L.seg && L.seg.btn === btn && !a.paused;
  endSeg();
  if (wasOn){ a.pause(); return; }
  L.seg = {end:T[1] + 0.15, btn:btn};
  btn.classList.add('on');
  const go = function(){ a.currentTime = Math.max(0, T[0] - 0.1); };
  if (a.readyState >= 1) go(); else a.addEventListener('loadedmetadata', go, {once:true});
  const pr = a.play();
  if (pr && pr.catch) pr.catch(function(){ endSeg(); });
}
function endSeg(){
  if (L.seg && L.seg.btn) L.seg.btn.classList.remove('on');
  L.seg = null;
}

/* ---------- listen tab ---------- */
const L = {audio:null, cur:-1, loop:false, loopIdx:-1, drag:false, el:{}, spans:[], raf:0, seg:null};
const RATES = [0.75, 0.9, 1, 1.15, 1.3];
function fmtT(t){ t = Math.max(0, Math.floor(t)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
function sentAt(t){
  const T = DATA.audio.t;
  let k = 0;
  for (let i = 0; i < T.length; i++){ if (T[i][0] <= t + 0.05) k = i; else break; }
  return k;
}
function getAudio(){
  if (L.audio) return L.audio;
  const a = new Audio();
  a.preload = 'auto';
  a.src = DATA.audio.src;
  a.playbackRate = ui.rate || 1;
  try { a.preservesPitch = true; a.webkitPreservesPitch = true; } catch(e){}
  a.addEventListener('timeupdate', listenUpdate);
  a.addEventListener('play', function(){ listenPlayState(); loopFrames(); });
  a.addEventListener('pause', function(){ listenPlayState(); if (L.seg && a.currentTime < L.seg.end) endSeg(); });
  a.addEventListener('ended', function(){ listenPlayState(); listenUpdate(); });
  a.addEventListener('error', function(){ L.el.msg.textContent = '音频没有加载出来，请检查网络后再点播放。'; L.el.msg.hidden = false; });
  a.addEventListener('playing', function(){ L.el.msg.hidden = true; });
  L.audio = a;
  try {
    if ('mediaSession' in navigator){
      navigator.mediaSession.metadata = new MediaMetadata({title:DATA.title, artist:{en:'外刊精读', ko:'韩语入门', ja:'日语中级'}[LANG]});
      navigator.mediaSession.setActionHandler('play', function(){ a.play(); });
      navigator.mediaSession.setActionHandler('pause', function(){ a.pause(); });
      navigator.mediaSession.setActionHandler('seekbackward', function(){ a.currentTime = Math.max(0, a.currentTime - 5); });
      navigator.mediaSession.setActionHandler('seekforward', function(){ a.currentTime = Math.min(DATA.audio.dur, a.currentTime + 5); });
    }
  } catch(e){}
  return a;
}
function listenPlayState(){
  const playing = !!(L.audio && !L.audio.paused && !L.audio.ended);
  L.el.play.textContent = playing ? '暂停' : '播放';
  L.el.play.setAttribute('aria-pressed', String(playing));
}
function loopFrames(){
  cancelAnimationFrame(L.raf);
  const tick = function(){
    if (!L.audio || L.audio.paused) return;
    listenUpdate();
    L.raf = requestAnimationFrame(tick);
  };
  L.raf = requestAnimationFrame(tick);
}
function listenUpdate(){
  const a = L.audio;
  if (!a) return;
  const T = DATA.audio.t;
  let t = a.currentTime;
  if (L.seg && !a.paused && t >= L.seg.end){ a.pause(); endSeg(); }
  if (L.loop && L.loopIdx >= 0 && !L.seg && !a.paused && t >= T[L.loopIdx][1] + 0.2){ a.currentTime = T[L.loopIdx][0]; t = a.currentTime; }
  if (!L.drag) L.el.range.value = String(t);
  L.el.now.textContent = fmtT(t);
  const k = sentAt(t);
  if (k !== L.cur){
    L.cur = k;
    markListenSentence(!a.paused);
  }
}
function markListenSentence(follow){
  L.spans.forEach(function(sp){ sp.classList.toggle('on', Number(sp.dataset.i) === L.cur); });
  if (follow && ui.tx){
    const sp = L.spans[L.cur];
    if (sp) sp.scrollIntoView({block:'nearest', behavior:REDUCE ? 'auto' : 'smooth'});
  }
}
function playSentence(i){
  endSeg();
  Clip.stop();
  const a = getAudio();
  a.currentTime = DATA.audio.t[i][0];
  if (L.loop) L.loopIdx = i;
  a.play().catch(function(){});
  listenUpdate();
}
function seekBy(d){
  endSeg();
  const a = getAudio();
  a.currentTime = Math.min(DATA.audio.dur, Math.max(0, a.currentTime + d));
  listenUpdate();
}
function setRate(r){
  ui.rate = r; lsSet(LS_UI, ui);
  if (L.audio) L.audio.playbackRate = r;
  $$('.rate-b', L.el.box).forEach(function(b){ const on = Number(b.dataset.r) === r; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
}
function applyTextVisibility(){
  L.el.tr.hidden = !ui.tx;
  L.el.off.hidden = !!ui.tx;
}
function renderListenText(){
  if (!L.el.tr) return;
  L.el.tr.replaceChildren();
  BLOCKS.forEach(function(b){
    const sec = h('section', {class:'blk blk-' + b.type});
    const el = h(b.type === 'title' ? 'h2' : 'p', {class:b.type === 'title' ? 'a-title' : b.type === 'sub' ? 'a-deck' : 'a-para'});
    b.idx.forEach(function(i, k){
      if (k > 0) el.append(' ');
      const sp = h('span', {class:'ls', 'data-i':i, tabindex:0, role:'button', 'aria-label':'从这一句开始播放'}, marked(S[i].en));
      sp.addEventListener('click', function(){ playSentence(i); });
      sp.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); playSentence(i); } });
      el.append(sp);
    });
    sec.append(el);
    L.el.tr.append(sec);
  });
  L.spans = $$('.ls', L.el.tr);
  markListenSentence(false);
}
function renderListen(){
  const box = $('#listenBox');
  if (!DATA.audio || !box || L.el.box) return;
  L.el.box = box;
  const A = DATA.audio;
  L.el.play = h('button', {type:'button', class:'btn pri big', 'aria-pressed':'false', onclick:function(){
    endSeg();
    Clip.stop();
    const a = getAudio();
    if (a.paused || a.ended){ if (a.ended) a.currentTime = 0; a.play().catch(function(){}); } else a.pause();
  }}, '播放');
  L.el.range = h('input', {type:'range', class:'lp-range', min:0, max:A.dur, step:0.1, value:0, 'aria-label':'播放进度'});
  L.el.range.addEventListener('pointerdown', function(){ L.drag = true; });
  L.el.range.addEventListener('input', function(){
    const a = getAudio();
    a.currentTime = Number(L.el.range.value);
    L.el.now.textContent = fmtT(a.currentTime);
    const k = sentAt(a.currentTime);
    if (k !== L.cur){ L.cur = k; markListenSentence(false); }
  });
  const endDrag = function(){ L.drag = false; };
  L.el.range.addEventListener('change', endDrag);
  L.el.range.addEventListener('pointerup', endDrag);
  L.el.range.addEventListener('pointercancel', endDrag);
  L.el.now = h('span', null, '0:00');
  L.el.msg = h('p', {class:'lp-msg', hidden:true, role:'alert'});
  const rates = h('div', {class:'chips', role:'group', 'aria-label':'播放速度'});
  RATES.forEach(function(r){
    rates.append(h('button', {type:'button', class:'chip rate-b', 'data-r':r, 'aria-pressed':'false', onclick:function(){ setRate(r); }}, r + '×'));
  });
  const loopCb = h('input', {type:'checkbox'});
  loopCb.addEventListener('change', function(){
    L.loop = loopCb.checked;
    L.loopIdx = L.loop ? (L.cur >= 0 ? L.cur : 0) : -1;
  });
  const txCb = h('input', {type:'checkbox'});
  txCb.checked = !!ui.tx;
  txCb.addEventListener('change', function(){ ui.tx = txCb.checked; lsSet(LS_UI, ui); applyTextVisibility(); });
  L.el.tr = h('div', {class:'tr'});
  L.el.off = h('p', {class:'tr-off'}, '原文已隐藏。先盲听一遍，听完再勾选“显示原文”对照。');
  box.append(
    h('div', {class:'card lp'},
      h('h2', {class:'h2'}, '听力'),
      h('p', {class:'lead'}, '整篇文章的朗读（AI 合成的' + (LANG !== 'en' ? XL : (DATA.audio.voice || '').charAt(0) === 'b' ? '英式' : '美式') + '发音，语速略慢）。先盲听，再对照原文；点原文里的任意一句，就从那一句开始播放。'),
      h('div', {class:'lp-row'},
        h('button', {type:'button', class:'btn', onclick:function(){ seekBy(-5); }}, '后退 5 秒'),
        L.el.play,
        h('button', {type:'button', class:'btn', onclick:function(){ seekBy(5); }}, '前进 5 秒')
      ),
      h('div', null, L.el.range, h('div', {class:'lp-time'}, L.el.now, h('span', null, fmtT(A.dur)))),
      h('div', null, h('p', {class:'meta'}, '播放速度'), h('div', {class:'row'}, rates)),
      h('div', {class:'lp-row'},
        h('label', {class:'lp-opt'}, loopCb, '单句循环（当前这一句反复听）'),
        h('label', {class:'lp-opt'}, txCb, '显示原文')
      ),
      L.el.msg
    ),
    L.el.off,
    L.el.tr
  );
  setRate(ui.rate || 1);
  renderListenText();
  applyTextVisibility();
}
function renderAll(){
  renderMast();
  renderArticle();
  renderListen();
  renderWords();
  renderThink();
  if (quiz.phase === 'start') renderQuiz();
}
function init(){
  Clip.onBeforePlay(stopNarrationForClip);
  window.addEventListener('pagehide', settle);
  document.addEventListener('visibilitychange', function(){ if (document.hidden) settle(); });
  if (LANG !== 'en'){
    const rl = h('label', null, h('input', {type:'checkbox', id:'optRom'}), LANG === 'ja' ? ' 显示读音' : LANG === 'yue' ? ' 显示粤拼' : ' 显示罗马音');
    $('#optZh').parentNode.after(rl);
    $('#optRom').checked = !!ui[ROMK];
    document.body.classList.toggle('show-rom', !!ui[ROMK]);
    $('#optRom').addEventListener('change', function(){ ui[ROMK] = this.checked; lsSet(LS_UI, ui); document.body.classList.toggle('show-rom', ui[ROMK]); });
    const tt = $('.tab[data-tab="think"]');
    if (tt) tt.textContent = LANG === 'ja' ? '语法' : '句型';
  }
  $('#optZh').checked = !!ui.zh;
  $('#optHi').checked = !!ui.hi;
  $('#optZh').addEventListener('change', function(){ ui.zh = this.checked; lsSet(LS_UI, ui); $('#article').classList.toggle('show-zh', ui.zh); });
  $('#optHi').addEventListener('change', function(){ ui.hi = this.checked; lsSet(LS_UI, ui); renderArticle(); renderListenText(); });
  const chips = $('#chips');
  ['all','new','learning','mastered'].forEach(function(f){
    chips.append(h('button', {type:'button', class:'chip', 'data-f':f, onclick:function(){ vFilter = f; renderWords(); }}, f));
  });
  document.addEventListener('selectionchange', function(){ clearTimeout(selTimer); selTimer = setTimeout(placeAddBtn, 180); });
  window.addEventListener('resize', hideAddBtn);
  $('#wordSearch').addEventListener('input', function(){ vQuery = this.value; renderWords(); });
  $$('.tab').forEach(function(b){
    b.addEventListener('click', function(){ try { location.hash = b.dataset.tab; } catch(e){} showTab(b.dataset.tab); });
  });
  window.addEventListener('hashchange', function(){ showTab(location.hash.replace('#','')); });
  if (DATA.audio) $('.tab[data-tab="listen"]').hidden = false;
  renderAll();
  showTab(location.hash.replace('#','') || 'read');
  initCloud();
}
init();
})();
</script>
