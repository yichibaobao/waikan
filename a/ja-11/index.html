示为之后做准备。"],"p":4,"i":15,"n":14,"label":"第 14 句"},{"kind":"body","en":"観光客がネットに書いてくれる「静かで、いかにも田舎町らしい町だ」というコメントを読むのが楽しみだ。","rom":"かんこうきゃくが ネットに かいて くれる 「しずかで、いかにも いなかまちらしい まちだ」と いう コメントを よむのが たのしみだ。","zh":"游客们在网上写下“安静，很有乡下小镇味道”的评论，读这些评论是我的一大乐趣。","notes":["書いてくれる：（为我们）写。てくれる 表示别人为说话人一方做事，带感谢的心情。","いかにも：的确、完全像。常和 らしい 连用：いかにも～らしい。","田舎町らしい：很有乡下小镇的样子。这个 らしい 接在名词后，是“像……样”。","～というコメント：……这样的评论。という 用来说明内容。"],"p":4,"i":16,"n":15,"label":"第 15 句"},{"kind":"body","en":"これからも車を使わずに、自分の足でこの町を歩いていきたい。","rom":"これからも くるまを つかわずに、じぶんの あしで この まちを あるいて いきたい。","zh":"今后我也想不开车，用自己的双脚在这个小镇里走下去。","notes":["使わずに：不用……（而……）。使わない 去掉 ない，加 ずに。","自分の足で：用自己的脚，也就是走路。","歩いていきたい：想（今后）一直走下去，又是一个 ていく。"],"p":4,"i":17,"n":16,"label":"第 16 句"}],"vocab":[{"id":1,"expr":"住みつく","rom":"すみつく","zh":"定居、住下来；（动物）在某处安家","m":["住みつく"],"note":"原本只是暂住，结果长期住下来了。也常说动物：倉庫にハトが住みつく（鸽子在仓库里安了家）。","core":"住みつく","forms":["住みつく","住みついて","住みついた","住みつい"],"syn":[],"ex":[{"en":"古い倉庫にハトが[[住みついて]]いる。","rom":"ふるい そうこに ハトが すみついて いる。","zh":"旧仓库里住进了鸽子。"},{"en":"旅行で来た町に、そのまま[[住みついた]]。","rom":"りょこうで きた まちに、そのまま すみついた。","zh":"旅游来到的小镇，就这样住了下来。"}],"ctx":"引っ越してきた頃は、ここに住みつくとは思っていなかった。"},{"id":2,"expr":"～てくる","rom":"～て くる","zh":"……来（朝说话人方向）；（变化）一直……到现在；……起来","m":["引っ越してきた"],"note":"以“现在、这里”为终点：动作朝说话人这边来，或者变化从过去持续到现在，都用 てくる。也表示“去做某事再回来”：ちょっと買ってくる（去买一下就回来）。","core":"てくる","forms":["てくる","てきた","てきました","てきます","てきて"],"syn":[],"ex":[{"en":"だんだん寒く[[なってきました]]ね。","rom":"だんだん さむく なって きましたね。","zh":"天渐渐冷起来了呢。"},{"en":"ちょっとコンビニでパンを[[買ってきます]]。","rom":"ちょっと コンビニで パンを かって きます。","zh":"我去便利店买个面包就回来。"},{"en":"急に雨が[[降ってきた]]。","rom":"きゅうに あめが ふって きた。","zh":"突然下起雨来了。"}],"kind":"grammar","conn":"动词て形 ＋ くる（～てきた／～てきました）","say":"引っ越してきた","pick":[{"q":"日本語を勉強する人が、年々増えて＿＿。","rom":"にほんごを べんきょうする ひとが、ねんねん ふえて＿＿。","opts":["きました","いきました"],"a":0,"why":"从过去一路增加到现在，以“现在”为终点，用 てくる（てきました）。"},{"q":"出張のお土産を買って＿＿よ。（回到家后对家人说）","rom":"しゅっちょうの おみやげを かって＿＿よ。","opts":["きた","いった"],"a":0,"why":"在外面买好、带回说话人所在的地方，用 てくる。"}],"ctx":"引っ越してきた頃は、ここに住みつくとは思っていなかった。"},{"id":3,"expr":"のんびり","rom":"のんびり","zh":"悠闲、从容；慢悠悠","m":["のんびり"],"note":"褒义时是“悠闲自在”，也可以带点批评，说人“慢吞吞、不着急”。常用 のんびりする／のんびり過ごす。","core":"のんびり","forms":["のんびり"],"syn":[],"ex":[{"en":"日曜日は家で[[のんびり]]過ごした。","rom":"にちようびは いえで のんびり すごした。","zh":"星期天在家悠闲地度过了。"},{"en":"そんなに[[のんびり]]していると、電車に遅れるよ。","rom":"そんなに のんびり して いると、でんしゃに おくれるよ。","zh":"你这么慢悠悠的，会赶不上电车的。"}],"ctx":"雪の町で、のんびり暮らす"},{"id":4,"expr":"屋根","rom":"やね","zh":"屋顶","m":["屋根"],"note":"屋根の上（屋顶上）。屋根 是房子外面的顶，房间里的“天花板”是 天井（てんじょう）。","core":"屋根","forms":["屋根"],"syn":[],"ex":[{"en":"猫が[[屋根]]の上で寝ている。","rom":"ねこが やねの うえで ねて いる。","zh":"猫在屋顶上睡觉。"},{"en":"台風で[[屋根]]が壊れた。","rom":"たいふうで やねが こわれた。","zh":"屋顶被台风吹坏了。"}],"ctx":"冬になると、屋根に雪が一メートルも積もる。"},{"id":5,"expr":"積もる","rom":"つもる","zh":"（雪、灰尘等）积、堆积","m":["積もる"],"note":"自动词：雪が積もる。也有比喻用法：話が積もる（积攒了很多话要说）。他动词是 積む（堆放）。","core":"積もる","forms":["積もる","積もって","積もった","積も"],"syn":[],"ex":[{"en":"長い間使っていない車に、ほこりが[[積もって]]いる。","rom":"ながい あいだ つかって いない くるまに、ほこりが つもって いる。","zh":"很久没用的车上积满了灰。"},{"en":"一晩で雪が三十センチ[[積もった]]。","rom":"ひとばんで ゆきが さんじゅっセンチ つもった。","zh":"一夜之间积了三十厘米的雪。"}],"ctx":"冬になると、屋根に雪が一メートルも積もる。"},{"id":6,"expr":"ますます","rom":"ますます","zh":"越来越、更加","m":["ますます"],"note":"表示程度不断加深，后面常接 ～なる、～てくる、～ていく。比 どんどん 书面一点。","core":"ますます","forms":["ますます"],"syn":[],"ex":[{"en":"夜になって、風が[[ますます]]強くなった。","rom":"よるに なって、かぜが ますます つよく なった。","zh":"到了晚上，风越来越大了。"},{"en":"練習するほど、[[ますます]]面白くなる。","rom":"れんしゅう するほど、ますます おもしろく なる。","zh":"越练越有意思。"}],"ctx":"雪が降ると、町はますます静かになっていく。"},{"id":7,"expr":"～ていく","rom":"～て いく","zh":"……去（离开说话人）；（变化）今后一直……下去","m":["なっていく"],"note":"以“现在、这里”为起点：动作离开说话人，或者变化从现在往后持续，都用 ていく。和 てくる 方向正好相反。","core":"ていく","forms":["ていく","ていきたい","ていきます","ていきましょう","ていった"],"syn":[],"ex":[{"en":"これからも日本語の勉強を[[続けていきたい]]。","rom":"これからも にほんごの べんきょうを つづけて いきたい。","zh":"今后也想继续学日语。"},{"en":"子どもたちはどんどん大きく[[なっていく]]。","rom":"こどもたちは どんどん おおきく なって いく。","zh":"孩子们会一天天长大。"},{"en":"駅まで[[歩いていきましょう]]。","rom":"えきまで あるいて いきましょう。","zh":"走着去车站吧。"}],"kind":"grammar","conn":"动词て形 ＋ いく（～ていく／～ていきたい）","say":"なっていく","pick":[{"q":"これからは、自分の力で生きて＿＿つもりだ。","rom":"これからは、じぶんの ちからで いきて＿＿ つもりだ。","opts":["いく","くる"],"a":0,"why":"“从今往后”持续下去，以现在为起点往将来，用 ていく。"},{"q":"雨が降りそうだから、傘を持って＿＿なさい。（妈妈对正要出门的孩子说）","rom":"あめが ふりそうだから、かさを もって＿＿なさい。","opts":["いき","き"],"a":0,"why":"孩子带着伞从这里离开，方向是离开说话人，用 ていく（持っていきなさい）。"}],"ctx":"雪が降ると、町はますます静かになっていく。"},{"id":8,"expr":"派手","rom":"はで","zh":"华丽、花哨；铺张","m":["派手"],"note":"な形容词：派手な服（花哨的衣服）、派手に使う（大手大脚地花）。反义词是 地味。","core":"派手","forms":["派手","派手な","派手に"],"syn":[],"ex":[{"en":"このネクタイは仕事にはちょっと[[派手]]だ。","rom":"この ネクタイは しごとには ちょっと はでだ。","zh":"这条领带上班戴有点太花哨了。"},{"en":"誕生日パーティーを[[派手に]]やった。","rom":"たんじょうび パーティーを はでに やった。","zh":"生日派对办得很热闹。"}],"ctx":"東京にいた頃の私は、派手な服を着て、髪も赤く染めていた。"},{"id":9,"expr":"染める","rom":"そめる","zh":"染（颜色）","m":["染めて"],"note":"他动词：髪を染める（染头发）、布を青く染める（把布染成蓝色）。也可比喻：夕日が空を赤く染める（夕阳把天空染红）。","core":"染める","forms":["染める","染めて","染めた","染め"],"syn":[],"ex":[{"en":"白いシャツを青く[[染めた]]。","rom":"しろい シャツを あおく そめた。","zh":"把白衬衫染成了蓝色。"},{"en":"夕日が空を赤く[[染めて]]いる。","rom":"ゆうひが そらを あかく そめて いる。","zh":"夕阳把天空染得通红。"}],"ctx":"東京にいた頃の私は、派手な服を着て、髪も赤く染めていた。"},{"id":10,"expr":"地味","rom":"じみ","zh":"朴素、素淡；不起眼","m":["地味"],"note":"な形容词，派手 的反义词。说人或工作时是“不张扬、不起眼”，不一定是贬义：地味だが大切な仕事。","core":"地味","forms":["地味","地味な","地味に"],"syn":[],"ex":[{"en":"彼女はいつも[[地味な]]服を着ている。","rom":"かのじょは いつも じみな ふくを きて いる。","zh":"她总是穿朴素的衣服。"},{"en":"[[地味な]]仕事だが、とても大切だ。","rom":"じみな しごとだが、とても たいせつだ。","zh":"工作虽然不起眼，但很重要。"}],"ctx":"今は地味な色のセーターばかり着ているが、なぜか気持ちが落ち着く。"},{"id":11,"expr":"落ち着く","rom":"おちつく","zh":"（心情）平静；（状况）安定下来","m":["落ち着く"],"note":"落ち着いて話す = 冷静地说；生活が落ち着く = 生活安定下来。落ち着いた色 = 沉稳的颜色。","core":"落ち着く","forms":["落ち着く","落ち着いて","落ち着いた","落ち着か","落ち着き"],"syn":[],"ex":[{"en":"試験の前は、深呼吸をして[[落ち着いて]]ください。","rom":"しけんの まえは、しんこきゅうを して おちついて ください。","zh":"考试前，请深呼吸让自己冷静下来。"},{"en":"新しい仕事にもやっと[[落ち着いた]]。","rom":"あたらしい しごとにも やっと おちついた。","zh":"新工作也终于安定下来了。"}],"ctx":"今は地味な色のセーターばかり着ているが、なぜか気持ちが落ち着く。"},{"id":12,"expr":"AよりBのほうが","rom":"A より B の ほうが","zh":"比起 A，B 更……","m":["のほうが"],"note":"より 跟在比较的对象后面，ほうが 前面是“更……”的那一方。名词后要加 の（夏のほうが）；动词、形容词直接接 ほうが（歩くほうが、安いほうが）。顺序也可以反过来：B のほうが A より……。","core":"より～ほうが","forms":["より～ほうが","より","ほうが","のほうが"],"syn":[],"ex":[{"en":"バスより[[電車のほうが]]早い。","rom":"バスより でんしゃの ほうが はやい。","zh":"比起公交车，电车更快。"},{"en":"一人で行くより、みんなで行く[[ほうが]]楽しい。","rom":"ひとりで いくより、みんなで いく ほうが たのしい。","zh":"比起一个人去，大家一起去更开心。"}],"kind":"grammar","conn":"A（名词／普通形）より ＋ B（名词＋の／普通形）ほうが ＋ 形容词等","say":"より、ほうが","pick":[{"q":"冬＿＿夏＿＿好きです。","rom":"ふゆ＿＿ なつ＿＿ すきです。","opts":["より／のほうが","のほうが／より"],"a":0,"why":"より 跟在比较对象后，のほうが 跟在“更喜欢”的一方后：比起冬天，更喜欢夏天。"}],"ctx":"都会の便利な生活より、ここでの静かな生活のほうが、私には合っている。"},{"id":13,"expr":"向き","rom":"むき","zh":"适合……（的）；朝向","m":["向き"],"note":"名词＋向き：适合某类人（子ども向き = 适合孩子）。方位＋向き：朝向（南向きの部屋 = 朝南的房间）。注意 向け 是“专门为……做的”：子ども向けの番組。","core":"向き","forms":["向き"],"syn":[],"ex":[{"en":"この部屋は南[[向き]]で、明るい。","rom":"この へやは みなみむきで、あかるい。","zh":"这个房间朝南，很亮堂。"},{"en":"この料理は辛くないので、子ども[[向き]]だ。","rom":"この りょうりは からく ないので、こどもむきだ。","zh":"这道菜不辣，适合小孩吃。"}],"ctx":"町にはお年寄りが多いので、店に並ぶ商品もお年寄り向きのものが多い。"},{"id":14,"expr":"一人残らず","rom":"ひとり のこらず","zh":"一个不剩、全部（的人）","m":["一人残らず"],"note":"强调“所有人，没有例外”。残る（剩下）的否定形 残らず。说东西时用 残らず：残らず食べた（全吃光了）。","core":"一人残らず","forms":["一人残らず","残らず"],"syn":[],"ex":[{"en":"クラスの学生は[[一人残らず]]試験に合格した。","rom":"クラスの がくせいは ひとり のこらず しけんに ごうかくした。","zh":"班上的学生全部通过了考试。"},{"en":"パーティーに来た人は[[一人残らず]]ケーキを食べた。","rom":"パーティーに きた ひとは ひとり のこらず ケーキを たべた。","zh":"来派对的人一个不落都吃了蛋糕。"}],"ctx":"先日、町の古い神社を直すために、住民が一人残らずお金を寄付した。"},{"id":15,"expr":"寄付","rom":"きふ","zh":"捐赠、捐款","m":["寄付"],"note":"名词，加 する 变动词：寄付する。～に～を寄付する（向……捐……）。捐的钱叫 寄付金。","core":"寄付","forms":["寄付","寄付する","寄付した","寄付して"],"syn":[],"ex":[{"en":"地震の被災地にお金を[[寄付した]]。","rom":"じしんの ひさいちに おかねを きふした。","zh":"给地震灾区捐了钱。"},{"en":"古い本を図書館に[[寄付する]]つもりだ。","rom":"ふるい ほんを としょかんに きふする つもりだ。","zh":"打算把旧书捐给图书馆。"}],"ctx":"先日、町の古い神社を直すために、住民が一人残らずお金を寄付した。"},{"id":16,"expr":"治める","rom":"おさめる","zh":"治理、统治；平息","m":["治めて"],"note":"国を治める（治理国家）。另有 収める（收纳）、納める（缴纳）、修める（修习），读音相同，汉字不同。","core":"治める","forms":["治める","治めて","治めた","治め"],"syn":[],"ex":[{"en":"この王は四十年間国を[[治めた]]。","rom":"この おうは よんじゅうねんかん くにを おさめた。","zh":"这位国王统治国家四十年。"},{"en":"町をうまく[[治める]]のは簡単ではない。","rom":"まちを うまく おさめるのは かんたんでは ない。","zh":"把一个城镇治理好并不容易。"}],"ctx":"その神社は、昔この地方を治めていた殿様が建てたらしい。"},{"id":17,"expr":"らしい（推测、传闻）","rom":"らしい","zh":"好像、听说（有根据的推测或传闻）","m":["建てたらしい"],"note":"根据听到或看到的信息做判断，说话人自己并不确定。名词、な形容词直接接：雨らしい、静からしい。注意和“像……样”的 らしい 区分。","core":"らしい","forms":["らしい","らしいです","らしいよ"],"syn":[],"ex":[{"en":"あの店のラーメンはとてもおいしい[[らしい]]よ。","rom":"あの みせの ラーメンは とても おいしい らしいよ。","zh":"听说那家店的拉面很好吃。"},{"en":"明日は雪が降る[[らしい]]。","rom":"あしたは ゆきが ふる らしい。","zh":"明天好像要下雪。"}],"kind":"grammar","conn":"普通形 ＋ らしい（名词・な形容词直接接）","say":"建てたらしい","pick":[{"q":"「隣の部屋、誰も住んでいない＿＿よ。」","rom":"「となりの へや、だれも すんで いない＿＿よ。」","opts":["らしい","らしく"],"a":0,"why":"放在句末表示传闻、推测，用 らしい；らしく 是副词形，后面要接动词。"},{"q":"「来週、駅前に新しい本屋ができるらしい。」这里的 らしい 是什么意思？","opts":["听说、好像（传闻、推测）","很有……的样子（典型）"],"a":0,"why":"らしい 接在动词普通形 できる 后面，是传闻、推测。接在名词后、说“像……样”时才是典型的意思。"}],"ctx":"その神社は、昔この地方を治めていた殿様が建てたらしい。"},{"id":18,"expr":"価値","rom":"かち","zh":"价值；～価値がある 值得……","m":["価値"],"note":"动词原形 + 価値がある / ない：読む価値がある（值得一读）。也可说 価値が高い（价值高）。","core":"価値","forms":["価値","価値がある","価値がない"],"syn":[],"ex":[{"en":"この映画は二回見る[[価値がある]]。","rom":"この えいがは にかい みる かちが ある。","zh":"这部电影值得看两遍。"},{"en":"古い切手に高い[[価値]]がつくこともある。","rom":"ふるい きってに たかい かちが つく ことも ある。","zh":"旧邮票有时也会很值钱。"}],"ctx":"歴史が好きな人なら、一度は見に行く価値がある。"},{"id":19,"expr":"やってくる","rom":"やって くる","zh":"来到、到来","m":["やってくる"],"note":"人、季节、日子都可以：冬がやってくる（冬天来了）。也写作 やって来る。过去式 やってきた。","core":"やってくる","forms":["やってくる","やってきた","やって来る","やって来た","やってき"],"syn":[],"ex":[{"en":"今年も台風の季節が[[やってくる]]。","rom":"ことしも たいふうの きせつが やって くる。","zh":"今年台风季节又要来了。"},{"en":"朝早く、友だちが家に[[やってきた]]。","rom":"あさ はやく、ともだちが いえに やって きた。","zh":"一大早，朋友来到了家里。"}],"ctx":"春になると、町にも観光客がやってくる。"},{"id":20,"expr":"～として","rom":"～と して","zh":"作为……（身份、资格、立场）","m":["として"],"note":"表示以什么身份、资格做事。修饰名词时用 としての：親としての責任。别和 にとって（对……来说）混淆。","core":"として","forms":["として","としての","としては"],"syn":[],"ex":[{"en":"彼女は通訳[[として]]会議に参加した。","rom":"かのじょは つうやくとして かいぎに さんかした。","zh":"她作为翻译参加了会议。"},{"en":"親[[としての]]責任を果たしたい。","rom":"おやとしての せきにんを はたしたい。","zh":"想尽到做父母的责任。"}],"kind":"grammar","conn":"名词 ＋ として（修饰名词时：としての）","say":"案内係として","pick":[{"q":"これは私＿＿とても大切な写真です。","rom":"これは わたし＿＿ とても たいせつな しゃしんです。","opts":["にとって","として"],"a":0,"why":"“对我来说”很重要，是从谁的角度评价，用 にとって；として 是“以……的身份”。"},{"q":"彼はボランティア＿＿病院で働いている。","rom":"かれは ボランティア＿＿ びょういんで はたらいて いる。","opts":["として","にとって"],"a":0,"why":"以志愿者的身份在医院工作，用 として。"}],"ctx":"去年は、私も町の案内係として、観光客を案内した。"},{"id":21,"expr":"酔う","rom":"よう","zh":"醉（酒）；晕（车、船）","m":["酔いやすい"],"note":"車に酔う（晕车）、船に酔う（晕船）、お酒に酔う（喝醉）。名词 酔い：車酔い（晕车）、二日酔い（宿醉）。","core":"酔う","forms":["酔う","酔い","酔って","酔った","酔いやすい"],"syn":[],"ex":[{"en":"船に乗ると、すぐ[[酔って]]しまう。","rom":"ふねに のると、すぐ よって しまう。","zh":"一坐船就晕。"},{"en":"父はビール一本で[[酔った]]。","rom":"ちちは ビール いっぽんで よった。","zh":"父亲一瓶啤酒就醉了。"}],"ctx":"帰りのバスで酔いやすい人のために、薬を用意しておくのも私の仕事だ。"},{"id":22,"expr":"コメント","rom":"コメント","zh":"评论、意见","m":["コメント"],"note":"外来词 comment。コメントする（发表评论）、コメントを書く（写评论）、ノーコメント（无可奉告）。","core":"コメント","forms":["コメント","コメントする"],"syn":[],"ex":[{"en":"動画に[[コメント]]を書いた。","rom":"どうがに コメントを かいた。","zh":"在视频下面写了评论。"},{"en":"記者の質問に、社長は「[[コメント]]できません」と答えた。","rom":"きしゃの しつもんに、しゃちょうは 「コメント できません」と こたえた。","zh":"对记者的提问，社长回答“无可奉告”。"}],"ctx":"観光客がネットに書いてくれる「静かで、いかにも田舎町らしい町だ」というコメントを読むのが楽しみだ。"},{"id":23,"expr":"らしい（像……样）","rom":"らしい","zh":"像……样的、有……的样子","m":["田舎町らしい"],"note":"名词 + らしい：很符合这个身份或特点。春らしい天気（很有春天感的天气）、男らしい（有男子气概）。副词形 らしく，否定 らしくない。同一句话有时两种 らしい 都说得通，要看上下文。","core":"らしい","forms":["らしい","らしく","らしくない"],"syn":[],"ex":[{"en":"今日は春[[らしい]]暖かい日だ。","rom":"きょうは はるらしい あたたかい ひだ。","zh":"今天是个很有春天感觉的暖和日子。"},{"en":"大人[[らしく]]、落ち着いて話しなさい。","rom":"おとならしく、おちついて はなしなさい。","zh":"像个大人一样，冷静地说话。"}],"kind":"grammar","conn":"名词 ＋ らしい（副词形：らしく；否定：らしくない）","say":"田舎町らしい","pick":[{"q":"「今日は秋らしい涼しい日ですね。」这里的 らしい 是什么意思？","opts":["很有……的样子（典型）","听说、好像（传闻、推测）"],"a":0,"why":"名词 秋 + らしい，修饰后面的 日：今天很有秋天的感觉，是“像……样”的用法。"}],"ctx":"観光客がネットに書いてくれる「静かで、いかにも田舎町らしい町だ」というコメントを読むのが楽しみだ。"},{"id":24,"expr":"～ずに","rom":"～ずに","zh":"不……（就）……；没有……而……","m":["使わずに"],"note":"意思和 ～ないで 一样，更书面一点。动词ない形去掉 ない 再加 ずに：食べない → 食べずに，行かない → 行かずに。不能说「ないずに」。する 是特殊变化：せずに。","core":"ずに","forms":["ずに","せずに"],"syn":["ないで"],"ex":[{"en":"辞書を[[引かずに]]新聞を読めるようになった。","ro let TERM_MAP = {}, TERMS = [], TERM_RE = null;
function buildTerms(){
  TERM_MAP = {}; TERMS = [];
  /* the article's own words win a clash (a learner's word that is the same text as one of them adds nothing to highlight) */
  DATA.vocab.slice().reverse().forEach(function(v){ v.m.forEach(function(t){ TERM_MAP[t.toLowerCase()] = v.id; if (TERMS.indexOf(t) < 0) TERMS.push(t); }); });

let ref = null, saveTimer = null, saving = false, again = false, lastJSON = '', touched = false;

function getS(id){ const e = state.vocab[id]; return (e && e.s) || 'new'; }
function pruneEntry(id){ const e = state.vocab[id]; if (e && !e.s && !e.m) delete state.vocab[id]; }

function scheduleSave(){
  if (!ref) return;

async function flush(){
  if (!ref) return;
  if (saving){ again = true; return; }
  const json = JSON.stringify(state);

  saving = true;
  try { await ref.set(JSON.parse(json)); lastJSON = json; setSaveNote('saved'); }
  catch(e){ setSaveNote('local'); }
  saving = false;

  } catch(e){}
  if (!db || !user){ setSaveNote('local'); return; }
  let uid = null;

  if (!uid){ setSaveNote('local'); return; }
  let r;
  try { r = db.doc('data/users/' + uid + '/progress'); } catch(e){ setSaveNote('local'); return; }
  try {
    const snap = await withTimeout(r.get(), 10000);
    if (snap.exists){
      const remote = normalize(snap.data());
      if (touched){
        state = {v:1, vocab:Object.assign({}, remote.vocab, state.vocab), ans:Object.assign({}, remote.ans, state.ans), quiz:state.quiz || remote.quiz};

        lastJSON = JSON.stringify(state);
      }
      lsSet(LS_STATE, state);
      ref = r;
      renderAll();
      if (lastJSON === '') flush(); else setSaveNote('saved');
    } else {
      ref = r;
      lastJSON = '';
      if (hasContent(state)){ setSaveNote('saving'); flush(); } else setSaveNote('saved');
    }
  } catch(e){ setSaveNote('local'); }
}

/* ---------- vocabulary highlighting ---------- */
function marked(text, opt){
  opt = opt || {};
  if (!(opt.force || ui.hi)) return rubyNodes(text);
  const out = [];
  let last = 0, m;
  TERM_RE.lastIndex = 0;
  while ((m = TERM_RE.exec(text))){
    const id = TERM_MAP[m[0].toLowerCase()];
    if (opt.only && opt.only !== id) continue;
    if (m.index > last) out.push.apply(out, rubyNodes(text.slice(last, m.index)));
    out.push(h('mark', {class:'vw' + (VMAP[id].mine ? ' uw' : ''), 'data-v':id, title:VMAP[id].zh}, rubyNodes(m[0])));
    last = m.index + m[0].length;
  }
  if (last < text.length) out.push.apply(out, rubyNodes(text.slice(last)));
  return out;
}

/* ---------- masthead ---------- */

  const total = DATA.vocab.length;
  let n = 0;
  DATA.vocab.forEach(function(v){ if (getS(v.id) === 'mastered') n++; });
  $('#mCount').textContent = n + ' / ' + total;
  $('#meter').style.setProperty('--p', (total ? n / total * 100 : 0) + '%');
}

function showTab(t){
  if (TABS.indexOf(t) < 0 || (t === 'listen' && !DATA.audio)) t = 'read';

  cur = t;
  $$('.view').forEach(function(v){ v.hidden = v.id !== 'view-' + t; });
  $$('.tab').forEach(function(b){

    b.classList.toggle('on', on);
    b.setAttribute('aria-selected', String(on));

  if (t === 'cards' && fc.phase === 'start') renderCards();
  if (t === 'words' && changed) renderWords();
  if (changed) window.scrollTo(0, 0);
}

      h('div', null, h('p', {class:'meta'}, '播放速度'), h('div', {class:'row'}, rates)),
      h('div', {class:'lp-row'},
        h('label', {class:'lp-opt'}, loopCb, '单句循环（当前这一句反复听）'),
        h('label', {class:'lp-opt'}, txCb, '显示原文')
      ),
      L.el.msg
    ),
    L.el.off,
    L.el.tr
  );
  setRate(ui.rate || 1);
  renderListenText();
  applyTextVisibility();
}
function renderAll(){
  renderMast();
  renderArticle();
  renderListen();
  renderWords();
  renderThink();
  if (quiz.phase === 'start') renderQuiz();
}
function init(){
  Clip.onBeforePlay(stopNarrationForClip);
  window.addEventListener('pagehide', settle);
  document.addEventListener('visibilitychange', function(){ if (document.hidden) settle(); });
  if (LANG !== 'en'){
    const rl = h('label', null, h('input', {type:'checkbox', id:'optRom'}), LANG === 'ja' ? ' 显示读音' : LANG === 'yue' ? ' 显示粤拼' : ' 显示罗马音');
    $('#optZh').parentNode.after(rl);
    $('#optRom').checked = !!ui[ROMK];
    document.body.classList.toggle('show-rom', !!ui[ROMK]);
    $('#optRom').addEventListener('change', function(){ ui[ROMK] = this.checked; lsSet(LS_UI, ui); document.body.classList.toggle('show-rom', ui[ROMK]); });
    const tt = $('.tab[data-tab="think"]');
    if (tt) tt.textContent = LANG === 'ja' ? '语法' : '句型';
  }
  $('#optZh').checked = !!ui.zh;
  $('#optHi').checked = !!ui.hi;
  $('#optZh').addEventListener('change', function(){ ui.zh = this.checked; lsSet(LS_UI, ui); $('#article').classList.toggle('show-zh', ui.zh); });
  $('#optHi').addEventListener('change', function(){ ui.hi = this.checked; lsSet(LS_UI, ui); renderArticle(); renderListenText(); });
  const chips = $('#chips');
  ['all','new','learning','mastered'].forEach(function(f){
    chips.append(h('button', {type:'button', class:'chip', 'data-f':f, onclick:function(){ vFilter = f; renderWords(); }}, f));
  });
  document.addEventListener('selectionchange', function(){ clearTimeout(selTimer); selTimer = setTimeout(placeAddBtn, 180); });
  window.addEventListener('resize', hideAddBtn);
  $('#wordSearch').addEventListener('input', function(){ vQuery = this.value; renderWords(); });
  $$('.tab').forEach(function(b){
    b.addEventListener('click', function(){ try { location.hash = b.dataset.tab; } catch(e){} showTab(b.dataset.tab); });
  });
  window.addEventListener('hashchange', function(){ showTab(location.hash.replace('#','')); });
  if (DATA.audio) $('.tab[data-tab="listen"]').hidden = false;
  renderAll();
  showTab(location.hash.replace('#','') || 'read');
  initCloud();
}
init();
})();
</script>
</body>
</html>
