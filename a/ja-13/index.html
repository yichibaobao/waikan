":8,"n":7,"label":"第 7 句"},{"kind":"body","en":"それでも先輩は、「たとえ何度間違えても、怒ったりしないから大丈夫」と言ってくれた。","rom":"それでも せんぱいは、「たとえ なんど まちがえても、おこったり しないから だいじょうぶ」と いって くれた。","zh":"即便如此，前辈还是对我说：“就算你错多少次，我也不会生气的，放心吧。”","notes":["たとえ～ても：即使……也……。","～たりしない：不会（做）……之类的事。"],"p":2,"i":9,"n":8,"label":"第 8 句"},{"kind":"body","en":"その一言で、私の気持ちはぱっと明るくなった。","rom":"その ひとことで、わたしの きもちは ぱっと あかるく なった。","zh":"就因为这一句话，我的心情一下子亮堂起来。","notes":["ぱっと：一下子、突然（变化很快）。","一言：一句话。"],"p":2,"i":10,"n":9,"label":"第 9 句"},{"kind":"body","en":"パン作りのこつは、なかなか飲み込めなかった。","rom":"パンづくりの こつは、なかなか のみこめなかった。","zh":"做面包的诀窍，我怎么也掌握不了。","notes":["こつを飲み込む：领会诀窍。飲み込めない 是可能形的否定。","なかなか + 否定：怎么也（不）……。"],"p":3,"i":11,"n":10,"label":"第 10 句"},{"kind":"body","en":"生地をこねるのは、適度な力と長い時間を要する仕事だ。","rom":"きじを こねるのは、てきどな ちからと ながい じかんを ようする しごとだ。","zh":"揉面团是一项需要适当力度和很长时间的工作。","notes":["生地：面团。こねる：揉。","適度な：适度的。～を要する：需要（书面）。"],"p":3,"i":12,"n":11,"label":"第 11 句"},{"kind":"body","en":"私の腕は一進一退で、うまく焼ける日もあれば、焦がしてしまう日もあった。","rom":"わたしの うでは いっしん いったいで、うまく やける ひも あれば、こがして しまう ひも あった。","zh":"我的手艺时好时坏，有能烤好的日子，也有烤焦的日子。","notes":["腕：手艺、本事。一進一退：时好时坏、进进退退。","～もあれば、～もある：有……也有……。"],"p":3,"i":13,"n":12,"label":"第 12 句"},{"kind":"body","en":"店では三十分ごとに新しいパンが焼き上がり、焼きたての香りが店じゅうに広がる。","rom":"みせでは さんじっぷん ごとに あたらしい パンが やきあがり、やきたての かおりが みせじゅうに ひろがる。","zh":"店里每隔三十分钟就有新的面包出炉，刚烤好的香味飘满整个店。","notes":["～ごとに：每……。","焼きたて：刚烤好的。～じゅう：整个……。"],"p":3,"i":14,"n":13,"label":"第 13 句"},{"kind":"body","en":"毎日同じパンを食べているのに、不思議とあきることはない。","rom":"まいにち おなじ パンを たべて いるのに、ふしぎと あきる ことは ない。","zh":"每天都吃同样的面包，奇怪的是一点也不腻。","notes":["あきる：腻、厌烦。～ことはない：不会……。","不思議と：不可思议地、奇怪的是。"],"p":3,"i":15,"n":14,"label":"第 14 句"},{"kind":"body","en":"ただ、体のことを考えて、夜ふかしと甘いものは慎むようにしている。","rom":"ただ、からだの ことを かんがえて、よふかしと あまい ものは つつしむ ように して いる。","zh":"不过，为了身体，我尽量少熬夜、少吃甜食。","notes":["慎む：节制、控制（饮食、言行）。","～ようにしている：尽量做到……（习惯）。"],"p":3,"i":16,"n":15,"label":"第 15 句"},{"kind":"body","en":"半年が経過したころ、近所の公園で店長にばったり出くわした。","rom":"はんとしが けいか した ころ、きんじょの こうえんで てんちょうに ばったり でくわした。","zh":"过了大约半年，我在附近的公园里碰巧遇到了店长。","notes":["経過する：（时间）经过。","ばったり出くわす：偶然碰上。"],"p":4,"i":17,"n":16,"label":"第 16 句"},{"kind":"body","en":"子供たちがわいわい遊んでいる横で、私たちはしばらく雑談した。","rom":"こどもたちが わいわい あそんで いる よこで、わたしたちは しばらく ざつだん した。","zh":"在孩子们吵吵嚷嚷玩耍的旁边，我们闲聊了一会儿。","notes":["わいわい：吵吵嚷嚷。","雑談する：闲聊。"],"p":4,"i":18,"n":17,"label":"第 17 句"},{"kind":"body","en":"店長も若いころ、失敗が続いて、パンから自分を遠ざけていた時期があるそうだ。","rom":"てんちょうも わかい ころ、しっぱいが つづいて、パンから じぶんを とおざけて いた じきが ある そうだ。","zh":"听说店长年轻时也因为接连失败，有一段时间让自己远离了面包。","notes":["AからBを遠ざける：让 B 远离 A。","～そうだ（传闻）：听说……。"],"p":4,"i":19,"n":18,"label":"第 18 句"},{"kind":"body","en":"「自分には才能がないと思い込んでいたんだ」という話に、私は深く共感した。","rom":"「じぶんには さいのうが ないと おもいこんで いたんだ」と いう はなしに、わたしは ふかく きょうかん した。","zh":"听到他说“那时我一直认定自己没有才能”，我深有同感。","notes":["～と思い込む：（错误地）认定、深信。","～に共感する：对……产生共鸣。"],"p":4,"i":20,"n":19,"label":"第 19 句"},{"kind":"body","en":"別れ際に店長は、頭をしぼって考えた新しいパンを、そのうち私にも作らせたいと言った。","rom":"わかれぎわに てんちょうは、あたまを しぼって かんがえた あたらしい パンを、そのうち わたしにも つくらせたいと いった。","zh":"分别时，店长说，他绞尽脑汁想出来的新面包，过些日子也想让我来做。","notes":["頭をしぼる：绞尽脑汁。","そのうち：过些日子、不久。作らせたい：想让（我）做（使役＋たい）。"],"p":4,"i":21,"n":20,"label":"第 20 句"},{"kind":"body","en":"今朝、店に入ると、壁に貼られた一枚の紙が目に入った。","rom":"けさ、みせに はいると、かべに はられた いちまいの かみが めに はいった。","zh":"今天早上一进店，就看到墙上贴着一张纸。","notes":["目に入る：映入眼帘、看到。","貼られた：被贴着的（被动）。"],"p":5,"i":22,"n":21,"label":"第 21 句"},{"kind":"body","en":"どうやら、来月以降の新しいパンは、私が担当することになったようだ。","rom":"どうやら、らいげつ いこうの あたらしい パンは、わたしが たんとう する ことに なった ようだ。","zh":"看样子，下个月以后的新面包，决定由我来负责了。","notes":["どうやら～ようだ：看样子好像……。","～以降：……以后。～ことになる：（被）决定……。"],"p":5,"i":23,"n":22,"label":"第 22 句"},{"kind":"body","en":"つまり、私も少しは店の役に立てるようになったということだ。","rom":"つまり、わたしも すこしは みせの やくに たてる ように なった と いう ことだ。","zh":"也就是说，我也多少能为店里出点力了。","notes":["つまり～ということだ：也就是说……。","役に立つ：有用、帮得上忙。立てる 是可能形。"],"p":5,"i":24,"n":23,"label":"第 23 句"},{"kind":"body","en":"一年前は、どうにか一日を終えるだけで精一杯だったのに。","rom":"いちねん まえは、どうにか いちにちを おえる だけで せいいっぱい だったのに。","zh":"一年前，光是勉强撑过一天就已经竭尽全力了。","notes":["どうにか：好不容易、勉强（总算）。","精一杯：竭尽全力。句末 のに：表示感慨（明明……）。"],"p":5,"i":25,"n":24,"label":"第 24 句"}],"vocab":[{"id":1,"expr":"～て以来","rom":"～て いらい","zh":"自从……以后（一直）","m":["出てきて以来"],"note":"动词て形 + 以来，或 名词 + 以来：从过去某件事以后一直持续到现在。后面常接持续的状态：卒業して以来、ずっと会っていない。それ以来 = 从那以后。","core":"以来","forms":["以来","それ以来"],"syn":[],"ex":[{"en":"大学を卒業して[[以来]]、一度も彼女に会っていない。","rom":"だいがくを そつぎょう して いらい、いちども かのじょに あって いない。","zh":"大学毕业以后，我一次也没见过她。"},{"en":"この町に引っ越して[[以来]]、毎朝川沿いを散歩している。","rom":"この まちに ひっこして いらい、まいあさ かわぞいを さんぽ して いる。","zh":"搬到这个镇子以后，我每天早上都沿着河边散步。"},{"en":"先月けんかをした。[[それ以来]]、兄とは口をきいていない。","rom":"せんげつ けんかを した。それ いらい、あにとは くちを きいて いない。","zh":"上个月吵了一架。从那以后，我就没跟哥哥说过话。"}],"ctx":"田舎から出てきて以来、月日のたつのが本当に早い。"},{"id":2,"expr":"月日","rom":"つきひ","zh":"岁月、时光","m":["月日"],"note":"月日がたつ（時光流逝）、月日が流れる。注意读 つきひ；写日期时的 月日 读 がっぴ（生年月日 せいねんがっぴ）。","core":"月日","forms":["月日"],"syn":[],"ex":[{"en":"[[月日]]がたつのは本当に早いものだ。","rom":"つきひが たつのは ほんとうに はやい ものだ。","zh":"时间过得真快啊。"},{"en":"あれから十年の[[月日]]が流れた。","rom":"あれから じゅうねんの つきひが ながれた。","zh":"从那以后，十年的岁月过去了。"},{"en":"何もしないで[[月日]]を過ごすのはもったいない。","rom":"なにも しないで つきひを すごすのは もったいない。","zh":"什么都不做就这样虚度时光，太可惜了。"}],"ctx":"田舎から出てきて以来、月日のたつのが本当に早い。"},{"id":3,"expr":"詰める","rom":"つめる","zh":"装满、塞进；（把空隙）挤紧","m":["詰めて"],"note":"AにBを詰める：把 B 塞进 A。也指“往里挤一挤”：席を詰める（挪一挪座位）。自动词是 詰まる（堵住、塞满）：鼻が詰まる（鼻塞）。","core":"詰める","forms":["詰める","詰めて","詰めた","詰めます"],"syn":[],"ex":[{"en":"お弁当箱にご飯とおかずを[[詰めた]]。","rom":"おべんとうばこに ごはんと おかずを つめた。","zh":"我把饭和菜装进了饭盒。"},{"en":"旅行の前の晩、かばんに荷物を[[詰めて]]おいた。","rom":"りょこうの まえの ばん、かばんに にもつを つめて おいた。","zh":"旅行前一晚，我先把行李装进了包里。"},{"en":"すみません、もう少し席を[[詰めて]]いただけますか。","rom":"すみません、もう すこし せきを つめて いただけますか。","zh":"不好意思，能稍微往里挪一挪吗？"}],"ctx":"去年の春、私はスーツケースに服を詰めて、東京に来た。"},{"id":4,"expr":"月ぎめ","rom":"つきぎめ","zh":"按月（付费、签约）","m":["月ぎめ"],"note":"按月计费、按月签约。月ぎめで借りる（按月租）、月ぎめ駐車場（按月租的停车场）。也写作 月極（同样读 つきぎめ）。","core":"月ぎめ","forms":["月ぎめ"],"syn":[],"ex":[{"en":"駅の近くに[[月ぎめ]]の駐車場を借りた。","rom":"えきの ちかくに つきぎめの ちゅうしゃじょうを かりた。","zh":"在车站附近租了一个按月付费的停车位。"},{"en":"この部屋は[[月ぎめ]]で借りられる。","rom":"この へやは つきぎめで かりられる。","zh":"这个房间可以按月租。"},{"en":"新聞を[[月ぎめ]]で取っている。","rom":"しんぶんを つきぎめで とって いる。","zh":"我按月订报纸。"}],"ctx":"部屋は駅の近くの小さなアパートで、月ぎめで借りている。"},{"id":5,"expr":"注目（する／を集める／を浴びる）","rom":"ちゅうもく（する／を あつめる／を あびる）","zh":"注目、关注","m":["注目"],"note":"注目する：关注。注目される／注目を集める／注目を浴びる：受到关注。注目の的（まと）：众人关注的焦点。","core":"注目","forms":["注目","注目する","注目されて","注目されている"],"syn":[],"ex":[{"en":"新しい駅ビルが町の人たちの[[注目]]を集めている。","rom":"あたらしい えきビルが まちの ひとたちの ちゅうもくを あつめて いる。","zh":"新的车站大楼受到镇上人们的关注。"},{"en":"この若い歌手は、今いちばん[[注目されて]]いる。","rom":"この わかい かしゅは、いま いちばん ちゅうもく されて いる。","zh":"这位年轻歌手现在最受关注。"},{"en":"先生は「ここに[[注目]]してください」と黒板を指した。","rom":"せんせいは 「ここに ちゅうもく して ください」と こくばんを さした。","zh":"老师指着黑板说：“请看这里。”"}],"ctx":"働き始めたのは、毎朝行列ができて注目を集めている人気のパン屋だ。"},{"id":6,"expr":"頭に入れる","rom":"あたまに いれる","zh":"记住、记在脑子里","m":["頭に入れて"],"note":"把信息记在脑子里，以便之后用。常和 しっかり 一起用。頭に入る：（自然地）记住、听进去：疲れて、何も頭に入らない（累得什么都记不住）。","core":"頭に入れる","forms":["頭に入れる","頭に入れて","頭に入れた","頭に入れておく"],"syn":[],"ex":[{"en":"試験の前に、大事な公式をしっかり[[頭に入れて]]おこう。","rom":"しけんの まえに、だいじな こうしきを しっかり あたまに いれて おこう。","zh":"考试前，把重要的公式好好记住吧。"},{"en":"出かける前に地図を[[頭に入れた]]。","rom":"でかける まえに ちずを あたまに いれた。","zh":"出门前我把地图记在了脑子里。"},{"en":"会議の流れを[[頭に入れて]]から、資料を作った。","rom":"かいぎの ながれを あたまに いれてから、しりょうを つくった。","zh":"我先记住了会议的流程，然后才做资料。"}],"ctx":"最初の日、店長に「注意することをしっかり頭に入れておいて」と言われ、全部ノートに書き留めた。"},{"id":7,"expr":"書き留める／書き入れる","rom":"かきとめる／かきいれる","zh":"记下来／写进、填写","m":["書き留めた"],"note":"書き留める：为了不忘记而记下来（重点在“留下记录”）。書き入れる：写进某个地方、填写（重点在“写进去”）：手帳に予定を書き入れる。","core":"書き留める","forms":["書き留める","書き留めた","書き留めて","書き入れる","書き入れた"],"syn":[],"ex":[{"en":"思いついたアイデアを手帳に[[書き留めた]]。","rom":"おもいついた アイデアを てちょうに かきとめた。","zh":"我把想到的点子记在了记事本上。"},{"en":"電話番号を忘れないうちに[[書き留めて]]おこう。","rom":"でんわ ばんごうを わすれない うちに かきとめて おこう。","zh":"趁还没忘，先把电话号码记下来吧。"},{"en":"カレンダーに旅行の日を[[書き入れた]]。","rom":"カレンダーに りょこうの ひを かきいれた。","zh":"我在日历上写上了旅行的日子。"}],"ctx":"最初の日、店長に「注意することをしっかり頭に入れておいて」と言われ、全部ノートに書き留めた。"},{"id":8,"expr":"～ながら（逆接）","rom":"～ながら","zh":"虽然……却……","m":["読んでいながら"],"note":"ながら 除了“一边……一边……”，还有逆接用法：前后意思相反，表示“虽然……可是……”，常带意外或批评的语气。残念ながら（很遗憾）、狭いながらも（虽然窄）是固定说法。","core":"ながら","forms":["ながら","ながらも"],"syn":[],"ex":[{"en":"彼は近くに住んでい[[ながら]]、一度も遊びに来ない。","rom":"かれは ちかくに すんで いながら、いちども あそびに こない。","zh":"他虽然住得很近，却一次也没来玩过。"},{"en":"体に悪いと知り[[ながら]]、つい夜中にラーメンを食べてしまう。","rom":"からだに わるいと しりながら、つい よなかに ラーメンを たべて しまう。","zh":"明知道对身体不好，却总是忍不住半夜吃拉面。"},{"en":"小さい[[ながら]]も、いいレストランだ。","rom":"ちいさい ながらも、いい レストランだ。","zh":"虽然很小，却是家不错的餐厅。"}],"kind":"grammar","conn":"动词ます形（去ます）／い形容词／名词・な形容词词干（であり）＋ ながら（も）","say":"ノートを毎晩読んでいながら","pick":[{"q":"このかばんは安い＿＿、とても丈夫だ。","rom":"この かばんは やすい ＿＿、とても じょうぶだ。","opts":["ながら","ので"],"a":0,"why":"便宜和结实意思相反，用逆接 ながら。ので 是“因为”。"},{"q":"毎日練習してい＿＿、ちっとも上手にならない。","rom":"まいにち れんしゅう して い＿＿、ちっとも じょうずに ならない。","opts":["ながら","たら"],"a":0,"why":"每天练习却不见进步，前后相反，用 ながら（虽然……却……）。"}],"ctx":"でも、そのノートを毎晩読んでいながら、パンの名前をよく間違えた。"},{"id":9,"expr":"勘違い（する）","rom":"かんちがい（する）","zh":"误会、弄错、错以为","m":["勘違いして"],"note":"AをBと勘違いする：把 A 错当成 B。也可以说 ～を勘違いする（把……弄错）、それはあなたの勘違いだ（那是你的误会）。","core":"勘違い","forms":["勘違い","勘違いする","勘違いして","勘違いした"],"syn":[],"ex":[{"en":"約束の日を[[勘違いして]]、一日早く行ってしまった。","rom":"やくそくの ひを かんちがい して、いちにち はやく いって しまった。","zh":"我弄错了约好的日子，提早一天去了。"},{"en":"後ろ姿が似ていたので、知らない人を友達と[[勘違いした]]。","rom":"うしろすがたが にて いたので、しらない ひとを ともだちと かんちがい した。","zh":"因为背影很像，我把陌生人错当成了朋友。"},{"en":"怒っていると思ったけど、それは私の[[勘違い]]だった。","rom":"おこって いると おもったけど、それは わたしの かんちがい だった。","zh":"我以为他生气了，其实是我误会了。"}],"ctx":"ある朝、私は塩パンをあんパンと勘違いして、お客さんに渡してしまった。"},{"id":10,"expr":"一体","rom":"いったい","zh":"到底、究竟","m":["一体"],"note":"放在疑问句里，加强“到底、究竟”的语气，常带不满或吃惊：一体何があったの？（到底发生了什么？）注意和 一進一退 里的 一退（いったい）只是读音一样。","core":"一体","forms":["一体","一体全体"],"syn":[],"ex":[{"en":"こんな時間まで、[[一体]]どこにいたの？","rom":"こんな じかんまで、いったい どこに いたの？","zh":"到这么晚，你究竟去哪儿了？"},{"en":"[[一体]]誰がこの窓を割ったんだろう。","rom":"いったい だれが この まどを わったんだろう。","zh":"到底是谁打破了这扇窗户呢？"},{"en":"彼は[[一体]]何を考えているのか、さっぱりわからない。","rom":"かれは いったい なにを かんがえて いるのか、さっぱり わからない。","zh":"他到底在想什么，我完全搞不懂。"}],"ctx":"先輩に「一体どうしたの」と聞かれ、顔から火が出るほど恥ずかしかった。"},{"id":11,"expr":"～ほど（程度）","rom":"～ほど","zh":"……得（简直）……、到……的程度","m":["ほど"],"note":"用一个夸张的比喻说明程度有多高：泣きたいほどうれしい（高兴得想哭）、山ほどある（多得像山一样）。～ほどの + 名词：持てないほどの荷物（多得拿不动的行李）。","core":"ほど","forms":["ほど","ほどの","ほどだ"],"syn":[],"ex":[{"en":"昨日は歩けない[[ほど]]疲れていた。","rom":"きのうは あるけない ほど つかれて いた。","zh":"昨天累得几乎走不动路。"},{"en":"このラーメンは、涙が出る[[ほど]]辛い。","rom":"この ラーメンは、なみだが でる ほど からい。","zh":"这碗拉面辣得让人流眼泪。"},{"en":"読みたい本が山[[ほど]]ある。","rom":"よみたい ほんが やま ほど ある。","zh":"想读的书多得像山一样。"}],"kind":"grammar","conn":"动词・い形容词普通形／名词 ＋ ほど（だ／の＋名词）","say":"顔から火が出るほど恥ずかしかった","pick":[{"q":"試合に勝って、飛び上がりたい＿＿うれしかった。","rom":"しあいに かって、とびあがりたい ＿＿ うれしかった。","opts":["ほど","ばかり"],"a":0,"why":"高兴到想跳起来的程度，用 ほど 表示程度。"},{"q":"食べきれない＿＿料理が出てきた。","rom":"たべきれない ＿＿ りょうりが でて きた。","opts":["ほどの","ほどに"],"a":0,"why":"后面接名词 料理，用 ほどの。"}],"ctx":"先輩に「一体どうしたの」と聞かれ、顔から火が出るほど恥ずかしかった。"},{"id":12,"expr":"たとえ～ても","rom":"たとえ ～ても","zh":"即使……也……","m":["たとえ"],"note":"假设一个极端的情况，说明结果也不会变。后面一定要配 ても／でも：たとえ雨でも行く（就算下雨也去）。和 もし（如果）不同，たとえ 后面不能接 たら、ば。","core":"たとえ","forms":["たとえ"],"syn":[],"ex":[{"en":"[[たとえ]]反対されても、私はこの仕事を続ける。","rom":"たとえ はんたい されても、わたしは この しごとを つづける。","zh":"即使被反对，我也要继续这份工作。"},{"en":"[[たとえ]]小さな店でも、自分の店を持ちたい。","rom":"たとえ ちいさな みせでも、じぶんの みせを もちたい。","zh":"哪怕是家小店，我也想有一家自己的店。"},{"en":"[[たとえ]]遠くても、毎週実家に帰るつもりだ。","rom":"たとえ とおくても、まいしゅう じっかに かえる つもりだ。","zh":"就算很远，我也打算每周回老家。"}],"kind":"grammar","conn":"たとえ ＋ 动词て形／い形容词くて ＋ も；たとえ ＋ 名词・な形容词词干 ＋ でも","say":"たとえ何度間違えても","pick":[{"q":"たとえ明日雨＿＿、試合は行われる。","rom":"たとえ あした あめ ＿＿、しあいは おこなわれる。","opts":["でも","なら"],"a":0,"why":"たとえ 后面要配 ても／でも，名词 雨 接 でも。"},{"q":"＿＿お金がなくても、心が豊かなら幸せだ。","rom":"＿＿ おかねが なくても、こころが ゆたかなら しあわせだ。","opts":["たとえ","もし"],"a":0,"why":"后面是 なくても（即使……也），和 たとえ 配合；もし 一般配 たら、ば。"}],"ctx":"それでも先輩は、「たとえ何度間違えても、怒ったりしないから大丈夫」と言ってくれた。"},{"id":13,"expr":"～たりしない","rom":"～たり しない","zh":"不会（做）……之类的事","m":["怒ったりしない"],"note":"动词た形 + りしない：用“举例”的方式委婉而坚定地否定，“不会做……（这种事）”。比直接说 怒らない 更柔和，常用来安慰人或表决心。第 12 课的 ～たり～たりする 是列举，这里只用一个 ～たり + 否定。","core":"たりしない","forms":["たりしない","だりしない","たりはしない"],"syn":[],"ex":[{"en":"大事な約束を忘れ[[たりしない]]よ。","rom":"だいじな やくそくを わすれたり しないよ。","zh":"重要的约定我不会忘的。"},{"en":"どんなにつらくても、途中でやめ[[たりしない]]。","rom":"どんなに つらくても、とちゅうで やめたり しない。","zh":"不管多辛苦，我都不会半途而废。"},{"en":"彼は人の秘密を話し[[たりしない]]人だ。","rom":"かれは ひとの ひみつを はなしたり しない ひとだ。","zh":"他不是会把别人的秘密说出去的人。"}],"kind":"grammar","conn":"动词た形 ＋ り（は）しない","say":"怒ったりしないから大丈夫","pick":[{"q":"心配しないで。君のことを笑っ＿＿よ。","rom":"しんぱい しないで。きみの ことを わらっ＿＿よ。","opts":["たりしない","たりする"],"a":0,"why":"安慰对方“不会笑你的”，用否定 たりしない。"},{"q":"借りたお金のことを忘れ＿＿しないから、安心して。","rom":"かりた おかねの ことを わすれ＿＿ しないから、あんしん して。","opts":["たり","て"],"a":0,"why":"～たりしない：忘れたりしない（不会忘）。"}],"ctx":"それでも先輩は、「たとえ何度間違えても、怒ったりしないから大丈夫」と言ってくれた。"},{"id":14,"expr":"ぱっと","rom":"ぱっと","zh":"一下子、突然；（光、消息）迅速地","m":["ぱっと"],"note":"形容动作或变化非常快：電気がぱっと消えた（灯一下子灭了）、うわさがぱっと広がった（传言一下子传开了）、ぱっと立ち上がる（猛地站起来）。也常写成片假名 パッと。","core":"ぱっと","forms":["ぱっと","パッと"],"syn":[],"ex":[{"en":"スイッチを押すと、部屋が[[ぱっと]]明るくなった。","rom":"スイッチを おすと、へやが ぱっと あかるく なった。","zh":"一按开关，房间一下子亮了。"},{"en":"名前を呼ばれて、彼は[[ぱっと]]立ち上がった。","rom":"なまえを よばれて、かれは ぱっと たちあがった。","zh":"被叫到名字，他猛地站了起来。"},{"en":"そのニュースは、[[ぱっと]]町じゅうに広がった。","rom":"その ニュースは、ぱっと まちじゅうに ひろがった。","zh":"那个消息一下子传遍了整个镇子。"}],"ctx":"その一言で、私の気持ちはぱっと明るくなった。"},{"id":15,"expr":"飲み込む","rom":"のみこむ","zh":"吞下、咽下；理解、领会","m":["飲み込めなかった"],"note":"本义是“吞下去”：薬を飲み込む。引申为“理解、领会”：こつを飲み込む（掌握诀窍）、話が飲み込めない（听不明白）。","core":"飲み込む","forms":["飲み込む","飲み込んだ","飲み込めない","飲み込めなかった","飲み込めば","飲み込んで"],"syn":[],"ex":[{"en":"錠剤が大きくて、なかなか[[飲み込めない]]。","rom":"じょうざいが おおきくて、なかなか のみこめない。","zh":"药片太大，怎么也咽不下去。"},{"en":"一度やり方を[[飲み込んで]]しまえば、あとは簡単だ。","rom":"いちど やりかたを のみこんで しまえば、あとは かんたんだ。","zh":"只要领会了做法，之后就简单了。"},{"en":"説明が速すぎて、話が[[飲み込めなかった]]。","rom":"せつめいが はやすぎて、はなしが のみこめなかった。","zh":"说明太快了，我没听明白。"}],"ctx":"パン作りのこつは、なかなか飲み込めなかった。"},{"id":16,"expr":"適度","rom":"てきど","zh":"适度、适当","m":["適度な"],"note":"不多不少、恰到好处。适度な運動（适度的运动）、適度の睡眠、適度に休む。反义是 過度（かど，过度）。","core":"適度","forms":["適度","適度な","適度の","適度に"],"syn":[],"ex":[{"en":"[[適度な]]運動は、心にも体にもいい。","rom":"てきどな うんどうは、こころにも からだにも いい。","zh":"适度的运动对身心都有好处。"},{"en":"勉強の間に、[[適度に]]休みを取りましょう。","rom":"べんきょうの あいだに、てきどに やすみを とりましょう。","zh":"学习中间要适当休息。"},{"en":"この部屋は[[適度な]]明るさで、本が読みやすい。","rom":"この へやは てきどな あかるさで、ほんが よみやすい。","zh":"这个房间亮度适中，看书很舒服。"}],"ctx":"生地をこねるのは、適度な力と長い時間を要する仕事だ。"},{"id":17,"expr":"～を要する","rom":"～を ようする","zh":"需要（书面）","m":["要する"],"note":"比 必要だ、かかる 更书面：時間を要する（需要时间）、注意を要する（需要注意）、急を要する（紧急）。","core":"要する","forms":["要する","要します","要した"],"syn":[],"ex":[{"en":"この工事には、あと半年を[[要する]]。","rom":"この こうじには、あと はんとしを ようする。","zh":"这项工程还需要半年。"},{"en":"この機械の扱いには、注意を[[要する]]。","rom":"この きかいの あつかいには、ちゅういを ようする。","zh":"使用这台机器需要小心。"},{"en":"返事には少し時間を[[要します]]。","rom":"へんじには すこし じかんを ようします。","zh":"回复需要一点时间。"}],"ctx":"生地をこねるのは、適度な力と長い時間を要する仕事だ。"},{"id":18,"expr":"一進一退","rom":"いっしん いったい","zh":"时好时坏、进进退退","m":["一進一退"],"note":"四字熟语：前进一步又后退一步，形容病情、局势、比赛等没有明显好转也没有恶化。病状は一進一退だ（病情时好时坏）。","core":"一進一退","forms":["一進一退"],"syn":[],"ex":[{"en":"祖母の病気は[[一進一退]]を続けている。","rom":"そぼの びょうきは いっしん いったいを つづけて いる。","zh":"奶奶的病时好时坏。"},{"en":"試合は[[一進一退]]のまま、後半に入った。","rom":"しあいは いっしん いったいの まま、こうはんに はいった。","zh":"比赛一直互有攻守，进入了下半场。"},{"en":"景気は[[一進一退]]で、なかなかよくならない。","rom":"けいきは いっしん いったいで、なかなか よく ならない。","zh":"经济时好时坏，迟迟不见好转。"}],"ctx":"私の腕は一進一退で、うまく焼ける日もあれば、焦がしてしまう日もあった。"},{"id":19,"expr":"～ごとに","rom":"～ごとに","zh":"每……","m":["ごとに"],"note":"名词（时间、数量）+ ごとに：每隔……就……。１時間ごとに（每一小时）、駅ごとに止まる（每站都停）。动词 + ごとに：每当……：会うごとに（每次见面）。","core":"ごとに","forms":["ごとに","ごと"],"syn":[],"ex":[{"en":"このバスは十五分[[ごとに]]来る。","rom":"この バスは じゅうごふん ごとに くる。","zh":"这趟公交车每十五分钟一班。"},{"en":"この町は、来る[[ごとに]]新しい店が増えている。","rom":"この まちは、くる ごとに あたらしい みせが ふえて いる。","zh":"每次来这个镇子，新店都会变多。"},{"en":"薬は六時間[[ごとに]]飲んでください。","rom":"くすりは ろくじかん ごとに のんで ください。","zh":"药请每六小时吃一次。"}],"ctx":"店では三十分ごとに新しいパンが焼き上がり、焼きたての香りが店じゅうに広がる。"},{"id":20,"expr":"～たて","rom":"～たて","zh":"刚……好的、刚……不久","m":["焼きたて"],"note":"动词ます形去掉ます + たて：刚刚做完，东西很新鲜。焼きたてのパン（刚烤好的面包）、いれたてのコーヒー（刚冲好的咖啡）。也可以说人：入社したての社員（刚进公司的员工）。","core":"たて","forms":["たて","たての","たてだ"],"syn":[],"ex":[{"en":"このパン屋では、焼き[[たて]]のパンが食べられる。","rom":"この パンやでは、やきたての パンが たべられる。","zh":"这家面包店可以吃到刚烤好的面包。"},{"en":"塗り[[たて]]のペンキに触らないでください。","rom":"ぬりたての ペンキに さわらないで ください。","zh":"请不要碰刚刷好的油漆。"},{"en":"日本に来[[たて]]のころは、何もわからなかった。","rom":"にほんに きたての ころは、なにも わからなかった。","zh":"刚来日本的时候，什么都不懂。"}],"kind":"grammar","conn":"动词ます形（去ます）＋ たて（の＋名词／だ）","say":"焼きたての香り","pick":[{"q":"いれ＿＿のお茶は香りがいい。","rom":"いれ＿＿の おちゃは かおりが いい。","opts":["たて","ばかり"],"a":0,"why":"ます形词干 + たて：いれたて（刚泡好的）。ばかり 要接た形：いれたばかり。"},{"q":"社会人になり＿＿の弟は、毎日疲れて帰ってくる。","rom":"しゃかいじんに なり＿＿の おとうとは、まいにち つかれて かえって くる。","opts":["たて","たい"],"a":0,"why":"刚成为社会人：なりたて。"}],"ctx":"店では三十分ごとに新しいパンが焼き上がり、焼きたての香りが店じゅうに広がる。"},{"id":21,"expr":"あきる","rom":"あきる","zh":"腻、厌烦、够了","m":["あきる"],"note":"同一件事做太多次，变得没兴趣了。～にあきる：仕事にあきる。动词ます形 + あきる：食べあきる（吃腻）、聞きあきる（听腻）。汉字写作 飽きる。","core":"あきる","forms":["あきる","あきた","あきて","あきない","飽きる","飽きた"],"syn":[],"ex":[{"en":"同じゲームばかりしていたら、さすがに[[あきた]]。","rom":"おなじ ゲームばかり して いたら、さすがに あきた。","zh":"老玩同一个游戏，终于还是腻了。"},{"en":"この歌は何回聞いても[[あきない]]。","rom":"この うたは なんかい きいても あきない。","zh":"这首歌听多少遍都不腻。"},{"en":"毎日の通勤に、もう[[あきて]]しまった。","rom":"まいにちの つうきんに、もう あきて しまった。","zh":"每天的通勤，我已经厌烦透了。"}],"ctx":"毎日同じパンを食べているのに、不思議とあきることはない。"},{"id":22,"expr":"慎む","rom":"つつしむ","zh":"节制、控制；谨慎、小心","m":["慎む"],"note":"控制自己的饮食或言行：酒を慎む（节制饮酒）、言葉を慎む（说话注意分寸）。比 やめる 委婉，意思是“少做、克制”。","core":"慎む","forms":["慎む","慎んで","慎んだ","慎みます"],"syn":[],"ex":[{"en":"医者に言われて、お酒を[[慎んで]]いる。","rom":"いしゃに いわれて、おさけを つつしんで いる。","zh":"医生嘱咐过，我在节制饮酒。"},{"en":"会議では、言葉を[[慎んで]]ください。","rom":"かいぎでは、ことばを つつしんで ください。","zh":"开会时说话请注意分寸。"},{"en":"病気をして以来、たばこを[[慎む]]ようになった。","rom":"びょうきを して いらい、たばこを つつしむ ように なった。","zh":"生病以后，我开始控制抽烟了。"}],"ctx":"ただ、体のことを考えて、夜ふかしと甘いものは慎むようにしている。"},{"id":23,"expr":"経過（する）","rom":"けいか（する）","zh":"（时间）经过、流逝；过程、经过","m":["経過した"],"note":"时间过去：一時間が経過した。也指事情的进展、过程：手術後の経過はいい（术后恢复良好）。时间越过越……：時間が経過するにつれて。","core":"経過","forms":["経過","経過する","経過した","経過して"],"syn":[],"ex":[{"en":"事故から一年が[[経過した]]。","rom":"じこから いちねんが けいか した。","zh":"事故过去一年了。"},{"en":"時間が[[経過する]]につれて、痛みは消えていった。","rom":"じかんが けいか する につれて、いたみは きえて いった。","zh":"随着时间流逝，疼痛渐渐消失了。"},{"en":"手術後の[[経過]]は順調です。","rom":"しゅじゅつごの けいかは じゅんちょうです。","zh":"术后恢复很顺利。"}],"ctx":"半年が経過したころ、近所の公園で店長にばったり出くわした。"},{"id":24,"expr":"出くわす","rom":"でくわす","zh":"偶然碰到、遇上","m":["出くわした"],"note":"没想到地碰上（人或事），常和 ばったり 一起用：駅でばったり先生に出くわした。也可以是碰上难题：思わぬ問題に出くわす。","core":"出くわす","forms":["出くわす","出くわした","出くわして"],"syn":[],"ex":[{"en":"スーパーで昔の同級生にばったり[[出くわした]]。","rom":"スーパーで むかしの どうきゅうせいに ばったり でくわした。","zh":"我在超市偶然碰上了以前的同学。"},{"en":"山道でクマに[[出くわしたら]]、どうすればいいの？","rom":"やまみちで クマに でくわしたら、どう すれば いいの？","zh":"在山路上撞见熊的话，该怎么办？"},{"en":"仕事を始めてすぐ、思わぬ問題に[[出くわした]]。","rom":"しごとを はじめて すぐ、おもわぬ もんだいに でくわした。","zh":"刚开始工作，就碰上了意想不到的问题。"}],"ctx":"半年が経過したころ、近所の公園で店長にばったり出くわした。"},{"id":25,"expr":"わいわい","rom":"わいわい","zh":"吵吵嚷嚷、热热闹闹","m":["わいわい"],"note":"很多人一起大声说笑、很热闹的样子。わいわい騒ぐ（吵吵闹闹）、みんなでわいわい飲む（大家热热闹闹地喝酒）。","core":"わいわい","forms":["わいわい"],"syn":[],"ex":[{"en":"教室の外で学生たちが[[わいわい]]騒いでいる。","rom":"きょうしつの そとで がくせいたちが わいわい さわいで いる。","zh":"学生们在教室外面吵吵嚷嚷的。"},{"en":"週末は友達と[[わいわい]]鍋を食べた。","rom":"しゅうまつは ともだちと わいわい なべを たべた。","zh":"周末和朋友热热闹闹地吃了火锅。"},{"en":"みんなで[[わいわい]]話しながら、写真を見た。","rom":"みんなで わいわい はなしながら、しゃしんを みた。","zh":"大家热热闹闹地边聊边看照片。"}],"ctx":"子供たちがわいわい遊んでいる横で、私たちはしばらく雑談した。"},{"id":26,"expr":"雑談（する）","rom":"ざつだん（する）","zh":"闲聊、聊天","m":["雑談した"],"note":"没有特定主题地随便聊。会議の前に少し雑談する（开会前稍微闲聊几句）。比 おしゃべり 稍正式一点。","core":"雑談","forms":["雑談","雑談する","雑談した","雑談して"],"syn":[],"ex":[{"en":"昼休みに同僚と[[雑談した]]。","rom":"ひるやすみに どうりょうと ざつだん した。","zh":"午休时和同事闲聊了一会儿。"},{"en":"授業の最初に、先生はいつも少し[[雑談]]をする。","rom":"じゅぎょうの さいしょに、せんせいは いつも すこし ざつだんを する。","zh":"上课一开始，老师总会先闲聊几句。"},{"en":"駅で電車を待ちながら、友達と[[雑談して]]いた。","rom":"えきで でんしゃを まちながら、ともだちと ざつだん して いた。","zh":"在车站等电车时，我和朋友聊着天。"}],"ctx":"子供たちがわいわい遊んでいる横で、私たちはしばらく雑談した。"},{"id":27,"expr":"遠ざける","rom":"とおざける","zh":"使远离、疏远；避开","m":["遠ざけて"],"note":"他动词：让人或东西离自己远一点。子供を危ない物から遠ざける（让孩子远离危险物品）。自动词是 遠ざかる（远去）：足音が遠ざかる。","core":"遠ざける","forms":["遠ざける","遠ざけて","遠ざけた","遠ざけたほうがいい"],"syn":[],"ex":[{"en":"寝る前は、スマホを自分から[[遠ざけて]]いる。","rom":"ねる まえは、スマホを じぶんから とおざけて いる。","zh":"睡前我会把手机放得离自己远远的。"},{"en":"薬は子供の手から[[遠ざけて]]ください。","rom":"くすりは こどもの てから とおざけて ください。","zh":"请把药放在孩子够不着的地方。"},{"en":"悪い友達は[[遠ざけた]]ほうがいい。","rom":"わるい ともだちは とおざけた ほうが いい。","zh":"坏朋友还是疏远一点好。"}],"ctx":"店長も若いころ、失敗が続いて、パンから自分を遠ざけていた時期があるそうだ。"},{"id":28,"expr":"思い込む","rom":"おもいこむ","zh":"深信、认定（往往是误会）","m":["思い込んで"],"note":"～と思い込む：一直认定是那样，后来常常发现想错了。名词 思い込み（成见、主观臆断）：それはただの思い込みだ。","core":"思い込む","forms":["思い込む","思い込んで","思い込んだ","思い込んでいる","思い込み"],"syn":[],"ex":[{"en":"今日は休みだと[[思い込んで]]、寝坊してしまった。","rom":"きょうは やすみだと おもいこんで、ねぼう して しまった。","zh":"我一直以为今天放假，结果睡过头了。"},{"en":"彼はその話を本当だと[[思い込んで]]いる。","rom":"かれは その はなしを ほんとうだと おもいこんで いる。","zh":"他深信那件事是真的。"},{"en":"自分にはできないというのは、ただの[[思い込み]]だ。","rom":"じぶんには できないと いうのは、ただの おもいこみだ。","zh":"说自己做不到，只是你的成见而已。"}],"ctx":"「自分には才能がないと思い込んでいたんだ」という話に、私は深く共感した。"},{"id":29,"expr":"共感（する）","rom":"きょうかん（する）","zh":"同感、共鸣","m":["共感した"],"note":"～に共感する：对别人的想法、感受产生共鸣。共感を呼ぶ（引起共鸣）、共感できない（无法认同）。","core":"共感","forms":["共感","共感する","共感した","共感できる","共感できない"],"syn":[],"ex":[{"en":"この映画の主人公に、とても[[共感した]]。","rom":"この えいがの しゅじんこうに、とても きょうかん した。","zh":"我非常理解这部电影的主人公。"},{"en":"彼女の言葉は、多くの人の[[共感]]を呼んだ。","rom":"かのじょの ことばは、おおくの ひとの きょうかんを よんだ。","zh":"她的话引起了很多人的共鸣。"},{"en":"その意見には、どうしても[[共感できない]]。","rom":"その いけんには、どうしても きょうかん できない。","zh":"那个意见我怎么也无法认同。"}],"ctx":"「自分には才能がないと思い込んでいたんだ」という話に、私は深く共感した。"},{"id":30,"expr":"しぼる","rom":"しぼる","zh":"拧、挤、榨；绞尽（脑汁）、竭尽（力气）","m":["しぼって"],"note":"本义是用力拧、挤出水分：タオルをしぼる（拧毛巾）、レモンをしぼる（挤柠檬）。引申为“竭尽”：頭をしぼる（绞尽脑汁）、声をしぼる（拼命发出声音）。汉字写作 絞る／搾る。","core":"しぼる","forms":["しぼる","しぼって","しぼった","しぼり","絞る","搾る"],"syn":[],"ex":[{"en":"ぬれたタオルを[[しぼって]]、外に干した。","rom":"ぬれた タオルを しぼって、そとに ほした。","zh":"我拧干湿毛巾，晾到了外面。"},{"en":"サラダにレモンを[[しぼった]]。","rom":"サラダに レモンを しぼった。","zh":"我往沙拉上挤了柠檬汁。"},{"en":"みんなで知恵を[[しぼって]]、新しい計画を考えた。","rom":"みんなで ちえを しぼって、あたらしい けいかくを かんがえた。","zh":"大家一起绞尽脑汁，想出了新计划。"}],"ctx":"別れ際に店長は、頭をしぼって考えた新しいパンを、そのうち私にも作らせたいと言った。"},{"id":31,"expr":"そのうち","rom":"そのうち","zh":"过些日子、不久；早晚","m":["そのうち"],"note":"不远的将来，但时间不确定：そのうち遊びに行きます（改天去玩）。也表示“早晚会”：そのうち慣れるよ（早晚会习惯的）。","core":"そのうち","forms":["そのうち"],"syn":[],"ex":[{"en":"[[そのうち]]、また一緒に飲みに行こう。","rom":"そのうち、また いっしょに のみに いこう。","zh":"改天再一起去喝酒吧。"},{"en":"心配しないで。[[そのうち]]慣れるから。","rom":"しんぱい しないで。そのうち なれるから。","zh":"别担心，过些日子就习惯了。"},{"en":"雨は[[そのうち]]やむだろう。","rom":"あめは そのうち やむだろう。","zh":"雨过一会儿就会停吧。"}],"ctx":"別れ際に店長は、頭をしぼって考えた新しいパンを、そのうち私にも作らせたいと言った。"},{"id":32,"expr":"目に入る","rom":"めに はいる","zh":"看到、映入眼帘","m":["目に入った"],"note":"不是特意去看，而是自然地看到：窓から海が目に入る（从窗户看得到海）。也可以指东西真的进了眼睛：目にごみが入った。","core":"目に入る","forms":["目に入る","目に入った","目に入って","目に入らない"],"syn":[],"ex":[{"en":"部屋に入ると、大きな絵が[[目に入った]]。","rom":"へやに はいると、おおきな えが めに はいった。","zh":"一进房间，一幅大画映入眼帘。"},{"en":"子供は、[[目に入る]]ものを何でも触りたがる。","rom":"こどもは、めに はいる ものを なんでも さわりたがる。","zh":"小孩看到什么都想摸一摸。"},{"en":"本に夢中で、周りのことが[[目に入らない]]。","rom":"ほんに むちゅうで、まわりの ことが めに はいらない。","zh":"看书看得入迷，周围的事都看不见了。"}],"ctx":"今朝、店に入ると、壁に貼られた一枚の紙が目に入った。"},{"id":33,"expr":"どうやら","rom":"どうやら","zh":"看样子、似乎（＋ようだ／らしい）","m":["どうやら"],"note":"根据情况推测，“看样子好像……”，后面常接 ようだ、らしい、みたいだ：どうやら風邪をひいたようだ。也有“好不容易、总算”的意思（这时和 どうにか 接近）：どうやら間に合った。","core":"どうやら","forms":["どうやら"],"syn":[],"ex":[{"en":"[[どうやら]]、明日は雪が降るらしい。","rom":"どうやら、あしたは ゆきが ふる らしい。","zh":"看样子明天好像要下雪。"},{"en":"[[どうやら]]道を間違えたようだ。","rom":"どうやら みちを まちがえた ようだ。","zh":"看来是走错路了。"},{"en":"[[どうやら]]最終電車に間に合った。","rom":"どうやら さいしゅう でんしゃに まにあった。","zh":"总算赶上了末班电车。"}],"ctx":"どうやら、来月以降の新しいパンは、私が担当することになったようだ。"},{"id":34,"expr":"～以降","rom":"～いこう","zh":"……以后、……之后（包括那个时间）","m":["以降"],"note":"名词（时间）+ 以降：从那时起往后。4月以降（4 月以后，包括 4 月）。和 以来 不同：以来 是“从过去某事一直到现在”，以降 可以说将来：来年以降。","core":"以降","forms":["以降"],"syn":[],"ex":[{"en":"夜十時[[以降]]は、音楽を小さくしてください。","rom":"よる じゅうじ いこうは、おんがくを ちいさく して ください。","zh":"晚上十点以后请把音乐开小声。"},{"en":"来週の月曜日[[以降]]なら、いつでも大丈夫です。","rom":"らいしゅうの げつようび いこう なら、いつでも だいじょうぶです。","zh":"下周一以后的话，什么时候都可以。"},{"en":"四月[[以降]]、電車の料金が上がる。","rom":"しがつ いこう、でんしゃの りょうきんが あがる。","zh":"四月以后电车票价要涨。"}],"ctx":"どうやら、来月以降の新しいパンは、私が担当することになったようだ。"},{"id":35,"expr":"つまり～ということだ","rom":"つまり ～と いう ことだ","zh":"也就是说……","m":["つまり","ということだ"],"note":"把前面的话换个说法、总结出结论：“也就是说……”。口语里 ということだ 常说成 ってことだ：つまり、明日は休みってこと？","core":"つまり","forms":["つまり","ということだ","ってことだ"],"syn":[],"ex":[{"en":"電話に誰も出ない。[[つまり]]、みんな出かけているという[[ことだ]]。","rom":"でんわに だれも でない。つまり、みんな でかけて いると いう ことだ。","zh":"电话没人接。也就是说，大家都出门了。"},{"en":"彼は母の弟、[[つまり]]私のおじさんだ。","rom":"かれは ははの おとうと、つまり わたしの おじさんだ。","zh":"他是我妈妈的弟弟，也就是我的舅舅。"},{"en":"チケットが売り切れ。[[つまり]]、今日は見られないってことだ。","rom":"チケットが うりきれ。つまり、きょうは みられないって ことだ。","zh":"票卖完了。也就是说，今天看不成了。"}],"kind":"grammar","conn":"つまり、＋ 普通形 ＋ ということだ（口语：ってことだ）","say":"つまり、私も少しは店の役に立てるようになったということだ","pick":[{"q":"彼は毎日遅刻する。＿＿、仕事にやる気がないということだ。","rom":"かれは まいにち ちこく する。＿＿、しごとに やるきが ないと いう ことだ。","opts":["つまり","それに"],"a":0,"why":"根据前文得出结论“也就是说”，用 つまり；それに 是“而且”。"},{"q":"店は月曜休み。つまり、明日は開いていない＿＿。","rom":"みせは げつようび やすみ。つまり、あしたは あいて いない ＿＿。","opts":["ということだ","ことにする"],"a":0,"why":"つまり 常和 ということだ 呼应，总结结论。"}],"ctx":"つまり、私も少しは店の役に立てるようになったということだ。"},{"id":36,"expr":"どうにか","rom":"どうにか","zh":"好不容易、勉强（总算）；想办法","m":["どうにか"],"note":"虽然不够完美，但总算做到了：どうにか間に合った（勉强赶上了）、おかげさまでどうにかやっています（托您的福，总算过得去）。どうにかする：想想办法。","core":"どうにか","forms":["どうにか"],"syn":[],"ex":[{"en":"徹夜して、[[どうにか]]レポートを書き終えた。","rom":"てつや して、どうにか レポートを かきおえた。","zh":"熬了一个通宵，总算把报告写完了。"},{"en":"おかげさまで、[[どうにか]]元気にやっています。","rom":"おかげさまで、どうにか げんきに やって います。","zh":"托您的福，我总算过得还不错。"},{"en":"お金が足りないけど、[[どうにか]]なるだろう。","rom":"おかねが たりないけど、どうにか なるだろう。","zh":"钱不够，不过总会有办法的吧。"}],"ctx":"一年前は、どうにか一日を終えるだけで精一杯だったのに。"}],"cloze":[{"id":1,"i":1,"before":"田舎から出てきて","ans":"以来","after":"、月日のたつのが本当に早い。","hint":"自从……以后","szh":"自从离开乡下来到这里，时间过得真快。"},{"id":2,"i":1,"before":"田舎から出てきて以来、","ans":"月日","after":"のたつのが本当に早い。","hint":"岁月","szh":"自从离开乡下来到这里，时间过得真快。"},{"id":3,"i":2,"before":"去年の春、私はスーツケースに服を","ans":"詰めて","after":"、東京に来た。","hint":"塞进（て形）","szh":"去年春天，我把衣服塞进行李箱，来到了东京。"},{"id":4,"i":3,"before":"部屋は駅の近くの小さなアパートで、","ans":"月ぎめ","after":"で借りている。","hint":"按月","szh":"房子是车站附近的一间小公寓，按月租的。"},{"id":5,"i":4,"before":"働き始めたのは、毎朝行列ができて","ans":"注目","after":"を集めている人気のパン屋だ。","hint":"关注","szh":"我开始工作的地方，是一家每天早上都排长队、很受关注的人气面包店。"},{"id":6,"i":5,"before":"最初の日、店長に「注意することをしっかり","ans":"頭に入れて","after":"おいて」と言われ、全部ノートに書き留めた。","hint":"记在脑子里（て形）","szh":"第一天，店长对我说“要注意的事情要好好记住”，我把它们全都记在了本子上。"},{"id":7,"i":5,"before":"最初の日、店長に「注意することをしっかり頭に入れておいて」と言われ、全部ノートに","ans":"書き留めた","after":"。","hint":"记下来（た形）","szh":"第一天，店长对我说“要注意的事情要好好记住”，我把它们全都记在了本子上。"},{"id":8,"i":6,"before":"でも、そのノートを毎晩読んでい","ans":"ながら","after":"、パンの名前をよく間違えた。","hint":"虽然……却（逆接）","szh":"可是，虽然每晚都在读那个本子，我还是经常把面包的名字弄错。"},{"id":9,"i":7,"before":"ある朝、私は塩パンをあんパンと","ans":"勘違い","after":"して、お客さんに渡してしまった。","hint":"错以为","szh":"有一天早上，我把盐面包错当成了红豆面包，递给了客人。"},{"id":10,"i":8,"before":"先輩に「","ans":"一体","after":"どうしたの」と聞かれ、顔から火が出るほど恥ずかしかった。","hint":"到底","szh":"前辈问我“你到底怎么了”，我羞得脸都要烧起来了。"},{"id":11,"i":8,"before":"先輩に「一体どうしたの」と聞かれ、顔から火が出る","ans":"ほど","after":"恥ずかしかった。","hint":"到……的程度","szh":"前辈问我“你到底怎么了”，我羞得脸都要烧起来了。"},{"id":12,"i":9,"before":"それでも先輩は、「","ans":"たとえ","after":"何度間違えても、怒ったりしないから大丈夫」と言ってくれた。","hint":"即使（～ても）","szh":"即便如此，前辈还是对我说：“就算你错多少次，我也不会生气的，放心吧。”"},{"id":13,"i":9,"before":"それでも先輩は、「たとえ何度間違えても、怒っ","ans":"たりしない","after":"から大丈夫」と言ってくれた。","hint":"不会……之类","szh":"即便如此，前辈还是对我说：“就算你错多少次，我也不会生气的，放心吧。”"},{"id":14,"i":10,"before":"その一言で、私の気持ちは","ans":"ぱっと","after":"明るくなった。","hint":"一下子","szh":"就因为这一句话，我的心情一下子亮堂起来。"},{"id":15,"i":11,"before":"パン作りのこつは、なかなか","ans":"飲み込めなかった","after":"。","hint":"领会（可能形否定过去）","szh":"做面包的诀窍，我怎么也掌握不了。"},{"id":16,"i":12,"before":"生地をこねるのは、","ans":"適度な","after":"力と長い時間を要する仕事だ。","hint":"适度的","szh":"揉面团是一项需要适当力度和很长时间的工作。"},{"id":17,"i":12,"before":"生地をこねるのは、適度な力と長い時間を","ans":"要する","after":"仕事だ。","hint":"需要（书面）","szh":"揉面团是一项需要适当力度和很长时间的工作。"},{"id":18,"i":13,"before":"私の腕は","ans":"一進一退","after":"で、うまく焼ける日もあれば、焦がしてしまう日もあった。","hint":"时好时坏","szh":"我的手艺时好时坏，有能烤好的日子，也有烤焦的日子。"},{"id":19,"i":14,"before":"店では三十分","ans":"ごとに","after":"新しいパンが焼き上がり、焼きたての香りが店じゅうに広がる。","hint":"每隔","szh":"店里每隔三十分钟就有新的面包出炉，刚烤好的香味飘满整个店。"},{"id":20,"i":14,"before":"店では三十分ごとに新しいパンが焼き上がり、焼き","ans":"たて","after":"の香りが店じゅうに広がる。","hint":"刚……好的（焼き＿＿）","szh":"店里每隔三十分钟就有新的面包出炉，刚烤好的香味飘满整个店。"},{"id":21,"i":15,"before":"毎日同じパンを食べているのに、不思議と","ans":"あきる","after":"ことはない。","hint":"腻","szh":"每天都吃同样的面包，奇怪的是一点也不腻。"},{"id":22,"i":16,"before":"ただ、体のことを考えて、夜ふかしと甘いものは","ans":"慎む","after":"ようにしている。","hint":"节制","szh":"不过，为了身体，我尽量少熬夜、少吃甜食。"},{"id":23,"i":17,"before":"半年が","ans":"経過","after":"したころ、近所の公園で店長にばったり出くわした。","hint":"（时间）经过","szh":"过了大约半年，我在附近的公园里碰巧遇到了店长。"},{"id":24,"i":17,"before":"半年が経過したころ、近所の公園で店長にばったり","ans":"出くわした","after":"。","hint":"碰巧遇到（た形）","szh":"过了大约半年，我在附近的公园里碰巧遇到了店长。"},{"id":25,"i":18,"before":"子供たちが","ans":"わいわい","after":"遊んでいる横で、私たちはしばらく雑談した。","hint":"吵吵嚷嚷","szh":"在孩子们吵吵嚷嚷玩耍的旁边，我们闲聊了一会儿。"},{"id async function flush(){

  if (saving){ again = true; return; }

  try { await ref.set(JSON.parse(json)); lastJSON = json; setSaveNote('saved'); }

  let uid = null;

  if (!uid){ setSaveNote('local'); return; }
  let r;
  try { r = db.doc('data/users/' + uid + '/progress'); } catch(e){ setSaveNote('local'); return; }
  try {
    const snap = await withTimeout(r.get(), 10000);
    if (snap.exists){
      const remote = normalize(snap.data());
      if (touched){
        state = {v:1, vocab:Object.assign({}, remote.vocab, state.vocab), ans:Object.assign({}, remote.ans, state.ans), quiz:state.quiz || remote.quiz};

        lastJSON = JSON.stringify(state);

      lsSet(LS_STATE, state);
      ref = r;
      renderAll();
      if (lastJSON === '') flush(); else setSaveNote('saved');
    } else {
      ref = r;
      lastJSON = '';

  } catch(e){ setSaveNote('local'); }
}

/* ---------- vocabulary highlighting ---------- */
function marked(text, opt){
  opt = opt || {};
  if (!(opt.force || ui.hi)) return rubyNodes(text);
  const out = [];
  let last = 0, m;
  TERM_RE.lastIndex = 0;
  while ((m = TERM_RE.exec(text))){
    const id = TERM_MAP[m[0].toLowerCase()];
    if (opt.only && opt.only !== id) continue;
    if (m.index > last) out.push.apply(out, rubyNodes(text.slice(last, m.index)));
    out.push(h('mark', {class:'vw' + (VMAP[id].mine ? ' uw' : ''), 'data-v':id, title:VMAP[id].zh}, rubyNodes(m[0])));
    last = m.index + m[0].length;
  }
  if (last < text.length) out.push.apply(out, rubyNodes(text.slice(last)));
  return out;
}

/* ---------- masthead ---------- */

  const total = DATA.vocab.length;

  DATA.vocab.forEach(function(v){ if (getS(v.id) === 'mastered') n++; });
  $('#mCount').textContent = n + ' / ' + total;
  $('#meter').style.setProperty('--p', (total ? n / total * 100 : 0) + '%');
}

  const changed = cur !== null && cur !== t;
  cur = t;
  $$('.view').forEach(function(v){ v.hidden = v.id !== 'view-' + t; });
  $$('.tab').forEach(function(b){
    const on = b.dataset.tab === t;
    b.classList.toggle('on', on);
    b.setAttribute('aria-selected', String(on));
  });

  if (t === 'trans' && (changed || !$('#transBox').firstChild)) renderTrans();
  if (t === 'words' && changed) renderWords();
  if (changed) window.scrollTo(0, 0);
}

    h('p', {class:'uw-ctx'}, ctx.slice(0, edit ? 0 : x.o), h('b', null, edit ? '' : term), edit ? ctx : ctx.slice(x.o + term.length)),
    old ? h('p', {class:'uw-old'}, '词汇表里已经有“' + old.expr + '”（' + old.zh + '）。还要再加一个吗？') : null,
    h('label', {class:'uw-f'}, h('span', null, '中文意思'), zh),
    h('label', {class:'uw-f'}, h('span', null, '笔记'), note),
    err,
    h('div', {class:'row'},
      h('button', {type:'button', class:'btn pri', onclick:save}, edit ? '保存' : '加入生词'),
      h('button', {type:'button', class:'btn', onclick:close}, '取消')));
  zh.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); save(); } });
  bg.append(card);
  document.body.append(bg);
  document.addEventListener('keydown', onKey);
  setTimeout(function(){ zh.focus(); }, 30);
}
function refreshMine(){
  loadMine();
  buildTerms();
  renderAll();
  if (L.el.box) renderListenText();
}
let toastTimer = 0;
function toast(msg){
  let t = $('.uw-toast');
  if (!t){ t = h('div', {class:'uw-toast', role:'status'}); document.body.append(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.hidden = true; }, 3200);
}

/* ---------- wiring ---------- */
/* ---------- speaker icons: words, example sentences, article sentences ---------- */
function speakBtn(key, text){ return clipBtn(DATA.clips, key, text); }
function stopNarrationForClip(){
  if (L && L.audio && !L.audio.paused) L.audio.pause();
  if (L) L.seg = null;
}
function sentBtn(en){
  if (!DATA.audio) return null;
  const i = S.findIndex(function(s){ return s.en === en; }) >= 0 ? S.findIndex(function(s){ return s.en === en; }) : S.findIndex(function(s){ return s.en.indexOf(en) >= 0; });
  if (i < 0) return null;
  const b = spkEl('播放这一句', function(){ playArticleSentence(i, b); });
  return b;
}
function playArticleSentence(i, btn){
  const a = getAudio();
  const T = DATA.audio.t[i];
  Clip.stop();
  const wasOn = L.seg && L.seg.btn === btn && !a.paused;
  endSeg();
  if (wasOn){ a.pause(); return; }
  L.seg = {end:T[1] + 0.15, btn:btn};
  btn.classList.add('on');
  const go = function(){ a.currentTime = Math.max(0, T[0] - 0.1); };
  if (a.readyState >= 1) go(); else a.addEventListener('loadedmetadata', go, {once:true});
  const pr = a.play();
  if (pr && pr.catch) pr.catch(function(){ endSeg(); });
}
function endSeg(){
  if (L.seg && L.seg.btn) L.seg.btn.classList.remove('on');
  L.seg = null;
}

/* ---------- listen tab ---------- */
const L = {audio:null, cur:-1, loop:false, loopIdx:-1, drag:false, el:{}, spans:[], raf:0, seg:null};
const RATES = [0.75, 0.9, 1, 1.15, 1.3];
function fmtT(t){ t = Math.max(0, Math.floor(t)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
function sentAt(t){
  const T = DATA.audio.t;
  let k = 0;
  for (let i = 0; i < T.length; i++){ if (T[i][0] <= t + 0.05) k = i; else break; }
  return k;
}
function getAudio(){
  if (L.audio) return L.audio;
  const a = new Audio();
  a.preload = 'auto';
  a.src = DATA.audio.src;
  a.playbackRate = ui.rate || 1;
  try { a.preservesPitch = true; a.webkitPreservesPitch = true; } catch(e){}
  a.addEventListener('timeupdate', listenUpdate);
  a.addEventListener('play', function(){ listenPlayState(); loopFrames(); });
  a.addEventListener('pause', function(){ listenPlayState(); if (L.seg && a.currentTime < L.seg.end) endSeg(); });
  a.addEventListener('ended', function(){ listenPlayState(); listenUpdate(); });
  a.addEventListener('error', function(){ L.el.msg.textContent = '音频没有加载出来，请检查网络后再点播放。'; L.el.msg.hidden = false; });
  a.addEventListener('playing', function(){ L.el.msg.hidden = true; });
  L.audio = a;
  try {
    if ('mediaSession' in navigator){
      navigator.mediaSession.metadata = new MediaMetadata({title:DATA.title, artist:{en:'外刊精读', ko:'韩语入门', ja:'日语中级'}[LANG]});
      navigator.mediaSession.setActionHandler('play', function(){ a.play(); });
      navigator.mediaSession.setActionHandler('pause', function(){ a.pause(); });
      navigator.mediaSession.setActionHandler('seekbackward', function(){ a.currentTime = Math.max(0, a.currentTime - 5); });
      navigator.mediaSession.setActionHandler('seekforward', function(){ a.currentTime = Math.min(DATA.audio.dur, a.currentTime + 5); });
    }
  } catch(e){}
  return a;
}
function listenPlayState(){
  const playing = !!(L.audio && !L.audio.paused && !L.audio.ended);
  L.el.play.textContent = playing ? '暂停' : '播放';
  L.el.play.setAttribute('aria-pressed', String(playing));
}
function loopFrames(){
  cancelAnimationFrame(L.raf);
  const tick = function(){
    if (!L.audio || L.audio.paused) return;
    listenUpdate();
    L.raf = requestAnimationFrame(tick);
  };
  L.raf = requestAnimationFrame(tick);
}
function listenUpdate(){
  const a = L.audio;
  if (!a) return;
  const T = DATA.audio.t;
  let t = a.currentTime;
  if (L.seg && !a.paused && t >= L.seg.end){ a.pause(); endSeg(); }
  if (L.loop && L.loopIdx >= 0 && !L.seg && !a.paused && t >= T[L.loopIdx][1] + 0.2){ a.currentTime = T[L.loopIdx][0]; t = a.currentTime; }
  if (!L.drag) L.el.range.value = String(t);
  L.el.now.textContent = fmtT(t);
  const k = sentAt(t);
  if (k !== L.cur){
    L.cur = k;
    markListenSentence(!a.paused);
  }
}
function markListenSentence(follow){
  L.spans.forEach(function(sp){ sp.classList.toggle('on', Number(sp.dataset.i) === L.cur); });
  if (follow && ui.tx){
    const sp = L.spans[L.cur];
    if (sp) sp.scrollIntoView({block:'nearest', behavior:REDUCE ? 'auto' : 'smooth'});
  }
}
function playSentence(i){
  endSeg();
  Clip.stop();
  const a = getAudio();
  a.currentTime = DATA.audio.t[i][0];
  if (L.loop) L.loopIdx = i;
  a.play().catch(function(){});
  listenUpdate();
}
function seekBy(d){
  endSeg();
  const a = getAudio();
  a.currentTime = Math.min(DATA.audio.dur, Math.max(0, a.currentTime + d));
  listenUpdate();
}
function setRate(r){
  ui.rate = r; lsSet(LS_UI, ui);
  if (L.audio) L.audio.playbackRate = r;
  $$('.rate-b', L.el.box).forEach(function(b){ const on = Number(b.dataset.r) === r; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
}
function applyTextVisibility(){
  L.el.tr.hidden = !ui.tx;
  L.el.off.hidden = !!ui.tx;
}
function renderListenText(){
  if (!L.el.tr) return;
  L.el.tr.replaceChildren();
  BLOCKS.forEach(function(b){
    const sec = h('section', {class:'blk blk-' + b.type});
    const el = h(b.type === 'title' ? 'h2' : 'p', {class:b.type === 'title' ? 'a-title' : b.type === 'sub' ? 'a-deck' : 'a-para'});
    b.idx.forEach(function(i, k){
      if (k > 0) el.append(' ');
      const sp = h('span', {class:'ls', 'data-i':i, tabindex:0, role:'button', 'aria-label':'从这一句开始播放'}, marked(S[i].en));
      sp.addEventListener('click', function(){ playSentence(i); });
      sp.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); playSentence(i); } });
      el.append(sp);
    });
    sec.append(el);
    L.el.tr.append(sec);
  });
  L.spans = $$('.ls', L.el.tr);
  markListenSentence(false);
}
function renderListen(){
  const box = $('#listenBox');
  if (!DATA.audio || !box || L.el.box) return;
  L.el.box = box;
  const A = DATA.audio;
  L.el.play = h('button', {type:'button', class:'btn pri big', 'aria-pressed':'false', onclick:function(){
    endSeg();
    Clip.stop();
    const a = getAudio();
    if (a.paused || a.ended){ if (a.ended) a.currentTime = 0; a.play().catch(function(){}); } else a.pause();
  }}, '播放');
  L.el.range = h('input', {type:'range', class:'lp-range', min:0, max:A.dur, step:0.1, value:0, 'aria-label':'播放进度'});
  L.el.range.addEventListener('pointerdown', function(){ L.drag = true; });
  L.el.range.addEventListener('input', function(){
    const a = getAudio();
    a.currentTime = Number(L.el.range.value);
    L.el.now.textContent = fmtT(a.currentTime);
    const k = sentAt(a.currentTime);
    if (k !== L.cur){ L.cur = k; markListenSentence(false); }
  });
  const endDrag = function(){ L.drag = false; };
  L.el.range.addEventListener('change', endDrag);
  L.el.range.addEventListener('pointerup', endDrag);
  L.el.range.addEventListener('pointercancel', endDrag);
  L.el.now = h('span', null, '0:00');
  L.el.msg = h('p', {class:'lp-msg', hidden:true, role:'alert'});
  const rates = h('div', {class:'chips', role:'group', 'aria-label':'播放速度'});
  RATES.forEach(function(r){
    rates.append(h('button', {type:'button', class:'chip rate-b', 'data-r':r, 'aria-pressed':'false', onclick:function(){ setRate(r); }}, r + '×'));
  });
  const loopCb = h('input', {type:'checkbox'});
  loopCb.addEventListener('change', function(){
    L.loop = loopCb.checked;
    L.loopIdx = L.loop ? (L.cur >= 0 ? L.cur : 0) : -1;
  });
  const txCb = h('input', {type:'checkbox'});
  txCb.checked = !!ui.tx;
  txCb.addEventListener('change', function(){ ui.tx = txCb.checked; lsSet(LS_UI, ui); applyTextVisibility(); });
  L.el.tr = h('div', {class:'tr'});
  L.el.off = h('p', {class:'tr-off'}, '原文已隐藏。先盲听一遍，听完再勾选“显示原文”对照。');
  box.append(
    h('div', {class:'card lp'},
      h('h2', {class:'h2'}, '听力'),
      h('p', {class:'lead'}, '整篇文章的朗读（AI 合成的' + (LANG !== 'en' ? XL : (DATA.audio.voice || '').charAt(0) === 'b' ? '英式' : '美式') + '发音，语速略慢）。先盲听，再对照原文；点原文里的任意一句，就从那一句开始播放。'),
      h('div', {class:'lp-row'},
        h('button', {type:'button', class:'btn', onclick:function(){ seekBy(-5); }}, '后退 5 秒'),
        L.el.play,
        h('button', {type:'button', class:'btn', onclick:function(){ seekBy(5); }}, '前进 5 秒')
      ),
      h('div', null, L.el.range, h('div', {class:'lp-time'}, L.el.now, h('span', null, fmtT(A.dur)))),
      h('div', null, h('p', {class:'meta'}, '播放速度'), h('div', {class:'row'}, rates)),
      h('div', {class:'lp-row'},
        h('label', {class:'lp-opt'}, loopCb, '单句循环（当前这一句反复听）'),
        h('label', {class:'lp-opt'}, txCb, '显示原文')
      ),
      L.el.msg
    ),
    L.el.off,
    L.el.tr
  );
  setRate(ui.rate || 1);
  renderListenText();
  applyTextVisibility();
}
function renderAll(){
  renderMast();
  renderArticle();
  renderListen();
  renderWords();
  renderThink();
  if (quiz.phase === 'start') renderQuiz();
}
function init(){
  Clip.onBeforePlay(stopNarrationForClip);
  window.addEventListener('pagehide', settle);
  document.addEventListener('visibilitychange', function(){ if (document.hidden) settle(); });
  if (LANG !== 'en'){
    const rl = h('label', null, h('input', {type:'checkbox', id:'optRom'}), LANG === 'ja' ? ' 显示读音' : LANG === 'yue' ? ' 显示粤拼' : ' 显示罗马音');
    $('#optZh').parentNode.after(rl);
    $('#optRom').checked = !!ui[ROMK];
    document.body.classList.toggle('show-rom', !!ui[ROMK]);
    $('#optRom').addEventListener('change', function(){ ui[ROMK] = this.checked; lsSet(LS_UI, ui); document.body.classList.toggle('show-rom', ui[ROMK]); });
    const tt = $('.tab[data-tab="think"]');
    if (tt) tt.textContent = LANG === 'ja' ? '语法' : '句型';
  }
  $('#optZh').checked = !!ui.zh;
  $('#optHi').checked = !!ui.hi;
  $('#optZh').addEventListener('change', function(){ ui.zh = this.checked; lsSet(LS_UI, ui); $('#article').classList.toggle('show-zh', ui.zh); });
  $('#optHi').addEventListener('change', function(){ ui.hi = this.checked; lsSet(LS_UI, ui); renderArticle(); renderListenText(); });
  const chips = $('#chips');
  ['all','new','learning','mastered'].forEach(function(f){
    chips.append(h('button', {type:'button', class:'chip', 'data-f':f, onclick:function(){ vFilter = f; renderWords(); }}, f));
  });
  document.addEventListener('selectionchange', function(){ clearTimeout(selTimer); selTimer = setTimeout(placeAddBtn, 180); });
  window.addEventListener('resize', hideAddBtn);
  $('#wordSearch').addEventListener('input', function(){ vQuery = this.value; renderWords(); });
  $$('.tab').forEach(function(b){
    b.addEventListener('click', function(){ try { location.hash = b.dataset.tab; } catch(e){} showTab(b.dataset.tab); });
  });
  window.addEventListener('hashchange', function(){ showTab(location.hash.replace('#','')); });
  if (DATA.audio) $('.tab[data-tab="listen"]').hidden = false;
  if (LANG === 'en' || LANG === 'ja') $('.tab[data-tab="trans"]').hidden = false;
  renderAll();
  showTab(location.hash.replace('#','') || 'read');
  initCloud();
}
init();
})();
</script>
