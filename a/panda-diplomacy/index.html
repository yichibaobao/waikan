const DATA = {"sents":[{"kind":"title","en":"Borrowed bears: how China lends pandas, and leverages them","zh":"借来的熊猫：中国怎样借出大熊猫，又怎样把它们当作筹码","notes":["borrowed：借来的。这里用过去分词当形容词。","leverage：利用……来获取优势，把某物当筹码。"],"i":0,"p":0,"n":0,"label":"标题"},{"kind":"sub","en":"No panda truly leaves China. The country lends them out for hefty fees and considerable soft power, and takes them back whenever it chooses.","zh":"没有哪只大熊猫真正离开中国。国家以高昂的费用和相当大的软实力为条件把它们借出去，又随时可以把它们收回来。","notes":["lend out：借出（向外）。对比 borrow（借入）。","hefty：数额大的、可观的。","soft power：软实力，靠吸引而非强迫来影响别国。","whenever it chooses：想什么时候就什么时候。"],"i":1,"p":0,"n":0,"label":"副标题"},{"kind":"sub","en":"Every cub born abroad belongs to Beijing, and goes home at age two.","zh":"每一只在国外出生的幼崽都属于北京，两岁时就要回中国。","notes":["cub：幼崽（熊、虎、狮等）。","belong to：属于。","at age two：两岁时，也可以说 at the age of two。"],"i":2,"p":0,"n":0,"label":"副标题"},{"kind":"body","en":"The arrangement dates to 1972, when Mao Zedong gifted a pair of pandas to America after Richard Nixon's visit.","zh":"这一做法可以追溯到 1972 年，当时毛泽东在理查德·尼克松访华之后赠送了一对大熊猫给美国。","notes":["date to：追溯到、始于某时期。","a pair of：一对、一双。","gift（动词）：赠送。这里用过去式 gifted。"],"p":1,"i":3,"n":1,"label":"第 1 句"},{"kind":"body","en":"Those were outright gifts. Today the bears are strictly on loan, at around a million dollars a year per pair.","zh":"那时是完全的赠予。如今大熊猫严格来说是租借的，每对每年约一百万美元。","notes":["outright：彻底的、完全的。","on loan：借出、出借状态。","strictly：严格地。"],"p":2,"i":4,"n":2,"label":"第 2 句"},{"kind":"body","en":"Zoos queue for the privilege, and a lucky few secure a pair.","zh":"各动物园争相争取这一特权，少数幸运的获得了一对。","notes":["queue for：排队争取、争相获取。","the privilege：特权、荣幸。","a lucky few：少数幸运者。few 单独用表示“很少”，a lucky few 指少数几个幸运的。","secure（动词）：获得、弄到（不容易得到的东西）。"],"p":3,"i":5,"n":3,"label":"第 3 句"},{"kind":"body","en":"In return they build a forested enclosure, commit to bamboo shipments and pledge funds for conservation in China.","zh":"作为回报，它们要建造一个林围栏，承诺竹子的定期运送，并保证为中国的保护工作提供资金。","notes":["in return：作为回报。","forested enclosure：有树木的围场。enclosure = 围起来的空间。","commit to：承诺做某事、投入。","pledge：保证给予、认捐（资金等）。"],"p":4,"i":6,"n":4,"label":"第 4 句"},{"kind":"body","en":"The money is framed as research funding, not rent.","zh":"这笔钱被称作研究经费，而不是租金。","notes":["frame as：把……说成、包装成。","research funding：研究经费。","not rent：而不是租金。省略了 is。"],"p":5,"i":7,"n":5,"label":"第 5 句"},{"kind":"body","en":"Cynics call it a panda tax.","zh":"持怀疑态度的人称之为熊猫税。","notes":["cynic：怀疑别人动机的人、愤世嫉俗者。","call it ...：把它叫作……。"],"p":6,"i":8,"n":6,"label":"第 6 句"},{"kind":"body","en":"The bears pay their way in other ways, too.","zh":"大熊猫在其他方面也能自己挣回成本。","notes":["pay one's way：自己挣回成本、自给自足。","in other ways：在其他方面。"],"p":7,"i":9,"n":7,"label":"第 7 句"},{"kind":"body","en":"A resident panda can boost a zoo's footfall by half, and merchandise sells briskly.","zh":"一只常驻大熊猫可以使动物园的客流量增长一半，周边商品也卖得很火。","notes":["resident：常驻的、居住的。","boost：提升、猛增。","footfall：客流量、踏进店门的人数。","merchandise：商品、周边产品。","briskly：快速地、火热地。"],"p":8,"i":10,"n":8,"label":"第 8 句"},{"kind":"body","en":"Some zoos have recouped their annual fee within months of a panda's debut.","zh":"有些动物园在大熊猫首秀后几个月内就赚回了年度费用。","notes":["recoup：收回（成本）、弥补。","annual fee：年度费用。","debut：首次亮相、首秀。"],"p":9,"i":11,"n":9,"label":"第 9 句"},{"kind":"body","en":"Yet the bears are not merely a draw; they are a diplomatic signal.","zh":"然而大熊猫不只是招揽游客的招牌，它们还是一个外交信号。","notes":["a draw：吸引力、招揽人的东西。","diplomatic：外交的。","not merely ... but ...：不只是……而是……。"],"p":10,"i":12,"n":10,"label":"第 10 句"},{"kind":"body","en":"When relations warm, pandas go out.","zh":"关系回暖时，大熊猫就借出去。","notes":["relations：关系（国与国之间）。","warm（动词）：变暖、改善。"],"p":11,"i":13,"n":11,"label":"第 11 句"},{"kind":"body","en":"When they sour, pandas come home.","zh":"关系恶化时，大熊猫就被接回来。","notes":["sour（动词）：变酸、恶化（关系等）。"],"p":12,"i":14,"n":12,"label":"第 12 句"},{"kind":"body","en":"In 2013, amid a territorial dispute, China abruptly recalled a cub from a Japanese zoo.","zh":"2013 年，在领土争端期间，中国突然从一家日本动物园召回了一只幼崽。","notes":["amid：在……之中（常接事件、冲突等）。","territorial dispute：领土争端。","abruptly：突然地。","recall：召回、叫回。"],"p":13,"i":15,"n":13,"label":"第 13 句"},{"kind":"body","en":"In 2023 a pair in Edinburgh was returned and not replaced, coinciding with chillier ties.","zh":"2023 年，爱丁堡的一对大熊猫被归还且未获替换，恰好与更冷淡的双边关系同步。","notes":["replace：替换、替代。","coincide with：与……同时发生。","chillier：更冷淡的，chilly 的比较级。"],"p":14,"i":16,"n":14,"label":"第 14 句"},{"kind":"body","en":"The message needs no translation.","zh":"这个信号不需要翻译。","notes":["need no translation：不需要翻译，引申为不言自明。","translation：翻译。"],"p":15,"i":17,"n":15,"label":"第 15 句"},{"kind":"body","en":"Pandas are also, quietly, a breeding bet.","zh":"大熊猫也在悄悄地成为一场繁殖赌注。","notes":["quietly：悄悄地、不张扬地。","breeding：繁殖、繁育。","a bet：一场赌注、押注。"],"p":16,"i":18,"n":16,"label":"第 16 句"},{"kind":"body","en":"The population in the wild hovers near 1,800, and genetic diversity matters.","zh":"野生种群数量徘徊在 1,800 上下，基因多样性很重要。","notes":["in the wild：在野外。","hover：徘徊、维持在某一水平上下。","genetic diversity：基因多样性。","matter：要紧、重要。"],"p":17,"i":19,"n":17,"label":"第 17 句"},{"kind":"body","en":"Each foreign-born cub broadens the gene pool slightly, which conservationists welcome.","zh":"每一只国外出生的幼崽都会略微拓宽基因库，这是保护工作者所乐见的。","notes":["broaden：拓宽、扩大。","gene pool：基因库。","slightly：略微、稍微。","conservationist：自然保护工作者。"],"p":18,"i":20,"n":18,"label":"第 18 句"},{"kind":"body","en":"When the cub flies back to Chengdu, it joins a breeding programme that pairs animals carefully.","zh":"当幼崽飞回成都，它会加入一个精心配对的繁育项目。","notes":["fly back：飞回。","breeding programme：繁育项目。","pair（动词）：配对。","carefully：精心地、仔细地。"],"p":19,"i":21,"n":19,"label":"第 19 句"},{"kind":"body","en":"Whether the strategy owes more to science or statecraft is debatable, but the bears do not seem to mind.","zh":"这一策略更多是出于科学还是政治手腕，尚有争议，但大熊猫似乎并不介意。","notes":["owe A to B：把 A 归因于 B。","science：科学。","statecraft：治国术、政治手腕。","debatable：有争议的、可讨论的。","seem to：似乎。"],"p":20,"i":22,"n":20,"label":"第 20 句"},{"kind":"body","en":"They sleep up to 14 hours a day, chew bamboo for most of the rest, and draw crowds wherever they go.","zh":"它们每天睡多达 14 个小时，其余大部分时间在嚼竹子，走到哪里都能吸引人群。","notes":["up to：多达、最多。","chew：嚼。","draw crowds：吸引人群。"],"p":21,"i":23,"n":21,"label":"第 21 句"},{"kind":"body","en":"Few animals have been so thoroughly woven into a country's foreign policy.","zh":"很少有动物被如此彻底地编织进一个国家的外交政策中。","notes":["thoroughly：彻底地。","weave into：编织进、融入。woven 是 weave 的过去分词。","foreign policy：外交政策。"],"p":22,"i":24,"n":22,"label":"第 22 句"}],"vocab":[{"id":1,"expr":"borrow","zh":"借入（借进）","m":["borrowed"],"note":"borrow 是借入，lend 是借出。I borrowed a book from the library. The library lent me a book.","core":"borrow","forms":["borrow","borrowed","borrowing","borrows"],"syn":[],"ex":[{"en":"She [[borrowed]] three books from the library.","zh":"她从图书馆借了三本书。"},{"en":"Can I [[borrow]] your umbrella?","zh":"我能借一下你的伞吗？"}],"ctx":"Borrowed bears: how China lends pandas, and leverages them"},{"id":2,"expr":"lend out","zh":"借出（向外）","m":["lends"],"note":"lend out 强调“借出去”给别人。对比 borrow（借入）。","core":"lends","forms":["lends","lend out","lent out","lends out","lending out","lent"],"syn":[],"ex":[{"en":"The museum [[lent out]] paintings to other galleries.","zh":"博物馆把画借给了其他美术馆。"},{"en":"They [[lent]] their car [[out]] to a neighbour.","zh":"他们把车借给了邻居。"}],"ctx":"Borrowed bears: how China lends pandas, and leverages them"},{"id":3,"expr":"leverage","zh":"利用……获取优势；把……当筹码","m":["leverages"],"note":"原指杠杆，引申为“利用某物来获取最大优势”。","core":"leverage","forms":["leverage","leveraged","leveraging","leverages"],"syn":[],"ex":[{"en":"The company [[leveraged]] its brand to enter new markets.","zh":"公司利用自己的品牌进入新市场。"},{"en":"She [[leveraged]] her network to find a job.","zh":"她利用自己的人脉找工作。"}],"ctx":"Borrowed bears: how China lends pandas, and leverages them"},{"id":4,"expr":"hefty","zh":"数额大的；可观的","m":["hefty"],"note":"形容数额、体积等很大。a hefty fine（一大笔罚款），a hefty meal（一顿丰盛的饭）。","core":"hefty","forms":["hefty"],"syn":[],"ex":[{"en":"He received a [[hefty]] bonus at year-end.","zh":"他年底拿到了一大笔奖金。"},{"en":"The fine was a [[hefty]] sum.","zh":"罚款是一大笔钱。"}],"ctx":"No panda truly leaves China. The country lends them out for hefty fees and considerable soft power, and takes them back whenever it chooses."},{"id":5,"expr":"soft power","zh":"软实力","m":["soft power"],"note":"靠吸引和说服（而非武力）来影响别国的能力。文化、体育、教育都算软实力。","core":"soft power","forms":["soft power"],"syn":[],"ex":[{"en":"Pop music is part of a country's [[soft power]].","zh":"流行音乐是一个国家软实力的一部分。"},{"en":"The film festival boosted the nation's [[soft power]].","zh":"电影节提升了该国的软实力。"}],"ctx":"No panda truly leaves China. The country lends them out for hefty fees and considerable soft power, and takes them back whenever it chooses."},{"id":6,"expr":"cub","zh":"幼崽（熊、虎、狮等）","m":["cub"],"note":"专指食肉动物的幼崽。小熊叫 bear cub，小虎叫 tiger cub。","core":"cub","forms":["cub","cubs"],"syn":[],"ex":[{"en":"The [[cub]] clung to its mother.","zh":"幼崽紧紧贴着妈妈。"},{"en":"Two [[cubs]] were born at the zoo last spring.","zh":"去年春天动物园出生了两只幼崽。"}],"ctx":"Every cub born abroad belongs to Beijing, and goes home at age two."},{"id":7,"expr":"belong to","zh":"属于","m":["belongs to"],"note":"注意没有被动语态。不能说 It is belonged to。","core":"belong to","forms":["belong to","belongs to","belonged to","belonging to"],"syn":[],"ex":[{"en":"This land [[belongs to]] the state.","zh":"这片土地属于国家。"},{"en":"The idea [[belongs to]] no single person.","zh":"这个想法不属于任何一个人。"}],"ctx":"Every cub born abroad belongs to Beijing, and goes home at age two."},{"id":8,"expr":"date to","zh":"追溯到；始于","m":["dates to"],"note":"也可以说 date back to。表示某事物的起源时间。","core":"date to","forms":["date to","dates to","dated to","dating to","dates back to"],"syn":[],"ex":[{"en":"The tradition [[dates to]] the 15th century.","zh":"这个传统可以追溯到十五世纪。"},{"en":"The castle [[dates back to]] 1200.","zh":"这座城堡始建于 1200 年。"}],"ctx":"The arrangement dates to 1972, when Mao Zedong gifted a pair of pandas to America after Richard Nixon's visit."},{"id":9,"expr":"a pair of","zh":"一对；一双","m":["pair"],"note":"a pair of shoes / gloves / pandas。两件配在一起用的东西。","core":"pair","forms":["pair","pairs","a pair of"],"syn":[],"ex":[{"en":"She bought [[a pair of]] earrings.","zh":"她买了一对耳环。"},{"en":"I need [[a pair of]] chopsticks.","zh":"我需要一双筷子。"}],"ctx":"The arrangement dates to 1972, when Mao Zedong gifted a pair of pandas to America after Richard Nixon's visit."},{"id":10,"expr":"gift（动词）","zh":"赠送","m":["gifted"],"note":"gift 作动词比 give 更正式，常用于官方赠送。","core":"gift","forms":["gift","gifted","gifting","gifts"],"syn":[],"ex":[{"en":"The mayor [[gifted]] a painting to the school.","zh":"市长把一幅画赠送给了学校。"},{"en":"They [[gifted]] her a laptop for graduation.","zh":"他们送了她一台笔记本电脑作为毕业礼物。"}],"ctx":"The arrangement dates to 1972, when Mao Zedong gifted a pair of pandas to America after Richard Nixon's visit."},{"id":11,"expr":"outright","zh":"彻底的；完全的","m":["outright"],"note":"当形容词用：彻底的、完全的。当副词用：毫不犹豫地、公开地。","core":"outright","forms":["outright"],"syn":[],"ex":[{"en":"It was an [[outright]] victory.","zh":"这是一场完胜。"},{"en":"She [[outright]] refused to help.","zh":"她断然拒绝了帮忙。"}],"ctx":"Those were outright gifts. Today the bears are strictly on loan, at around a million dollars a year per pair."},{"id":12,"expr":"on loan","zh":"借出（状态）","m":["on loan"],"note":"The painting is on loan from the Louvre.（这幅画是从卢浮宫借来的。）","core":"on loan","forms":["on loan"],"syn":[],"ex":[{"en":"The exhibit is [[on loan]] from a private collection.","zh":"展品来自私人收藏的借展。"},{"en":"The player is [[on loan]] from another club.","zh":"这名球员是从另一个俱乐部租借来的。"}],"ctx":"Those were outright gifts. Today the bears are strictly on loan, at around a million dollars a year per pair."},{"id":13,"expr":"strictly","zh":"严格地","m":["strictly"],"note":"强调严格遵守、不含糊。strictly speaking（严格来说）。","core":"strictly","forms":["strictly"],"syn":[],"ex":[{"en":"This is [[strictly]] between us.","zh":"这件事只有你我知道，绝不外传。"},{"en":"[[Strictly]] speaking, a tomato is a fruit.","zh":"严格来说，番茄是一种水果。"}],"ctx":"Those were outright gifts. Today the bears are strictly on loan, at around a million dollars a year per pair."},{"id":14,"expr":"queue for","zh":"排队争取","m":["queue"],"note":"英式英语常用 queue，美式英语用 line up。这里引申为“争相争取”。","core":"queue","forms":["queue","queued","queuing","queues"],"syn":[],"ex":[{"en":"Fans [[queued for]] hours to buy tickets.","zh":"粉丝们排了几个小时的队买票。"},{"en":"People [[queued up]] for the free samples.","zh":"人们排队领取免费样品。"}],"ctx":"Zoos queue for the privilege, and a lucky few secure a pair."},{"id":15,"expr":"the privilege","zh":"特权；荣幸","m":["privilege"],"note":"It's a privilege to meet you.（见到您是荣幸。）","core":"privilege","forms":["privilege","privileges"],"syn":[],"ex":[{"en":"Education is a [[privilege]] in some countries.","zh":"在某些国家，教育是一种特权。"},{"en":"It was a [[privilege]] to work with her.","zh":"能和她共事是一种荣幸。"}],"ctx":"Zoos queue for the privilege, and a lucky few secure a pair."},{"id":16,"expr":"a lucky few","zh":"少数幸运者","m":["lucky few"],"note":"few 单独用表示“几乎没有”，a few 表示“几个”，a lucky few 指“少数幸运的（人或物）”。","core":"lucky few","forms":["lucky few","a lucky few"],"syn":[],"ex":[{"en":"Many applied; [[a lucky few]] were chosen.","zh":"很多人申请了，少数幸运者被选中。"},{"en":"Only [[a lucky few]] saw the meteor shower.","zh":"只有少数幸运的人看到了流星雨。"}],"ctx":"Zoos queue for the privilege, and a lucky few secure a pair."},{"id":17,"expr":"secure（动词）","zh":"获得；弄到（不易得到的东西）","m":["secure"],"note":"secure 作动词比 get 更正式，强调经过努力获得。","core":"secure","forms":["secure","secured","securing","secures"],"syn":[],"ex":[{"en":"He [[secured]] a loan from the bank.","zh":"他从银行拿到了贷款。"},{"en":"The team [[secured]] a spot in the finals.","zh":"队伍获得了决赛的名额。"}],"ctx":"Zoos queue for the privilege, and a lucky few secure a pair."},{"id":18,"expr":"in return","zh":"作为回报","m":["in return"],"note":"give sth and get sth in return（给出去某物，换回某物作为回报）。","core":"in return","forms":["in return"],"syn":[],"ex":[{"en":"She helped him; [[in return]], he bought her dinner.","zh":"她帮了他；作为回报，他请她吃晚饭。"},{"en":"They want nothing [[in return]].","zh":"他们不要任何回报。"}],"ctx":"In return they build a forested enclosure, commit to bamboo shipments and pledge funds for conservation in China."},{"id":19,"expr":"commit to","zh":"承诺做某事；投入","m":["commit to"],"note":"commit to + 名词或 -ing。The company committed to reducing emissions.","core":"commit to","forms":["commit to","committed to","committing to","commits to","committed"],"syn":[],"ex":[{"en":"She [[committed to]] saving 10% of her salary.","zh":"她承诺把工资的 10% 存起来。"},{"en":"The government [[committed]] funds [[to]] the project.","zh":"政府向该项目拨了资金。"}],"ctx":"In return they build a forested enclosure, commit to bamboo shipments and pledge funds for conservation in China."},{"id":20,"expr":"pledge","zh":"保证给予；认捐","m":["pledge"],"note":"pledge money / support：保证给予金钱或支持。比 promise 更正式。","core":"pledge","forms":["pledge","pledged","pledging","pledges"],"syn":[],"ex":[{"en":"He [[pledged]] a million dollars to the charity.","zh":"他向慈善机构认捐了一百万美元。"},{"en":"They [[pledged]] to rebuild the school.","zh":"他们承诺重建学校。"}],"ctx":"In return they build a forested enclosure, commit to bamboo shipments and pledge funds for conservation in China."},{"id":21,"expr":"frame as","zh":"把……说成；包装成","m":["framed"],"note":"frame 本义是“装框架”，引申为“用某种说法来描述”。","core":"frame","forms":["frame","framed","framing","frames"],"syn":[],"ex":[{"en":"The tax was [[framed as]] a health measure.","zh":"这项税被说成是健康措施。"},{"en":"She [[framed]] the question [[as]] a suggestion.","zh":"她把问题包装成了一个建议。"}],"ctx":"The money is framed as research funding, not rent."},{"id":22,"expr":"cynic","zh":"怀疑别人动机的人","m":["cynics"],"note":"cynic 认为人的行为都出于自私。形容词 cynical。","core":"cynic","forms":["cynic","cynics"],"syn":[],"ex":[{"en":"[[Cynics]] said the donation was for publicity.","zh":"持怀疑态度的人说那笔捐款是为了出风头。"},{"en":"Don't be a [[cynic]] — sometimes people are genuinely kind.","zh":"别总怀疑别人的动机——有时候人是真心善意的。"}],"ctx":"Cynics call it a panda tax."},{"id":23,"expr":"pay one's way","zh":"自己挣回成本；自给自足","m":["pay their way"],"note":"表示某物能自己产出价值来抵消成本。","core":"pay their way","forms":["pay their way","pay one's way","paid one's way","pays its way","paid its way","pay his way"],"syn":[],"ex":[{"en":"The cafe [[paid its way]] within a year.","zh":"咖啡馆一年内就自负盈亏了 ":"门票第一天卖得很火。"},{"en":"She walked [[briskly]] down the street.","zh":"她快步走在街上。"}],"ctx":"A resident panda can boost a zoo's footfall by half, and merchandise sells briskly."},{"id":29,"expr":"recoup","zh":"收回（成本）；弥补","m":["recouped"],"note":"recoup one's investment / costs / losses：收回投资/成本/损失。","core":"recoup","forms":["recoup","recouped","recouping","recoups"],"syn":[],"ex":[{"en":"The company [[recouped]] its losses within a year.","zh":"公司在一年内弥补了损失。"},{"en":"She [[recouped]] her investment by selling the flat.","zh":"她卖掉公寓收回了投资。"}],"ctx":"Some zoos have recouped their annual fee within months of a panda's debut."},{"id":30,"expr":"debut","zh":"首次亮相；首秀","m":["debut"],"note":"可当名词或动词。读音为 /ˈdeɪbjuː/，来自法语，t 不发音。","core":"debut","forms":["debut","debuted","debuts"],"syn":[],"ex":[{"en":"The singer made her [[debut]] at 16.","zh":"这位歌手 16 岁首次登台。"},{"en":"The film [[debuted]] at the festival.","zh":"这部电影在电影节上首映。"}],"ctx":"Some zoos have recouped their annual fee within months of a panda's debut."},{"id":31,"expr":"a draw","zh":"吸引力；招揽人的东西","m":["draw"],"note":"draw 在这里是名词：吸引人的事物。a tourist draw = 旅游卖点。","core":"draw","forms":["draw","draws"],"syn":[],"ex":[{"en":"The fountain is [[a draw]] for tourists.","zh":"喷泉是吸引游客的卖点。"},{"en":"Free coffee is always [[a draw]].","zh":"免费咖啡总是有吸引力的。"}],"ctx":"Yet the bears are not merely a draw; they are a diplomatic signal."},{"id":32,"expr":"diplomatic","zh":"外交的","m":["diplomatic"],"note":"diplomatic relations（外交关系），diplomatic signal（外交信号）。","core":"diplomatic","forms":["diplomatic"],"syn":[],"ex":[{"en":"The two countries broke [[diplomatic]] ties.","zh":"两国断绝了外交关系。"},{"en":"Her answer was [[diplomatic]].","zh":"她的回答很圆滑。"}],"ctx":"Yet the bears are not merely a draw; they are a diplomatic signal."},{"id":33,"expr":"sour（动词）","zh":"变酸；恶化","m":["sour"],"note":"本义是变酸，引申为关系等恶化。sour relations / sour a deal。","core":"sour","forms":["sour","soured","souring","sours"],"syn":[],"ex":[{"en":"The dispute [[soured]] relations between the two teams.","zh":"争端恶化了两支队伍之间的关系。"},{"en":"The deal [[soured]] after weeks of talks.","zh":"经过数周谈判，交易泡汤了。"}],"ctx":"When they sour, pandas come home."},{"id":34,"expr":"amid","zh":"在……之中","m":["amid"],"note":"后面常接事件、冲突、混乱等。amid the chaos（在混乱之中）。","core":"amid","forms":["amid"],"syn":[],"ex":[{"en":"The company collapsed [[amid]] a scandal.","zh":"公司在一场丑闻中倒闭了。"},{"en":"[[Amid]] the noise, nobody heard the alarm.","zh":"在嘈杂声中，没人听到警报。"}],"ctx":"In 2013, amid a territorial dispute, China abruptly recalled a cub from a Japanese zoo."},{"id":35,"expr":"territorial dispute","zh":"领土争端","m":["territorial dispute"],"note":"territorial（领土的）+ dispute（争端）。","core":"territorial dispute","forms":["territorial dispute","territorial disputes"],"syn":[],"ex":[{"en":"The [[territorial dispute]] has lasted decades.","zh":"这场领土争端持续了几十年。"},{"en":"Both sides refuse to compromise on the [[territorial dispute]].","zh":"双方在领土争端上互不让步。"}],"ctx":"In 2013, amid a territorial dispute, China abruptly recalled a cub from a Japanese zoo."},{"id":36,"expr":"abruptly","zh":"突然地","m":["abruptly"],"note":"abrupt（突然的）+ -ly。比 suddenly 更强调“没有预兆”。","core":"abruptly","forms":["abruptly"],"syn":[],"ex":[{"en":"The meeting ended [[abruptly]].","zh":"会议突然结束了。"},{"en":"He [[abruptly]] left the room.","zh":"他突然离开了房间。"}],"ctx":"In 2013, amid a territorial dispute, China abruptly recalled a cub from a Japanese zoo."},{"id":37,"expr":"recall","zh":"召回；叫回","m":["recalled"],"note":"recall an ambassador / a product / a person：召回大使/产品/人。","core":"recall","forms":["recall","recalled","recalling","recalls"],"syn":[],"ex":[{"en":"The embassy [[recalled]] all its staff.","zh":"大使馆召回了所有员工。"},{"en":"The firm [[recalled]] 10,000 cars for a safety check.","zh":"公司召回了 10,000 辆汽车进行安全检查。"}],"ctx":"In 2013, amid a territorial dispute, China abruptly recalled a cub from a Japanese zoo."},{"id":38,"expr":"coincide with","zh":"与……同时发生","m":["coinciding"],"note":"coincide /ˌkəʊɪnˈsaɪd/。两个事件在同一时间发生。","core":"coincide","forms":["coincide","coincided","coinciding","coincides"],"syn":[],"ex":[{"en":"His visit [[coincided with]] the festival.","zh":"他的到访恰逢节日。"},{"en":"The price rise [[coincided]] with a shortage of supply.","zh":"涨价恰好发生在供应短缺的时候。"}],"ctx":"In 2023 a pair in Edinburgh was returned and not replaced, coinciding with chillier ties."},{"id":39,"expr":"breeding","zh":"繁殖；繁育","m":["breeding"],"note":"breeding programme（繁育项目），breeding season（繁殖季节）。","core":"breeding","forms":["breeding"],"syn":[],"ex":[{"en":"The zoo runs a [[breeding]] programme for rare turtles.","zh":"动物园有一个稀有龟类的繁育项目。"},{"en":"Spring is the [[breeding]] season for most birds.","zh":"春天是大多数鸟类的繁殖季节。"}],"ctx":"Pandas are also, quietly, a breeding bet."},{"id":40,"expr":"hover","zh":"徘徊；维持在某一水平上下","m":["hovers"],"note":"数字在某水平上下波动用 hover。Unemployment hovers around 5%。","core":"hover","forms":["hover","hovered","hovering","hovers"],"syn":[],"ex":[{"en":"Inflation [[hovers]] near 3%.","zh":"通胀率徘徊在 3% 上下。"},{"en":"The bird [[hovered]] above the water.","zh":"鸟在水面上悬停。"}],"ctx":"The population in the wild hovers near 1,800, and genetic diversity matters."},{"id":41,"expr":"broaden","zh":"拓宽；扩大","m":["broadens"],"note":"broaden one's horizons（开阔眼界），broaden the gene pool（拓宽基因库）。","core":"broaden","forms":["broaden","broadened","broadening","broadens"],"syn":[],"ex":[{"en":"Travel can [[broaden]] your horizons.","zh":"旅行能开阔眼界。"},{"en":"The road was [[broadened]] to four lanes.","zh":"马路被拓宽到了四车道。"}],"ctx":"Each foreign-born cub broadens the gene pool slightly, which conservationists welcome."},{"id":42,"expr":"statecraft","zh":"治国术；政治手腕","m":["statecraft"],"note":"state（国家）+ craft（手艺）= 治国的手艺。","core":"statecraft","forms":["statecraft"],"syn":[],"ex":[{"en":"The treaty was a triumph of [[statecraft]].","zh":"这条约是治国手腕的胜利。"},{"en":"He wrote a book on modern [[statecraft]].","zh":"他写了一本关于现代治国术的书。"}],"ctx":"Whether the strategy owes more to science or statecraft is debatable, but the bears do not seem to mind."},{"id":43,"expr":"debatable","zh":" const SLUG = 'panda-diplomacy';

function scheduleSave(){
  if (!ref) return;
  clearTimeout(saveTimer);
  setSaveNote('saving');

async function flush(){
  if (!ref) return;
  if (saving){ again = true; return; }
  const json = JSON.stringify(state);
  if (json === lastJSON){ setSaveNote('saved'); return; }
  saving = true;
  try { await ref.set(JSON.parse(json)); lastJSON = json; setSaveNote('saved'); }
  catch(e){ setSaveNote('local'); }
  saving = false;
  if (again){ again = false; scheduleSave(); }
}
function withTimeout(p, ms){
  return Promise.race([p, new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('timeout')); }, ms); })]);
}

async function initCloud(){
  let db = null, user = null;
  try {
    if (!window.claude || !window.claude.use){ setSaveNote('local'); return; }
    const r = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    db = r[0]; user = r[1];
  } catch(e){}
  if (!db || !user){ setSaveNote('local'); return; }
  let uid = null;
  try { uid = await user.id(); } catch(e){}
  if (!uid){ setSaveNote('local'); return; }
  let r;
  try { r = db.doc('data/users/' + uid + '/progress'); } catch(e){ setSaveNote('local'); return; }
  try {
    const snap = await withTimeout(r.get(), 10000);
    if (snap.exists){
      const remote = normalize(snap.data());
      if (touched){
        state = {v:1, vocab:Object.assign({}, remote.vocab, state.vocab), ans:Object.assign({}, remote.ans, state.ans), quiz:state.quiz || remote.quiz};
        lastJSON = '';
      } else {
        state = remote;
        lastJSON = JSON.stringify(state);
      }
      lsSet(LS_STATE, state);
      ref = r;
      renderAll();
      if (lastJSON === '') flush(); else setSaveNote('saved');
    } else {
      ref = r;
      lastJSON = '';
      if (hasContent(state)){ setSaveNote('saving'); flush(); } else setSaveNote('saved');
    }
  } catch(e){ setSaveNote('local'); }
}

/* ---------- vocabulary highlighting ---------- */
function marked(text, opt){
  opt = opt || {};
  if (!(opt.force || ui.hi)) return [document.createTextNode(text)];
  const out = [];
  let last = 0, m;
  TERM_RE.lastIndex = 0;
  while ((m = TERM_RE.exec(text))){
    const id = TERM_MAP[m[0].toLowerCase()];
    if (opt.only && opt.only !== id) continue;
    if (m.index > last) out.push(document.createTextNode(text.slice(last, m.index)));
    out.push(h('mark', {class:'vw' + (VMAP[id].mine ? ' uw' : ''), 'data-v':id, title:VMAP[id].zh}, m[0]));
    last = m.index + m[0].length;
  }
  if (last < text.length) out.push(document.createTextNode(text.slice(last)));
  return out;
}

  const total = DATA.vocab.length;
  let n = 0;
  DATA.vocab.forEach(function(v){ if (getS(v.id) === 'mastered') n++; });
  $('#mCount').textContent = n + ' / ' + total;
  $('#meter').style.setProperty('--p', (total ? n / total * 100 : 0) + '%');
}

function showTab(t){
  if (TABS.indexOf(t) < 0 || (t === 'listen' && !DATA.audio)) t = 'read';
  const changed = cur !== null && cur !== t;
  cur = t;
  $$('.view').forEach(function(v){ v.hidden = v.id !== 'view-' + t; });

    b.setAttribute('aria-selected', String(on));
  });
  if (t === 'quiz' && quiz.phase === 'start') renderQuiz();
  if (t === 'words' && changed) renderWords();
  if (changed) window.scrollTo(0, 0);
}

function noteCard(s){

      )

    s.rom ? h('p', {class:'rom'}, s.rom) : null,

/* the words highlighted in a sentence, each explained right here (tap to open) with a link to its full card */
function sentenceWords(s){
  const ids = [], seen = {};
  const re = new RegExp(TERM_RE.source, 'gi');
  let m;
  while ((m = re.exec(s.en))){
    const id = TERM_MAP[m[0].toLowerCase()];
    if (id !== undefined && !seen[id]){ seen[id] = true; ids.push(id); }
  }
  if (!ids.length) return null;
  return h('div', {class:'note-words'},
    h('p', {class:'note-wh'}, '本句标出的词（点开看讲解）'),
    ids.map(function(id){
      const v = VMAP[id], x = v.ex && v.ex[0];
      return h('details', {class:'nw'},
        h('summary', null, h('b', null, v.expr), '　', v.zh),
        h('div', {class:'nw-body'},
          v.note ? h('p', null, v.note) : null,
          x ? h('p', {class:'nw-ex'}, exPlain(x.en), '　', x.zh) : null,
          h('button', {type:'button', class:'btn sm', onclick:function(){ gotoWord(id); }}, '看完整词卡 →')
        )
      );
    })
  );
}

function selInfo(){
  const sel = window.getSelection();

  const r = sel.getRangeAt(0);
  function sentOf(n){ const el = n && (n.nodeType === 1 ? n : n.parentNode); return el && el.closest ? el.closest('#article .sent') : null; }
  const a = sentOf(r.startContainer), b = sentOf(r.endContainer);
  if (!a || a !== b) return null;
  const pre = document.createRange();
  pre.selectNodeContents(a); pre.setEnd(r.startContainer, r.startOffset);
  const i = Number(a.dataset.i), en = S[i].en;
  let o = pre.toString().length, t = r.toString();
  /* drop spaces and punctuation at both ends: "elves," -> "elves" */
  const lead = t.match(new RegExp('^[^' + LETTERS + '0-9]*', 'i'))[0].length;
  o += lead; t = t.slice(lead);
  t = t.replace(new RegExp('[^' + LETTERS + '0-9]+$', 'i'), '');
  if (!t || t.length > 80 || en.substr(o, t.length) !== t) return null;
  return {i:i, t:t, o:o};
}

  let t = $('.uw-toast');
  if (!t){ t = h('div', {class:'uw-toast', role:'status'}); document.body.append(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.hidden = true; }, 3200);
}

/* ---------- wiring ---------- */
/* ---------- speaker icons: words, example sentences, article sentences ---------- */
function speakBtn(key, text){ return clipBtn(DATA.clips, key, text); }
function stopNarrationForClip(){
  if (L && L.audio && !L.audio.paused) L.audio.pause();
  if (L) L.seg = null;
}
function sentBtn(en){
  if (!DATA.audio) return null;
  const i = S.findIndex(function(s){ return s.en === en; }) >= 0 ? S.findIndex(function(s){ return s.en === en; }) : S.findIndex(function(s){ return s.en.indexOf(en) >= 0; });
  if (i < 0) return null;
  const b = spkEl('播放这一句', function(){ playArticleSentence(i, b); });
  return b;
}
function playArticleSentence(i, btn){
  const a = getAudio();
  const T = DATA.audio.t[i];
  Clip.stop();
  const wasOn = L.seg && L.seg.btn === btn && !a.paused;
  endSeg();
  if (wasOn){ a.pause(); return; }
  L.seg = {end:T[1] + 0.15, btn:btn};
  btn.classList.add('on');
  const go = function(){ a.currentTime = Math.max(0, T[0] - 0.1); };
  if (a.readyState >= 1) go(); else a.addEventListener('loadedmetadata', go, {once:true});
  const pr = a.play();
  if (pr && pr.catch) pr.catch(function(){ endSeg(); });
}
function endSeg(){
  if (L.seg && L.seg.btn) L.seg.btn.classList.remove('on');
  L.seg = null;
}

/* ---------- listen tab ---------- */
const L = {audio:null, cur:-1, loop:false, loopIdx:-1, drag:false, el:{}, spans:[], raf:0, seg:null};
const RATES = [0.75, 0.9, 1, 1.15, 1.3];
function fmtT(t){ t = Math.max(0, Math.floor(t)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
function sentAt(t){
  const T = DATA.audio.t;
  let k = 0;
  for (let i = 0; i < T.length; i++){ if (T[i][0] <= t + 0.05) k = i; else break; }
  return k;
}
function getAudio(){
  if (L.audio) return L.audio;
  const a = new Audio();
  a.preload = 'auto';
  a.src = DATA.audio.src;
  a.playbackRate = ui.rate || 1;
  try { a.preservesPitch = true; a.webkitPreservesPitch = true; } catch(e){}
  a.addEventListener('timeupdate', listenUpdate);
  a.addEventListener('play', function(){ listenPlayState(); loopFrames(); });
  a.addEventListener('pause', function(){ listenPlayState(); if (L.seg && a.currentTime < L.seg.end) endSeg(); });
  a.addEventListener('ended', function(){ listenPlayState(); listenUpdate(); });
  a.addEventListener('error', function(){ L.el.msg.textContent = '音频没有加载出来，请检查网络后再点播放。'; L.el.msg.hidden = false; });
  a.addEventListener('playing', function(){ L.el.msg.hidden = true; });
  L.audio = a;
  try {
    if ('mediaSession' in navigator){
      navigator.mediaSession.metadata = new MediaMetadata({title:DATA.title, artist:{en:'外刊精读', ko:'韩语入门', ja:'日语中级'}[LANG]});
      navigator.mediaSession.setActionHandler('play', function(){ a.play(); });
      navigator.mediaSession.setActionHandler('pause', function(){ a.pause(); });
      navigator.mediaSession.setActionHandler('seekbackward', function(){ a.currentTime = Math.max(0, a.currentTime - 5); });
      navigator.mediaSession.setActionHandler('seekforward', function(){ a.currentTime = Math.min(DATA.audio.dur, a.currentTime + 5); });
    }
  } catch(e){}
  return a;
}
function listenPlayState(){
  const playing = !!(L.audio && !L.audio.paused && !L.audio.ended);
  L.el.play.textContent = playing ? '暂停' : '播放';
  L.el.play.setAttribute('aria-pressed', String(playing));
}
function loopFrames(){
  cancelAnimationFrame(L.raf);
  const tick = function(){
    if (!L.audio || L.audio.paused) return;
    listenUpdate();
    L.raf = requestAnimationFrame(tick);
  };
  L.raf = requestAnimationFrame(tick);
}
function listenUpdate(){
  const a = L.audio;
  if (!a) return;
  const T = DATA.audio.t;
  let t = a.currentTime;
  if (L.seg && !a.paused && t >= L.seg.end){ a.pause(); endSeg(); }
  if (L.loop && L.loopIdx >= 0 && !L.seg && !a.paused && t >= T[L.loopIdx][1] + 0.2){ a.currentTime = T[L.loopIdx][0]; t = a.currentTime; }
  if (!L.drag) L.el.range.value = String(t);
  L.el.now.textContent = fmtT(t);
  const k = sentAt(t);
  if (k !== L.cur){
    L.cur = k;
    markListenSentence(!a.paused);
  }
}
function markListenSentence(follow){
  L.spans.forEach(function(sp){ sp.classList.toggle('on', Number(sp.dataset.i) === L.cur); });
  if (follow && ui.tx){
    const sp = L.spans[L.cur];
    if (sp) sp.scrollIntoView({block:'nearest', behavior:REDUCE ? 'auto' : 'smooth'});
  }
}
function playSentence(i){
  endSeg();
  Clip.stop();
  const a = getAudio();
  a.currentTime = DATA.audio.t[i][0];
  if (L.loop) L.loopIdx = i;
  a.play().catch(function(){});
  listenUpdate();
}
function seekBy(d){
  endSeg();
  const a = getAudio();
  a.currentTime = Math.min(DATA.audio.dur, Math.max(0, a.currentTime + d));
  listenUpdate();
}
function setRate(r){
  ui.rate = r; lsSet(LS_UI, ui);
  if (L.audio) L.audio.playbackRate = r;
  $$('.rate-b', L.el.box).forEach(function(b){ const on = Number(b.dataset.r) === r; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
}
function applyTextVisibility(){
  L.el.tr.hidden = !ui.tx;
  L.el.off.hidden = !!ui.tx;
}
function renderListenText(){
  if (!L.el.tr) return;
  L.el.tr.replaceChildren();
  BLOCKS.forEach(function(b){
    const sec = h('section', {class:'blk blk-' + b.type});
    const el = h(b.type === 'title' ? 'h2' : 'p', {class:b.type === 'title' ? 'a-title' : b.type === 'sub' ? 'a-deck' : 'a-para'});
    b.idx.forEach(function(i, k){
      if (k > 0) el.append(' ');
      const sp = h('span', {class:'ls', 'data-i':i, tabindex:0, role:'button', 'aria-label':'从这一句开始播放'}, marked(S[i].en));
      sp.addEventListener('click', function(){ playSentence(i); });
      sp.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); playSentence(i); } });
      el.append(sp);
    });
    sec.append(el);
    L.el.tr.append(sec);
  });
  L.spans = $$('.ls', L.el.tr);
  markListenSentence(false);
}
function renderListen(){
  const box = $('#listenBox');
  if (!DATA.audio || !box || L.el.box) return;
  L.el.box = box;
  const A = DATA.audio;
  L.el.play = h('button', {type:'button', class:'btn pri big', 'aria-pressed':'false', onclick:function(){
    endSeg();
    Clip.stop();
    const a = getAudio();
    if (a.paused || a.ended){ if (a.ended) a.currentTime = 0; a.play().catch(function(){}); } else a.pause();
  }}, '播放');
  L.el.range = h('input', {type:'range', class:'lp-range', min:0, max:A.dur, step:0.1, value:0, 'aria-label':'播放进度'});
  L.el.range.addEventListener('pointerdown', function(){ L.drag = true; });
  L.el.range.addEventListener('input', function(){
    const a = getAudio();
    a.currentTime = Number(L.el.range.value);
    L.el.now.textContent = fmtT(a.currentTime);
    const k = sentAt(a.currentTime);
    if (k !== L.cur){ L.cur = k; markListenSentence(false); }
  });
  const endDrag = function(){ L.drag = false; };
  L.el.range.addEventListener('change', endDrag);
  L.el.range.addEventListener('pointerup', endDrag);
  L.el.range.addEventListener('pointercancel', endDrag);
  L.el.now = h('span', null, '0:00');
  L.el.msg = h('p', {class:'lp-msg', hidden:true, role:'alert'});
  const rates = h('div', {class:'chips', role:'group', 'aria-label':'播放速度'});
  RATES.forEach(function(r){
    rates.append(h('button', {type:'button', class:'chip rate-b', 'data-r':r, 'aria-pressed':'false', onclick:function(){ setRate(r); }}, r + '×'));
  });
  const loopCb = h('input', {type:'checkbox'});
  loopCb.addEventListener('change', function(){
    L.loop = loopCb.checked;
    L.loopIdx = L.loop ? (L.cur >= 0 ? L.cur : 0) : -1;
  });
  const txCb = h('input', {type:'checkbox'});
  txCb.checked = !!ui.tx;
  txCb.addEventListener('change', function(){ ui.tx = txCb.checked; lsSet(LS_UI, ui); applyTextVisibility(); });
  L.el.tr = h('div', {class:'tr'});
  L.el.off = h('p', {class:'tr-off'}, '原文已隐藏。先盲听一遍，听完再勾选“显示原文”对照。');
  box.append(
    h('div', {class:'card lp'},
      h('h2', {class:'h2'}, '听力'),
      h('p', {class:'lead'}, '整篇文章的朗读（AI 合成的' + (LANG !== 'en' ? XL : (DATA.audio.voice || '').charAt(0) === 'b' ? '英式' : '美式') + '发音，语速略慢）。先盲听，再对照原文；点原文里的任意一句，就从那一句开始播放。'),
      h('div', {class:'lp-row'},
        h('button', {type:'button', class:'btn', onclick:function(){ seekBy(-5); }}, '后退 5 秒'),
        L.el.play,
        h('button', {type:'button', class:'btn', onclick:function(){ seekBy(5); }}, '前进 5 秒')
      ),
      h('div', null, L.el.range, h('div', {class:'lp-time'}, L.el.now, h('span', null, fmtT(A.dur)))),
      h('div', null, h('p', {class:'meta'}, '播放速度'), h('div', {class:'row'}, rates)),
      h('div', {class:'lp-row'},
        h('label', {class:'lp-opt'}, loopCb, '单句循环（当前这一句反复听）'),
        h('label', {class:'lp-opt'}, txCb, '显示原文')
      ),
      L.el.msg
    ),
    L.el.off,
    L.el.tr
  );
  setRate(ui.rate || 1);
  renderListenText();
  applyTextVisibility();
}
function renderAll(){
  renderMast();
  renderArticle();
  renderListen();
  renderWords();
  renderThink();
  if (quiz.phase === 'start') renderQuiz();
}
function init(){
  Clip.onBeforePlay(stopNarrationForClip);
  window.addEventListener('pagehide', settle);
  document.addEventListener('visibilitychange', function(){ if (document.hidden) settle(); });
  if (LANG !== 'en'){
    const rl = h('label', null, h('input', {type:'checkbox', id:'optRom'}), LANG === 'ja' ? ' 显示读音' : LANG === 'yue' ? ' 显示粤拼' : ' 显示罗马音');
    $('#optZh').parentNode.after(rl);
    $('#optRom').checked = !!ui[ROMK];
    document.body.classList.toggle('show-rom', !!ui[ROMK]);
    $('#optRom').addEventListener('change', function(){ ui[ROMK] = this.checked; lsSet(LS_UI, ui); document.body.classList.toggle('show-rom', ui[ROMK]); });
    const tt = $('.tab[data-tab="think"]');
    if (tt) tt.textContent = LANG === 'ja' ? '语法' : '句型';
  }
  $('#optZh').checked = !!ui.zh;
  $('#optHi').checked = !!ui.hi;
  $('#optZh').addEventListener('change', function(){ ui.zh = this.checked; lsSet(LS_UI, ui); $('#article').classList.toggle('show-zh', ui.zh); });
  $('#optHi').addEventListener('change', function(){ ui.hi = this.checked; lsSet(LS_UI, ui); renderArticle(); renderListenText(); });
  const chips = $('#chips');
  ['all','new','learning','mastered'].forEach(function(f){
    chips.append(h('button', {type:'button', class:'chip', 'data-f':f, onclick:function(){ vFilter = f; renderWords(); }}, f));
  });
  document.addEventListener('selectionchange', function(){ clearTimeout(selTimer); selTimer = setTimeout(placeAddBtn, 180); });
  window.addEventListener('resize', hideAddBtn);
  $('#wordSearch').addEventListener('input', function(){ vQuery = this.value; renderWords(); });
  $$('.tab').forEach(function(b){
    b.addEventListener('click', function(){ try { location.hash = b.dataset.tab; } catch(e){} showTab(b.dataset.tab); });
  });
  window.addEventListener('hashchange', function(){ showTab(location.hash.replace('#','')); });
  if (DATA.audio) $('.tab[data-tab="listen"]').hidden = false;
  renderAll();
  showTab(location.hash.replace('#','') || 'read');
  initCloud();
}
init();
})();
</script>
