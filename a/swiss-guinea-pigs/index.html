const DATA = {"sents":[{"kind":"title","en":"Two's company: why Switzerland will not let a guinea pig live alone","zh":"两个才叫伴：为什么瑞士不让豚鼠独自生活","notes":["Two's company：来自俗语 two's company, three's a crowd（两人成伴，三人不欢），这里反过来强调“两个才够”。","guinea pig：豚鼠（荷兰猪）；也比喻“试验品”。"],"i":0,"p":0,"n":0,"label":"标题"},{"kind":"sub","en":"Swiss law treats loneliness as a form of cruelty, at least for certain small, furry creatures.","zh":"瑞士法律把孤独视为一种虐待，至少对某些毛茸茸的小动物是这样。","notes":["treat A as B：把 A 当作 B。","cruelty：残忍、虐待。","at least for ...：至少对……来说，补充限定范围。"],"i":1,"p":0,"n":0,"label":"副标题"},{"kind":"sub","en":"Owners have had to adjust, and at least one entrepreneur has spotted a gap in the market.","zh":"主人们不得不适应，而至少有一位创业者从中发现了商机。","notes":["have had to：不得不（现在完成时）。","entrepreneur：创业者、企业家。","a gap in the market：市场空白、商机。"],"i":2,"p":0,"n":0,"label":"副标题"},{"kind":"body","en":"Switzerland has a reputation for meticulous rules, and its animal-welfare laws are among the strictest anywhere.","zh":"瑞士以规定细致入微出名，它的动物福利法也是全世界最严格的之一。","notes":["have a reputation for：以……出名。","meticulous：一丝不苟的、极其细致的。","among the strictest anywhere：在任何地方都算最严格的之一。"],"p":1,"i":3,"n":1,"label":"第 1 句"},{"kind":"body","en":"Since 2008 they have obliged owners of sociable species, guinea pigs included, to keep them with at least one of their own kind.","zh":"自 2008 年起，这些法律要求群居动物（包括豚鼠）的主人，至少要让它们和一只同类住在一起。","notes":["oblige sb to do：要求、迫使某人做……（已学）。","sociable：爱交际的；（动物）群居的。","guinea pigs included：插入成分，“豚鼠也包括在内”。one's own kind：同类。"],"p":1,"i":4,"n":2,"label":"第 2 句"},{"kind":"body","en":"A solitary guinea pig, the thinking goes, is a forlorn one.","zh":"人们的想法是：一只孤零零的豚鼠，就是一只可怜兮兮的豚鼠。","notes":["solitary：独自的、孤零零的。","the thinking goes：插入语，“按照这种想法”（类似学过的 the logic goes）。","forlorn：孤苦伶仃的、可怜的。one 代替 guinea pig。"],"p":1,"i":5,"n":3,"label":"第 3 句"},{"kind":"body","en":"The animals squeak, groom each other and huddle together for warmth; deprived of company, they can become listless and withdrawn.","zh":"这些小动物会吱吱叫、互相梳理毛发、挤在一起取暖；一旦没了同伴，它们可能变得无精打采、孤僻退缩。","notes":["squeak：吱吱叫。groom：（动物）梳理毛发。","huddle together：挤成一团。","deprived of company：过去分词短语表示条件，“如果失去陪伴”。listless：无精打采的。withdrawn：孤僻的、不合群的。"],"p":1,"i":6,"n":4,"label":"第 4 句"},{"kind":"body","en":"The rule creates an awkward dilemma when one of a pair dies.","zh":"当一对豚鼠中有一只死去时，这条规定就带来了一个尴尬的两难局面。","notes":["dilemma：两难的处境。","one of a pair：一对中的一只。"],"p":2,"i":7,"n":5,"label":"第 5 句"},{"kind":"body","en":"Buying a replacement solves the immediate problem but starts the cycle again, since the newcomer will probably outlive its elderly companion.","zh":"再买一只能解决眼前的问题，但又会让循环重新开始，因为新来的那只很可能比年老的同伴活得更久。","notes":["Buying a replacement：动名词短语作主语。","the immediate problem：眼前的问题。","outlive：比……活得长。companion：同伴。"],"p":2,"i":8,"n":6,"label":"第 6 句"},{"kind":"body","en":"Owners can end up trapped in an endless chain of guinea pigs, each new purchase prolonging the obligation by several years.","zh":"主人们可能陷入一条没完没了的“豚鼠链”，每买一只新的，就让这份责任又延长好几年。","notes":["end up trapped in：最后被困在……（end up 已学）。","each new purchase prolonging ...：独立主格结构，补充说明结果。","prolong：延长。obligation：义务、责任。"],"p":2,"i":9,"n":7,"label":"第 7 句"},{"kind":"body","en":"Some resort to scouring online adverts for an elderly animal that needs a home.","zh":"有人不得不在网上广告里四处搜寻，想找一只需要人收养的老年豚鼠。","notes":["resort to doing：不得已采取……。","scour ... for ...：彻底搜寻……以找到……。","advert：（英式）广告，= advertisement。"],"p":2,"i":10,"n":8,"label":"第 8 句"},{"kind":"body","en":"Into this niche stepped a breeder who began renting out guinea pigs.","zh":"就在这个缝隙里，一位饲养者站了出来，开始出租豚鼠。","notes":["Into this niche stepped a breeder：地点状语提前，主谓倒装（见语法点）。","niche：（市场的）空白、小众领域。","breeder：饲养者、育种人。rent out：出租。"],"p":3,"i":11,"n":9,"label":"第 9 句"},{"kind":"body","en":"A bereaved animal can be paired with a hired companion of a suitable age; when it eventually dies, the lodger goes back and is put up for hire again.","zh":"失去伴侣的豚鼠可以配上一只年龄合适的“租来的伙伴”；等它最终离世，这位“房客”就被送回去，再次出租。","notes":["bereaved：丧失亲人的。","be paired with：和……配成一对。hired：租来的。","lodger：房客、寄宿者。put up for hire：拿出来出租。"],"p":3,"i":12,"n":10,"label":"第 10 句"},{"kind":"body","en":"The arrangement sounds faintly comic, yet it addresses a genuine welfare problem.","zh":"这种安排听上去有点滑稽，但它确实解决了一个真实存在的动物福利问题。","notes":["faintly：有点儿、略微。","address a problem：处理、解决问题。","genuine：真正的。"],"p":3,"i":13,"n":11,"label":"第 11 句"},{"kind":"body","en":"Guinea pigs are not the only beneficiaries of Swiss solicitude.","zh":"享受到瑞士这份关怀的，不只有豚鼠。","notes":["beneficiary：受益者。","solicitude：（正式）关切、关怀。"],"p":4,"i":14,"n":12,"label":"第 12 句"},{"kind":"body","en":"Budgerigars and other flock birds are likewise entitled to company of their own species.","zh":"虎皮鹦鹉和其他群居鸟类，同样有权拥有同类的陪伴。","notes":["budgerigar：虎皮鹦鹉，口语叫 budgie。","flock：（鸟、羊）群。likewise：同样地。","be entitled to：有权享有（entitle 已学）。"],"p":4,"i":15,"n":13,"label":"第 13 句"},{"kind":"body","en":"In 2018 the government banned the practice of plunging live lobsters into boiling water; they must now be stunned first.","zh":"2018 年，政府禁止把活龙虾直接扔进沸水；现在必须先把它们弄晕。","notes":["ban the practice of doing：禁止……的做法。","plunge ... into ...：把……猛地投入……。","stun：使昏迷、打晕。"],"p":4,"i":16,"n":14,"label":"第 14 句"},{"kind":"body","en":"For several years, new dog owners even had to sit a short course before bringing a puppy home, though that requirement has since been scrapped.","zh":"有好几年，新养狗的人甚至要先上一门短期课程，才能把小狗带回家，不过这项要求后来取消了。","notes":["sit a course / an exam：参加课程、考试（英式）。","though ...：不过……，补充转折。","has since been scrapped：后来被取消了（scrap 已学）。"],"p":4,"i":17,"n":15,"label":"第 15 句"},{"kind":"body","en":"Critics deride all this as the nanny state run amok.","zh":"批评者嘲笑这一切是“保姆式国家”管过了头。","notes":["deride A as B：嘲笑 A 是 B。","the nanny state：保姆式国家，指政府管得太多（已学）。","run amok：失控、乱来；这里 run 是过去分词，修饰 nanny state。"],"p":5,"i":18,"n":16,"label":"第 16 句"},{"kind":"body","en":"Why, they ask, should bureaucrats dictate how many rodents a family keeps?","zh":"他们质问：凭什么要官僚来规定一家人养几只啮齿动物？","notes":["they ask 是插入语。","bureaucrat：官僚、政府官员。","dictate：规定、命令。rodent：啮齿动物（老鼠、豚鼠等）。"],"p":5,"i":19,"n":17,"label":"第 17 句"},{"kind":"body","en":"Defenders counter that a pet is not a toy, and that an animal cannot lodge a complaint about its own living conditions.","zh":"支持者反驳说，宠物不是玩具，而且动物也没办法为自己的生活条件提出投诉。","notes":["counter that ...：反驳说……。","两个 that 从句并列，都是 counter 的宾语。","lodge a complaint：正式提出投诉。"],"p":5,"i":20,"n":18,"label":"第 18 句"},{"kind":"body","en":"Most Swiss seem untroubled either way.","zh":"不管怎样，大多数瑞士人似乎都不太在意。","notes":["untroubled：不受困扰的、无所谓的。","either way：不管怎样（已学）。"],"p":5,"i":21,"n":19,"label":"第 19 句"},{"kind":"body","en":"In a country that prizes privacy and quiet, it seems fitting that even its smallest residents are guaranteed a friend.","zh":"在一个珍视隐私和安静的国家，就连最小的居民也被保证有一个朋友，这似乎也挺合适。","notes":["prize 作动词：珍视。","it seems fitting that ...：……似乎很恰当，it 是形式主语。","resident：居民，这里俏皮地指豚鼠。"],"p":5,"i":22,"n":20,"label":"第 20 句"}],"vocab":[{"id":1,"expr":"two's company","zh":"两个才叫伴（俗语）","m":["Two's company"],"note":"完整俗语是 two's company, three's a crowd：两个人在一起正好，第三个人就多余了（常指情侣不想有电灯泡）。","core":"two's company","forms":["two's company"],"syn":[],"ex":[{"en":"I'll leave you two alone; [[two's company]], three's a crowd.","zh":"我就不打扰你们俩了，两人成伴，三人不欢嘛。"},{"en":"They never invite anyone else; [[two's company]] for them.","zh":"他们从不叫别人，两个人就够了。"}],"def":"a saying meaning that two people are happy together and a third person is not wanted","ipa":"/tuːz ˈkʌmpənɪ/","ctx":"Two's company: why Switzerland will not let a guinea pig live alone"},{"id":46,"expr":"guinea pig","zh":"豚鼠（荷兰猪）；试验品","m":["guinea pig","guinea pigs"],"note":"一种小型宠物鼠，中文也叫荷兰猪。也常比喻“试验品、被拿来做实验的人”：be a guinea pig / use sb as guinea pigs。注意 guinea 读 /ˈɡɪnɪ/，像“gi-ni”。","core":"guinea pig","forms":["guinea pig","guinea pigs"],"syn":[],"ex":[{"en":"My daughter wants a [[guinea pig]] for her birthday.","zh":"我女儿生日想要一只豚鼠。"},{"en":"I don't want to be a [[guinea pig]] for a new drug.","zh":"我可不想当新药的试验品。"},{"en":"The students were used as [[guinea pigs]] for the new teaching method.","zh":"这些学生被拿来当新教学法的试验品。"}],"def":"a small furry animal with no tail, often kept as a pet; also, a person used in a test or experiment","cf":[{"rel":"cf","w":"hamster","zh":"仓鼠","diff":"guinea pig 是豚鼠，体型较大、没有尾巴、爱群居；hamster 是仓鼠，体型小、常独居。","ex":[{"en":"Our [[hamster]] runs on its wheel all night.","zh":"我们家的仓鼠整晚都在跑轮上跑。"}]}],"ipa":"/ˈɡɪnɪ pɪɡ/","ctx":"Two's company: why Switzerland will not let a guinea pig live alone"},{"id":4,"expr":"spot a gap in the market","zh":"发现商机、发现市场空白","m":["spotted a gap in the market"],"note":"spot = 发现、看出（尤其是别人没注意到的东西）。a gap in the market：市场上还没人提供的东西，也就是商机。也可以说 see / find a gap in the market。","core":"spot a gap in the market","forms":["spot a gap in the market","spots a gap in the market","spotted a gap in the market","spotting a gap in the market"],"syn":[],"ex":[{"en":"He [[spotted a gap in the market]] for cheap healthy lunches.","zh":"他发现便宜健康的午餐是个市场空白。"},{"en":"Good entrepreneurs are quick at [[spotting a gap in the market]].","zh":"好的创业者很快就能发现商机。"}],"def":"to notice a chance to sell a product or service that nobody else is offering","ipa":"/spɒt ə ɡæp ɪnðə ˈmɑːkɪt/","ctx":"Owners have had to adjust, and at least one entrepreneur has spotted a gap in the market."},{"id":5,"expr":"meticulous","zh":"一丝不苟的、极其细致的","m":["meticulous"],"note":"非常注意细节、很仔细：meticulous planning（周密的计划）。副词 meticulously。","core":"meticulous","forms":["meticulous"],"syn":[],"ex":[{"en":"She keeps [[meticulous]] records of her spending.","zh":"她把每笔开销都记得清清楚楚。"},{"en":"The plan was prepared with [[meticulous]] care.","zh":"这份计划准备得一丝不苟。"}],"def":"very careful about every small detail","cf":[{"rel":"ant","w":"careless","zh":"粗心的","diff":"meticulous 是连小细节都极其仔细；careless 是粗心大意、不小心。","ex":[{"en":"It was a [[careless]] mistake.","zh":"这是个粗心造成的错误。"}]}],"ipa":"/məˈtɪkjʊləs/","ctx":"Switzerland has a reputation for meticulous rules, and its animal-welfare laws are among the strictest anywhere."},{"id":6,"expr":"animal welfare","zh":"动物福利","m":["animal-welfare"],"note":"welfare 是“福利、健康幸福”。animal welfare 指让动物不受虐待、生活得好。作定语时常加连字符：animal-welfare laws。","core":"animal welfare","forms":["animal welfare","animal-welfare"],"syn":[],"ex":[{"en":"She works for an [[animal welfare]] charity.","zh":"她在一家动物福利慈善机构工作。"},{"en":"The zoo was criticised over [[animal welfare]].","zh":"这家动物园因为动物福利问题受到批评。"}],"def":"the health and happiness of animals, and the rules that protect them","ipa":"/ˈænɪməl ˈwelfeə/","ctx":"Switzerland has a reputation for meticulous rules, and its animal-welfare laws are among the strictest anywhere."},{"id":7,"expr":"one's own kind","zh":"同类","m":["their own kind"],"note":"of one's own kind：和自己同一类的（人或动物）。","core":"one's own kind","forms":["one's own kind","their own kind","its own kind","our own kind","his own kind","her own kind"],"syn":[],"ex":[{"en":"Cats usually prefer [[their own kind]].","zh":"猫通常更喜欢和同类在一起。"},{"en":"He only feels comfortable among [[his own kind]].","zh":"他只有在同类人中间才自在。"}],"def":"people or animals of the same type as yourself","ipa":"/wɒnz əʊn kaɪnd/","ctx":"Since 2008 they have obliged owners of sociable species, guinea pigs included, to keep them with at least one of their own kind."},{"id":8,"expr":"solitary","zh":"独自的、孤零零的","m":["solitary"],"note":"强调“单独一个”，不一定难过：a solitary walk（独自散步）、solitary animals（独居动物）。","core":"solitary","forms":["solitary"],"syn":[],"ex":[{"en":"Tigers are [[solitary]] animals.","zh":"老虎是独居动物。"},{"en":"He enjoys long, [[solitary]] walks.","zh":"他喜欢独自长时间散步。"}],"def":"alone, without other people or animals; done alone","cf":[{"rel":"syn","w":"lonely","zh":"孤独的","diff":"solitary 只是客观地说“独自一个”；lonely 强调心里觉得孤单、难过。","ex":[{"en":"She felt [[lonely]] in the new city.","zh":"她在新城市觉得很孤单。"}]}],"ipa":"/ˈsɒlɪtərɪ/","ctx":"A solitary guinea pig, the thinking goes, is a forlorn one."},{"id":9,"expr":"forlorn","zh":"孤苦伶仃的、可怜的","m":["forlorn"],"note":"看起来又孤单又难过：a forlorn figure（孤零零的身影）。也指希望渺茫：a forlorn hope。","core":"forlorn","forms":["forlorn"],"syn":[],"ex":[{"en":"A [[forlorn]] dog waited outside the shop.","zh":"一只可怜的狗在店外等着。"},{"en":"He looked [[forlorn]] after his friends left.","zh":"朋友们走后，他看上去孤零零的。"}],"def":"lonely and unhappy; looking sad and left alone","ipa":"/ˈfɔːlɔːn/","ctx":"A solitary guinea pig, the thinking goes, is a forlorn one."},{"id":10,"expr":"squeak","zh":"吱吱叫；发出吱吱声","m":["squeak"],"note":"老鼠、豚鼠的叫声，或门、鞋发出的尖细声音：The door squeaks.（门吱吱响。）","core":"squeak","forms":["squeak","squeaks","squeaked","squeaking"],"syn":[],"ex":[{"en":"The mouse [[squeaked]] and ran away.","zh":"老鼠吱地一声跑了。"},{"en":"My new shoes [[squeak]] when I walk.","zh":"我的新鞋走路时吱吱响。"}],"def":"to make a short, high sound","ipa":"/skwiːk/","ctx":"The animals squeak, groom each other and huddle together for warmth; deprived of company, they can become listless and withdrawn."},{"id":12,"expr":"huddle","zh":"挤成一团、蜷缩","m":["huddle"],"note":"huddle together / huddle around：因为冷或害怕挤在一起。","core":"huddle","forms":["huddle","huddles","huddled","huddling"],"syn":[],"ex":[{"en":"We [[huddled]] around the fire to keep warm.","zh":"我们围着火挤在一起取暖。"},{"en":"The penguins [[huddle]] together in winter.","zh":"企鹅冬天挤在一起。"}],"def":"to move close together in a group, often because of cold or fear","cf":[{"rel":"cf","w":"cuddle","zh":"拥抱、搂抱","diff":"cuddle 是两个人亲密地搂抱（表达爱）；huddle 是一群人或动物挤在一起，多因为冷或害怕。","ex":[{"en":"She [[cuddled]] her baby.","zh":"她搂着宝宝。"}]}],"ipa":"/ˈhʌdəl/","ctx":"The animals squeak, groom each other and huddle together for warmth; deprived of company, they can become listless and withdrawn."},{"id":13,"expr":"listless","zh":"无精打采的","m":["listless"],"note":"没精神、对什么都提不起兴趣，常因为生病、天热或难过。","core":"listless","forms":["listless"],"syn":[],"ex":[{"en":"The heat made everyone feel [[listless]].","zh":"炎热让大家都没精打采的。"},{"en":"The sick puppy lay [[listless]] in its basket.","zh":"生病的小狗无精打采地躺在篮子里。"}],"def":"having no energy or interest in anything","cf":[{"rel":"cf","w":"restless","zh":"坐立不安的","diff":"listless 是没精神、懒得动；restless 正相反，是静不下来、坐立不安。","ex":[{"en":"The children grew [[restless]] on the long journey.","zh":"长途旅行中孩子们开始坐不住了。"}]}],"ipa":"/ˈlɪstləs/","ctx":"The animals squeak, groom each other and huddle together for warmth; deprived of company, they can become listless and withdrawn."},{"id":14,"expr":"withdrawn","zh":"孤僻的、不爱说话的","m":["withdrawn"],"note":"形容人或动物变得安静、不和人交往。注意 withdraw 是“取（钱）、撤回”（已学），withdrawn 作形容词是“孤僻的”。","core":"withdrawn","forms":["withdrawn"],"syn":[],"ex":[{"en":"After the accident he became very [[withdrawn]].","zh":"出事后，他变得很孤僻。"},{"en":"She's a shy, [[withdrawn]] child.","zh":"她是个害羞、不爱说话的孩子。"}],"def":"quiet and not wanting to talk to or be with others","ipa":"/wɪθˈdrɔːn/","ctx":"The animals squeak, groom each other and huddle together for warmth; deprived of company, they can become listless and withdrawn."},{"id":16,"expr":"outlive","zh":"比……活得长","m":["outlive"],"note":"out- 表示“超过”：outlive sb（比某人活得久）。类似 outrun（跑得比……快，已学）。","core":"outlive","forms":["outlive","outlives","outlived"],"syn":[],"ex":[{"en":"She [[outlived]] her husband by twenty years.","zh":"她比丈夫多活了二十年。"},{"en":"Parrots can [[outlive]] their owners.","zh":"鹦鹉可能比主人活得还久。"}],"def":"to live longer than someone or something","ipa":"/aʊtˈlɪv/","ctx":"Buying a replacement solves the immediate problem but starts the cycle again, since the newcomer will probably outlive its elderly companion."},{"id":17,"expr":"prolong","zh":"延长","m":["prolonging"],"note":"让时间、过程变得更长：prolong your life（延长寿命）。形容词 prolonged（长时间的）。","core":"prolong","forms":["prolong","prolongs","prolonged","prolonging"],"syn":[],"ex":[{"en":"Exercise can help [[prolong]] your life.","zh":"锻炼有助于延长寿命。"},{"en":"They [[prolonged]] their holiday by a week.","zh":"他们把假期延长了一周。"}],"def":"to make something last longer","cf":[{"rel":"syn","w":"extend","zh":"延长、扩展","diff":"extend 很常用，可以延长时间，也可以扩大范围（extend the road）；prolong 只用于时间，常带“拖长”的意味。","ex":[{"en":"Can I [[extend]] my visa?","zh":"我可以延长签证吗？"}]}],"ipa":"/prəˈlɒŋ/","ctx":"Owners can end up trapped in an endless chain of guinea pigs, each new purchase prolonging the obligation by several years."},{"id":18,"expr":"obligation","zh":"义务、责任","m":["obligation"],"note":"因为法律、承诺或道德必须做的事：feel an obligation to help（觉得有义务帮忙）。动词 oblige（已学）。","core":"obligation","forms":["obligation","obligations"],"syn":[],"ex":[{"en":"You are under no [[obligation]] to buy anything.","zh":"您没有义务买任何东西。"},{"en":"Parents have an [[obligation]] to look after their children.","zh":"父母有义务照顾孩子。"}],"def":"something that you must do because of a law, a promise or a duty","ipa":"/ˌɒblɪˈɡeɪʃən/","ctx":"Owners can end up trapped in an endless chain of guinea pigs, each new purchase prolonging the obligation by several years."},{"id":19,"expr":"resort to","zh":"不得已采取、诉诸","m":["resort to"],"note":"resort to + 名词 / doing：没别的办法时才用某种手段：resort to violence（诉诸暴力）。","core":"resort to","forms":["resort to","resorts to","resorted to","resorting to"],"syn":[],"ex":[{"en":"In the end, they [[resorted to]] selling the car.","zh":"最后他们不得已卖了车。"},{"en":"I hope we won't have to [[resort to]] legal action.","zh":"希望我们不必诉诸法律。"}],"def":"to do something you would rather not do, because there is no other way","ipa":"/rɪˈzɔːt tuː/","ctx":"Some resort to scouring online adverts for an elderly animal that needs a home."},{"id":20,"expr":"scour","zh":"彻底搜寻；擦洗","m":["scouring"],"note":"scour sth for sth：为了找某物把某地仔细搜个遍：scour the internet for deals（满网找便宜）。本义是用力擦洗。","core":"scour","forms":["scour","scours","scoured","scouring"],"syn":[],"ex":[{"en":"Police [[scoured]] the woods for the missing boy.","zh":"警察把树林搜了个遍，寻找失踪的男孩。"},{"en":"I [[scoured]] the shops for a present.","zh":"我跑遍了商店找礼物。"}],"def":"to search a place or thing very carefully","cf":[{"rel":"syn","w":"search","zh":"搜寻","diff":"search 是普通的“找”；scour 更强调把每个角落都翻遍，彻底、费力。","ex":[{"en":"I [[searched]] my bag for the keys.","zh":"我在包里找钥匙。"}]}],"ipa":"/skaʊə/","ctx":"Some resort to scouring online adverts for an elderly animal that needs a home."},{"id":21,"expr":"niche","zh":"（市场的）空白、小众领域；合适的位置","m":["niche"],"note":"英式读 /niːʃ/，美式也读 /nɪtʃ/。a niche market（小众市场）、find your niche（找到适合自己的位置）。","core":"niche","forms":["niche","niches"],"syn":[],"ex":[{"en":"The shop serves a [[niche]] market of vinyl collectors.","zh":"这家店服务黑胶唱片收藏者这个小众市场。"},{"en":"She finally found her [[niche]] as a teacher.","zh":"她终于找到了适合自己的位置：当老师。"}],"def":"a small area of business that few others are serving; a place or job that suits you","ipa":"/niːʃ/","ctx":"Into this niche stepped a breeder who began renting out guinea pigs."},{"id":22,"expr":"breeder","zh":"饲养者、育种人","m":["breeder"],"note":"专门繁殖、培育动物或植物的人：a dog breeder。动词 breed（繁殖、饲养）。","core":"breeder","forms":["breeder","breeders"],"syn":[],"ex":[{"en":"We bought our puppy from a local [[breeder]].","zh":"我们从本地一位饲养者那里买了小狗。"},{"en":"Horse [[breeders]] travel to the show every year.","zh":"养马人每年都来参加这个展会。"}],"def":"a person who keeps animals or plants in order to produce young ones","ipa":"/ˈbriːdə/","ctx":"Into this niche stepped a breeder who began renting out guinea pigs."},{"id":23,"expr":"地点状语 + 动词 + 主语（倒装）","zh":"地点或方向状语提前，主谓倒装","m":["Into this niche stepped"],"note":"表示地点、方向的短语放在句首时，可以把动词放在主语前面，让描述更生动：Into the room walked a tall man.（走进屋来的是一个高个子男人。）常用动词：come, go, stand, sit, walk, lie 等，主语通常是名词而不是代词。","core":"into","forms":["Into","into"],"syn":[],"ex":[{"en":"[[Into]] the room walked a tall stranger.","zh":"走进房间的是一个高个子陌生人。"},{"en":"[[Into]] the garden ran three excited children.","zh":"跑进花园的是三个兴奋的孩子。"}],"kind":"grammar","conn":"地点 / 方向状语 + 不及物动词 + 名词主语（主语是代词时不倒装）","say":"Into this niche stepped a breeder","pick":[{"q":"Under the tree ___.","opts":["sat an old man","an old man did sit"],"a":0,"why":"地点状语 Under the tree 放句首，直接把动词 sat 提到主语前。"},{"q":"Out of the box ___.","opts":["jumped a cat","jumped it"],"a":0,"why":"主语是代词时不倒装（应说 Out it jumped），所以选名词主语 a cat。"}],"ctx":"Into this niche stepped a breeder who began renting out guinea pigs."},{"id":24,"expr":"bereaved","zh":"丧失亲人的","m":["bereaved"],"note":"失去家人或亲近的人：bereaved families（失去亲人的家庭）。the bereaved 指“死者家属”。","core":"bereaved","forms":["bereaved"],"syn":[],"ex":[{"en":"The charity supports [[bereaved]] children.","zh":"这家慈善机构帮助失去亲人的孩子。"},{"en":"Our thoughts are with the [[bereaved]].","zh":"我们的心与死者家属同在。"}],"def":"having recently lost a close relative or friend through death","ipa":"/bɪˈriːvd/","ctx":"A bereaved animal can be paired with a hired companion of a suitable age; when it eventually dies, the lodger goes back and is put up for hire again."},{"id":25,"expr":"pair with","zh":"使配成对","m":["paired with"],"note":"be paired with：和……配成一对、搭配。也可以说菜和酒的搭配：fish paired with white wine。","core":"pair with","forms":["pair with","paired with","pairs with","pairing with"],"syn":[],"ex":[{"en":"Each new student is [[paired with]] an older one.","zh":"每个新生都会和一个高年级学生结对。"},{"en":"This cheese [[pairs with]] red wine.","zh":"这种奶酪配红酒。"}],"def":"to put two people or things together as a pair","ipa":"/peə wɪð/","ctx":"A bereaved animal can be paired with a hired companion of a suitable age; when it eventually dies, the lodger goes back and is put up for hire again."},{"id":26,"expr":"lodger","zh":"房客、寄宿者","m":["lodger"],"note":"住在房东家里、付房租的人（常和房东同住）。动词 lodge（寄宿）。","core":"lodger","forms":["lodger","lodgers"],"syn":[],"ex":[{"en":"They took in a [[lodger]] to help pay the rent.","zh":"他们招了个房客来分担房租。"},{"en":"The [[lodger]] keeps to himself.","zh":"那个房客不太和人来往。"}],"def":"a person who pays to live in a room in someone else's house","cf":[{"rel":"syn","w":"tenant","zh":"租户","diff":"tenant 是租整套房子或店面的租户；lodger 通常是住在房东家里、租一个房间的人。","ex":[{"en":"The [[tenants]] complained about the heating.","zh":"租户们抱怨暖气的问题。"}]}],"ipa":"/ˈlɒdʒə/","ctx":"A bereaved animal can be paired with a hired companion of a suitable age; when it eventually dies, the lodger goes back and is put up for hire again."},{"id":27,"expr":"put up for","zh":"拿出来（出售、出租等）","m":["put up for hire"],"note":"put sth up for sale / for hire / for adoption：拿出来卖 / 出租 / 供人领养。","core":"put up for","forms":["put up for","put up for hire","put up for sale","puts up for","putting up for"],"syn":[],"ex":[{"en":"Their house was [[put up for sale]] last week.","zh":"他们的房子上周挂出来卖了。"},{"en":"The puppies were [[put up for]] adoption.","zh":"这些小狗被送出来供人领养。"}],"def":"to offer something to be sold, rented or adopted","ipa":"/pʊt ʌp fɔː/","ctx":"A bereaved animal can be paired with a hired companion of a suitable age; when it eventually dies, the lodger goes back and is put up for hire again."},{"id":28,"expr":"faintly","zh":"略微、有点儿","m":["faintly"],"note":"faint 是“微弱的”：faintly amused（有点被逗乐）、faintly ridiculous（有点可笑）。","core":"faintly","forms":["faintly"],"syn":[],"ex":[{"en":"The room smelled [[faintly]] of smoke.","zh":"房间里有一点烟味。"},{"en":"He looked [[faintly]] embarrassed.","zh":"他看上去有点尴尬。"}],"def":"slightly; not very strongly","ipa":"/ˈfeɪntlɪ/","ctx":"The arrangement sounds faintly comic, yet it addresses a genuine welfare problem."},{"id":29,"expr":"address","zh":"处理、解决（问题）","m":["addresses"],"note":"作动词：address a problem / an issue（着手解决问题）。名词“地址”大家都熟，这个动词义更正式。","core":"address","forms":["address","addresses","addressed","addressing"],"syn":[],"ex":[{"en":"The government must [[address]] the housing shortage.","zh":"政府必须解决住房短缺问题。"},{"en":"We need to [[address]] these complaints quickly.","zh":"我们需要尽快处理这些投诉。"}],"def":"to think about a problem and start trying to deal with it","ipa":"/əˈdres/","ctx":"The arrangement sounds faintly comic, yet it addresses a genuine welfare problem."},{"id":30,"expr":"beneficiary","zh":"受益者","m":["beneficiaries"],"note":"从某事中得到好处的人：the main beneficiaries of the new law（新法的主要受益者）。也指遗嘱的受益人。","core":"beneficiary","forms":["beneficiary","beneficiaries"],"syn":[],"ex":[{"en":"Small shops were the biggest [[beneficiaries]] of the tax cut.","zh":"减税最大的受益者是小商店。"},{"en":"She named her niece as the [[beneficiary]] of her will.","zh":"她在遗嘱里指定侄女为受益人。"}],"def":"a person who gets an advantage from something","cf":[{"rel":"cf","w":"benefactor","zh":"捐助人、恩人","diff":"形近词：benefactor 是给钱、给帮助的人；beneficiary 是得到好处的人，正好相反。","ex":[{"en":"A wealthy [[benefactor]] paid for the new library.","zh":"一位富有的捐助人出钱建了新图书馆。"}]}],"ipa":"/ˌbenɪˈfɪʃərɪ/","ctx":"Guinea pigs are not the only beneficiaries of Swiss solicitude."},{"id":31,"expr":"solicitude","zh":"关切、关怀（正式）","m":["solicitude"],"note":"对别人（或动物）的关心和照顾，带点郑重的味道，很书面。","core":"solicitude","forms":["solicitude"],"syn":[],"ex":[{"en":"She thanked the nurses for their [[solicitude]].","zh":"她感谢护士们的悉心照顾。"},{"en":"His [[solicitude]] for his elderly mother was touching.","zh":"他对年迈母亲的关怀令人感动。"}],"def":"anxious care and concern for someone","ipa":"/səˈlɪsɪˌtjuːd/","ctx":"Guinea pigs are not the only beneficiaries of Swiss solicitude."},{"id":32,"expr":"flock","zh":"（鸟、羊）群；成群结队","m":["flock"],"note":"名词：a flock of sheep / birds。动词：People flocked to the beach.（人们成群涌向海滩。）","core":"flock","forms":["flock","flocks","flocked"],"syn":[],"ex":[{"en":"A [[flock]] of geese flew over the lake.","zh":"一群大雁飞过湖面。"},{"en":"Tourists [[flock]] to the city every summer.","zh":"每年夏天游客都蜂拥而至。"}],"def":"a group of birds or sheep; to go somewhere in large numbers","ipa":"/flɒk/","ctx":"Budgerigars and other flock birds are likewise entitled to company of their own species."},{"id":33,"expr":"plunge","zh":"（使）猛地投入、跳进","m":["plunging"],"note":"plunge sth into sth：把……猛地扔进去。也指价格“暴跌”：Prices plunged.","core":"plunge","forms":["plunge","plunges","plunged","plunging"],"syn":[],"ex":[{"en":"She [[plunged]] her hands into the cold water.","zh":"她把双手猛地浸进冷水里。"},{"en":"Share prices [[plunged]] overnight.","zh":"股价一夜之间暴跌。"}],"def":"to push or throw something suddenly into something; to fall suddenly","ipa":"/plʌndʒ/","ctx":"In 2018 the government banned the practice of plunging live lobsters into boiling water; they must now be stunned first."},{"id":34,"expr":"stun","zh":"使昏迷；使震惊","m":["stunned"],"note":"本义是“打晕”；常用来表示“让人震惊”：We were stunned by the news.。形容词 stunning 是“极美的”。","core":"stun","forms":["stun","stuns","stunned","stunning"],"syn":[],"ex":[{"en":"The bird was [[stunned]] when it flew into the window.","zh":"那只鸟撞上窗户，被撞晕了。"},{"en":"Everyone was [[stunned]] by the result.","zh": async function flush(){
  if (!ref) return;
  if (saving){ again = true; return; }

  saving = true;
  try { await ref.set(JSON.parse(json)); lastJSON = json; setSaveNote('saved'); }

    db = r[0]; user = r[1];

  let uid = null;

  if (!uid){ setSaveNote('local'); return; }
  let r;
  try { r = db.doc('data/users/' + uid + '/progress'); } catch(e){ setSaveNote('local'); return; }
  try {
    const snap = await withTimeout(r.get(), 10000);
    if (snap.exists){
      const remote = normalize(snap.data());
      if (touched){
        state = {v:1, vocab:Object.assign({}, remote.vocab, state.vocab), ans:Object.assign({}, remote.ans, state.ans), quiz:state.quiz || remote.quiz};
        lastJSON = '';

        lastJSON = JSON.stringify(state);

      lsSet(LS_STATE, state);
      ref = r;
      renderAll();
      if (lastJSON === '') flush(); else setSaveNote('saved');
    } else {
      ref = r;
      lastJSON = '';
      if (hasContent(state)){ setSaveNote('saving'); flush(); } else setSaveNote('saved');
    }
  } catch(e){ setSaveNote('local'); }
}

/* ---------- vocabulary highlighting ---------- */
function marked(text, opt){
  opt = opt || {};
  if (!(opt.force || ui.hi)) return rubyNodes(text);
  const out = [];
  let last = 0, m;
  TERM_RE.lastIndex = 0;
  while ((m = TERM_RE.exec(text))){
    const id = TERM_MAP[m[0].toLowerCase()];
    if (opt.only && opt.only !== id) continue;
    if (m.index > last) out.push.apply(out, rubyNodes(text.slice(last, m.index)));
    out.push(h('mark', {class:'vw' + (VMAP[id].mine ? ' uw' : ''), 'data-v':id, title:VMAP[id].zh}, rubyNodes(m[0])));
    last = m.index + m[0].length;
  }
  if (last < text.length) out.push.apply(out, rubyNodes(text.slice(last)));
  return out;
}

}

/* ---------- back-translation (回译, English and Japanese articles): read the Chinese, write the original language, compare with the original ----------
   对照背诵: every sentence with its Chinese; the English is hidden until tapped (for learning it by heart).
   逐句回译: one Chinese sentence at a time, write the English, then compare word by word with the original.
   全文回译: the whole article in Chinese, a box under each paragraph, then compare everything at once.
   Drafts are kept in the article's progress (state.ans: "bt<i>" per sentence, "bp<k>" per paragraph). */
const tr = {mode:'recite', i:0, shown:{}, all:false, revealed:{}, full:false};

function trOrder(){ const o = []; trBlocks().forEach(function(b){ b.idx.forEach(function(i){ o.push(i); }); }); return o; }
function setAns(k, val){
  const t = val.replace(/\s+$/, '');
  if (t) state.ans[k] = t.slice(0, 2000); else delete state.ans[k];
  touch();
}
const TR_UNIT = LANG === 'ja' ? '字' : '词', TR_JOIN = LANG === 'ja' ? '' : ' ';
function trCompare1(ref, val){
  const a = Kit.toks(ref), b = Kit.toks(val), d = Kit.lcsHits(a, b);
  const hit = d.ha.filter(Boolean).length;
  return {pct:a.length ? Math.round(hit / a.length * 100) : 0, extra:b.length - d.hb.filter(Boolean).length,

}
/* Japanese: an answer written in kana is also compared with the reading (rom); the better match counts */
function trCompare(ref, val, rom){
  const c = trCompare1(ref, val);
  if (rom){ const k = trCompare1(rom, val); if (k.pct > c.pct){ k.kana = true; return k; } }
  return c;
}
function trScore(c){
  return h('p', {class:'tr-score'}, h('b', null, c.pct + '%'), LANG === 'ja' ? ' 的原文你写到了（按字算）' : ' 的原文单词你写到了',
    c.extra ? '，另外多写了 ' + c.extra + ' 个' + TR_UNIT : '', c.kana ? '（你写的假名较多，已按读音对照）' : '',
    '。划线的是有出入的地方；意思对、表达自然也算好的翻译。');
}
function trOrig(t){ return LANG === 'ja' ? rubyNodes(t) : t; }
function trRom(t){ return LANG === 'ja' && t ? h('p', {class:'tr-rom'}, '读音　' + t) : null; }
function renderTrans(){
  const box = $('#transBox');
  const modes = [['recite', '对照背诵'], ['sent', '逐句回译'], ['full', '全文回译']];
  const lead = {recite:'先背：每句中文下面藏着' + XL + '原文，点一下显示。背熟后切到“逐句回译”或“全文回译”自己写。',

/* ---------- add a word yourself: select text in the article -> 加入生词 ---------- */
function selText(){ try { const s = window.getSelection(); return s && !s.isCollapsed ? s.toString().trim() : ''; } catch(e){ return ''; } }

function selInfo(){
  const sel = window.getSelection();

  function sentOf(n){ const el = n && (n.nodeType === 1 ? n : n.parentNode); return el && el.closest ? el.closest('#article .sent') : null; }

  const pre = document.createRange();

  const i = Number(a.dataset.i), en = S[i].en;
  /* readings above kanji (<rt>) are not part of the sentence */

  /* drop spaces and punctuation at both ends: "elves," -> "elves" */
  const lead = t.match(new RegExp('^[^' + LETTERS + '0-9]*', 'i'))[0].length;
  o += lead; t = t.slice(lead);
  t = t.replace(new RegExp('[^' + LETTERS + '0-9]+$', 'i'), '');

  const err = h('p', {class:'uw-err', 'aria-live':'polite'});
  const ctx = edit ? edit.ctx : s.en;
  const bg = h('div', {class:'uw-bg', onclick:function(e){ if (e.target === bg) close(); }});
  function close(){ bg.remove(); document.removeEventListener('keydown', onKey); }
  function onKey(e){ if (e.key === 'Escape') close(); }
  function save(){
    const z = zh.value.trim();
    if (!z){ err.textContent = '写一下中文意思吧，考试时要靠它出题。'; zh.focus(); return; }
    if (edit){ mineEdit(edit.key, {zh:z, n:note.value}); close(); refreshMine(); toast('已更新“' + term + '”'); return; }
    mineAdd(SLUG, {t:x.t, o:x.o, ctx:s.en, czh:s.zh, zh:z, n:note.value});
    try { window.getSelection().removeAllRanges(); } catch(e){}
    close(); refreshMine();
    toast('已加入生词：' + term + '。词汇表、自测和复习页都能看到它。');
  }
  const card = h('div', {class:'uw-sheet', role:'dialog', 'aria-modal':'true', 'aria-label':edit ? '修改生词' : '加入生词'},
    h('p', {class:'eyebrow'}, edit ? '修改生词' : '加入生词'),
    h('h3', {class:'uw-term'}, term),
    h('p', {class:'uw-ctx'}, ctx.slice(0, edit ? 0 : x.o), h('b', null, edit ? '' : term), edit ? ctx : ctx.slice(x.o + term.length)),
    old ? h('p', {class:'uw-old'}, '词汇表里已经有“' + old.expr + '”（' + old.zh + '）。还要再加一个吗？') : null,
    h('label', {class:'uw-f'}, h('span', null, '中文意思'), zh),
    h('label', {class:'uw-f'}, h('span', null, '笔记'), note),
    err,
    h('div', {class:'row'},
      h('button', {type:'button', class:'btn pri', onclick:save}, edit ? '保存' : '加入生词'),
      h('button', {type:'button', class:'btn', onclick:close}, '取消')));
  zh.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); save(); } });
  bg.append(card);
  document.body.append(bg);
  document.addEventListener('keydown', onKey);
  setTimeout(function(){ zh.focus(); }, 30);
}
function refreshMine(){
  loadMine();
  buildTerms();
  renderAll();
  if (L.el.box) renderListenText();
}
let toastTimer = 0;
function toast(msg){
  let t = $('.uw-toast');
  if (!t){ t = h('div', {class:'uw-toast', role:'status'}); document.body.append(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.hidden = true; }, 3200);
}

/* ---------- wiring ---------- */
/* ---------- speaker icons: words, example sentences, article sentences ---------- */
function speakBtn(key, text){ return clipBtn(DATA.clips, key, text); }
function stopNarrationForClip(){
  if (L && L.audio && !L.audio.paused) L.audio.pause();
  if (L) L.seg = null;
}
function sentBtn(en){
  if (!DATA.audio) return null;
  const i = S.findIndex(function(s){ return s.en === en; }) >= 0 ? S.findIndex(function(s){ return s.en === en; }) : S.findIndex(function(s){ return s.en.indexOf(en) >= 0; });
  if (i < 0) return null;
  const b = spkEl('播放这一句', function(){ playArticleSentence(i, b); });
  return b;
}
function playArticleSentence(i, btn){
  const a = getAudio();
  const T = DATA.audio.t[i];
  Clip.stop();
  const wasOn = L.seg && L.seg.btn === btn && !a.paused;
  endSeg();
  if (wasOn){ a.pause(); return; }
  L.seg = {end:T[1] + 0.15, btn:btn};
  btn.classList.add('on');
  const go = function(){ a.currentTime = Math.max(0, T[0] - 0.1); };
  if (a.readyState >= 1) go(); else a.addEventListener('loadedmetadata', go, {once:true});
  const pr = a.play();
  if (pr && pr.catch) pr.catch(function(){ endSeg(); });
}
function endSeg(){
  if (L.seg && L.seg.btn) L.seg.btn.classList.remove('on');
  L.seg = null;
}

/* ---------- listen tab ---------- */
const L = {audio:null, cur:-1, loop:false, loopIdx:-1, drag:false, el:{}, spans:[], raf:0, seg:null};
const RATES = [0.75, 0.9, 1, 1.15, 1.3];
function fmtT(t){ t = Math.max(0, Math.floor(t)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
function sentAt(t){
  const T = DATA.audio.t;
  let k = 0;
  for (let i = 0; i < T.length; i++){ if (T[i][0] <= t + 0.05) k = i; else break; }
  return k;
}
function getAudio(){
  if (L.audio) return L.audio;
  const a = new Audio();
  a.preload = 'auto';
  a.src = DATA.audio.src;
  a.playbackRate = ui.rate || 1;
  try { a.preservesPitch = true; a.webkitPreservesPitch = true; } catch(e){}
  a.addEventListener('timeupdate', listenUpdate);
  a.addEventListener('play', function(){ listenPlayState(); loopFrames(); });
  a.addEventListener('pause', function(){ listenPlayState(); if (L.seg && a.currentTime < L.seg.end) endSeg(); });
  a.addEventListener('ended', function(){ listenPlayState(); listenUpdate(); });
  a.addEventListener('error', function(){ L.el.msg.textContent = '音频没有加载出来，请检查网络后再点播放。'; L.el.msg.hidden = false; });
  a.addEventListener('playing', function(){ L.el.msg.hidden = true; });
  L.audio = a;
  try {
    if ('mediaSession' in navigator){
      navigator.mediaSession.metadata = new MediaMetadata({title:DATA.title, artist:{en:'外刊精读', ko:'韩语入门', ja:'日语中级'}[LANG]});
      navigator.mediaSession.setActionHandler('play', function(){ a.play(); });
      navigator.mediaSession.setActionHandler('pause', function(){ a.pause(); });
      navigator.mediaSession.setActionHandler('seekbackward', function(){ a.currentTime = Math.max(0, a.currentTime - 5); });
      navigator.mediaSession.setActionHandler('seekforward', function(){ a.currentTime = Math.min(DATA.audio.dur, a.currentTime + 5); });
    }
  } catch(e){}
  return a;
}
function listenPlayState(){
  const playing = !!(L.audio && !L.audio.paused && !L.audio.ended);
  L.el.play.textContent = playing ? '暂停' : '播放';
  L.el.play.setAttribute('aria-pressed', String(playing));
}
function loopFrames(){
  cancelAnimationFrame(L.raf);
  const tick = function(){
    if (!L.audio || L.audio.paused) return;
    listenUpdate();
    L.raf = requestAnimationFrame(tick);
  };
  L.raf = requestAnimationFrame(tick);
}
function listenUpdate(){
  const a = L.audio;
  if (!a) return;
  const T = DATA.audio.t;
  let t = a.currentTime;
  if (L.seg && !a.paused && t >= L.seg.end){ a.pause(); endSeg(); }
  if (L.loop && L.loopIdx >= 0 && !L.seg && !a.paused && t >= T[L.loopIdx][1] + 0.2){ a.currentTime = T[L.loopIdx][0]; t = a.currentTime; }
  if (!L.drag) L.el.range.value = String(t);
  L.el.now.textContent = fmtT(t);
  const k = sentAt(t);
  if (k !== L.cur){
    L.cur = k;
    markListenSentence(!a.paused);
  }
}
function markListenSentence(follow){
  L.spans.forEach(function(sp){ sp.classList.toggle('on', Number(sp.dataset.i) === L.cur); });
  if (follow && ui.tx){
    const sp = L.spans[L.cur];
    if (sp) sp.scrollIntoView({block:'nearest', behavior:REDUCE ? 'auto' : 'smooth'});
  }
}
function playSentence(i){
  endSeg();
  Clip.stop();
  const a = getAudio();
  a.currentTime = DATA.audio.t[i][0];
  if (L.loop) L.loopIdx = i;
  a.play().catch(function(){});
  listenUpdate();
}
function seekBy(d){
  endSeg();
  const a = getAudio();
  a.currentTime = Math.min(DATA.audio.dur, Math.max(0, a.currentTime + d));
  listenUpdate();
}
function setRate(r){
  ui.rate = r; lsSet(LS_UI, ui);
  if (L.audio) L.audio.playbackRate = r;
  $$('.rate-b', L.el.box).forEach(function(b){ const on = Number(b.dataset.r) === r; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
}
function applyTextVisibility(){
  L.el.tr.hidden = !ui.tx;
  L.el.off.hidden = !!ui.tx;
}
function renderListenText(){
  if (!L.el.tr) return;
  L.el.tr.replaceChildren();
  BLOCKS.forEach(function(b){
    const sec = h('section', {class:'blk blk-' + b.type});
    const el = h(b.type === 'title' ? 'h2' : 'p', {class:b.type === 'title' ? 'a-title' : b.type === 'sub' ? 'a-deck' : 'a-para'});
    b.idx.forEach(function(i, k){
      if (k > 0) el.append(' ');
      const sp = h('span', {class:'ls', 'data-i':i, tabindex:0, role:'button', 'aria-label':'从这一句开始播放'}, marked(S[i].en));
      sp.addEventListener('click', function(){ playSentence(i); });
      sp.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); playSentence(i); } });
      el.append(sp);
    });
    sec.append(el);
    L.el.tr.append(sec);
  });
  L.spans = $$('.ls', L.el.tr);
  markListenSentence(false);
}
function renderListen(){
  const box = $('#listenBox');
  if (!DATA.audio || !box || L.el.box) return;
  L.el.box = box;
  const A = DATA.audio;
  L.el.play = h('button', {type:'button', class:'btn pri big', 'aria-pressed':'false', onclick:function(){
    endSeg();
    Clip.stop();
    const a = getAudio();
    if (a.paused || a.ended){ if (a.ended) a.currentTime = 0; a.play().catch(function(){}); } else a.pause();
  }}, '播放');
  L.el.range = h('input', {type:'range', class:'lp-range', min:0, max:A.dur, step:0.1, value:0, 'aria-label':'播放进度'});
  L.el.range.addEventListener('pointerdown', function(){ L.drag = true; });
  L.el.range.addEventListener('input', function(){
    const a = getAudio();
    a.currentTime = Number(L.el.range.value);
    L.el.now.textContent = fmtT(a.currentTime);
    const k = sentAt(a.currentTime);
    if (k !== L.cur){ L.cur = k; markListenSentence(false); }
  });
  const endDrag = function(){ L.drag = false; };
  L.el.range.addEventListener('change', endDrag);
  L.el.range.addEventListener('pointerup', endDrag);
  L.el.range.addEventListener('pointercancel', endDrag);
  L.el.now = h('span', null, '0:00');
  L.el.msg = h('p', {class:'lp-msg', hidden:true, role:'alert'});
  const rates = h('div', {class:'chips', role:'group', 'aria-label':'播放速度'});
  RATES.forEach(function(r){
    rates.append(h('button', {type:'button', class:'chip rate-b', 'data-r':r, 'aria-pressed':'false', onclick:function(){ setRate(r); }}, r + '×'));
  });
  const loopCb = h('input', {type:'checkbox'});
  loopCb.addEventListener('change', function(){
    L.loop = loopCb.checked;
    L.loopIdx = L.loop ? (L.cur >= 0 ? L.cur : 0) : -1;
  });
  const txCb = h('input', {type:'checkbox'});
  txCb.checked = !!ui.tx;
  txCb.addEventListener('change', function(){ ui.tx = txCb.checked; lsSet(LS_UI, ui); applyTextVisibility(); });
  L.el.tr = h('div', {class:'tr'});
  L.el.off = h('p', {class:'tr-off'}, '原文已隐藏。先盲听一遍，听完再勾选“显示原文”对照。');
  box.append(
    h('div', {class:'card lp'},
      h('h2', {class:'h2'}, '听力'),
      h('p', {class:'lead'}, '整篇文章的朗读（AI 合成的' + (LANG !== 'en' ? XL : (DATA.audio.voice || '').charAt(0) === 'b' ? '英式' : '美式') + '发音，语速略慢）。先盲听，再对照原文；点原文里的任意一句，就从那一句开始播放。'),
      h('div', {class:'lp-row'},
        h('button', {type:'button', class:'btn', onclick:function(){ seekBy(-5); }}, '后退 5 秒'),
        L.el.play,
        h('button', {type:'button', class:'btn', onclick:function(){ seekBy(5); }}, '前进 5 秒')
      ),
      h('div', null, L.el.range, h('div', {class:'lp-time'}, L.el.now, h('span', null, fmtT(A.dur)))),
      h('div', null, h('p', {class:'meta'}, '播放速度'), h('div', {class:'row'}, rates)),
      h('div', {class:'lp-row'},
        h('label', {class:'lp-opt'}, loopCb, '单句循环（当前这一句反复听）'),
        h('label', {class:'lp-opt'}, txCb, '显示原文')
      ),
      L.el.msg
    ),
    L.el.off,
    L.el.tr
  );
  setRate(ui.rate || 1);
  renderListenText();
  applyTextVisibility();
}
function renderAll(){
  renderMast();
  renderArticle();
  renderListen();
  renderWords();
  renderThink();
  if (quiz.phase === 'start') renderQuiz();
}
function init(){
  Clip.onBeforePlay(stopNarrationForClip);
  window.addEventListener('pagehide', settle);
  document.addEventListener('visibilitychange', function(){ if (document.hidden) settle(); });
  if (LANG !== 'en'){
    const rl = h('label', null, h('input', {type:'checkbox', id:'optRom'}), LANG === 'ja' ? ' 显示读音' : LANG === 'yue' ? ' 显示粤拼' : ' 显示罗马音');
    $('#optZh').parentNode.after(rl);
    $('#optRom').checked = !!ui[ROMK];
    document.body.classList.toggle('show-rom', !!ui[ROMK]);
    $('#optRom').addEventListener('change', function(){ ui[ROMK] = this.checked; lsSet(LS_UI, ui); document.body.classList.toggle('show-rom', ui[ROMK]); });
    const tt = $('.tab[data-tab="think"]');
    if (tt) tt.textContent = LANG === 'ja' ? '语法' : '句型';
  }
  $('#optZh').checked = !!ui.zh;
  $('#optHi').checked = !!ui.hi;
  $('#optZh').addEventListener('change', function(){ ui.zh = this.checked; lsSet(LS_UI, ui); $('#article').classList.toggle('show-zh', ui.zh); });
  $('#optHi').addEventListener('change', function(){ ui.hi = this.checked; lsSet(LS_UI, ui); renderArticle(); renderListenText(); });
  const chips = $('#chips');
  ['all','new','learning','mastered'].forEach(function(f){
    chips.append(h('button', {type:'button', class:'chip', 'data-f':f, onclick:function(){ vFilter = f; renderWords(); }}, f));
  });
  document.addEventListener('selectionchange', function(){ clearTimeout(selTimer); selTimer = setTimeout(placeAddBtn, 180); });
  window.addEventListener('resize', hideAddBtn);
  $('#wordSearch').addEventListener('input', function(){ vQuery = this.value; renderWords(); });
  $$('.tab').forEach(function(b){
    b.addEventListener('click', function(){ try { location.hash = b.dataset.tab; } catch(e){} showTab(b.dataset.tab); });
  });
  window.addEventListener('hashchange', function(){ showTab(location.hash.replace('#','')); });
  if (DATA.audio) $('.tab[data-tab="listen"]').hidden = false;
  if (LANG === 'en' || LANG === 'ja') $('.tab[data-tab="trans"]').hidden = false;
  renderAll();
  showTab(location.hash.replace('#','') || 'read');
  initCloud();
}
init();
})();
</script>
