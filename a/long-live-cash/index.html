const DATA = {"sents":[{"kind":"title","en":"Long live cash: why Japan is in no hurry to go cashless","zh":"现金万岁：日本为什么不急着告别现金","notes":["Long live ...! 是欢呼用语，如 Long live the king!，“……万岁”。这里借用来调侃现金。","in no hurry to do sth：一点也不急着做某事。no 加强否定，比 not in a hurry 语气更重。","go cashless：go + 形容词，表示“变成……的状态”；cashless = 无现金的。"],"i":0,"p":0,"n":0,"label":"标题"},{"kind":"sub","en":"In much of the rich world, tapping a phone has replaced fumbling for coins.","zh":"在富裕世界的大部分地方，轻点手机已经取代了摸索着找硬币。","notes":["in much of the rich world：在富裕国家的大部分地区；much of + the + 名词 = “……的大部分”。the rich world 是《经济学人》常用的说法，指发达国家。","tapping a phone 和 fumbling for coins 是两个动名词短语，分别作 has replaced 的主语和宾语。","fumble for：笨手笨脚地摸索着找。fumbling 带出在口袋里翻硬币的狼狈画面，与 tapping 的轻巧形成对比。"],"i":1,"p":0,"n":0,"label":"副标题"},{"kind":"sub","en":"In Japan the old habit survives for reasons that are more rational than they look.","zh":"在日本，这个老习惯留存下来，理由比看上去的更理性。","notes":["for reasons that are ...：that 引导定语从句，修饰 reasons。","more rational than they look：than they look 是省略了形容词的比较结构（= than they look rational），they 指 reasons。","rational：理性的、合乎道理的。先抛出反直觉的论点：看起来落后的习惯，其实有道理。"],"i":2,"p":0,"n":0,"label":"副标题"},{"kind":"body","en":"Stand in the queue at a Tokyo bakery at lunchtime and watch the wallets come out.","zh":"中午在东京一家面包店的队伍里站一会儿，就能看到钱包一个个掏出来。","notes":["Stand ... and watch ...：祈使句 + and，相当于条件句：“只要站在那儿，就会看到……”。","queue 是英式英语的“排队”，美式用 line。全文用英式用词和拼写。","watch + 宾语 + 动词原形：看着某事发生的全过程，所以是 watch the wallets come out。","wallets 借代顾客：用钱包代指掏钱的人。"],"p":1,"i":3,"n":1,"label":"第 1 句"},{"kind":"body","en":"Some customers wave a phone at the reader; a surprising number still count out coins with the unhurried air of people who have nowhere to be.","zh":"有些顾客拿手机对着读卡器一晃；数量惊人的人仍在一枚一枚数着硬币，神态从容，仿佛无处可去。","notes":["分号连接两个并列分句，some ... ; a surprising number ... 形成对照。","a surprising number 后面省略了 of customers，所以谓语用复数 count。","count out：把钱一枚一枚数出来。","with the unhurried air of people ...：带着……的神态；air 在这里是“神态、气质”。who have nowhere to be 是定语从句，意思是没有急着要赶去的地方，也就是不赶时间。"],"p":1,"i":4,"n":2,"label":"第 2 句"},{"kind":"body","en":"To a visitor from Shenzhen or Stockholm, where cash has become a rarity, the scene looks like a time capsule.","zh":"对来自深圳或斯德哥尔摩的游客来说，那些地方现金已经很少见，眼前的场景就像一个时间胶囊。","notes":["where cash has become a rarity 是非限制性定语从句，补充说明 Shenzhen or Stockholm。","a rarity：稀罕物，少见的东西；become a rarity = 变得罕见。","time capsule 本义是封存旧物留给后人的“时间胶囊”，这里比喻保留着旧时代原貌的地方。","To a visitor from ...：介词短语作状语，“在……看来”。"],"p":1,"i":5,"n":3,"label":"第 3 句"},{"kind":"body","en":"Japan's officials see it differently, and have spent years trying to coax shoppers into going cashless.","zh":"日本的官员看法不同，多年来一直想哄着顾客改用无现金支付。","notes":["see it differently：对此看法不同；it 指上一句所说的“时间胶囊”式的印象。","have spent years trying to ...：花了多年时间去尝试；spend + 时间 + (in) doing / trying。","coax sb into doing sth：连哄带劝地让某人做某事；coax 带有耐心、温和的意味，比 force 柔和得多。","go cashless 回应标题，go + 形容词表示“变成”。"],"p":1,"i":6,"n":4,"label":"第 4 句"},{"kind":"body","en":"The first reason is that cash works remarkably well here.","zh":"第一个原因是，现金在这里用起来出奇地好。","notes":["The first reason is that ...：that 引导表语从句；后文的 The second reason 与它呼应。","work well：运转良好，这里指现金这套系统好用。","remarkably：显著地、出奇地，修饰副词 well，比 very 更有评价的意味。"],"p":2,"i":7,"n":5,"label":"第 5 句"},{"kind":"body","en":"Crime is low, so carrying a thick wad of notes feels safe, and cash machines are everywhere, including in almost every convenience store.","zh":"犯罪率低，所以带着厚厚一沓钞票也觉得安全；取款机到处都是，几乎每家便利店里都有。","notes":["so 引出结果：治安好，所以带现金让人觉得安全。carrying ... 是动名词短语作主语，feels 是系动词。","wad：一叠、一卷（钞票或纸）；notes 是英式英语的“纸币”，美式用 bills。","including in almost every convenience store：including 后接介词短语，突出“连便利店里都有”。"],"p":2,"i":8,"n":6,"label":"第 6 句"},{"kind":"body","en":"Cash also keeps working when the power fails, which counts for something in a country that lives with earthquakes.","zh":"停电的时候，现金照样能用，在一个与地震共存的国家，这一点是有分量的。","notes":["which 引导非限制性定语从句，指代前面整句话说的情况（现金停电也能用）。","count for something：有价值、有分量；反义是 count for nothing。","live with：与……共处，习惯其存在。lives with earthquakes 把地震说成日常的“邻居”。","when the power fails：power failure = 停电；fail 在这里是“失灵、断掉”。"],"p":2,"i":9,"n":7,"label":"第 7 句"},{"kind":"body","en":"Older customers, who make up a growing share of the population, tend to trust what they can hold in their hands.","zh":"年长的顾客在人口中占比越来越大，他们往往更信任手里能握住的东西。","notes":["who make up ... 是非限制性定语从句，补充说明 Older customers。","make up：构成、占（比例）；make up a share of ... = 占……的一部分。","tend to + 动词原形：往往会、倾向于。","what they can hold in their hands：what 引导名词性从句，作 trust 的宾语；“握在手里的”与无形的数字支付形成对比。"],"p":2,"i":10,"n":8,"label":"第 8 句"},{"kind":"body","en":"For them, and for plenty of younger people, the old system is not broken, so there is little to fix.","zh":"对他们，以及对许多年轻人来说，老办法并没有坏，所以也没有多少需要修的地方。","notes":["is not broken, so there is little to fix 化用了英语俗语 If it ain't broke, don't fix it（没坏就别修）。","little to fix：little 表示否定意义的“几乎没有”，后面的不定式 to fix 作后置定语。","plenty of：许多的，后接可数复数或不可数名词，多用于肯定句。"],"p":2,"i":11,"n":9,"label":"第 9 句"},{"kind":"body","en":"The second reason is that the bill for convenience lands on someone else.","zh":"第二个原因是，方便的账单落到了别人头上。","notes":["与 The first reason 呼应，开始第二层理由。","bill for convenience：为方便付出的账单；bill 既是实际的账单，也有“代价”的比喻义。","land on：（责任、费用）落到……头上。lands on someone else 暗示：谁用得方便，谁就不用买单。"],"p":3,"i":12,"n":10,"label":"第 10 句"},{"kind":"body","en":"Shoppers pay nothing extra to use cash, whereas shops hand over a slice of every card sale to the firms that run the payment networks.","zh":"顾客用现金不用多付一分钱，而商家每做成一笔刷卡生意，都要把一部分交给运营支付网络的公司。","notes":["whereas：而、然而，连接两个对比的分句。","pay nothing extra：nothing 加形容词后置，“没有额外的……”。","hand over A to B：把 A 交给 B；hand over 带有不得不交出的意味。","a slice of：一块、一份，这里指抽成。slice 本义是切下的一片，比喻分走一部分。","that run the payment networks 是定语从句，修饰 the firms。"],"p":3,"i":13,"n":11,"label":"第 11 句"},{"kind":"body","en":"For a small bakery working on thin margins, that slice can be the difference between a profit and a loss.","zh":"对一家利润微薄的小面包店来说，这一份抽成可能就是盈利与亏损的差别。","notes":["working on thin margins 是现在分词短语，修饰 a small bakery。","margin：利润率、利润空间；thin margins 指利润微薄，对应 fat margins。","that slice 回指上一句的 a slice of every card sale。","the difference between A and B：A 和 B 的差别，强调再小的一笔也可能决定成败。"],"p":3,"i":14,"n":12,"label":"第 12 句"},{"kind":"body","en":"Many owners therefore accept cards grudgingly, and a few quietly discourage them.","zh":"因此，许多店主勉强接受刷卡，还有少数人悄悄地劝阻顾客别刷卡。","notes":["therefore 作连接性副词，插在主语和谓语之间，表示因果。","grudgingly：勉强地、心不甘情不愿地；来自 grudge（怨恨、不情愿）。","discourage：劝阻、使人打消念头；反义词 encourage。","a few 是肯定的“少数几个”；few（不加 a）才是“几乎没有”。"],"p":3,"i":15,"n":13,"label":"第 13 句"},{"kind":"body","en":"Officials have long tried to nudge people along.","zh":"官员们早就想把人们往前推一推。","notes":["have long tried：现在完成时加 long，表示一直在做。","nudge：用肘轻推；比喻不强制、轻轻地引导，行为经济学里的 nudge（助推）就是这个意思。","nudge ... along：轻推着往前走，口语色彩较重。"],"p":4,"i":16,"n":14,"label":"第 14 句"},{"kind":"body","en":"A few years ago the government dangled rebates in front of anyone who paid by card or phone, and the share of cashless payments crept upward.","zh":"几年前，政府把返利悬在所有刷卡或用手机付款的人面前，无现金支付的占比慢慢爬了上去。","notes":["dangle ... in front of ...：把诱饵悬在……面前，常带有“用好处引诱”的意味。","rebate：返还的钱、折扣；这里指消费后返还的积分或现金。","anyone who paid ...：anyone 后接 who 定语从句；paid by card or phone，by + 无冠词名词表示付款方式。","the share of ... crept upward：share 是占比；creep：缓慢地爬行，creep upward = 缓慢上升，过去式 crept。"],"p":4,"i":17,"n":15,"label":"第 15 句"},{"kind":"body","en":"But incentives of that kind tend to fade once the money runs out.","zh":"但这类激励措施往往在钱花完之后就慢慢失效了。","notes":["of that kind：那种类型的，后置定语。","fade：逐渐减弱、淡去；原指颜色褪去。","once + 从句：一旦……就……；时间状语从句里用一般现在时表示将来。","run out：（钱、时间、供应）用完；the money runs out 里 run out 是不及物短语。"],"p":4,"i":18,"n":16,"label":"第 16 句"},{"kind":"body","en":"What may finally tip the balance is not persuasion but arithmetic.","zh":"最终可能打破平衡的，不是劝说，而是算账。","notes":["What ... is ...：What may finally tip the balance 是整句的主语从句。","tip the balance：使天平倾斜，指起决定作用；tip 在这里是“使倾斜”。","not A but B：不是 A 而是 B。","arithmetic：算术；这里指成本和收益的账算得过来，与 persuasion（劝说）形成对比。"],"p":5,"i":19,"n":17,"label":"第 17 句"},{"kind":"body","en":"Japan's workforce is shrinking, and every hour a shopkeeper spends counting the till costs more each year.","zh":"日本的劳动力在减少，店主每花一个小时清点收银抽屉，成本都一年比一年高。","notes":["shrink：缩小、萎缩；shrinking 是现在进行时，强调正在发生的趋势。","every hour a shopkeeper spends counting the till：every hour 后省略了关系词 that，a shopkeeper spends counting the till 是定语从句。","spend + 时间 + doing：花时间做某事。","till：商店的收银抽屉或收银机；counting the till 就是结账时清点现金。","劳动力变少，人工越来越贵，所以同样的一小时一年比一年值钱。"],"p":5,"i":20,"n":18,"label":"第 18 句"},{"kind":"body","en":"Handling cash is a hidden expense: notes must be counted, banked and ferried about in armoured vans, and someone has to keep all those machines topped up.","zh":"处理现金是一笔隐形开支：纸币要清点、存入银行、用运钞车运来运去，还得有人把那些取款机一直补满。","notes":["冒号后面解释 hidden expense 具体包括什么。","must be counted, banked and ferried about：三个并列的被动语态；banked 在这里是动词“存入银行”。","ferry：本义是摆渡，这里指用车辆来回运送。armoured vans 是运钞车；armoured 是英式拼写，美式是 armored。","keep ... topped up：保持（取款机）处于被补满的状态；top up = 把……加满，keep + 宾语 + 过去分词表示保持某个状态。"],"p":5,"i":21,"n":19,"label":"第 19 句"},{"kind":"body","en":"Shops and banks are beginning to realise that the cheapest way to take money is the one with the fewest humans involved.","zh":"商店和银行开始意识到，最便宜的收款方式，是牵涉的人最少的那一种。","notes":["realise 是英式拼写，美式为 realize。","begin to + 动词原形：开始……。","the cheapest way to take money is the one ...：the one 代指 way；take money 是收钱。","with the fewest humans involved：with + 名词 + 过去分词，“有……参与”；involved 作后置定语，修饰 humans。"],"p":5,"i":22,"n":20,"label":"第 20 句"},{"kind":"body","en":"None of this makes Japan's attachment to cash irrational.","zh":"这一切都不会让日本人对现金的依恋变得不理性。","notes":["None of this：这一切都不……；None of + 代词或复数名词作主语。","make + 宾语 + 形容词：使……变得……；irrational 是宾语补足语，与副标题里的 rational 呼应。","attachment to：对……的依恋，这里的 to 是介词，后面接名词。","这句话起收束作用：成本的算账会改变局面，但这不等于日本人“错”了。"],"p":6,"i":23,"n":21,"label":"第 21 句"},{"kind":"body","en":"People stick with what works, and the cost of switching is easy to overlook for those who stand to gain from it.","zh":"人们会坚持用管用的东西，而改用新办法的成本，对那些能从中获益的人来说，很容易被忽略。","notes":["stick with：坚持使用，不换。","what works：what 引导名词性从句，“管用的东西”。","easy to overlook：形容词加不定式，不定式用主动形式表示被动意义（the cost 被忽略）。","stand to gain from：有可能从……获益；stand to + 动词表示“很可能会”。those who ... 指那些推动改用新办法的人。"],"p":6,"i":24,"n":22,"label":"第 22 句"},{"kind":"body","en":"Habits rarely give way because someone has made a persuasive case; they do so when the old way becomes more expensive for those who set the price.","zh":"习惯很少是因为有人提出了有说服力的论证才让步；它们让步，是在旧方式对那些定价的人变得更贵的时候。","notes":["rarely ... because ...：rarely 是否定副词，because 引导的原因被它否定，意思是“很少是因为……”。","give way：让步、屈服，也有“倒塌”的意思；这里指习惯被改变。do so 代替 give way，避免重复。","make a case：提出论据；a persuasive case 是有说服力的论证。has made 是现在完成时。","分号后的分句与前半句结构平行：they do so when ...，形成“不是……而是……”的对照。","those who set the price：那些定价的人，指商家和银行，而不是付钱的顾客。"],"p":6,"i":25,"n":23,"label":"第 23 句"},{"kind":"body","en":"Until then, the bakery queue will remain a quiet standoff between two ways of paying.","zh":"在那之前，面包店里的这支队伍，仍将是两种付款方式之间一场无声的对峙。","notes":["Until then：到那时为止，then 指上一句所说的“旧方式变贵”的时候。","standoff：僵持、对峙，原指双方互不退让的局面。","quiet standoff 呼应开头面包店排队的画面，首尾呼应。","remain + 名词：仍然是，系动词用法。"],"p":6,"i":26,"n":24,"label":"第 24 句"}],"vocab":[{"id":1,"expr":"fumble for","zh":"摸索着找（东西）","m":["fumbling for"],"note":"","core":"fumble for","forms":["fumble for","fumbles for","fumbled for","fumbling for"],"syn":[],"ex":[{"en":"He [[fumbled for]] his keys in the dark.","zh":"他在黑暗里摸索着找钥匙。"},{"en":"She stood at the gate, [[fumbling for]] her ticket.","zh":"她站在检票口，在包里摸索着找车票。"}],"ctx":"In much of the rich world, tapping a phone has replaced fumbling for coins."},{"id":2,"expr":"rational","zh":"理性的、合乎道理的","m":["rational"],"note":"反义词 irrational 出现在全文倒数第四句。","core":"rational","forms":["rational"],"syn":[],"ex":[{"en":"It was a [[rational]] decision, not an emotional one.","zh":"那是个理性的决定，不是感情用事。"},{"en":"Few people stay fully [[rational]] when they are afraid.","zh":"很少有人在害怕的时候还能完全保持理性。"}],"ctx":"In Japan the old habit survives for reasons that are more rational than they look."},{"id":3,"expr":"count out","zh":"（一枚一枚地）数出","m":["count out"],"note":"","core":"count out","forms":["count out","counts out","counted out","counting out"],"syn":[],"ex":[{"en":"She [[counted out]] ten coins onto the counter.","zh":"她把十枚硬币一枚一枚数到柜台上。"},{"en":"The cashier [[counted out]] the change slowly.","zh":"收银员慢慢地数出找零。"}],"ctx":"Some customers wave a phone at the reader; a surprising number still count out coins with the unhurried air of people who have nowhere to be."},{"id":4,"expr":"unhurried","zh":"不慌不忙的","m":["unhurried"],"note":"","core":"unhurried","forms":["unhurried"],"syn":["relaxed","leisurely"],"ex":[{"en":"She walked at an [[unhurried]] pace along the river.","zh":"她沿着河边不紧不慢地走。"},{"en":"His [[unhurried]] manner calmed the whole room.","zh":"他从容的态度让整个房间都平静下来。"}],"ctx":"Some customers wave a phone at the reader; a surprising number still count out coins with the unhurried air of people who have nowhere to be."},{"id":5,"expr":"an air of","zh":"……的神态、气派","m":["air of"],"note":"air 作“神态、气氛”时是可数名词单数，常用 an air of + 名词。","core":"air of","forms":["air of"],"syn":[],"ex":[{"en":"He spoke with an [[air of]] quiet authority.","zh":"他说话时带着一种沉稳的权威感。"},{"en":"The old house had an [[air of]] neglect.","zh":"那座老房子有一种无人照管的气息。"}],"ctx":"Some customers wave a phone at the reader; a surprising number still count out coins with the unhurried air of people who have nowhere to be."},{"id":6,"expr":"a rarity","zh":"稀罕物、少见的东西","m":["a rarity"],"note":"","core":"rarity","forms":["rarity","a rarity","rarities"],"syn":[],"ex":[{"en":"Handwritten letters have become [[a rarity]].","zh":"手写信已经成了稀罕物。"},{"en":"Honest feedback is [[a rarity]] in some offices.","zh":"在有些办公室里，坦率的反馈很难得。"}],"ctx":"To a visitor from Shenzhen or Stockholm, where cash has become a rarity, the scene looks like a time capsule."},{"id":7,"expr":"time capsule","zh":"时间胶囊；保留旧时代原貌的地方","m":["time capsule"],"note":"","core":"time capsule","forms":["time capsule","time capsules"],"syn":[],"ex":[{"en":"The restored cafe feels like a [[time capsule]] from the 1960s.","zh":"这家修复过的咖啡馆像一个来自六十年代的时间胶囊。"},{"en":"The pupils buried a [[time capsule]] under the school garden.","zh":"学生们在学校花园下埋了一个时间胶囊。"}],"ctx":"To a visitor from Shenzhen or Stockholm, where cash has become a rarity, the scene looks like a time capsule."},{"id":8,"expr":"coax","zh":"连哄带劝地使（做某事）","m":["coax"],"note":"常用结构 coax sb into doing sth；也可以 coax sb to do sth。","core":"coax","forms":["coax","coaxes","coaxed","coaxing"],"syn":[],"ex":[{"en":"She [[coaxed]] the shy cat out from under the sofa.","zh":"她把害羞的猫从沙发底下哄了出来。"},{"en":"He tried to [[coax]] his grandmother into using a smartphone.","zh":"他想哄着奶奶用上智能手机。"}],"ctx":"Japan's officials see it differently, and have spent years trying to coax shoppers into going cashless."},{"id":9,"expr":"remarkably","zh":"显著地、出奇地","m":["remarkably"],"note":"","core":"remarkably","forms":["remarkably"],"syn":[],"ex":[{"en":"The patient recovered [[remarkably]] quickly.","zh":"病人恢复得出奇地快。"},{"en":"The two reports are [[remarkably]] similar.","zh":"这两份报告惊人地相似。"}],"ctx":"The first reason is that cash works remarkably well here."},{"id":10,"expr":"a wad of notes","zh":"一沓钞票","m":["wad of notes"],"note":"notes 是英式的“纸币”，美式常说 a wad of bills。","core":"wad of notes","forms":["wad of notes","wads of notes"],"syn":[],"ex":[{"en":"He pulled a [[wad of notes]] from his coat pocket.","zh":"他从外套口袋里掏出一沓钞票。"},{"en":"The thief fled with a thick [[wad of notes]].","zh":"小偷带着厚厚一沓钞票逃走了。"}],"ctx":"Crime is low, so carrying a thick wad of notes feels safe, and cash machines are everywhere, including in almost every convenience store."},{"id":11,"expr":"count for something","zh":"有价值、有分量","m":["counts for something"],"note":"","core":"count for something","forms":["count for something","counts for something","counted for something","counting for something"],"syn":[],"ex":[{"en":"Experience still [[counts for something]] in this business.","zh":"在这一行里，经验仍然是有分量的。"},{"en":"Her opinion [[counts for something]] around here.","zh":"她的意见在这里是说得上话的。"}],"ctx":"Cash also keeps working when the power fails, which counts for something in a country that lives with earthquakes."},{"id":12,"expr":"make up","zh":"构成、占（比例）","m":["make up"],"note":"make up 还有“化妆”“编造”“和好”等意思，这里是“占……”。","core":"make up","forms":["make up","makes up","made up","making up"],"syn":[],"ex":[{"en":"Students [[make up]] nearly half of the audience.","zh":"学生占了观众的近一半。"},{"en":"Women [[make up]] a growing share of the workforce.","zh":"女性在劳动力中的占比越来越大。"}],"ctx":"Older customers, who make up a growing share of the population, tend to trust what they can hold in their hands."},{"id":13,"expr":"tend to","zh":"往往会、倾向于","m":["tend to"],"note":"","core":"tend to","forms":["tend to","tends to","tended to","tending to"],"syn":[],"ex":[{"en":"Prices [[tend to]] rise before the holidays.","zh":"价格往往在假期前上涨。"},{"en":"He [[tends to]] speak quickly when he is nervous.","zh":"他一紧张就容易说得很快。"}],"ctx":"Older customers, who make up a growing share of the population, tend to trust what they can hold in their hands."},{"id":14,"expr":"land on","zh":"（责任、费用）落到……头上","m":["lands on"],"note":"","core":"land on","forms":["land on","lands on","landed on","landing on"],"syn":[],"ex":[{"en":"The blame for the delay [[landed on]] the project manager.","zh":"延误的责任落到了项目经理头上。"},{"en":"If the order is wrong, the cost [[lands on]] the supplier.","zh":"订单要是出错，成本就落在供应商头上。"}],"ctx":"The second reason is that the bill for convenience lands on someone else."},{"id":15,"expr":"hand over","zh":"交出、移交","m":["hand over"],"note":"","core":"hand over","forms":["hand over","hands over","handed over","handing over"],"syn":[],"ex":[{"en":"Please [[hand over]] your passport at the desk.","zh":"请在前台交出您的护照。"},{"en":"The company had to [[hand over]] all its records to the regulator.","zh":"公司不得不把全部记录交给监管机构。"}],"ctx":"Shoppers pay nothing extra to use cash, whereas shops hand over a slice of every card sale to the firms that run the payment networks."},{"id":16,"expr":"a slice of","zh":"一份、一部分（常指分走的那一份）","m":["a slice of"],"note":"","core":"slice of","forms":["slice of","a slice of","slices of"],"syn":[],"ex":[{"en":"The agency takes [[a slice of]] every sale.","zh":"中介从每一笔销售里抽走一份。"},{"en":"Tourism brings the town [[a slice of]] new income.","zh":"旅游给这个小镇带来了一部分新收入。"}],"ctx":"Shoppers pay nothing extra to use cash, whereas shops hand over a slice of every card sale to the firms that run the payment networks."},{"id":17,"expr":"thin margins","zh":"利润微薄","m":["thin margins"],"note":"对应说法：fat margins（利润丰厚）。","core":"thin margins","forms":["thin margins","thin margin"],"syn":[],"ex":[{"en":"Supermarkets operate on [[thin margins]].","zh":"超市是靠微薄的利润率运转的。"},{"en":"Small farms with [[thin margins]] cannot survive a bad harvest.","zh":"利润微薄的小农场扛不住一次歉收。"}],"ctx":"For a small bakery working on thin margins, that slice can be the difference between a profit and a loss."},{"id":18,"expr":"grudgingly","zh":"勉强地、不情愿地","m":["grudgingly"],"note":"","core":"grudgingly","forms":["grudgingly"],"syn":["reluctantly"],"ex":[{"en":"He [[grudgingly]] admitted that she was right.","zh":"他勉强承认她是对的。"},{"en":"The council [[grudgingly]] approved the plan.","zh":"市议会不情不愿地批准了这个计划。"}],"ctx":"Many owners therefore accept cards grudgingly, and a few quietly discourage them."},{"id":19,"expr":"discourage","zh":"劝阻、使打消念头","m":["discourage"],"note":"","core":"discourage","forms":["discourage","discourages","discouraged","discouraging"],"syn":["deter"],"ex":[{"en":"High fees [[discourage]] young people from saving.","zh":"高额费用让年轻人不愿存钱。"},{"en":"Her parents [[discouraged]] her from leaving school.","zh":"她的父母劝她不要退学。"}],"ctx":"Many owners therefore accept cards grudgingly, and a few quietly discourage them."},{"id":20,"expr":"nudge","zh":"（轻轻地）推动、引导","m":["nudge"],"note":"行为经济学里的 nudge（助推）指不强制、只改变选择环境的引导方式。","core":"nudge","forms":["nudge","nudges","nudged","nudging"],"syn":[],"ex":[{"en":"The new rules aim to [[nudge]] drivers towards electric cars.","zh":"新规定的目的是引导司机转向电动车。"},{"en":"A friendly reminder can [[nudge]] people to pay on time.","zh":"一条友好的提醒就能促使人们按时付款。"}],"ctx":"Officials have long tried to nudge people along."},{"id":21,"expr":"dangle","zh":"（用好处）诱惑；悬挂","m":["dangled"],"note":"dangle sth in front of sb：把好处摆在某人面前来引诱。","core":"dangle","forms":["dangle","dangles","dangled","dangling"],"syn":[],"ex":[{"en":"The airline [[dangled]] free upgrades to win over business travellers.","zh":"航空公司拿免费升舱来争取商务旅客。"},{"en":"The manager [[dangled]] the prospect of a promotion in front of her staff.","zh":"经理在员工面前吊着晋升的前景。"}],"ctx":"A few years ago the government dangled rebates in front of anyone who paid by card or phone, and the share of cashless payments crept upward."},{"id":22,"expr":"rebate","zh":"返还款、折扣","m":["rebates"],"note":"","core":"rebate","forms":["rebate","rebates"],"syn":["refund"],"ex":[{"en":"Buyers of electric cars receive a [[rebate]] from the state.","zh":"电动车的买家能从政府那里拿到一笔返还款。"},{"en":"The shop offers [[rebates]] on bulk orders.","zh":"这家店对大宗订单提供返利。"}],"ctx":"A few years ago the government dangled rebates in front of anyone who paid by card or phone, and the share of cashless payments crept upward."},{"id":23,"expr":"creep upward","zh":"缓慢上升","m":["crept upward"],"note":"也可以说 creep up。","core":"creep upward","forms":["creep upward","creeps upward","crept upward","creeping upward"],"syn":[],"ex":[{"en":"Inflation has been [[creeping upward]] all year.","zh":"通胀一整年都在缓慢上升。"},{"en":"Unemployment [[crept upward]] for three months in a row.","zh":"失业率连续三个月缓慢上升。"}],"ctx":"A few years ago the government dangled rebates in front of anyone who paid by card or phone, and the share of cashless payments crept upward."},{"id":24,"expr":"fade","zh":"逐渐减弱、褪去","m":["fade"],"note":"","core":"fade","forms":["fade","fades","faded","fading"],"syn":[],"ex":[{"en":"The excitement began to [[fade]] after the first week.","zh":"头一个星期过后，兴奋劲儿开始消退。"},{"en":"The sound of the music slowly [[faded]] away.","zh":"音乐声慢慢地消失了。"}],"ctx":"But incentives of that kind tend to fade once the money runs out."},{"id":25,"expr":"run out","zh":"（钱、时间、供应）用完","m":["runs out"],"note":"run out of sth 才是“用完了某物”，run out 的主语是被用完的东西。","core":"run out","forms":["run out","runs out","ran out","running out"],"syn":[],"ex":[{"en":"We must finish before the funding [[runs out]].","zh":"我们必须在资金用完之前完成。"},{"en":"The patience of the voters finally [[ran out]].","zh":"选民们的耐心终于耗尽了。"}],"ctx":"But incentives of that kind tend to fade once the money runs out."},{"id":26,"expr":"tip the balance","zh":"起决定作用、打破平衡","m":["tip the balance"],"note":"","core":"tip the balance","forms":["tip the balance","tips the balance","tipped the balance","tipping the balance"],"syn":[],"ex":[{"en":"One late goal [[tipped the balance]] in their favour.","zh":"一个绝杀球让天平倒向了他们这边。"},{"en":"A small tax cut could [[tip the balance]] for undecided voters.","zh":"小小的减税就可能让犹豫不决的选民做出决定。"}],"ctx":"What may finally tip the balance is not persuasion but arithmetic."},{"id":27,"expr":"arithmetic","zh":"算术；（成本收益的）账","m":["arithmetic"],"note":"","core":"arithmetic","forms":["arithmetic"],"syn":[],"ex":[{"en":"The [[arithmetic]] of the deal simply does not work.","zh":"这笔交易的账怎么算都算不过来。"},{"en":"Do the [[arithmetic]] before you sign the lease.","zh":"签租约之前先把账算清楚。"}],"ctx":"What may finally tip the balance is not persuasion but arithmetic."},{"id":28,"expr":"shrink","zh":"缩小、萎缩","m":["shrinking"],"note":"","core":"shrink","forms":["shrink","shrinks","shrank","shrunk","shrinking"],"syn":[],"ex":[{"en":"The town's population has [[shrunk]] by a third.","zh":"这个镇的人口减少了三分之一。"},{"en":"Profits [[shrank]] as costs rose.","zh":"成本上升，利润随之缩水。"}],"ctx":"Japan's workforce is shrinking, and every hour a shopkeeper spends counting the till costs more each year."},{"id":29,"expr":"the till","zh":"收银抽屉、收银机","m":["the till"],"note":"till 还可以作介词，意思和 until 一样；作名词时是英式的“收银机”。","core":"till","forms":["till","tills"],"syn":[],"ex":[{"en":"The cashier counted the [[till]] at closing time.","zh":"收银员在打烊时清点了收银抽屉。"},{"en":"Someone had taken money from the [[till]].","zh":"有人从收银抽屉里拿走了钱。"}],"ctx":"Japan's workforce is shrinking, and every hour a shopkeeper spends counting the till costs more each year."},{"id":30,"expr":"ferry","zh":"（用车、船）来回运送","m":["ferried about"],"note":"ferry sth about / around：把东西来回运送。","core":"ferry","forms":["ferry","ferries","ferried","ferrying"],"syn":[],"ex":[{"en":"Minibuses [[ferry]] guests between the hotel and the beach.","zh":"小巴在酒店和海滩之间接送客人。"},{"en":"Volunteers [[ferried]] supplies to the village by boat.","zh":"志愿者们用船把物资运到村子里。"}],"ctx":"Handling cash is a hidden expense: notes must be counted, banked and ferried about in armoured vans, and someone has to keep all those machines topped up."},{"id":31,"expr":"top up","zh":"补满、加满","m":["topped up"],"note":"","core":"top up","forms":["top up","tops up","topped up","topping up"],"syn":[],"ex":[{"en":"I need to [[top up]] my travel card.","zh":"我得给交通卡充值。"},{"en":"The nurse [[topped up]] the water jug.","zh":"护士把水壶重新加满了。"}],"ctx":"Handling cash is a hidden expense: notes must be counted, banked and ferried about in armoured vans, and someone has to keep all those machines topped up."},{"id":32,"expr":"attachment to","zh":"对……的依恋","m":["attachment to"],"note":"","core":"attachment to","forms":["attachment to","attachments to"],"syn":[],"ex":[{"en":"Her [[attachment to]] the old village never faded.","zh":"她对老村子的依恋从未淡去。"},{"en":"Voters' [[attachment to]] their local hospital is strong.","zh":"选民们对本地医院的感情很深。"}],"ctx":"None of this makes Japan's attachment to cash irrational."},{"id":33,"expr":"stick with","zh":"坚持使用、不改变","m":["stick with"],"note":"","core":"stick with","forms":["stick with","sticks with","stuck with","sticking with"],"syn":[],"ex":[{"en":"I'll [[stick with]] the plan until it clearly fails.","zh":"在计划明显行不通之前，我会坚持用它。"},{"en":"Many fans [[stuck with]] the team through the bad years.","zh":"许多球迷在那些低谷的年头也一直支持这支球队。"}],"ctx":"People stick with what works, and the cost of switching is easy to overlook for those who stand to gain from it."},{"id":34,"expr":"overlook","zh":"忽略、忽视","m":["overlook"],"note":"overlook 还有“俯瞰”的意思：a hotel overlooking the sea。","core":"overlook","forms":["overlook","overlooks","overlooked","overlooking"],"syn":["ignore","neglect"],"ex":[{"en":"It is easy to [[overlook]] small errors in a long report.","zh":"在一份长报告里，很容易忽略小错误。"},{"en":"The committee [[overlooked]] an important detail.","zh":"委员会漏掉了一个重要的细节。"}],"ctx":"People stick with what works, and the cost of switching is easy to overlook for those who stand to gain from it."},{"id":35,"expr":"stand to gain","zh":"有可能获益","m":["stand to gain"],"note":"对应说法：stand to lose（有可能受损）。","core":"stand to gain","forms":["stand to gain","stands to gain","stood to gain"],"syn":[],"ex":[{"en":"Exporters [[stand to gain]] from a weaker currency.","zh":"货币走弱，出口商有可能受益。"},{"en":"Who [[stands to gain]] most from the merger?","zh":"这次合并，谁可能获益最多？"}],"ctx":"People stick with what works, and the cost of switching is easy to overlook for those who stand to gain from it."},{"id":36,"expr":"give way","zh":"让步；屈服；垮掉","m":["give way"],"note":"give way (to sth)：（对……）让步；英式里也指“给别的车辆让路”。","core":"give way","forms":["give way","gives way","gave way","given way","giving way"],"syn":[],"ex":[{"en":"The old rules finally [[gave way]] to a simpler system.","zh":"旧规定终于让位给了一套更简单的制度。"},{"en":"Her anger [[gave way]] to sadness.","zh":"她的愤怒渐渐变成了悲伤。"}],"ctx":"Habits rarely give way because someone has made a persuasive case; they do so when the old way becomes more expensive for those who set the price."},{"id":37,"expr":"make a case","zh":"提出论据、论证","m":["made a persuasive case"],"note":"常见变化：make a strong case for sth（为……提出有力的论证）。","core":"make a case","forms":["make a case","makes a case","made a case","making a case"],"syn":[],"ex":[{"en":"Lawyers [[make a case]] on behalf of their clients.","zh":"律师替当事人陈述理由。"},{"en":"The author [[makes a case]] for slower, deeper reading.","zh":"作者为更慢、更深入的阅读提出了论证。"}],"ctx":"Habits rarely give way because someone has made a persuasive case; th /* ---------- vocabulary highlighting ---------- */
function marked(text, opt){
  opt = opt || {};
  if (!(opt.force || ui.hi)) return [document.createTextNode(text)];
  const out = [];
  let last = 0, m;
  TERM_RE.lastIndex = 0;
  while ((m = TERM_RE.exec(text))){
    const id = TERM_MAP[m[0].toLowerCase()];
    if (opt.only && opt.only !== id) continue;
    if (m.index > last) out.push(document.createTextNode(text.slice(last, m.index)));
    out.push(h('mark', {class:'vw', 'data-v':id, title:VMAP[id].zh}, m[0]));
    last = m.index + m[0].length;
  }
  if (last < text.length) out.push(document.createTextNode(text.slice(last)));
  return out;
}

  refreshSentenceStates();
  placeNote();
}
function step(d){
  const n = active + d;
  if (n < 0 || n >= S.length) return;

  placeNote();

  if (el) el.scrollIntoView({block:'center', behavior:REDUCE ? 'auto' : 'smooth'});
}

      h('div', {class:'note-nav'},
        h('button', {type:'button', class:'btn sm', disabled:active === 0, onclick:function(){ step(-1); }}, '上一句'),
        h('button', {type:'button', class:'btn sm', disabled:active === S.length - 1, onclick:function(){ step(1); }}, '下一句'),

/* ---------- words tab ---------- */
let vFilter = 'all', vQuery = '';
function counts(){
  const c = {all:DATA.vocab.length, new:0, learning:0, mastered:0};
  DATA.vocab.forEach(function(v){ c[getS(v.id)]++; });
  return c;
}
function updateChips(){
  const c = counts();
  $$('#chips .chip').forEach(function(b){
    const f = b.dataset.f;
    b.textContent = (f === 'all' ? '全部' : SLABEL[f]) + ' ' + c[f];
    b.classList.toggle('on', vFilter === f);
    b.setAttribute('aria-pressed', String(vFilter === f));
  });
}
function metaText(id){
  const e = state.vocab[id];
  const bits = [];
  if (e && e.d) bits.push('上次复习 ' + e.d);
  const r = srsGet(srsKey(id));
  if (r) bits.push('复习计划：' + srsStageText(r, Date.now()));
  return bits.join(' · ');
}
function srsKey(id){ return SLUG + ':' + id; }
function statusSeg(id, after){
  const seg = h('div', {class:'seg', role:'group', 'aria-label':'学习状态'});
  const btns = {};
  function sync(){
    const c = getS(id);
    Object.keys(btns).forEach(function(s){
      btns[s].classList.toggle('on', c === s);
      btns[s].setAttribute('aria-pressed', String(c === s));
    });
  }
  ['new','learning','mastered'].forEach(function(s){
    btns[s] = h('button', {type:'button', class:'seg-b s-' + s, onclick:function(){ setS(id, s); sync(); if (after) after(s); }}, SLABEL[s]);

}
function wordCard(v){
  const e = state.vocab[v.id] || {};

    h('p', {class:'w-zh'}, v.zh),
    v.note ? h('p', {class:'w-note'}, v.note) : null,

    })) : null,

function renderWords(){
  const list = $('#wordList');

    }
    return true;
  });
  updateChips();

/* ---------- quiz tab ---------- */
const quiz = {phase:'start', mode:'mcq', scope:'all', items:[], i:0, results:[], pending:null};
const MODES = [['mcq', '选择题'], ['cloze', '文章填空'], ['exs', '例句填空'], ['zh', '中文写英文词'], ['dict', '听写'], ['sent', '中文写英文句']];
const MODE_NAME = Kit.TYPE_NAME;
const MODE_LEAD = {
  mcq:'四选一：看英文选中文意思，或看中文选英文表达，两个方向随机出现。可以按键盘 1–4 作答。',
  cloze:'每题挖掉一个生词。看中文提示和上下文，把它按原句的词形填回去。',
  exs:'换个场景：把生词放回它自己的例句里再填一次，不再靠文章原句的位置，更接近真正会用。',
  zh:'看中文意思，自己拼写出对应的英文表达，词形变化不限。如果你写的是近义词，批改时可以自己判定算对。',
  dict:'听发音，把听到的写下来：有时是单个表达，有时是一整句例句。可以慢速重听。',
  sent:'看一句中文，自己写出整句英文，并用上指定的表达。写完核对参考句，再自己判断对不对。'
};
function modeAvailable(m){ return m !== 'dict' || !!DATA.clips; }
function quizPool(){
  const m = quiz.mode;
  return DATA.vocab.filter(function(v){ return (m !== 'sent' && m !== 'exs') || (v.ex && v.ex.length); }).map(function(v){
    const c = {id:v.id};
    if (m === 'sent' || m === 'exs') c.k = Math.floor(Math.random() * v.ex.length);
    if (m === 'dict') c.k = v.ex && v.ex.length && Math.random() > 0.35 ? Math.floor(Math.random() * v.ex.length) : -1;
    if (m === 'mcq') c.dir = Math.random() < 0.5 ? 'e2z' : 'z2e';
    return c;
  });
}
function todoCount(){ return quizPool().filter(function(c){ return getS(c.id) !== 'mastered'; }).length; }
function startQuiz(scope, ids){
  const pool = quizPool().filter(function(c){
    return ids ? ids.indexOf(c.id) >= 0 : (scope === 'all' || getS(c.id) !== 'mastered');
  });
  if (!pool.length) return;
  quiz.scope = scope;
  quiz.items = shuffle(pool.slice());
  quiz.i = 0; quiz.results = []; quiz.pending = null; quiz.phase = 'q';
  renderQuiz();
}
function renderQuiz(){
  const box = $('#quizBox');
  box.replaceChildren();
  box.append(quiz.phase === 'start' ? quizStart() : quiz.phase === 'q' ? quizQuestion() : quizResult());
  if (quiz.phase === 'q') Kit.focus(box);
}
/* every answer goes into the spaced-repetition plan (shared with the review page) once the learner moves on */
function settle(){
  const r = quiz.pending;
  if (!r) return;
  quiz.pending = null;
  srsRecord(r.key, r.ok);
}
function reviewSummary(){
  const s = srsLoad(), now = Date.now();
  let due = 0, seen = 0;
  DATA.vocab.forEach(function(v){
    const e = s.w[srsKey(v.id)];
    if (!e) return;
    seen++;
    if (e.t <= now) due++;
  });
  return {due:due, seen:seen, fresh:DATA.vocab.length - seen};
}
function quizStart(){
  if (!modeAvailable(quiz.mode)) quiz.mode = 'mcq';
  const all = quizPool().length, todo = todoCount();
  if (quiz.scope === 'todo' && !todo) quiz.scope = 'all';
  const modes = h('div', {class:'chips'});
  MODES.forEach(function(o){
    modes.append(h('button', {type:'button', class:'chip' + (quiz.mode === o[0] ? ' on' : ''), 'aria-pressed':String(quiz.mode === o[0]),
      disabled:!modeAvailable(o[0]), onclick:function(){ quiz.mode = o[0]; renderQuiz(); }}, o[1]));
  });
  const opts = h('div', {class:'chips mt12'});
  [['all', '全部 ' + all + ' 题'], ['todo', '只考未掌握 ' + todo + ' 题']].forEach(function(o){
    opts.append(h('button', {type:'button', class:'chip' + (quiz.scope === o[0] ? ' on' : ''), 'aria-pressed':String(quiz.scope === o[0]), disabled:o[0] === 'todo' && !todo,
      onclick:function(){ quiz.scope = o[0]; renderQuiz(); }}, o[1]));
  });
  const card = h('div', {class:'card'},
    h('h2', {class:'h2'}, '自测'),
    modes,
    h('p', {class:'lead mt12'}, MODE_LEAD[quiz.mode]),
    opts
  );
  const last = state.quiz;
  if (last && last.total) card.append(h('p', {class:'meta mt12'}, '上次成绩 ' + last.score + ' / ' + last.total + (last.k ? '（' + MODE_NAME[last.k] + '）' : '') + (last.d ? '，' + last.d : '')));
  card.append(h('div', {class:'row'}, h('button', {type:'button', class:'btn pri', onclick:function(){ startQuiz(quiz.scope); }}, '开始')));
  const rs = reviewSummary();
  card.append(h('p', {class:'meta mt12'}, '答题结果会记进艾宾浩斯复习计划（只存在这台设备上）。这篇文章：' +
    (rs.due ? rs.due + ' 个词到期该复习' : '暂时没有到期的词') + '，' + rs.fresh + ' 个词还没开始。 ',
    h('a', {href:REVIEW_URL}, '去复习页 →')));
  return card;
}
function quizQuestion(){
  const c = quiz.items[quiz.i], v = VMAP[c.id], total = quiz.items.length;
  return Kit.make({type:quiz.mode, key:srsKey(v.id), id:v.id, v:v, k:c.k, dir:c.dir, clips:DATA.clips || null}, {
    index:quiz.i, total:total, last:quiz.i + 1 >= total,
    pool:function(){ return DATA.vocab; },
    extra:function(item){ return h('div', {class:'fb-s'}, h('span', {class:'meta'}, '标记这个词：'), statusSeg(item.id)); },
    onAnswer:function(res){ quiz.results.push(res); quiz.pending = res; },
    onNext:nextQ
  });
}
function nextQ(){
  settle();
  if (quiz.i + 1 >= quiz.items.length){ finishQuiz(); return; }
  quiz.i++;
  renderQuiz();
}
function finishQuiz(){
  const score = quiz.results.filter(function(r){ return r.ok; }).length;
  state.quiz = {score:score, total:quiz.results.length, d:today(), k:quiz.mode};
  touch();

}
function missRow(m){
  const v = VMAP[m.id];
  const given = m.given ? '　你' + (m.type === 'cloze' || m.type === 'exs' ? '填' : m.type === 'mcq' ? '选' : m.type === 'dict' ? '听写' : '写') + '的：' + m.given : '';
  if (m.type === 'cloze' || m.type === 'exs'){
    const c = m.type === 'cloze' ? v.cloze : Kit.exCloze(v, m.k);
    return h('div', {class:'miss'},
      h('p', {class:'miss-s'}, c.before, h('mark', {class:'vw'}, c.ans), c.after),
      h('p', {class:'meta'}, v.expr + '　' + v.zh + given)
    );
  }
  if (m.type === 'zh') return h('div', {class:'miss'}, h('p', {class:'miss-s'}, v.zh), h('p', {class:'meta'}, '参考答案：' + v.expr + given));
  if (m.type === 'mcq') return h('div', {class:'miss'}, h('p', {class:'miss-s'}, v.expr, '　', v.zh), h('p', {class:'meta'}, given.replace(/^　/, '') || '没有作答'));
  if (m.type === 'dict'){
    const x = m.k >= 0 ? v.ex[m.k] : null;
    return h('div', {class:'miss'}, h('p', {class:'miss-s'}, x ? exNodes(x.en) : v.expr), h('p', {class:'meta'}, (x ? x.zh + '　' : v.zh + '　') + given.replace(/^　/, '')));
  }
  const x = v.ex[m.k];
  return h('div', {class:'miss'}, h('p', {class:'miss-s'}, x.zh), h('p', {class:'miss-s'}, exNodes(x.en)), h('p', {class:'meta'}, v.expr + given));
}
function quizResult(){
  const total = quiz.results.length;
  const misses = quiz.results.filter(function(r){ return !r.ok; });
  const score = total - misses.length;
  const card = h('div', {class:'card'},
    h('p', {class:'eyebrow'}, '本轮成绩 · ' + MODE_NAME[quiz.mode]),
    h('p', {class:'score'}, h('span', {class:'big'}, String(score)), ' / ' + total)
  );
  if (misses.length){
    card.append(h('h3', {class:'h3 mt4'}, '答错的 ' + misses.length + ' 题'));

/* ---------- speaker icons: words, example sentences, article sentences ---------- */
function speakBtn(key, text){ return clipBtn(DATA.clips, key, text); }
function stopNarrationForClip(){

}
function sentBtn(en){
  if (!DATA.audio) return null;
  const i = S.findIndex(function(s){ return s.en === en; }) >= 0 ? S.findIndex(function(s){ return s.en === en; }) : S.findIndex(function(s){ return s.en.indexOf(en) >= 0; });
  if (i < 0) return null;

function playArticleSentence(i, btn){
  const a = getAudio();
  const T = DATA.audio.t[i];
  Clip.stop();
  const wasOn = L.seg && L.seg.btn === btn && !a.paused;
  endSeg();

  const go = function(){ a.currentTime = Math.max(0, T[0] - 0.1); };

function endSeg(){

/* ---------- listen tab ---------- */
const L = {audio:null, cur:-1, loop:false, loopIdx:-1, drag:false, el:{}, spans:[], raf:0, seg:null};
const RATES = [0.75, 0.9, 1, 1.15, 1.3];
function fmtT(t){ t = Math.max(0, Math.floor(t)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
function sentAt(t){
  const T = DATA.audio.t;
  let k = 0;
  for (let i = 0; i < T.length; i++){ if (T[i][0] <= t + 0.05) k = i; else break; }
  return k;
}
function getAudio(){
  if (L.audio) return L.audio;
  const a = new Audio();
  a.preload = 'auto';
  a.src = DATA.audio.src;
  a.playbackRate = ui.rate || 1;
  try { a.preservesPitch = true; a.webkitPreservesPitch = true; } catch(e){}
  a.addEventListener('timeupdate', listenUpdate);
  a.addEventListener('play', function(){ listenPlayState(); loopFrames(); });
  a.addEventListener('pause', function(){ listenPlayState(); if (L.seg && a.currentTime < L.seg.end) endSeg(); });
  a.addEventListener('ended', function(){ listenPlayState(); listenUpdate(); });
  a.addEventListener('error', function(){ L.el.msg.textContent = '音频没有加载出来，请检查网络后再点播放。'; L.el.msg.hidden = false; });
  a.addEventListener('playing', function(){ L.el.msg.hidden = true; });
  L.audio = a;
  try {
    if ('mediaSession' in navigator){
      navigator.mediaSession.metadata = new MediaMetadata({title:DATA.title, artist:'外刊精读'});
      navigator.mediaSession.setActionHandler('play', function(){ a.play(); });
      navigator.mediaSession.setActionHandler('pause', function(){ a.pause(); });
      navigator.mediaSession.setActionHandler('seekbackward', function(){ a.currentTime = Math.max(0, a.currentTime - 5); });
      navigator.mediaSession.setActionHandler('seekforward', function(){ a.currentTime = Math.min(DATA.audio.dur, a.currentTime + 5); });
    }
  } catch(e){}
  return a;
}
function listenPlayState(){
  const playing = !!(L.audio && !L.audio.paused && !L.audio.ended);
  L.el.play.textContent = playing ? '暂停' : '播放';
  L.el.play.setAttribute('aria-pressed', String(playing));
}
function loopFrames(){
  cancelAnimationFrame(L.raf);
  const tick = function(){
    if (!L.audio || L.audio.paused) return;
    listenUpdate();
    L.raf = requestAnimationFrame(tick);
  };
  L.raf = requestAnimationFrame(tick);
}
function listenUpdate(){
  const a = L.audio;
  if (!a) return;
  const T = DATA.audio.t;
  let t = a.currentTime;
  if (L.seg && !a.paused && t >= L.seg.end){ a.pause(); endSeg(); }
  if (L.loop && L.loopIdx >= 0 && !L.seg && !a.paused && t >= T[L.loopIdx][1] + 0.2){ a.currentTime = T[L.loopIdx][0]; t = a.currentTime; }
  if (!L.drag) L.el.range.value = String(t);
  L.el.now.textContent = fmtT(t);
  const k = sentAt(t);
  if (k !== L.cur){
    L.cur = k;
    markListenSentence(!a.paused);
  }
}
function markListenSentence(follow){
  L.spans.forEach(function(sp){ sp.classList.toggle('on', Number(sp.dataset.i) === L.cur); });
  if (follow && ui.tx){
    const sp = L.spans[L.cur];
    if (sp) sp.scrollIntoView({block:'nearest', behavior:REDUCE ? 'auto' : 'smooth'});
  }
}
function playSentence(i){
  endSeg();
  Clip.stop();
  const a = getAudio();
  a.currentTime = DATA.audio.t[i][0];
  if (L.loop) L.loopIdx = i;
  a.play().catch(function(){});
  listenUpdate();
}
function seekBy(d){
  endSeg();
  const a = getAudio();
  a.currentTime = Math.min(DATA.audio.dur, Math.max(0, a.currentTime + d));
  listenUpdate();
}
function setRate(r){
  ui.rate = r; lsSet(LS_UI, ui);
  if (L.audio) L.audio.playbackRate = r;
  $$('.rate-b', L.el.box).forEach(function(b){ const on = Number(b.dataset.r) === r; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
}
function applyTextVisibility(){
  L.el.tr.hidden = !ui.tx;
  L.el.off.hidden = !!ui.tx;
}
function renderListenText(){
  if (!L.el.tr) return;
  L.el.tr.replaceChildren();
  BLOCKS.forEach(function(b){
    const sec = h('section', {class:'blk blk-' + b.type});
    const el = h(b.type === 'title' ? 'h2' : 'p', {class:b.type === 'title' ? 'a-title' : b.type === 'sub' ? 'a-deck' : 'a-para'});
    b.idx.forEach(function(i, k){

      sp.addEventListener('click', function(){ playSentence(i); });

}
function renderListen(){
  const box = $('#listenBox');
  if (!DATA.audio || !box || L.el.box) return;
  L.el.box = box;
  const A = DATA.audio;
  L.el.play = h('button', {type:'button', class:'btn pri big', 'aria-pressed':'false', onclick:function(){
    endSeg();
    Clip.stop();
    const a = getAudio();
    if (a.paused || a.ended){ if (a.ended) a.currentTime = 0; a.play().catch(function(){}); } else a.pause();
  }}, '播放');
  L.el.range = h('input', {type:'range', class:'lp-range', min:0, max:A.dur, step:0.1, value:0, 'aria-label':'播放进度'});
  L.el.range.addEventListener('pointerdown', function(){ L.drag = true; });
  L.el.range.addEventListener('input', function(){
    const a = getAudio();
    a.currentTime = Number(L.el.range.value);
    L.el.now.textContent = fmtT(a.currentTime);
    const k = sentAt(a.currentTime);
    if (k !== L.cur){ L.cur = k; markListenSentence(false); }
  });
  const endDrag = function(){ L.drag = false; };
  L.el.range.addEventListener('change', endDrag);
  L.el.range.addEventListener('pointerup', endDrag);
  L.el.range.addEventListener('pointercancel', endDrag);
  L.el.now = h('span', null, '0:00');
  L.el.msg = h('p', {class:'lp-msg', hidden:true, role:'alert'});
  const rates = h('div', {class:'chips', role:'group', 'aria-label':'播放速度'});
  RATES.forEach(function(r){
    rates.append(h('button', {type:'button', class:'chip rate-b', 'data-r':r, 'aria-pressed':'false', onclick:function(){ setRate(r); }}, r + '×'));
  });
  const loopCb = h('input', {type:'checkbox'});
  loopCb.addEventListener('change', function(){
    L.loop = loopCb.checked;
    L.loopIdx = L.loop ? (L.cur >= 0 ? L.cur : 0) : -1;
  });
  const txCb = h('input', {type:'checkbox'});
  txCb.checked = !!ui.tx;
  txCb.addEventListener('change', function(){ ui.tx = txCb.checked; lsSet(LS_UI, ui); applyTextVisibility(); });
  L.el.tr = h('div', {class:'tr'});
  L.el.off = h('p', {class:'tr-off'}, '原文已隐藏。先盲听一遍，听完再勾选“显示原文”对照。');
  box.append(
    h('div', {class:'card lp'},
      h('h2', {class:'h2'}, '听力'),
      h('p', {class:'lead'}, '整篇文章的朗读（AI 合成的英式发音，语速略慢）。先盲听，再对照原文；点原文里的任意一句，就从那一句开始播放。'),
      h('div', {class:'lp-row'},
        h('button', {type:'button', class:'btn', onclick:function(){ seekBy(-5); }}, '后退 5 秒'),
        L.el.play,
        h('button', {type:'button', class:'btn', onclick:function(){ seekBy(5); }}, '前进 5 秒')
      ),
      h('div', null, L.el.range, h('div', {class:'lp-time'}, L.el.now, h('span', null, fmtT(A.dur)))),
      h('div', null, h('p', {class:'meta'}, '播放速度'), h('div', {class:'row'}, rates)),
      h('div', {class:'lp-row'},
        h('label', {class:'lp-opt'}, loopCb, '单句循环（当前这一句反复听）'),
        h('label', {class:'lp-opt'}, txCb, '显示原文')
      ),
      L.el.msg
    ),
    L.el.off,
    L.el.tr
  );
  setRate(ui.rate || 1);
  renderListenText();
  applyTextVisibility();
}
function renderAll(){
  renderMast();
  renderArticle();
  renderListen();
  renderWords();
  renderThink();
  if (quiz.phase === 'start') renderQuiz();
}
function init(){
  Clip.onBeforePlay(stopNarrationForClip);
  window.addEventListener('pagehide', settle);
  document.addEventListener('visibilitychange', function(){ if (document.hidden) settle(); });
  $('#optZh').checked = !!ui.zh;
  $('#optHi').checked = !!ui.hi;
  $('#optZh').addEventListener('change', function(){ ui.zh = this.checked; lsSet(LS_UI, ui); $('#article').classList.toggle('show-zh', ui.zh); });
  $('#optHi').addEventListener('change', function(){ ui.hi = this.checked; lsSet(LS_UI, ui); renderArticle(); renderListenText(); });
  const chips = $('#chips');
  ['all','new','learning','mastered'].forEach(function(f){
    chips.append(h('button', {type:'button', class:'chip', 'data-f':f, onclick:function(){ vFilter = f; renderWords(); }}, f));
  });
  $('#wordSearch').addEventListener('input', function(){ vQuery = this.value; renderWords(); });
  $$('.tab').forEach(function(b){
    b.addEventListener('click', function(){ try { location.hash = b.dataset.tab; } catch(e){} showTab(b.dataset.tab); });
  });
  window.addEventListener('hashchange', function(){ showTab(location.hash.replace('#','')); });
  if (DATA.audio) $('.tab[data-tab="listen"]').hidden = false;
  renderAll();
  showTab(location.hash.replace('#','') || 'read');
  initCloud();
}
init();
})();
</script>
</body>
</html>
