const DATA = {"sents":[{"kind":"title","en":"Long live cash: why Japan is in no hurry to go cashless","zh":"现金万岁：日本为什么不急着告别现金","notes":["Long live ...! 是欢呼用语，如 Long live the king!，“……万岁”。这里借用来调侃现金。","in no hurry to do sth：一点也不急着做某事。no 加强否定，比 not in a hurry 语气更重。","go cashless：go + 形容词，表示“变成……的状态”；cashless = 无现金的。"],"i":0,"p":0,"n":0,"label":"标题"},{"kind":"sub","en":"In much of the rich world, tapping a phone has replaced fumbling for coins.","zh":"在富裕世界的大部分地方，轻点手机已经取代了摸索着找硬币。","notes":["in much of the rich world：在富裕国家的大部分地区；much of + the + 名词 = “……的大部分”。the rich world 是《经济学人》常用的说法，指发达国家。","tapping a phone 和 fumbling for coins 是两个动名词短语，分别作 has replaced 的主语和宾语。","fumble for：笨手笨脚地摸索着找。fumbling 带出在口袋里翻硬币的狼狈画面，与 tapping 的轻巧形成对比。"],"i":1,"p":0,"n":0,"label":"副标题"},{"kind":"sub","en":"In Japan the old habit survives for reasons that are more rational than they look.","zh":"在日本，这个老习惯留存下来，理由比看上去的更理性。","notes":["for reasons that are ...：that 引导定语从句，修饰 reasons。","more rational than they look：than they look 是省略了形容词的比较结构（= than they look rational），they 指 reasons。","rational：理性的、合乎道理的。先抛出反直觉的论点：看起来落后的习惯，其实有道理。"],"i":2,"p":0,"n":0,"label":"副标题"},{"kind":"body","en":"Stand in the queue at a Tokyo bakery at lunchtime and watch the wallets come out.","zh":"中午在东京一家面包店的队伍里站一会儿，就能看到钱包一个个掏出来。","notes":["Stand ... and watch ...：祈使句 + and，相当于条件句：“只要站在那儿，就会看到……”。","queue 是英式英语的“排队”，美式用 line。全文用英式用词和拼写。","watch + 宾语 + 动词原形：看着某事发生的全过程，所以是 watch the wallets come out。","wallets 借代顾客：用钱包代指掏钱的人。"],"p":1,"i":3,"n":1,"label":"第 1 句"},{"kind":"body","en":"Some customers wave a phone at the reader; a surprising number still count out coins with the unhurried air of people who have nowhere to be.","zh":"有些顾客拿手机对着读卡器一晃；数量惊人的人仍在一枚一枚数着硬币，神态从容，仿佛无处可去。","notes":["分号连接两个并列分句，some ... ; a surprising number ... 形成对照。","wave a phone at the reader：这里的 reader 不是“读者”，而是收银台上的读卡器（刷卡、扫码、碰手机的小机器）；拿手机对着它一晃就付完款了。","a surprising number 后面省略了 of customers，所以谓语用复数 count。","count out：把钱一枚一枚数出来。","with the unhurried air of people ...：带着……的神态；air 在这里是“神态、气质”。who have nowhere to be 是定语从句，意思是没有急着要赶去的地方，也就是不赶时间。"],"p":1,"i":4,"n":2,"label":"第 2 句"},{"kind":"body","en":"To a visitor from Shenzhen or Stockholm, where cash has become a rarity, the scene looks like a time capsule.","zh":"对来自深圳或斯德哥尔摩的游客来说，那些地方现金已经很少见，眼前的场景就像一个时间胶囊。","notes":["where cash has become a rarity 是非限制性定语从句，补充说明 Shenzhen or Stockholm。","a rarity：稀罕物，少见的东西；become a rarity = 变得罕见。","time capsule 本义是封存旧物留给后人的“时间胶囊”，这里比喻保留着旧时代原貌的地方。","To a visitor from ...：介词短语作状语，“在……看来”。"],"p":1,"i":5,"n":3,"label":"第 3 句"},{"kind":"body","en":"Japan's officials see it differently, and have spent years trying to coax shoppers into going cashless.","zh":"日本的官员看法不同，多年来一直想哄着顾客改用无现金支付。","notes":["see it differently：对此看法不同；it 指上一句所说的“时间胶囊”式的印象。","have spent years trying to ...：花了多年时间去尝试；spend + 时间 + (in) doing / trying。","coax sb into doing sth：连哄带劝地让某人做某事；coax 带有耐心、温和的意味，比 force 柔和得多。","go cashless 回应标题，go + 形容词表示“变成”。"],"p":1,"i":6,"n":4,"label":"第 4 句"},{"kind":"body","en":"The first reason is that cash works remarkably well here.","zh":"第一个原因是，现金在这里用起来出奇地好。","notes":["The first reason is that ...：that 引导表语从句；后文的 The second reason 与它呼应。","work well：运转良好，这里指现金这套系统好用。","remarkably：显著地、出奇地，修饰副词 well，比 very 更有评价的意味。"],"p":2,"i":7,"n":5,"label":"第 5 句"},{"kind":"body","en":"Crime is low, so carrying a thick wad of notes feels safe, and cash machines are everywhere, including in almost every convenience store.","zh":"犯罪率低，所以带着厚厚一沓钞票也觉得安全；取款机到处都是，几乎每家便利店里都有。","notes":["so 引出结果：治安好，所以带现金让人觉得安全。carrying ... 是动名词短语作主语，feels 是系动词。","wad：一叠、一卷（钞票或纸）；notes 是英式英语的“纸币”，美式用 bills。","including in almost every convenience store：including 后接介词短语，突出“连便利店里都有”。"],"p":2,"i":8,"n":6,"label":"第 6 句"},{"kind":"body","en":"Cash also keeps working when the power fails, which counts for something in a country that lives with earthquakes.","zh":"停电的时候，现金照样能用，在一个与地震共存的国家，这一点是有分量的。","notes":["which 引导非限制性定语从句，指代前面整句话说的情况（现金停电也能用）。","count for something：有价值、有分量；反义是 count for nothing。","live with：与……共处，习惯其存在。lives with earthquakes 把地震说成日常的“邻居”。","when the power fails：power failure = 停电；fail 在这里是“失灵、断掉”。"],"p":2,"i":9,"n":7,"label":"第 7 句"},{"kind":"body","en":"Older customers, who make up a growing share of the population, tend to trust what they can hold in their hands.","zh":"年长的顾客在人口中占比越来越大，他们往往更信任手里能握住的东西。","notes":["who make up ... 是非限制性定语从句，补充说明 Older customers。","a growing share of the population：占人口的比例越来越大；share of = ……所占的比例，growing 说明这个比例在变大，整个短语作 make up 的宾语。","make up：构成、占（比例）；make up a share of ... = 占……的一部分。","tend to + 动词原形：往往会、倾向于。","what they can hold in their hands：what 引导名词性从句，作 trust 的宾语；“握在手里的”与无形的数字支付形成对比。"],"p":2,"i":10,"n":8,"label":"第 8 句"},{"kind":"body","en":"For them, and for plenty of younger people, the old system is not broken, so there is little to fix.","zh":"对他们，以及对许多年轻人来说，老办法并没有坏，所以也没有多少需要修的地方。","notes":["is not broken, so there is little to fix 化用了英语俗语 If it ain't broke, don't fix it（没坏就别修）。","little to fix：little 表示否定意义的“几乎没有”，后面的不定式 to fix 作后置定语。","plenty of：许多的，后接可数复数或不可数名词，多用于肯定句。"],"p":2,"i":11,"n":9,"label":"第 9 句"},{"kind":"body","en":"The second reason is that the bill for convenience lands on someone else.","zh":"第二个原因是，方便的账单落到了别人头上。","notes":["与 The first reason 呼应，开始第二层理由。","bill for convenience：为“方便”付出的账单。bill 本义是账单，这里是比喻义“代价”；the bill for sth = 为某事买单。意思是：享受方便的人不用付这笔钱，付钱的是别人。","land on：（责任、费用）落到……头上。lands on someone else 暗示：谁用得方便，谁就不用买单。"],"p":3,"i":12,"n":10,"label":"第 10 句"},{"kind":"body","en":"Shoppers pay nothing extra to use cash, whereas shops hand over a slice of every card sale to the firms that run the payment networks.","zh":"顾客用现金不用多付一分钱，而商家每做成一笔刷卡生意，都要把一部分交给运营支付网络的公司。","notes":["whereas：而、然而，连接两个对比的分句。","pay nothing extra：nothing 加形容词后置，“没有额外的……”。","hand over A to B：把 A 交给 B；hand over 带有不得不交出的意味。","a slice of：一块、一份，这里指抽成。slice 本义是切下的一片，比喻分走一部分。","that run the payment networks 是定语从句，修饰 the firms。"],"p":3,"i":13,"n":11,"label":"第 11 句"},{"kind":"body","en":"For a small bakery working on thin margins, that slice can be the difference between a profit and a loss.","zh":"对一家利润微薄的小面包店来说，这一份抽成可能就是盈利与亏损的差别。","notes":["working on thin margins 是现在分词短语，修饰 a small bakery。","margin：利润率、利润空间；thin margins 指利润微薄，对应 fat margins。","that slice 回指上一句的 a slice of every card sale。","the difference between A and B：A 和 B 的差别，强调再小的一笔也可能决定成败。"],"p":3,"i":14,"n":12,"label":"第 12 句"},{"kind":"body","en":"Many owners therefore accept cards grudgingly, and a few quietly discourage them.","zh":"因此，许多店主勉强接受刷卡，还有少数人悄悄地劝阻顾客别刷卡。","notes":["therefore 作连接性副词，插在主语和谓语之间，表示因果。","grudgingly：勉强地、心不甘情不愿地；来自 grudge（怨恨、不情愿）。","discourage：劝阻、使人打消念头；反义词 encourage。","a few 是肯定的“少数几个”；few（不加 a）才是“几乎没有”。"],"p":3,"i":15,"n":13,"label":"第 13 句"},{"kind":"body","en":"Officials have long tried to nudge people along.","zh":"官员们早就想把人们往前推一推。","notes":["have long tried：long 是副词，意思是“很久地”，放在 have 和过去分词之间；have long tried = 早就一直在尝试。谓语是 have tried to ...，long 只是说明“试了很久”。","nudge ... along：nudge 是用肘轻轻推；along 表示顺着路往前，所以 nudge people along = 一点一点推着人们往前走，比喻不强迫、轻轻引导。","nudge 在行为经济学里是“助推”：不强制，只通过改变选项的摆法来影响人的选择。","Officials 承接上一段第 4 句的 Japan's officials，指日本政府官员。"],"p":4,"i":16,"n":14,"label":"第 14 句"},{"kind":"body","en":"A few years ago the government dangled rebates in front of anyone who paid by card or phone, and the share of cashless payments crept upward.","zh":"几年前，政府把返利悬在所有刷卡或用手机付款的人面前，无现金支付的占比慢慢爬了上去。","notes":["dangle ... in front of ...：把诱饵悬在……面前，常带有“用好处引诱”的意味。","rebate：返还的钱、折扣；这里指消费后返还的积分或现金。","anyone who paid ...：anyone 后接 who 定语从句；paid by card or phone，by + 无冠词名词表示付款方式。","the share of ... crept upward：share 是占比；creep：缓慢地爬行，creep upward = 缓慢上升，过去式 crept。"],"p":4,"i":17,"n":15,"label":"第 15 句"},{"kind":"body","en":"But incentives of that kind tend to fade once the money runs out.","zh":"但这类激励措施往往在钱花完之后就慢慢失效了。","notes":["of that kind：那种类型的，后置定语。","fade：逐渐减弱、淡去；原指颜色褪去。","once + 从句：一旦……就……；时间状语从句里用一般现在时表示将来。","run out：（钱、时间、供应）用完；the money runs out 里 run out 是不及物短语。"],"p":4,"i":18,"n":16,"label":"第 16 句"},{"kind":"body","en":"What may finally tip the balance is not persuasion but arithmetic.","zh":"最终可能打破平衡的，不是劝说，而是算账。","notes":["What ... is ...：What may finally tip the balance 是整句的主语从句。","tip the balance：使天平倾斜，指起决定作用；tip 在这里是“使倾斜”。","not A but B：不是 A 而是 B。","arithmetic：算术；这里指成本和收益的账算得过来，与 persuasion（劝说）形成对比。"],"p":5,"i":19,"n":17,"label":"第 17 句"},{"kind":"body","en":"Japan's workforce is shrinking, and every hour a shopkeeper spends counting the till costs more each year.","zh":"日本的劳动力在减少，店主每花一个小时清点收银抽屉，成本都一年比一年高。","notes":["shrink：缩小、萎缩；shrinking 是现在进行时，强调正在发生的趋势。","every hour a shopkeeper spends counting the till：every hour 后省略了关系词 that，a shopkeeper spends counting the till 是定语从句。","workforce：劳动力、全体劳动者的总称（集合名词）；a shrinking workforce 是人口老龄化、少子化带来的结果。","spend + 时间 + doing：花时间做某事。","till：商店的收银抽屉或收银机；counting the till 就是结账时清点现金。","劳动力变少，人工越来越贵，所以同样的一小时一年比一年值钱。"],"p":5,"i":20,"n":18,"label":"第 18 句"},{"kind":"body","en":"Handling cash is a hidden expense: notes must be counted, banked and ferried about in armoured vans, and someone has to keep all those machines topped up.","zh":"处理现金是一笔隐形开支：纸币要清点、存入银行、用运钞车运来运去，还得有人把那些取款机一直补满。","notes":["冒号后面解释 hidden expense 具体包括什么。","must be counted, banked and ferried about：三个并列的被动语态；banked 在这里是动词“存入银行”。","ferry：本义是摆渡，这里指像渡轮一样用车辆来回运送；ferried about 是“被来回运送”，about 表示到处、来回。","armoured vans：运钞车，armour 是装甲，armoured 是“有装甲的、防弹的”；armoured 是英式拼写，美式是 armored。","keep ... topped up：保持（取款机）处于被补满的状态；top up = 把……加满，keep + 宾语 + 过去分词表示保持某个状态。"],"p":5,"i":21,"n":19,"label":"第 19 句"},{"kind":"body","en":"Shops and banks are beginning to realise that the cheapest way to take money is the one with the fewest humans involved.","zh":"商店和银行开始意识到，最便宜的收款方式，是牵涉的人最少的那一种。","notes":["realise 是英式拼写，美式为 realize。","begin to + 动词原形：开始……。","the cheapest way to take money is the one ...：the one 代指 way；take money 是收钱。","with the fewest humans involved：with + 名词 + 过去分词，“有……参与”；involved 作后置定语，修饰 humans。"],"p":5,"i":22,"n":20,"label":"第 20 句"},{"kind":"body","en":"None of this makes Japan's attachment to cash irrational.","zh":"这一切都不会让日本人对现金的依恋变得不理性。","notes":["None of this：这一切都不……；None of + 代词或复数名词作主语。","make + 宾语 + 形容词：使……变得……；irrational 是宾语补足语，与副标题里的 rational 呼应。","attachment to：对……的依恋，这里的 to 是介词，后面接名词。","这句话起收束作用：成本的算账会改变局面，但这不等于日本人“错”了。"],"p":6,"i":23,"n":21,"label":"第 21 句"},{"kind":"body","en":"People stick with what works, and the cost of switching is easy to overlook for those who stand to gain from it.","zh":"人们会坚持用管用的东西，而改用新办法的成本，对那些能从中获益的人来说，很容易被忽略。","notes":["stick with：坚持使用，不换。","what works：what 引导名词性从句，“管用的东西”。","easy to overlook：形容词加不定式，不定式用主动形式表示被动意义（the cost 被忽略）。","stand to gain from：有可能从……获益；stand to + 动词表示“很可能会”。those who ... 指那些推动改用新办法的人。"],"p":6,"i":24,"n":22,"label":"第 22 句"},{"kind":"body","en":"Habits rarely give way because someone has made a persuasive case; they do so when the old way becomes more expensive for those who set the price.","zh":"习惯很少是因为有人提出了有说服力的论证才让步；它们让步，是在旧方式对那些定价的人变得更贵的时候。","notes":["rarely ... because ...：rarely 是否定副词，because 引导的原因被它否定，意思是“很少是因为……”。","give way：让步、屈服，也有“倒塌”的意思；这里指习惯被改变。do so 代替 give way，避免重复。","make a case：提出论据；a persuasive case 是有说服力的论证。has made 是现在完成时。","分号后的分句与前半句结构平行：they do so when ...，形成“不是……而是……”的对照。","those who set the price：那些定价的人，指商家和银行，而不是付钱的顾客。"],"p":6,"i":25,"n":23,"label":"第 23 句"},{"kind":"body","en":"Until then, the bakery queue will remain a quiet standoff between two ways of paying.","zh":"在那之前，面包店里的这支队伍，仍将是两种付款方式之间一场无声的对峙。","notes":["Until then：到那时为止，then 指上一句所说的“旧方式变贵”的时候。","standoff：僵持、对峙，原指双方互不退让的局面。","quiet standoff 呼应开头面包店排队的画面，首尾呼应。","remain + 名词：仍然是，系动词用法。"],"p":6,"i":26,"n":24,"label":"第 24 句"}],"vocab":[{"id":39,"expr":"Long live …!","zh":"……万岁（欢呼语）","m":["Long live"],"note":"这是祝愿式的欢呼：Long live the King! = 国王万岁！live 用原形、不加 s（古老的祈愿句式留下的写法）。标题借它来调侃现金，半开玩笑：现金万岁。反过来，要喊“打倒……”可以说 Down with …!","core":"long live","forms":["long live"],"syn":[],"ex":[{"en":"Crowds in the square shouted, “[[Long live]] the republic!”","zh":"广场上的人群高喊：“共和国万岁！”"},{"en":"The banner read “[[Long live]] the underdog!”","zh":"横幅上写着：“弱者万岁！”"}],"ctx":"Long live cash: why Japan is in no hurry to go cashless"},{"id":40,"expr":"be in no hurry to do sth","zh":"一点也不急着做某事","m":["in no hurry to"],"note":"no 加强否定，in no hurry 比 not in a hurry 语气更重。常见搭配：be in no hurry to do sth / be in no hurry for sth。对比 in a hurry（匆忙、着急）。标题说日本“不急着”告别现金，正文里的 unhurried 讲的是同一种从容。","core":"in no hurry","forms":["in no hurry","in no hurry to"],"syn":[],"ex":[{"en":"I am [[in no hurry to]] leave, so take your time.","zh":"我不急着走，你慢慢来。"},{"en":"The council is [[in no hurry to]] act on the report.","zh":"市议会并不急着按这份报告行动。"}],"ctx":"Long live cash: why Japan is in no hurry to go cashless"},{"id":41,"expr":"go cashless","zh":"改用无现金支付；变成无现金的","m":["go cashless","going cashless"],"note":"go + 形容词 = 变成某种状态：go bald（秃了）、go quiet（安静下来）、go viral（走红）。cashless 由 cash + -less（没有……的）构成，和 jobless、homeless 同一个造词法。标题里是 go cashless，第 4 句里变成 going cashless（介词 into 后面接动名词）。","core":"go cashless","forms":["go cashless","goes cashless","went cashless","going cashless","gone cashless"],"syn":["go digital"],"ex":[{"en":"The festival will [[go cashless]] next year: stalls will take cards only.","zh":"这个节日明年将改用无现金支付：摊位只收刷卡。"},{"en":"Several cities are [[going cashless]] faster than expected.","zh":"好几个城市改用无现金支付的速度比预期的快。"}],"ctx":"Long live cash: why Japan is in no hurry to go cashless"},{"id":42,"expr":"the rich world","zh":"富裕国家、发达国家","m":["the rich world"],"note":"《经济学人》常用 the rich world 指发达经济体，对应 the poor world / the developing world。much of the rich world = 富裕国家的大部分地区（much of + the + 名词 = ……的大部分）。","core":"rich world","forms":["rich world","the rich world"],"syn":["the developed world"],"ex":[{"en":"Populations are ageing fast across [[the rich world]].","zh":"整个富裕国家的人口都在迅速老龄化。"},{"en":"Few jobs in [[the rich world]] are untouched by software.","zh":"在富裕国家，几乎没有哪种工作不受软件影响。"}],"ctx":"In much of the rich world, tapping a phone has replaced fumbling for coins."},{"id":43,"expr":"tap","zh":"轻点；（用手机、卡）碰一下支付","m":["tapping"],"note":"tap 本义是轻轻拍、轻轻敲。用手机或银行卡在读卡器上轻轻一碰就付款，英语里就叫 tap（tap to pay）。tapping a phone 是动名词短语，作 has replaced 的主语，对比后面的 fumbling for coins：一边轻巧，一边笨拙。","core":"tap","forms":["tap","taps","tapped","tapping"],"syn":[],"ex":[{"en":"Just [[tap]] your card on the reader to pay.","zh":"把卡在读卡器上轻轻一碰就能付款。"},{"en":"She [[tapped]] the screen twice to zoom in.","zh":"她轻点了两下屏幕来放大。"}],"ctx":"In much of the rich world, tapping a phone has replaced fumbling for coins."},{"id":1,"expr":"fumble for","zh":"摸索着找（东西）","m":["fumbling for"],"note":"","core":"fumble for","forms":["fumble for","fumbles for","fumbled for","fumbling for"],"syn":[],"ex":[{"en":"He [[fumbled for]] his keys in the dark.","zh":"他在黑暗里摸索着找钥匙。"},{"en":"She stood at the gate, [[fumbling for]] her ticket.","zh":"她站在检票口，在包里摸索着找车票。"}],"ctx":"In much of the rich world, tapping a phone has replaced fumbling for coins."},{"id":44,"expr":"survive","zh":"留存下来；幸存、挺过","m":["survives"],"note":"survive 最常见的意思是“活下来”，也可以指旧事物、旧习惯留存下来：the old habit survives = 老习惯没有消失。名词 survival，幸存者 survivor。","core":"survive","forms":["survive","survives","survived","surviving"],"syn":[],"ex":[{"en":"Few of the old shops [[survived]] the recession.","zh":"老店铺在经济衰退中没挺过去几家。"},{"en":"Some traditions [[survive]] long after their purpose is forgotten.","zh":"有些传统在人们忘了它的用途之后很久仍然留存着。"}],"ctx":"In Japan the old habit survives for reasons that are more rational than they look."},{"id":2,"expr":"rational","zh":"理性的、合乎道理的","m":["rational"],"note":"反义词 irrational 出现在全文倒数第四句。","core":"rational","forms":["rational"],"syn":[],"ex":[{"en":"It was a [[rational]] decision, not an emotional one.","zh":"那是个理性的决定，不是感情用事。"},{"en":"Few people stay fully [[rational]] when they are afraid.","zh":"很少有人在害怕的时候还能完全保持理性。"}],"ctx":"In Japan the old habit survives for reasons that are more rational than they look."},{"id":45,"expr":"queue","zh":"队伍；排队（英式）","m":["queue"],"note":"queue 是英式英语的“排队、队伍”，美式英语说 line（wait in line）。动词短语 queue up = 排队。第 1 句的 the queue 和最后一句的 the bakery queue 是同一支队伍，首尾呼应。","core":"queue","forms":["queue","queues","queued","queuing","queueing"],"syn":["line (US)"],"ex":[{"en":"Hundreds of people [[queued]] outside the shop overnight.","zh":"几百人在店门外排了一夜的队。"},{"en":"Passengers have to [[queue]] in the rain for a taxi.","zh":"乘客得在雨里排队等出租车。"}],"ctx":"Stand in the queue at a Tokyo bakery at lunchtime and watch the wallets come out."},{"id":46,"expr":"wave sth at sb/sth","zh":"（拿着东西）对着……晃一晃","m":["wave a phone at"],"note":"wave 最常见的意思是“挥手”，但 wave sth at sb/sth 是手里拿着某样东西，朝着某人或某物晃动。这里是拿手机对着读卡器一晃就付款，动作轻松随意。","core":"wave","forms":["wave","waves","waved","waving"],"syn":[],"ex":[{"en":"Protesters [[waved]] flags at the passing cars.","zh":"示威者朝过往的车辆挥舞旗子。"},{"en":"She [[waved]] her ticket at the guard and walked through.","zh":"她朝检票员晃了晃车票，就走了过去。"}],"ctx":"Some customers wave a phone at the reader; a surprising number still count out coins with the unhurried air of people who have nowhere to be."},{"id":47,"expr":"reader (card reader)","zh":"读卡器；刷卡、扫码、碰手机的设备","m":["reader"],"note":"注意：这里的 reader 不是“读者”，而是收银台上那台能读取银行卡、手机信息的小机器，也叫 card reader。wave a phone at the reader = 拿手机对着那台机器一晃。同一个词，靠上下文区分：能挥手机对着晃的，不可能是“读者”。","core":"reader","forms":["reader","readers","card reader"],"syn":["card machine"],"ex":[{"en":"Hold your card against the [[reader]] until it beeps.","zh":"把卡贴在读卡器上，直到它嘀的一声。"},{"en":"There is a [[reader]] by the bus door for travel cards.","zh":"公交车门边有一个读卡器，用来刷交通卡。"}],"ctx":"Some customers wave a phone at the reader; a surprising number still count out coins with the unhurried air of people who have nowhere to be."},{"id":48,"expr":"a surprising number of","zh":"数量惊人的（人或物）","m":["a surprising number"],"note":"a number of + 复数名词 = 一些；number 前面加形容词，表示“数量有多大”：a large / growing / surprising number of。原句省略了 of customers，所以谓语 count 用复数。对比：the number of ... is ...（……的数量是……）谓语用单数。","core":"surprising number","forms":["surprising number","a surprising number"],"syn":[],"ex":[{"en":"[[A surprising number of]] passengers still buy paper tickets.","zh":"数量出人意料的乘客仍然买纸质车票。"},{"en":"Museums report [[a surprising number of]] visitors from abroad.","zh":"博物馆称有数量惊人的外国游客。"}],"ctx":"Some customers wave a phone at the reader; a surprising number still count out coins with the unhurried air of people who have nowhere to be."},{"id":3,"expr":"count out","zh":"（一枚一枚地）数出","m":["count out"],"note":"","core":"count out","forms":["count out","counts out","counted out","counting out"],"syn":[],"ex":[{"en":"She [[counted out]] ten coins onto the counter.","zh":"她把十枚硬币一枚一枚数到柜台上。"},{"en":"The cashier [[counted out]] the change slowly.","zh":"收银员慢慢地数出找零。"}],"ctx":"Some customers wave a phone at the reader; a surprising number still count out coins with the unhurried air of people who have nowhere to be."},{"id":4,"expr":"unhurried","zh":"不慌不忙的","m":["unhurried"],"note":"","core":"unhurried","forms":["unhurried"],"syn":["relaxed","leisurely"],"ex":[{"en":"She walked at an [[unhurried]] pace along the river.","zh":"她沿着河边不紧不慢地走。"},{"en":"His [[unhurried]] manner calmed the whole room.","zh":"他从容的态度让整个房间都平静下来。"}],"ctx":"Some customers wave a phone at the reader; a surprising number still count out coins with the unhurried air of people who have nowhere to be."},{"id":5,"expr":"an air of","zh":"……的神态、气派","m":["air of"],"note":"air 作“神态、气氛”时是可数名词单数，常用 an air of + 名词。","core":"air of","forms":["air of"],"syn":[],"ex":[{"en":"He spoke with an [[air of]] quiet authority.","zh":"他说话时带着一种沉稳的权威感。"},{"en":"The old house had an [[air of]] neglect.","zh":"那座老房子有一种无人照管的气息。"}],"ctx":"Some customers wave a phone at the reader; a surprising number still count out coins with the unhurried air of people who have nowhere to be."},{"id":49,"expr":"have nowhere to be","zh":"没有哪儿需要赶去；不赶时间","m":["nowhere to be"],"note":"nowhere to be = 没有任何一个非去不可的地方，常和 have 连用，表示时间充裕、没有约束：I have nowhere to be today. 反过来 have somewhere to be = 得赶去别处了。nowhere 加不定式作后置定语，和 nothing to do、no one to ask 同类。","core":"nowhere to be","forms":["nowhere to be"],"syn":[],"ex":[{"en":"Take your time; I have [[nowhere to be]] this afternoon.","zh":"不用急，我下午哪儿也不用去。"},{"en":"Retired, he had [[nowhere to be]] and read the paper for hours.","zh":"退休之后他不用赶去哪儿，一份报纸能读上好几个小时。"}],"ctx":"Some customers wave a phone at the reader; a surprising number still count out coins with the unhurried air of people who have nowhere to be."},{"id":6,"expr":"a rarity","zh":"稀罕物、少见的东西","m":["a rarity"],"note":"","core":"rarity","forms":["rarity","a rarity","rarities"],"syn":[],"ex":[{"en":"Handwritten letters have become [[a rarity]].","zh":"手写信已经成了稀罕物。"},{"en":"Honest feedback is [[a rarity]] in some offices.","zh":"在有些办公室里，坦率的反馈很难得。"}],"ctx":"To a visitor from Shenzhen or Stockholm, where cash has become a rarity, the scene looks like a time capsule."},{"id":7,"expr":"time capsule","zh":"时间胶囊；保留旧时代原貌的地方","m":["time capsule"],"note":"","core":"time capsule","forms":["time capsule","time capsules"],"syn":[],"ex":[{"en":"The restored cafe feels like a [[time capsule]] from the 1960s.","zh":"这家修复过的咖啡馆像一个来自六十年代的时间胶囊。"},{"en":"The pupils buried a [[time capsule]] under the school garden.","zh":"学生们在学校花园下埋了一个时间胶囊。"}],"ctx":"To a visitor from Shenzhen or Stockholm, where cash has become a rarity, the scene looks like a time capsule."},{"id":50,"expr":"see sth differently","zh":"对……看法不同","m":["see it differently"],"note":"这里的 see 不是“看见”，而是“看待、理解”：see A as B（把 A 看成 B）、see things differently（看法不同）。it 指上一句里“像时间胶囊”的印象：游客觉得这是怀旧，而官员不这么看。","core":"see it differently","forms":["see it differently","sees it differently","saw it differently","seeing it differently"],"syn":[],"ex":[{"en":"My brother and I [[see it differently]], and neither will give way.","zh":"我哥哥和我看法不同，谁也不肯让步。"},{"en":"Economists [[see it differently]]: for them, the trend is a warning.","zh":"经济学家的看法不同：在他们眼里，这个趋势是个警告。"}],"ctx":"Japan's officials see it differently, and have spent years trying to coax shoppers into going cashless."},{"id":51,"expr":"spend time (in) doing sth","zh":"花时间做某事","m":["spent years trying to","spends counting"],"note":"spend + 时间或金钱 + (in) doing sth：花……做某事，后面接 -ing，不接 to do。第 4 句 have spent years trying to coax 是花了好几年想要哄着……；第 18 句 every hour a shopkeeper spends counting the till 是定语从句，省略了 that。","core":"spend","forms":["spend","spends","spent","spending"],"syn":[],"ex":[{"en":"She [[spends]] an hour a day answering emails.","zh":"她每天花一个小时回邮件。"},{"en":"He [[spent]] three years learning to paint.","zh":"他花了三年学画画。"}],"ctx":"Japan's officials see it differently, and have spent years trying to coax shoppers into going cashless."},{"id":8,"expr":"coax","zh":"连哄带劝地使（做某事）","m":["coax"],"note":"常用结构 coax sb into doing sth；也可以 coax sb to do sth。","core":"coax","forms":["coax","coaxes","coaxed","coaxing"],"syn":[],"ex":[{"en":"She [[coaxed]] the shy cat out from under the sofa.","zh":"她把害羞的猫从沙发底下哄了出来。"},{"en":"He tried to [[coax]] his grandmother into using a smartphone.","zh":"他想哄着奶奶用上智能手机。"}],"ctx":"Japan's officials see it differently, and have spent years trying to coax shoppers into going cashless."},{"id":9,"expr":"remarkably","zh":"显著地、出奇地","m":["remarkably"],"note":"","core":"remarkably","forms":["remarkably"],"syn":[],"ex":[{"en":"The patient recovered [[remarkably]] quickly.","zh":"病人恢复得出奇地快。"},{"en":"The two reports are [[remarkably]] similar.","zh":"这两份报告惊人地相似。"}],"ctx":"The first reason is that cash works remarkably well here."},{"id":10,"expr":"a wad of notes","zh":"一沓钞票","m":["wad of notes"],"note":"notes 是英式的“纸币”，美式常说 a wad of bills。","core":"wad of notes","forms":["wad of notes","wads of notes"],"syn":[],"ex":[{"en":"He pulled a [[wad of notes]] from his coat pocket.","zh":"他从外套口袋里掏出一沓钞票。"},{"en":"The thief fled with a thick [[wad of notes]].","zh":"小偷带着厚厚一沓钞票逃走了。"}],"ctx":"Crime is low, so carrying a thick wad of notes feels safe, and cash machines are everywhere, including in almost every convenience store."},{"id":52,"expr":"cash machine","zh":"取款机（英式，= ATM）","m":["cash machines"],"note":"cash machine 是英式说法，美式更常说 ATM（automated teller machine）；英国口语里也说 cashpoint。第 19 句的 machines 指的也是它们。","core":"cash machine","forms":["cash machine","cash machines"],"syn":["ATM"],"ex":[{"en":"The nearest [[cash machine]] is outside the station.","zh":"最近的取款机在车站外面。"},{"en":"Two [[cash machines]] were out of order.","zh":"有两台取款机坏了。"}],"ctx":"Crime is low, so carrying a thick wad of notes feels safe, and cash machines are everywhere, including in almost every convenience store."},{"id":53,"expr":"the power fails","zh":"停电","m":["the power fails"],"note":"这里的 power 是“电力”，不是“权力”。the power fails / goes out / is cut = 停电；名词说法：power cut（英式）、power outage 或 blackout（美式）、power failure。fail 在这里是“失灵、中断”。","core":"power fails","forms":["power fails","power fail","power failed","power failure"],"syn":["a power cut"],"ex":[{"en":"We keep candles in the kitchen in case [[the power fails]].","zh":"我们在厨房里备着蜡烛，以防停电。"},{"en":"The lights went out when [[the power failed]].","zh":"停电的时候，灯全灭了。"}],"ctx":"Cash also keeps working when the power fails, which counts for something in a country that lives with earthquakes."},{"id":11,"expr":"count for something","zh":"有价值、有分量","m":["counts for something"],"note":"","core":"count for something","forms":["count for something","counts for something","counted for something","counting for something"],"syn":[],"ex":[{"en":"Experience still [[counts for something]] in this business.","zh":"在这一行里，经验仍然是有分量的。"},{"en":"Her opinion [[counts for something]] around here.","zh":"她的意见在这里是说得上话的。"}],"ctx":"Cash also keeps working when the power fails, which counts for something in a country that lives with earthquakes."},{"id":54,"expr":"live with","zh":"与……共存；忍受并习惯","m":["lives with"],"note":"live with 除了“和……同住”，还常指“接受并习惯某种不好的状况”：learn to live with pain（学会与疼痛共处）。a country that lives with earthquakes = 一个把地震当作日常的国家。","core":"live with","forms":["live with","lives with","lived with","living with"],"syn":[],"ex":[{"en":"Many coastal towns [[live with]] the threat of flooding.","zh":"许多沿海城镇与洪水的威胁共存。"},{"en":"You will just have to [[live with]] the noise.","zh":"这噪音你只能忍着了。"}],"ctx":"Cash also keeps working when the power fails, which counts for something in a country that lives with earthquakes."},{"id":12,"expr":"make up","zh":"构成、占（比例）","m":["make up"],"note":"make up 还有“化妆”“编造”“和好”等意思，这里是“占……”。","core":"make up","forms":["make up","makes up","made up","making up"],"syn":[],"ex":[{"en":"Students [[make up]] nearly half of the audience.","zh":"学生占了观众的近一半。"},{"en":"Women [[make up]] a growing share of the workforce.","zh":"女性在劳动力中的占比越来越大。"}],"ctx":"Older customers, who make up a growing share of the population, tend to trust what they can hold in their hands."},{"id":55,"expr":"a growing share of","zh":"……中越来越大的一部分、占比","m":["a growing share of","the share of"],"note":"share of = ……所占的比例或份额：a growing / larger / small share of the population。第 8 句 make up a growing share of the population = 占人口的比例越来越大；growing 是现在分词作形容词，说明占比在变大。第 15 句 the share of cashless payments crept upward 里是同一个词：无现金支付的占比。介词用 of，不用 in。","core":"share of","forms":["share of","a share of","the share of","shares of"],"syn":[],"ex":[{"en":"Retired people now hold [[a growing share of]] the country's wealth.","zh":"退休的人现在持有这个国家财富中越来越大的份额。"},{"en":"Online sales have taken [[a growing share of]] the market.","zh":"网络销售占据了市场中越来越大的份额。"}],"ctx":"Older customers, who make up a growing share of the population, tend to trust what they can hold in their hands."},{"id":13,"expr":"tend to","zh":"往往会、倾向于","m":["tend to"],"note":"","core":"tend to","forms":["tend to","tends to","tended to","tending to"],"syn":[],"ex":[{"en":"Prices [[tend to]] rise before the holidays.","zh":"价格往往在假期前上涨。"},{"en":"He [[tends to]] speak quickly when he is nervous.","zh":"他一紧张就容易说得很快。"}],"ctx":"Older customers, who make up a growing share of the population, tend to trust what they can hold in their hands."},{"id":56,"expr":"hold sth in one's hands","zh":"握在手里（指实实在在摸得着的东西）","m":["hold in their hands"],"note":"what they can hold in their hands = 他们能握在手里的东西，what 引导名词性从句，作 trust 的宾语。借“摸得着”来对比看不见的数字支付，近义形容词是 tangible（有形的，可触摸的）。","core":"hold in their hands","forms":["hold in their hands","hold in your hands","hold in his hands","hold in her hands","hold in my hands","hold in our hands"],"syn":["tangible"],"ex":[{"en":"A paper map is something you can [[hold in your hands]].","zh":"纸质地图是你能握在手里的东西。"},{"en":"Some readers want a book they can [[hold in their hands]].","zh":"有些读者想要一本能捧在手里的书。"}],"ctx":"Older customers, who make up a growing share of the population, tend to trust what they can hold in their hands."},{"id":57,"expr":"plenty of","zh":"大量的、许多","m":["plenty of"],"note":"plenty of 后接可数复数或不可数名词，意思是“足够多的、很多”，多用于肯定句；否定句里改用 not enough / not many。plenty of younger people = 不少年轻人。口语例子：There is plenty of time.","core":"plenty of","forms":["plenty of"],"syn":[],"ex":[{"en":"There is [[plenty of]] time before the train leaves.","zh":"离火车开出还有很多时间。"},{"en":"[[Plenty of]] people queue for hours when a new phone comes out.","zh":"新手机上市时，不少人要排几个小时的队。"}],"ctx":"For them, and for plenty of younger people, the old system is not broken, so there is little to fix."},{"id":58,"expr":"not broken (If it ain't broke, don't fix it)","zh":"没坏（没坏就别修）","m":["is not broken"],"note":"这半句化用了俗语 If it ain't broke, don't fix it（没坏就别修）：现有办法还管用，就别折腾着去改。ain't 是美式口语的 isn't；英国也常说 If it isn't broken, don't fix it。后面的 so there is little to fix 呼应：little（不加 a）表示“几乎没有”，a little 才是“一点”。","core":"not broken","forms":["not broken","isn't broken","is not broken"],"syn":[],"ex":[{"en":"The printer is old but [[not broken]], so we kept it.","zh":"这台打印机虽旧但没坏，所以我们留着它。"},{"en":"If the system is [[not broken]], don't fix it.","zh":"系统要是没坏，就别去修它。"}],"ctx":"For them, and for plenty of younger people, the old system is not broken, so there is little to fix."},{"id":59,"expr":"the bill for sth","zh":"为……买单；……的代价","m":["the bill for convenience"],"note":"bill 本义是账单，这里是比喻：享受某种好处最后要有人付的代价。the bill for convenience = 方便的账单：谁用得方便，谁不用买单，账落到别人头上（land on）。相关说法：foot the bill / pick up the bill = 买单、承担费用。这里的 convenience 是抽象名词“方便”，和 convenience store（便利店）里的是同一个词。","core":"bill for","forms":["bill for","the bill for","bills for"],"syn":["the price of"],"ex":[{"en":"Taxpayers will foot [[the bill for]] the new stadium.","zh":"纳税人将为新体育场买单。"},{"en":"Who pays [[the bill for]] a failed policy?","zh":"一项失败的政策，账由谁来付？"}],"ctx":"The second reason is that the bill for convenience lands on someone else."},{"id":14,"expr":"land on","zh":"（责任、费用）落到……头上","m":["lands on"],"note":"","core":"land on","forms":["land on","lands on","landed on","landing on"],"syn":[],"ex":[{"en":"The blame for the delay [[landed on]] the project manager.","zh":"延误的责任落到了项目经理头上。"},{"en":"If the order is wrong, the cost [[lands on]] the supplier.","zh":"订单要是出错，成本就落在供应商头上。"}],"ctx":"The second reason is that the bill for convenience lands on someone else."},{"id":60,"expr":"nothing extra","zh":"没有额外的（东西）、不用多付","m":["nothing extra"],"note":"something / anything / nothing / someone 这类不定代词，形容词要放在后面：nothing special、something new、nothing extra。pay nothing extra = 不用多付钱；相近的说法 at no extra cost = 不收额外费用。","core":"nothing extra","forms":["nothing extra","pay nothing extra"],"syn":["at no extra cost"],"ex":[{"en":"Delivery is included, so you pay [[nothing extra]].","zh":"送货费已经包含在内，所以你不用多付钱。"},{"en":"You can change the date for [[nothing extra]].","zh":"改日期不另外收费。"}],"ctx":"Shoppers pay nothing extra to use cash, whereas shops hand over a slice of every card sale to the firms that run the payment networks."},{"id":61,"expr":"whereas","zh":"而、然而（对比两件事）","m":["whereas"],"note":"whereas 连接两个形成对比的分句：A is X, whereas B is Y。比 while 更正式，也不会像 while 那样可能被读成“当……的时候”，多用于书面语、论文、合同。这里前半句顾客不用付钱，后半句商家要交抽成，一边无成本，一边有成本。","core":"whereas","forms":["whereas"],"syn":["while"],"ex":[{"en":"Some pupils love maths, [[whereas]] others find it dull.","zh":"有些学生喜欢数学，而另一些学生觉得它乏味。"},{"en":"The north is wet, [[whereas]] the south is dry.","zh":"北部多雨，而南部干燥。"}],"ctx":"Shoppers pay nothing extra to use cash, whereas shops hand over a slice of every card sale to the firms that run the payment networks."},{"id":15,"expr":"hand over","zh":"交出、移交","m":["hand over"],"note":"","core":"hand over","forms":["hand over","hands over","handed over","handing over"],"syn":[],"ex":[{"en":"Please [[hand over]] your passport at the desk.","zh":"请在前台交出您的护照。"},{"en":"The company had to [[hand over]] all its records to the regulator.","zh":"公司不得不把全部记录交给监管机构。"}],"ctx":"Shoppers pay nothing extra to use cash, whereas shops hand over a slice of every card sale to the firms that run the payment networks."},{"id":16,"expr":"a slice of","zh":"一份、一部分（常指分走的那一份）","m":["a slice of"],"note":"","core":"slice of","forms":["slice of","a slice of","slices of"],"syn":[],"ex":[{"en":"The agency takes [[a slice of]] every sale.","zh":"中介从每一笔销售里抽走一份。"},{"en":"Tourism brings the town [[a slice of]] new income.","zh":"旅游给这个小镇带来了一部分新收入。"}],"ctx":"Shoppers pay nothing extra to use cash, whereas shops hand over a slice of every card sale to the firms that run the payment networks."},{"id":62,"expr":"run a network / a business","zh":"经营、运营（网络、公司）","m":["run the payment networks"],"note":"run 作“经营、管理、运营”：run a shop / a company / a network。the firms that run the payment networks = 运营支付网络的公司（发卡组织、清算机构一类）。这是 run 的另一个常用义，不同于“跑”，也不同于 run out（用完）。","core":"run","forms":["run","runs","ran","running"],"syn":["operate"],"ex":[{"en":"She [[runs]] a small bakery near the station.","zh":"她在车站附近经营着一家小面包店。"},{"en":"The company [[runs]] a network of three hundred shops.","zh":"这家公司运营着一个有三百家门店的网络。"}],"ctx":"Shoppers pay nothing extra to use cash, whereas shops hand over a slice of every card sale to the firms that run the payment networks."},{"id":17,"expr":"thin margins","zh":"利润微薄","m":["thin margins"],"note":"对应说法：fat margins（利润丰厚）。","core":"thin margins","forms":["thin margins","thin margin"],"syn":[],"ex":[{"en":"Supermarkets operate on [[thin margins]].","zh":"超市是靠微薄的利润率运转的。"},{"en":"Small farms with [[thin margins]] cannot survive a bad harvest.","zh":"利润微薄的小农场扛不住一次歉收。"}],"ctx":"For a small bakery working on thin margins, that slice can be the difference between a profit and a loss."},{"id":63,"expr":"the difference between A and B","zh":"A 与 B 的差别（常指成败之别）","m":["the difference between"],"note":"the difference between a profit and a loss = 盈利与亏损之间的差别。can be the difference between A and B 的意思是“可能就是 A 与 B 的分水岭”，强调一点点差距就足以改变结果，常见于 the difference between life and death（生死之别）这样的搭配。","core":"difference between","forms":["difference between","the difference between"],"syn":[],"ex":[{"en":"A small delay can be [[the difference between]] success and failure.","zh":"小小的延误就可能是成功与失败的分界。"},{"en":"[[The difference between]] the two phones is mostly price.","zh":"这两部手机的差别主要在价格。"}],"ctx":"For a small bakery working on thin margins, that slice can be the difference between a profit and a loss."},{"id":18,"expr":"grudgingly","zh":"勉强地、不情愿地","m":["grudgingly"],"note":"","core":"grudgingly","forms":["grudgingly"],"syn":["reluctantly"],"ex":[{"en":"He [[grudgingly]] admitted that she was right.","zh":"他勉强承认她是对的。"},{"en":"The council [[grudgingly]] approved the plan.","zh":"市议会不情不愿地批准了这个计划。"}],"ctx":"Many owners therefore accept cards grudgingly, and a few quietly discourage them."},{"id":19,"expr":"discourage","zh":"劝阻、使打消念头","m":["discourage"],"note":"","core":"discourage","forms":["discourage","discourages","discouraged","discouraging"],"syn":["deter"],"ex":[{"en":"High fees [[discourage]] young people from saving.","zh":"高额费用让年轻人不愿存钱。"},{"en":"Her parents [[discouraged]] her from leaving school.","zh":"她的父母劝她不要退学。"}],"ctx":"Many owners therefore accept cards grudgingly, and a few quietly discourage them."},{"id":64,"expr":"have long + past participle","zh":"早就……、一直……了很久","m":["have long tried"],"note":"long 在这里是副词，意思是“很长时间地”，放在助动词 have 和过去分词之间：have long tried = 早就一直在尝试。类似：have long been（早就是）、has long argued（一直主张）、had long known（早就知道）。书面语里很常见，比 for a long time 简洁。注意 long 不是动词，句子的谓语是 have tried to。","core":"have long","forms":["have long","has long","had long"],"syn":[],"ex":[{"en":"Scientists [[have long]] suspected a link between the two.","zh":"科学家们早就怀疑两者之间有联系。"},{"en":"The village [[has long]] relied on tourism.","zh":"这个村子长期以来靠旅游业过活。"}],"ctx":"Officials have long tried to nudge people along."},{"id":20,"expr":"nudge sb along","zh":"（轻轻地）推着……往前走；一点一点引导、催着慢慢改变","m":["nudge people along"],"note":"nudge 本义是用手肘轻轻碰一下。along 表示“顺着路往前”，所以 nudge sb along = 一点一点推着某人往前走；比喻义是不强迫，只轻轻引导人们慢慢改变做法。想说明往哪儿推，可以接 into / towards：nudge sb into doing sth、nudge drivers towards electric cars。行为经济学里的 nudge（助推）指不强制、只改变选择环境的引导方式。","core":"nudge","forms":["nudge","nudges","nudged","nudging"],"syn":[],"ex":[{"en":"The new rules aim to [[nudge]] drivers towards electric cars.","zh":"新规定的目的是引导司机转向电动车。"},{"en":"A friendly reminder can [[nudge]] people to pay on time.","zh":"一条友好的提醒就能促使人们按时付款。"},{"en":"The guide kept [[nudging]] the tired hikers along the last mile.","zh":"向导一路轻声催着疲惫的徒步者走完最后一英里。"}],"ctx":"Officials have long tried to nudge people along."},{"id":21,"expr":"dangle","zh":"（用好处）诱惑；悬挂","m":["dangled"],"note":"dangle sth in front of sb：把好处摆在某人面前来引诱。","core":"dangle","forms":["dangle","dangles","dangled","dangling"],"syn":[],"ex":[{"en":"The airline [[dangled]] free upgrades to win over business travellers.","zh":"航空公司拿免费升舱来争取商务旅客。"},{"en":"The manager [[dangled]] the prospect of a promotion in front of her staff.","zh":"经理在员工面前吊着晋升的前景。"}],"ctx":"A few years ago the government dangled rebates in front of anyone who paid by card or phone, and the share of cashless payments crept upward."},{"id":22,"expr":"rebate","zh":"返还款、折扣","m":["rebates"],"note":"","core":"rebate","forms":["rebate","rebates"],"syn":["refund"],"ex":[{"en":"Buyers of electric cars receive a [[rebate]] from the state.","zh":"电动车的买家能从政府那里拿到一笔返还款。"},{"en":"The shop offers [[rebates]] on bulk orders.","zh":"这家店对大宗订单提供返利。"}],"ctx":"A few years ago the government dangled rebates in front of anyone who paid by card or phone, and the share of cashless payments crept upward."},{"id":23,"expr":"creep upward","zh":"缓慢上升","m":["crept upward"],"note":"也可以说 creep up。","core":"creep upward","forms":["creep upward","creeps upward","crept upward","creeping upward"],"syn":[],"ex":[{"en":"Inflation has been [[creeping upward]] all year.","zh":"通胀一整年都在缓慢上升。"},{"en":"Unemployment [[crept upward]] for three months in a row.","zh":"失业率连续三个月缓慢上升。"}],"ctx":"A few years ago the government dangled rebates in front of anyone who paid by card or phone, and the share of cashless payments crept upward."},{"id":65,"expr":"incentive","zh":"激励、刺激（措施）","m":["incentives"],"note":"incentive 指能让人愿意做某事的好处，如奖励、返利、减税：financial incentive（经济激励）。常见结构 an incentive to do sth / for sb to do sth。反义词 disincentive（抑制因素）。重音在第二个音节：in-CEN-tive。","core":"incentive","forms":["incentive","incentives"],"syn":["inducement"],"ex":[{"en":"Tax breaks give firms an [[incentive]] to hire locally.","zh":"减税给了企业在本地雇人的动力。"},{"en":"The scheme offers [[incentives]] for people to recycle.","zh":"这个计划为鼓励回收提供各种激励。"}],"ctx":"But incentives of that kind tend to fade once the money runs out."},{"id":66,"expr":"of that kind","zh":"那一类的、那种的","m":["of that kind"],"note":"of that kind / of this kind：放在名词后面作后置定语，意思是“那种、这类”。incentives of that kind = 那种激励措施，that 回指上一句的“返利”。意思相当于 that kind of incentive，但 of that kind 放在名词后面更书面。","core":"of that kind","forms":["of that kind","of this kind","of the kind"],"syn":[],"ex":[{"en":"I have never seen a mistake [[of that kind]] before.","zh":"这种错误我以前从没见过。"},{"en":"Problems [[of this kind]] are rarely solved quickly.","zh":"这类问题很少能很快解决。"}],"ctx":"But incentives of that kind tend to fade once the money runs out."},{"id":24,"expr":"fade","zh":"逐渐减弱、褪去","m":["fade"],"note":"","core":"fade","forms":["fade","fades","faded","fading"],"syn":[],"ex":[{"en":"The excitement began to [[fade]] after the first week.","zh":"头一个星期过后，兴奋劲儿开始消退。"},{"en":"The sound of the music slowly [[faded]] away.","zh":"音乐声慢慢地消失了。"}],"ctx":"But incentives of that kind tend to fade once the money runs out."},{"id":25,"expr":"run out","zh":"（钱、时间、供应）用完","m":["runs out"],"note":"run out of sth 才是“用完了某物”，run out 的主语是被用完的东西。","core":"run out","forms":["run out","runs out","ran out","running out"],"syn":[],"ex":[{"en":"We must finish before the funding [[runs out]].","zh":"我们必须在资金用完之前完成。"},{"en":"The patience of the voters finally [[ran out]].","zh":"选民们的耐心终于耗尽了。"}],"ctx":"But incentives of that kind tend to fade once the money runs out."},{"id":26,"expr":"tip the balance","zh":"起决定作用、打破平衡","m":["tip the balance"],"note":"","core":"tip the balance","forms":["tip the balance","tips the balance","tipped the balance","tipping the balance"],"syn":[],"ex":[{"en":"One late goal [[tipped the balance]] in their favour.","zh":"一个绝杀球让天平倒向了他们这边。"},{"en":"A small tax cut could [[tip the balance]] for undecided voters.","zh":"小小的减税就可能让犹豫不决的选民做出决定。"}],"ctx":"What may finally tip the balance is not persuasion but arithmetic."},{"id":67,"expr":"persuasion","zh":"说服、劝说","m":["persuasion"],"note":"persuade（动词）→ persuasion（名词）→ persuasive（形容词，有说服力的，最后一段 a persuasive case 里就是它）。persuade sb to do sth = 说服某人做某事。对比第 4 句的 coax：coax 是连哄带劝，persuasion 是靠讲道理。not persuasion but arithmetic = 不是靠劝说，而是靠算账。","core":"persuasion","forms":["persuasion"],"syn":[],"ex":[{"en":"She used gentle [[persuasion]] rather than orders.","zh":"她用的是温和的劝说，而不是命令。"},{"en":"No amount of [[persuasion]] changed his mind.","zh":"怎么劝都没能改变他的主意。"}],"ctx":"What may finally tip the balance is not persuasion but arithmetic."},{"id":27,"expr":"arithmetic","zh":"算术；（成本收益的）账","m":["arithmetic"],"note":"","core":"arithmetic","forms":["arithmetic"],"syn":[],"ex":[{"en":"The [[arithmetic]] of the deal simply does not work.","zh":"这笔交易的账怎么算都算不过来。"},{"en":"Do the [[arithmetic]] before you sign the lease.","zh":"签租约之前先把账算清楚。"}],"ctx":"What may finally tip the balance is not persuasion but arithmetic."},{"id":68,"expr":"workforce","zh":"劳动力、全体员工","m":["workforce"],"note":"workforce 是集合名词，指一个国家、一个行业或一家公司的全部劳动者：a skilled workforce（技术熟练的劳动力）、the global workforce。labour force 是偏经济学的近义词（labour 是英式拼写，美式 labor）。它不等于 workers（具体的人）；a shrinking workforce = 劳动力人数在减少，常和人口老龄化、少子化连在一起，日本正是如此。","core":"workforce","forms":["workforce","workforces"],"syn":["labour force"],"ex":[{"en":"The company has a [[workforce]] of about two thousand.","zh":"这家公司有大约两千名员工。"},{"en":"An ageing population means a smaller [[workforce]].","zh":"人口老龄化意味着劳动力变少。"}],"ctx":"Japan's workforce is shrinking, and every hour a shopkeeper spends counting the till costs more each year."},{"id":28,"expr":"shrink","zh":"缩小、萎缩","m":["shrinking"],"note":"","core":"shrink","forms":["shrink","shrinks","shrank","shrunk","shrinking"],"syn":[],"ex":[{"en":"The town's population has [[shrunk]] by a third.","zh":"这个镇的人口减少了三分之一。"},{"en":"Profits [[shrank]] as costs rose.","zh":"成本上升，利润随之缩水。"}],"ctx":"Japan's workforce is shrinking, and every hour a shopkeeper spends counting the till costs more each year."},{"id":29,"expr":"the till","zh":"收银抽屉、收银机","m":["the till"],"note":"till 还可以作介词，意思和 until 一样；作名词时是英式的“收银机”。","core":"till","forms":["till","tills"],"syn":[],"ex":[{"en":"The cashier counted the [[till]] at closing time.","zh":"收银员在打烊时清点了收银抽屉。"},{"en":"Someone had taken money from the [[till]].","zh":"有人从收银抽屉里拿走了钱。"}],"ctx":"Japan's workforce is shrinking, and every hour a shopkeeper spends counting the till costs more each year."},{"id":70,"expr":"handle","zh":"处理、经手、应付","m":["handling"],"note":"handle 本义是用手拿、摆弄，常引申为“处理、应付、经手”：handle complaints / handle money。名词 handle 是把手、柄。Handling cash 是动名词短语作主语，指经手现金的全过程：收、数、存、运。","core":"handle","forms":["handle","handles","handled","handling"],"syn":["deal with"],"ex":[{"en":"Banks must [[handle]] customer data with care.","zh":"银行必须小心地处理客户数据。"},{"en":"She [[handles]] the accounts for three small firms.","zh":"她替三家小公司经手账目。"}],"ctx":"Handling cash is a hidden expense: notes must be counted, banked and ferried about in armoured vans, and someone has to keep all those machines topped up."},{"id":69,"expr":"hidden expense","zh":"隐形开支、隐性成本","m":["hidden expense"],"note":"hidden 是 hide 的过去分词作形容词：藏起来的、看不见的。hidden cost / hidden expense / hidden fee = 表面上没算进去的成本。冒号后面的内容就是对它的解释：notes must be counted, banked and ferried about ...","core":"hidden expense","forms":["hidden expense","hidden expenses"],"syn":["hidden cost"],"ex":[{"en":"Parking is often a [[hidden expense]] of owning a car.","zh":"停车往往是养车时隐形的开支。"},{"en":"Cheap flights can come with [[hidden expenses]], such as baggage fees.","zh":"廉价机票可能附带隐性开支，比如行李费。"}],"ctx":"Handling cash is a hidden expense: notes must be counted, banked and ferried about in armoured vans, and someone has to keep all those machines topped up."},{"id":71,"expr":"bank (verb)","zh":"（把钱）存入银行","m":["banked"],"note":"bank 除了名词“银行”，还有动词义：把钱存进银行，尤其指商家把当天的收入存入账户。notes must be counted, banked and ferried about：三个被动动词并列，依次是清点、存入、运送，写出了现金要经手的流程。","core":"bank","forms":["bank","banks","banked","banking"],"syn":["deposit"],"ex":[{"en":"The shop owner [[banks]] the takings every evening.","zh":"店主每天晚上把营业收入存进银行。"},{"en":"She [[banked]] the cheque on her way to work.","zh":"她在上班路上把支票存进了银行。"}],"ctx":"Handling cash is a hidden expense: notes must be counted, banked and ferried about in armoured vans, and someone has to keep all those machines topped up."},{"id":30,"expr":"ferry sth about","zh":"（用车、船）来回运送","m":["ferried about"],"note":"ferry 的本义是名词“渡轮、摆渡”（take the ferry = 坐渡轮），作动词时指像渡轮一样来回运送人或物。about = 到处、来回（英式，美式多用 around）：ferry sth about / around。ferried 是过去分词，在 must be counted, banked and ferried about 里构成被动语态；这里是说现金要被一趟趟地运来运去。","core":"ferry","forms":["ferry","ferries","ferried","ferrying"],"syn":[],"ex":[{"en":"Minibuses [[ferry]] guests between the hotel and the beach.","zh":"小巴在酒店和海滩之间接送客人。"},{"en":"Volunteers [[ferried]] supplies to the village by boat.","zh":"志愿者们用船把物资运到村子里。"},{"en":"Parents spend their weekends [[ferrying]] children about.","zh":"父母们把周末都花在开车接送孩子上。"}],"ctx":"Handling cash is a hidden expense: notes must be counted, banked and ferried about in armoured vans, and someone has to keep all those machines topped up."},{"id":72,"expr":"armoured van","zh":"运钞车、装甲车","m":["armoured vans"],"note":"armour = 盔甲、装甲，armoured = 披着装甲的、防弹的；an armoured van 就是专门押运现金的防弹车，也叫 security van。armoured 是英式拼写，美式是 armored（同理 colour / color、labour / labor）。van 是厢式货车。要用这样的车来运现金，说明现金的处理链条又长又贵。","core":"armoured van","forms":["armoured van","armoured vans","armored van","armored vans"],"syn":["security van"],"ex":[{"en":"Guards loaded the cash into an [[armoured van]].","zh":"警卫把现金装进了运钞车。"},{"en":"Two [[armoured vans]] were parked outside the bank.","zh":"有两辆运钞车停在银行外面。"}],"ctx":"Handling cash is a hidden expense: notes must be counted, banked and ferried about in armoured vans, and someone has to keep all those machines topped up."},{"id":31,"expr":"top up","zh":"补满、加满","m":["topped up"],"note":"","core":"top up","forms":["top up","tops up","topped up","topping up"],"syn":[],"ex":[{"en":"I need to [[top up]] my travel card.","zh":"我得给交通卡充值。"},{"en":"The nurse [[topped up]] the water jug.","zh":"护士把水壶重新加满了。"}],"ctx":"Handling cash is a hidden expense: notes must be counted, banked and ferried about in armoured vans, and someone has to keep all those machines topped up."},{"id":73,"expr":"take money (from customers)","zh":"收钱、收款","m":["take money"],"note":"这里的 take money 是“收款”，不是“拿走钱”：商家向顾客 take money = 收到顾客付的钱。the cheapest way to take money = 成本最低的收款方式。同类用法：take payment、take cards（接受刷卡）。对比：take money out = 取钱。","core":"take money","forms":["take money","takes money","took money","taking money"],"syn":["accept payment"],"ex":[{"en":"The stall [[takes money]] only in cash.","zh":"这个摊位只收现金。"},{"en":"Small shops find it hard to [[take money]] by card.","zh":"小店觉得刷卡收款很麻烦。"}],"ctx":"Shops and banks are beginning to realise that the cheapest way to take money is the one with the fewest humans involved."},{"id":74,"expr":"with … involved","zh":"有……参与其中、牵涉……","m":["with the fewest humans involved"],"note":"with + 名词 + 过去分词 = 在……被……的情况下，表示伴随的状态：with the fewest humans involved = 在牵涉的人最少的情况下。fewest 是 few 的最高级，修饰可数名词（不可数用 least）。the one 代指前面的 way。作者特意写 humans 而不是 staff 或 people，带点冷幽默：最便宜的办法，就是把人拿掉。","core":"involved","forms":["involved","involve","involves","involving"],"syn":[],"ex":[{"en":"Keep the plan simple, with as few people [[involved]] as possible.","zh":"计划要简单，尽量少牵涉人。"},{"en":"Any job [[involving]] heavy machinery requires training.","zh":"凡是涉及重型机械的工作都要经过培训。"}],"ctx":"Shops and banks are beginning to realise that the cheapest way to take money is the one with the fewest humans involved."},{"id":32,"expr":"attachment to","zh":"对……的依恋","m":["attachment to"],"note":"","core":"attachment to","forms":["attachment to","attachments to"],"syn":[],"ex":[{"en":"Her [[attachment to]] the old village never faded.","zh":"她对老村子的依恋从未淡去。"},{"en":"Voters' [[attachment to]] their local hospital is strong.","zh":"选民们对本地医院的感情很深。"}],"ctx":"None of this makes Japan's attachment to cash irrational."},{"id":75,"expr":"irrational","zh":"不理性的、不合理的","m":["irrational"],"note":"ir- 是否定前缀（im- / in- / ir- / il- 同一类），irrational = not rational。它和副标题里的 rational 前后呼应：作者说日本人依恋现金并不是不理性的。同类词：irregular、irrelevant、irresponsible。","core":"irrational","forms":["irrational"],"syn":[],"ex":[{"en":"A fear of flying is [[irrational]], but common.","zh":"怕坐飞机并不理性，但很常见。"},{"en":"It would be [[irrational]] to ignore the warning signs.","zh":"无视这些警告信号是不理性的。"}],"ctx":"None of this makes Japan's attachment to cash irrational."},{"id":33,"expr":"stick with","zh":"坚持使用、不改变","m":["stick with"],"note":"","core":"stick with","forms":["stick with","sticks with","stuck with","sticking with"],"syn":[],"ex":[{"en":"I'll [[stick with]] the plan until it clearly fails.","zh":"在计划明显行不通之前，我会坚持用它。"},{"en":"Many fans [[stuck with]] the team through the bad years.","zh":"许多球迷在那些低谷的年头也一直支持这支球队。"}],"ctx":"People stick with what works, and the cost of switching is easy to overlook for those who stand to gain from it."},{"id":76,"expr":"the cost of switching","zh":"转换成本；改用新办法的代价","m":["the cost of switching"],"note":"switching 是 switch（改用、转换）的 -ing 形式，在介词 of 后作动名词。the cost of switching = 转换成本，经济学里常说 switching costs：从一种产品或习惯换到另一种，所付出的时间、金钱和精力。这正是日本人继续用现金的一个原因，而推动改变的人容易忽略它。","core":"cost of switching","forms":["cost of switching","costs of switching"],"syn":["switching costs"],"ex":[{"en":"Many people stay with their bank because [[the cost of switching]] seems high.","zh":"许多人一直用原来的银行，因为换银行的成本看起来很高。"},{"en":"[[The cost of switching]] to a new system is easy to underestimate.","zh":"换用新系统的成本很容易被低估。"}],"ctx":"People stick with what works, and the cost of switching is easy to overlook for those who stand to gain from it."},{"id":34,"expr":"overlook","zh":"忽略、忽视","m":["overlook"],"note":"overlook 还有“俯瞰”的意思：a hotel overlooking the sea。","core":"overlook","forms":["overlook","overlooks","overlooked","overlooking"],"syn":["ignore","neglect"],"ex":[{"en":"It is easy to [[overlook]] small errors in a long report.","zh":"在一份长报告里，很容易忽略小错误。"},{"en":"The committee [[overlooked]] an important detail.","zh":"委员会漏掉了一个重要的细节。"}],"ctx":"People stick with what works, and the cost of switching is easy to overlook for those who stand to gain from it."},{"id":35,"expr":"stand to gain","zh":"有可能获益","m":["stand to gain"],"note":"对应说法：stand to lose（有可能受损）。","core":"stand to gain","forms":["stand to gain","stands to gain","stood to gain"],"syn":[],"ex":[{"en":"Exporters [[stand to gain]] from a weaker currency.","zh":"货币走弱，出口商有可能受益。"},{"en":"Who [[stands to gain]] most from the merger?","zh":"这次合并，谁可能获益最多？"}],"ctx":"People stick with what works, and the cost of switching is easy to overlook for those who stand to gain from it."},{"id":36,"expr":"give way","zh":"让步；屈服；垮掉","m":["give way"],"note":"give way (to sth)：（对……）让步；英式里也指“给别的车辆让路”。","core":"give way","forms":["give way","gives way","gave way","given way","giving way"],"syn":[],"ex":[{"en":"The old rules finally [[gave way]] to a simpler /* ---------- vocabulary highlighting ---------- */
function marked(text, opt){
  opt = opt || {};
  if (!(opt.force || ui.hi)) return [document.createTextNode(text)];
  const out = [];
  let last = 0, m;
  TERM_RE.lastIndex = 0;
  while ((m = TERM_RE.exec(text))){
    const id = TERM_MAP[m[0].toLowerCase()];
    if (opt.only && opt.only !== id) continue;
    if (m.index > last) out.push(document.createTextNode(text.slice(last, m.index)));
    out.push(h('mark', {class:'vw' + (VMAP[id].mine ? ' uw' : ''), 'data-v':id, title:VMAP[id].zh}, m[0]));
    last = m.index + m[0].length;
  }
  if (last < text.length) out.push(document.createTextNode(text.slice(last)));
  return out;
}

    h('p', {class:'eyebrow'}, '本轮成绩 · ' + MODE_NAME[quiz.mode]),
    h('p', {class:'score'}, h('span', {class:'big'}, String(score)), ' / ' + total)
  );
  if (misses.length){
    card.append(h('h3', {class:'h3 mt4'}, '答错的 ' + misses.length + ' 题'));
    misses.forEach(function(m){ card.append(missRow(m)); });
  } else {
    card.append(h('p', {class:'lead'}, '全部答对。'));
  }
  const row = h('div', {class:'row'});
  if (misses.length) row.append(h('button', {type:'button', class:'btn pri', onclick:function(){ startQuiz('all', misses.map(function(m){ return m.id; })); }}, '重做错题'));
  row.append(h('button', {type:'button', class:'btn' + (misses.length ? '' : ' pri'), onclick:function(){ quiz.phase = 'start'; renderQuiz(); }}, '换个题型再测'));
  row.append(h('button', {type:'button', class:'btn', onclick:function(){ showTab('words'); try { location.hash = 'words'; } catch(e){} }}, '去词汇表'));
  row.append(h('a', {class:'btn', href:REVIEW_URL}, '去复习页'));
  if (quiz.hist.length) row.append(h('button', {type:'button', class:'btn', onclick:function(){
    Kit.pager($('#quizBox'), quiz.hist, null, {close:renderQuiz});
    window.scrollTo(0, 0);
  }}, '逐题回看'));
  card.append(row);
  return card;
}

/* ---------- think tab (the long-sentence breakdown) ---------- */
function renderThink(){
  const box = $('#thinkBox');
  box.replaceChildren();
  const bd = DATA.breakdown;
  DATA.vocab.filter(function(v){ return v.kind === 'grammar'; }).forEach(function(v){

  ));

/* ---------- add a word yourself: select text in the article -> 加入生词 ---------- */
function selText(){ try { const s = window.getSelection(); return s && !s.isCollapsed ? s.toString().trim() : ''; } catch(e){ return ''; } }
/* the current selection as {i: sentence index, t: text, o: offset in the sentence} or null (it must lie inside one sentence) */
function selInfo(){
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
  const r = sel.getRangeAt(0);
  function sentOf(n){ const el = n && (n.nodeType === 1 ? n : n.parentNode); return el && el.closest ? el.closest('#article .sent') : null; }
  const a = sentOf(r.startContainer), b = sentOf(r.endContainer);
  if (!a || a !== b) return null;
  const pre = document.createRange();
  pre.selectNodeContents(a); pre.setEnd(r.startContainer, r.startOffset);
  const i = Number(a.dataset.i), en = S[i].en;
  let o = pre.toString().length, t = r.toString();
  /* drop spaces and punctuation at both ends: "elves," -> "elves" */
  const lead = t.match(new RegExp('^[^' + LETTERS + '0-9]*', 'i'))[0].length;
  o += lead; t = t.slice(lead);
  t = t.replace(new RegExp('[^' + LETTERS + '0-9]+$', 'i'), '');
  if (!t || t.length > 80 || en.substr(o, t.length) !== t) return null;
  return {i:i, t:t, o:o};
}
let addBtn = null, selTimer = 0;
function hideAddBtn(){ if (addBtn) addBtn.hidden = true; }
function placeAddBtn(){
  const info = cur === 'read' ? selInfo() : null;
  if (!info){ hideAddBtn(); return; }
  if (!addBtn){
    addBtn = h('button', {type:'button', class:'uw-add', onmousedown:function(e){ e.preventDefault(); }, onclick:function(){
      const x = selInfo() || addBtn._info;
      hideAddBtn();
      if (x) openAddSheet({add:x});
    }}, '＋ 加入生词');
    document.body.append(addBtn);
  }
  addBtn._info = info;
  const rc = window.getSelection().getRangeAt(0).getBoundingClientRect();
  addBtn.hidden = false;
  const w = addBtn.offsetWidth, vw = document.documentElement.clientWidth;
  addBtn.style.left = Math.max(8, Math.min(vw - w - 8, rc.left + rc.width / 2 - w / 2)) + 'px';
  /* below the selection: phones show their own copy menu above it */
  addBtn.style.top = (window.scrollY + rc.bottom + 10) + 'px';
}
function openAddSheet(o){
  const edit = o.edit, x = o.add;
  const s = edit ? null : S[x.i];
  const term = edit ? edit.expr : x.t;
  const old = !edit && DATA.vocab.filter(function(v){ return v.expr.toLowerCase() === term.toLowerCase() || v.m.some(function(t){ return t.toLowerCase() === term.toLowerCase(); }); })[0];
  const zh = h('input', {type:'text', class:'search', maxlength:200, placeholder:'中文意思，比如：精灵', 'aria-label':'中文意思'});
  const note = h('textarea', {rows:2, maxlength:400, placeholder:'笔记（可不写）：搭配、用法、想提醒自己的话', 'aria-label':'笔记'});
  if (edit){ zh.value = edit.zh === '（还没写中文意思）' ? '' : edit.zh; note.value = edit.note || ''; }
  const err = h('p', {class:'uw-err', 'aria-live':'polite'});
  const ctx = edit ? edit.ctx : s.en;
  const bg = h('div', {class:'uw-bg', onclick:function(e){ if (e.target === bg) close(); }});
  function close(){ bg.remove(); document.removeEventListener('keydown', onKey); }
  function onKey(e){ if (e.key === 'Escape') close(); }
  function save(){
    const z = zh.value.trim();
    if (!z){ err.textContent = '写一下中文意思吧，考试时要靠它出题。'; zh.focus(); return; }
    if (edit){ mineEdit(edit.key, {zh:z, n:note.value}); close(); refreshMine(); toast('已更新“' + term + '”'); return; }
    mineAdd(SLUG, {t:x.t, o:x.o, ctx:s.en, czh:s.zh, zh:z, n:note.value});
    try { window.getSelection().removeAllRanges(); } catch(e){}
    close(); refreshMine();
    toast('已加入生词：' + term + '。词汇表、自测和复习页都能看到它。');
  }
  const card = h('div', {class:'uw-sheet', role:'dialog', 'aria-modal':'true', 'aria-label':edit ? '修改生词' : '加入生词'},
    h('p', {class:'eyebrow'}, edit ? '修改生词' : '加入生词'),
    h('h3', {class:'uw-term'}, term),
    h('p', {class:'uw-ctx'}, ctx.slice(0, edit ? 0 : x.o), h('b', null, edit ? '' : term), edit ? ctx : ctx.slice(x.o + term.length)),
    old ? h('p', {class:'uw-old'}, '词汇表里已经有“' + old.expr + '”（' + old.zh + '）。还要再加一个吗？') : null,
    h('label', {class:'uw-f'}, h('span', null, '中文意思'), zh),
    h('label', {class:'uw-f'}, h('span', null, '笔记'), note),
    err,
    h('div', {class:'row'},
      h('button', {type:'button', class:'btn pri', onclick:save}, edit ? '保存' : '加入生词'),
      h('button', {type:'button', class:'btn', onclick:close}, '取消')));
  zh.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); save(); } });
  bg.append(card);
  document.body.append(bg);
  document.addEventListener('keydown', onKey);
  setTimeout(function(){ zh.focus(); }, 30);
}
function refreshMine(){
  loadMine();
  buildTerms();
  renderAll();
  if (L.el.box) renderListenText();
}
let toastTimer = 0;
function toast(msg){
  let t = $('.uw-toast');
  if (!t){ t = h('div', {class:'uw-toast', role:'status'}); document.body.append(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.hidden = true; }, 3200);
}

/* ---------- wiring ---------- */
/* ---------- speaker icons: words, example sentences, article sentences ---------- */
function speakBtn(key, text){ return clipBtn(DATA.clips, key, text); }
function stopNarrationForClip(){
  if (L && L.audio && !L.audio.paused) L.audio.pause();
  if (L) L.seg = null;
}
function sentBtn(en){
  if (!DATA.audio) return null;
  const i = S.findIndex(function(s){ return s.en === en; }) >= 0 ? S.findIndex(function(s){ return s.en === en; }) : S.findIndex(function(s){ return s.en.indexOf(en) >= 0; });
  if (i < 0) return null;
  const b = spkEl('播放这一句', function(){ playArticleSentence(i, b); });
  return b;
}
function playArticleSentence(i, btn){
  const a = getAudio();
  const T = DATA.audio.t[i];
  Clip.stop();
  const wasOn = L.seg && L.seg.btn === btn && !a.paused;
  endSeg();
  if (wasOn){ a.pause(); return; }
  L.seg = {end:T[1] + 0.15, btn:btn};
  btn.classList.add('on');
  const go = function(){ a.currentTime = Math.max(0, T[0] - 0.1); };
  if (a.readyState >= 1) go(); else a.addEventListener('loadedmetadata', go, {once:true});
  const pr = a.play();
  if (pr && pr.catch) pr.catch(function(){ endSeg(); });
}
function endSeg(){
  if (L.seg && L.seg.btn) L.seg.btn.classList.remove('on');
  L.seg = null;
}

/* ---------- listen tab ---------- */
const L = {audio:null, cur:-1, loop:false, loopIdx:-1, drag:false, el:{}, spans:[], raf:0, seg:null};
const RATES = [0.75, 0.9, 1, 1.15, 1.3];
function fmtT(t){ t = Math.max(0, Math.floor(t)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
function sentAt(t){
  const T = DATA.audio.t;
  let k = 0;
  for (let i = 0; i < T.length; i++){ if (T[i][0] <= t + 0.05) k = i; else break; }
  return k;
}
function getAudio(){
  if (L.audio) return L.audio;
  const a = new Audio();
  a.preload = 'auto';
  a.src = DATA.audio.src;
  a.playbackRate = ui.rate || 1;
  try { a.preservesPitch = true; a.webkitPreservesPitch = true; } catch(e){}
  a.addEventListener('timeupdate', listenUpdate);
  a.addEventListener('play', function(){ listenPlayState(); loopFrames(); });
  a.addEventListener('pause', function(){ listenPlayState(); if (L.seg && a.currentTime < L.seg.end) endSeg(); });
  a.addEventListener('ended', function(){ listenPlayState(); listenUpdate(); });
  a.addEventListener('error', function(){ L.el.msg.textContent = '音频没有加载出来，请检查网络后再点播放。'; L.el.msg.hidden = false; });
  a.addEventListener('playing', function(){ L.el.msg.hidden = true; });
  L.audio = a;
  try {
    if ('mediaSession' in navigator){
      navigator.mediaSession.metadata = new MediaMetadata({title:DATA.title, artist:{en:'外刊精读', ko:'韩语入门', ja:'日语中级'}[LANG]});
      navigator.mediaSession.setActionHandler('play', function(){ a.play(); });
      navigator.mediaSession.setActionHandler('pause', function(){ a.pause(); });
      navigator.mediaSession.setActionHandler('seekbackward', function(){ a.currentTime = Math.max(0, a.currentTime - 5); });
      navigator.mediaSession.setActionHandler('seekforward', function(){ a.currentTime = Math.min(DATA.audio.dur, a.currentTime + 5); });
    }
  } catch(e){}
  return a;
}
function listenPlayState(){
  const playing = !!(L.audio && !L.audio.paused && !L.audio.ended);
  L.el.play.textContent = playing ? '暂停' : '播放';
  L.el.play.setAttribute('aria-pressed', String(playing));
}
function loopFrames(){
  cancelAnimationFrame(L.raf);
  const tick = function(){
    if (!L.audio || L.audio.paused) return;
    listenUpdate();
    L.raf = requestAnimationFrame(tick);
  };
  L.raf = requestAnimationFrame(tick);
}
function listenUpdate(){
  const a = L.audio;
  if (!a) return;
  const T = DATA.audio.t;
  let t = a.currentTime;
  if (L.seg && !a.paused && t >= L.seg.end){ a.pause(); endSeg(); }
  if (L.loop && L.loopIdx >= 0 && !L.seg && !a.paused && t >= T[L.loopIdx][1] + 0.2){ a.currentTime = T[L.loopIdx][0]; t = a.currentTime; }
  if (!L.drag) L.el.range.value = String(t);
  L.el.now.textContent = fmtT(t);
  const k = sentAt(t);
  if (k !== L.cur){
    L.cur = k;
    markListenSentence(!a.paused);
  }
}
function markListenSentence(follow){
  L.spans.forEach(function(sp){ sp.classList.toggle('on', Number(sp.dataset.i) === L.cur); });
  if (follow && ui.tx){
    const sp = L.spans[L.cur];
    if (sp) sp.scrollIntoView({block:'nearest', behavior:REDUCE ? 'auto' : 'smooth'});
  }
}
function playSentence(i){
  endSeg();
  Clip.stop();
  const a = getAudio();
  a.currentTime = DATA.audio.t[i][0];
  if (L.loop) L.loopIdx = i;
  a.play().catch(function(){});
  listenUpdate();
}
function seekBy(d){
  endSeg();
  const a = getAudio();
  a.currentTime = Math.min(DATA.audio.dur, Math.max(0, a.currentTime + d));
  listenUpdate();
}
function setRate(r){
  ui.rate = r; lsSet(LS_UI, ui);
  if (L.audio) L.audio.playbackRate = r;
  $$('.rate-b', L.el.box).forEach(function(b){ const on = Number(b.dataset.r) === r; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
}
function applyTextVisibility(){
  L.el.tr.hidden = !ui.tx;
  L.el.off.hidden = !!ui.tx;
}
function renderListenText(){
  if (!L.el.tr) return;
  L.el.tr.replaceChildren();
  BLOCKS.forEach(function(b){
    const sec = h('section', {class:'blk blk-' + b.type});
    const el = h(b.type === 'title' ? 'h2' : 'p', {class:b.type === 'title' ? 'a-title' : b.type === 'sub' ? 'a-deck' : 'a-para'});
    b.idx.forEach(function(i, k){
      if (k > 0) el.append(' ');
      const sp = h('span', {class:'ls', 'data-i':i, tabindex:0, role:'button', 'aria-label':'从这一句开始播放'}, marked(S[i].en));
      sp.addEventListener('click', function(){ playSentence(i); });
      sp.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); playSentence(i); } });
      el.append(sp);
    });
    sec.append(el);
    L.el.tr.append(sec);
  });
  L.spans = $$('.ls', L.el.tr);
  markListenSentence(false);
}
function renderListen(){
  const box = $('#listenBox');
  if (!DATA.audio || !box || L.el.box) return;
  L.el.box = box;
  const A = DATA.audio;
  L.el.play = h('button', {type:'button', class:'btn pri big', 'aria-pressed':'false', onclick:function(){
    endSeg();
    Clip.stop();
    const a = getAudio();
    if (a.paused || a.ended){ if (a.ended) a.currentTime = 0; a.play().catch(function(){}); } else a.pause();
  }}, '播放');
  L.el.range = h('input', {type:'range', class:'lp-range', min:0, max:A.dur, step:0.1, value:0, 'aria-label':'播放进度'});
  L.el.range.addEventListener('pointerdown', function(){ L.drag = true; });
  L.el.range.addEventListener('input', function(){
    const a = getAudio();
    a.currentTime = Number(L.el.range.value);
    L.el.now.textContent = fmtT(a.currentTime);
    const k = sentAt(a.currentTime);
    if (k !== L.cur){ L.cur = k; markListenSentence(false); }
  });
  const endDrag = function(){ L.drag = false; };
  L.el.range.addEventListener('change', endDrag);
  L.el.range.addEventListener('pointerup', endDrag);
  L.el.range.addEventListener('pointercancel', endDrag);
  L.el.now = h('span', null, '0:00');
  L.el.msg = h('p', {class:'lp-msg', hidden:true, role:'alert'});
  const rates = h('div', {class:'chips', role:'group', 'aria-label':'播放速度'});
  RATES.forEach(function(r){
    rates.append(h('button', {type:'button', class:'chip rate-b', 'data-r':r, 'aria-pressed':'false', onclick:function(){ setRate(r); }}, r + '×'));
  });
  const loopCb = h('input', {type:'checkbox'});
  loopCb.addEventListener('change', function(){
    L.loop = loopCb.checked;
    L.loopIdx = L.loop ? (L.cur >= 0 ? L.cur : 0) : -1;
  });
  const txCb = h('input', {type:'checkbox'});
  txCb.checked = !!ui.tx;
  txCb.addEventListener('change', function(){ ui.tx = txCb.checked; lsSet(LS_UI, ui); applyTextVisibility(); });
  L.el.tr = h('div', {class:'tr'});
  L.el.off = h('p', {class:'tr-off'}, '原文已隐藏。先盲听一遍，听完再勾选“显示原文”对照。');
  box.append(
    h('div', {class:'card lp'},
      h('h2', {class:'h2'}, '听力'),
      h('p', {class:'lead'}, '整篇文章的朗读（AI 合成的' + (LANG !== 'en' ? XL : (DATA.audio.voice || '').charAt(0) === 'b' ? '英式' : '美式') + '发音，语速略慢）。先盲听，再对照原文；点原文里的任意一句，就从那一句开始播放。'),
      h('div', {class:'lp-row'},
        h('button', {type:'button', class:'btn', onclick:function(){ seekBy(-5); }}, '后退 5 秒'),
        L.el.play,
        h('button', {type:'button', class:'btn', onclick:function(){ seekBy(5); }}, '前进 5 秒')
      ),
      h('div', null, L.el.range, h('div', {class:'lp-time'}, L.el.now, h('span', null, fmtT(A.dur)))),
      h('div', null, h('p', {class:'meta'}, '播放速度'), h('div', {class:'row'}, rates)),
      h('div', {class:'lp-row'},
        h('label', {class:'lp-opt'}, loopCb, '单句循环（当前这一句反复听）'),
        h('label', {class:'lp-opt'}, txCb, '显示原文')
      ),
      L.el.msg
    ),
    L.el.off,
    L.el.tr
  );
  setRate(ui.rate || 1);
  renderListenText();
  applyTextVisibility();
}
function renderAll(){
  renderMast();
  renderArticle();
  renderListen();
  renderWords();
  renderThink();
  if (quiz.phase === 'start') renderQuiz();
}
function init(){
  Clip.onBeforePlay(stopNarrationForClip);
  window.addEventListener('pagehide', settle);
  document.addEventListener('visibilitychange', function(){ if (document.hidden) settle(); });
  if (LANG !== 'en'){
    const rl = h('label', null, h('input', {type:'checkbox', id:'optRom'}), LANG === 'ja' ? ' 显示读音' : LANG === 'yue' ? ' 显示粤拼' : ' 显示罗马音');
    $('#optZh').parentNode.after(rl);
    $('#optRom').checked = !!ui[ROMK];
    document.body.classList.toggle('show-rom', !!ui[ROMK]);
    $('#optRom').addEventListener('change', function(){ ui[ROMK] = this.checked; lsSet(LS_UI, ui); document.body.classList.toggle('show-rom', ui[ROMK]); });
    const tt = $('.tab[data-tab="think"]');
    if (tt) tt.textContent = LANG === 'ja' ? '语法' : '句型';
  }
  $('#optZh').checked = !!ui.zh;
  $('#optHi').checked = !!ui.hi;
  $('#optZh').addEventListener('change', function(){ ui.zh = this.checked; lsSet(LS_UI, ui); $('#article').classList.toggle('show-zh', ui.zh); });
  $('#optHi').addEventListener('change', function(){ ui.hi = this.checked; lsSet(LS_UI, ui); renderArticle(); renderListenText(); });
  const chips = $('#chips');
  ['all','new','learning','mastered'].forEach(function(f){
    chips.append(h('button', {type:'button', class:'chip', 'data-f':f, onclick:function(){ vFilter = f; renderWords(); }}, f));
  });
  document.addEventListener('selectionchange', function(){ clearTimeout(selTimer); selTimer = setTimeout(placeAddBtn, 180); });
  window.addEventListener('resize', hideAddBtn);
  $('#wordSearch').addEventListener('input', function(){ vQuery = this.value; renderWords(); });
  $$('.tab').forEach(function(b){
    b.addEventListener('click', function(){ try { location.hash = b.dataset.tab; } catch(e){} showTab(b.dataset.tab); });
  });
  window.addEventListener('hashchange', function(){ showTab(location.hash.replace('#','')); });
  if (DATA.audio) $('.tab[data-tab="listen"]').hidden = false;
  renderAll();
  showTab(location.hash.replace('#','') || 'read');
  initCloud();
}
init();
})();
