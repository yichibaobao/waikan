<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Long Live Cash · 外刊精读</title>
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: one 720px reading column under a sticky masthead; four tabs (read, words, quiz, think) share it. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#E8EDF3; --fg:#16202B; --muted:#58656F; --line:#D3DBE4;
  --accent:#2B5C8E; --accent-soft:#DDE9F5; --on-accent:#FFFFFF;
  --koban:#C0392B; --lamp-halo:rgba(192,57,43,.18); --mark:#FBE8A6;
  --good:#27693F; --good-soft:#DDF0E3; --warn:#8A5700; --warn-soft:#FBEBC8; --bad:#B3261E; --bad-soft:#FAE0DD;
  --font-read:'Literata','Iowan Old Style',Georgia,'Songti SC','Noto Serif CJK SC',serif;
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --radius:10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font:16px/1.6 var(--font-ui);background:var(--bg);color:var(--fg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.in{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* masthead */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;font:600 18px/1.2 var(--font-read);letter-spacing:-.01em}
.b-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{flex:none;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font:500 12.5px/1.2 var(--font-ui);color:var(--muted);text-decoration:none;letter-spacing:0}
.back:hover{color:var(--fg);background:var(--surface-2)}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:9px 4px 10px;font:500 14px/1 var(--font-ui);color:var(--muted);cursor:pointer}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}

main{padding-block:22px 56px}
.view[hidden]{display:none}

/* shared */
.eyebrow{font:500 12px/1.2 var(--font-ui);letter-spacing:.08em;color:var(--accent)}
.h2{margin:0 0 6px;font:600 22px/1.3 var(--font-read);text-wrap:balance}
.h3{margin:20px 0 8px;font:600 16px/1.4 var(--font-ui)}
.lead{margin:0 0 14px;color:var(--muted);font-size:15px}
.meta{margin:0;font-size:12.5px;line-height:1.5;color:var(--muted)}
.mono{font-family:var(--font-mono);font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.btn{appearance:none;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:500 14px/1.2 var(--font-ui);cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font:500 13px/1.2 var(--font-ui);color:var(--muted);cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg-b{appearance:none;padding:6px 10px;border:0;border-right:1px solid var(--line);background:none;font:500 12.5px/1.2 var(--font-ui);color:var(--muted);cursor:pointer}
.seg-b:last-child{border-right:0}
.seg-b.on.s-new{background:var(--surface-2);color:var(--fg)}
.seg-b.on.s-learning{background:var(--warn-soft);color:var(--warn)}
.seg-b.on.s-mastered{background:var(--good-soft);color:var(--good)}
textarea{display:block;width:100%;min-height:58px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px;line-height:1.55;resize:vertical}
mark.vw{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}

/* word context line and speaker button (used by the word cards and by the quiz feedback) */
.w-ctx{margin:0;font:italic 400 14.5px/1.65 var(--font-read);color:var(--muted)}
.spk{flex:none;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--accent);cursor:pointer}
.spk:hover{background:var(--accent-soft)}
.spk.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.spk svg{display:block}

/* quiz */
.q-head{display:flex;align-items:center;justify-content:space-between;gap:14px}
.pbar{flex:1;max-width:240px;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.pbar i{display:block;height:100%;width:var(--p,0%);background:var(--accent)}
.q-sent{margin:16px 0 8px;font:400 20px/2.1 var(--font-read);overflow-wrap:anywhere}
.q-input{display:inline-block;max-width:100%;padding:2px 8px;border:0;border-bottom:2px solid var(--accent);border-radius:4px 4px 0 0;background:var(--accent-soft);font:500 18px/1.4 var(--font-mono);text-align:center}
.q-input.ok{border-bottom-color:var(--good);background:var(--good-soft)}
.q-input.bad{border-bottom-color:var(--bad);background:var(--bad-soft)}
.q-hint{margin:0;font-size:14px;color:var(--muted)}
.q-zh{margin:18px 0 6px;font:500 21px/1.6 var(--font-ui);overflow-wrap:anywhere}
.q-line{margin:10px 0 8px}
.q-input.q-wide{display:block;width:100%;box-sizing:border-box;padding:8px 10px;font-size:18px;text-align:left}
.q-area{margin:8px 0 4px;font:400 17px/1.6 var(--font-read)}
.q-tgt{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0 0 6px}
.q-tgt b{padding:1px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font:600 15px/1.5 var(--font-read)}
.miss-s b,.fb b.hl{font-weight:600;background:var(--mark);border-radius:2px;padding:0 1px}
.fb{margin-top:16px;padding:12px 14px;border-radius:8px;background:var(--surface-2)}
.fb.ok{background:var(--good-soft)}
.fb.bad{background:var(--bad-soft)}
.fb p{margin:0 0 6px;font-size:14.5px}
.fb .fb-t{font-weight:600}
.fb.ok .fb-t{color:var(--good)}
.fb.bad .fb-t{color:var(--bad)}
.fb-s{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.score{margin:0 0 12px;font:400 18px/1.2 var(--font-mono);color:var(--muted)}
.score .big{font-size:44px;color:var(--fg)}
.miss{padding:10px 0;border-top:1px solid var(--line)}
.miss-s{margin:0 0 4px;font:400 17px/1.7 var(--font-read)}

.mt4{margin-top:4px}
.mt10{margin-top:10px}
.mt12{margin-top:12px}
.mb12{margin-bottom:12px}
.mb14{margin-bottom:14px}
.mb16{margin-bottom:16px}
.foot{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.7;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* quiz kit: multiple choice, dictation, feedback pieces */
.q-ask{margin:14px 0 0;font-size:14px;color:var(--muted)}
.q-big{margin:6px 0 0;font:600 26px/1.35 var(--font-read);overflow-wrap:anywhere}
.q-big .spk{vertical-align:middle;margin-left:6px}
.q-ctx{margin:8px 0 0;font:italic 400 15.5px/1.7 var(--font-read);color:var(--muted)}
.mc{display:grid;gap:8px;margin:16px 0 4px}
.mc-b{appearance:none;display:flex;align-items:flex-start;gap:10px;width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:9px;background:var(--surface);text-align:left;font:400 16px/1.5 var(--font-ui);color:var(--fg);cursor:pointer}
.mc-b:hover:not(:disabled){background:var(--surface-2)}
.mc-b .n{flex:none;width:20px;height:20px;margin-top:1px;border:1px solid var(--line);border-radius:50%;font:500 11.5px/18px var(--font-mono);text-align:center;color:var(--muted)}
.mc-b.ok{border-color:var(--good);background:var(--good-soft)}
.mc-b.bad{border-color:var(--bad);background:var(--bad-soft)}
.mc-b:disabled{cursor:default;opacity:1;color:var(--fg)}
.dict-btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 10px}
.btn.play{display:inline-flex;align-items:center;gap:7px}
.btn.play svg{display:block}
.btn.play.on{box-shadow:0 0 0 2px var(--accent-soft)}
.df{margin:0 0 8px;font:400 16.5px/1.7 var(--font-read)}
.df-l{display:block;font:500 12px/1.5 var(--font-ui);color:var(--muted)}
.miss-t{color:var(--bad);text-decoration:underline wavy;text-decoration-thickness:1px;text-underline-offset:3px}
.fb-x:empty{display:none}
.w-note{margin:0 0 6px;font-size:13.5px;line-height:1.6;color:var(--muted)}

/* learner picker, account chip and the backup / restore sheet (inlined by tools/build.py; self-contained, every class starts with who-) */
.who-chip{appearance:none;display:inline-flex;align-items:center;gap:8px;flex:none;max-width:100%;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font:500 13px/1.2 var(--font-ui);color:var(--fg);cursor:pointer}
.who-chip.full{padding-right:12px}
.who-chip:hover{background:var(--surface-2)}
.who-chip.tiny{border-color:transparent;background:none}
.who-nm{min-width:0;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-av{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font:600 14px/1 var(--font-ui)}
.who-av.lg{width:40px;height:40px;font-size:18px}

.who-ov{position:fixed;inset:0;z-index:1000;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--bg);display:flex;justify-content:center;align-items:flex-start;padding:max(28px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(32px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.who-ov.sheet{background:rgba(22,32,43,.45)}
.who-ov.sheet .who-card{margin:auto}
.who-card{width:100%;max-width:440px;padding:22px 20px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.who-ov:not(.sheet) .who-card{margin-top:4vh;border:0;background:transparent;padding:8px 4px}
.who-eb{margin:0 0 6px;font:500 12px/1.2 var(--font-ui);letter-spacing:.1em;color:var(--accent)}
.who-h{margin:0;font:600 clamp(26px,7vw,34px)/1.2 var(--font-read);letter-spacing:-.01em}
.who-h.sm{font-size:19px}
.who-sub{margin:8px 0 0;font-size:15px;line-height:1.6;color:var(--muted)}
.who-sec{margin:20px 0 8px;font:600 13px/1.3 var(--font-ui);color:var(--muted)}
.who-list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.who-p{appearance:none;display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;cursor:pointer}
.who-p:hover{background:var(--surface-2)}
.who-pn{display:block;font:600 16px/1.3 var(--font-ui)}
.who-pm{display:block;margin-top:2px;font-size:12.5px;line-height:1.4;color:var(--muted)}
.who-new{display:flex;gap:8px;margin:0}
.who-in{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font:400 16px/1.3 var(--font-ui)}
.who-in:focus{outline:2px solid var(--accent);outline-offset:1px}
.who-ta{display:block;width:100%;min-height:96px;margin:8px 0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font:400 12.5px/1.5 var(--font-mono);resize:vertical;word-break:break-all}
.who-btn{appearance:none;padding:10px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font:500 14.5px/1.2 var(--font-ui);color:var(--fg);cursor:pointer}
.who-btn:hover{background:var(--surface-2)}
.who-btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.who-btn.pri:hover{filter:brightness(1.06)}
.who-btn.dng{background:var(--bad,#B3261E);border-color:var(--bad,#B3261E);color:#fff}
.who-btn:disabled{opacity:.45;cursor:default}
.who-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.who-link{appearance:none;display:inline-block;margin:14px 0 0;padding:6px 0;border:0;background:none;font:500 14px/1.3 var(--font-ui);color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.who-msg{min-height:1.4em;margin:8px 0 0;font-size:13.5px;line-height:1.5;color:var(--muted)}
.who-msg.err{color:var(--bad,#B3261E)}
.who-msg.ok{color:var(--good,#27693F)}
.who-note{margin:18px 0 0;font-size:12.5px;line-height:1.7;color:var(--muted)}
.who-menu{display:grid;gap:8px;margin:16px 0 0}
.who-mi{appearance:none;display:block;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;cursor:pointer}
.who-mi:hover{background:var(--surface-2)}
.who-mi b{display:block;font:600 15px/1.3 var(--font-ui)}
.who-mi span{display:block;margin-top:2px;font-size:12.5px;line-height:1.45;color:var(--muted)}
.who-mi.dng b{color:var(--bad,#B3261E)}
.who-x{appearance:none;float:right;margin:-6px -6px 0 8px;width:36px;height:36px;border:0;border-radius:50%;background:none;font-size:24px;line-height:1;color:var(--muted);cursor:pointer}
.who-x:hover{background:var(--surface-2)}
.who-top{display:flex;align-items:center;gap:12px}

</style>
<style>
/* reader-specific styles; the shared ones are in tools/shared/base.css */
.lamp{flex:none;width:10px;height:10px;border-radius:50%;background:var(--koban);box-shadow:0 0 0 4px var(--lamp-halo)}
.prog{flex:none;text-align:right}
.prog .t{font-size:12px;line-height:1.3;color:var(--muted)}
.prog b{font:400 13px/1.3 var(--font-mono);color:var(--fg)}
.meter{width:112px;height:3px;margin:4px 0 3px auto;border-radius:2px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;width:var(--p,0%);background:var(--good)}
.prog .s{font-size:11px;min-height:14px}

/* listen */
.lp{display:grid;gap:14px}
.lp-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn.big{min-width:96px;padding:12px 22px;font-size:16px}
.lp-range{display:block;width:100%;margin:0;accent-color:var(--accent)}
.lp-time{display:flex;justify-content:space-between;margin-top:2px;font:400 12.5px/1 var(--font-mono);color:var(--muted)}
.lp-opt{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer}
.lp-opt input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.lp-msg{margin:0;font-size:13px;color:var(--bad)}
.tr{margin-top:22px}
.tr-off{margin-top:18px;padding:22px 16px;text-align:center;font-size:14.5px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius)}
.ls{cursor:pointer;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;scroll-margin-top:140px;scroll-margin-bottom:90px}
.ls:hover{background:var(--surface-2)}
.ls.on{background:var(--accent-soft)}

/* read */
.opts{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:22px;font-size:14px;color:var(--muted)}
.opts label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.opts input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.a-title{margin:0 0 12px;font:600 clamp(26px,6.4vw,34px)/1.15 var(--font-read);letter-spacing:-.015em;text-wrap:balance}
.a-deck{margin:0;font:italic 400 18px/1.55 var(--font-read);color:var(--muted);text-wrap:pretty}
.a-para{margin:0;font:400 18px/1.75 var(--font-read)}
.blk{margin-bottom:24px}
.blk-sub{margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.sent{cursor:pointer;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;scroll-margin-top:120px}
.sent:hover{background:var(--surface-2)}
.sent.on{background:var(--accent-soft)}
.zh{display:none;margin:10px 0 0;font:400 15px/1.75 var(--font-ui);color:var(--muted)}
.show-zh .zh{display:block}
.note{margin-top:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);scroll-margin-top:120px}
.note-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.note-nav{display:flex;gap:6px}
.note-zh{margin:0 0 10px;font:500 16px/1.7 var(--font-ui)}
.note-list{margin:0;padding-left:1.15em;font-size:14.5px;line-height:1.7}
.note-list li{margin-bottom:5px}

/* words */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1 1 200px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px}
.word{display:grid;gap:9px;margin-bottom:10px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.word-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.w-expr{margin:0;min-width:0;font:600 18px/1.35 var(--font-read);overflow-wrap:anywhere}
.w-zh{margin:0;font-size:15px}
.w-head{display:flex;align-items:center;gap:8px;min-width:0}
.w-ctxrow{display:flex;align-items:flex-start;gap:10px}
.w-ctxrow .w-ctx{flex:1;min-width:0}
.ex-row{display:flex;align-items:flex-start;gap:10px}
.ex-body{min-width:0}
.w-tag{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font:500 11px/1.6 var(--font-ui);vertical-align:3px;white-space:nowrap}
.w-note{margin:0;font-size:13.5px;line-height:1.6;color:var(--muted)}
.w-exh{margin:2px 0 -3px;font-size:12px;color:var(--muted)}
.w-ex{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.w-ex li{padding-left:12px;border-left:2px solid var(--line)}
.ex-en{display:block;font:400 15px/1.6 var(--font-read)}
.ex-en b{font-weight:600;background:var(--mark);border-radius:2px;padding:0 1px}
.ex-zh{display:block;margin-top:1px;font-size:13.5px;line-height:1.55;color:var(--muted)}
.w-mine>span{display:block;margin-bottom:4px;font-size:12px;color:var(--muted)}
.w-meta{margin:0;min-height:16px;font:400 12px/1.4 var(--font-mono);color:var(--muted)}
.empty{padding:28px 0;text-align:center;color:var(--muted)}

/* think */
.bd{margin:0 0 12px;font:400 19px/1.75 var(--font-read)}
.qa{margin-bottom:16px}
.qa-q{margin:0 0 6px;font-size:15.5px}
</style>
</head>
<body>

<div class="bar">
  <div class="in">
    <div class="mast">
      <div class="brand"><a class="back" href="../../">‹ 合集</a><span class="b-title">Long Live Cash</span></div>
      <div class="prog">
        <div class="t">已掌握 <b id="mCount">0 / 0</b></div>
        <div class="meter" id="meter"><i></i></div>
        <div class="t s" id="saveNote" aria-live="polite"></div>
      </div>
      <span id="whoMount"></span>
    </div>
    <nav class="tabs" role="tablist" aria-label="页面">
      <button type="button" class="tab" role="tab" data-tab="read">精读</button>

<script>
(function(){
'use strict';
/* ---------- small helpers shared by every page (inlined by tools/build.py) ---------- */
function $(s, r){ return (r || document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function h(tag, attrs){
  const e = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(k){
    const v = attrs[k];
    if (v == null || v === false) return;
    if (k === 'class') e.className = v;
    else if (k.slice(0,2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : String(v));
  });
  Array.prototype.slice.call(arguments, 2).forEach(function(kid){
    [].concat(kid).forEach(function(k){
      if (k == null || k === false) return;
      e.append(k.nodeType ? k : document.createTextNode(String(k)));
    });
  });
  return e;
}
function pad2(n){ return String(n).padStart(2, '0'); }
function ymd(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function today(){ return ymd(new Date()); }
/* Progress is kept per learner: key "k" of learner "u1" lives in localStorage as "k@u1". who.js manages the learners
   (the list is in WHO_KEY, which itself is never namespaced). WHO_ID is '' until someone has been chosen. */
const WHO_KEY = 'wk-who-v1';
function whoReg(){
  const out = {v:1, cur:'', list:[], claimed:false};
  let d = null;
  try { d = JSON.parse(localStorage.getItem(WHO_KEY) || 'null'); } catch(e){}
  if (!d || typeof d !== 'object') return out;
  if (Array.isArray(d.list)) d.list.forEach(function(p){
    if (p && typeof p.id === 'string' && /^[a-z0-9]{3,24}$/.test(p.id) && typeof p.name === 'string' && p.name.trim() &&
        !out.list.some(function(q){ return q.id === p.id; }))
      out.list.push({id:p.id, name:p.name.trim().slice(0, 16), c:typeof p.c === 'number' ? p.c : 0, u:typeof p.u === 'number' ? p.u : 0});
  });
  if (typeof d.cur === 'string' && out.list.some(function(p){ return p.id === d.cur; })) out.cur = d.cur;
  out.claimed = !!d.claimed;
  return out;
}
let WHO_ID = whoReg().cur;
function pkey(k){ return WHO_ID ? k + '@' + WHO_ID : k; }
function lsGet(k){ try { return JSON.parse(localStorage.getItem(pkey(k)) || 'null'); } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem(pkey(k), JSON.stringify(v)); } catch(e){} }
function lsDel(k){ try { localStorage.removeItem(pkey(k)); } catch(e){} }
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function norm(s){ return String(s).toLowerCase().replace(/[^a-z]/g, ''); }
function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
/* example sentences mark their target as [[target]] */
function exNodes(s){
  const out = [];
  s.split(/\[\[(.+?)\]\]/).forEach(function(part, k){ if (part) out.push(k % 2 ? h('b', null, part) : document.createTextNode(part)); });
  return out;
}
function exPlain(s){ return s.replace(/\[\[|\]\]/g, ''); }

/* ---------- spaced repetition on the Ebbinghaus ladder (inlined by tools/build.py) ----------
   Everything lives in this browser's localStorage under SRS_KEY (per learner, see common.js), shape
     {v:1, w:{"<slug>:<word id>": {b, t, l, c, x}}, log:{"YYYY-MM-DD": {n, ok}}, ex:[{d, score, total, scope, k}]}   (k: "exam" = 总考, "listen" = 听力考试)
   b = steps of the ladder passed (0..9)   t = when it is due next (ms)   l = last answered (ms)
   c / x = how many times answered right / wrong.
   Rules:  first answer right -> b=1 (next review after the 2nd step), first answer wrong -> b=0 (5 minutes)
           right and due     -> b+1, next review after SRS_STEPS[b] (after the last step: SRS_LONG)
           right but early   -> the schedule does not move (drilling a word again right away must not push it up the ladder)
           wrong at any time -> b=0, back to the first step
   srsStep is pure; it is covered by tools/tests/srs.test.js. */
const SRS_KEY = 'wk-srs-v1';
const SRS_MIN = 60000, SRS_HOUR = 3600000, SRS_DAY = 86400000;
const SRS_STEPS = [5 * SRS_MIN, 30 * SRS_MIN, 12 * SRS_HOUR, SRS_DAY, 2 * SRS_DAY, 4 * SRS_DAY, 7 * SRS_DAY, 15 * SRS_DAY, 30 * SRS_DAY];
const SRS_LONG = 60 * SRS_DAY;
const SRS_TOP = SRS_STEPS.length;                 /* b can go from 0 to SRS_TOP */
const SRS_LABELS = ['5 分钟', '30 分钟', '12 小时', '1 天', '2 天', '4 天', '7 天', '15 天', '30 天', '60 天'];

function srsInterval(b){ return b < SRS_STEPS.length ? SRS_STEPS[b] : SRS_LONG; }
function srsNum(x){ return typeof x === 'number' && isFinite(x) ? x : 0; }
/* sanitize anything that claims to be saved progress (from localStorage or from an imported file) */
function srsClean(d){
  const out = {v:1, w:{}, log:{}, ex:[]};
  if (!d || typeof d !== 'object') return out;
  if (d.w && typeof d.w === 'object') Object.keys(d.w).forEach(function(k){
    const e = d.w[k];
    if (k === '__proto__' || !e || typeof e !== 'object') return;
    const b = Math.max(0, Math.min(SRS_TOP, Math.floor(srsNum(e.b))));
    out.w[k] = {b:b, t:srsNum(e.t), l:srsNum(e.l), c:Math.max(0, Math.floor(srsNum(e.c))), x:Math.max(0, Math.floor(srsNum(e.x)))};
  });
  if (d.log && typeof d.log === 'object') Object.keys(d.log).forEach(function(k){
    const e = d.log[k];
    if (/^\d{4}-\d{2}-\d{2}$/.test(k) && e && typeof e === 'object') out.log[k] = {n:Math.max(0, Math.floor(srsNum(e.n))), ok:Math.max(0, Math.floor(srsNum(e.ok)))};
  });
  if (Array.isArray(d.ex)) d.ex.slice(-20).forEach(function(e){
    if (e && typeof e === 'object' && typeof e.score === 'number' && typeof e.total === 'number')
      out.ex.push({d:String(e.d || '').slice(0, 10), score:e.score, total:e.total, scope:String(e.scope || '').slice(0, 60), k:e.k === 'listen' ? 'listen' : 'exam'});
  });
  return out;
}
function srsLoad(){ return srsClean(lsGet(SRS_KEY)); }
/* two copies of the same learner's progress (this device + an imported one) -> one. A word keeps the copy that was answered last;
   a day's counts keep the larger tally (the same answers are in both copies, so adding them would count twice); results are united. */
function srsMerge(a, b){
  a = srsClean(a); b = srsClean(b);
  const out = {v:1, w:{}, log:{}, ex:[]};
  Object.keys(a.w).forEach(function(k){ out.w[k] = a.w[k]; });
  Object.keys(b.w).forEach(function(k){
    const x = out.w[k], y = b.w[k];
    if (!x || y.l > x.l || (y.l === x.l && y.c + y.x > x.c + x.x)) out.w[k] = y;
  });
  [a.log, b.log].forEach(function(lg){
    Object.keys(lg).forEach(function(k){
      const g = out.log[k], e = lg[k];
      if (!g || e.n > g.n || (e.n === g.n && e.ok > g.ok)) out.log[k] = e;
    });
  });
  const seen = {};
  a.ex.concat(b.ex).forEach(function(e){
    const id = [e.d, e.score, e.total, e.scope, e.k].join('|');
    if (!seen[id]){ seen[id] = 1; out.ex.push(e); }
  });
  out.ex.sort(function(x, y){ return x.d < y.d ? -1 : x.d > y.d ? 1 : 0; });
  out.ex = out.ex.slice(-20);
  return out;
}
function srsSave(s){ lsSet(SRS_KEY, s); }
function srsGet(key){ return srsLoad().w[key] || null; }

/* pure: the entry after one answer (e = null when the word has never been answered) */
function srsStep(e, ok, now){
  const first = !e;
  const n = first ? {b:0, t:0, l:0, c:0, x:0} : {b:e.b, t:e.t, l:e.l, c:e.c, x:e.x};
  if (!ok){
    n.b = 0; n.t = now + srsInterval(0); n.x++;
  } else {
    n.c++;
    if (first){ n.b = 1; n.t = now + srsInterval(1); }
    else if (n.t <= now){ n.b = Math.min(n.b + 1, SRS_TOP); n.t = now + srsInterval(n.b); }
  }
  n.l = now;
  return n;
}
/* what would happen, without writing anything: {kind:'first'|'up'|'early'|'reset', b, t} */
function srsPreview(key, ok, now){
  now = now || Date.now();
  const e = srsGet(key), n = srsStep(e, ok, now);
  const kind = !ok ? 'reset' : !e ? 'first' : e.t <= now ? 'up' : 'early';
  return {kind:kind, b:n.b, t:n.t, was:e};
}
function srsRecord(key, ok, now){
  now = now || Date.now();
  const s = srsLoad();
  const prev = s.w[key] || null;
  s.w[key] = srsStep(prev, ok, now);
  const day = ymd(new Date(now));
  const g = s.log[day] || (s.log[day] = {n:0, ok:0});
  g.n++; if (ok) g.ok++;
  const keep = Object.keys(s.log).sort().slice(-120);
  Object.keys(s.log).forEach(function(k){ if (keep.indexOf(k) < 0) delete s.log[k]; });
  srsSave(s);
  return {prev:prev, next:s.w[key], now:now};
}
/* take back one srsRecord(key, ok, now) whose result was `rec` (used when the learner overrules a mark afterwards) */
function srsUndo(key, rec, ok){
  const s = srsLoad();
  if (rec.prev) s.w[key] = rec.prev; else delete s.w[key];
  const g = s.log[ymd(new Date(rec.now))];
  if (g){ g.n = Math.max(0, g.n - 1); if (ok) g.ok = Math.max(0, g.ok - 1); }
  srsSave(s);
}
function srsAddExam(rec){
  const s = srsLoad();
  s.ex.push(rec);
  s.ex = s.ex.slice(-20);
  srsSave(s);
}
/* the learner overruled a mark in the result list: correct the score of the exam just saved */
function srsSetLastExamScore(score){
  const s = srsLoad();
  if (s.ex.length){ s.ex[s.ex.length - 1].score = score; srsSave(s); }
}
function srsReset(){ lsDel(SRS_KEY); }

/* {st:'new'|'due'|'wait', b, t} */
function srsInfo(e, now){
  if (!e) return {st:'new', b:-1, t:0};
  return {st:e.t <= now ? 'due' : 'wait', b:e.b, t:e.t};
}
/* "5 分钟后", "3 小时后", "明天", "6 天后" */
function srsWhen(t, now){
  const d = t - now;
  if (d <= 0) return '现在';
  if (d < SRS_HOUR) return Math.max(1, Math.round(d / SRS_MIN)) + ' 分钟后';
  if (d < SRS_DAY) return Math.round(d / SRS_HOUR) + ' 小时后';
  const days = Math.round(d / SRS_DAY);
  if (days === 1) return '明天';
  if (days < 60) return days + ' 天后';
  return Math.round(days / 30) + ' 个月后';
}
function srsStageText(e, now){
  if (!e) return '未开始';
  return '间隔 ' + SRS_LABELS[e.b] + ' · ' + (e.t <= now ? '该复习了' : '下次 ' + srsWhen(e.t, now));
}

/* ---------- learners: who is studying on this browser (inlined by tools/build.py; needs common.js and srs.js) ----------
   The site is static and has no server, so there are no passwords: a learner is a name that keeps its progress apart from other learners'
   (every localStorage key of a learner is "<key>@<id>", see common.js). The list of learners is stored under WHO_KEY:
     {v:1, cur:"<id>", list:[{id, name, c: created, u: last used}], claimed: bool}
   claimed: progress saved before learners existed (plain wk-* / fk-* keys) goes to the first learner created, once.
   Progress moves between devices as a "progress code" ("WK1." + base64 of a JSON bundle) or as the same JSON in a file. Importing MERGES
   (the newer answer per word wins); it never overwrites. Merge and parse are pure-ish and covered by tools/tests/who.test.js.
   If a new kind of progress is stored in localStorage, it must be a key starting with wk- or fk-; it is then exported, imported and deleted
   with the learner. Anything that is not the SRS key or a UI-preference key is treated as one article's state (see stateClean). */

/* one article's progress: {v:1, vocab:{id:{s,d,m}}, ans:{key:text}, quiz:{score,total,d,k}|null} */
function stateClean(d){
  const out = {v:1, vocab:{}, ans:{}, quiz:null};
  if (!d || typeof d !== 'object') return out;
  if (d.vocab && typeof d.vocab === 'object') Object.keys(d.vocab).forEach(function(k){
    const e = d.vocab[k];
    if (k === '__proto__' || !e || typeof e !== 'object') return;
    const o = {};
    if (e.s === 'learning' || e.s === 'mastered') o.s = e.s;
    if (typeof e.d === 'string') o.d = e.d.slice(0, 10);
    if (typeof e.m === 'string' && e.m) o.m = e.m.slice(0, 400);
    if (o.s || o.m) out.vocab[k] = o;
  });
  if (d.ans && typeof d.ans === 'object') Object.keys(d.ans).forEach(function(k){
    if (k !== '__proto__' && typeof d.ans[k] === 'string' && d.ans[k]) out.ans[k] = d.ans[k].slice(0, 2000);
  });
  if (d.quiz && typeof d.quiz === 'object' && typeof d.quiz.score === 'number' && typeof d.quiz.total === 'number')
    out.quiz = {score:d.quiz.score, total:d.quiz.total, d:String(d.quiz.d || '').slice(0, 10), k:['mcq', 'cloze', 'exs', 'zh', 'dict', 'sent'].indexOf(d.quiz.k) >= 0 ? d.quiz.k : ''};
  return out;
}
/* two copies of one article's progress -> one: per word the copy touched last wins (a status or note only one copy has is kept),
   answers are united (this device's text wins a clash), the later quiz result is kept */
function stateMerge(a, b){
  a = stateClean(a); b = stateClean(b);
  const out = {v:1, vocab:{}, ans:{}, quiz:null};
  Object.keys(a.vocab).forEach(function(k){ out.vocab[k] = a.vocab[k]; });
  Object.keys(b.vocab).forEach(function(k){
    const x = out.vocab[k], y = b.vocab[k];
    if (!x){ out.vocab[k] = y; return; }
    const yNewer = (y.d || '') > (x.d || '');
    const n = yNewer ? y : x, o = yNewer ? x : y;
    const m = {};
    if (n.s || o.s) m.s = n.s || o.s;
    if (n.m || o.m) m.m = n.m || o.m;
    if (n.d || o.d) m.d = n.d || o.d;
    out.vocab[k] = m;
  });
  Object.keys(b.ans).forEach(function(k){ out.ans[k] = b.ans[k]; });
  Object.keys(a.ans).forEach(function(k){ out.ans[k] = a.ans[k]; });
  out.quiz = !a.quiz ? b.quiz : !b.quiz ? a.quiz : (b.quiz.d > a.quiz.d ? b.quiz : a.quiz);
  return out;
}

const Who = (function(){
  const KEEP = /^(wk|fk)-[A-Za-z0-9._-]{1,80}$/;     /* what a learner's progress keys look like */
  const UI_KEYS = ['fk-ui-v1', 'wk-review-ui-v1'];
  const PREFIX = 'WK1.';
  const MAXLEN = 2000000;
  const DAY = 86400000;

  function canStore(){
    try { localStorage.setItem('wk-probe', '1'); localStorage.removeItem('wk-probe'); return true; } catch(e){ return false; }
  }
  function saveReg(reg){ try { localStorage.setItem(WHO_KEY, JSON.stringify(reg)); return true; } catch(e){ return false; } }
  function newId(reg){
    let id;
    do { id = 'u' + Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 6); } while (reg.list.some(function(p){ return p.id === id; }));
    return id;
  }
  function cleanName(s){ return String(s == null ? '' : s).replace(/[\u0000-\u001f\u007f]/g, '').replace(/\s+/g, ' ').trim().slice(0, 16); }
  function byName(reg, name){
    const n = name.toLowerCase();
    return reg.list.filter(function(p){ return p.name.toLowerCase() === n; })[0] || null;
  }
  function list(){ return whoReg().list; }
  function current(){ return whoReg().list.filter(function(p){ return p.id === WHO_ID; })[0] || null; }
  /* a browser that cannot store anything (some private modes) gets no picker: nothing could be saved for anyone anyway */
  function ready(){ return !!WHO_ID || !canStore(); }

  function allKeys(){
    const out = [];
    try { for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k) out.push(k); } } catch(e){}
    return out;
  }
  function keysOf(id){
    const suf = '@' + id;
    return allKeys().filter(function(k){ return k.length > suf.length && k.slice(-suf.length) === suf; })
      .map(function(k){ return k.slice(0, -suf.length); })
      .filter(function(b){ return KEEP.test(b) && b !== WHO_KEY; });
  }
  function legacyKeys(){ return allKeys().filter(function(k){ return KEEP.test(k) && k !== WHO_KEY; }); }
  function claim(id){
    legacyKeys().forEach(function(k){
      try { const v = localStorage.getItem(k); if (v != null && localStorage.getItem(k + '@' + id) == null) localStorage.setItem(k + '@' + id, v); } catch(e){}
    });
  }
  function readKey(k, id){ try { return JSON.parse(localStorage.getItem(k + '@' + id) || 'null'); } catch(e){ return null; } }

  /* ---- learners ---- */
  function create(name){
    name = cleanName(name);
    if (!name) return {ok:false, err:'请先写一个名字。'};
    const reg = whoReg();
    let p = byName(reg, name);
    const existed = !!p;
    if (!p){
      p = {id:newId(reg), name:name, c:Date.now(), u:0};
      reg.list.push(p);
      if (!reg.claimed){ claim(p.id); reg.claimed = true; }
    }
    p.u = Date.now(); reg.cur = p.id;
    if (!saveReg(reg)) return {ok:false, err:'浏览器不让保存数据（可能开了无痕模式），进度存不下来。'};
    return {ok:true, id:p.id, name:p.name, existed:existed};
  }
  function select(id){
    const reg = whoReg();
    const p = reg.list.filter(function(q){ return q.id === id; })[0];
    if (!p) return false;
    p.u = Date.now(); reg.cur = id;
    return saveReg(reg);
  }
  function leave(){ const reg = whoReg(); reg.cur = ''; return saveReg(reg); }
  function remove(id){
    keysOf(id).forEach(function(k){ try { localStorage.removeItem(k + '@' + id); } catch(e){} });
    const reg = whoReg();
    reg.list = reg.list.filter(function(p){ return p.id !== id; });
    if (reg.cur === id) reg.cur = '';
    return saveReg(reg);
  }

  /* ---- backup / restore ---- */
  function b64e(str){
    return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(_, x){ return String.fromCharCode(parseInt(x, 16)); }));
  }
  function b64d(b){
    const bin = atob(b);
    let p = '';
    for (let i = 0; i < bin.length; i++) p += '%' + ('0' + bin.charCodeAt(i).toString(16)).slice(-2);
    return decodeURIComponent(p);
  }
  function bundle(id){
    const p = whoReg().list.filter(function(q){ return q.id === id; })[0];
    const data = {};
    keysOf(id).forEach(function(k){ const v = readKey(k, id); if (v && typeof v === 'object') data[k] = v; });
    return {app:'waikan', v:1, name:p ? p.name : '', at:new Date().toISOString(), data:data};
  }
  function toCode(b){ return PREFIX + b64e(JSON.stringify(b)); }
  /* text pasted by the learner (a code, possibly with chat noise around it) or the content of an exported file */
  function parse(text){
    text = String(text == null ? '' : text).trim();
    if (!text) return {ok:false, err:'先把进度码粘贴进来，或选一个导出的文件。'};
    if (text.length > MAXLEN) return {ok:false, err:'内容太大，不像是进度码。'};
    let raw = null;
    if (text.charAt(0) === '{'){
      try { raw = JSON.parse(text); } catch(e){ return {ok:false, err:'文件读不出来，可能不完整。'}; }
    } else {
      const i = text.indexOf(PREFIX);
      if (i < 0) return {ok:false, err:'没有找到进度码。完整的进度码以 WK1. 开头。'};
      const rest = text.slice(i + PREFIX.length);
      const run = rest.match(/^[A-Za-z0-9+\/=_\-\s]*/)[0];
      const cands = [run.replace(/\s+/g, ''), (run.trim().split(/\s+/)[0] || '')];
      for (let k = 0; k < cands.length && raw === null; k++){

   A "clip" is a slice [start, end] of an MP3 sprite (clips.mp3 of one article). One Audio element per sprite file;

const SPK_SVG = '<svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 4V5L7 9H3z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

const Clip = (function(){
  const st = {a:null, end:0, btn:null, raf:0, text:''};
  const audios = {};
  let beforePlay = null;
  function done(){
    cancelAnimationFrame(st.raf);
    if (st.btn){ st.btn.classList.remove('on'); st.btn = null; }
  }
  function fallback(text){
    try {
      if (!('speechSynthesis' in window) || !text) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-GB'; u.rate = 0.9;
      speechSynthesis.speak(u);
    } catch(e){}
  }

    if (audios[src]) return audios[src];
    const a = new Audio();
    a.preload = 'auto';
    a.src = src;
    a.addEventListener('error', function(){ if (st.a === a){ const t = st.text; done(); fallback(t); } });
    a.addEventListener('ended', function(){ if (st.a === a) done(); });
    a.addEventListener('pause', function(){ if (st.a === a && a.currentTime < st.end) done(); });
    audios[src] = a;
    return a;
  }
  function tick(){
    const a = st.a;
    if (!a || a.paused) return;
    if (a.currentTime >= st.end){ a.pause(); done(); return; }
    st.raf = requestAnimationFrame(tick);
  }

  function play(src, t, btn, text, rate){
    if (!t || !src){ if (beforePlay) beforePlay(); done(); fallback(text); return; }
    if (beforePlay) beforePlay();
    const a = audio(src);
    const wasOn = !!btn && st.btn === btn && st.a === a && !a.paused;
    done();
    if (st.a && st.a !== a && !st.a.paused) st.a.pause();
    if (wasOn){ a.pause(); return; }
    st.a = a; st.btn = btn || null; st.text = text;
    st.end = t[1] + 0.15;
    if (btn) btn.classList.add('on');

    if (st.a && !st.a.paused) st.a.pause();
    done();
  }
  return {play:play, stop:stop, onBeforePlay:function(fn){ beforePlay = fn; }};
})();

    if (!/^\d{4}$/.test(t)) return null;
    const n = Number(t);
    if (!((n >= 1100 && n <= 1999) || (n >= 2010 && n <= 2099)) || n % 100 < 10) return null;
    return numWords(Math.floor(n / 100)).split(' ').concat(numWords(n % 100).split(' '));
  }
  /* words of a sentence for comparing dictation: no case, no punctuation, no apostrophes, small numbers spelled out */
  function toks(s){
    const out = [];
    String(s).toLowerCase().replace(/[’‘']/g, '').split(/[^a-z0-9]+/).forEach(function(t){
      if (!t) return;
      if (/^\d{1,3}$/.test(t)) numWords(Number(t)).split(' ').forEach(function(w){ out.push(w); });
      else if (yearWords(t)) yearWords(t).forEach(function(w){ out.push(w); });
      else out.push(t);
    });
    return out;
  }
  function lcsHits(a, b){
    const n = a.length, m = b.length;
    const dp = [];
    for (let i = 0; i <= n; i++) dp.push(new Array(m + 1).fill(0));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
      dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    const ha = new Array(n).fill(false), hb = new Array(m).fill(false);
    let i = 0, j = 0;
    while (i < n && j < m){
      if (a[i] === b[j]){ ha[i] = hb[j] = true; i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) i++;
      else j++;
    }
    return {ha:ha, hb:hb};
  }
  /* the text with the words that are not in `hits` underlined */
  function chunkDiff(text, hits){
    const out = [];
    let pos = 0;
    text.split(/\s+/).filter(Boolean).forEach(function(chunk){
      const n = toks(chunk).length;
      let miss = false;
      for (let k = 0; k < n; k++) if (!hits[pos + k]) miss = true;
      pos += n;
      if (out.length) out.push(' ');
      out.push(miss ? h('span', {class:'miss-t'}, chunk) : chunk);
    });
    return out;
  }

  /* ---- pieces every question uses ---- */
  function head(o, type){
    const bar = h('div', {class:'pbar'}, h('i'));
    bar.style.setProperty('--p', (o.index / o.total * 100) + '%');
    return h('div', {class:'q-head'}, h('span', {class:'eyebrow'}, '第 ' + (o.index + 1) + ' 题 / ' + o.total + '　' + (o.label || TYPE_NAME[type]) + (o.tag ? '　' + o.tag : '')), bar);
  }
  function inputAttrs(extra){
    return Object.assign({type:'text', id:'q-input', autocomplete:'off', autocapitalize:'off', autocorrect:'off', spellcheck:'false'}, extra);
  }
  function nextLabel(o){ return (o.isLast ? o.isLast() : o.last) ? '看成绩' : '下一题'; }
  function speakLine(item, v){
    return h('p', null, clipBtn(item.clips, 'w' + v.id, v.core), item.clips ? ' ' : null, h('b', null, v.expr), '　', v.zh);
  }
  function extraBox(item, res, o){
    const box = h('div', {class:'fb-x'});
    box.refresh = function(){
      box.replaceChildren();
      const n = o.extra ? o.extra(item, res) : null;
      if (n) box.append(n);
    };
    return box;
  }
  function newRes(item, type){ return {id:item.id, key:item.key || null, type:type, ok:false, given:'', k:item.k}; }

  /* ---- fill the blank: the sentence is the article's (cloze) or one of the word's examples (exs) ---- */
  function clozeQ(item, o, c, type){
    const v = item.v, res = newRes(item, type);
    const inp = h('input', inputAttrs({class:'q-input', 'aria-label':'填入缺失的单词'}));
    inp.style.width = Math.max(6, c.ans.length + 2) + 'ch';
    const fb = h('div', {class:'fb', hidden:true, 'aria-live':'polite'});
    const main = h('button', {type:'button', class:'btn pri'}, '检查');
    const peek = h('button', {type:'button', class:'btn'}, '提示首字母');
    const ex = extraBox(item, res, o);
    let checked = false;
    const card = h('div', {class:'card'},
      head(o, type),
      h('p', {class:'q-sent'}, c.before, inp, c.after),
      h('p', {class:'q-hint'}, c.hint + '　', h('span', {class:'mono'}, c.ans.length + ' 个字母')),
      fb,
      h('div', {class:'row'}, main, peek)
    );
    peek.addEventListener('click', function(){ inp.placeholder = c.ans.charAt(0); inp.focus(); });
    function check(){
      const val = norm(inp.value);
      if (!val){ inp.focus(); return; }
      const ok = val === norm(c.ans);
      checked = true;
      res.ok = ok; res.given = inp.value.trim();
      o.onAnswer(res);
      inp.readOnly = true;
      inp.classList.add(ok ? 'ok' : 'bad');
      fb.className = 'fb ' + (ok ? 'ok' : 'bad');
      fb.hidden = false;
      fb.replaceChildren(
        h('p', {class:'fb-t'}, ok ? '正确' : ['不对，答案是 ', h('b', null, c.ans)]),
        h('p', null, c.szh),
        speakLine(item, v),
        ex
      );
      ex.refresh();
      peek.hidden = true;
      main.textContent = nextLabel(o);
      main.focus();
    }
    main.addEventListener('click', function(){ if (checked) o.onNext(); else check(); });
    inp.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); main.click(); } });
    return card;
  }

  /* ---- Chinese -> the English expression, typed ---- */
  function zhQ(item, o){
    const v = item.v, res = newRes(item, 'zh');
    const words = v.core.split(' ');
    const inp = h('input', inputAttrs({class:'q-input q-wide', 'aria-label':'写出对应的英文表达'}));
    const fb = h('div', {class:'fb', hidden:true, 'aria-live':'polite'});
    const main = h('button', {type:'button', class:'btn pri'}, '检查');
    const peek = h('button', {type:'button', class:'btn'}, '提示首字母');
    const ex = extraBox(item, res, o);
    let checked = false;
    const card = h('div', {class:'card'},
      head(o, 'zh'),
      h('p', {class:'q-zh'}, v.zh),
      h('p', {class:'q-line'}, inp),
      h('p', {class:'q-hint'}, words.length + ' 个词：', h('span', {class:'mono'}, words.map(function(w){ return w.length; }).join(' + ') + ' 个字母')),
      fb,
      h('div', {class:'row'}, main, peek)
    );
    peek.addEventListener('click', function(){ inp.placeholder = v.core.charAt(0) + '…'; inp.focus(); });
    function check(){
      const val = norm(inp.value);
      if (!val){ inp.focus(); return; }
      const own = v.forms.map(norm).indexOf(val) >= 0;
      const ok = own || v.syn.map(norm).indexOf(val) >= 0;
      checked = true;
      res.ok = ok; res.given = inp.value.trim();
      o.onAnswer(res);
      inp.readOnly = true;
      inp.classList.add(ok ? 'ok' : 'bad');
      fb.className = 'fb ' + (ok ? 'ok' : 'bad');
      fb.hidden = false;
      const headP = h('p', {class:'fb-t'}, ok ? '正确' : ['不对，参考答案是 ', h('b', null, v.expr)]);
      const kids = [headP];
      if (ok && !own) kids.push(h('p', null, '你写的是近义表达，文章里用的是 ', h('b', null, v.core), '。'));
      if (!ok){
        const alt = h('button', {type:'button', class:'btn sm'}, '我写的也对（近义词）');
        alt.addEventListener('click', function(){
          res.ok = true;
          fb.className = 'fb ok';
          inp.classList.remove('bad'); inp.classList.add('ok');
          headP.replaceChildren('已按你的判断算对。参考答案是 ', h('b', null, v.expr));
          alt.remove();
          ex.refresh();
          if (o.onChange) o.onChange(res);
          main.textContent = nextLabel(o);
          main.focus();
        });
        kids.push(h('div', {class:'fb-s'}, alt));
      }
      kids.push(speakLine(item, v));
      kids.push(h('p', {class:'w-ctx'}, markTerms(v.ctx, v.m)));
      kids.push(ex);
      fb.replaceChildren.apply(fb, kids);
      ex.refresh();
      peek.hidden = true;
      main.textContent = nextLabel(o);
      main.focus();
    }
    main.addEventListener('click', function(){ if (checked) o.onNext(); else check(); });
    inp.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); main.click(); } });
    return card;
  }

  /* ---- Chinese sentence -> the whole English sentence, graded by the learner ---- */
  function sentRe(v){
    const alts = v.forms.map(function(f){
      return f.toLowerCase().split(/[^a-z]+/).filter(Boolean).map(esc).join('[^A-Za-z]+');
    });
    return new RegExp('(?:^|[^A-Za-z])(?:' + alts.join('|') + ')(?![A-Za-z])', 'i');
  }
  function sentQ(item, o){
    const v = item.v, x = v.ex[item.k], res = newRes(item, 'sent');
    const ta = h('textarea', inputAttrs({class:'q-area', rows:3, maxlength:400, placeholder:'把这句话写成英文', 'aria-label':'写出整句英文'}));
    const hintP = h('p', {class:'q-hint'});
    const fb = h('div', {class:'fb', hidden:true, 'aria-live':'polite'});
    const main = h('button', {type:'button', class:'btn pri'}, '核对');
    const peek = h('button', {type:'button', class:'btn'}, '提示：这个表达的意思');
    const card = h('div', {class:'card'},
      head(o, 'sent'),
      h('p', {class:'q-zh'}, x.zh),
      h('p', {class:'q-tgt'}, h('span', {class:'meta'}, '请用上'), h('b', null, v.expr)),
      hintP,
      ta,
      fb,
      h('div', {class:'row'}, main, peek)
    );
    peek.addEventListener('click', function(){ hintP.textContent = v.expr + '：' + v.zh; peek.hidden = true; ta.focus(); });
    function grade(ok){
      res.ok = ok; res.given = ta.value.trim();
      o.onAnswer(res);
      o.onNext();
    }
    function check(){
      const val = ta.value.trim();
      if (!val){ ta.focus(); return; }
      const used = sentRe(v).test(val);
      ta.readOnly = true;
      fb.className = 'fb ' + (used ? 'ok' : 'bad');
      fb.hidden = false;
      fb.replaceChildren(
        h('p', {class:'fb-t'}, used ? '用到了 ' + v.expr : '没看到 ' + v.expr + '（词形变化也算）'),
        h('p', null, clipBtn(item.clips, 'e' + v.id + '_' + item.k, exPlain(x.en)), item.clips ? ' ' : null, '参考句：', exNodes(x.en)),
        h('p', {class:'meta'}, '对照参考句，自己判断：时态、搭配、拼写有没有问题。意思对、表达自然就算写对。'),
        h('div', {class:'row'},
          h('button', {type:'button', class:'btn pri', onclick:function(){ grade(true); }}, '我写对了'),
          h('button', {type:'button', class:'btn', onclick:function(){ grade(false); }}, '还要再练'))
      );
      main.hidden = true;
      peek.hidden = true;
    }
    main.addEventListener('click', check);
    ta.addEventListener('keydown', function(e){ if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); check(); } });
    return card;
  }

  /* ---- multiple choice: meaning of an expression (e2z), or the expression for a meaning (z2e) ---- */
  function mcqQ(item, o){
    const v = item.v, res = newRes(item, 'mcq');
    const dir = item.dir === 'z2e' ? 'z2e' : 'e2z';
    const right = dir === 'e2z' ? v.zh : v.expr;
    const seen = {};
    seen[right] = true;
    const wrong = [];
    shuffle((o.pool ? o.pool() : []).slice()).forEach(function(p){
      const t = dir === 'e2z' ? p.zh : p.expr;
      if (t && !seen[t] && wrong.length < 3){ seen[t] = true; wrong.push(t); }
    });
    const texts = shuffle([right].concat(wrong));
    const ex = extraBox(item, res, o);
    const fb = h('div', {class:'fb', hidden:true, 'aria-live':'polite'});
    const main = h('button', {type:'button', class:'btn pri', hidden:true}, nextLabel(o));
    let answered = false;
    const btns = texts.map(function(t, i){
      return h('button', {type:'button', class:'mc-b', onclick:function(){ pick(i); }}, h('span', {class:'n'}, String(i + 1)), h('span', null, t));
    });
    const ask = dir === 'e2z'
      ? [h('p', {class:'q-ask'}, '这个表达在句子里是什么意思？'),
         h('p', {class:'q-big'}, v.expr, item.clips ? ' ' : null, clipBtn(item.clips, 'w' + v.id, v.core)),
         h('p', {class:'q-ctx'}, markTerms(v.ctx, v.m))]
      : [h('p', {class:'q-ask'}, '选出对应的英文表达'),
         h('p', {class:'q-zh'}, v.zh)];
    const card = h('div', {class:'card'},
      head(o, 'mcq'),
      ask,
      h('div', {class:'mc', role:'group', 'aria-label':'选项'}, btns),
      fb,
      h('div', {class:'row'}, main)
    );
    function pick(i){
      if (answered) return;
      answered = true;
      const ok = texts[i] === right;
      res.ok = ok; res.given = texts[i];
      o.onAnswer(res);
      btns.forEach(function(b, j){
        b.disabled = true;
        if (texts[j] === right) b.classList.add('ok');
        else if (j === i) b.classList.add('bad');
      });
      fb.className = 'fb ' + (ok ? 'ok' : 'bad');
      fb.hidden = false;
      const kids = [h('p', {class:'fb-t'}, ok ? '正确' : ['不对，答案是 ', h('b', null, right)]), speakLine(item, v)];
      if (v.note) kids.push(h('p', {class:'w-note'}, v.note));
      kids.push(h('p', {class:'w-ctx'}, markTerms(v.ctx, v.m)));
      kids.push(ex);
      fb.replaceChildren.apply(fb, kids);
      ex.refresh();
      main.textContent = nextLabel(o);
      main.hidden = false;
      main.focus();
    }
    main.addEventListener('click', function(){ o.onNext(); });
    function onKey(e){
      if (!card.isConnected){ document.removeEventListener('keydown', onKey); return; }
      if (card.offsetParent === null) return;
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const n = Number(e.key);
      if (!answered && n >= 1 && n <= btns.length){ e.preventDefault(); pick(n - 1); }
    }
    document.addEventListener('keydown', onKey);
    return card;
  }

  /* ---- dictation: listen, then type a word, an example sentence, or (item.sent) a sentence of the article ----
     item.sent = {en, zh, src, t}: the sentence and where its audio is.   o.defer: no feedback after the answer, the
     host shows everything at the end (listening exam); the answer is passed on through onAnswer + onNext. */
  function dictQ(item, o){
    const v = item.v, S = item.sent, res = newRes(item, 'dict');
    const isWord = !S && (item.k == null || item.k < 0);
    const x = !S && !isWord ? v.ex[item.k] : null;
    const ref = S ? S.en : isWord ? v.core : exPlain(x.en);
    const zhText = S ? S.zh : isWord ? v.zh : x.zh;
    const key = S ? null : isWord ? 'w' + v.id : 'e' + v.id + '_' + item.k;
    const src = S ? S.src : item.clips ? item.clips.src : null;
    const clipT = S ? S.t : item.clips && key ? item.clips.t[key] : null;
    res.ref = ref; res.zh = zhText; res.src = src; res.t = clipT; res.kind = S ? 's' : isWord ? 'w' : 'e';
    const defer = !!o.defer;
    const playB = h('button', {type:'button', class:'btn pri play'}, '播放');
    const slowB = h('button', {type:'button', class:'btn play'}, '慢速播放');
    playB.insertAdjacentHTML('afterbegin', SPK_SVG);
    playB.addEventListener('click', function(){ Clip.play(src, clipT, playB, ref, 1); });
    slowB.addEventListener('click', function(){ Clip.play(src, clipT, slowB, ref, 0.7); });
    const field = isWord
      ? h('input', inputAttrs({class:'q-input q-wide', 'aria-label':'写出听到的表达'}))
      : h('textarea', inputAttrs({class:'q-area', rows:3, maxlength:500, placeholder:'把听到的整句写下来', 'aria-label':'写出听到的整句'}));
    const hintP = h('p', {class:'q-hint'}, isWord ? '一个英文表达，拼写时词形要和听到的一致。' : '大小写和标点不影响判分，数字写 30 或 thirty 都行。' + (defer ? '' : '电脑上按 Ctrl+Enter 提交。'));
    const fb = h('div', {class:'fb', hidden:true, 'aria-live':'polite'});
    const lastQ = function(){ return o.isLast ? o.isLast() : !!o.last; };
    const main = h('button', {type:'button', class:'btn pri'}, defer ? (lastQ() ? '交卷' : '提交，下一题') : '检查');
    const peek = defer ? null : h('button', {type:'button', class:'btn'}, '提示：中文意思');
    const ex = extraBox(item, res, o);
    let checked = false;
    const card = h('div', {class:'card'},
      head(o, 'dict'),
      h('p', {class:'q-ask'}, isWord ? '听发音，写出这个表达。' : '听一句话，把整句写下来。'),
      h('div', {class:'dict-btns'}, playB, slowB),
      isWord ? h('p', {class:'q-line'}, field) : field,
      hintP,
      fb,
      h('div', {class:'row'}, main, peek)
    );
    if (peek) peek.addEventListener('click', function(){ hintP.textContent = '意思：' + zhText; peek.hidden = true; field.focus(); });
    function check(){
      const val = field.value.trim();
      if (!norm(val) && !/\d/.test(val)){ field.focus(); return; }
      let ok, diffKids = [];
      if (isWord){
        ok = v.forms.map(norm).indexOf(norm(val)) >= 0;
      } else {
        const a = toks(ref), b = toks(val), d = lcsHits(a, b);
        ok = a.length === b.length && d.ha.every(Boolean);
        if (!ok) diffKids = [
          h('p', {class:'df'}, h('span', {class:'df-l'}, '标准答案（有出入的词划了线）'), chunkDiff(ref, d.ha)),
          h('p', {class:'df'}, h('span', {class:'df-l'}, '你写的'), chunkDiff(val, d.hb))
        ];
      }
      checked = true;
      res.ok = ok; res.given = val;
      o.onAnswer(res);
      if (defer){ o.onNext(); return; }
      field.readOnly = true;
      if (isWord) field.classList.add(ok ? 'ok' : 'bad');
      fb.className = 'fb ' + (ok ? 'ok' : 'bad');
      fb.hidden = false;
      const headP = h('p', {class:'fb-t'}, ok ? '正确' : (isWord ? ['不对，听到的是 ', h('b', null, v.expr)] : '有出入，对照一下'));
      const kids = [headP];
      if (!ok){
        kids.push.apply(kids, diffKids);
        const alt = h('button', {type:'button', class:'btn sm'}, '只是小失误，算我对');
        alt.addEventListener('click', function(){
          res.ok = true;
          fb.className = 'fb ok';
          if (isWord){ field.classList.remove('bad'); field.classList.add('ok'); }
          headP.replaceChildren('已按你的判断算对。');
          alt.remove();
          ex.refresh();
          if (o.onChange) o.onChange(res);
          main.textContent = nextLabel(o);
          main.focus();
        });
        kids.push(h('div', {class:'fb-s'}, alt));
      }
      if (isWord) kids.push(speakLine(item, v));
      else if (S){
        const sb = spkEl('播放这一句', function(){ Clip.play(src, clipT, sb, ref, 1); });
        kids.push(h('p', null, sb, ' ', ref), h('p', {class:'meta'}, zhText));
      } else kids.push(h('p', null, clipBtn(item.clips, key, ref), item.clips ? ' ' : null, exNodes(x.en)), h('p', {class:'meta'}, x.zh));
      kids.push(ex);
      fb.replaceChildren.apply(fb, kids);
      ex.refresh();
      if (peek) peek.hidden = true;
      main.textContent = nextLabel(o);
      main.focus();
    }
    main.addEventListener('click', function(){ if (checked) o.onNext(); else check(); });
    field.addEventListener('keydown', function(e){
      if (e.key === 'Enter' && (isWord || e.ctrlKey || e.metaKey)){ e.preventDefault(); main.click(); }
    });
    /* play once as soon as the question appears (this runs inside the click that opened it, so browsers allow it) */
    if (o.autoplay !== false) Clip.play(src, clipT, playB, ref, 1);
    return card;
  }

  function make(item, o){
    switch (item.type){
      case 'cloze': return clozeQ(item, o, item.v.cloze, 'cloze');
      case 'exs': return clozeQ(item, o, exCloze(item.v, item.k), 'exs');
      case 'zh': return zhQ(item, o);
      case 'sent': return sentQ(item, o);
      case 'mcq': return mcqQ(item, o);
      case 'dict': return dictQ(item, o);
    }
    throw new Error('unknown question type ' + item.type);
  }
  function focus(card){
    const f = $('#q-input', card);
    if (f) f.focus({preventScroll:true});
  }
  /* which question to ask a word that is on step b of the ladder: recognise -> fill in -> spell -> hear -> write */
  function typeForStage(b, hasClips){
    if (b <= 0) return {type:'mcq', dir:'e2z'};
    if (b === 1) return {type:'mcq', dir:'z2e'};
    if (b === 2) return {type:'exs'};
    if (b === 3) return {type:'cloze'};
    if (b <= 5) return {type:'zh'};
    if (b <= 7) return hasClips ? {type:'dict'} : {type:'zh'};
    return {type:'sent'};
  }
  return {TYPE_NAME:TYPE_NAME, make:make, focus:focus, markTerms:markTerms, exCloze:exCloze, toks:toks, lcsHits:lcsHits, chunkDiff:chunkDiff, typeForStage:typeForStage};
