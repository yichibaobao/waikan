    return q;
  });
  const s = {kind:'listen', mode:'dict', box:box, queue:queue, i:0, results:[], pending:null, tag:'', defer:o.mode === 'exam',
             scopeLabel:o.scopeLabel, home:o.home, again:o.again, listenMode:o.mode, saved:false};
  SESS.listen = s;
  const n = {w:0, e:0, s:0};
  queue.forEach(function(q){ n[q.kind]++; });
  const parts = ['w', 'e', 's'].filter(function(k){ return n[k]; }).map(function(k){ return KIND_NAME[k] + ' ' + n[k]; });
  box.replaceChildren(h('div', {class:'card'},
    h('p', {class:'eyebrow'}, '听力考试'),
    h('h2', {class:'h2'}, '共 ' + queue.length + ' 题'),
    h('p', {class:'lead'}, parts.join(' · ')),
    h('ul', {class:'how'},
      h('li', null, '每题会自动播放一次，可以再点“播放”重听，或用“慢速播放”。'),
      h('li', null, '听到什么写什么：单词写完按回车，句子写完按“提交”。大小写、标点不用管。'),
      h('li', null, s.defer ? '交卷前不显示对错，最后统一对答案，可以对照每一处出入。' : '每题提交后马上显示对错和正确答案。'),
      h('li', null, '准备好了就开始，建议戴上耳机。')),
    h('div', {class:'row'}, h('button', {type:'button', class:'btn pri', onclick:function(){ ask(s); window.scrollTo(0, 0); }}, '开始'),
      h('button', {type:'button', class:'btn', onclick:o.home}, '返回'))));
}
function finishListen(s, keepScroll){
  const rs = s.results;
  const okN = rs.filter(function(r){ return r.ok; }).length;
  const p = pct(okN, rs.length);
  const by = {w:[0, 0], e:[0, 0], s:[0, 0]};
  rs.forEach(function(r){ const b = by[r.q.kind]; b[1]++; if (r.ok) b[0]++; });
  if (!s.saved){ srsAddExam({d:today(), score:okN, total:rs.length, scope:s.scopeLabel, k:'listen'}); s.saved = true; }
  else srsSetLastExamScore(okN);
  const card = h('div', {class:'card'},
    h('p', {class:'eyebrow'}, '听力考试成绩'),
    h('p', {class:'score'}, h('span', {class:'big'}, String(okN)), ' / ' + rs.length + '　' + p + '%'),
    h('p', {class:'grade'}, p >= 90 ? '耳朵很灵，基本都听出来了。' : p >= 75 ? '不错，错的地方多听几遍就稳了。' : p >= 60 ? '过线了。错的句子点喇叭再听一遍，对照划线的地方。' : '还不太熟：先用“慢速播放”多听几遍，再来一次。'));
  const kinds = ['w', 'e', 's'].filter(function(k){ return by[k][1]; });
  if (kinds.length > 1){
    const ul = h('ul', {class:'per'});
    kinds.forEach(function(k){
      const bar = h('div', {class:'tr'}, h('i'));
      bar.style.setProperty('--p', pct(by[k][0], by[k][1]) + '%');
      ul.append(h('li', null, h('span', null, KIND_NAME[k]), h('b', {class:'mono'}, by[k][0] + ' / ' + by[k][1]), bar));
    });
    card.append(h('p', {class:'sub'}, '分项正确率'), ul);
  }
  const miss = rs.filter(function(r){ return !r.ok; });
  if (miss.length){
    card.append(h('h3', {class:'h3'}, '写错的 ' + miss.length + ' 题'));
    miss.forEach(function(r){
      const x = r.res;
      const sb = spkEl('再听一遍', function(){ Clip.play(x.src, x.t, sb, x.ref); });
      const kids = [h('p', {class:'meta'}, KIND_NAME[x.kind])];
      if (x.kind === 'w'){
        const v = LOADED[r.q.slug].words[BYKEY[r.q.key].id];
        kids.push(h('p', {class:'miss-s'}, sb, ' ', v.expr, '　', h('span', {class:'meta'}, v.zh)),
          h('p', {class:'df'}, h('span', {class:'df-l'}, '你写的'), r.given || '（空）'));
      } else {
        const a = Kit.toks(x.ref), b = Kit.toks(r.given), d = Kit.lcsHits(a, b);
        kids.push(h('p', {class:'df'}, sb, ' ', h('span', {class:'df-l'}, '标准答案（有出入的词划了线）'), Kit.chunkDiff(x.ref, d.ha)),
          h('p', {class:'df'}, h('span', {class:'df-l'}, '你写的'), r.given ? Kit.chunkDiff(r.given, d.hb) : '（空）'),
          h('p', {class:'meta'}, x.zh));
      }
      kids.push(h('div', {class:'fb-s'}, h('button', {type:'button', class:'btn sm', onclick:function(){
        r.ok = true;
        if (r.rec){ srsUndo(r.q.key, r.rec, false); r.rec = srsRecord(r.q.key, true); }
        renderToday();
        finishListen(s, true);
      }}, '只是小失误，算我对')));
      card.append(h('div', {class:'miss'}, kids));
    });
  } else {
    card.append(h('p', {class:'lead'}, '全部写对。'));
  }
  const row = h('div', {class:'row'});
  if (miss.length) row.append(h('button', {type:'button', class:'btn pri', onclick:function(){
    startListen(miss.map(function(r){ return {kind:r.q.kind, key:r.q.key, slug:r.q.slug, si:r.q.si, k:r.q.k}; }),
      {box:s.box, mode:s.listenMode, scopeLabel:'错题重听', home:s.home, again:s.again});
  }}, '重听错题'));
  row.append(h('button', {type:'button', class:'btn' + (miss.length ? '' : ' pri'), onclick:s.again}, '再考一次'));
  row.append(h('button', {type:'button', class:'btn', onclick:s.home}, '返回'));
  card.append(row);
  s.box.replaceChildren(card);
  s.done = true;
  if (!keepScroll) window.scrollTo(0, 0);
}
function renderListenTab(){
  const box = $('#lsBox');
  const s = SESS.listen;
  if (s && !s.done) return;
  box.replaceChildren();
  const home = function(){ SESS.listen = null; renderListenTab(); };
  const arts = ARTS.filter(function(a){ return a.clips || a.ls.length; });
  if (!arts.length){
    box.append(h('div', {class:'card'}, h('h2', {class:'h2'}, '听力考试'), h('p', {class:'lead'}, '现在还没有带音频的文章。给文章生成音频后，这里就能考听写了。')));
    return;
  }
  if (ui.lsScope !== 'all' && !arts.some(function(a){ return a.slug === ui.lsScope; })) ui.lsScope = 'all';
  const sel = h('select', {class:'sel', 'aria-label':'考试范围'});
  sel.append(h('option', {value:'all'}, '全部带音频的文章（' + arts.length + ' 篇）'));
  arts.forEach(function(a){ sel.append(h('option', {value:a.slug}, dateLabel(a.date) + ' · ' + a.short)); });
  sel.value = ui.lsScope;
  sel.addEventListener('change', function(){ ui.lsScope = sel.value; saveUi(); renderListenTab(); });
  const c = lsCand(ui.lsScope, ui.lsLen);
  const have = {w:c.w.length, e:c.e.length, s:c.s.length};
  const avail = ui.lsSrc === 'mix' ? have.w + have.e + have.s : have[ui.lsSrc];
  const n = Math.min(ui.lsN, avail);
  const card = h('div', {class:'card'},
    h('h2', {class:'h2'}, '听力考试'),
    h('p', {class:'lead'}, '只听、不看：播放单词、例句或文章里的原句，你把听到的写下来。'),
    h('p', {class:'fld'}, '范围'), sel,
    h('p', {class:'fld'}, '听什么'),
    chipRow(LS_SRC, ui.lsSrc, function(v){ ui.lsSrc = v; saveUi(); renderListenTab(); }, function(v){ return v !== 'mix' && !have[v]; }),
    h('p', {class:'meta mt4'}, '可考：单词 ' + have.w + ' 个 · 例句 ' + have.e + ' 个词的例句 · 文章原句 ' + have.s + ' 句'),
    (ui.lsSrc === 'mix' || ui.lsSrc === 's') ? [h('p', {class:'fld'}, '文章原句的长度'), chipRow(LS_LEN, ui.lsLen, function(v){ ui.lsLen = v; saveUi(); renderListenTab(); })] : null,
    h('p', {class:'fld'}, '题量'),
    chipRow(LS_NUM, ui.lsN, function(v){ ui.lsN = Number(v); saveUi(); renderListenTab(); }),
    h('p', {class:'fld'}, '核对方式'),
    chipRow(LS_MODE, ui.lsMode, function(v){ ui.lsMode = v; saveUi(); renderListenTab(); })
  );
  const label = (ui.lsScope === 'all' ? '全部文章' : AMAP[ui.lsScope].short) + ' · ' + (LS_SRC.filter(function(x){ return x[0] === ui.lsSrc; })[0][1]);
  const start = function(){
    startListen(lsPick(ui.lsScope, ui.lsSrc, n, ui.lsLen), {box:box, mode:ui.lsMode, scopeLabel:label, home:home, again:start});
  };
  card.append(h('div', {class:'row'}, h('button', {type:'button', class:'btn pri', disabled:!avail, onclick:start}, avail ? '开始听力考试（' + n + ' 题）' : '这个范围里没有可考的内容')));
  box.append(card);
  const hc = histCard('最近的听力考试', 'listen');
  if (hc) box.append(hc);
}

/* ---------- vocabulary table ---------- */
const WF = [['all', '全部'], ['due', '待复习'], ['learning', '学习中'], ['strong', '已牢固'], ['new', '未开始'], ['done', '不再出现']];
function wState(e, t){
  if (!e) return 'new';
  if (e.m) return 'done';
  return e.b >= STRONG ? 'strong' : 'learning';
}
function renderWords(){
  const s = srsLoad(), t = now();
  const q = wQuery.trim().toLowerCase();
  const cnt = {all:ALL.length, due:0, learning:0, strong:0, new:0, done:0};
  ALL.forEach(function(w){ const e = s.w[w.key]; cnt[wState(e)]++; if (e && !e.m && e.t <= t) cnt.due++; });
  const chips = $('#wChips');
  chips.replaceChildren();
  WF.forEach(function(o){
    chips.append(h('button', {type:'button', class:'chip' + (wFilter === o[0] ? ' on' : ''), 'aria-pressed':String(wFilter === o[0]),
      onclick:function(){ wFilter = o[0]; wLimit = 60; renderWords(); }}, o[1] + ' ' + cnt[o[0]]));
  });
  const rows = ALL.filter(function(w){
    const e = s.w[w.key];
    if (wFilter === 'due' && !(e && !e.m && e.t <= t)) return false;
    if ((wFilter === 'learning' || wFilter === 'strong' || wFilter === 'new' || wFilter === 'done') && wState(e) !== wFilter) return false;
    if (q && (w.expr + ' ' + w.zh).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  const list = $('#wList');
  list.replaceChildren();
  if (!rows.length) list.append(h('p', {class:'empty'}, '没有符合条件的词。'));
  rows.slice(0, wLimit).forEach(function(w){
    const e = s.w[w.key];
    list.append(h('a', {class:'wrow', href:'../a/' + w.slug + '/#words'},
      h('b', null, w.expr), ' ', h('span', {class:'z'}, w.zh),
      h('div', {class:'m'}, h('span', null, dateLabel(AMAP[w.slug].date) + ' · ' + AMAP[w.slug].short),
        h('span', {class:'d' + (e && !e.m && e.t <= t ? ' due' : '')}, e ? srsStageText(e, t) : '未开始'),
        e && e.m ? h('button', {type:'button', class:'btn sm', onclick:function(ev){ ev.preventDefault(); srsRetire(w.key, false); renderWords(); }}, '放回复习') : null)));
  });
  if (rows.length > wLimit) list.append(h('div', {class:'row'}, h('button', {type:'button', class:'btn', onclick:function(){ wLimit += 60; renderWords(); }}, '再显示 ' + Math.min(60, rows.length - wLimit) + ' 个')));
  const dz = $('#wDanger');
  dz.replaceChildren(
    h('p', null, '想从头开始？可以清空复习记录。只清复习阶段、今日练习数和总考成绩，不影响文章页里的“已掌握/学习中”标记和造句。'),
    h('button', {type:'button', class:'btn sm', onclick:function(){
      if (!resetArmed){ resetArmed = true; renderWords(); return; }
      srsReset(); resetArmed = false; SESS.review = null; SESS.exam = null; SESS.listen = null; renderAll();
    }}, resetArmed ? '再点一次确认清空' : '清空复习记录')
  );
}

/* ---------- tabs ---------- */
function show(t){
  if (TABS.indexOf(t) < 0) t = 'review';
  const changed = cur !== null && cur !== t;
  cur = t;
  $$('.view').forEach(function(v){ v.hidden = v.id !== 'view-' + t; });
  $$('.tab').forEach(function(b){
    const on = b.dataset.tab === t;
    b.classList.toggle('on', on);
    b.setAttribute('aria-selected', String(on));
  });
  if (changed){
    resetArmed = false;
    if (t === 'review') renderReview();
    if (t === 'exam') renderExam();
    if (t === 'listen') renderListenTab();
    if (t === 'words') renderWords();
    try { location.hash = t; } catch(e){}
    window.scrollTo(0, 0);
  }
}
function renderAll(){ renderReview(); renderExam(); renderListenTab(); renderWords(); renderToday(); }
function init(){
  $$('.tab').forEach(function(b){ b.addEventListener('click', function(){ show(b.dataset.tab); }); });
  window.addEventListener('hashchange', function(){ const t = location.hash.replace('#', ''); if (t !== cur) show(t); });
  $('#wSearch').addEventListener('input', function(){ wQuery = this.value; wLimit = 60; renderWords(); });
  const flush = function(){ settle(SESS.review); settle(SESS.exam); settle(SESS.listen); };
  window.addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', function(){ if (document.hidden) flush(); });
  renderAll();
  show(location.hash.replace('#', '') || 'review');
}
init();
})();
</script>
