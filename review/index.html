<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>词汇复习 · 外刊精读</title>
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: one 720px reading column under a sticky masthead; four tabs (read, words, quiz, think) share it. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#E8EDF3; --fg:#16202B; --muted:#58656F; --line:#D3DBE4;
  --accent:#2B5C8E; --accent-soft:#DDE9F5; --on-accent:#FFFFFF;
  --koban:#C0392B; --lamp-halo:rgba(192,57,43,.18); --mark:#FBE8A6;
  --good:#27693F; --good-soft:#DDF0E3; --warn:#8A5700; --warn-soft:#FBEBC8; --bad:#B3261E; --bad-soft:#FAE0DD;
  --font-read:'Literata','Iowan Old Style',Georgia,'Songti SC','Noto Serif CJK SC',serif;
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --radius:10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font:16px/1.6 var(--font-ui);background:var(--bg);color:var(--fg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.in{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* masthead */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;font:600 18px/1.2 var(--font-read);letter-spacing:-.01em}
.b-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{flex:none;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font:500 12.5px/1.2 var(--font-ui);color:var(--muted);text-decoration:none;letter-spacing:0}
.back:hover{color:var(--fg);background:var(--surface-2)}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:9px 4px 10px;font:500 14px/1 var(--font-ui);color:var(--muted);cursor:pointer}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}

main{padding-block:22px 56px}
.view[hidden]{display:none}

/* shared */
.eyebrow{font:500 12px/1.2 var(--font-ui);letter-spacing:.08em;color:var(--accent)}
.h2{margin:0 0 6px;font:600 22px/1.3 var(--font-read);text-wrap:balance}
.h3{margin:20px 0 8px;font:600 16px/1.4 var(--font-ui)}
.lead{margin:0 0 14px;color:var(--muted);font-size:15px}
.meta{margin:0;font-size:12.5px;line-height:1.5;color:var(--muted)}
.mono{font-family:var(--font-mono);font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.btn{appearance:none;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:500 14px/1.2 var(--font-ui);cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font:500 13px/1.2 var(--font-ui);color:var(--muted);cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg-b{appearance:none;padding:6px 10px;border:0;border-right:1px solid var(--line);background:none;font:500 12.5px/1.2 var(--font-ui);color:var(--muted);cursor:pointer}
.seg-b:last-child{border-right:0}
.seg-b.on.s-new{background:var(--surface-2);color:var(--fg)}
.seg-b.on.s-learning{background:var(--warn-soft);color:var(--warn)}
.seg-b.on.s-mastered{background:var(--good-soft);color:var(--good)}
textarea{display:block;width:100%;min-height:58px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px;line-height:1.55;resize:vertical}
mark.vw{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}

/* word context line and speaker button (used by the word cards and by the quiz feedback) */
.w-ctx{margin:0;font:italic 400 14.5px/1.65 var(--font-read);color:var(--muted)}
.spk{flex:none;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--accent);cursor:pointer}
.spk:hover{background:var(--accent-soft)}
.spk.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.spk svg{display:block}

/* quiz */
.q-head{display:flex;align-items:center;justify-content:space-between;gap:14px}
.pbar{flex:1;max-width:240px;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.pbar i{display:block;height:100%;width:var(--p,0%);background:var(--accent)}
.q-sent{margin:16px 0 8px;font:400 20px/2.1 var(--font-read);overflow-wrap:anywhere}
.q-input{display:inline-block;max-width:100%;padding:2px 8px;border:0;border-bottom:2px solid var(--accent);border-radius:4px 4px 0 0;background:var(--accent-soft);font:500 18px/1.4 var(--font-mono);text-align:center}
.q-input.ok{border-bottom-color:var(--good);background:var(--good-soft)}
.q-input.bad{border-bottom-color:var(--bad);background:var(--bad-soft)}
.q-hint{margin:0;font-size:14px;color:var(--muted)}
.q-zh{margin:18px 0 6px;font:500 21px/1.6 var(--font-ui);overflow-wrap:anywhere}
.q-line{margin:10px 0 8px}
.q-input.q-wide{display:block;width:100%;box-sizing:border-box;padding:8px 10px;font-size:18px;text-align:left}
.q-area{margin:8px 0 4px;font:400 17px/1.6 var(--font-read)}
.q-tgt{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0 0 6px}
.q-tgt b{padding:1px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font:600 15px/1.5 var(--font-read)}
.miss-s b,.fb b.hl{font-weight:600;background:var(--mark);border-radius:2px;padding:0 1px}
.fb{margin-top:16px;padding:12px 14px;border-radius:8px;background:var(--surface-2)}
.fb.ok{background:var(--good-soft)}
.fb.bad{background:var(--bad-soft)}
.fb p{margin:0 0 6px;font-size:14.5px}
.fb .fb-t{font-weight:600}
.fb.ok .fb-t{color:var(--good)}
.fb.bad .fb-t{color:var(--bad)}
.fb-s{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.score{margin:0 0 12px;font:400 18px/1.2 var(--font-mono);color:var(--muted)}
.score .big{font-size:44px;color:var(--fg)}
.miss{padding:10px 0;border-top:1px solid var(--line)}
.miss-s{margin:0 0 4px;font:400 17px/1.7 var(--font-read)}

.mt4{margin-top:4px}
.mt10{margin-top:10px}
.mt12{margin-top:12px}
.mb12{margin-bottom:12px}
.mb14{margin-bottom:14px}
.mb16{margin-bottom:16px}
.foot{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.7;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* quiz kit: multiple choice, dictation, feedback pieces */
.q-ask{margin:14px 0 0;font-size:14px;color:var(--muted)}
.q-big{margin:6px 0 0;font:600 26px/1.35 var(--font-read);overflow-wrap:anywhere}
.q-big .spk{vertical-align:middle;margin-left:6px}
.q-ctx{margin:8px 0 0;font:italic 400 15.5px/1.7 var(--font-read);color:var(--muted)}
.mc{display:grid;gap:8px;margin:16px 0 4px}
.mc-b{appearance:none;display:flex;align-items:flex-start;gap:10px;width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:9px;background:var(--surface);text-align:left;font:400 16px/1.5 var(--font-ui);color:var(--fg);cursor:pointer}
.mc-b:hover:not(:disabled){background:var(--surface-2)}
.mc-b .n{flex:none;width:20px;height:20px;margin-top:1px;border:1px solid var(--line);border-radius:50%;font:500 11.5px/18px var(--font-mono);text-align:center;color:var(--muted)}
.mc-b.ok{border-color:var(--good);background:var(--good-soft)}
.mc-b.bad{border-color:var(--bad);background:var(--bad-soft)}
.mc-b:disabled{cursor:default;opacity:1;color:var(--fg)}
.dict-btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 10px}
.btn.play{display:inline-flex;align-items:center;gap:7px}
.btn.play svg{display:block}
.btn.play.on{box-shadow:0 0 0 2px var(--accent-soft)}
.df{margin:0 0 8px;font:400 16.5px/1.7 var(--font-read)}
.df-l{display:block;font:500 12px/1.5 var(--font-ui);color:var(--muted)}
.miss-t{color:var(--bad);text-decoration:underline wavy;text-decoration-thickness:1px;text-underline-offset:3px}
.fb-x:empty{display:none}
.w-note{margin:0 0 6px;font-size:13.5px;line-height:1.6;color:var(--muted)}

</style>
<style>
/* review-page styles; the shared ones are in tools/shared/base.css */
.prog{flex:none;text-align:right}
.prog .t{font-size:12px;line-height:1.3;color:var(--muted)}
.prog b{font:400 13px/1.3 var(--font-mono);color:var(--fg)}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 16px}
.st{padding:10px 4px 9px;background:var(--surface-2);border-radius:9px;text-align:center}
.st b{display:block;font:600 24px/1.2 var(--font-mono)}
.st span{font-size:12px;color:var(--muted)}
.st.hot b{color:var(--accent)}
.sub{margin:18px 0 6px;font:600 14px/1.4 var(--font-ui)}
.next{margin:12px 0 0;font-size:14px;color:var(--muted)}
.lad{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:7px}
.lad li{display:grid;grid-template-columns:64px 1fr 30px;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.lad .tr{height:8px;margin:0;border-radius:4px;background:var(--surface-2);overflow:hidden}
.lad .tr i{display:block;height:100%;width:var(--p,0%);background:var(--accent)}
.lad .n{font:400 12.5px/1 var(--font-mono);color:var(--fg);text-align:right}
.lad li.due .tr i{background:var(--warn)}
.how{margin:0;font-size:14px;line-height:1.75}
.how li{margin-bottom:4px}
.sel{display:block;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px}
.fld{margin:14px 0 6px;font:500 13px/1.4 var(--font-ui);color:var(--muted)}
.hist{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:13.5px}
.hist li{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;background:var(--surface-2);border-radius:8px}
.hist b{font:600 13.5px/1.4 var(--font-mono)}
.grade{margin:0 0 12px;font:500 15px/1.6 var(--font-ui)}
.per{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:8px;font-size:13px}
.per li{display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.per .tr{grid-column:1 / -1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.per .tr i{display:block;height:100%;width:var(--p,0%);background:var(--good)}
.srs-line{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1 1 200px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px}
.wrow{display:block;margin-bottom:8px;padding:11px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);color:inherit;text-decoration:none}
.wrow:hover{border-color:var(--accent)}
.wrow b{font:600 16.5px/1.4 var(--font-read)}
.wrow .z{font-size:14px}
.wrow .m{margin-top:3px;font-size:12px;line-height:1.6;color:var(--muted)}
.wrow .m span{display:block}
.wrow .m .d.due{color:var(--warn);font-weight:500}
.empty{padding:26px 0;text-align:center;color:var(--muted)}
.danger{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.err{color:var(--bad)}
</style>
</head>
<body>

<div class="bar">
  <div class="in">
    <div class="mast">
      <div class="brand"><a class="back" href="../">‹ 合集</a><span class="b-title">词汇复习</span></div>
      <div class="prog"><div class="t">今日已练 <b id="todayN">0</b> 题</div><div class="t" id="todayOk">&nbsp;</div></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="页面">
      <button type="button" class="tab" role="tab" data-tab="review">复习</button>
      <button type="button" class="tab" role="tab" data-tab="exam">总考</button>
      <button type="button" class="tab" role="tab" data-tab="listen">听力</button>
      <button type="button" class="tab" role="tab" data-tab="words">词汇表</button>
    </nav>
  </div>
</div>

<main class="in">
  <section class="view" id="view-review" role="tabpanel"><div id="rvBox"></div></section>
  <section class="view" id="view-exam" role="tabpanel" hidden><div id="exBox"></div></section>
  <section class="view" id="view-listen" role="tabpanel" hidden><div id="lsBox"></div></section>
  <section class="view" id="view-words" role="tabpanel" hidden>
    <div class="tools"><input class="search" id="wSearch" type="search" placeholder="搜索表达或中文" autocomplete="off" aria-label="搜索词汇"></div>
    <div class="chips mb14" id="wChips"></div>
    <div id="wList"></div>
    <div class="danger" id="wDanger"></div>
  </section>
  <p class="foot">复习进度（每个词的复习阶段、今日练习数、总考和听力考试成绩）只保存在你当前设备的浏览器里，换手机或清理浏览器数据后不会同步。</p>
</main>

<script>
(function(){
'use strict';
/* ---------- small helpers shared by every page (inlined by tools/build.py) ---------- */
function $(s, r){ return (r || document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function h(tag, attrs){
  const e = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(k){
    const v = attrs[k];
    if (v == null || v === false) return;
    if (k === 'class') e.className = v;
    else if (k.slice(0,2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : String(v));
  });
  Array.prototype.slice.call(arguments, 2).forEach(function(kid){
    [].concat(kid).forEach(function(k){
      if (k == null || k === false) return;
      e.append(k.nodeType ? k : document.createTextNode(String(k)));
    });
  });
  return e;
}
function pad2(n){ return String(n).padStart(2, '0'); }
function ymd(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function today(){ return ymd(new Date()); }
function lsGet(k){ try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function norm(s){ return String(s).toLowerCase().replace(/[^a-z]/g, ''); }
function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
/* example sentences mark their target as [[target]] */
function exNodes(s){
  const out = [];
  s.split(/\[\[(.+?)\]\]/).forEach(function(part, k){ if (part) out.push(k % 2 ? h('b', null, part) : document.createTextNode(part)); });
  return out;
}
function exPlain(s){ return s.replace(/\[\[|\]\]/g, ''); }

/* ---------- spaced repetition on the Ebbinghaus ladder (inlined by tools/build.py) ----------
   Everything lives in this browser's localStorage under SRS_KEY, shape
     {v:1, w:{"<slug>:<word id>": {b, t, l, c, x}}, log:{"YYYY-MM-DD": {n, ok}}, ex:[{d, score, total, scope, k}]}   (k: "exam" = 总考, "listen" = 听力考试)
   b = steps of the ladder passed (0..9)   t = when it is due next (ms)   l = last answered (ms)
   c / x = how many times answered right / wrong.
   Rules:  first answer right -> b=1 (next review after the 2nd step), first answer wrong -> b=0 (5 minutes)
           right and due     -> b+1, next review after SRS_STEPS[b] (after the last step: SRS_LONG)
           right but early   -> the schedule does not move (drilling a word again right away must not push it up the ladder)
           wrong at any time -> b=0, back to the first step
   srsStep is pure; it is covered by tools/tests/srs.test.js. */
const SRS_KEY = 'wk-srs-v1';
const SRS_MIN = 60000, SRS_HOUR = 3600000, SRS_DAY = 86400000;
const SRS_STEPS = [5 * SRS_MIN, 30 * SRS_MIN, 12 * SRS_HOUR, SRS_DAY, 2 * SRS_DAY, 4 * SRS_DAY, 7 * SRS_DAY, 15 * SRS_DAY, 30 * SRS_DAY];
const SRS_LONG = 60 * SRS_DAY;
const SRS_TOP = SRS_STEPS.length;                 /* b can go from 0 to SRS_TOP */
const SRS_LABELS = ['5 分钟', '30 分钟', '12 小时', '1 天', '2 天', '4 天', '7 天', '15 天', '30 天', '60 天'];

function srsInterval(b){ return b < SRS_STEPS.length ? SRS_STEPS[b] : SRS_LONG; }
function srsNum(x){ return typeof x === 'number' && isFinite(x) ? x : 0; }
function srsLoad(){
  const d = lsGet(SRS_KEY);
  const out = {v:1, w:{}, log:{}, ex:[]};
  if (!d || typeof d !== 'object') return out;
  if (d.w && typeof d.w === 'object') Object.keys(d.w).forEach(function(k){
    const e = d.w[k];
    if (!e || typeof e !== 'object') return;
    const b = Math.max(0, Math.min(SRS_TOP, Math.floor(srsNum(e.b))));
    out.w[k] = {b:b, t:srsNum(e.t), l:srsNum(e.l), c:Math.max(0, Math.floor(srsNum(e.c))), x:Math.max(0, Math.floor(srsNum(e.x)))};
  });
  if (d.log && typeof d.log === 'object') Object.keys(d.log).forEach(function(k){
    const e = d.log[k];
    if (/^\d{4}-\d{2}-\d{2}$/.test(k) && e && typeof e === 'object') out.log[k] = {n:Math.max(0, Math.floor(srsNum(e.n))), ok:Math.max(0, Math.floor(srsNum(e.ok)))};
  });
  if (Array.isArray(d.ex)) d.ex.slice(-20).forEach(function(e){
    if (e && typeof e === 'object' && typeof e.score === 'number' && typeof e.total === 'number')
      out.ex.push({d:String(e.d || '').slice(0, 10), score:e.score, total:e.total, scope:String(e.scope || '').slice(0, 60), k:e.k === 'listen' ? 'listen' : 'exam'});
  });
  return out;
}
function srsSave(s){ lsSet(SRS_KEY, s); }
function srsGet(key){ return srsLoad().w[key] || null; }

/* pure: the entry after one answer (e = null when the word has never been answered) */
function srsStep(e, ok, now){
  const first = !e;
  const n = first ? {b:0, t:0, l:0, c:0, x:0} : {b:e.b, t:e.t, l:e.l, c:e.c, x:e.x};
  if (!ok){
    n.b = 0; n.t = now + srsInterval(0); n.x++;
  } else {
    n.c++;
    if (first){ n.b = 1; n.t = now + srsInterval(1); }
    else if (n.t <= now){ n.b = Math.min(n.b + 1, SRS_TOP); n.t = now + srsInterval(n.b); }
  }
  n.l = now;
  return n;
}
/* what would happen, without writing anything: {kind:'first'|'up'|'early'|'reset', b, t} */
function srsPreview(key, ok, now){
  now = now || Date.now();
  const e = srsGet(key), n = srsStep(e, ok, now);
  const kind = !ok ? 'reset' : !e ? 'first' : e.t <= now ? 'up' : 'early';
  return {kind:kind, b:n.b, t:n.t, was:e};
}
function srsRecord(key, ok, now){
  now = now || Date.now();
  const s = srsLoad();
  const prev = s.w[key] || null;
  s.w[key] = srsStep(prev, ok, now);
  const day = ymd(new Date(now));
  const g = s.log[day] || (s.log[day] = {n:0, ok:0});
  g.n++; if (ok) g.ok++;
  const keep = Object.keys(s.log).sort().slice(-120);
  Object.keys(s.log).forEach(function(k){ if (keep.indexOf(k) < 0) delete s.log[k]; });
  srsSave(s);
  return {prev:prev, next:s.w[key], now:now};
}
/* take back one srsRecord(key, ok, now) whose result was `rec` (used when the learner overrules a mark afterwards) */
function srsUndo(key, rec, ok){
  const s = srsLoad();
  if (rec.prev) s.w[key] = rec.prev; else delete s.w[key];
  const g = s.log[ymd(new Date(rec.now))];
  if (g){ g.n = Math.max(0, g.n - 1); if (ok) g.ok = Math.max(0, g.ok - 1); }
  srsSave(s);
}
function srsAddExam(rec){
  const s = srsLoad();
  s.ex.push(rec);
  s.ex = s.ex.slice(-20);
  srsSave(s);
}
/* the learner overruled a mark in the result list: correct the score of the exam just saved */
function srsSetLastExamScore(score){
  const s = srsLoad();
  if (s.ex.length){ s.ex[s.ex.length - 1].score = score; srsSave(s); }
}
function srsReset(){ try { localStorage.removeItem(SRS_KEY); } catch(e){} }

/* {st:'new'|'due'|'wait', b, t} */
function srsInfo(e, now){
  if (!e) return {st:'new', b:-1, t:0};
  return {st:e.t <= now ? 'due' : 'wait', b:e.b, t:e.t};
}
/* "5 分钟后", "3 小时后", "明天", "6 天后" */
function srsWhen(t, now){
  const d = t - now;
  if (d <= 0) return '现在';
  if (d < SRS_HOUR) return Math.max(1, Math.round(d / SRS_MIN)) + ' 分钟后';
  if (d < SRS_DAY) return Math.round(d / SRS_HOUR) + ' 小时后';
  const days = Math.round(d / SRS_DAY);
  if (days === 1) return '明天';
  if (days < 60) return days + ' 天后';
  return Math.round(days / 30) + ' 个月后';
}
function srsStageText(e, now){
  if (!e) return '未开始';
  return '间隔 ' + SRS_LABELS[e.b] + ' · ' + (e.t <= now ? '该复习了' : '下次 ' + srsWhen(e.t, now));
}

/* ---------- speaker buttons and the clip player (inlined by tools/build.py) ----------
   A "clip" is a slice [start, end] of an MP3 sprite (clips.mp3 of one article). One Audio element per sprite file;
   only one clip plays at a time. If the sprite is missing or fails to load, the browser's own speech synthesis reads the text. */
const SPK_SVG = '<svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 4V5L7 9H3z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
function spkEl(label, onclick){
  const b = h('button', {type:'button', class:'spk', 'aria-label':label, title:label, onclick:onclick});
  b.innerHTML = SPK_SVG;
  return b;
}
const Clip = (function(){
  const st = {a:null, end:0, btn:null, raf:0, text:''};
  const audios = {};
  let beforePlay = null;
  function done(){
    cancelAnimationFrame(st.raf);
    if (st.btn){ st.btn.classList.remove('on'); st.btn = null; }
  }
  function fallback(text){
    try {
      if (!('speechSynthesis' in window) || !text) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-GB'; u.rate = 0.9;
      speechSynthesis.speak(u);
    } catch(e){}
  }
  function audio(src){
    if (audios[src]) return audios[src];
    const a = new Audio();
    a.preload = 'auto';
    a.src = src;
    a.addEventListener('error', function(){ if (st.a === a){ const t = st.text; done(); fallback(t); } });
    a.addEventListener('ended', function(){ if (st.a === a) done(); });
    a.addEventListener('pause', function(){ if (st.a === a && a.currentTime < st.end) done(); });
    audios[src] = a;
    return a;
  }
  function tick(){
    const a = st.a;
    if (!a || a.paused) return;
    if (a.currentTime >= st.end){ a.pause(); done(); return; }
    st.raf = requestAnimationFrame(tick);
  }
  /* play one clip; clicking the same button again stops it. rate: 1 (default) or e.g. 0.7 */
  function play(src, t, btn, text, rate){
    if (!t || !src){ if (beforePlay) beforePlay(); done(); fallback(text); return; }
    if (beforePlay) beforePlay();
    const a = audio(src);
    const wasOn = !!btn && st.btn === btn && st.a === a && !a.paused;
    done();
    if (st.a && st.a !== a && !st.a.paused) st.a.pause();
    if (wasOn){ a.pause(); return; }
    st.a = a; st.btn = btn || null; st.text = text;
    st.end = t[1] + 0.15;
    if (btn) btn.classList.add('on');
    a.playbackRate = rate || 1;
    try { a.preservesPitch = true; a.webkitPreservesPitch = true; } catch(e){}
    const start = Math.max(0, t[0] - 0.1);
    const go = function(){ a.currentTime = start; };
    if (a.readyState >= 1) go(); else a.addEventListener('loadedmetadata', go, {once:true});
    const pr = a.play();
    if (pr && pr.catch) pr.catch(function(){ done(); });
    cancelAnimationFrame(st.raf);
    st.raf = requestAnimationFrame(tick);
  }
  function stop(){
    if (st.a && !st.a.paused) st.a.pause();
    done();
  }
  return {play:play, stop:stop, onBeforePlay:function(fn){ beforePlay = fn; }};
})();
/* speaker button for one word / example of an article: clips = {src, t:{key:[start,end]}} */
function clipBtn(clips, key, text){
  if (!clips) return null;
  const b = spkEl('播放发音', function(){ Clip.play(clips.src, clips.t[key], b, text); });
  return b;
}

/* ---------- quiz kit: one renderer per question type, shared by the reader and the review page ----------
   Kit.make(item, o) returns the question card (a DOM element).
     item = {type, key, id, v, k, dir, clips}
        type   'mcq' | 'cloze' | 'exs' | 'zh' | 'dict' | 'sent'
        key    "<slug>:<word id>" (the spaced-repetition key)       id  the word id within its article
        v      the word: {id, expr, zh, core, forms, syn, note, m, ctx, ex:[{en, zh}], cloze:{before, ans, after, hint, szh}}
        k      which example sentence (exs, sent, dict); dict: -1 = the word itself
        dir    mcq only: 'e2z' (English expression -> pick the meaning) or 'z2e' (meaning -> pick the expression)
        sent   dict only: {en, zh, src, t} a sentence of the article instead of a word (then v and key may be null)
        clips  {src, t:{key:[start, end]}} or null (no audio for this article)
     o = {index, total, last, tag, label (replaces the type name in the header),
          defer (dict only: no feedback, the answer goes straight to onAnswer + onNext),
          pool()            -> [{expr, zh}] words that may serve as wrong options (mcq)
          extra(item, res)  -> a node shown at the bottom of the feedback (or null)
          onAnswer(res)     the answer is in (res.ok may still flip once through the "my answer is fine" button)
          onChange(res)     optional: res.ok was flipped by that button
          isLast()          optional: is this the last question? (read when the button label is set; `last` is the static version)
          onNext()          the learner pressed "next"}
   res = {id, key, type, ok, given, k}. */
const Kit = (function(){
  const TYPE_NAME = {mcq:'选择题', cloze:'文章填空', exs:'例句填空', zh:'中译英词汇', dict:'听写', sent:'中译英整句'};
  const ONES = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
  const TENS = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];

  function markTerms(text, terms){
    const ts = (terms || []).slice().sort(function(a, b){ return b.length - a.length; });
    if (!ts.length) return [document.createTextNode(text)];
    const re = new RegExp('\\b(?:' + ts.map(esc).join('|') + ')\\b', 'gi');
    const out = [];
    let last = 0, m;
    while ((m = re.exec(text))){
      if (m.index > last) out.push(document.createTextNode(text.slice(last, m.index)));
      out.push(h('mark', {class:'vw'}, m[0]));
      last = m.index + m[0].length;
    }
    if (last < text.length) out.push(document.createTextNode(text.slice(last)));
    return out;
  }
  /* an example sentence as a cloze: the [[target]] becomes the blank */
  function exCloze(v, k){
    const x = v.ex[k];
    const m = /^([\s\S]*?)\[\[(.+?)\]\]([\s\S]*)$/.exec(x.en);
    return {before:m[1], ans:m[2], after:m[3].replace(/\[\[|\]\]/g, ''), hint:v.zh, szh:x.zh};
  }
  function numWords(n){
    if (n < 20) return ONES[n];
    if (n < 100) return TENS[Math.floor(n / 10)] + (n % 10 ? ' ' + ONES[n % 10] : '');
    return ONES[Math.floor(n / 100)] + ' hundred' + (n % 100 ? ' ' + numWords(n % 100) : '');
  }
  /* 2019 -> twenty nineteen, 1984 -> nineteen eighty four (the way a speaker reads a year) */
  function yearWords(t){
    if (!/^\d{4}$/.test(t)) return null;
    const n = Number(t);
    if (!((n >= 1100 && n <= 1999) || (n >= 2010 && n <= 2099)) || n % 100 < 10) return null;
    return numWords(Math.floor(n / 100)).split(' ').concat(numWords(n % 100).split(' '));
  }
  /* words of a sentence for comparing dictation: no case, no punctuation, no apostrophes, small numbers spelled out */
  function toks(s){
    const out = [];
    String(s).toLowerCase().replace(/[’‘']/g, '').split(/[^a-z0-9]+/).forEach(function(t){
      if (!t) return;
      if (/^\d{1,3}$/.test(t)) numWords(Number(t)).split(' ').forEach(function(w){ out.push(w); });
      else if (yearWords(t)) yearWords(t).forEach(function(w){ out.push(w); });
      else out.push(t);
    });
    return out;
  }
  function lcsHits(a, b){
    const n = a.length, m = b.length;
    const dp = [];
    for (let i = 0; i <= n; i++) dp.push(new Array(m + 1).fill(0));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
      dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    const ha = new Array(n).fill(false), hb = new Array(m).fill(false);
    let i = 0, j = 0;
    while (i < n && j < m){
      if (a[i] === b[j]){ ha[i] = hb[j] = true; i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) i++;
      else j++;
    }
    return {ha:ha, hb:hb};
  }
  /* the text with the words that are not in `hits` underlined */
  function chunkDiff(text, hits){
    const out = [];
    let pos = 0;
    text.split(/\s+/).filter(Boolean).forEach(function(chunk){
      const n = toks(chunk).length;
      let miss = false;
      for (let k = 0; k < n; k++) if (!hits[pos + k]) miss = true;
      pos += n;
      if (out.length) out.push(' ');
      out.push(miss ? h('span', {class:'miss-t'}, chunk) : chunk);
    });
    return out;
  }

  /* ---- pieces every question uses ---- */
  function head(o, type){
    const bar = h('div', {class:'pbar'}, h('i'));
    bar.style.setProperty('--p', (o.index / o.total * 100) + '%');
    return h('div', {class:'q-head'}, h('span', {class:'eyebrow'}, '第 ' + (o.index + 1) + ' 题 / ' + o.total + '　' + (o.label || TYPE_NAME[type]) + (o.tag ? '　' + o.tag : '')), bar);
  }
  function inputAttrs(extra){
    return Object.assign({type:'text', id:'q-input', autocomplete:'off', autocapitalize:'off', autocorrect:'off', spellcheck:'false'}, extra);
  }
  function nextLabel(o){ return (o.isLast ? o.isLast() : o.last) ? '看成绩' : '下一题'; }
  function speakLine(item, v){
    return h('p', null, clipBtn(item.clips, 'w' + v.id, v.core), item.clips ? ' ' : null, h('b', null, v.expr), '　', v.zh);
  }
  function extraBox(item, res, o){
    const box = h('div', {class:'fb-x'});

  }
  function newRes(item, type){ return {id:item.id, key:item.key || null, type:type, ok:false, given:'', k:item.k}; }

  /* ---- fill the blank: the sentence is the article's (cloze) or one of the word's examples (exs) ---- */

    const inp = h('input', inputAttrs({class:'q-input', 'aria-label':'填入缺失的单词'}));
    inp.style.width = Math.max(6, c.ans.length + 2) + 'ch';
    const fb = h('div', {class:'fb', hidden:true, 'aria-live':'polite'});
    const main = h('button', {type:'button', class:'btn pri'}, '检查');
    const peek = h('button', {type:'button', class:'btn'}, '提示首字母');
    const ex = extraBox(item, res, o);
    let checked = false;
    const card = h('div', {class:'card'},
      head(o, type),
      h('p', {class:'q-sent'}, c.before, inp, c.after),
      h('p', {class:'q-hint'}, c.hint + '　', h('span', {class:'mono'}, c.ans.length + ' 个字母')),
      fb,
      h('div', {class:'row'}, main, peek)
    );
    peek.addEventListener('click', function(){ inp.placeholder = c.ans.charAt(0); inp.focus(); });
    function check(){
      const val = norm(inp.value);
      if (!val){ inp.focus(); return; }
      const ok = val === norm(c.ans);
      checked = true;
      res.ok = ok; res.given = inp.value.trim();
      o.onAnswer(res);
      inp.readOnly = true;
      inp.classList.add(ok ? 'ok' : 'bad');
      fb.className = 'fb ' + (ok ? 'ok' : 'bad');
      fb.hidden = false;
      fb.replaceChildren(
        h('p', {class:'fb-t'}, ok ? '正确' : ['不对，答案是 ', h('b', null, c.ans)]),
        h('p', null, c.szh),
        speakLine(item, v),
        ex
      );
      ex.refresh();
      peek.hidden = true;
      main.textContent = nextLabel(o);
      main.focus();
    }
    main.addEventListener('click', function(){ if (checked) o.onNext(); else check(); });
    inp.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); main.click(); } });
    return card;
  }

  /* ---- Chinese -> the English expression, typed ---- */
  function zhQ(item, o){
    const v = item.v, res = newRes(item, 'zh');
    const words = v.core.split(' ');
    const inp = h('input', inputAttrs({class:'q-input q-wide', 'aria-label':'写出对应的英文表达'}));
    const fb = h('div', {class:'fb', hidden:true, 'aria-live':'polite'});
    const main = h('button', {type:'button', class:'btn pri'}, '检查');
    const peek = h('button', {type:'button', class:'btn'}, '提示首字母');
    const ex = extraBox(item, res, o);
    let checked = false;
    const card = h('div', {class:'card'},
      head(o, 'zh'),
      h('p', {class:'q-zh'}, v.zh),
      h('p', {class:'q-line'}, inp),
      h('p', {class:'q-hint'}, words.length + ' 个词：', h('span', {class:'mono'}, words.map(function(w){ return w.length; }).join(' + ') + ' 个字母')),
      fb,
      h('div', {class:'row'}, main, peek)
    );
    peek.addEventListener('click', function(){ inp.placeholder = v.core.charAt(0) + '…'; inp.focus(); });
    function check(){
      const val = norm(inp.value);
      if (!val){ inp.focus(); return; }
      const own = v.forms.map(norm).indexOf(val) >= 0;
      const ok = own || v.syn.map(norm).indexOf(val) >= 0;
      checked = true;
      res.ok = ok; res.given = inp.value.trim();
      o.onAnswer(res);
      inp.readOnly = true;
      inp.classList.add(ok ? 'ok' : 'bad');
      fb.className = 'fb ' + (ok ? 'ok' : 'bad');
      fb.hidden = false;
      const headP = h('p', {class:'fb-t'}, ok ? '正确' : ['不对，参考答案是 ', h('b', null, v.expr)]);
      const kids = [headP];
      if (ok && !own) kids.push(h('p', null, '你写的是近义表达，文章里用的是 ', h('b', null, v.core), '。'));
      if (!ok){
        const alt = h('button', {type:'button', class:'btn sm'}, '我写的也对（近义词）');
        alt.addEventListener('click', function(){
          res.ok = true;

          inp.classList.remove('bad'); inp.classList.add('ok');
          headP.replaceChildren('已按你的判断算对。参考答案是 ', h('b', null, v.expr));
          alt.remove();
          ex.refresh();
          if (o.onChange) o.onChange(res);
          main.textContent = nextLabel(o);
          main.focus();
        });

      }
      kids.push(speakLine(item, v));
      kids.push(h('p', {class:'w-ctx'}, markTerms(v.ctx, v.m)));

    }
    main.addEventListener('click', function(){ if (checked) o.onNext(); else check(); });
    inp.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); main.click(); } });
    return card;
  }

  /* ---- Chinese sentence -> the whole English sentence, graded by the learner ---- */
  function sentRe(v){
    const alts = v.forms.map(function(f){
      return f.toLowerCase().split(/[^a-z]+/).filter(Boolean).map(esc).join('[^A-Za-z]+');
    });
    return new RegExp('(?:^|[^A-Za-z])(?:' + alts.join('|') + ')(?![A-Za-z])', 'i');
  }
  function sentQ(item, o){
    const v = item.v, x = v.ex[item.k], res = newRes(item, 'sent');
    const ta = h('textarea', inputAttrs({class:'q-area', rows:3, maxlength:400, placeholder:'把这句话写成英文', 'aria-label':'写出整句英文'}));
    const hintP = h('p', {class:'q-hint'});
    const fb = h('div', {class:'fb', hidden:true, 'aria-live':'polite'});
    const main = h('button', {type:'button', class:'btn pri'}, '核对');
    const peek = h('button', {type:'button', class:'btn'}, '提示：这个表达的意思');
    const card = h('div', {class:'card'},
      head(o, 'sent'),
      h('p', {class:'q-zh'}, x.zh),
      h('p', {class:'q-tgt'}, h('span', {class:'meta'}, '请用上'), h('b', null, v.expr)),
      hintP,
      ta,
      fb,
      h('div', {class:'row'}, main, peek)
    );
    peek.addEventListener('click', function(){ hintP.textContent = v.expr + '：' + v.zh; peek.hidden = true; ta.focus(); });
    function grade(ok){
      res.ok = ok; res.given = ta.value.trim();
      o.onAnswer(res);
      o.onNext();

    function check(){
      const val = ta.value.trim();
      if (!val){ ta.focus(); return; }
      const used = sentRe(v).test(val);
      ta.readOnly = true;
      fb.className = 'fb ' + (used ? 'ok' : 'bad');
      fb.hidden = false;
      fb.replaceChildren(
        h('p', {class:'fb-t'}, used ? '用到了 ' + v.expr : '没看到 ' + v.expr + '（词形变化也算）'),
        h('p', null, clipBtn(item.clips, 'e' + v.id + '_' + item.k, exPlain(x.en)), item.clips ? ' ' : null, '参考句：', exNodes(x.en)),
        h('p', {class:'meta'}, '对照参考句，自己判断：时态、搭配、拼写有没有问题。意思对、表达自然就算写对。'),
        h('div', {class:'row'},
          h('button', {type:'button', class:'btn pri', onclick:function(){ grade(true); }}, '我写对了'),
          h('button', {type:'button', class:'btn', onclick:function(){ grade(false); }}, '还要再练'))
      );
      main.hidden = true;
      peek.hidden = true;
    }
    main.addEventListener('click', check);
    ta.addEventListener('keydown', function(e){ if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); check(); } });
    return card;
  }

  /* ---- multiple choice: meaning of an expression (e2z), or the expression for a meaning (z2e) ---- */
  function mcqQ(item, o){
    const v = item.v, res = newRes(item, 'mcq');
    const dir = item.dir === 'z2e' ? 'z2e' : 'e2z';
    const right = dir === 'e2z' ? v.zh : v.expr;
    const seen = {};
    seen[right] = true;
    const wrong = [];
    shuffle((o.pool ? o.pool() : []).slice()).forEach(function(p){
      const t = dir === 'e2z' ? p.zh : p.expr;
      if (t && !seen[t] && wrong.length < 3){ seen[t] = true; wrong.push(t); }
    });
    const texts = shuffle([right].concat(wrong));
    const ex = extraBox(item, res, o);
    const fb = h('div', {class:'fb', hidden:true, 'aria-live':'polite'});
    const main = h('button', {type:'button', class:'btn pri', hidden:true}, nextLabel(o));
    let answered = false;
    const btns = texts.map(function(t, i){
      return h('button', {type:'button', class:'mc-b', onclick:function(){ pick(i); }}, h('span', {class:'n'}, String(i + 1)), h('span', null, t));
    });
    const ask = dir === 'e2z'
      ? [h('p', {class:'q-ask'}, '这个表达在句子里是什么意思？'),
         h('p', {class:'q-big'}, v.expr, item.clips ? ' ' : null, clipBtn(item.clips, 'w' + v.id, v.core)),
         h('p', {class:'q-ctx'}, markTerms(v.ctx, v.m))]
      : [h('p', {class:'q-ask'}, '选出对应的英文表达'),
         h('p', {class:'q-zh'}, v.zh)];
    const card = h('div', {class:'card'},
      head(o, 'mcq'),
      ask,
      h('div', {class:'mc', role:'group', 'aria-label':'选项'}, btns),
      fb,
      h('div', {class:'row'}, main)
    );
    function pick(i){
      if (answered) return;
      answered = true;
      const ok = texts[i] === right;
      res.ok = ok; res.given = texts[i];
      o.onAnswer(res);
      btns.forEach(function(b, j){
        b.disabled = true;
        if (texts[j] === right) b.classList.add('ok');

/* ---------- listening exam: hear a word, an example or a sentence of the article, write it down ---------- */
const LS_SRC = [['mix', '混合'], ['w', '单词'], ['e', '例句'], ['s', '文章原句']];
const LS_LEN = [['any', '不限'], ['short', '短句（12 词内）'], ['mid', '中等（13–22 词）'], ['long', '长句（23 词起）']];
const LS_NUM = [[10, '10 题'], [20, '20 题'], [30, '30 题']];
const LS_MODE = [['exam', '考完统一公布'], ['live', '每题立刻核对']];
const KIND_NAME = {w:'单词', e:'例句', s:'文章原句'};
function lenOk(n, key){ return key === 'any' || (key === 'short' ? n <= 12 : key === 'mid' ? n >= 13 && n <= 22 : n >= 23); }
function lsCand(scope, lenKey){
  const c = {w:[], e:[], s:[]};
  ARTS.forEach(function(a){
    if (scope !== 'all' && a.slug !== scope) return;
    if (a.clips) a.w.forEach(function(x){ const key = a.slug + ':' + x[0]; c.w.push({kind:'w', key:key}); c.e.push({kind:'e', key:key}); });
    a.ls.forEach(function(p){ if (lenOk(p[1], lenKey)) c.s.push({kind:'s', slug:a.slug, si:p[0]}); });
  });
  return c;
}
/* n questions from the chosen sources, taking turns between the sources when mixed */
function lsPick(scope, src, n, lenKey){
  const c = lsCand(scope, lenKey);
  const lists = (src === 'mix' ? ['w', 'e', 's'] : [src]).map(function(k){ return shuffle(c[k].slice()); }).filter(function(l){ return l.length; });
  const out = [];
  for (let i = 0; out.length < n && lists.some(function(l){ return l.length; }); i++){
    const l = lists[i % lists.length];
    if (l.length) out.push(l.pop());
  }
  return shuffle(out);
}

    h('p', {class:'meta mt4'}, '可考：单词 ' + have.w + ' 个 · 例句 ' + have.e + ' 个词的例句 · 文章原句 ' + have.s + ' 句'),
    (ui.lsSrc === 'mix' || ui.lsSrc === 's') ? [h('p', {class:'fld'}, '文章原句的长度'), chipRow(LS_LEN, ui.lsLen, function(v){ ui.lsLen = v; saveUi(); renderListenTab(); })] : null,
    h('p', {class:'fld'}, '题量'),
    chipRow(LS_NUM, ui.lsN, function(v){ ui.lsN = Number(v); saveUi(); renderListenTab(); }),
    h('p', {class:'fld'}, '核对方式'),
    chipRow(LS_MODE, ui.lsMode, function(v){ ui.lsMode = v; saveUi(); renderListenTab(); })
  );
  const label = (ui.lsScope === 'all' ? '全部文章' : AMAP[ui.lsScope].short) + ' · ' + (LS_SRC.filter(function(x){ return x[0] === ui.lsSrc; })[0][1]);
  const start = function(){
    startListen(lsPick(ui.lsScope, ui.lsSrc, n, ui.lsLen), {box:box, mode:ui.lsMode, scopeLabel:label, home:home, again:start});
  };
  card.append(h('div', {class:'row'}, h('button', {type:'button', class:'btn pri', disabled:!avail, onclick:start}, avail ? '开始听力考试（' + n + ' 题）' : '这个范围里没有可考的内容')));
  box.append(card);
  const hc = histCard('最近的听力考试', 'listen');
  if (hc) box.append(hc);
}

/* ---------- vocabulary table ---------- */
const WF = [['all', '全部'], ['due', '待复习'], ['learning', '学习中'], ['strong', '已牢固'], ['new', '未开始']];
function wState(e, t){
  if (!e) return 'new';
  return e.b >= STRONG ? 'strong' : 'learning';
}
function renderWords(){
  const s = srsLoad(), t = now();
  const q = wQuery.trim().toLowerCase();
  const cnt = {all:ALL.length, due:0, learning:0, strong:0, new:0};
  ALL.forEach(function(w){ const e = s.w[w.key]; cnt[wState(e)]++; if (e && e.t <= t) cnt.due++; });
  const chips = $('#wChips');
  chips.replaceChildren();
  WF.forEach(function(o){
    chips.append(h('button', {type:'button', class:'chip' + (wFilter === o[0] ? ' on' : ''), 'aria-pressed':String(wFilter === o[0]),
      onclick:function(){ wFilter = o[0]; wLimit = 60; renderWords(); }}, o[1] + ' ' + cnt[o[0]]));
  });
  const rows = ALL.filter(function(w){
    const e = s.w[w.key];
    if (wFilter === 'due' && !(e && e.t <= t)) return false;
    if ((wFilter === 'learning' || wFilter === 'strong' || wFilter === 'new') && wState(e) !== wFilter) return false;
    if (q && (w.expr + ' ' + w.zh).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  const list = $('#wList');
  list.replaceChildren();
  if (!rows.length) list.append(h('p', {class:'empty'}, '没有符合条件的词。'));
  rows.slice(0, wLimit).forEach(function(w){
    const e = s.w[w.key];
    list.append(h('a', {class:'wrow', href:'../a/' + w.slug + '/#words'},
      h('b', null, w.expr), ' ', h('span', {class:'z'}, w.zh),
      h('div', {class:'m'}, h('span', null, dateLabel(AMAP[w.slug].date) + ' · ' + AMAP[w.slug].short),
        h('span', {class:'d' + (e && e.t <= t ? ' due' : '')}, e ? srsStageText(e, t) : '未开始'))));
  });
  if (rows.length > wLimit) list.append(h('div', {class:'row'}, h('button', {type:'button', class:'btn', onclick:function(){ wLimit += 60; renderWords(); }}, '再显示 ' + Math.min(60, rows.length - wLimit) + ' 个')));
  const dz = $('#wDanger');
  dz.replaceChildren(
    h('p', null, '想从头开始？可以清空复习记录。只清复习阶段、今日练习数和总考成绩，不影响文章页里的“已掌握/学习中”标记和造句。'),
    h('button', {type:'button', class:'btn sm', onclick:function(){
      if (!resetArmed){ resetArmed = true; renderWords(); return; }
      srsReset(); resetArmed = false; SESS.review = null; SESS.exam = null; SESS.listen = null; renderAll();
    }}, resetArmed ? '再点一次确认清空' : '清空复习记录')
  );
}

/* ---------- tabs ---------- */
function show(t){
  if (TABS.indexOf(t) < 0) t = 'review';
  const changed = cur !== null && cur !== t;
  cur = t;
  $$('.view').forEach(function(v){ v.hidden = v.id !== 'view-' + t; });
  $$('.tab').forEach(function(b){
    const on = b.dataset.tab === t;
    b.classList.toggle('on', on);
    b.setAttribute('aria-selected', String(on));
  });
  if (changed){
    resetArmed = false;
    if (t === 'review') renderReview();
    if (t === 'exam') renderExam();
    if (t === 'listen') renderListenTab();
    if (t === 'words') renderWords();
    try { location.hash = t; } catch(e){}
    window.scrollTo(0, 0);
  }
}
function renderAll(){ renderReview(); renderExam(); renderListenTab(); renderWords(); renderToday(); }
function init(){
  $$('.tab').forEach(function(b){ b.addEventListener('click', function(){ show(b.dataset.tab); }); });
  window.addEventListener('hashchange', function(){ const t = location.hash.replace('#', ''); if (t !== cur) show(t); });
  $('#wSearch').addEventListener('input', function(){ wQuery = this.value; wLimit = 60; renderWords(); });
  const flush = function(){ settle(SESS.review); settle(SESS.exam); settle(SESS.listen); };
  window.addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', function(){ if (document.hidden) flush(); });
  renderAll();
  show(location.hash.replace('#', '') || 'review');
}
init();
})();
</script>
