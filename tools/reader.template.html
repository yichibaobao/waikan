<!doctype html>
<html lang="zh-CN" data-lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__TITLE__</title>
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/*__BASE_CSS__*/
/*__WHO_CSS__*/
</style>
<style>
/* reader-specific styles; the shared ones are in tools/shared/base.css */
.lamp{flex:none;width:10px;height:10px;border-radius:50%;background:var(--koban);box-shadow:0 0 0 4px var(--lamp-halo)}
.prog{flex:none;text-align:right}
.prog .t{font-size:12px;line-height:1.3;color:var(--muted)}
.prog b{font:400 13px/1.3 var(--font-mono);color:var(--fg)}
.meter{width:112px;height:6px;margin:4px 0 3px auto;border-radius:999px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;width:var(--p,0%);background:var(--good)}
.prog .s{font-size:11px;min-height:14px}

/* listen */
.lp{display:grid;gap:14px}
.lp-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn.big{min-width:96px;padding:12px 22px;font-size:16px}
.lp-range{display:block;width:100%;margin:0;accent-color:var(--accent)}
.lp-time{display:flex;justify-content:space-between;margin-top:2px;font:400 12.5px/1 var(--font-mono);color:var(--muted)}
.lp-opt{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer}
.lp-opt input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.lp-msg{margin:0;font-size:13px;color:var(--bad)}
.tr{margin-top:22px}
.tr-off{margin-top:18px;padding:22px 16px;text-align:center;font-size:14.5px;color:var(--muted);border:2px dashed var(--line);border-radius:var(--radius)}
.ls{cursor:pointer;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;scroll-margin-top:140px;scroll-margin-bottom:90px}
.ls:hover{background:var(--surface-2)}
.ls.on{background:var(--accent-soft)}

/* read */
.opts{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:22px;font-size:14px;color:var(--muted)}
.opts label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.opts input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.a-title{margin:0 0 12px;font:800 clamp(26px,6.4vw,34px)/1.2 var(--font-ui);text-wrap:balance}
.a-deck{margin:0;font:italic 400 18px/1.55 var(--font-read);color:var(--muted);text-wrap:pretty}
.a-para{margin:0;font:400 18px/1.75 var(--font-read)}
.blk{margin-bottom:24px}
.blk-sub{margin-bottom:32px;padding-bottom:24px;border-bottom:2px dashed var(--line)}
.sent{cursor:pointer;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;scroll-margin-top:120px}
.sent:hover{background:var(--surface-2)}
.sent.on{background:var(--accent-soft)}
.zh{display:none;margin:10px 0 0;font:400 15px/1.75 var(--font-ui);color:var(--muted)}
.show-zh .zh{display:block}
.rom{display:none;margin:6px 0 0;font:400 14px/1.6 var(--font-ui);color:var(--muted);letter-spacing:.01em}
.show-rom .rom{display:block}
html[data-lang="ja"] .w-rom,html[data-lang="yue"] .w-rom{display:block}
/* Korean word cards always show the romanization of the word and its examples (the switch is for the article) */
html[data-lang="ko"] .word .rom,html[data-lang="ko"] #thinkBox .rom{display:block}
.w-rom{font-size:15px;letter-spacing:.02em}
html[data-lang="ko"] .w-rom::before{content:"读音  ";color:var(--muted);font-size:12px;letter-spacing:0}
ruby rt{font-size:.5em;font-weight:400;color:var(--muted);letter-spacing:0}
.g-conn{margin:6px 0;font-size:14.5px;line-height:1.6}
.note{margin-top:12px;padding:16px 18px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);scroll-margin-top:120px}
.note-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.note-nav{display:flex;gap:6px}
.note-zh{margin:0 0 10px;font:500 16px/1.7 var(--font-ui)}
.note-list{margin:0;padding-left:1.15em;font-size:14.5px;line-height:1.7}
.note-list li{margin-bottom:5px}
.note-words{margin-top:14px;padding-top:12px;border-top:2px dashed var(--line)}
.note-wh{margin:0 0 8px;font:600 13px/1.3 var(--font-ui);color:var(--muted)}
.nw{margin:0 0 6px;border:0;border-radius:14px;background:var(--surface-2)}
.nw summary{cursor:pointer;list-style:none;padding:9px 12px;font:400 14.5px/1.5 var(--font-ui)}
.nw summary::-webkit-details-marker{display:none}
.nw summary::after{content:'＋';float:right;margin-left:8px;color:var(--muted)}
.nw[open] summary::after{content:'－'}
.nw summary b{font-weight:600}
.nw-body{padding:0 12px 10px;font-size:14px;line-height:1.7}
.nw-body p{margin:0 0 6px}
.nw-ex{color:var(--muted)}
.word{scroll-margin-top:120px}
.word.flash{outline:2px solid var(--accent);outline-offset:2px}

/* words */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1 1 200px;min-width:0;padding:10px 16px;border:2px solid var(--line);border-radius:999px;background:var(--surface);font-size:16px}
.search:focus{border-color:var(--accent);outline:0}
.word{display:grid;gap:9px;margin-bottom:12px;padding:16px 18px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow)}
.word-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.w-expr{margin:0;min-width:0;font:800 18px/1.35 var(--font-ui);overflow-wrap:anywhere}
.w-zh{margin:0;font-size:15px}
.w-head{display:flex;align-items:center;gap:8px;min-width:0}
.w-ctxrow{display:flex;align-items:flex-start;gap:10px}
.w-ctxrow .w-ctx{flex:1;min-width:0}
.ex-row{display:flex;align-items:flex-start;gap:10px}
.ex-body{min-width:0}
.w-tag{display:inline-block;margin-left:8px;padding:1px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font:700 11px/1.6 var(--font-ui);vertical-align:3px;white-space:nowrap}
.w-note{margin:0;font-size:13.5px;line-height:1.6;color:var(--muted)}
.w-exh{margin:2px 0 -3px;font-size:12px;color:var(--muted)}
.w-ex{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.w-ex li{padding-left:12px;border-left:3px solid var(--accent-soft);border-radius:2px}
.ex-en{display:block;font:400 15px/1.6 var(--font-read)}
.ex-en b{font-weight:600;background:var(--mark);border-radius:5px;padding:0 2px}
.ex-zh{display:block;margin-top:1px;font-size:13.5px;line-height:1.55;color:var(--muted)}
.w-mine>span{display:block;margin-bottom:4px;font-size:12px;color:var(--muted)}
.w-meta{margin:0;min-height:16px;font:400 12px/1.4 var(--font-mono);color:var(--muted)}
.empty{padding:28px 0;text-align:center;color:var(--muted)}

/* my words (added by the learner) */
mark.vw.uw{background:var(--tint-3, #FDE6EF);box-shadow:inset 0 -2px 0 #E8618F}
.uw-tag{background:#FDE6EF;color:#C2416F}
.uw-add{position:absolute;z-index:60;padding:9px 16px;border:0;border-radius:999px;background:var(--accent);color:#fff;font:700 14px/1.2 var(--font-ui);box-shadow:0 8px 20px -8px rgba(0,0,0,.45);cursor:pointer}
.uw-add[hidden],.uw-toast[hidden]{display:none}
.uw-bg{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;padding:16px;background:rgba(59,47,42,.35)}
@media (min-width:600px){.uw-bg{align-items:center}}
.uw-sheet{width:100%;max-width:480px;max-height:90vh;overflow:auto;padding:20px 20px 18px;background:var(--surface);border-radius:24px;box-shadow:var(--shadow)}
.uw-term{margin:4px 0 8px;font:800 24px/1.3 var(--font-read)}
.uw-ctx{margin:0 0 12px;padding:10px 12px;border-radius:14px;background:var(--surface-2);font:400 15px/1.6 var(--font-read);color:var(--muted)}
.uw-ctx b{color:var(--fg);background:#FDE6EF;border-radius:4px;padding:0 2px}
.uw-old{margin:0 0 10px;font-size:13.5px;color:#B5562F}
.uw-f{display:block;margin-bottom:10px}
.uw-f>span{display:block;margin-bottom:4px;font-size:12.5px;font-weight:700;color:var(--muted)}
.uw-f textarea{width:100%;padding:10px 14px;border:2px solid var(--line);border-radius:16px;background:var(--surface);font:inherit;font-size:16px;resize:vertical}
.uw-f input{width:100%;box-sizing:border-box;font-size:16px}
.uw-err{margin:0 0 8px;min-height:1px;font-size:13.5px;color:#C2416F}
.uw-toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:80;transform:translateX(-50%);max-width:calc(100vw - 32px);padding:11px 18px;border-radius:999px;background:#3B2F2A;color:#fff;font-size:14px;box-shadow:var(--shadow)}

/* flashcards */
.fc-opt{display:flex;align-items:center;gap:8px;margin:4px 0 14px;font-size:14px;color:var(--muted);cursor:pointer}
.fc-opt input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.fc-card{position:relative;min-height:300px;margin:14px 0 10px;perspective:1200px;cursor:pointer;outline:none}
.fc-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:26px 22px;
  background:var(--surface);border-radius:24px;box-shadow:var(--shadow);text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  transition:transform .45s ease;overflow:auto}
.fc-front{transform:rotateY(0deg);background:linear-gradient(160deg,var(--surface) 60%,var(--accent-soft))}
.fc-back{transform:rotateY(180deg);justify-content:flex-start}
.fc-card.flip .fc-front{transform:rotateY(-180deg)}
.fc-card.flip .fc-back{transform:rotateY(0deg)}
.fc-card:focus-visible .fc-face{outline:3px solid var(--accent);outline-offset:2px}
.fc-word{margin:0;font:800 clamp(28px,8vw,40px)/1.25 var(--font-read);word-break:break-word}
.fc-rom{margin:0;font:500 17px/1.5 var(--font-ui);color:var(--accent);letter-spacing:.02em}
.fc-rom.sm{font-size:13.5px;color:var(--muted)}
.fc-tag{margin:6px 0 0;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font:700 12px/1.6 var(--font-ui)}
.fc-zh{margin:0;font:700 clamp(20px,5.5vw,26px)/1.45 var(--font-ui)}
.fc-zh.sm{font-size:17px;color:var(--muted);font-weight:600}
.fc-mini{margin:0 0 4px;font:700 15px/1.4 var(--font-read);color:var(--muted)}
.fc-mini span{font:500 13px/1.4 var(--font-ui);color:var(--accent)}
.fc-hint{position:absolute;bottom:14px;left:0;right:0;margin:0;font-size:12.5px;color:var(--muted)}
.fc-note{margin:10px 0 0;font-size:14px;line-height:1.65;color:var(--fg);text-align:left}
.fc-ex{width:100%;margin-top:10px;padding:10px 14px;border-radius:16px;background:var(--surface-2);text-align:left}
.fc-ex p{margin:2px 0}
.fc-tools{display:flex;align-items:center;gap:10px;justify-content:center}
.fc-grade{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.fc-grade[hidden]{display:none}
.fc-grade .btn{padding:14px 10px;font-size:16px}
.fc-list{margin:4px 0 14px;padding-left:20px;line-height:1.9}
@media (prefers-reduced-motion:reduce){.fc-face{transition:none}}

/* think */
.bd{margin:0 0 12px;font:400 19px/1.75 var(--font-read)}
.qa{margin-bottom:16px}
.qa-q{margin:0 0 6px;font-size:15.5px}
</style>
</head>
<body>

<div class="bar">
  <div class="in">
    <div class="mast">
      <div class="brand"><a class="back" href="__HOME__">‹ 合集</a><span class="b-title">__BRAND__</span></div>
      <div class="prog">
        <div class="t">已掌握 <b id="mCount">0 / 0</b></div>
        <div class="meter" id="meter"><i></i></div>
        <div class="t s" id="saveNote" aria-live="polite"></div>
      </div>
      <span id="whoMount"></span>
    </div>
    <nav class="tabs" role="tablist" aria-label="页面">
      <button type="button" class="tab" role="tab" data-tab="read">精读</button>
      <button type="button" class="tab" role="tab" data-tab="listen" hidden>听力</button>
      <button type="button" class="tab" role="tab" data-tab="words">词汇</button>
      <button type="button" class="tab" role="tab" data-tab="cards">背单词</button>
      <button type="button" class="tab" role="tab" data-tab="quiz">自测</button>
      <button type="button" class="tab" role="tab" data-tab="think">长句</button>
    </nav>
  </div>
</div>

<main class="in">
  <section class="view" id="view-read" role="tabpanel">
    <div class="opts">
      <label><input type="checkbox" id="optZh"> 显示译文</label>
      <label><input type="checkbox" id="optHi" checked> 标出生词</label>
      <span>点任意一句，看翻译和讲解；用鼠标或手指选中一个词，可以把它加入生词</span>
    </div>
    <article id="article"></article>
  </section>

  <section class="view" id="view-listen" role="tabpanel" hidden>
    <div id="listenBox"></div>
  </section>

  <section class="view" id="view-words" role="tabpanel" hidden>
    <div class="tools">
      <input class="search" id="wordSearch" type="search" placeholder="搜索表达、中文或例句" autocomplete="off" aria-label="搜索词汇">
    </div>
    <div class="chips mb14" id="chips"></div>
    <div id="wordList"></div>
  </section>

  <section class="view" id="view-cards" role="tabpanel" hidden>
    <div id="cardBox"></div>
  </section>

  <section class="view" id="view-quiz" role="tabpanel" hidden>
    <div id="quizBox"></div>
  </section>

  <section class="view" id="view-think" role="tabpanel" hidden>
    <div id="thinkBox"></div>
  </section>

  <p class="foot">__FOOT__</p>
</main>

<script>
(function(){
'use strict';
/*__COMMON_JS__*/
/*__SRS_JS__*/
/*__WHO_JS__*/
if (!Who.boot()) return;     /* nobody chosen yet: the picker is showing, the page waits for the reload after the choice */
/*__CLIPS_JS__*/
/*__KIT_JS__*/
Who.chip($('#whoMount'), 'tiny');

const DATA = __DATA__;
const SLUG = '__SLUG__';
const REVIEW_URL = '__REVIEW__';
const S = DATA.sents;
if (DATA.ruby) setRuby(DATA.ruby);
const VMAP = {};
DATA.vocab.forEach(function(v){ VMAP[v.id] = v; });
DATA.cloze.forEach(function(c){ VMAP[c.id].cloze = {before:c.before, ans:c.ans, after:c.after, hint:c.hint, szh:c.szh}; });
const OWN_N = DATA.vocab.length;            /* the article's own words; the learner's words (mine) come after them */
/* words the learner marked in this article themself (select text -> 加入生词); see "my words" in srs.js */
function loadMine(){
  DATA.vocab.splice(OWN_N).forEach(function(v){ delete VMAP[v.id]; });
  mineOf(SLUG).forEach(function(p){ const v = mineWord(p[0], p[1]); v.key = p[0]; DATA.vocab.push(v); VMAP[v.id] = v; });
}
loadMine();
let TERM_MAP = {}, TERMS = [], TERM_RE = null;
function buildTerms(){
  TERM_MAP = {}; TERMS = [];
  /* the article's own words win a clash (a learner's word that is the same text as one of them adds nothing to highlight) */
  DATA.vocab.slice().reverse().forEach(function(v){ v.m.forEach(function(t){ TERM_MAP[t.toLowerCase()] = v.id; if (TERMS.indexOf(t) < 0) TERMS.push(t); }); });
  TERMS.sort(function(a,b){ return b.length - a.length; });
  TERM_RE = termRe(TERMS, 'gi');
}
buildTerms();
const SLABEL = {new:'未学', learning:'学习中', mastered:'已掌握'};
const TABS = ['read','listen','words','cards','quiz','think'];
const LS_STATE = '__LS_STATE__';
const LS_UI = 'fk-ui-v1';
const REDUCE = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- progress state (saved to the viewer's own private store when available) ---------- */
function normalize(d){
  const out = stateClean(d);                 /* shared with the progress import (tools/shared/who.js) */
  Object.keys(out.vocab).forEach(function(k){ if (!VMAP[k]) delete out.vocab[k]; });
  return out;
}
let state = normalize(lsGet(LS_STATE));
let ui = Object.assign({zh:false, hi:true, rom:false, romYue:true, fcAuto:true}, lsGet(LS_UI) || {});
/* the reading switch is kept per section: Cantonese shows its Jyutping by default (romYue), Korean and Japanese hide theirs (rom) */
const ROMK = LANG === 'yue' ? 'romYue' : 'rom';
let ref = null, saveTimer = null, saving = false, again = false, lastJSON = '', touched = false;

function getS(id){ const e = state.vocab[id]; return (e && e.s) || 'new'; }
function pruneEntry(id){ const e = state.vocab[id]; if (e && !e.s && !e.m) delete state.vocab[id]; }
function setS(id, s){
  const e = state.vocab[id] || (state.vocab[id] = {});
  if (s === 'new') delete e.s; else e.s = s;
  e.d = today();
  pruneEntry(id);
  touch();
}
function setMine(id, val){
  const e = state.vocab[id] || (state.vocab[id] = {});
  const t = val.trim();
  if (t){ e.m = t; e.d = today(); } else delete e.m;
  pruneEntry(id);
  touch();
}
function touch(){
  touched = true;
  lsSet(LS_STATE, state);
  renderMast();
  scheduleSave();
}
function setSaveNote(mode){
  const m = {saved:'进度已保存', saving:'正在保存…', local:'进度只存在本机', none:''};
  $('#saveNote').textContent = m[mode] || '';
}
function scheduleSave(){
  if (!ref) return;
  clearTimeout(saveTimer);
  setSaveNote('saving');
  saveTimer = setTimeout(flush, 700);
}
async function flush(){
  if (!ref) return;
  if (saving){ again = true; return; }
  const json = JSON.stringify(state);
  if (json === lastJSON){ setSaveNote('saved'); return; }
  saving = true;
  try { await ref.set(JSON.parse(json)); lastJSON = json; setSaveNote('saved'); }
  catch(e){ setSaveNote('local'); }
  saving = false;
  if (again){ again = false; scheduleSave(); }
}
function withTimeout(p, ms){
  return Promise.race([p, new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('timeout')); }, ms); })]);
}
function hasContent(s){ return Object.keys(s.vocab).length > 0 || Object.keys(s.ans).length > 0 || !!s.quiz; }
async function initCloud(){
  let db = null, user = null;
  try {
    if (!window.claude || !window.claude.use){ setSaveNote('local'); return; }
    const r = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    db = r[0]; user = r[1];
  } catch(e){}
  if (!db || !user){ setSaveNote('local'); return; }
  let uid = null;
  try { uid = await user.id(); } catch(e){}
  if (!uid){ setSaveNote('local'); return; }
  let r;
  try { r = db.doc('data/users/' + uid + '/progress'); } catch(e){ setSaveNote('local'); return; }
  try {
    const snap = await withTimeout(r.get(), 10000);
    if (snap.exists){
      const remote = normalize(snap.data());
      if (touched){
        state = {v:1, vocab:Object.assign({}, remote.vocab, state.vocab), ans:Object.assign({}, remote.ans, state.ans), quiz:state.quiz || remote.quiz};
        lastJSON = '';
      } else {
        state = remote;
        lastJSON = JSON.stringify(state);
      }
      lsSet(LS_STATE, state);
      ref = r;
      renderAll();
      if (lastJSON === '') flush(); else setSaveNote('saved');
    } else {
      ref = r;
      lastJSON = '';
      if (hasContent(state)){ setSaveNote('saving'); flush(); } else setSaveNote('saved');
    }
  } catch(e){ setSaveNote('local'); }
}

/* ---------- vocabulary highlighting ---------- */
function marked(text, opt){
  opt = opt || {};
  if (!(opt.force || ui.hi)) return rubyNodes(text);
  const out = [];
  let last = 0, m;
  TERM_RE.lastIndex = 0;
  while ((m = TERM_RE.exec(text))){
    const id = TERM_MAP[m[0].toLowerCase()];
    if (opt.only && opt.only !== id) continue;
    if (m.index > last) out.push.apply(out, rubyNodes(text.slice(last, m.index)));
    out.push(h('mark', {class:'vw' + (VMAP[id].mine ? ' uw' : ''), 'data-v':id, title:VMAP[id].zh}, rubyNodes(m[0])));
    last = m.index + m[0].length;
  }
  if (last < text.length) out.push.apply(out, rubyNodes(text.slice(last)));
  return out;
}

/* ---------- masthead ---------- */
function renderMast(){
  const total = DATA.vocab.length;
  let n = 0;
  DATA.vocab.forEach(function(v){ if (getS(v.id) === 'mastered') n++; });
  $('#mCount').textContent = n + ' / ' + total;
  $('#meter').style.setProperty('--p', (total ? n / total * 100 : 0) + '%');
}

/* ---------- tabs ---------- */
let cur = null;
function showTab(t){
  if (TABS.indexOf(t) < 0 || (t === 'listen' && !DATA.audio)) t = 'read';
  const changed = cur !== null && cur !== t;
  cur = t;
  $$('.view').forEach(function(v){ v.hidden = v.id !== 'view-' + t; });
  $$('.tab').forEach(function(b){
    const on = b.dataset.tab === t;
    b.classList.toggle('on', on);
    b.setAttribute('aria-selected', String(on));
  });

function fcIds(){ const o = {}; fc.deck.forEach(function(id){ o[id] = 1; }); return o; }

function fcGrade(ok){

  else { fc.missed[id] = 1; fc.deck.push(id); }

document.addEventListener('keydown', function(e){
  if (cur !== 'cards' || fc.phase !== 'run' || e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (e.key === ' ' || e.key === 'Enter'){
    if (!fc.flipped){ e.preventDefault(); const c = $('.fc-card'); if (c) c.click(); }

function selText(){ try { const s = window.getSelection(); return s && !s.isCollapsed ? s.toString().trim() : ''; } catch(e){ return ''; } }
/* the current selection as {i: sentence index, t: text, o: offset in the sentence} or null (it must lie inside one sentence) */
function selInfo(){
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
  const r = sel.getRangeAt(0);
  function sentOf(n){ const el = n && (n.nodeType === 1 ? n : n.parentNode); return el && el.closest ? el.closest('#article .sent') : null; }
  const a = sentOf(r.startContainer), b = sentOf(r.endContainer);
  if (!a || a !== b) return null;
  const pre = document.createRange();
  pre.selectNodeContents(a); pre.setEnd(r.startContainer, r.startOffset);
  const i = Number(a.dataset.i), en = S[i].en;
  /* readings above kanji (<rt>) are not part of the sentence */
  let o = plainText(pre.cloneContents()).length, t = plainText(r.cloneContents());
  /* drop spaces and punctuation at both ends: "elves," -> "elves" */
  const lead = t.match(new RegExp('^[^' + LETTERS + '0-9]*', 'i'))[0].length;
  o += lead; t = t.slice(lead);
  t = t.replace(new RegExp('[^' + LETTERS + '0-9]+$', 'i'), '');
  if (!t || t.length > 80 || en.substr(o, t.length) !== t) return null;
  return {i:i, t:t, o:o};
}

function playArticleSentence(i, btn){

/* ---------- listen tab ---------- */
const L = {audio:null, cur:-1, loop:false, loopIdx:-1, drag:false, el:{}, spans:[], raf:0, seg:null};
const RATES = [0.75, 0.9, 1, 1.15, 1.3];
function fmtT(t){ t = Math.max(0, Math.floor(t)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
function sentAt(t){
  const T = DATA.audio.t;
  let k = 0;
  for (let i = 0; i < T.length; i++){ if (T[i][0] <= t + 0.05) k = i; else break; }
  return k;
}
function getAudio(){
  if (L.audio) return L.audio;
  const a = new Audio();
  a.preload = 'auto';
  a.src = DATA.audio.src;
  a.playbackRate = ui.rate || 1;
  try { a.preservesPitch = true; a.webkitPreservesPitch = true; } catch(e){}
  a.addEventListener('timeupdate', listenUpdate);
  a.addEventListener('play', function(){ listenPlayState(); loopFrames(); });
  a.addEventListener('pause', function(){ listenPlayState(); if (L.seg && a.currentTime < L.seg.end) endSeg(); });
  a.addEventListener('ended', function(){ listenPlayState(); listenUpdate(); });
  a.addEventListener('error', function(){ L.el.msg.textContent = '音频没有加载出来，请检查网络后再点播放。'; L.el.msg.hidden = false; });
  a.addEventListener('playing', function(){ L.el.msg.hidden = true; });
  L.audio = a;
  try {
    if ('mediaSession' in navigator){
      navigator.mediaSession.metadata = new MediaMetadata({title:DATA.title, artist:{en:'外刊精读', ko:'韩语入门', ja:'日语中级'}[LANG]});
      navigator.mediaSession.setActionHandler('play', function(){ a.play(); });
      navigator.mediaSession.setActionHandler('pause', function(){ a.pause(); });
      navigator.mediaSession.setActionHandler('seekbackward', function(){ a.currentTime = Math.max(0, a.currentTime - 5); });
      navigator.mediaSession.setActionHandler('seekforward', function(){ a.currentTime = Math.min(DATA.audio.dur, a.currentTime + 5); });
    }
  } catch(e){}
  return a;
}
function listenPlayState(){
  const playing = !!(L.audio && !L.audio.paused && !L.audio.ended);
  L.el.play.textContent = playing ? '暂停' : '播放';
  L.el.play.setAttribute('aria-pressed', String(playing));
}
function loopFrames(){
  cancelAnimationFrame(L.raf);
  const tick = function(){
    if (!L.audio || L.audio.paused) return;
    listenUpdate();
    L.raf = requestAnimationFrame(tick);
  };
  L.raf = requestAnimationFrame(tick);
}
function listenUpdate(){
  const a = L.audio;
  if (!a) return;
  const T = DATA.audio.t;
  let t = a.currentTime;
  if (L.seg && !a.paused && t >= L.seg.end){ a.pause(); endSeg(); }
  if (L.loop && L.loopIdx >= 0 && !L.seg && !a.paused && t >= T[L.loopIdx][1] + 0.2){ a.currentTime = T[L.loopIdx][0]; t = a.currentTime; }
  if (!L.drag) L.el.range.value = String(t);
  L.el.now.textContent = fmtT(t);
  const k = sentAt(t);
  if (k !== L.cur){
    L.cur = k;
    markListenSentence(!a.paused);
  }
}
function markListenSentence(follow){
  L.spans.forEach(function(sp){ sp.classList.toggle('on', Number(sp.dataset.i) === L.cur); });
  if (follow && ui.tx){
    const sp = L.spans[L.cur];
    if (sp) sp.scrollIntoView({block:'nearest', behavior:REDUCE ? 'auto' : 'smooth'});
  }
}
function playSentence(i){
  endSeg();

  const a = getAudio();
  a.currentTime = DATA.audio.t[i][0];
  if (L.loop) L.loopIdx = i;
  a.play().catch(function(){});
  listenUpdate();
}
function seekBy(d){

  a.currentTime = Math.min(DATA.audio.dur, Math.max(0, a.currentTime + d));

}
function setRate(r){

    if (a.paused || a.ended){ if (a.ended) a.currentTime = 0; a.play().catch(function(){}); } else a.pause();
  }}, '播放');
  L.el.range = h('input', {type:'range', class:'lp-range', min:0, max:A.dur, step:0.1, value:0, 'aria-label':'播放进度'});
  L.el.range.addEventListener('pointerdown', function(){ L.drag = true; });
  L.el.range.addEventListener('input', function(){
    const a = getAudio();
    a.currentTime = Number(L.el.range.value);
    L.el.now.textContent = fmtT(a.currentTime);
    const k = sentAt(a.currentTime);
    if (k !== L.cur){ L.cur = k; markListenSentence(false); }
  });
  const endDrag = function(){ L.drag = false; };
  L.el.range.addEventListener('change', endDrag);
  L.el.range.addEventListener('pointerup', endDrag);
  L.el.range.addEventListener('pointercancel', endDrag);
  L.el.now = h('span', null, '0:00');
  L.el.msg = h('p', {class:'lp-msg', hidden:true, role:'alert'});
  const rates = h('div', {class:'chips', role:'group', 'aria-label':'播放速度'});
  RATES.forEach(function(r){
    rates.append(h('button', {type:'button', class:'chip rate-b', 'data-r':r, 'aria-pressed':'false', onclick:function(){ setRate(r); }}, r + '×'));
  });
  const loopCb = h('input', {type:'checkbox'});
  loopCb.addEventListener('change', function(){
    L.loop = loopCb.checked;
    L.loopIdx = L.loop ? (L.cur >= 0 ? L.cur : 0) : -1;
  });
  const txCb = h('input', {type:'checkbox'});
  txCb.checked = !!ui.tx;
  txCb.addEventListener('change', function(){ ui.tx = txCb.checked; lsSet(LS_UI, ui); applyTextVisibility(); });
  L.el.tr = h('div', {class:'tr'});
  L.el.off = h('p', {class:'tr-off'}, '原文已隐藏。先盲听一遍，听完再勾选“显示原文”对照。');
  box.append(
    h('div', {class:'card lp'},
      h('h2', {class:'h2'}, '听力'),
      h('p', {class:'lead'}, '整篇文章的朗读（AI 合成的' + (LANG !== 'en' ? XL : (DATA.audio.voice || '').charAt(0) === 'b' ? '英式' : '美式') + '发音，语速略慢）。先盲听，再对照原文；点原文里的任意一句，就从那一句开始播放。'),
      h('div', {class:'lp-row'},
        h('button', {type:'button', class:'btn', onclick:function(){ seekBy(-5); }}, '后退 5 秒'),
        L.el.play,
        h('button', {type:'button', class:'btn', onclick:function(){ seekBy(5); }}, '前进 5 秒')
      ),
      h('div', null, L.el.range, h('div', {class:'lp-time'}, L.el.now, h('span', null, fmtT(A.dur)))),
      h('div', null, h('p', {class:'meta'}, '播放速度'), h('div', {class:'row'}, rates)),
      h('div', {class:'lp-row'},
        h('label', {class:'lp-opt'}, loopCb, '单句循环（当前这一句反复听）'),
        h('label', {class:'lp-opt'}, txCb, '显示原文')
      ),
      L.el.msg
    ),
    L.el.off,
    L.el.tr
  );
  setRate(ui.rate || 1);
  renderListenText();
  applyTextVisibility();
}
function renderAll(){
  renderMast();
  renderArticle();
  renderListen();
  renderWords();
  renderThink();
  if (quiz.phase === 'start') renderQuiz();
}
function init(){
  Clip.onBeforePlay(stopNarrationForClip);
  window.addEventListener('pagehide', settle);
  document.addEventListener('visibilitychange', function(){ if (document.hidden) settle(); });
  if (LANG !== 'en'){
    const rl = h('label', null, h('input', {type:'checkbox', id:'optRom'}), LANG === 'ja' ? ' 显示读音' : LANG === 'yue' ? ' 显示粤拼' : ' 显示罗马音');
    $('#optZh').parentNode.after(rl);
    $('#optRom').checked = !!ui[ROMK];
    document.body.classList.toggle('show-rom', !!ui[ROMK]);
    $('#optRom').addEventListener('change', function(){ ui[ROMK] = this.checked; lsSet(LS_UI, ui); document.body.classList.toggle('show-rom', ui[ROMK]); });
    const tt = $('.tab[data-tab="think"]');
    if (tt) tt.textContent = LANG === 'ja' ? '语法' : '句型';
  }
  $('#optZh').checked = !!ui.zh;
  $('#optHi').checked = !!ui.hi;
  $('#optZh').addEventListener('change', function(){ ui.zh = this.checked; lsSet(LS_UI, ui); $('#article').classList.toggle('show-zh', ui.zh); });
  $('#optHi').addEventListener('change', function(){ ui.hi = this.checked; lsSet(LS_UI, ui); renderArticle(); renderListenText(); });
  const chips = $('#chips');
  ['all','new','learning','mastered'].forEach(function(f){
    chips.append(h('button', {type:'button', class:'chip', 'data-f':f, onclick:function(){ vFilter = f; renderWords(); }}, f));
  });
  document.addEventListener('selectionchange', function(){ clearTimeout(selTimer); selTimer = setTimeout(placeAddBtn, 180); });
  window.addEventListener('resize', hideAddBtn);
  $('#wordSearch').addEventListener('input', function(){ vQuery = this.value; renderWords(); });
  $$('.tab').forEach(function(b){
    b.addEventListener('click', function(){ try { location.hash = b.dataset.tab; } catch(e){} showTab(b.dataset.tab); });
  });
  window.addEventListener('hashchange', function(){ showTab(location.hash.replace('#','')); });
  if (DATA.audio) $('.tab[data-tab="listen"]').hidden = false;
  renderAll();
  showTab(location.hash.replace('#','') || 'read');
  initCloud();
}
init();
})();
</script>
</body>
</html>
