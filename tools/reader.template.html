<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__TITLE__</title>
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: one 720px reading column under a sticky masthead; four tabs (read, words, quiz, think) share it. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#E8EDF3; --fg:#16202B; --muted:#58656F; --line:#D3DBE4;
  --accent:#2B5C8E; --accent-soft:#DDE9F5; --on-accent:#FFFFFF;
  --koban:#C0392B; --lamp-halo:rgba(192,57,43,.18); --mark:#FBE8A6;
  --good:#27693F; --good-soft:#DDF0E3; --warn:#8A5700; --warn-soft:#FBEBC8; --bad:#B3261E; --bad-soft:#FAE0DD;
  --font-read:'Literata','Iowan Old Style',Georgia,'Songti SC','Noto Serif CJK SC',serif;
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --radius:10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font:16px/1.6 var(--font-ui);background:var(--bg);color:var(--fg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.in{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* masthead */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;font:600 18px/1.2 var(--font-read);letter-spacing:-.01em}
.b-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{flex:none;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font:500 12.5px/1.2 var(--font-ui);color:var(--muted);text-decoration:none;letter-spacing:0}
.back:hover{color:var(--fg);background:var(--surface-2)}
.lamp{flex:none;width:10px;height:10px;border-radius:50%;background:var(--koban);box-shadow:0 0 0 4px var(--lamp-halo)}
.prog{flex:none;text-align:right}
.prog .t{font-size:12px;line-height:1.3;color:var(--muted)}
.prog b{font:400 13px/1.3 var(--font-mono);color:var(--fg)}
.meter{width:112px;height:3px;margin:4px 0 3px auto;border-radius:2px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;width:var(--p,0%);background:var(--good)}
.prog .s{font-size:11px;min-height:14px}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:9px 4px 10px;font:500 14px/1 var(--font-ui);color:var(--muted);cursor:pointer}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}

/* listen */
.lp{display:grid;gap:14px}
.lp-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn.big{min-width:96px;padding:12px 22px;font-size:16px}
.lp-range{display:block;width:100%;margin:0;accent-color:var(--accent)}
.lp-time{display:flex;justify-content:space-between;margin-top:2px;font:400 12.5px/1 var(--font-mono);color:var(--muted)}
.lp-opt{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer}
.lp-opt input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.lp-msg{margin:0;font-size:13px;color:var(--bad)}
.tr{margin-top:22px}
.tr-off{margin-top:18px;padding:22px 16px;text-align:center;font-size:14.5px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius)}
.ls{cursor:pointer;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;scroll-margin-top:140px;scroll-margin-bottom:90px}
.ls:hover{background:var(--surface-2)}
.ls.on{background:var(--accent-soft)}

main{padding-block:22px 56px}
.view[hidden]{display:none}

/* shared */
.eyebrow{font:500 12px/1.2 var(--font-ui);letter-spacing:.08em;color:var(--accent)}
.h2{margin:0 0 6px;font:600 22px/1.3 var(--font-read);text-wrap:balance}
.h3{margin:20px 0 8px;font:600 16px/1.4 var(--font-ui)}
.lead{margin:0 0 14px;color:var(--muted);font-size:15px}
.meta{margin:0;font-size:12.5px;line-height:1.5;color:var(--muted)}
.mono{font-family:var(--font-mono);font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.btn{appearance:none;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:500 14px/1.2 var(--font-ui);cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font:500 13px/1.2 var(--font-ui);color:var(--muted);cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg-b{appearance:none;padding:6px 10px;border:0;border-right:1px solid var(--line);background:none;font:500 12.5px/1.2 var(--font-ui);color:var(--muted);cursor:pointer}
.seg-b:last-child{border-right:0}
.seg-b.on.s-new{background:var(--surface-2);color:var(--fg)}
.seg-b.on.s-learning{background:var(--warn-soft);color:var(--warn)}
.seg-b.on.s-mastered{background:var(--good-soft);color:var(--good)}
textarea{display:block;width:100%;min-height:58px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px;line-height:1.55;resize:vertical}
mark.vw{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}

/* read */
.opts{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:22px;font-size:14px;color:var(--muted)}
.opts label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.opts input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.a-title{margin:0 0 12px;font:600 clamp(26px,6.4vw,34px)/1.15 var(--font-read);letter-spacing:-.015em;text-wrap:balance}
.a-deck{margin:0;font:italic 400 18px/1.55 var(--font-read);color:var(--muted);text-wrap:pretty}
.a-para{margin:0;font:400 18px/1.75 var(--font-read)}
.blk{margin-bottom:24px}
.blk-sub{margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.sent{cursor:pointer;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;scroll-margin-top:120px}
.sent:hover{background:var(--surface-2)}
.sent.on{background:var(--accent-soft)}
.zh{display:none;margin:10px 0 0;font:400 15px/1.75 var(--font-ui);color:var(--muted)}
.show-zh .zh{display:block}
.note{margin-top:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);scroll-margin-top:120px}
.note-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.note-nav{display:flex;gap:6px}
.note-zh{margin:0 0 10px;font:500 16px/1.7 var(--font-ui)}
.note-list{margin:0;padding-left:1.15em;font-size:14.5px;line-height:1.7}
.note-list li{margin-bottom:5px}

/* words */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1 1 200px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px}
.word{display:grid;gap:9px;margin-bottom:10px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.word-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.w-expr{margin:0;min-width:0;font:600 18px/1.35 var(--font-read);overflow-wrap:anywhere}
.w-zh{margin:0;font-size:15px}
.w-ctx{margin:0;font:italic 400 14.5px/1.65 var(--font-read);color:var(--muted)}
.spk{flex:none;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--accent);cursor:pointer}
.spk:hover{background:var(--accent-soft)}
.spk.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.spk svg{display:block}
.w-head{display:flex;align-items:center;gap:8px;min-width:0}
.w-ctxrow{display:flex;align-items:flex-start;gap:10px}
.w-ctxrow .w-ctx{flex:1;min-width:0}
.ex-row{display:flex;align-items:flex-start;gap:10px}
.ex-body{min-width:0}
.w-tag{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font:500 11px/1.6 var(--font-ui);vertical-align:3px;white-space:nowrap}
.w-note{margin:0;font-size:13.5px;line-height:1.6;color:var(--muted)}
.w-exh{margin:2px 0 -3px;font-size:12px;color:var(--muted)}
.w-ex{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.w-ex li{padding-left:12px;border-left:2px solid var(--line)}
.ex-en{display:block;font:400 15px/1.6 var(--font-read)}
.ex-en b{font-weight:600;background:var(--mark);border-radius:2px;padding:0 1px}
.ex-zh{display:block;margin-top:1px;font-size:13.5px;line-height:1.55;color:var(--muted)}
.w-mine>span{display:block;margin-bottom:4px;font-size:12px;color:var(--muted)}
.w-meta{margin:0;min-height:16px;font:400 12px/1.4 var(--font-mono);color:var(--muted)}
.empty{padding:28px 0;text-align:center;color:var(--muted)}

/* quiz */
.q-head{display:flex;align-items:center;justify-content:space-between;gap:14px}
.pbar{flex:1;max-width:240px;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.pbar i{display:block;height:100%;width:var(--p,0%);background:var(--accent)}
.q-sent{margin:16px 0 8px;font:400 20px/2.1 var(--font-read);overflow-wrap:anywhere}
.q-input{display:inline-block;max-width:100%;padding:2px 8px;border:0;border-bottom:2px solid var(--accent);border-radius:4px 4px 0 0;background:var(--accent-soft);font:500 18px/1.4 var(--font-mono);text-align:center}
.q-input.ok{border-bottom-color:var(--good);background:var(--good-soft)}
.q-input.bad{border-bottom-color:var(--bad);background:var(--bad-soft)}
.q-hint{margin:0;font-size:14px;color:var(--muted)}
.q-zh{margin:18px 0 6px;font:500 21px/1.6 var(--font-ui);overflow-wrap:anywhere}
.q-line{margin:10px 0 8px}
.q-input.q-wide{display:block;width:100%;box-sizing:border-box;padding:8px 10px;font-size:18px;text-align:left}
.q-area{margin:8px 0 4px;font:400 17px/1.6 var(--font-read)}
.q-tgt{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0 0 6px}
.q-tgt b{padding:1px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font:600 15px/1.5 var(--font-read)}
.miss-s b,.fb b.hl{font-weight:600;background:var(--mark);border-radius:2px;padding:0 1px}
.fb{margin-top:16px;padding:12px 14px;border-radius:8px;background:var(--surface-2)}
.fb.ok{background:var(--good-soft)}
.fb.bad{background:var(--bad-soft)}
.fb p{margin:0 0 6px;font-size:14.5px}
.fb .fb-t{font-weight:600}
.fb.ok .fb-t{color:var(--good)}
.fb.bad .fb-t{color:var(--bad)}
.fb-s{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.score{margin:0 0 12px;font:400 18px/1.2 var(--font-mono);color:var(--muted)}
.score .big{font-size:44px;color:var(--fg)}
.miss{padding:10px 0;border-top:1px solid var(--line)}
.miss-s{margin:0 0 4px;font:400 17px/1.7 var(--font-read)}

/* think */
.bd{margin:0 0 12px;font:400 19px/1.75 var(--font-read)}
.qa{margin-bottom:16px}
.qa-q{margin:0 0 6px;font-size:15.5px}

.mt4{margin-top:4px}
.mt10{margin-top:10px}
.mt12{margin-top:12px}
.mb12{margin-bottom:12px}
.mb14{margin-bottom:14px}
.mb16{margin-bottom:16px}
.foot{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.7;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div class="bar">
  <div class="in">
    <div class="mast">
      <div class="brand"><a class="back" href="__HOME__">‹ 合集</a><span class="b-title">__BRAND__</span></div>
      <div class="prog">
        <div class="t">已掌握 <b id="mCount">0 / 0</b></div>
        <div class="meter" id="meter"><i></i></div>
        <div class="t s" id="saveNote" aria-live="polite"></div>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="页面">
      <button type="button" class="tab" role="tab" data-tab="read">精读</button>
      <button type="button" class="tab" role="tab" data-tab="listen" hidden>听力</button>
      <button type="button" class="tab" role="tab" data-tab="words">词汇</button>
      <button type="button" class="tab" role="tab" data-tab="quiz">自测</button>
      <button type="button" class="tab" role="tab" data-tab="think">思考</button>
    </nav>
  </div>
</div>

<main class="in">
  <section class="view" id="view-read" role="tabpanel">
    <div class="opts">
      <label><input type="checkbox" id="optZh"> 显示译文</label>
      <label><input type="checkbox" id="optHi" checked> 标出生词</label>
      <span>点任意一句，看翻译和讲解</span>
    </div>
    <article id="article"></article>
  </section>

  <section class="view" id="view-listen" role="tabpanel" hidden>
    <div id="listenBox"></div>
  </section>

  <section class="view" id="view-words" role="tabpanel" hidden>
    <div class="tools">
      <input class="search" id="wordSearch" type="search" placeholder="搜索表达、中文或例句" autocomplete="off" aria-label="搜索词汇">
    </div>
    <div class="chips mb14" id="chips"></div>
    <div id="wordList"></div>
  </section>

  <section class="view" id="view-quiz" role="tabpanel" hidden>
    <div id="quizBox"></div>
  </section>

  <section class="view" id="view-think" role="tabpanel" hidden>
    <div id="thinkBox"></div>
  </section>

  <p class="foot">__FOOT__</p>
</main>

<script>
(function(){
'use strict';
const DATA = __DATA__;
const S = DATA.sents;
const VMAP = {};
DATA.vocab.forEach(function(v){ VMAP[v.id] = v; });
const TERM_MAP = {};
const TERMS = [];
DATA.vocab.forEach(function(v){ v.m.forEach(function(t){ TERM_MAP[t.toLowerCase()] = v.id; TERMS.push(t); }); });
TERMS.sort(function(a,b){ return b.length - a.length; });
function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
const TERM_RE = new RegExp('\\b(?:' + TERMS.map(esc).join('|') + ')\\b', 'gi');
const SLABEL = {new:'未学', learning:'学习中', mastered:'已掌握'};
const TABS = ['read','listen','words','quiz','think'];
const LS_STATE = '__LS_STATE__';
const LS_UI = 'fk-ui-v1';
const REDUCE = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- small helpers ---------- */
function $(s, r){ return (r || document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function h(tag, attrs){
  const e = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(k){
    const v = attrs[k];
    if (v == null || v === false) return;
    if (k === 'class') e.className = v;
    else if (k.slice(0,2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : String(v));
  });
  Array.prototype.slice.call(arguments, 2).forEach(function(kid){
    [].concat(kid).forEach(function(k){
      if (k == null || k === false) return;
      e.append(k.nodeType ? k : document.createTextNode(String(k)));
    });
  });
  return e;
}
function today(){
  const d = new Date();
  const p = function(n){ return String(n).padStart(2,'0'); };
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}
function lsGet(k){ try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function norm(s){ return String(s).toLowerCase().replace(/[^a-z]/g, ''); }

/* ---------- progress state (saved to the viewer's own private store when available) ---------- */
function normalize(d){
  const out = {v:1, vocab:{}, ans:{}, quiz:null};
  if (!d || typeof d !== 'object') return out;
  if (d.vocab && typeof d.vocab === 'object') Object.keys(d.vocab).forEach(function(k){
    const e = d.vocab[k];
    if (!e || typeof e !== 'object' || !VMAP[k]) return;
    const o = {};
    if (e.s === 'learning' || e.s === 'mastered') o.s = e.s;
    if (typeof e.d === 'string') o.d = e.d.slice(0,10);
    if (typeof e.m === 'string' && e.m) o.m = e.m.slice(0,400);
    if (o.s || o.m) out.vocab[k] = o;
  });
  if (d.ans && typeof d.ans === 'object') Object.keys(d.ans).forEach(function(k){
    if (typeof d.ans[k] === 'string' && d.ans[k]) out.ans[k] = d.ans[k].slice(0,2000);
  });
  if (d.quiz && typeof d.quiz === 'object' && typeof d.quiz.score === 'number' && typeof d.quiz.total === 'number')
    out.quiz = {score:d.quiz.score, total:d.quiz.total, d:String(d.quiz.d || '').slice(0,10), k:['cloze','zh','sent'].indexOf(d.quiz.k) >= 0 ? d.quiz.k : ''};
  return out;
}
let state = normalize(lsGet(LS_STATE));
let ui = Object.assign({zh:false, hi:true}, lsGet(LS_UI) || {});
let ref = null, saveTimer = null, saving = false, again = false, lastJSON = '', touched = false;

function getS(id){ const e = state.vocab[id]; return (e && e.s) || 'new'; }
function pruneEntry(id){ const e = state.vocab[id]; if (e && !e.s && !e.m) delete state.vocab[id]; }
function setS(id, s){
  const e = state.vocab[id] || (state.vocab[id] = {});
  if (s === 'new') delete e.s; else e.s = s;
  e.d = today();
  pruneEntry(id);
  touch();
}
function setMine(id, val){
  const e = state.vocab[id] || (state.vocab[id] = {});
  const t = val.trim();
  if (t){ e.m = t; e.d = today(); } else delete e.m;
  pruneEntry(id);
  touch();
}
function setAns(k, val){
  if (val.trim()) state.ans[k] = val; else delete state.ans[k];
  touch();
}
function touch(){
  touched = true;
  lsSet(LS_STATE, state);
  renderMast();
  scheduleSave();
}
function setSaveNote(mode){
  const m = {saved:'进度已保存', saving:'正在保存…', local:'进度只存在这台设备上', none:''};
  $('#saveNote').textContent = m[mode] || '';
}
function scheduleSave(){
  if (!ref) return;
  clearTimeout(saveTimer);
  setSaveNote('saving');
  saveTimer = setTimeout(flush, 700);
}
async function flush(){
  if (!ref) return;
  if (saving){ again = true; return; }
  const json = JSON.stringify(state);
  if (json === lastJSON){ setSaveNote('saved'); return; }
  saving = true;
  try { await ref.set(JSON.parse(json)); lastJSON = json; setSaveNote('saved'); }
  catch(e){ setSaveNote('local'); }
  saving = false;
  if (again){ again = false; scheduleSave(); }
}
function withTimeout(p, ms){
  return Promise.race([p, new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('timeout')); }, ms); })]);
}
function hasContent(s){ return Object.keys(s.vocab).length > 0 || Object.keys(s.ans).length > 0 || !!s.quiz; }
async function initCloud(){
  let db = null, user = null;
  try {
    if (!window.claude || !window.claude.use){ setSaveNote('local'); return; }
    const r = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    db = r[0]; user = r[1];
  } catch(e){}
  if (!db || !user){ setSaveNote('local'); return; }
  let uid = null;
  try { uid = await user.id(); } catch(e){}
  if (!uid){ setSaveNote('local'); return; }
  let r;
  try { r = db.doc('data/users/' + uid + '/progress'); } catch(e){ setSaveNote('local'); return; }
  try {
    const snap = await withTimeout(r.get(), 10000);
    if (snap.exists){
      const remote = normalize(snap.data());
      if (touched){
        state = {v:1, vocab:Object.assign({}, remote.vocab, state.vocab), ans:Object.assign({}, remote.ans, state.ans), quiz:state.quiz || remote.quiz};
        lastJSON = '';
      } else {
        state = remote;
        lastJSON = JSON.stringify(state);
      }
      lsSet(LS_STATE, state);
      ref = r;
      renderAll();
      if (lastJSON === '') flush(); else setSaveNote('saved');
    } else {
      ref = r;
      lastJSON = '';
      if (hasContent(state)){ setSaveNote('saving'); flush(); } else setSaveNote('saved');
    }
  } catch(e){ setSaveNote('local'); }
}

/* ---------- vocabulary highlighting ---------- */
function marked(text, opt){
  opt = opt || {};
  if (!(opt.force || ui.hi)) return [document.createTextNode(text)];
  const out = [];
  let last = 0, m;
  TERM_RE.lastIndex = 0;
  while ((m = TERM_RE.exec(text))){
    const id = TERM_MAP[m[0].toLowerCase()];
    if (opt.only && opt.only !== id) continue;
    if (m.index > last) out.push(document.createTextNode(text.slice(last, m.index)));
    out.push(h('mark', {class:'vw', 'data-v':id, title:VMAP[id].zh}, m[0]));
    last = m.index + m[0].length;
  }
  if (last < text.length) out.push(document.createTextNode(text.slice(last)));
  return out;
}

  if (quiz.i + 1 >= quiz.items.length){ finishQuiz(); return; }
  quiz.i++;
  quiz.checked = false;
  renderQuiz();
}
function finishQuiz(){
  const score = quiz.results.filter(function(r){ return r.ok; }).length;
  state.quiz = {score:score, total:quiz.results.length, d:today(), k:quiz.mode};
  touch();
  quiz.phase = 'r';
  renderQuiz();
  window.scrollTo(0, 0);
}
function quizResult(){
  const total = quiz.results.length;
  const misses = quiz.results.filter(function(r){ return !r.ok; });
  const score = total - misses.length;
  const card = h('div', {class:'card'},
    h('p', {class:'eyebrow'}, '本轮成绩'),
    h('p', {class:'score'}, h('span', {class:'big'}, String(score)), ' / ' + total)
  );
  if (misses.length){
    card.append(h('h3', {class:'h3 mt4'},'答错的 ' + misses.length + ' 题'));
    misses.forEach(function(m){
      const v = VMAP[m.id];
      const given = m.given ? '　你' + (quiz.mode === 'cloze' ? '填' : '写') + '的：' + m.given : '';
      if (quiz.mode === 'cloze'){
        const c = DATA.cloze.filter(function(x){ return x.id === m.id; })[0];
        card.append(h('div', {class:'miss'},
          h('p', {class:'miss-s'}, c.before, h('mark', {class:'vw'}, c.ans), c.after),
          h('p', {class:'meta'}, v.expr + '　' + v.zh + given)
        ));
      } else if (quiz.mode === 'zh'){
        card.append(h('div', {class:'miss'},
          h('p', {class:'miss-s'}, v.zh),
          h('p', {class:'meta'}, '参考答案：' + v.expr + given)
        ));
      } else {
        const x = v.ex[m.k];
        card.append(h('div', {class:'miss'},
          h('p', {class:'miss-s'}, x.zh),
          h('p', {class:'miss-s'}, exNodes(x.en)),
          h('p', {class:'meta'}, v.expr + given)
        ));
      }
    });
  } else {
    card.append(h('p', {class:'lead'}, '全部答对。'));
  }
  const row = h('div', {class:'row'});
  if (misses.length) row.append(h('button', {type:'button', class:'btn pri', onclick:function(){ startQuiz('all', misses.map(function(m){ return m.id; })); }}, '重做错题'));
  row.append(h('button', {type:'button', class:'btn' + (misses.length ? '' : ' pri'), onclick:function(){ quiz.phase = 'start'; renderQuiz(); }}, '再测一轮'));
  row.append(h('button', {type:'button', class:'btn', onclick:function(){ showTab('words'); try { location.hash = 'words'; } catch(e){} }}, '去词汇表'));
  card.append(row);
  return card;
}

/* ---------- think tab ---------- */
function renderThink(){
  const box = $('#thinkBox');
  box.replaceChildren();
  const bd = DATA.breakdown;
  box.append(h('div', {class:'card mb16'},
    h('p', {class:'eyebrow'}, '长难句拆解'),
    h('p', {class:'bd mt10'}, bd.en),
    h('ul', {class:'note-list'}, bd.points.map(function(t){ return h('li', null, t); })),
    h('div', {class:'row'}, h('button', {type:'button', class:'btn sm', onclick:function(){ openSentence(bd.i); try { location.hash = 'read'; } catch(e){} }}, '在文中查看这一句'))
  ));
  const qs = h('div', {class:'card'}, h('p', {class:'eyebrow mb12'}, '读后思考'));
  DATA.questions.forEach(function(q, k){
    const key = 'q' + (k + 1);
    const ta = h('textarea', {id:'ans-' + (k + 1), rows:3, maxlength:2000, placeholder:'写下你的想法'});
    ta.value = state.ans[key] || '';
    ta.addEventListener('input', function(){ setAns(key, ta.value); });
    qs.append(h('div', {class:'qa'}, h('p', {class:'qa-q'}, (k + 1) + '. ' + q), ta));
  });
  box.append(qs);
}

/* ---------- wiring ---------- */
/* ---------- speaker icons: words, example sentences, article sentences ---------- */
const SPK_SVG = '<svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 4V5L7 9H3z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const C = {a:null, end:0, start:0, btn:null, raf:0, text:''};
function spkEl(label, onclick){
  const b = h('button', {type:'button', class:'spk', 'aria-label':label, title:label, onclick:onclick});
  b.innerHTML = SPK_SVG;
  return b;
}
function clipEnded(){
  cancelAnimationFrame(C.raf);
  if (C.btn){ C.btn.classList.remove('on'); C.btn = null; }
}
function speakFallback(text){
  try {
    if (!('speechSynthesis' in window) || !text) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-GB'; u.rate = 0.9;
    speechSynthesis.speak(u);
  } catch(e){}
}
function clipAudio(){
  if (C.a) return C.a;
  const a = new Audio();
  a.preload = 'auto';
  a.src = DATA.clips.src;
  a.addEventListener('error', function(){ const t = C.text; clipEnded(); speakFallback(t); });
  a.addEventListener('ended', clipEnded);
  a.addEventListener('pause', function(){ if (a.currentTime < C.end) clipEnded(); });
  C.a = a;
  return a;
}
function clipTick(){
  const a = C.a;
  if (!a || a.paused){ return; }
  if (a.currentTime >= C.end){ a.pause(); clipEnded(); return; }
  C.raf = requestAnimationFrame(clipTick);
}
function stopNarrationForClip(){
  if (L && L.audio && !L.audio.paused) L.audio.pause();
  if (L) L.seg = null;
}
function playClip(key, btn, text){
  const t = DATA.clips && DATA.clips.t[key];
  if (!t){ speakFallback(text); return; }
  stopNarrationForClip();
  const a = clipAudio();
  const wasOn = C.btn === btn && !a.paused;
  clipEnded();
  if (wasOn){ a.pause(); return; }
  C.btn = btn; C.text = text;
  C.start = Math.max(0, t[0] - 0.1); C.end = t[1] + 0.15;
  btn.classList.add('on');
  const go = function(){ a.currentTime = C.start; };
  if (a.readyState >= 1) go(); else a.addEventListener('loadedmetadata', go, {once:true});
  const pr = a.play();
  if (pr && pr.catch) pr.catch(function(){ clipEnded(); });
  cancelAnimationFrame(C.raf);
  C.raf = requestAnimationFrame(clipTick);
}
function speakBtn(key, text){
  if (!DATA.clips) return null;
  const b = spkEl('播放发音', function(){ playClip(key, b, text); });
  return b;
}
function sentBtn(en){
  if (!DATA.audio) return null;
  const i = S.findIndex(function(s){ return s.en === en; }) >= 0 ? S.findIndex(function(s){ return s.en === en; }) : S.findIndex(function(s){ return s.en.indexOf(en) >= 0; });
  if (i < 0) return null;
  const b = spkEl('播放这一句', function(){ playArticleSentence(i, b); });
  return b;
}
function playArticleSentence(i, btn){
  const a = getAudio();
  const T = DATA.audio.t[i];
  if (C.a && !C.a.paused) C.a.pause();
  clipEnded();
  const wasOn = L.seg && L.seg.btn === btn && !a.paused;
  endSeg();
  if (wasOn){ a.pause(); return; }
  L.seg = {end:T[1] + 0.15, btn:btn};
  btn.classList.add('on');
  const go = function(){ a.currentTime = Math.max(0, T[0] - 0.1); };
  if (a.readyState >= 1) go(); else a.addEventListener('loadedmetadata', go, {once:true});
  const pr = a.play();
  if (pr && pr.catch) pr.catch(function(){ endSeg(); });
}
function endSeg(){
  if (L.seg && L.seg.btn) L.seg.btn.classList.remove('on');
  L.seg = null;
}

/* ---------- listen tab ---------- */
const L = {audio:null, cur:-1, loop:false, loopIdx:-1, drag:false, el:{}, spans:[], raf:0, seg:null};
const RATES = [0.75, 0.9, 1, 1.15, 1.3];
function fmtT(t){ t = Math.max(0, Math.floor(t)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
function sentAt(t){
  const T = DATA.audio.t;
  let k = 0;
  for (let i = 0; i < T.length; i++){ if (T[i][0] <= t + 0.05) k = i; else break; }
  return k;
}
function getAudio(){
  if (L.audio) return L.audio;
  const a = new Audio();
  a.preload = 'auto';
  a.src = DATA.audio.src;
  a.playbackRate = ui.rate || 1;
  try { a.preservesPitch = true; a.webkitPreservesPitch = true; } catch(e){}
  a.addEventListener('timeupdate', listenUpdate);
  a.addEventListener('play', function(){ listenPlayState(); loopFrames(); });
  a.addEventListener('pause', function(){ listenPlayState(); if (L.seg && a.currentTime < L.seg.end) endSeg(); });
  a.addEventListener('ended', function(){ listenPlayState(); listenUpdate(); });
  a.addEventListener('error', function(){ L.el.msg.textContent = '音频没有加载出来，请检查网络后再点播放。'; L.el.msg.hidden = false; });
  a.addEventListener('playing', function(){ L.el.msg.hidden = true; });
  L.audio = a;
  try {
    if ('mediaSession' in navigator){
      navigator.mediaSession.metadata = new MediaMetadata({title:DATA.title, artist:'外刊精读'});
      navigator.mediaSession.setActionHandler('play', function(){ a.play(); });
      navigator.mediaSession.setActionHandler('pause', function(){ a.pause(); });
      navigator.mediaSession.setActionHandler('seekbackward', function(){ a.currentTime = Math.max(0, a.currentTime - 5); });
      navigator.mediaSession.setActionHandler('seekforward', function(){ a.currentTime = Math.min(DATA.audio.dur, a.currentTime + 5); });
    }
  } catch(e){}
  return a;
}
function listenPlayState(){
  const playing = !!(L.audio && !L.audio.paused && !L.audio.ended);
  L.el.play.textContent = playing ? '暂停' : '播放';
  L.el.play.setAttribute('aria-pressed', String(playing));
}
function loopFrames(){
  cancelAnimationFrame(L.raf);
  const tick = function(){
    if (!L.audio || L.audio.paused) return;
    listenUpdate();
    L.raf = requestAnimationFrame(tick);
  };
  L.raf = requestAnimationFrame(tick);
}
function listenUpdate(){
  const a = L.audio;
  if (!a) return;
  const T = DATA.audio.t;
  let t = a.currentTime;
  if (L.seg && !a.paused && t >= L.seg.end){ a.pause(); endSeg(); }
  if (L.loop && L.loopIdx >= 0 && !L.seg && !a.paused && t >= T[L.loopIdx][1] + 0.2){ a.currentTime = T[L.loopIdx][0]; t = a.currentTime; }
  if (!L.drag) L.el.range.value = String(t);
  L.el.now.textContent = fmtT(t);
  const k = sentAt(t);
  if (k !== L.cur){
    L.cur = k;
    markListenSentence(!a.paused);
  }
}
function markListenSentence(follow){
  L.spans.forEach(function(sp){ sp.classList.toggle('on', Number(sp.dataset.i) === L.cur); });
  if (follow && ui.tx){
    const sp = L.spans[L.cur];
    if (sp) sp.scrollIntoView({block:'nearest', behavior:REDUCE ? 'auto' : 'smooth'});
  }
}
function playSentence(i){
  endSeg();
  if (C.a) C.a.pause();
  const a = getAudio();
  a.currentTime = DATA.audio.t[i][0];
  if (L.loop) L.loopIdx = i;
  a.play().catch(function(){});
  listenUpdate();
}
function seekBy(d){
  endSeg();
  const a = getAudio();
  a.currentTime = Math.min(DATA.audio.dur, Math.max(0, a.currentTime + d));
  listenUpdate();
}
function setRate(r){
  ui.rate = r; lsSet(LS_UI, ui);
  if (L.audio) L.audio.playbackRate = r;
  $$('.rate-b', L.el.box).forEach(function(b){ const on = Number(b.dataset.r) === r; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
}
function applyTextVisibility(){
  L.el.tr.hidden = !ui.tx;
  L.el.off.hidden = !!ui.tx;
}
function renderListenText(){
  if (!L.el.tr) return;
  L.el.tr.replaceChildren();
  BLOCKS.forEach(function(b){
    const sec = h('section', {class:'blk blk-' + b.type});
    const el = h(b.type === 'title' ? 'h2' : 'p', {class:b.type === 'title' ? 'a-title' : b.type === 'sub' ? 'a-deck' : 'a-para'});
    b.idx.forEach(function(i, k){
      if (k > 0) el.append(' ');
      const sp = h('span', {class:'ls', 'data-i':i, tabindex:0, role:'button', 'aria-label':'从这一句开始播放'}, marked(S[i].en));
      sp.addEventListener('click', function(){ playSentence(i); });
      sp.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); playSentence(i); } });
      el.append(sp);
    });
    sec.append(el);
    L.el.tr.append(sec);
  });
  L.spans = $$('.ls', L.el.tr);
  markListenSentence(false);
}
function renderListen(){
  const box = $('#listenBox');
  if (!DATA.audio || !box || L.el.box) return;
  L.el.box = box;
  const A = DATA.audio;
  L.el.play = h('button', {type:'button', class:'btn pri big', 'aria-pressed':'false', onclick:function(){
    endSeg();
    if (C.a) C.a.pause();
    const a = getAudio();
    if (a.paused || a.ended){ if (a.ended) a.currentTime = 0; a.play().catch(function(){}); } else a.pause();
  }}, '播放');
  L.el.range = h('input', {type:'range', class:'lp-range', min:0, max:A.dur, step:0.1, value:0, 'aria-label':'播放进度'});
  L.el.range.addEventListener('pointerdown', function(){ L.drag = true; });
  L.el.range.addEventListener('input', function(){
    const a = getAudio();
    a.currentTime = Number(L.el.range.value);
    L.el.now.textContent = fmtT(a.currentTime);
    const k = sentAt(a.currentTime);
    if (k !== L.cur){ L.cur = k; markListenSentence(false); }
  });
  const endDrag = function(){ L.drag = false; };
  L.el.range.addEventListener('change', endDrag);
  L.el.range.addEventListener('pointerup', endDrag);
  L.el.range.addEventListener('pointercancel', endDrag);
  L.el.now = h('span', null, '0:00');
  L.el.msg = h('p', {class:'lp-msg', hidden:true, role:'alert'});
  const rates = h('div', {class:'chips', role:'group', 'aria-label':'播放速度'});
  RATES.forEach(function(r){
    rates.append(h('button', {type:'button', class:'chip rate-b', 'data-r':r, 'aria-pressed':'false', onclick:function(){ setRate(r); }}, r + '×'));
  });
  const loopCb = h('input', {type:'checkbox'});
  loopCb.addEventListener('change', function(){
    L.loop = loopCb.checked;
    L.loopIdx = L.loop ? (L.cur >= 0 ? L.cur : 0) : -1;
  });
  const txCb = h('input', {type:'checkbox'});
  txCb.checked = !!ui.tx;
  txCb.addEventListener('change', function(){ ui.tx = txCb.checked; lsSet(LS_UI, ui); applyTextVisibility(); });
  L.el.tr = h('div', {class:'tr'});
  L.el.off = h('p', {class:'tr-off'}, '原文已隐藏。先盲听一遍，听完再勾选“显示原文”对照。');
  box.append(
    h('div', {class:'card lp'},
      h('h2', {class:'h2'}, '听力'),
      h('p', {class:'lead'}, '整篇文章的朗读（AI 合成的英式发音，语速略慢）。先盲听，再对照原文；点原文里的任意一句，就从那一句开始播放。'),
      h('div', {class:'lp-row'},
        h('button', {type:'button', class:'btn', onclick:function(){ seekBy(-5); }}, '后退 5 秒'),
        L.el.play,
        h('button', {type:'button', class:'btn', onclick:function(){ seekBy(5); }}, '前进 5 秒')
      ),
      h('div', null, L.el.range, h('div', {class:'lp-time'}, L.el.now, h('span', null, fmtT(A.dur)))),
      h('div', null, h('p', {class:'meta'}, '播放速度'), h('div', {class:'row'}, rates)),
      h('div', {class:'lp-row'},
        h('label', {class:'lp-opt'}, loopCb, '单句循环（当前这一句反复听）'),
        h('label', {class:'lp-opt'}, txCb, '显示原文')
      ),
      L.el.msg
    ),
    L.el.off,
    L.el.tr
  );
  setRate(ui.rate || 1);
  renderListenText();
  applyTextVisibility();
}
function renderAll(){
  renderMast();
  renderArticle();
  renderListen();
  renderWords();
  renderThink();
  if (quiz.phase === 'start') renderQuiz();
}
function init(){
  $('#optZh').checked = !!ui.zh;
  $('#optHi').checked = !!ui.hi;
  $('#optZh').addEventListener('change', function(){ ui.zh = this.checked; lsSet(LS_UI, ui); $('#article').classList.toggle('show-zh', ui.zh); });
  $('#optHi').addEventListener('change', function(){ ui.hi = this.checked; lsSet(LS_UI, ui); renderArticle(); renderListenText(); });
  const chips = $('#chips');
  ['all','new','learning','mastered'].forEach(function(f){
    chips.append(h('button', {type:'button', class:'chip', 'data-f':f, onclick:function(){ vFilter = f; renderWords(); }}, f));
  });
  $('#wordSearch').addEventListener('input', function(){ vQuery = this.value; renderWords(); });
  $$('.tab').forEach(function(b){
    b.addEventListener('click', function(){ try { location.hash = b.dataset.tab; } catch(e){} showTab(b.dataset.tab); });
  });
  window.addEventListener('hashchange', function(){ showTab(location.hash.replace('#','')); });
  if (DATA.audio) $('.tab[data-tab="listen"]').hidden = false;
  renderAll();
  showTab(location.hash.replace('#','') || 'read');
  initCloud();
}
init();
})();
</script>
